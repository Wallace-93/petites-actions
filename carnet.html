<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --encre:#12212B;--encre-2:#43555F;--encre-3:#7A8A93;
  --papier:#FCFBF8;--papier-2:#EFF0EA;--trait:#DCDDD3;
  --pin:#1E4B3C;--pin-clair:#E7EFEA;
  --laiton:#B8862F;--laiton-clair:#F6EFE0;
  --brique:#A24332;--brique-clair:#F8EDEA;
  --display:'Newsreader',Georgia,serif;
  --texte:'Karla',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
body{font-family:var(--texte);background:var(--papier);color:var(--encre-2);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;}
a{color:inherit;}
:focus-visible{outline:2px solid var(--pin);outline-offset:3px;border-radius:3px;}

.nav{border-bottom:1px solid var(--trait);background:var(--papier);position:sticky;top:0;z-index:20;}
.nav-in{max-width:940px;margin:0 auto;padding:15px 24px;display:flex;align-items:center;gap:18px;}
.nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
.nav-mark{width:28px;height:28px;border-radius:7px;background:var(--pin);display:grid;place-items:center;flex:none;}
.nav-mark svg{width:15px;height:15px;}
.nav-name{font-family:var(--display);font-size:19px;font-weight:600;color:var(--encre);letter-spacing:-.02em;}
.nav-name em{font-style:normal;color:var(--laiton);}
.nav-right{margin-left:auto;display:flex;gap:16px;align-items:center;}
.nav-right a{text-decoration:none;font-size:14.5px;font-weight:600;color:var(--encre);}

.wrap{max-width:940px;margin:0 auto;padding:44px 24px 80px;}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--laiton);display:flex;align-items:center;gap:9px;margin-bottom:16px;}
.eyebrow::before{content:"";width:22px;height:1px;background:var(--laiton);}
h1{font-family:var(--display);font-weight:500;font-size:clamp(30px,4.2vw,44px);color:var(--encre);letter-spacing:-.018em;line-height:1.14;margin-bottom:12px;}
h2{font-family:var(--display);font-weight:500;font-size:26px;color:var(--encre);letter-spacing:-.015em;margin-bottom:8px;}
.sous{font-size:17px;max-width:62ch;margin-bottom:34px;}
.bloc{margin-bottom:48px;}
.bloc-sous{font-size:15px;color:var(--encre-3);max-width:64ch;margin-bottom:22px;}

/* La carte */
.carte{background:var(--papier);border:1px solid var(--trait);border-radius:14px;padding:22px 20px 16px;
  box-shadow:0 1px 2px rgba(18,33,43,.04),0 14px 38px -28px rgba(18,33,43,.3);}
.carte svg{width:100%;height:auto;display:block;}
.legende{display:flex;flex-wrap:wrap;gap:10px 24px;padding-top:16px;margin-top:6px;border-top:1px solid var(--trait);
  font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:var(--encre-3);}
.legende span{display:flex;align-items:center;gap:8px;}
.pastille{width:11px;height:11px;border-radius:50%;flex:none;}
.pastille.savoir{background:var(--pin);}
.pastille.seance{background:var(--laiton);}
.pastille.ecart{background:var(--brique-clair);border:1px solid #E8C4BC;border-radius:2px;}

/* Chiffres */
.bilan{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--trait);border:1px solid var(--trait);border-radius:12px;overflow:hidden;margin-top:22px;}
.bilan-case{background:var(--papier);padding:20px 20px 22px;}
.bilan-n{font-family:var(--display);font-size:32px;font-weight:500;color:var(--encre);line-height:1;}
.bilan-n.or{color:var(--laiton);}
.bilan-l{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--encre-3);margin-top:9px;}
@media(max-width:640px){.bilan{grid-template-columns:1fr;}}

/* Étapes des formations */
.etapes{display:grid;gap:1px;background:var(--trait);border:1px solid var(--trait);border-radius:12px;overflow:hidden;}
.etape{background:var(--papier);display:grid;grid-template-columns:30px 1fr 132px 56px;gap:15px;align-items:center;padding:15px 18px;}
.etape-pion{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--trait);display:grid;place-items:center;
  font-family:var(--mono);font-size:10.5px;color:var(--encre-3);background:var(--papier-2);}
.etape.encours .etape-pion{background:var(--pin);border-color:var(--pin);color:#fff;}
.etape.finie .etape-pion{background:var(--laiton);border-color:var(--laiton);color:#fff;}
.etape-nom{font-family:var(--display);font-size:16.5px;font-weight:600;color:var(--encre);line-height:1.25;}
.etape-nom a{text-decoration:none;}
.etape-nom a:hover{border-bottom:1px solid var(--laiton);}
.jauge{height:7px;border-radius:4px;background:var(--papier-2);overflow:hidden;}
.jauge span{display:block;height:100%;border-radius:4px;background:var(--pin);transition:width .6s cubic-bezier(.4,0,.2,1);}
.etape.finie .jauge span{background:var(--laiton);}
.etape-part{font-family:var(--mono);font-size:11.5px;color:var(--encre-3);text-align:right;}
@media(max-width:700px){
  .etape{grid-template-columns:26px 1fr 52px;gap:12px;}
  .jauge{grid-column:2 / span 2;margin-top:2px;}
}

/* Notions */
.notions{display:flex;flex-wrap:wrap;gap:8px;}
.notion{background:var(--pin-clair);border:1px solid #BFD6C9;border-radius:100px;padding:6px 14px;font-size:13.5px;color:var(--pin);}
.notions-groupe{margin-bottom:22px;}
.notions-titre{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--encre-3);margin-bottom:10px;}

/* Jalons */
.jalons{position:relative;padding-left:34px;}
.jalons::before{content:"";position:absolute;left:10px;top:8px;bottom:8px;width:1px;background:var(--trait);}
.jalon{position:relative;padding-bottom:22px;}
.jalon:last-child{padding-bottom:0;}
.jalon-point{position:absolute;left:-34px;top:3px;width:21px;height:21px;border-radius:50%;display:grid;place-items:center;
  background:var(--papier-2);border:1px solid var(--trait);}
.jalon-point svg{width:11px;height:11px;}
.jalon.seance .jalon-point{background:var(--laiton);border-color:var(--laiton);}
.jalon.formation .jalon-point{background:var(--pin);border-color:var(--pin);}
.jalon-titre{font-family:var(--display);font-size:16.5px;font-weight:600;color:var(--encre);}
.jalon-date{font-family:var(--mono);font-size:11.5px;color:var(--encre-3);margin-top:3px;}
.jalon-note{font-size:14.5px;margin-top:5px;}

.vide{text-align:center;padding:56px 24px;border:1px dashed var(--trait);border-radius:12px;}
.vide-t{font-family:var(--display);font-size:21px;color:var(--encre);margin-bottom:9px;}
.vide p{font-size:15px;max-width:48ch;margin:0 auto 22px;}
.btn-primary{display:inline-block;text-decoration:none;background:var(--pin);color:#fff;font-size:15px;font-weight:600;padding:13px 24px;border-radius:8px;}
.btn-ghost{display:inline-block;text-decoration:none;color:var(--encre);border:1px solid var(--trait);background:var(--papier);font-size:14.5px;font-weight:600;padding:11px 18px;border-radius:8px;cursor:pointer;font-family:var(--texte);}
.actions-bas{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;padding-top:26px;border-top:1px solid var(--trait);}
.err{background:var(--brique-clair);border-left:3px solid var(--brique);border-radius:0 9px 9px 0;padding:16px 18px;font-size:14.5px;margin-bottom:22px;}

@media print{
  .nav,.actions-bas,.no-print{display:none !important;}
  body{background:#fff;font-size:11pt;}
  .wrap{padding:0;max-width:none;}
  .carte,.etape,.jalon,.bilan{break-inside:avoid;}
  .bloc{break-inside:avoid-page;}
}
.impression-entete{display:none;}
@media print{
  .impression-entete{display:block;margin-bottom:22px;padding-bottom:13px;border-bottom:2px solid var(--encre);}
  .impression-entete .marque{font-family:var(--display);font-size:19px;font-weight:600;color:var(--encre);}
  .impression-entete .mention{font-family:var(--mono);font-size:9pt;color:var(--encre-3);margin-top:5px;}
}
@media(prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important;}}

/* Les bornes plantées : les formations achevées, consultables à nouveau. */
.bornes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;}
.borne-c{background:var(--papier);border:1px solid var(--trait);border-radius:12px;padding:18px 18px 20px;
  cursor:pointer;text-align:left;font-family:var(--texte);transition:border-color .18s,transform .18s;}
.borne-c:hover{border-color:var(--laiton);transform:translateY(-2px);}
.borne-num{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--laiton);margin-bottom:10px;}
.borne-nom{font-family:var(--display);font-size:16px;font-weight:600;color:var(--encre);line-height:1.28;}
.borne-meta{font-family:var(--mono);font-size:10.5px;color:var(--encre-3);margin-top:9px;}
</style>
</head>

  <div class="nav-in">

<div class="wrap" id="app">
  <div class="vide"><div class="vide-t">Chargement…</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://pchkshpbzsybvtwxqvrf.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBjaGtzaHBienN5YnZ0d3hxdnJmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5NDgwMTAsImV4cCI6MjEwMTUyNDAxMH0.3EqyBUDmHHJ79mdDD6dmpVwsuEA0h2hF-75Up9R2Snc';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* Le catalogue sert de dénominateur : sans lui, impossible de dire
   quelle part du chemin a été parcourue. */
const FORMATIONS = [
  { cle:'monnaie',     nom:'Comprendre la monnaie',   lecons:14, page:'lecons-monnaie.html' },
  { cle:'psychologie', nom:"Psychologie de l'argent", lecons:12, page:'lecons-psychologie.html' },
  { cle:'budget',      nom:'Maîtriser son budget',    lecons:16, page:'lecons-budget.html' },
  { cle:'bourse',      nom:'Premiers pas en bourse',  lecons:24, page:'lecons-bourse.html' },
  { cle:'crypto',      nom:'Bitcoin & cryptomonnaies',lecons:18, page:'lecons-crypto.html' },
  { cle:'immobilier',  nom:'Investir dans la pierre', lecons:17, page:'lecons-immobilier.html' },
  { cle:'epargne',     nom:'Épargne & sécurité',      lecons:11, page:'lecons-epargne.html' },
  { cle:'fiscalite',   nom:'Optimisation fiscale',    lecons:20, page:'lecons-fiscalite.html' }
];
const TOTAL_LECONS = FORMATIONS.reduce(function(s,f){ return s + f.lecons; }, 0);

/* Une séance fait gagner autant qu'un bloc de leçons : c'est le sens
   même de l'accompagnement, et ça se voit sur la courbe. */
const POIDS_SEANCE = 6;

let PROGRESSION = [], NOTIONS = [], SEANCES = [], PRENOM = '';

function echapper(t){
  const d = document.createElement('div');
  d.textContent = t == null ? '' : String(t);
  return d.innerHTML;
}
function dateCourte(iso){
  return new Date(iso).toLocaleDateString('fr-FR', { day:'2-digit', month:'short', year:'numeric' });
}

/* ---------- Le niveau atteint ----------
   Volontairement plafonné à 88 : personne ne referme complètement
   l'écart, et prétendre le contraire serait le premier mensonge du
   site. Les douze pour cent restants, c'est l'expérience. */
function niveauApres(lecons, seances){
  const partLecons = (lecons / TOTAL_LECONS) * 62;
  const partSeances = Math.min(seances * POIDS_SEANCE, 26);
  return Math.min(88, partLecons + partSeances);
}

/* Chronologie des événements : chaque leçon terminée, chaque séance. */
function chronologie(){
  const ev = [];
  PROGRESSION.forEach(function(p){
    if(p.completed && p.completed_at) ev.push({ t:new Date(p.completed_at).getTime(), type:'lecon' });
  });
  SEANCES.forEach(function(s){
    ev.push({ t:new Date(s.tenue_le).getTime(), type:'seance', titre:s.titre });
  });
  ev.sort(function(a,b){ return a.t - b.t; });

  let lecons = 0, seances = 0;
  ev.forEach(function(e){
    if(e.type === 'lecon') lecons++; else seances++;
    e.niveau = niveauApres(lecons, seances);
  });
  return ev;
}

/* ---------- La carte ---------- */
function dessinerCarte(ev){
  const L = 900, H = 380;
  const gX = 60, dX = 26, hY = 54, bY = 300;
  const yPour = function(n){ return bY - (n / 100) * (bY - hY); };

  const n = ev.length;
  const xPour = function(i){ return n < 2 ? gX : gX + (i / (n - 1)) * (L - gX - dX); };

  let points = [[gX, yPour(0)]];
  if(n === 1){
    points = [[gX, yPour(0)], [L - dX, yPour(ev[0].niveau)]];
  } else if(n > 1){
    points = ev.map(function(e,i){ return [xPour(i), yPour(e.niveau)]; });
    points.unshift([gX, yPour(0)]);
  }

  const ligne = points.map(function(p,i){ return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
  const zoneEcart = ligne + ' L' + (L - dX) + ' ' + hY + ' L' + gX + ' ' + hY + ' Z';

  /* Marqueurs de séances, posés sur la courbe */
  const marqueurs = ev.map(function(e,i){
    if(e.type !== 'seance') return '';
    const x = n === 1 ? (L - dX) : xPour(i);
    const y = yPour(e.niveau);
    return '<g><line x1="' + x.toFixed(1) + '" y1="' + y.toFixed(1) + '" x2="' + x.toFixed(1) + '" y2="' + (y - 26).toFixed(1) + '" stroke="#B8862F" stroke-width="1.2"/>' +
      '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="6" fill="#B8862F"/>' +
      '<path d="M' + x.toFixed(1) + ' ' + (y - 26).toFixed(1) + ' h20 l-5 6 5 6 h-20 z" fill="#F6EFE0" stroke="#B8862F" stroke-width="1"/></g>';
  }).join('');

  const dernier = points[points.length - 1];
  const niveauFinal = n ? ev[n-1].niveau : 0;

  return '<div class="carte">' +
  '<svg viewBox="0 0 ' + L + ' ' + H + '" role="img" aria-label="Carte du chemin parcouru">' +
    '<defs>' +
      '<pattern id="hachures" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">' +
        '<line x1="0" y1="0" x2="0" y2="7" stroke="#E8C4BC" stroke-width="2.4"/></pattern>' +
    '</defs>' +

    /* l'écart, hachuré, qui se referme */
    '<path d="' + zoneEcart + '" fill="url(#hachures)" opacity=".55"/>' +

    /* la ligne haute : ce que sait celui d'en face */
    '<line x1="' + gX + '" y1="' + hY + '" x2="' + (L - dX) + '" y2="' + hY + '" stroke="#12212B" stroke-width="1.4" stroke-dasharray="6 5"/>' +
    '<text x="' + gX + '" y="' + (hY - 14) + '" font-family="IBM Plex Mono, monospace" font-size="12.5" fill="#12212B" letter-spacing="1.4">CE QUE SAIT CELUI QUI VEND</text>' +

    /* le sol */
    '<line x1="' + gX + '" y1="' + bY + '" x2="' + (L - dX) + '" y2="' + bY + '" stroke="#DCDDD3" stroke-width="1"/>' +
    '<text x="' + gX + '" y="' + (bY + 24) + '" font-family="IBM Plex Mono, monospace" font-size="12" fill="#7A8A93" letter-spacing="1.2">TON POINT DE DÉPART</text>' +

    /* la courbe : ton savoir */
    '<path d="' + ligne + '" fill="none" stroke="#1E4B3C" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>' +
    '<circle cx="' + dernier[0].toFixed(1) + '" cy="' + dernier[1].toFixed(1) + '" r="7" fill="#1E4B3C"/>' +
    '<circle cx="' + dernier[0].toFixed(1) + '" cy="' + dernier[1].toFixed(1) + '" r="13" fill="none" stroke="#1E4B3C" stroke-width="1" opacity=".35"/>' +

    marqueurs +

    /* mesure de l'écart restant */
    '<line x1="' + (L - dX - 4) + '" y1="' + hY + '" x2="' + (L - dX - 4) + '" y2="' + dernier[1].toFixed(1) + '" stroke="#A24332" stroke-width="1"/>' +
    '<text x="' + (L - dX - 12) + '" y="' + ((hY + dernier[1]) / 2).toFixed(1) + '" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="12.5" fill="#A24332">écart : ' + Math.round(100 - niveauFinal) + '%</text>' +
  '</svg>' +

  '<div class="legende">' +
    '<span><i class="pastille savoir"></i>Ce que tu sais maintenant</span>' +
    '<span><i class="pastille seance"></i>Séance d\'accompagnement</span>' +
    '<span><i class="pastille ecart"></i>L\'écart qu\'il reste à combler</span>' +
  '</div></div>';
}


/* Les formations achevées deviennent des bornes, que l'on peut rouvrir. */
function blocBornes(){
  const parFormation = {};
  PROGRESSION.forEach(function(p){
    if(!p.completed) return;
    parFormation[p.formation] = (parFormation[p.formation] || 0) + 1;
  });

  const finies = FORMATIONS.filter(function(f){
    return (parFormation[f.cle] || 0) >= f.lecons;
  });
  if(!finies.length) return '';

  const cartes = finies.map(function(f){
    return '<button class="borne-c" onclick="ouvrirCarte(\'' + f.cle + '\', ' + f.lecons +
      ', ' + JSON.stringify(PRENOM) + ', ' + semainesDepuisDebut() + ')">' +
      '<div class="borne-num">Étape franchie</div>' +
      '<div class="borne-nom">' + echapper(f.nom) + '</div>' +
      '<div class="borne-meta">' + f.lecons + ' leçons · ' + f.lecons + ' actions</div>' +
    '</button>';
  }).join('');

  return '<div class="bloc bornes-plantees"><h2>Les bornes que tu as plantées</h2>' +
    '<p class="bloc-sous">Une par formation achevée. Clique pour rouvrir la carte et l\'enregistrer.</p>' +
    '<div class="bornes">' + cartes + '</div></div>';
}

function rendre(){
  const app = document.getElementById('app');
  const ev = chronologie();
  const leconsFaites = PROGRESSION.filter(function(p){ return p.completed; }).length;

  if(leconsFaites === 0 && SEANCES.length === 0){
    app.innerHTML =
      '<div class="eyebrow">Mon carnet de route</div>' +
      '<h1>Ta carte est encore vierge.</h1>' +
      '<p class="sous">Elle se dessinera toute seule. Chaque leçon terminée et chaque séance d\'accompagnement rapprochent ta ligne de celle d\'en face, celle de ceux qui savaient déjà.</p>' +
      '<div class="vide">' +
        '<div class="vide-t">Le premier trait se trace en cinq minutes</div>' +
        '<p>Une leçon, une vérification, une chose à faire ce soir.</p>' +
        '<a href="lecons-monnaie.html" class="btn-primary">Ouvrir la première leçon</a>' +
      '</div>';
    return;
  }

  const niveau = ev.length ? ev[ev.length - 1].niveau : 0;
  const ecart = Math.round(100 - niveau);

  /* Progression par formation */
  const parFormation = {};
  PROGRESSION.forEach(function(p){
    if(!p.completed) return;
    parFormation[p.formation] = (parFormation[p.formation] || 0) + 1;
  });

  const etapes = FORMATIONS.map(function(f){
    const faites = Math.min(parFormation[f.cle] || 0, f.lecons);
    const pct = Math.round(faites / f.lecons * 100);
    const classe = pct >= 100 ? 'finie' : (faites > 0 ? 'encours' : '');
    const pion = pct >= 100
      ? '<svg viewBox="0 0 24 24" fill="none"><path d="M5 12L10 17L19 7" stroke="white" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
      : String(FORMATIONS.indexOf(f));
    return '<div class="etape ' + classe + '">' +
      '<span class="etape-pion">' + pion + '</span>' +
      '<div class="etape-nom"><a href="' + f.page + '">' + echapper(f.nom) + '</a></div>' +
      '<div class="jauge"><span style="width:' + Math.max(pct, 2) + '%"></span></div>' +
      '<div class="etape-part">' + faites + '/' + f.lecons + '</div>' +
    '</div>';
  }).join('');

  /* Notions assimilées, groupées par formation */
  const notionsParFormation = {};
  NOTIONS.forEach(function(n){
    (notionsParFormation[n.formation] = notionsParFormation[n.formation] || []).push(n);
  });
  const blocsNotions = FORMATIONS.filter(function(f){ return notionsParFormation[f.cle]; }).map(function(f){
    const liste = notionsParFormation[f.cle]
      .sort(function(a,b){ return a.lesson_number - b.lesson_number; })
      .map(function(n){ return '<span class="notion">' + echapper(n.titre) + '</span>'; }).join('');
    return '<div class="notions-groupe"><div class="notions-titre">' + echapper(f.nom) + '</div>' +
      '<div class="notions">' + liste + '</div></div>';
  }).join('');

  /* Jalons : formations achevées et séances tenues */
  const jalons = [];
  FORMATIONS.forEach(function(f){
    const faites = parFormation[f.cle] || 0;
    if(faites < f.lecons) return;
    const dates = PROGRESSION.filter(function(p){ return p.formation === f.cle && p.completed && p.completed_at; })
      .map(function(p){ return new Date(p.completed_at).getTime(); });
    if(!dates.length) return;
    jalons.push({ t:Math.max.apply(null, dates), classe:'formation',
      titre:'Formation terminée : ' + f.nom, note:f.lecons + ' leçons, et autant d\'actions concrètes.' });
  });
  SEANCES.forEach(function(s){
    jalons.push({ t:new Date(s.tenue_le).getTime(), classe:'seance',
      titre:s.titre || 'Séance d\'accompagnement',
      note:'Un palier : c\'est là que l\'écart se resserre le plus vite.' });
  });
  jalons.sort(function(a,b){ return b.t - a.t; });

  const blocJalons = jalons.length === 0 ? '' :
    '<div class="bloc"><h2>Les jalons franchis</h2>' +
    '<p class="bloc-sous">Ce qui a compté, dans l\'ordre.</p>' +
    '<div class="jalons">' + jalons.map(function(j){
      return '<div class="jalon ' + j.classe + '">' +
        '<span class="jalon-point"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12L10 17L19 7" stroke="white" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>' +
        '<div class="jalon-titre">' + echapper(j.titre) + '</div>' +
        '<div class="jalon-date">' + dateCourte(new Date(j.t).toISOString()) + '</div>' +
        '<div class="jalon-note">' + echapper(j.note) + '</div>' +
      '</div>';
    }).join('') + '</div></div>';

  app.innerHTML =
    '<div class="impression-entete">' +
      '<div class="marque">NiouDem · Carnet de route' + (PRENOM ? ' de ' + echapper(PRENOM) : '') + '</div>' +
      '<div class="mention">Document personnel. Il retrace un parcours d\'apprentissage, pas une performance financière.</div>' +
    '</div>' +

    '<div class="no-print"><div class="eyebrow">Mon carnet de route</div>' +
    '<h1>L\'écart se referme.</h1>' +
    '<p class="sous">La ligne du haut, c\'est ce que sait celui qui est en face de toi quand tu signes quelque chose. La tienne part d\'en bas. Tout l\'enjeu de NiouDem tient dans la distance entre les deux.</p></div>' +

    '<div class="bloc">' + dessinerCarte(ev) +
      '<div class="bilan">' +
        '<div class="bilan-case"><div class="bilan-n">' + leconsFaites + '</div><div class="bilan-l">Leçons terminées</div></div>' +
        '<div class="bilan-case"><div class="bilan-n or">' + SEANCES.length + '</div><div class="bilan-l">Séances d\'accompagnement</div></div>' +
        '<div class="bilan-case"><div class="bilan-n">' + ecart + '%</div><div class="bilan-l">Écart restant</div></div>' +
      '</div>' +
    '</div>' +

    '<div class="bloc"><h2>Le chemin, formation par formation</h2>' +
      '<p class="bloc-sous">Chaque pion se remplit à mesure que tu avances. Rien ne se ferme, rien n\'expire.</p>' +
      '<div class="etapes">' + etapes + '</div></div>' +

    (blocsNotions ? '<div class="bloc"><h2>Ce que tu sais désormais</h2>' +
      '<p class="bloc-sous">Chaque notion listée ici correspond à une leçon que tu as validée par le quiz, puis à une action que tu as faite dans la vraie vie.</p>' +
      blocsNotions + '</div>' : '') +

    blocBornes() +

    blocJalons +

    '<div class="actions-bas">' +
      '<button class="btn-ghost" onclick="window.print()">Imprimer ou enregistrer en PDF</button>' +
      '<a href="index.html#formations" class="btn-ghost">Continuer une formation</a>' +
      '<a href="accompagnement.html" class="btn-ghost">Passer à l\'acte, accompagné</a>' +
    '</div>';
}

(async function(){
  const app = document.getElementById('app');
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ window.location.href = 'connexion.html'; return; }

  const [profil, progression, notions, seances] = await Promise.all([
    sb.from('profiles').select('prenom').eq('id', session.user.id).maybeSingle(),
    sb.from('lesson_progress').select('formation, lesson_number, completed, completed_at'),
    sb.from('carnet').select('formation, lesson_number, titre'),
    sb.from('seances').select('type, titre, tenue_le')
  ]);

  if(progression.error){
    app.innerHTML = '<div class="err">Lecture impossible : ' + echapper(progression.error.message) + '</div>';
    return;
  }

  PRENOM = (profil.data && profil.data.prenom) ? profil.data.prenom : '';
  PROGRESSION = progression.data || [];
  NOTIONS = notions.error ? [] : (notions.data || []);
  SEANCES = seances.error ? [] : (seances.data || []);

  if(notions.error) console.warn('Table carnet absente :', notions.error.message);
  if(seances.error) console.warn('Table seances absente :', seances.error.message);

  rendre();
})();
</script>
<script src="accomplissement.js"></script>
<script src="retours.js" defer></script>
</body>
