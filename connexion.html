<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Se connecter — Petites Actions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --ink:#16181D;--ink-soft:#383B42;--ink-muted:#6B6F76;--ink-faint:#9498A0;
  --bg:#FFFFFF;--bg-soft:#F7F8FA;--bg-mid:#EEF0F3;--bg-line:#E3E6EA;
  --green:#16A34A;--green-pale:#EDFBF1;--green-bord:#BBF0CC;
  --coral:#FB6B4F;
  --sans:'Inter',system-ui,-apple-system,sans-serif;
}
body{font-family:var(--sans);background:var(--bg-soft);color:var(--ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;min-height:100vh;display:flex;flex-direction:column;}
a{color:inherit;}

.nav{position:sticky;top:0;z-index:200;background:rgba(255,255,255,.96);backdrop-filter:blur(20px);border-bottom:1px solid var(--bg-line);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;font-weight:800;font-size:15px;color:var(--ink);}
.nav-mark{width:26px;height:26px;border-radius:8px;background:var(--green);display:flex;align-items:center;justify-content:center;}
.nav-mark svg{width:14px;height:14px;}
.nav-back{font-size:13px;font-weight:600;color:var(--ink-muted);text-decoration:none;}

.wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px;}
.form-card{background:var(--bg);border:1px solid var(--bg-line);border-radius:20px;padding:36px 32px;width:100%;max-width:400px;}
.form-tag{display:inline-flex;align-items:center;gap:8px;background:var(--green-pale);border:1px solid var(--green-bord);border-radius:100px;padding:5px 13px;font-size:11.5px;font-weight:700;color:var(--green);margin-bottom:18px;}
.form-title{font-size:22px;font-weight:800;color:var(--ink);margin-bottom:6px;letter-spacing:-.02em;}
.form-sub{font-size:13px;font-weight:400;color:var(--ink-muted);margin-bottom:26px;line-height:1.5;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:7px;}
.field input{width:100%;background:var(--bg-soft);border:1.5px solid var(--bg-line);border-radius:11px;padding:12px 14px;font-family:var(--sans);font-size:14px;font-weight:500;color:var(--ink);outline:none;transition:border-color .15s;}
.field input:focus{border-color:var(--green);}
.field-err{font-size:11.5px;color:var(--coral);margin-top:5px;display:none;}
.field-err.show{display:block;}
.submit-btn{width:100%;background:var(--green);color:#fff;border:none;cursor:pointer;font-family:var(--sans);font-size:15px;font-weight:700;padding:14px;border-radius:12px;transition:background .2s;margin-bottom:14px;margin-top:6px;}
.submit-btn:hover{background:#149041;}
.submit-btn:disabled{opacity:.6;cursor:not-allowed;}
.form-note{font-size:12.5px;font-weight:400;color:var(--ink-faint);text-align:center;line-height:1.5;}
.form-note a{color:var(--green);font-weight:600;text-decoration:none;}
.form-error{background:#FFEEEA;border:1px solid #FFC4AD;border-radius:10px;padding:11px 14px;font-size:12.5px;color:var(--coral);margin-bottom:16px;display:none;}
.form-error.show{display:block;}
</style>
</head>
<body>

<nav class="nav">
  <a href="index.html" class="nav-logo">
    <span class="nav-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12L10 17L19 7" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    Petites Actions
  </a>
  <a href="index.html" class="nav-back">← Retour à l'accueil</a>
</nav>

<div class="wrap">
  <div class="form-card">
    <div class="form-tag">👋 Content de te revoir</div>
    <div class="form-title">Se connecter</div>
    <div class="form-sub">Accède à tes formations et retrouve ta progression.</div>

    <div class="form-error" id="formError">Email ou mot de passe incorrect.</div>

    <div class="field">
      <label>Email</label>
      <input type="email" id="fEmail" placeholder="toi@email.com" />
      <div class="field-err" id="eEmail">Email invalide.</div>
    </div>
    <div class="field">
      <label>Mot de passe</label>
      <input type="password" id="fPass" placeholder="Ton mot de passe" />
      <div class="field-err" id="ePass">Mot de passe requis.</div>
    </div>

    <button class="submit-btn" id="submitBtn" onclick="login()">Se connecter →</button>
    <div class="form-note" style="margin-bottom:10px;"><a href="mot-de-passe-oublie.html">Mot de passe oublié ?</a></div>
    <div class="form-note">Pas encore de compte ? <a href="inscription.html">Créer un compte gratuit</a></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://pchkshpbzsybvtwxqvrf.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBjaGtzaHBienN5YnZ0d3hxdnJmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5NDgwMTAsImV4cCI6MjEwMTUyNDAxMH0.3EqyBUDmHHJ79mdDD6dmpVwsuEA0h2hF-75Up9R2Snc';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

(async function(){
  const { data: { session } } = await sb.auth.getSession();
  if(session){
    const params = new URLSearchParams(location.search);
    window.location.href = params.get('redirect') || 'lecons-monnaie.html';
  }
})();

async function login(){
  const email = document.getElementById('fEmail').value.trim();
  const pass = document.getElementById('fPass').value;
  const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

  document.getElementById('eEmail').classList.toggle('show', !emailOk);
  document.getElementById('ePass').classList.toggle('show', !pass);
  document.getElementById('formError').classList.remove('show');
  if(!emailOk || !pass) return;

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Connexion…';

  const { error } = await sb.auth.signInWithPassword({ email: email, password: pass });

  if(error){
    btn.disabled = false;
    btn.textContent = 'Se connecter →';
    document.getElementById('formError').classList.add('show');
    return;
  }

  const params = new URLSearchParams(location.search);
  window.location.href = params.get('redirect') || 'lecons-monnaie.html';
}
</script>
</body>
</html>
