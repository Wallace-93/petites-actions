<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --ink:#171C45;--ink-soft:#44496B;--ink-muted:#6B7094;--ink-faint:#9599B5;
  --bg:#FFFFFF;--bg-soft:#F6F7FB;--bg-mid:#F0F1F7;--bg-line:#DCDEEA;
  --green:#2B3A8F;--green-light:#3B4BA8;--green-pale:#E9EBF7;--green-bord:#C5CAEB;
  --amber:#C27C00;--amber-pale:#FDF2DA;--amber-bord:#F0D49A;
  --violet:#4D5675;--violet-pale:#EEF0F5;--violet-bord:#D5D9E6;
  --coral:#A3213D;--coral-pale:#FAEAEE;
  --sans:'Archivo',system-ui,-apple-system,sans-serif;
  --display:'Archivo',system-ui,sans-serif;
  --mono:'Archivo',system-ui,sans-serif;
}
body{font-family:var(--sans);background:var(--bg-soft);color:var(--ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;}
a{color:inherit;}
.nav{position:sticky;top:0;z-index:200;background:rgba(255,255,255,.96);backdrop-filter:blur(20px);border-bottom:1px solid var(--bg-line);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;font-weight:800;font-size:15px;color:var(--ink);}
.nav-mark{width:26px;height:26px;border-radius:8px;background:var(--green);display:flex;align-items:center;justify-content:center;}
.nav-mark svg{width:14px;height:14px;}
.nav-back{font-size:13px;font-weight:600;color:var(--ink-muted);text-decoration:none;}
.nav-progress-pill{font-size:12px;font-weight:700;color:var(--green);background:var(--green-pale);padding:5px 12px;border-radius:100px;}
.layout{display:grid;grid-template-columns:280px 1fr;max-width:1100px;margin:0 auto;min-height:calc(100vh - 60px);}
.sidebar{border-right:1px solid var(--bg-line);background:var(--bg);padding:24px 16px;position:sticky;top:60px;align-self:start;height:calc(100vh - 60px);overflow-y:auto;}
.sb-progress-bar{height:6px;background:var(--bg-mid);border-radius:100px;overflow:hidden;margin:0 10px 18px;}
.sb-progress-fill{height:100%;background:var(--green);border-radius:100px;transition:width .3s;}
.sb-item{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:10px;cursor:pointer;margin-bottom:2px;font-size:13px;font-weight:600;color:var(--ink-muted);transition:background .15s;}
.sb-item:hover{background:var(--bg-soft);}
.sb-item.active{background:var(--green-pale);color:var(--green);}
.sb-item.done{color:var(--ink);}
.sb-item.locked{opacity:.45;cursor:not-allowed;}
.sb-item.locked:hover{background:transparent;}
.sb-check{width:20px;height:20px;border-radius:50%;background:var(--bg-mid);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink-faint);flex-shrink:0;}
.sb-item.done .sb-check{background:var(--green);color:#fff;}
.sb-item.active .sb-check{background:var(--green);color:#fff;}
.sb-module-label{font-size:13.5px;font-weight:700;color:var(--ink-faint);text-transform:none;letter-spacing:0;padding:14px 10px 6px;}
.main{padding:36px 40px 80px;max-width:720px;}
.lesson-eyebrow{font-size:13.5px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--green);margin-bottom:10px;}
.lesson-title{font-size:28px;font-weight:800;letter-spacing:-.03em;color:var(--ink);margin-bottom:8px;line-height:1.15;}
.lesson-meta{font-size:13px;color:var(--ink-faint);margin-bottom:32px;}
.section-label{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:800;letter-spacing:0;text-transform:none;color:var(--ink-muted);margin:36px 0 16px;}
.section-label .dot{width:6px;height:6px;border-radius:50%;background:var(--green);}
.section-label.quiz .dot{background:var(--violet);}
.section-label.action .dot{background:var(--amber);}
.script-text p{font-size:15.5px;font-weight:400;color:var(--ink-soft);line-height:1.75;margin-bottom:18px;}
.quiz-card{background:var(--bg);border:1px solid var(--bg-line);border-radius:16px;padding:24px;margin-bottom:14px;}
.quiz-q{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:16px;line-height:1.5;}
.quiz-opt{display:flex;align-items:flex-start;gap:12px;padding:13px 15px;border:1.5px solid var(--bg-line);border-radius:11px;margin-bottom:9px;cursor:pointer;transition:border-color .15s,background .15s;}
.quiz-opt:hover{border-color:var(--ink-faint);}
.quiz-opt.correct{border-color:var(--green);background:var(--green-pale);}
.quiz-opt.wrong{border-color:var(--coral);background:var(--coral-pale);}
.quiz-opt.disabled{cursor:default;pointer-events:none;}
.quiz-letter{width:24px;height:24px;border-radius:7px;background:var(--bg-soft);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--ink-muted);flex-shrink:0;}
.quiz-opt.correct .quiz-letter{background:var(--green);color:#fff;}
.quiz-opt.wrong .quiz-letter{background:var(--coral);color:#fff;}
.quiz-opt-text{font-size:13.5px;font-weight:500;color:var(--ink);padding-top:2px;}
.quiz-explain{display:none;font-size:13px;font-weight:400;color:var(--ink-muted);line-height:1.6;background:var(--bg-soft);border-radius:10px;padding:14px 16px;margin-top:8px;}
.quiz-explain.show{display:block;}
.quiz-explain strong{color:var(--ink);}
.action-card{background:var(--amber-pale);border:1px solid var(--amber-bord);border-radius:16px;padding:22px 24px;}
.action-text{font-size:14.5px;font-weight:500;color:var(--ink);line-height:1.65;margin-bottom:16px;}
.action-check{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;}
.action-box{width:22px;height:22px;border-radius:7px;border:2px solid var(--amber);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;transition:background .15s;}
.action-box.checked{background:var(--amber);}
.action-label{font-size:13px;font-weight:700;color:#8a6a00;}
.lesson-nav{display:flex;justify-content:space-between;align-items:center;margin-top:40px;padding-top:24px;border-top:1px solid var(--bg-line);}
.nav-btn{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border:none;cursor:pointer;font-family:var(--sans);font-size:14px;font-weight:700;padding:13px 24px;border-radius:11px;text-decoration:none;transition:background .2s;}
.nav-btn:hover{background:var(--ink-soft);}
.nav-btn.ghost{background:var(--bg-mid);color:var(--ink-muted);}
.nav-btn.ghost:hover{background:var(--bg-line);}
.completion-badge{display:none;align-items:center;gap:8px;background:var(--green-pale);color:var(--green);font-size:12.5px;font-weight:700;padding:8px 16px;border-radius:100px;margin-bottom:20px;}
.completion-badge.show{display:inline-flex;}
@media(max-width:860px){
  .layout{grid-template-columns:1fr;}
  .sidebar{position:static;height:auto;border-right:none;border-bottom:1px solid var(--bg-line);}
  .main{padding:28px 20px 60px;}
}

/* ===== Direction Encre & Laiton — surcouche typographique ===== */
body{font-family:var(--sans);letter-spacing:0;}
h1,h2,h3,h4,.hero-h1,.s-title,.cta-h2,.p-name,.mod-title,.c-title,.hc-title,
.lecon-title,.q-title,.auth-title,.perf-title,.section-title,.edu-title,.tips-title{
  font-family:var(--display);letter-spacing:-.015em;
}
.hero-h1,.s-title,.cta-h2,.auth-title{font-weight:500;letter-spacing:-.018em;line-height:1.16;}
h3,h4,.p-name,.mod-title,.c-title,.hc-title,.lecon-title{font-weight:600;}
.s-tag,.f-copy,.hstat-label,.stat-label,.perf-note,.order-meta,.pos-value,
.price-cell,.asset-label,.badge,.eyebrow,.nav-balance{font-family:var(--mono);}

.nav-name em,.ft-name em{font-style:normal;color:var(--amber);}

/* Mise en valeur dans le corps des lecons : le gras porte la notion a
   retenir, l italique la nuance ou le terme technique. */
.script-text strong{color:var(--ink,#171C45);font-weight:700;}
.script-text em{font-style:italic;color:var(--ink-soft,#44496B);}
.script-text u{text-decoration:none;background:linear-gradient(transparent 62%,var(--amber-pale,#FDF2DA) 62%);
  box-shadow:inset 0 -1px 0 var(--amber,#C27C00);}
.script-text p + p{margin-top:14px;}

/* ===== L'itineraire =====
   Une route verticale plutot qu'une liste : on voit d'ou l'on vient,
   ou l'on est, et ce qu'il reste. Meme vocabulaire graphique que le
   carnet de route et les emblemes. */
.itin{padding:4px 4px 24px;}
.itin-tete{padding:0 8px 16px;border-bottom:1px solid var(--bg-line);margin-bottom:16px;}
.itin-formation{font-family:var(--display);font-size:16px;font-weight:600;color:var(--ink);line-height:1.25;}
.itin-compte{font-family:var(--mono);font-size:13.5px;letter-spacing:0;text-transform:none;
  color:var(--ink-muted);margin-top:7px;}
.itin-barre{height:4px;background:var(--bg-mid);border-radius:100px;overflow:hidden;margin-top:10px;}
.itin-barre span{display:block;height:100%;background:var(--amber);border-radius:100px;transition:width .4s cubic-bezier(.4,0,.2,1);}

/* La route */
.route{position:relative;padding-left:30px;}
.route::before{content:"";position:absolute;left:11px;top:14px;bottom:14px;width:2px;
  background:repeating-linear-gradient(var(--bg-line) 0 6px, transparent 6px 11px);}
.etape-i{position:relative;margin-bottom:6px;}
.borne{position:absolute;left:-30px;top:6px;width:24px;height:24px;border-radius:50%;
  background:var(--bg);border:2px solid var(--bg-line);display:grid;place-items:center;
  font-family:var(--mono);font-size:10px;color:var(--ink-faint);z-index:1;transition:all .2s;}
.borne svg{width:11px;height:11px;}
.etape-i.faite .borne{background:var(--amber);border-color:var(--amber);color:#fff;}
.etape-i.ici .borne{background:var(--green);border-color:var(--green);color:#fff;
  box-shadow:0 0 0 4px var(--green-pale);}
.etape-titre{display:block;width:100%;text-align:left;background:transparent;border:0;cursor:pointer;
  font-family:var(--display);font-size:14.5px;font-weight:600;color:var(--ink-soft);
  padding:7px 9px;border-radius:9px;line-height:1.3;transition:background .15s,color .15s;}
.etape-titre:hover{background:var(--bg-soft);color:var(--ink);}
.etape-i.ici .etape-titre{color:var(--green);}
.etape-i.faite .etape-titre{color:var(--ink);}
.etape-meta{font-family:var(--mono);font-size:10px;color:var(--ink-faint);padding:0 9px 4px;letter-spacing:.06em;}

/* Les lecons de l'etape en cours */
.arrets{margin:2px 0 12px;padding-left:9px;border-left:1px solid var(--bg-line);}
.arret{display:flex;align-items:flex-start;gap:9px;padding:7px 9px;border-radius:8px;cursor:pointer;
  font-size:12.8px;font-weight:500;color:var(--ink-muted);transition:background .15s;line-height:1.35;}
.arret:hover{background:var(--bg-soft);color:var(--ink);}
.arret.ici{background:var(--green-pale);color:var(--green);font-weight:700;}
.arret.faite{color:var(--ink);}
.arret.bloque{opacity:.42;cursor:not-allowed;}
.arret.bloque:hover{background:transparent;}
.puce{width:15px;height:15px;border-radius:4px;flex:none;margin-top:1px;border:1.5px solid var(--bg-line);
  display:grid;place-items:center;background:var(--bg);}
.puce svg{width:9px;height:9px;opacity:0;}
.arret.faite .puce{background:var(--amber);border-color:var(--amber);}
.arret.faite .puce svg{opacity:1;}
.arret.ici .puce{border-color:var(--green);border-style:dashed;}

/* Changer de formation sans repasser par le menu */
.escale{margin-top:22px;padding-top:16px;border-top:1px solid var(--bg-line);}
.escale-titre{font-family:var(--mono);font-size:13.5px;letter-spacing:0;text-transform:none;
  color:var(--ink-faint);padding:0 9px 9px;}
.escale a{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;text-decoration:none;
  font-size:12.8px;color:var(--ink-soft);transition:background .15s;}
.escale a:hover{background:var(--bg-soft);color:var(--ink);}
.escale a.courante{background:var(--green-pale);color:var(--green);font-weight:700;}
.jeton{width:7px;height:7px;border-radius:50%;background:var(--bg-line);flex:none;}
.escale a.courante .jeton{background:var(--green);}
.escale a.prete .jeton{background:var(--amber);}

@media(max-width:860px){
  .itin{padding-bottom:8px;}
  .route{padding-left:26px;}
  .borne{left:-26px;}
}
@media(prefers-reduced-motion:reduce){*{transition:none !important;}}

/* ===== Schemas des lecons ===== */
.schema{margin:26px 0;padding:20px 18px 14px;border:1px solid var(--bg-line,#DCDEEA);
  border-radius:12px;background:var(--bg,#FFFFFF);}
.schema svg{width:100%;height:auto;display:block;}
.schema figcaption{font-family:var(--mono,'Archivo',sans-serif);font-size:11.5px;line-height:1.55;
  color:var(--ink-muted,#6B7094);margin-top:14px;padding-top:12px;
  border-top:1px solid var(--bg-line,#DCDEEA);}
@media(max-width:620px){.schema{padding:14px 12px 10px;margin:20px -6px;}}

.script-text strong{color:var(--ink,#171C45);font-weight:700;}
.script-text em{font-style:italic;color:var(--ink-soft,#44496B);}
.script-text u{text-decoration:none;background:linear-gradient(transparent 62%,var(--amber-pale,#FDF2DA) 62%);
  box-shadow:inset 0 -1px 0 var(--amber,#C27C00);}
.script-text p + p{margin-top:14px;}

/* Sortie de leçon : on peut toujours s'arrêter sans se sentir coincé. */
.lesson-sortie{display:flex;flex-wrap:wrap;align-items:center;gap:9px;justify-content:center;
  margin-top:24px;padding-top:18px;border-top:1px solid var(--bg-line);
  font-size:13.5px;color:var(--ink-faint);}
.lesson-sortie a{color:var(--ink-muted);text-decoration:none;font-weight:600;}
.lesson-sortie a:hover{color:var(--green);}
</style>

<script>
/* ============ DONNÉES DES 24 LEÇONS — PREMIERS PAS EN BOURSE ============ */
const LESSONS = [
{module:"Module 1 — Comment fonctionne la bourse", title:"La bourse expliquée simplement", duration:"5 min",
script:[
"La bourse a 2 mauvaises réputations. Pour certains, c'est un casino. Pour d'autres, un club réservé aux riches. Les 2 sont fausses. Voici ce qu'elle est vraiment.",
"<strong>Une action, c'est un morceau d'entreprise.</strong> Rien de plus. Avoir une action, c'est posséder une toute petite partie d'une société : ses usines, ses marques, ses contrats et ses futurs bénéfices. Si l'entreprise gagne de l'argent, tu en as ta part, selon ce que tu possèdes.",
"La bourse, c'est simplement <strong>l'endroit où ces morceaux s'achètent et se vendent</strong>. Elle existe parce qu'une entreprise a besoin d'argent pour grandir. Des gens acceptent de lui en apporter, en échange d'une part de ce qu'elle gagnera. C'est comme ça qu'ont été financées presque toutes les entreprises que tu connais.",
"Alors pourquoi l'image du casino ? Parce qu'on confond 2 choses très différentes. <strong>Investir</strong>, c'est acheter un morceau d'entreprise pour le garder des années, parce qu'on pense qu'elle va créer de la valeur. <strong>Spéculer</strong>, c'est acheter pour revendre plus cher très vite, en pariant sur le prix. <u>Le premier s'appuie sur l'économie réelle. Le second, sur ce que les autres vont faire.</u>",
"Cette formation ne parle que d'investir. <strong>Tout ce qui promet de gagner vite relève de la spéculation.</strong> Et les résultats sont connus : la plupart des particuliers qui achètent et revendent souvent perdent de l'argent.",
"Un mot sur le prix, car il surprend souvent. Le prix d'une action ne dit pas ce que vaut l'entreprise aujourd'hui. <strong>Il dit ce que les acheteurs et les vendeurs imaginent de son avenir.</strong> C'est pour ça qu'une action peut baisser alors que l'entreprise annonce des bénéfices : on attendait mieux. Le savoir évite beaucoup d'incompréhension.",
"Retiens l'essentiel : la bourse n'est ni un jeu ni un privilège. C'est une façon de financer les entreprises, accessible avec quelques dizaines d'euros. Ce que tu y gagnes dépend surtout du temps pendant lequel tu acceptes de ne pas y toucher."
],
quiz:[
{q:"Qu'est-ce qu'une action ?",opts:["Un prêt fait à une entreprise","Un morceau d'entreprise","Une promesse de gain","Un contrat d'assurance"],correct:1,
explain:"Tu possèdes une petite partie de ses usines, de ses marques et de ses futurs bénéfices."},
{q:"Quelle différence entre investir et spéculer ?",opts:["Le montant","La durée : la valeur créée par l'entreprise d'un côté, le prix à court terme de l'autre","Le type de courtier","Les impôts"],correct:1,
explain:"Investir s'appuie sur l'économie réelle. Spéculer, sur ce que les autres vont faire."},
{q:"Pourquoi une action peut-elle baisser malgré de bons résultats ?",opts:["Par erreur","Parce que le prix reflète l'avenir imaginé, et qu'on attendait mieux","Parce que des dividendes sont versés","Parce que la bourse est folle"],correct:1,
explain:"Le prix regarde l'avenir, pas le passé. C'est ce qui surprend le plus souvent."}
],
action:"Choisis une entreprise dont tu utilises les produits chaque semaine. Prends 5 minutes pour voir qui elle est, ce qu'elle vend, et si elle est en bourse. Le but n'est pas d'acheter. C'est de voir que la bourse parle d'entreprises que tu connais déjà."
},
{module:"Module 1 — Comment fonctionne la bourse", title:"Pourquoi les marchés montent sur le long terme", duration:"5 min",
script:[
"Sur de longues périodes, les grands indices mondiaux ont monté. Ce n'est ni une loi de la nature ni une garantie. Comprendre <em>pourquoi</em> permet de savoir quand ça pourrait s'arrêter.",
"<strong>Raison 1 : les entreprises réinvestissent leurs bénéfices.</strong> Une société qui gagne de l'argent peut le distribuer ou s'en servir pour grandir. Ce qu'elle réinvestit crée de nouveaux bénéfices, qui financent encore de la croissance. C'est l'effet boule de neige, appliqué aux entreprises.",
"<strong>Raison 2 : la population et la productivité augmentent.</strong> Il y a plus de gens qui produisent et achètent. Et chacun produit davantage grâce aux outils et aux connaissances. Une partie de la hausse vient simplement de là.",
"<strong>Raison 3 : l'inflation gonfle les chiffres.</strong> Quand les prix montent, les ventes et les bénéfices montent aussi, en euros. Une partie de la hausse affichée n'est donc pas un vrai enrichissement. Tu as appris à faire la différence dans la formation sur la monnaie.",
"<strong>Raison 4 : les indices se renouvellent.</strong> On en parle rarement, mais c'est important. Un indice n'est pas une liste figée. Les entreprises en difficulté en sortent, celles qui grandissent y entrent. <u>L'indice fait donc le ménage en permanence.</u> C'est une partie de sa hausse, et c'est pour ça qu'il est plus solide qu'une seule action.",
"Maintenant les limites, car elles comptent autant. Cette hausse n'est <strong>ni régulière ni garantie</strong>. Il y a eu des périodes de 10 ans, parfois plus, sans hausse. Certains pays ont mis des dizaines d'années à retrouver leur plus haut. Et le passé ne dit rien de sûr sur l'avenir.",
"La conclusion tient en une phrase, et elle guide toute la formation : <strong>ce raisonnement ne marche que sur une longue durée, et avec beaucoup d'entreprises à la fois.</strong> Pas avec une seule action. Pas sur 2 ans."
],
quiz:[
{q:"Quelle raison, rarement expliquée, aide les indices à monter ?",opts:["Les banques centrales","Le renouvellement des entreprises qui composent l'indice","La spéculation","Les dividendes"],correct:1,
explain:"Les entreprises en difficulté sortent, celles qui grandissent entrent. L'indice fait le ménage en continu."},
{q:"La hausse des marchés est-elle garantie ?",opts:["Oui, sur 10 ans","Non, il y a eu de longues périodes sans hausse","Oui, si on diversifie","Oui, dans les pays riches"],correct:1,
explain:"Certains marchés ont mis des dizaines d'années à retrouver leur plus haut. Le passé ne garantit rien."},
{q:"Dans quel cas ce raisonnement marche-t-il ?",opts:["Pour toute action, sur toute durée","Avec beaucoup d'entreprises, sur une longue durée","Pour les entreprises tech","Seulement pour les pays émergents"],correct:1,
explain:"Pas avec une seule action. Pas sur 2 ans."}
],
action:"Cherche un graphique d'un indice mondial sur 30 ans. Regarde les grosses baisses : 2000, 2008, 2020. Note combien de temps chacune a duré. Ce chiffre te servira le jour où tu vivras la prochaine."
},
{module:"Module 1 — Comment fonctionne la bourse", title:"Actions, fonds et trackers", duration:"5 min",
script:[
"Il y a 3 façons d'investir en bourse. Ton choix décide de ton risque et du temps que tu devras y passer.",
"<strong>Acheter des actions toi-même.</strong> Tu choisis les entreprises. C'est la voie la plus exigeante. Il faut lire des comptes, suivre l'actualité de chaque société, et accepter qu'une entreprise puisse perdre presque toute sa valeur. <u>Avoir 5 actions, ce n'est pas diversifier.</u> C'est mettre tout ton risque sur 5 paris.",
"<strong>Les fonds gérés par des pros.</strong> Une équipe choisit les actions pour toi et essaie de faire mieux que le marché. Tu délègues, mais tu paies des frais chaque année, souvent entre 1,5 et 2,5 %. Ce qu'il faut savoir, et c'est prouvé depuis longtemps : <strong>sur de longues périodes, la plupart de ces fonds font moins bien que leur indice, une fois les frais payés.</strong>",
"<figure class=\"schema\"><svg viewBox=\"0 0 700 228\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"200\" y=\"20\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" letter-spacing=\"1.4\" fill=\"#2B3A8F\">FONDS INDICIEL</text><text x=\"560\" y=\"20\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" letter-spacing=\"1.4\" fill=\"#C27C00\">FONDS GÉRÉ ACTIVEMENT</text><text x=\"20\" y=\"44\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">Frais annuels</text><rect x=\"20\" y=\"54\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#F0F1F7\"/><rect x=\"20\" y=\"54\" width=\"561\" height=\"18\" rx=\"5\" fill=\"#E9EBF7\"/><rect x=\"581\" y=\"54\" width=\"99\" height=\"18\" rx=\"5\" fill=\"#FDF2DA\"/><text x=\"28\" y=\"67\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#2B3A8F\">0,2 à 0,4 %</text><text x=\"672\" y=\"67\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8F5F00\">1,5 à 2,5 %</text><text x=\"20\" y=\"100\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">Objectif</text><rect x=\"20\" y=\"110\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#F0F1F7\"/><rect x=\"20\" y=\"110\" width=\"330\" height=\"18\" rx=\"5\" fill=\"#E9EBF7\"/><rect x=\"350\" y=\"110\" width=\"330\" height=\"18\" rx=\"5\" fill=\"#FDF2DA\"/><text x=\"28\" y=\"123\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#2B3A8F\">reproduire l'indice</text><text x=\"672\" y=\"123\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8F5F00\">battre l'indice</text><text x=\"20\" y=\"156\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">Résultat après frais sur longue durée</text><rect x=\"20\" y=\"166\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#F0F1F7\"/><rect x=\"20\" y=\"166\" width=\"475\" height=\"18\" rx=\"5\" fill=\"#E9EBF7\"/><rect x=\"495\" y=\"166\" width=\"185\" height=\"18\" rx=\"5\" fill=\"#FDF2DA\"/><text x=\"28\" y=\"179\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#2B3A8F\">suit l'indice</text><text x=\"672\" y=\"179\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8F5F00\">majorité en dessous</text></svg><figcaption>L'écart de frais paraît anodin. Sur 20 ans, 1 point de plus ampute le résultat final d'environ 12 %.</figcaption></figure>",
"<strong>Les fonds indiciels, aussi appelés trackers ou ETF.</strong> Ils n'essaient pas de battre le marché. Ils le copient. Un fonds qui suit un indice mondial contient des centaines d'entreprises dans des dizaines de pays. Ses frais sont bien plus bas, souvent entre 0,2 et 0,4 % par an.",
"Cette différence de frais paraît petite. Elle ne l'est pas. <strong>Sur 20 ans, 1 % de frais en plus par an réduit le résultat final d'environ 12 %.</strong> C'est presque un quart des gains. Le comparateur des outils NiouDem te le montre.",
"Pour être honnête : <em>un fonds indiciel ne protège pas des baisses.</em> Si les marchés mondiaux perdent 30 %, il perd 30 %. Ce qu'il t'apporte, ce n'est pas la sécurité. <strong>C'est de ne plus dépendre d'une seule entreprise.</strong> Ce n'est pas du tout pareil.",
"La suite de ce module parle des fonds indiciels. Pas parce qu'ils sont toujours les meilleurs. Mais parce qu'ils demandent le moins de connaissances et de temps. C'est ce qu'il faut quand on débute."
],
quiz:[
{q:"Avoir 5 actions, est-ce diversifié ?",opts:["Oui, c'est assez","Non, c'est mettre tout son risque sur 5 paris","Oui, si elles sont dans des secteurs différents","Ça dépend du montant"],correct:1,
explain:"Diversifier, c'est avoir des centaines d'entreprises. Un particulier ne peut pas le faire seul."},
{q:"Que montrent les études sur les fonds gérés par des pros ?",opts:["Ils battent presque toujours leur indice","La plupart font moins bien que leur indice après frais, sur la durée","Ils sont plus risqués","Ils sont réservés aux pros"],correct:1,
explain:"1,5 à 2,5 % de frais par an, c'est lourd et difficile à rattraper."},
{q:"Qu'apporte vraiment un fonds indiciel ?",opts:["Une protection contre les baisses","Ne plus dépendre d'une seule entreprise","Un gain garanti","Pas d'impôts"],correct:1,
explain:"Si les marchés perdent 30 %, il perd 30 %. Ce n'est pas de la sécurité, c'est de la diversification."}
],
action:"Cherche les frais annuels du dernier produit d'épargne qu'on t'a proposé. Cherche les mots « frais de gestion » dans ses documents. Compare-les à 0,3 %. La différence, c'est ce que tu paies chaque année, que le placement gagne ou perde."
},
{module:"Module 1 — Comment fonctionne la bourse", title:"Les indices boursiers", duration:"5 min",
script:[
"Un indice, c'est un panier d'entreprises dont on suit la valeur totale. Il sert de thermomètre au marché, et de modèle pour les fonds indiciels. Savoir ce qu'il contient évite l'erreur la plus fréquente des débutants.",
"<strong>Les indices nationaux</strong> suivent les grandes entreprises d'un pays : le CAC 40 en France (une quarantaine de sociétés), ou les grands indices américains, japonais, britanniques. Leur défaut saute aux yeux : <u>tout le risque repose sur un seul pays</u>, et parfois sur quelques secteurs.",
"<strong>Les indices régionaux</strong> couvrent une zone, comme l'Europe ou les pays émergents. <strong>Les indices mondiaux</strong> couvrent les entreprises des pays riches, voire du monde entier. Ils regroupent alors plus de 1 000 sociétés dans des dizaines de pays.",
"Un point que presque personne ne vérifie : <strong>le poids de chaque entreprise.</strong> Dans la plupart des indices, les plus grosses entreprises pèsent le plus. Résultat : dans un indice mondial, <u>les entreprises américaines représentent aujourd'hui plus de la moitié</u>. Et quelques géants de la tech pèsent très lourd.",
"Donc, acheter un indice monde, c'est être diversifié... en partie. Oui pour le nombre d'entreprises. Moins pour les pays et les secteurs. <strong>Ce n'est pas un défaut caché. C'est quelque chose à savoir.</strong>",
"Deuxième point d'attention : indice <em>prix</em> ou indice <em>dividendes réinvestis</em>. Le premier ne compte que l'évolution des prix. Le second ajoute les dividendes versés. Sur une longue période, l'écart est énorme. Beaucoup de comparaisons en ligne mélangent les 2, ce qui fausse tout.",
"Devant n'importe quel indice, pose ces 3 questions : <strong>combien d'entreprises ? De quels pays ? Et quel poids pour chacune ?</strong> Les réponses sont toujours dans la documentation du fonds qui le suit."
],
quiz:[
{q:"Quel est le défaut d'un indice national ?",opts:["Il est trop cher","Tout le risque repose sur un seul pays","Il ne verse pas de dividendes","Il est réservé aux habitants du pays"],correct:1,
explain:"Et souvent sur quelques secteurs de ce pays."},
{q:"Dans la plupart des indices, qui pèse le plus ?",opts:["Chaque entreprise pèse pareil","Les plus grosses entreprises","Ça change chaque jour","Celles qui versent des dividendes"],correct:1,
explain:"C'est pour ça qu'un indice mondial est surtout américain, et très lié à quelques géants."},
{q:"Quelle différence entre indice prix et indice dividendes réinvestis ?",opts:["Aucune","Le second ajoute les dividendes versés","Le second retire les frais","Le premier est en euros"],correct:1,
explain:"Sur une longue période, l'écart est énorme. Beaucoup de comparaisons en ligne mélangent les 2."}
],
action:"Choisis un indice mondial. Cherche combien d'entreprises il contient, la part de chaque pays, et le poids de ses 10 plus grosses entreprises. C'est public, et ça prend 10 minutes. Beaucoup d'investisseurs ne l'ont jamais regardé."
},
{module:"Module 2 — Choisir son enveloppe et son courtier", title:"PEA ou compte-titres", duration:"5 min",
script:[
"Avant de choisir quoi acheter, il faut choisir où le mettre. Il existe 2 enveloppes pour investir en bourse. La différence est surtout une question d'impôts.",
"<strong>Le PEA (plan d'épargne en actions).</strong> Après 5 ans, tes gains ne paient plus que les prélèvements sociaux de 17,2 %. Pas d'impôt sur le revenu. En échange, tu ne peux pas verser plus de <u>150 000 €</u>, et tu ne peux y mettre que des actions européennes ou des fonds autorisés. Un retrait avant 5 ans ferme le PEA.",
"<strong>Le compte-titres.</strong> Pas de plafond, pas de limite de pays, pas de durée minimum. En échange, tes gains sont taxés à 30 % à chaque fois que tu vends avec un bénéfice.",
"<figure class=\"schema\"><svg viewBox=\"0 0 700 168\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><line x1=\"34\" y1=\"96\" x2=\"666\" y2=\"96\" stroke=\"#DCDEEA\" stroke-width=\"2\"/><path d=\"M666 96 l-9 -5 v10 z\" fill=\"#DCDEEA\"/><line x1=\"34\" y1=\"96\" x2=\"34\" y2=\"62\" stroke=\"#2B3A8F\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/><circle cx=\"34\" cy=\"96\" r=\"7\" fill=\"#2B3A8F\"/><circle cx=\"34\" cy=\"96\" r=\"12\" fill=\"none\" stroke=\"#2B3A8F\" stroke-width=\"1\" opacity=\".35\"/><text x=\"34\" y=\"52\" text-anchor=\"start\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14\" font-weight=\"600\" fill=\"#171C45\">Ouverture</text><text x=\"34\" y=\"122\" text-anchor=\"start\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12\" fill=\"#44496B\">Le compteur démarre</text><line x1=\"382\" y1=\"96\" x2=\"382\" y2=\"62\" stroke=\"#C27C00\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/><circle cx=\"382\" cy=\"96\" r=\"7\" fill=\"#C27C00\"/><circle cx=\"382\" cy=\"96\" r=\"12\" fill=\"none\" stroke=\"#C27C00\" stroke-width=\"1\" opacity=\".35\"/><text x=\"382\" y=\"52\" text-anchor=\"middle\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14\" font-weight=\"600\" fill=\"#171C45\">5 ans</text><text x=\"382\" y=\"122\" text-anchor=\"middle\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12\" fill=\"#44496B\">PEA : 17,2 % seulement</text><line x1=\"666\" y1=\"96\" x2=\"666\" y2=\"62\" stroke=\"#C27C00\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/><circle cx=\"666\" cy=\"96\" r=\"7\" fill=\"#C27C00\"/><circle cx=\"666\" cy=\"96\" r=\"12\" fill=\"none\" stroke=\"#C27C00\" stroke-width=\"1\" opacity=\".35\"/><text x=\"666\" y=\"52\" text-anchor=\"end\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14\" font-weight=\"600\" fill=\"#171C45\">Au-delà</text><text x=\"666\" y=\"122\" text-anchor=\"end\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12\" fill=\"#44496B\">Retraits partiels libres</text></svg><figcaption>Le délai court depuis l'ouverture, pas depuis le premier versement important. Ouvrir tôt ne coûte presque rien.</figcaption></figure>",
"La limite « Europe » du PEA semble bloquante si tu veux investir dans le monde entier. Elle ne l'est pas. <strong>Certains fonds indiciels européens copient des indices mondiaux tout en restant autorisés dans le PEA.</strong> On verra comment au module suivant. C'est légal et très courant.",
"Comment choisir ? 3 questions. <strong>Combien de temps ?</strong> Si tu peux laisser l'argent au moins 5 ans, le PEA est bien plus avantageux. <strong>Besoin de liberté ?</strong> Si tu veux acheter des actions hors d'Europe toi-même, il te faut un compte-titres. <strong>Plafond ?</strong> Au-delà de 150 000 € versés, le compte-titres prend le relais.",
"Un conseil gratuit que presque personne n'applique : <u>les 5 ans comptent à partir de l'ouverture, pas du premier gros versement.</u> Ouvrir un PEA aujourd'hui avec le minimum lance le compteur. Même si tu n'y mets rien pendant 3 ans.",
"Beaucoup de gens ont les 2 enveloppes. Ce n'est pas de l'hésitation. Le PEA pour l'essentiel, sur le long terme. Le compte-titres pour ce qui ne rentre pas dans le PEA."
],
quiz:[
{q:"Combien d'impôts sur les gains d'un PEA après 5 ans ?",opts:["Rien du tout","Seulement 17,2 % de prélèvements sociaux","30 % comme le compte-titres","Seulement 12,8 % d'impôt"],correct:1,
explain:"L'impôt sur le revenu disparaît. Tu économises 12,8 points sur tes gains."},
{q:"La limite « Europe » du PEA empêche-t-elle d'investir dans le monde entier ?",opts:["Oui, totalement","Non, certains fonds autorisés copient des indices mondiaux","Oui, sauf pour les gros montants","Seulement pour les actions américaines"],correct:1,
explain:"Une technique de copie le permet, et elle est très utilisée."},
{q:"À partir de quand comptent les 5 ans du PEA ?",opts:["Du premier gros versement","De l'ouverture du PEA","Du premier achat","De la première année complète"],correct:1,
explain:"Ouvrir avec le minimum lance le compteur, même sans rien verser pendant des années."}
],
action:"Regarde si tu as déjà un PEA, et depuis quand. Si tu n'en as pas et que tu penses investir un jour, retiens que l'ouvrir prend une vingtaine de minutes. Et que ça lance un compteur que rien ne rattrape ensuite."
},
{module:"Module 2 — Choisir son enveloppe et son courtier", title:"Comment comparer les courtiers", duration:"5 min",
script:[
"Cette leçon ne classe aucun courtier et n'en conseille aucun. Elle te donne les critères pour comparer. Les offres changent chaque année, une liste serait vite dépassée.",
"<strong>Critère 1 : les frais par ordre.</strong> C'est ce que tu paies à chaque achat ou vente. Ça va de quelques centimes à plusieurs euros. Si tu achètes une fois par mois, <u>3 € d'écart par ordre font 36 € par an.</u> Sur de petits montants, ça pèse lourd.",
"<strong>Critère 2 : les frais de tenue de compte.</strong> Certains courtiers te font payer le simple fait de garder tes titres. D'autres non. Ces frais sont très pénalisants, car tu les paies même si tu ne fais rien.",
"<strong>Critère 3 : les fonds proposés.</strong> Tous les courtiers n'ont pas les mêmes. Vérifie que ceux qui t'intéressent sont disponibles, et à partir de quel montant.",
"<strong>Critère 4 : l'investissement automatique.</strong> Souvent oublié, et pourtant essentiel pour la méthode de cette formation. Certains courtiers permettent d'investir automatiquement chaque mois, d'autres non. <strong>Sans automatique, tout repose sur ta volonté.</strong> Et tu as vu dans la formation sur la psychologie ce qu'elle vaut au mauvais moment.",
"<strong>Critère 5 : la sécurité.</strong> Vérifie que le courtier a le droit d'exercer en France et qu'il fait partie d'un système de garantie. Tes titres t'appartiennent et sont séparés de l'argent du courtier. Mais vérifier son autorisation reste la première chose à faire.",
"<strong>Critère 6 : l'aide pour les impôts.</strong> Certains courtiers préparent tes papiers pour la déclaration. D'autres te laissent tout calculer. Pour un compte-titres actif, ça peut représenter plusieurs heures par an.",
"Une mise en garde. <strong>Méfie-toi des comparatifs en ligne avec des liens de parrainage.</strong> Souvent, le classement suit ce qu'ils touchent, pas la qualité. Compare toi-même sur ces 6 critères. Ça prend 1 heure, et ça te concerne pour 20 ans."
],
quiz:[
{q:"Pourquoi l'investissement automatique est-il un critère important ?",opts:["Il réduit les frais","Sans lui, tout repose sur la volonté","Il est obligatoire pour le PEA","Il fait gagner plus"],correct:1,
explain:"Et la volonté manque justement pendant les baisses, quand il faudrait continuer."},
{q:"Quels frais paie-t-on même sans rien faire ?",opts:["Les frais par ordre","Les frais de tenue de compte","Les frais de transfert","Aucun"],correct:1,
explain:"C'est ce qui les rend si pénalisants pour quelqu'un qui investit sans bouger."},
{q:"Que penser des comparatifs en ligne ?",opts:["Ils sont neutres et fiables","Beaucoup ont des liens de parrainage et classent selon ce qu'ils touchent","Ils sont interdits","Ils sont faits par l'État"],correct:1,
explain:"Comparer toi-même sur 6 critères prend 1 heure. Et ça te concerne pour 20 ans."}
],
action:"Fais un tableau à 6 colonnes, une par critère. Compare 3 courtiers de ton choix. Utilise seulement leurs grilles de tarifs officielles, jamais un comparatif. Ton tableau vaudra mieux que n'importe quel classement."
},
{module:"Module 2 — Choisir son enveloppe et son courtier", title:"Ouvrir son plan, étape par étape", duration:"5 min",
script:[
"Ouvrir un PEA fait peur à beaucoup de gens. Pourtant, ça prend une vingtaine de minutes. Voici toutes les étapes, pour que plus rien ne soit inconnu.",
"<strong>Étape 1 : les papiers.</strong> Une pièce d'identité valide, un justificatif de domicile de moins de 3 mois, un RIB, et parfois un justificatif de revenus ou de situation pro. Rassemble-les avant de commencer. La première cause d'abandon, c'est de bloquer en cours de route faute d'un papier.",
"<strong>Étape 2 : le questionnaire.</strong> Le courtier doit te poser des questions sur ton expérience, tes objectifs et le risque que tu acceptes. Ce n'est pas un examen. Ce n'est pas non plus une simple formalité. <u>Réponds honnêtement</u>, même pour dire que tu débutes. Si tu enjolives, on te proposera des produits qui ne te conviennent pas. Et tu perds une protection prévue pour toi.",
"<strong>Étape 3 : le premier versement.</strong> Souvent, quelques dizaines d'euros suffisent, parfois moins. Rappelle-toi : le but de ce versement n'est pas d'investir. C'est de <strong>lancer le compteur des 5 ans.</strong>",
"<strong>Étape 4 : la validation.</strong> Ça prend de quelques heures à quelques jours. Tu reçois ensuite un numéro de compte et tes identifiants.",
"<strong>Étape 5 : le premier achat.</strong> Dans ton espace, cherche le fonds par son code, puis choisis le type d'ordre. Retiens-en 2. <strong>L'ordre au marché</strong> : il s'exécute tout de suite, au prix du moment. <strong>L'ordre à cours limité</strong> : il ne s'exécute que si le prix atteint la limite que tu fixes. <u>Pour investir régulièrement sur le long terme, l'ordre à cours limité évite les mauvaises surprises</u> sur les fonds peu échangés.",
"Pour ne pas t'inquiéter : entre le moment où tu passes l'ordre et son exécution, il peut se passer quelques minutes à quelques heures. Ça dépend du marché et de l'heure. C'est normal. Ton espace t'indique où en est l'ordre.",
"Dernier point, le plus important : <strong>le premier achat est celui qui demande le plus de courage et le moins d'argent.</strong> Fais-le avec une petite somme, exprès. Ce n'est pas un investissement. C'est un apprentissage."
],
quiz:[
{q:"Que faire avant de commencer l'ouverture ?",opts:["Choisir ses fonds","Rassembler tous ses papiers","Prévenir sa banque","Calculer ses impôts"],correct:1,
explain:"Bloquer en cours de route faute d'un papier, c'est la première cause d'abandon."},
{q:"Comment répondre au questionnaire ?",opts:["En exagérant son expérience pour avoir plus de choix","Honnêtement, même pour dire qu'on débute","En laissant le conseiller remplir","Peu importe, c'est indicatif"],correct:1,
explain:"Si tu enjolives, on te propose des produits inadaptés. Et tu perds une protection prévue pour toi."},
{q:"Quel type d'ordre pour investir régulièrement ?",opts:["Toujours l'ordre au marché","L'ordre à cours limité, qui évite les mauvaises surprises","L'ordre à déclenchement","Peu importe"],correct:1,
explain:"Sur les fonds peu échangés, le prix payé peut s'éloigner de celui affiché."}
],
action:"Ce soir, mets tes 3 papiers dans un dossier sur ton ordinateur : identité, domicile, RIB. Tu n'ouvres rien ce soir. Mais le jour où tu te décideras, le principal obstacle aura disparu."
},
{module:"Module 2 — Choisir son enveloppe et son courtier", title:"Passer ton premier ordre", duration:"5 min",
script:[
"Cette leçon est la plus courte en explications, et la plus importante en effet. Elle te fait passer la seule étape qui sépare vraiment quelqu'un qui a lu de quelqu'un qui investit.",
"<strong>Le montant : petit, exprès.</strong> 50 € suffisent. 20 € aussi, selon les frais. Ce premier achat ne cherche pas à rapporter. Il sert à <u>transformer une peur floue en geste connu.</u>",
"Ce que tu vas ressentir, tout le monde le ressent, mais personne ne le dit. Au moment de valider, tu vas douter. Tu auras l'impression de faire quelque chose d'irréversible que tu ne maîtrises pas. <strong>Ce doute n'est pas un signal d'alarme. C'est la sensation normale d'une première fois.</strong> Il disparaît au deuxième achat.",
"En pratique, 5 gestes. Tu te connectes. Tu cherches le fonds par son code. Tu tapes le montant ou le nombre de parts. Tu choisis le type d'ordre. Tu valides. Un résumé s'affiche avant de confirmer, avec les frais. <strong>Lis-le : c'est le seul moment où tu vois le vrai coût de l'opération.</strong>",
"Dans les jours qui suivent, une chose va arriver, autant le savoir : <strong>ton placement va bouger, et sans doute baisser à un moment.</strong> Sur 50 €, ça fait quelques centimes. C'est tout l'intérêt de commencer petit. Tu apprends à vivre les variations sur une somme qui ne fait pas mal.",
"Une règle pour ce premier mois, plus importante que le choix du fonds : <u>ne regarde pas ton compte tous les jours.</u> Une fois par semaine maximum. Tu apprends à ne pas réagir. C'est la compétence qui rapporte le plus en investissement.",
"Enfin, note quelque part la date et le montant de ce premier achat. Dans 10 ans, cette ligne comptera plus pour toi que la somme elle-même. Elle marquera le jour où tu es passé de la théorie à la pratique."
],
quiz:[
{q:"Quel montant pour un premier achat ?",opts:["Au moins 1 000 €","Une petite somme exprès, 50 € suffisent","Toute son épargne","Le maximum possible"],correct:1,
explain:"Ce premier achat ne cherche pas à rapporter. Il transforme une peur floue en geste connu."},
{q:"Que veut dire le doute au moment de valider ?",opts:["Qu'il faut renoncer","C'est normal pour une première fois, il disparaît au deuxième achat","Que le montant est trop gros","Que le fonds est mal choisi"],correct:1,
explain:"Tout le monde le ressent. Le savoir à l'avance suffit pour ne pas reculer."},
{q:"Quelle règle suivre le premier mois ?",opts:["Suivre les prix chaque jour","Ne pas regarder son compte plus d'une fois par semaine","Vendre si ça baisse","Racheter tout de suite"],correct:1,
explain:"Tu apprends à ne pas réagir. C'est la compétence qui rapporte le plus."}
],
action:"Si ton compte est ouvert, passe ton premier achat ce soir, avec le plus petit montant possible. Note la date et le montant dans ton carnet. S'il n'est pas encore ouvert, ce n'est pas grave : ce sera ta première action du mois prochain."
},
{module:"Module 3 — Les fonds indiciels", title:"Qu'est-ce qu'un fonds indiciel", duration:"5 min",
script:[
"Un fonds indiciel, aussi appelé tracker ou ETF, n'a qu'un seul but : copier un indice. Il n'essaie pas de faire mieux. Juste de coller au plus près.",
"Le principe est simple. Le fonds achète les entreprises de l'indice, dans les mêmes proportions. Quand tu achètes une part, tu possèdes un petit bout de l'ensemble. <strong>Avec 50 €, tu possèdes une miette de plusieurs centaines d'entreprises.</strong> Impossible de faire ça toi-même.",
"3 choses le distinguent d'un fonds classique. <strong>1. Les frais.</strong> Pas d'équipe à payer, donc des frais souvent entre 0,2 et 0,4 % par an, contre 1,5 à 2,5 % pour un fonds géré. <strong>2. La transparence.</strong> On sait à tout moment ce qu'il contient. <strong>3. La facilité.</strong> Il s'achète et se vend en bourse comme une action, toute la journée.",
"3 mots reviennent dans tous les documents. <strong>L'encours</strong>, c'est l'argent total que gère le fonds. <u>Plus il est gros, moins le fonds risque de fermer.</u> Une fermeture ne fait rien perdre, mais elle oblige à des démarches et peut déclencher des impôts au mauvais moment.",
"<strong>L'écart de suivi</strong> mesure la différence entre le fonds et son indice. Plus il est petit, mieux le fonds fait son travail. <strong>La liquidité</strong> dit s'il est facile d'acheter ou de vendre. Sur un fonds peu échangé, l'écart entre prix d'achat et prix de vente grandit. C'est un coût caché.",
"Un point de vocabulaire qui embrouille beaucoup de débutants. <em>ETF</em> veut dire « fonds échangé en bourse ». Ça dit comment il s'achète, pas ce qu'il fait. <strong>Presque tous les ETF copient un indice, mais pas tous.</strong> Certains multiplient les gains et les pertes, d'autres parient sur la baisse. Ce sont des produits de spéculation, rien à voir avec cette formation.",
"La règle de prudence : <u>si le nom d'un fonds contient un multiplicateur (x2, x3), ou les mots « short », « leveraged » ou « inverse », ce n'est pas un fonds indiciel classique.</u> Ne l'achète pas sans avoir compris exactement ce qu'il fait."
],
