explain:"Il n'essaie pas de faire mieux, juste de coller au plus près. C'est pour ça que ses frais sont si bas."},
{q:"Que mesure l'écart de suivi ?",opts:["Le risque du fonds","La différence entre le fonds et son indice","Les frais par an","Les variations de prix"],correct:1,
explain:"Plus il est petit, mieux le fonds fait le travail que tu lui paies."},
{q:"Que veut dire un multiplicateur ou le mot « short » dans le nom d'un fonds ?",opts:["Qu'il rapporte plus","Que c'est un produit de spéculation, pas un fonds indiciel classique","Qu'il n'y a pas d'impôts","Qu'il est géré par des pros"],correct:1,
explain:"Gains et pertes multipliés, ou pari sur la baisse : rien à voir avec cette formation."}
],
action:"Ouvre la fiche d'un fonds indiciel mondial. Trouve 4 infos : frais par an, encours, écart de suivi, nombre d'entreprises. Elles sont dans le document d'informations clés (DIC). Ça prend 5 minutes."
},
{module:"Module 3 — Les fonds indiciels", title:"Capitalisant ou distribuant", duration:"5 min",
script:[
"Un même indice peut être suivi par 2 versions d'un fonds. Le choix entre les 2 change vraiment ton résultat final. Pourtant, les débutants posent rarement la question.",
"<strong>Un fonds distribuant</strong> te verse les dividendes des entreprises qu'il possède, en général 1 à 4 fois par an. Tu reçois de l'argent sur ton compte. Tu peux le dépenser ou le réinvestir toi-même.",
"<strong>Un fonds capitalisant</strong> ne te verse rien. Il réinvestit les dividendes tout seul dans le fonds. Ta part prend de la valeur, sans que rien n'apparaisse sur ton compte.",
"Ça fait 3 différences. <strong>1. Les impôts.</strong> Sur un compte-titres, un dividende versé est imposé l'année où tu le reçois, même si tu le réinvestis tout de suite. Un fonds capitalisant ne déclenche aucun impôt tant que tu ne vends pas. <u>Sur un compte-titres et sur la durée, le capitalisant est donc plus avantageux.</u>",
"<strong>2. Les frais.</strong> Réinvestir un dividende toi-même, c'est passer un ordre, donc payer des frais. Le fonds capitalisant le fait sans frais en plus, et sans que tu y penses.",
"<strong>3. Le plaisir.</strong> Recevoir un dividende fait vraiment plaisir, et beaucoup de gens y tiennent. Mais ce plaisir a un prix : <strong>un dividende dépensé ne rapporte plus rien.</strong>",
"Dans un PEA, la question des impôts disparaît : rien n'est imposé tant que tu ne retires pas. Le choix devient une question de confort. Et le capitalisant reste plus simple, car il ne demande aucun geste.",
"Une exception. <strong>Si tu veux un revenu régulier</strong>, par exemple à la retraite, le distribuant devient utile. Il te verse de l'argent sans avoir à vendre de parts. C'est le seul cas où je le choisirais. Et il ne concerne pas quelqu'un qui est en train de se constituer un capital."
],
quiz:[
{q:"Que fait un fonds capitalisant des dividendes ?",opts:["Il les verse chaque trimestre","Il les réinvestit tout seul dans le fonds","Il les garde en liquide","Il les reverse à l'État"],correct:1,
explain:"Ta part prend de la valeur, sans que rien n'apparaisse sur ton compte."},
{q:"Pourquoi le capitalisant est-il plus avantageux sur un compte-titres ?",opts:["Ses frais sont plus bas","Aucun impôt tant qu'on ne vend pas","Il copie mieux l'indice","Il s'échange plus facilement"],correct:1,
explain:"Un dividende versé est imposé l'année où on le reçoit, même s'il est réinvesti tout de suite."},
{q:"Quand le distribuant devient-il utile ?",opts:["Pour se constituer un capital","Quand on veut un revenu régulier","Pour réduire le risque","Pour investir en PEA"],correct:1,
explain:"Il verse de l'argent sans vendre de parts. Utile à la retraite, pas quand on construit son capital."}
],
action:"Regarde si le fonds qui t'intéresse existe en version capitalisante et distribuante. Elles ont souvent le même nom, avec « Acc » ou « Dist ». Note celle qui correspond à ton objectif actuel."
},
{module:"Module 3 — Les fonds indiciels", title:"Réplication physique ou synthétique", duration:"5 min",
script:[
"Un fonds indiciel peut copier son indice de 2 façons. C'est technique, et c'est mal expliqué partout. Pourtant, c'est ce qui permet à un fonds mondial d'entrer dans un PEA.",
"<strong>La copie physique.</strong> Le fonds achète vraiment les entreprises de l'indice. S'il suit un indice de 1 500 entreprises, il possède ces entreprises, ou un échantillon représentatif quand il y en a trop. C'est la méthode la plus simple à comprendre.",
"<strong>La copie synthétique.</strong> Le fonds possède un autre panier d'actions. Puis il signe un contrat d'échange avec une banque, appelé <em>swap</em>. La banque s'engage à lui verser exactement ce que rapporte l'indice visé. En échange, le fonds lui verse ce que rapporte son propre panier.",
"Ça paraît compliqué. Voici à quoi ça sert : <strong>le fonds peut détenir des actions européennes, donc rester dans le PEA, tout en rapportant comme un indice mondial.</strong> C'est ce que je t'annonçais au module précédent.",
"Quels risques ? Le principal : <strong>que la banque ne paie pas</strong>. Si elle fait faillite, le fonds pourrait ne pas recevoir ce qu'on lui doit. Les règles européennes limitent ce risque à <u>10 % de la valeur du fonds</u>. Et en pratique, les fonds le réduisent souvent bien plus, grâce à des garanties déposées chaque jour.",
"Il ne faut ni en faire un drame ni l'ignorer. <strong>Le risque existe, il est encadré, et il est bien plus petit que le risque de marché.</strong> Refuser la copie synthétique par prudence tout en mettant 100 % en actions, c'est se protéger d'un petit risque en gardant le gros.",
"Comment savoir quelle méthode utilise un fonds ? C'est écrit dans le document d'informations clés : <em>réplication physique</em>, <em>directe</em> ou <em>synthétique</em>. <strong>Ça se vérifie en 30 secondes</strong>, et ça fait partie de ce qu'il faut regarder avant d'acheter."
],
quiz:[
{q:"Comment marche la copie synthétique ?",opts:["Le fonds achète les entreprises de l'indice","Le fonds a un autre panier et échange ce qu'il rapporte avec une banque","Le fonds simule les prix","Le fonds emprunte les actions"],correct:1,
explain:"C'est ce qui permet à un fonds mondial de rester dans le PEA."},
{q:"Quel risque propre à la copie synthétique ?",opts:["Un risque lié aux devises","Que la banque ne paie pas, risque limité à 10 % du fonds","Un risque de ne pas pouvoir vendre","Aucun risque en plus"],correct:1,
explain:"Il est encadré par la loi, et bien plus petit que le risque de marché."},
{q:"Où trouver la méthode de copie d'un fonds ?",opts:["Seulement auprès du courtier","Dans le document d'informations clés du fonds","Ce n'est pas public","Sur les forums"],correct:1,
explain:"Ça se vérifie en 30 secondes, avant tout achat."}
],
action:"Ouvre le document d'informations clés d'un fonds mondial autorisé dans le PEA. Cherche le mot « réplication ». Comprendre ce que fait un produit avant de l'acheter, c'est exactement ce que cette formation veut t'apprendre."
},
{module:"Module 3 — Les fonds indiciels", title:"Comment lire la fiche d'un fonds", duration:"5 min",
script:[
"Cette leçon ne te dira pas quel fonds acheter. C'est voulu : NiouDem ne fait aucune recommandation. Elle t'apprend à lire une fiche. Tu pourras ainsi juger n'importe quel produit qu'on te proposera, aujourd'hui ou dans 10 ans.",
"Chaque fonds vendu en Europe publie un <strong>document d'informations clés</strong> (DIC). Il est gratuit, fait quelques pages, et suit toujours le même modèle. C'est le seul document qui compte. Il contient 8 infos à vérifier.",
"<strong>1. L'indice suivi.</strong> Quel panier, combien d'entreprises, quels pays. <strong>2. Les frais par an.</strong> En pourcentage, prélevés chaque année, que le fonds monte ou baisse. <strong>3. La méthode de copie</strong>, physique ou synthétique (leçon précédente).",
"<strong>4. La devise.</strong> Un fonds mondial possède des actions en dollars et dans d'autres monnaies. Sauf mention contraire, <u>tu subis les variations des monnaies en plus de celles du marché.</u> Ça peut jouer dans les 2 sens. Beaucoup de débutants l'ignorent.",
"<strong>5. L'encours</strong>, signe de solidité du fonds. <strong>6. Le niveau de risque</strong>, noté de 1 à 7. Un fonds d'actions mondiales est en général en haut de l'échelle. C'est normal.",
"<strong>7. Les enveloppes autorisées</strong> : PEA, assurance-vie, PER. <strong>8. Le scénario défavorable.</strong> C'est la partie la plus utile, et la moins lue. Elle chiffre ce que tu perdrais si les choses tournaient mal. <strong>Si ce chiffre te fait peur, le produit n'est pas fait pour toi.</strong> C'est exactement à ça qu'il sert.",
"Un mot sur les performances passées. Elles sont sur les fiches, avec un avertissement. Et cet avertissement est justifié : <u>choisir un fonds parce qu'il a bien marché ces 3 dernières années, c'est l'erreur la plus courante.</u> Ce qui a bien marché récemment n'a aucune raison particulière de continuer.",
"Regarde plutôt les frais, l'écart de suivi et l'encours. Ce sont les seules choses dont tu peux être sûr à l'avance."
],
quiz:[
{q:"Quel document lire avant tout achat ?",opts:["La brochure publicitaire","Le document d'informations clés, gratuit et standard","Le rapport annuel","L'avis du courtier"],correct:1,
explain:"Quelques pages, toujours le même modèle, et 8 infos à vérifier."},
{q:"Sur un fonds mondial, que subis-tu en plus des variations du marché ?",opts:["Un risque de crédit","Les variations des monnaies, sauf mention contraire","Un risque d'impôt","Rien de plus"],correct:1,
explain:"Ça peut jouer dans les 2 sens, et beaucoup de débutants l'ignorent."},
{q:"Quelle est l'erreur la plus courante pour choisir un fonds ?",opts:["Regarder les frais","Le choisir parce qu'il a bien marché ces 3 dernières années","Vérifier l'encours","Comparer les indices"],correct:1,
explain:"Ce qui a bien marché récemment n'a aucune raison particulière de continuer."}
],
action:"Télécharge le document d'informations clés d'un fonds. Remplis les 8 points sur une feuille. 15 minutes la première fois, 3 minutes ensuite. C'est cette grille qui te servira à juger tous les produits qu'on te proposera."
},
{module:"Module 4 — Investir régulièrement", title:"Pourquoi la régularité bat le timing", duration:"5 min",
script:[
"Investir la même somme à date fixe, que les marchés soient hauts ou bas, ça s'appelle l'investissement programmé. On parle souvent de DCA, son sigle anglais. C'est la méthode qu'on conseille le plus aux débutants. Voyons ce qu'elle fait vraiment.",
"Le principe : tu verses le même montant à la même date, sans te demander si c'est le bon moment. Quand les prix sont hauts, tu achètes moins de parts. Quand ils sont bas, tu en achètes plus. <strong>Sans rien décider, tu achètes plus quand c'est moins cher.</strong>",
"On présente souvent cette méthode comme magique. Ce n'est pas le cas. <u>En moyenne, investir une somme d'un coup donne un résultat un peu meilleur</u>, simplement parce que l'argent travaille plus longtemps. Ce n'est donc pas la meilleure méthode sur le papier.",
"<figure class=\"schema\"><svg viewBox=\"0 0 700 276\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"20\" y=\"24\" width=\"190\" height=\"54\" rx=\"9\" fill=\"#F0F1F7\" stroke=\"#171C45\" stroke-width=\"1.5\"/><text x=\"115\" y=\"47\" text-anchor=\"middle\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14.5\" font-weight=\"600\" fill=\"#171C45\">Versement fixe</text><text x=\"115\" y=\"65\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\" fill=\"#6B7094\">chaque mois</text><path d=\"M210 51 C 270 51, 270 66, 330 66\" fill=\"none\" stroke=\"#A3213D\" stroke-width=\"1.8\"/><circle cx=\"330\" cy=\"66\" r=\"4\" fill=\"#A3213D\"/><rect x=\"344\" y=\"43\" width=\"336\" height=\"46\" rx=\"8\" fill=\"#FAEAEE\" stroke=\"#A3213D\" stroke-width=\"1.3\"/><text x=\"360\" y=\"64\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"14\" font-weight=\"600\" fill=\"#171C45\">Marché haut</text><text x=\"664\" y=\"64\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"13\" fill=\"#A3213D\">achète moins de parts</text><path d=\"M210 51 C 270 51, 270 128, 330 128\" fill=\"none\" stroke=\"#2B3A8F\" stroke-width=\"1.8\"/><circle cx=\"330\" cy=\"128\" r=\"4\" fill=\"#2B3A8F\"/><rect x=\"344\" y=\"105\" width=\"336\" height=\"46\" rx=\"8\" fill=\"#E9EBF7\" stroke=\"#2B3A8F\" stroke-width=\"1.3\"/><text x=\"360\" y=\"126\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"14\" font-weight=\"600\" fill=\"#171C45\">Marché moyen</text><text x=\"664\" y=\"126\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"13\" fill=\"#2B3A8F\">achète normalement</text><path d=\"M210 51 C 270 51, 270 190, 330 190\" fill=\"none\" stroke=\"#C27C00\" stroke-width=\"1.8\"/><circle cx=\"330\" cy=\"190\" r=\"4\" fill=\"#C27C00\"/><rect x=\"344\" y=\"167\" width=\"336\" height=\"46\" rx=\"8\" fill=\"#FDF2DA\" stroke=\"#C27C00\" stroke-width=\"1.3\"/><text x=\"360\" y=\"188\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"14\" font-weight=\"600\" fill=\"#171C45\">Marché bas</text><text x=\"664\" y=\"188\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"13\" fill=\"#C27C00\">achète plus de parts</text></svg><figcaption>Mécaniquement, tu achètes davantage quand c'est moins cher, sans avoir rien décidé.</figcaption></figure>",
"Son vrai avantage est ailleurs, et il est énorme. <strong>Elle supprime la décision.</strong> Or c'est en décidant que les particuliers perdent de l'argent : en attendant un « bon moment » qui ne vient jamais, en arrêtant de verser pendant les baisses, en mettant tout d'un coup après une hausse.",
"Elle apporte aussi quelque chose que les chiffres ne mesurent pas : <strong>la tranquillité.</strong> Quelqu'un qui verse 150 € par mois ne vit pas une baisse de 20 % comme quelqu'un qui a placé 20 000 € la semaine d'avant. La meilleure méthode sur le papier n'est pas celle qu'on tient dans la vraie vie.",
"Un point souvent mal compris : <strong>investir chaque mois ne protège pas des pertes.</strong> Si les marchés baissent longtemps, ton placement baisse aussi. Ce que ça évite, c'est de tout miser sur une seule date, qui pourrait être la pire.",
"En pratique : si tu as une grosse somme et que tu es sûr de ne pas paniquer, l'investir petit à petit sur 6 à 12 mois est un bon compromis. Si tu épargnes mois après mois, comme la plupart des gens, <strong>investir chaque mois n'est pas un choix parmi d'autres. C'est le seul qui colle à ta situation.</strong>"
],
quiz:[
{q:"Que se passe-t-il quand on investit la même somme chaque mois ?",opts:["On est sûr de gagner","On achète plus de parts quand les prix sont bas","On paie moins de frais","On est protégé des baisses"],correct:1,
explain:"Et ça, sans rien décider. C'est tout son intérêt."},
{q:"Investir chaque mois, est-ce la meilleure méthode sur le papier ?",opts:["Oui, toujours","Non, investir d'un coup donne en moyenne un résultat un peu meilleur","Oui, sur 20 ans","Ça dépend du fonds"],correct:1,
explain:"Son vrai avantage : il supprime la décision, là où les particuliers perdent de l'argent."},
{q:"Qu'est-ce qu'investir chaque mois ne fait PAS ?",opts:["Supprimer la décision","Protéger des pertes quand les marchés baissent longtemps","Lisser le prix d'achat","Faciliter l'automatique"],correct:1,
explain:"Il évite de tout miser sur une seule date. Ce n'est pas une protection."}
],
action:"Ouvre le simulateur de versements réguliers dans les outils NiouDem. Mets le montant que tu envisages, sur 20 ans. Puis refais le calcul sur 15 ans. La différence, c'est ce que coûte d'attendre 5 ans."
},
{module:"Module 4 — Investir régulièrement", title:"Calculer ton montant mensuel", duration:"5 min",
script:[
"Le bon montant n'est pas le plus gros possible. C'est celui que tu pourras verser sans t'arrêter pendant des années, même un mois difficile.",
"Le calcul se fait en 3 étapes, avec ce que tu as établi dans la formation sur le budget. <strong>1.</strong> Prends ce que tu épargnes chaque mois. <strong>2.</strong> Retire ce qui va encore à ton épargne de secours, si elle n'est pas complète, et ce que tu mets de côté pour tes dépenses annuelles. <strong>3.</strong> Ce qui reste, c'est ce que tu peux investir.",
"Ensuite, une règle de prudence que je te conseille vraiment : <strong>commence à 70 % de ce montant.</strong> Si le calcul donne 200 €, commence à 140 €. La marge absorbera les mois imprévus sans arrêter tes versements. <u>Augmenter, c'est facile. Baisser, on le vit comme un échec.</u>",
"3 vérifications avant de programmer quoi que ce soit. <strong>Ton épargne de secours est-elle faite ?</strong> Sinon, cet argent doit d'abord aller là. <strong>Tes dettes chères sont-elles remboursées ?</strong> Rembourser un crédit à 6 %, c'est gagner 6 % à coup sûr. Peu de placements font aussi bien avec certitude. <strong>Les frais du courtier sont-ils adaptés ?</strong> Verser 30 € par mois avec 3 € de frais, c'est perdre 10 % dès le départ.",
"Pour ce dernier point, une solution simple : si tes frais sont élevés par rapport à ton montant, <strong>verse tous les 2 ou 3 mois au lieu de chaque mois.</strong> Tu restes régulier, tu divises tes frais par 2 ou 3, et ça ne change presque rien au résultat.",
"Faut-il augmenter avec le temps ? Oui. La meilleure façon, tu la connais depuis la formation sur le budget : <strong>envoie la moitié de chaque augmentation de salaire vers tes versements</strong>, avant de t'habituer à la dépenser. Ton niveau de vie ne baisse jamais, et ce que tu investis grandit sans effort.",
"Retiens ceci : <strong>50 € versés pendant 15 ans battent 300 € abandonnés au bout de 8 mois.</strong> Cette phrase résume tout ce module."
],
quiz:[
{q:"À combien du montant calculé faut-il commencer ?",opts:["100 %","Environ 70 %","50 %","120 %"],correct:1,
explain:"La marge absorbe les mois imprévus. Augmenter est facile, baisser est vécu comme un échec."},
{q:"Que faire si les frais sont élevés par rapport à ton montant ?",opts:["Changer de fonds","Verser tous les 2 ou 3 mois au lieu de chaque mois","Renoncer à investir","Augmenter fortement le montant"],correct:1,
explain:"Tu restes régulier, tes frais sont divisés, et le résultat change à peine."},
{q:"Comment augmenter ses versements sans effort ?",opts:["+10 % chaque année","Envoyer la moitié de chaque augmentation de salaire vers les versements","Moins sortir","Attendre une prime"],correct:1,
explain:"Ton niveau de vie ne baisse jamais, et tu investis plus à chaque hausse de salaire."}
],
action:"Calcule ce que tu peux investir, prends-en 70 %, et fais les 3 vérifications. Si l'une n'est pas bonne, note laquelle. C'est ton prochain objectif, et il passe avant l'investissement."
},
{module:"Module 4 — Investir régulièrement", title:"Automatiser tes investissements", duration:"5 min",
script:[
"Un versement automatique transforme une bonne intention en résultat. Voici comment le mettre en place. Et surtout, ce qu'il faut prévoir pour qu'il tienne pendant les périodes difficiles.",
"Il y a 2 niveaux d'automatique, à ne pas confondre. <strong>Le virement</strong> déplace l'argent de ta banque vers ton compte d'investissement. <strong>L'achat programmé</strong> achète vraiment les parts. Certains courtiers proposent les 2, d'autres seulement le premier.",
"Si ton courtier ne propose pas l'achat programmé, tu achèteras à la main. Ce n'est pas un problème, à une condition : <u>fixe une date précise qui revient chaque mois dans ton agenda</u>, par exemple le 5. Et traite-la comme un rendez-vous, pas comme une vague intention.",
"L'organisation se règle une seule fois. Le lendemain de la paie, un virement part vers ton compte d'investissement. 3 jours plus tard, le temps que l'argent arrive, l'achat se fait ou tu le passes. Ce décalage évite le raté le plus courant : un achat programmé qui échoue parce que l'argent n'est pas encore arrivé.",
"Voici le point le plus important, et il n'est pas technique. <strong>Écris dès aujourd'hui ce que tu feras quand les marchés baisseront de 30 %.</strong> Pas « si », « quand » : ça arrive plusieurs fois par décennie. Dans la très grande majorité des cas, la réponse à écrire est : <em>« je continue à verser sans rien changer »</em>.",
"Cette phrase écrite au calme vaut bien plus que n'importe quelle analyse faite dans la panique. <u>C'est pendant les baisses que tes versements achètent le plus de parts.</u> Ce sont elles qui font ton résultat des années suivantes. Arrêter à ce moment-là, c'est perdre tout l'intérêt de la méthode.",
"Dernière précaution : <strong>écris une règle de pause</strong>, plutôt que d'improviser. Par exemple : « J'arrête mes versements seulement si mon épargne de secours passe sous 1 mois de dépenses. Je reprends dès qu'elle est refaite. » Une règle écrite t'empêche de confondre un vrai problème personnel avec une simple peur des marchés."
],
quiz:[
{q:"Pourquoi acheter quelques jours après le virement ?",opts:["Pour un meilleur prix","Pour laisser l'argent arriver et éviter un achat raté","Pour payer moins de frais","C'est obligatoire"],correct:1,
explain:"C'est le raté le plus courant : l'argent n'est pas encore arrivé quand l'achat se lance."},
{q:"Que faut-il écrire avant même de commencer ?",opts:["Un objectif de gain","Ce qu'on fera quand les marchés baisseront de 30 %","La liste des fonds à suivre","Quand on revendra"],correct:1,
explain:"Pas « si », « quand » : ça arrive plusieurs fois par décennie. Ce qu'on écrit au calme vaut mieux que ce qu'on décide dans la panique."},
{q:"À quoi sert une règle de pause écrite ?",opts:["À vendre au bon moment","À ne pas confondre un vrai problème personnel avec une peur des marchés","À payer moins d'impôts","À changer de courtier"],correct:1,
explain:"Sans règle, on arrête pour de mauvaises raisons, juste quand il faudrait continuer."}
],
action:"Ce soir, écris 2 phrases et range-les avec tes papiers. Ce que tu feras si les marchés baissent de 30 %. Et dans quels cas précis tu mettrais tes versements en pause. Elles ne serviront pas cette année. Mais elles vaudront cher le jour venu."
},
{module:"Module 4 — Investir régulièrement", title:"Ce que produisent 10 ans de versements", duration:"5 min",
script:[
"Cette leçon met des chiffres sur la méthode. Avec un avertissement plus important que les chiffres : <strong>aucune simulation ne se passe exactement comme prévu.</strong> Elles servent à comprendre comment ça marche, jamais à prédire un résultat.",
"Prenons 150 € par mois pendant 10 ans. Tu sors 18 000 € de ta poche. Si le placement rapporte 5 % par an, tu arrives à environ 23 300 €. <strong>Environ 5 300 € viennent donc du temps</strong>, sans aucun effort de plus.",
"Sur 20 ans, avec le même versement : 36 000 € versés, et environ 61 700 € à la fin. <u>La part due au temps passe de 23 % à 42 % du total.</u> C'est le point clé : l'effet ne grandit pas au même rythme que la durée. Il accélère.",
"Voici la comparaison la plus parlante. Refais-la toi-même dans l'outil. Quelqu'un qui verse 150 € pendant 20 ans obtient plus que quelqu'un qui verse 300 € pendant 10 ans. Pourtant, les 2 ont sorti la même somme. <strong>La durée compte plus que le montant.</strong>",
"Maintenant, soyons honnêtes. <strong>Un gain de 5 % chaque année, sans variation, ça n'existe pas.</strong> En vrai, il y a des années à +20 % et des années à −25 %. Et l'ordre dans lequel elles arrivent change le résultat. Une grosse baisse au début, quand tu as peu d'argent placé, pèse peu. La même baisse 2 ans avant la fin pèse énormément.",
"Ça a une conséquence pratique, qu'on verra au module suivant : <u>on réduit le risque petit à petit à mesure que la date approche.</u> Justement pour cette raison.",
"Retiens 2 choses. <strong>Le temps fait l'essentiel du travail.</strong> Mieux vaut commencer tôt avec peu que tard avec beaucoup. Et <strong>une simulation n'est pas une prévision.</strong> Elle montre comment ça marche. Si quelqu'un te présente un chiffre de simulation comme un objectif sûr, il te vend quelque chose."
],
quiz:[
{q:"Que montre la comparaison 150 € sur 20 ans contre 300 € sur 10 ans ?",opts:["C'est pareil","La durée compte plus que le montant","Le montant compte plus","Ça dépend des frais"],correct:1,
explain:"La même somme sortie de ta poche rapporte plus quand elle est étalée sur plus longtemps."},
{q:"Pourquoi une baisse en fin de parcours pèse-t-elle plus qu'au début ?",opts:["Les frais augmentent avec le temps","Parce qu'il y a beaucoup plus d'argent placé","Parce que les impôts changent","Ce n'est pas vrai"],correct:1,
explain:"C'est pour ça qu'on réduit le risque petit à petit quand la date approche."},
{q:"Que vaut une simulation ?",opts:["Une prévision fiable","Un exemple pour comprendre, jamais une prévision","Une promesse du courtier","Une moyenne garantie"],correct:1,
explain:"Si quelqu'un présente un chiffre de simulation comme un objectif sûr, il te vend quelque chose."}
],
action:"Ouvre le simulateur de versements réguliers et fais 3 essais. Ton montant sur 10 ans. Puis sur 20 ans. Puis avec 3 % au lieu de 5 %. Le troisième essai est le plus parlant : il montre à quel point le résultat dépend d'une seule hypothèse."
},
{module:"Module 5 — Construire son portefeuille", title:"Définir ton profil de risque", duration:"5 min",
script:[
"On présente partout le profil de risque comme une question de caractère. C'est une erreur. <strong>Il dépend d'abord de ta situation, et seulement ensuite de ton caractère.</strong>",
"3 éléments le décident. Regarde-les dans cet ordre.",
"<strong>1. Ton délai.</strong> C'est le plus important. Dans combien de temps auras-tu besoin de cet argent ? Dans moins de 3 ans, pas d'actions, quel que soit ton caractère. Au-delà de 10 ans, une baisse passagère n'est plus un problème.",
"<strong>2. Ce que tu peux encaisser.</strong> Ça ne se mesure pas en émotions, mais en euros. Que se passe-t-il concrètement si cet argent perd 40 % pendant 3 ans ? Si la réponse est <em>« rien, je n'y touche pas »</em>, tu peux encaisser. Si c'est <em>« je ne peux plus acheter mon logement »</em>, non.",
"<strong>3. Ce que tu supportes moralement.</strong> C'est le seul point qui dépend de ton caractère, et il compte. Quelqu'un qui ne dort plus quand son placement baisse finira par vendre au pire moment. <u>Le meilleur placement sur le papier est un mauvais placement si tu ne le supportes pas.</u>",
"Voici le test le plus honnête que je connaisse, meilleur que n'importe quel questionnaire : <strong>repense à ce que tu as fait en mars 2020, ou pendant la dernière baisse que tu as vécue.</strong> As-tu vendu, attendu, ou acheté plus ? Ce qu'on a fait dit mieux ce qu'on fera que ce qu'on pense faire.",
"Si tu n'as jamais vécu de baisse, même méthode que pour le premier achat : <strong>commence petit et observe comment tu réagis.</strong> Placer 500 € et vivre une baisse de 15 % t'en apprendra plus sur toi qu'une heure de questionnaire.",
"Une mise en garde. Les questionnaires des courtiers sont là pour te protéger. Mais on les remplit souvent avec trop d'optimisme, car un profil « prudent » donne accès à moins de produits. <strong>Te surestimer dans ce questionnaire, c'est désactiver une protection faite pour toi.</strong>"
],
quiz:[
{q:"Qu'est-ce qui compte le plus dans le profil de risque ?",opts:["Le caractère","Le délai avant d'avoir besoin de l'argent","Le montant investi","L'âge"],correct:1,
explain:"Dans moins de 3 ans, pas d'actions, quel que soit ton caractère."},
{q:"Comment savoir ce que tu peux encaisser ?",opts:["Avec un questionnaire en ligne","En euros : que se passe-t-il si cet argent perd 40 % pendant 3 ans ?","Selon son salaire","Seulement selon son expérience"],correct:1,
explain:"Ça dépend de ce que cet argent devait financer, et quand."},
{q:"Qu'est-ce qui prédit le mieux ta réaction future ?",opts:["Ce que tu penses faire","Ce que tu as fait pendant la dernière baisse","Le profil déclaré au courtier","Tes connaissances"],correct:1,
explain:"Ce qu'on a fait dit mieux ce qu'on fera. C'est pour ça qu'il vaut mieux commencer petit."}
],
action:"Réponds par écrit à une seule question : si ce que tu investis perdait 40 % pendant 3 ans, qu'est-ce que ça changerait concrètement dans ta vie ? La réponse te donne ton vrai délai, et donc tout le reste."
},
{module:"Module 5 — Construire son portefeuille", title:"Répartir selon ton horizon", duration:"5 min",
script:[
"Répartir son argent, c'est décider quelle part va dans quel type de placement. C'est cette décision qui explique l'essentiel de ton résultat. Bien plus que le choix des fonds eux-mêmes.",
"3 grandes familles suffisent. <strong>Les placements sans risque de perte</strong> : livrets, fonds en euros. <strong>Les obligations</strong> : des prêts faits à des États ou des entreprises. Elles bougent moins que les actions, mais ne sont pas sans risque. <strong>Les actions</strong> : elles bougent le plus, et rapportent le plus sur la durée.",
"Le principe tient en une phrase : <strong>plus la date approche, moins il faut d'actions.</strong> Ce n'est pas une question de sagesse. C'est une question de temps pour se remettre d'une baisse.",
"<figure class=\"schema\"><svg viewBox=\"0 0 700 286\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"20\" y=\"202\" width=\"250\" height=\"52\" rx=\"9\" fill=\"#E9EBF7\" stroke=\"#2B3A8F\" stroke-width=\"1.4\"/><circle cx=\"46\" cy=\"228\" r=\"12\" fill=\"#2B3A8F\"/><text x=\"46\" y=\"232\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\" fill=\"#fff\">1</text><text x=\"70\" y=\"224\" font-family=\"Newsreader, Georgia, serif\" font-size=\"15\" font-weight=\"600\" fill=\"#171C45\">Moins de 3 ans</text><text x=\"70\" y=\"241\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">Aucune action. Supports sans risque de perte.</text><rect x=\"20\" y=\"138\" width=\"383\" height=\"52\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#DCDEEA\" stroke-width=\"1.4\"/><circle cx=\"46\" cy=\"164\" r=\"12\" fill=\"#DCDEEA\"/><text x=\"46\" y=\"168\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\" fill=\"#fff\">2</text><text x=\"70\" y=\"160\" font-family=\"Newsreader, Georgia, serif\" font-size=\"15\" font-weight=\"600\" fill=\"#171C45\">3 à 8 ans</text><text x=\"70\" y=\"177\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">Part d'actions minoritaire, complétée d'obligations.</text><rect x=\"20\" y=\"74\" width=\"517\" height=\"52\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#DCDEEA\" stroke-width=\"1.4\"/><circle cx=\"46\" cy=\"100\" r=\"12\" fill=\"#DCDEEA\"/><text x=\"46\" y=\"104\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\" fill=\"#fff\">3</text><text x=\"70\" y=\"96\" font-family=\"Newsreader, Georgia, serif\" font-size=\"15\" font-weight=\"600\" fill=\"#171C45\">8 à 15 ans</text><text x=\"70\" y=\"113\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">Part d'actions majoritaire défendable.</text><rect x=\"20\" y=\"10\" width=\"650\" height=\"52\" rx=\"9\" fill=\"#FDF2DA\" stroke=\"#C27C00\" stroke-width=\"1.4\"/><circle cx=\"46\" cy=\"36\" r=\"12\" fill=\"#C27C00\"/><text x=\"46\" y=\"40\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\" fill=\"#fff\">4</text><text x=\"70\" y=\"32\" font-family=\"Newsreader, Georgia, serif\" font-size=\"15\" font-weight=\"600\" fill=\"#171C45\">Plus de 15 ans</text><text x=\"70\" y=\"49\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">Allocation très largement en actions.</text></svg><figcaption>L'horizon détermine l'allocation, pas le tempérament. Ce sont des repères à ajuster, pas une norme.</figcaption></figure>",
"Voici des repères, à adapter, pas à appliquer à la lettre. <u>Moins de 3 ans : pas d'actions.</u> L'argent reste sans risque de perte. De 3 à 8 ans : une petite part d'actions, avec des obligations et des livrets. Plus de 8 ans : une majorité d'actions se défend. Plus de 15 ans, sans projet prévu : presque tout en actions se justifie.",
"Une vieille règle dit : mets en actions 100 moins ton âge, en pourcentage. Elle est simple, mais imprécise : <strong>elle ignore complètement le vrai délai du projet.</strong> Quelqu'un de 55 ans qui prépare un héritage pour ses enfants a un délai de 30 ans, pas de 10.",
"2 erreurs fréquentes. <strong>La fausse diversification</strong> : avoir 5 fonds qui suivent tous des actions mondiales, ce n'est pas diversifier. C'est acheter 5 fois la même chose, avec 5 fois des frais. <strong>Ne regarder que son compte d'investissement</strong>, en oubliant que ton épargne de secours, ton épargne projet et ton éventuel logement font aussi partie de ce que tu possèdes.",
"Regarde toujours ta répartition sur <strong>tout ce que tu possèdes</strong>, pas seulement sur ton compte d'investissement. Quelqu'un qui a 100 % d'actions sur son compte-titres mais 3 ans de dépenses sur un livret n'est pas à 100 % en actions."
],
quiz:[
{q:"Quel principe guide la répartition ?",opts:["Plus on est jeune, plus on prend de risque","Plus la date approche, moins il faut d'actions","Toujours 50 % d'actions","Ça dépend des frais"],correct:1,
explain:"C'est une question de temps pour se remettre d'une baisse, pas de sagesse."},
{q:"Qu'est-ce que la fausse diversification ?",opts:["Investir dans un seul pays","Avoir 5 fonds qui suivent tous des actions mondiales","Avoir des obligations","Investir petit à petit"],correct:1,
explain:"C'est acheter 5 fois la même chose, avec 5 fois des frais."},
{q:"Sur quoi regarder sa répartition ?",opts:["Sur le compte d'investissement seul","Sur tout ce qu'on possède","Enveloppe par enveloppe","Courtier par courtier"],correct:1,
explain:"Avec 3 ans de dépenses sur un livret, on n'est pas à 100 % en actions, même si le compte-titres l'est."}
],
action:"Liste tout ce que tu possèdes, y compris ton épargne de secours et ton épargne projet. Calcule la part vraiment placée en actions. Elle est sûrement bien plus faible que tu ne le crois."
},
{module:"Module 5 — Construire son portefeuille", title:"Le rééquilibrage annuel", duration:"5 min",
script:[
"Une répartition choisie aujourd'hui se déforme toute seule. Si les actions montent plus vite que le reste, leur part grossit. Ton placement devient plus risqué que prévu, sans que tu aies rien décidé.",
"Rééquilibrer, c'est revenir de temps en temps aux proportions choisies. Par exemple : tu visais 70 % d'actions et tu es à 80 %. Tu peux vendre des actions. Ou, mieux, <strong>envoyer tes prochains versements vers ce qui a baissé</strong>, jusqu'à revenir à ta cible.",
"La seconde méthode est bien meilleure, pour 2 raisons. Tu ne vends rien, <u>donc pas d'impôts et pas de frais.</u> Et tu le fais déjà, puisque tu verses chaque mois.",
"Tous les combien ? <strong>Une fois par an suffit.</strong> Et c'est même mieux que plus souvent. Rééquilibrer trop souvent multiplie les frais et les impôts, pour un gain qui n'est pas prouvé. Autre option : ne rééquilibrer que si l'écart dépasse un seuil, par exemple 5 points. Tu évites d'agir pour rien.",
"Le rééquilibrage a un effet qui surprend : <strong>il t'oblige à vendre ce qui a monté et à acheter ce qui a baissé.</strong> C'est l'inverse de ce que ton instinct te dit. C'est justement pour ça qu'il faut le faire à date fixe, pas au feeling.",
"Soyons honnêtes sur ses limites. <u>Rééquilibrer ne fait pas forcément gagner plus.</u> Sur la durée, ne rien toucher a parfois fait mieux. Ce qu'il fait à coup sûr, c'est <strong>garder ton niveau de risque à celui que tu as choisi.</strong> C'est son vrai rôle.",
"Un conseil : fais-le pendant ton point annuel, celui de la formation sur l'épargne. Une seule séance d'1 heure par an pour rééquilibrer, vérifier les frais et contrôler ton épargne de secours."
],
quiz:[
{q:"Pourquoi une répartition se déforme-t-elle toute seule ?",opts:["À cause des frais","Parce que les placements ne montent pas au même rythme","À cause de l'inflation","Parce que les indices changent"],correct:1,
explain:"La part de ce qui monte le plus grossit. Ton placement devient plus risqué que prévu."},
{q:"Quelle façon de rééquilibrer est la meilleure ?",opts:["Vendre ce qui a monté","Envoyer ses prochains versements vers ce qui a baissé","Tout vendre et racheter","Changer de fonds"],correct:1,
explain:"Pas de vente, donc pas d'impôts ni de frais. Et tu verses déjà chaque mois."},
{q:"Quel est le vrai rôle du rééquilibrage ?",opts:["Gagner plus","Garder son niveau de risque à celui qu'on a choisi","Payer moins de frais","Payer moins d'impôts"],correct:1,
explain:"Il ne fait pas forcément gagner plus. Mieux vaut le savoir avant de s'y tenir."}
],
action:"Ajoute une ligne « rééquilibrage » à ton rendez-vous annuel. Note à côté ta répartition cible, en pourcentages. Sans cible écrite, il n'y a rien à rééquilibrer."
},
{module:"Module 5 — Construire son portefeuille", title:"Écrire ta règle d'investissement", duration:"5 min",
script:[
"Cette leçon produit le document le plus utile de toute la formation : ta règle d'investissement, écrite par toi, en 10 lignes. C'est aussi le document central de l'accompagnement NiouDem. Et tu peux très bien l'écrire seul.",
"Pourquoi l'écrire ? Parce qu'une décision prise au calme et écrite résiste à une émotion forte. <strong>Sans document, tu improviseras au pire moment.</strong> Et tu improviseras mal, comme l'a montré la formation sur la psychologie.",
"Ta règle contient 10 points, une phrase chacun. <strong>1.</strong> Pourquoi j'investis, avec un objectif précis. <strong>2.</strong> Dans combien d'années j'aurai besoin de cet argent. <strong>3.</strong> Combien je verse chaque mois. <strong>4.</strong> L'enveloppe utilisée. <strong>5.</strong> Ce que j'achète, en 1 ou 2 lignes maximum.",
"<strong>6.</strong> Ma répartition cible, en pourcentages. <strong>7.</strong> Ce que je fais si les marchés baissent de 30 %. La réponse est presque toujours : <em>je continue à verser sans rien changer</em>. <strong>8.</strong> Ce que je fais si un placement monte très fort : je rééquilibre à la date prévue, je n'achète pas plus dans l'euphorie.",
"<strong>9.</strong> Dans quels cas précis je mets mes versements en pause. Toujours selon ma situation personnelle, jamais selon les marchés. <strong>10.</strong> Quand je relis ce document : une fois par an, à date fixe.",
"Une règle sur la forme : <u>ce qui ne tient pas sur une page ne sera pas relu.</u> N'essaie pas de tout prévoir. Une règle courte et suivie bat une stratégie détaillée et oubliée.",
"Un test avant de la ranger. Relis-la et demande-toi : <strong>quelqu'un d'autre pourrait-il l'appliquer à ma place sans me poser de question ?</strong> Si non, il reste des zones floues. Et c'est justement par là que l'émotion s'engouffre.",
"Range ce document là où tu le retrouveras. Et surtout, <strong>relis-le avant chaque décision importante.</strong> Dans 5 ans, tu verras que sa plus grande utilité n'aura pas été de te guider, mais de t'empêcher d'agir."
],
quiz:[
{q:"Pourquoi écrire sa règle d'investissement ?",opts:["Pour la montrer à son courtier","Parce qu'une décision prise au calme résiste à une émotion forte","C'est obligatoire","Pour calculer ses impôts"],correct:1,
explain:"Sans document, on improvise au pire moment. Et on improvise mal."},
{q:"Quelle longueur pour ce document ?",opts:["Au moins 5 pages","Une page maximum, sinon on ne le relit pas","Un format imposé par l'AMF","Mis à jour chaque mois"],correct:1,
explain:"Une règle courte et suivie bat une stratégie détaillée et oubliée."},
{q:"Comment vérifier que ton document est bon ?",opts:["Le faire valider par un pro","Quelqu'un d'autre pourrait-il l'appliquer sans poser de question ?","Simuler ses gains","Le comparer au questionnaire du courtier"],correct:1,
explain:"Les zones floues, c'est par là que l'émotion s'engouffre le jour venu."}
],
action:"Écris tes 10 lignes ce soir, sur une seule page. Ne cherche pas la perfection. Une version imparfaite écrite aujourd'hui vaut mieux qu'une version parfaite jamais écrite. Tu la reverras à ton point annuel."
},
{module:"Module 6 — Tenir dans la durée", title:"Les 5 erreurs qui reviennent toujours", duration:"5 min",
script:[
"Ces 5 erreurs expliquent l'essentiel des pertes des particuliers. Aucune ne vient d'un manque d'intelligence. Toutes viennent de réflexes qu'on peut prévoir.",
"<strong>Erreur 1 : attendre le bon moment.</strong> Attendre une baisse pour entrer, ça finit souvent par ne jamais entrer. Puis par entrer après une hausse, par peur de rater le train. <u>Le temps passé hors du marché coûte plus cher qu'un mauvais prix d'entrée.</u> C'est mesuré.",
"<strong>Erreur 2 : réagir aux infos.</strong> Une info qui tourne partout est déjà dans les prix quand tu la lis. Agir dessus, c'est arriver après tout le monde, en payant des frais en plus.",
"<strong>Erreur 3 : tout miser sur ce qu'on connaît.</strong> Investir seulement dans son pays, son secteur ou son entreprise donne une fausse impression de maîtrise. Le pire cas : le salarié qui place beaucoup dans sa propre entreprise. <strong>Si elle va mal, il perd son emploi et son épargne en même temps.</strong>",
"<strong>Erreur 4 : changer de stratégie tous les 6 mois.</strong> Passer d'une méthode à une autre parce que la première n'a rien donné, c'est vendre bas et acheter haut, encore et encore. Une stratégie moyenne suivie 15 ans bat une excellente stratégie changée 4 fois.",
"<strong>Erreur 5 : oublier les frais.</strong> C'est la seule chose dont tu es sûr à l'avance. 1 % de frais en plus par an réduit le résultat d'environ 12 % sur 20 ans, soit presque un quart des gains. Et personne ne t'en parlera de lui-même.",
"Ces 5 erreurs ont un point commun : <strong>elles consistent toutes à agir.</strong> C'est ce qui les rend difficiles à éviter. Ne rien faire donne l'impression de négliger son argent. Alors que c'est souvent la meilleure décision.",
"Le remède, tu le connais : <u>une règle écrite, des versements automatiques, regarder ses comptes rarement, et un rendez-vous par an.</u> Ça ne demande aucune compétence. Juste de l'avoir mis en place avant d'en avoir besoin."
],
quiz:[
{q:"Que coûte le fait d'attendre le bon moment ?",opts:["Rien, c'est prudent","Le temps passé hors du marché coûte plus cher qu'un mauvais prix d'entrée","Seulement des frais","Ça dépend des marchés"],correct:1,
explain:"Et souvent, on finit par entrer après une hausse, par peur de rater le train."},
{q:"Pourquoi le salarié qui investit dans son entreprise prend-il un gros risque ?",opts:["Les impôts sont plus lourds","Si elle va mal, il perd son emploi et son épargne en même temps","Les frais sont plus élevés","C'est interdit"],correct:1,
explain:"L'impression de maîtrise est trompeuse. C'est le risque le plus dangereux qui soit."},
{q:"Quel est le point commun des 5 erreurs ?",opts:["Un manque de connaissances","Elles consistent toutes à agir","Elles touchent les gros portefeuilles","Elles sont liées aux frais"],correct:1,
explain:"Ne rien faire donne l'impression de négliger son argent. C'est pourtant souvent la meilleure décision."}
],
action:"Relis ces 5 erreurs et note honnêtement celle qui te guette le plus. Puis écris quelle ligne de ta règle d'investissement t'en protège. Si aucune ne le fait, ta règle a un trou à boucher."
},
{module:"Module 6 — Tenir dans la durée", title:"Traverser un krach", duration:"5 min",
script:[
"Un krach n'est pas un accident rare. Ça revient régulièrement. Les marchés baissent de plus de 20 % plusieurs fois par décennie. Et une baisse de 10 % arrive en moyenne à peu près une fois par an.",
"La question n'est donc pas de savoir s'il arrivera, mais <strong>ce que tu feras ce jour-là.</strong> Et la réponse doit être écrite avant. Car au moment où ça arrive, 3 choses se passent en même temps.",
"<strong>Les médias parleront d'effondrement</strong>, parce que la peur attire l'attention. <strong>Tes proches te conseilleront de tout vendre</strong>, souvent avec sincérité. Et <strong>ton propre cerveau te présentera la vente comme raisonnable</strong>, en habillant ta peur d'arguments qui sembleront excellents.",
"Voici ce qu'il faut savoir. Jusqu'ici, les grands marchés ont toujours fini par retrouver puis dépasser leur plus haut. Ça a pris de quelques mois à plusieurs années. <u>Ceux qui ont vendu pendant les baisses ont rendu leur perte définitive, et raté la remontée.</u> Et la remontée se fait souvent en quelques journées impossibles à prévoir.",
"Il faut tout de suite ajouter : <strong>rien ne garantit que ça se répète.</strong> Ce sont des constats du passé, pas des lois. Un investisseur sérieux vit avec ce doute au lieu de le nier.",
"En pratique, 4 gestes. <strong>1. Ne regarde pas ton compte pendant la panique.</strong> Chaque coup d'œil est une occasion de craquer. <strong>2. Relis ta règle</strong>, écrite justement pour ce moment. <strong>3. Continue tes versements</strong> : ce sont eux qui achètent le plus de parts. <strong>4. Ne fais rien d'autre.</strong>",
"Une autre façon de voir les choses peut aider, et elle est vraie. <strong>Si tu es en train de te constituer un capital, une baisse est une bonne nouvelle.</strong> Tu achètes les mêmes entreprises moins cher pendant des mois. Ce n'est un problème que pour celui qui doit vendre bientôt. Et une répartition adaptée à ton délai t'évite justement cette situation."
],
quiz:[
{q:"Tous les combien les marchés baissent-ils de plus de 20 % ?",opts:["Une fois par siècle","Plusieurs fois par décennie","Tous les 30 ans","Jamais sur les grands indices"],correct:1,
explain:"Et une baisse de 10 % arrive à peu près une fois par an. Ce n'est pas un accident, c'est normal."},

const PAGE_PORTE = 'lecons-monnaie.html';

async function requireUnlock(userId){
  /* La formation d'entrée n'est jamais verrouillée : la vérifier ici
     provoquerait une redirection de la page vers elle-même, donc une
     boucle infinie. */
  if(FORMATION === 'monnaie') return true;

  const { data: badge } = await sb.from('badges')
    .select('badge_name').eq('user_id', userId).eq('badge_name','le_declic').maybeSingle();
  if(badge) return true;

  /* Garde-fou : ne jamais rediriger vers la page courante. */
  const ici = window.location.pathname.split('/').pop() || 'index.html';
  if(ici === PAGE_PORTE){
    console.warn('Verrou actif sur la page d\'entrée : redirection ignorée.');
    return true;
  }
  window.location.href = PAGE_PORTE + '?verrou=1';
  return false;
}

async function loadProgressFromServer(){
  const { data } = await sb
    .from('lesson_progress')
    .select('lesson_number, completed')
    .eq('user_id', CURRENT_USER.id)
    .eq('formation', FORMATION);
  const p = {};
  if(data){ data.forEach(function(row){ if(row.completed) p[row.lesson_number] = true; }); }
  PROGRESS_CACHE = p;
  return p;
}
function getProgress(){ return PROGRESS_CACHE; }
async function setProgressServer(lessonNumber, value){
  PROGRESS_CACHE[lessonNumber] = value;
  await sb.from('lesson_progress').upsert({
    user_id: CURRENT_USER.id,
    formation: FORMATION,
    lesson_number: lessonNumber,
    completed: value,
    completed_at: value ? new Date().toISOString() : null
  }, { onConflict: 'user_id,formation,lesson_number' });

  await majCarnet(lessonNumber, value);
}

/* Le carnet de route : l'action cochée s'inscrit dans le carnet personnel,
   la décocher l'en retire. Une erreur ici ne doit jamais bloquer la
   progression de la leçon, d'où le try/catch silencieux. */
async function majCarnet(lessonNumber, value){
  try {
    const l = LESSONS[lessonNumber - 1];
    if(!l) return;

    if(!value){
      await sb.from('carnet').delete()
        .eq('user_id', CURRENT_USER.id)
        .eq('formation', FORMATION)
        .eq('lesson_number', lessonNumber);
      return;
    }

    await sb.from('carnet').upsert({
      user_id: CURRENT_USER.id,
      formation: FORMATION,
      lesson_number: lessonNumber,
      titre: l.title || ('Leçon ' + lessonNumber),
      action: l.action || ''
    }, { onConflict: 'user_id,formation,lesson_number', ignoreDuplicates: true });
  } catch(e){
    console.warn('Carnet non mis à jour :', e);
  }
}

let current = parseInt(new URLSearchParams(location.search).get('l')) || 1;
if(current < 1) current = 1;
if(current > LESSONS.length) current = LESSONS.length;

function isUnlocked(n){
  if(n === 1) return true;
  const progress = getProgress();
  return !!progress[n-1];
}

let quizState = {};

function allQuizCorrect(l){
  for(let i=0;i<l.quiz.length;i++){ if(!quizState[i]) return false; }
  return true;
}

function renderSidebar(){
  const progress = getProgress();
  const doneCount = Object.keys(progress).filter(function(k){ return progress[k]; }).length;
  document.getElementById('navProgress').textContent = doneCount + '/' + LESSONS.length + ' leçons';

  /* Regroupement des lecons par module : c'est le module qui devient
     l'etape de l'itineraire, la lecon n'est qu'un arret. */
  const etapes = [];
  LESSONS.forEach(function(l, i){
    const nom = l.module.split(' — ')[1] || l.module;
    let e = etapes.find(function(x){ return x.nom === nom; });
    if(!e){ e = { nom: nom, lecons: [] }; etapes.push(e); }
    e.lecons.push({ n: i + 1, titre: l.title });
  });

  const etapeCourante = etapes.findIndex(function(e){
    return e.lecons.some(function(a){ return a.n === current; });
  });

  const COCHE = '<svg viewBox="0 0 24 24" fill="none"><path d="M5 12L10 17L19 7" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  let html = '<div class="itin">' +
    '<div class="itin-tete">' +
      '<div class="itin-formation">' + NOM_FORMATION + '</div>' +
      '<div class="itin-compte">Étape ' + (etapeCourante + 1) + ' sur ' + etapes.length + ' · ' + doneCount + '/' + LESSONS.length + ' leçons</div>' +
      '<div class="itin-barre"><span style="width:' + Math.round(doneCount / LESSONS.length * 100) + '%"></span></div>' +
    '</div><div class="route">';

  etapes.forEach(function(e, idx){
    const toutesFaites = e.lecons.every(function(a){ return progress[a.n]; });
    const ici = idx === etapeCourante;
    const premiereAccessible = e.lecons.find(function(a){ return isUnlocked(a.n); });
    const classe = toutesFaites ? 'faite' : (ici ? 'ici' : '');
    const borne = toutesFaites ? COCHE : String(idx + 1);
    const cible = premiereAccessible ? premiereAccessible.n : e.lecons[0].n;

    html += '<div class="etape-i ' + classe + '">' +
      '<span class="borne">' + borne + '</span>' +
      '<button class="etape-titre" onclick="goTo(' + cible + ')">' + e.nom + '</button>' +
      '<div class="etape-meta">' + e.lecons.length + ' leçon' + (e.lecons.length > 1 ? 's' : '') + '</div>';

    /* On ne deroule que l'etape ou l'on se trouve : la carte reste lisible. */
    if(ici){
      html += '<div class="arrets">';
      e.lecons.forEach(function(a){
        const fait = !!progress[a.n];
        const ouvert = isUnlocked(a.n);
        const cl = (a.n === current ? 'ici ' : '') + (fait ? 'faite ' : '') + (ouvert ? '' : 'bloque');
        html += '<div class="arret ' + cl + '" onclick="goTo(' + a.n + ')">' +
          '<span class="puce">' + COCHE + '</span><span>' + a.titre + '</span></div>';
      });
      html += '</div>';
    }
    html += '</div>';
  });

  html += '</div>' + escaleHtml() + '</div>';
  document.getElementById('sidebar').innerHTML = html;
}

function goTo(n){
  if(!isUnlocked(n)){
    alert('Termine la leçon précédente pour débloquer celle-ci.');
    return;
  }
  current = n;
  history.replaceState(null, '', '?l=' + n);
  render();
  window.scrollTo(0,0);
}

function answerQuiz(qi, oi, correct){
  if(quizState[qi]) return;
  const chosen = document.getElementById('q'+qi+'o'+oi);
  if(chosen.classList.contains('disabled')) return;

  if(oi === correct){
    for(let k=0;k<10;k++){
      const el = document.getElementById('q'+qi+'o'+k);
      if(el){ el.classList.add('disabled'); }
    }
    chosen.classList.add('correct');
    quizState[qi] = true;
    document.getElementById('exp'+qi).classList.add('show');
    const l = LESSONS[current-1];
    const quizOk = allQuizCorrect(l);
    const card = document.getElementById('actionCard');
    if(quizOk && card){
      card.style.opacity = '';
      card.style.pointerEvents = '';
      const lock = card.previousElementSibling;
      if(lock && lock.textContent.indexOf('Réponds correctement') !== -1){ lock.style.display = 'none'; }
    }
  } else {
    chosen.classList.add('wrong');
    document.getElementById('exp'+qi).classList.add('show');
    setTimeout(function(){ chosen.classList.remove('wrong'); }, 900);
  }
}

async function toggleAction(){
  const l = LESSONS[current-1];
  const progress = getProgress();
  const newValue = !progress[current];
  if(newValue && !allQuizCorrect(l)){
    alert('Réponds correctement à toutes les questions du quiz avant de valider cette leçon.');
    return;
  }
  await setProgressServer(current, newValue);
  render();

  /* La formation vient-elle de s'achever ? Si oui, on plante la borne.
     On ne la montre qu'au moment du basculement, jamais en revenant
     sur une leçon déjà validée. */
  if(newValue) verifierFinDeParcours();
}

async function verifierFinDeParcours(){
  const progress = getProgress();
  const faites = Object.keys(progress).filter(function(k){ return progress[k]; }).length;
  if(faites < LESSONS.length) return;

  let prenom = '';
  let semaines = 1;
  try {
    const { data } = await sb.from('profiles').select('prenom').eq('id', CURRENT_USER.id).maybeSingle();
    if(data && data.prenom) prenom = data.prenom;

    const { data: dates } = await sb.from('lesson_progress')
      .select('completed_at').eq('user_id', CURRENT_USER.id).eq('formation', FORMATION)
      .not('completed_at', 'is', null).order('completed_at', { ascending: true }).limit(1);
    if(dates && dates.length){
      const debut = new Date(dates[0].completed_at).getTime();
      semaines = Math.max(1, Math.round((Date.now() - debut) / (7*24*3600*1000)));
    }
  } catch(e){ console.warn('Carte : données partielles', e); }

  ouvrirCarte(FORMATION, LESSONS.length, prenom, semaines);
}

async function boot(){
  document.getElementById('main').innerHTML = '<div style="padding:60px 0;text-align:center;color:var(--ink-faint);font-size:14px;">Chargement de ta progression…</div>';
  const user = await requireAuth();
  if(!user) return;
  const unlocked = await requireUnlock(user.id);
  if(!unlocked) return;
  CURRENT_USER = user;
  await loadProgressFromServer();

  if(!isUnlocked(current)){
    let lastUnlocked = 1;
    for(let i=1;i<=LESSONS.length;i++){ if(isUnlocked(i)) lastUnlocked = i; else break; }
    current = lastUnlocked;
    history.replaceState(null, '', '?l=' + current);
  }
  render();
}
boot();
</script>
