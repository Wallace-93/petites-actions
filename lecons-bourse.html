<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --ink:#12212B;--ink-soft:#43555F;--ink-muted:#7A8A93;--ink-faint:#96A3AA;
  --bg:#FCFBF8;--bg-soft:#F5F4EE;--bg-mid:#EFF0EA;--bg-line:#DCDDD3;
  --green:#1E4B3C;--green-light:#2A6350;--green-pale:#E7EFEA;--green-bord:#BFD6C9;
  --amber:#B8862F;--amber-pale:#F6EFE0;--amber-bord:#E4D2AC;
  --violet:#4A5C6B;--violet-pale:#EDF0F2;--violet-bord:#D4DBE0;
  --coral:#A24332;--coral-pale:#F8EDEA;
  --sans:'Karla',system-ui,-apple-system,sans-serif;
  --display:'Newsreader',Georgia,serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
body{font-family:var(--sans);background:var(--bg-soft);color:var(--ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;}
a{color:inherit;}
.nav{position:sticky;top:0;z-index:200;background:rgba(255,255,255,.96);backdrop-filter:blur(20px);border-bottom:1px solid var(--bg-line);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;font-weight:800;font-size:15px;color:var(--ink);}
.nav-mark{width:26px;height:26px;border-radius:8px;background:var(--green);display:flex;align-items:center;justify-content:center;}
.nav-mark svg{width:14px;height:14px;}
.nav-back{font-size:13px;font-weight:600;color:var(--ink-muted);text-decoration:none;}
.nav-progress-pill{font-size:12px;font-weight:700;color:var(--green);background:var(--green-pale);padding:5px 12px;border-radius:100px;}
.layout{display:grid;grid-template-columns:280px 1fr;max-width:1100px;margin:0 auto;min-height:calc(100vh - 60px);}
.sidebar{border-right:1px solid var(--bg-line);background:var(--bg);padding:24px 16px;position:sticky;top:60px;align-self:start;height:calc(100vh - 60px);overflow-y:auto;}
.sb-progress-bar{height:6px;background:var(--bg-mid);border-radius:100px;overflow:hidden;margin:0 10px 18px;}
.sb-progress-fill{height:100%;background:var(--green);border-radius:100px;transition:width .3s;}
.sb-item{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:10px;cursor:pointer;margin-bottom:2px;font-size:13px;font-weight:600;color:var(--ink-muted);transition:background .15s;}
.sb-item:hover{background:var(--bg-soft);}
.sb-item.active{background:var(--green-pale);color:var(--green);}
.sb-item.done{color:var(--ink);}
.sb-item.locked{opacity:.45;cursor:not-allowed;}
.sb-item.locked:hover{background:transparent;}
.sb-check{width:20px;height:20px;border-radius:50%;background:var(--bg-mid);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink-faint);flex-shrink:0;}
.sb-item.done .sb-check{background:var(--green);color:#fff;}
.sb-item.active .sb-check{background:var(--green);color:#fff;}
.sb-module-label{font-size:10.5px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em;padding:14px 10px 6px;}
.main{padding:36px 40px 80px;max-width:720px;}
.lesson-eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green);margin-bottom:10px;}
.lesson-title{font-size:28px;font-weight:800;letter-spacing:-.03em;color:var(--ink);margin-bottom:8px;line-height:1.15;}
.lesson-meta{font-size:13px;color:var(--ink-faint);margin-bottom:32px;}
.section-label{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-muted);margin:36px 0 16px;}
.section-label .dot{width:6px;height:6px;border-radius:50%;background:var(--green);}
.section-label.quiz .dot{background:var(--violet);}
.section-label.action .dot{background:var(--amber);}
.script-text p{font-size:15.5px;font-weight:400;color:var(--ink-soft);line-height:1.75;margin-bottom:18px;}
.quiz-card{background:var(--bg);border:1px solid var(--bg-line);border-radius:16px;padding:24px;margin-bottom:14px;}
.quiz-q{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:16px;line-height:1.5;}
.quiz-opt{display:flex;align-items:flex-start;gap:12px;padding:13px 15px;border:1.5px solid var(--bg-line);border-radius:11px;margin-bottom:9px;cursor:pointer;transition:border-color .15s,background .15s;}
.quiz-opt:hover{border-color:var(--ink-faint);}
.quiz-opt.correct{border-color:var(--green);background:var(--green-pale);}
.quiz-opt.wrong{border-color:var(--coral);background:var(--coral-pale);}
.quiz-opt.disabled{cursor:default;pointer-events:none;}
.quiz-letter{width:24px;height:24px;border-radius:7px;background:var(--bg-soft);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--ink-muted);flex-shrink:0;}
.quiz-opt.correct .quiz-letter{background:var(--green);color:#fff;}
.quiz-opt.wrong .quiz-letter{background:var(--coral);color:#fff;}
.quiz-opt-text{font-size:13.5px;font-weight:500;color:var(--ink);padding-top:2px;}
.quiz-explain{display:none;font-size:13px;font-weight:400;color:var(--ink-muted);line-height:1.6;background:var(--bg-soft);border-radius:10px;padding:14px 16px;margin-top:8px;}
.quiz-explain.show{display:block;}
.quiz-explain strong{color:var(--ink);}
.action-card{background:var(--amber-pale);border:1px solid var(--amber-bord);border-radius:16px;padding:22px 24px;}
.action-text{font-size:14.5px;font-weight:500;color:var(--ink);line-height:1.65;margin-bottom:16px;}
.action-check{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;}
.action-box{width:22px;height:22px;border-radius:7px;border:2px solid var(--amber);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;transition:background .15s;}
.action-box.checked{background:var(--amber);}
.action-label{font-size:13px;font-weight:700;color:#8a6a00;}
.lesson-nav{display:flex;justify-content:space-between;align-items:center;margin-top:40px;padding-top:24px;border-top:1px solid var(--bg-line);}
.nav-btn{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border:none;cursor:pointer;font-family:var(--sans);font-size:14px;font-weight:700;padding:13px 24px;border-radius:11px;text-decoration:none;transition:background .2s;}
.nav-btn:hover{background:var(--ink-soft);}
.nav-btn.ghost{background:var(--bg-mid);color:var(--ink-muted);}
.nav-btn.ghost:hover{background:var(--bg-line);}
.completion-badge{display:none;align-items:center;gap:8px;background:var(--green-pale);color:var(--green);font-size:12.5px;font-weight:700;padding:8px 16px;border-radius:100px;margin-bottom:20px;}
.completion-badge.show{display:inline-flex;}
@media(max-width:860px){
  .layout{grid-template-columns:1fr;}
  .sidebar{position:static;height:auto;border-right:none;border-bottom:1px solid var(--bg-line);}
  .main{padding:28px 20px 60px;}
}

/* ===== Direction Encre & Laiton — surcouche typographique ===== */
body{font-family:var(--sans);letter-spacing:0;}
h1,h2,h3,h4,.hero-h1,.s-title,.cta-h2,.p-name,.mod-title,.c-title,.hc-title,
.lecon-title,.q-title,.auth-title,.perf-title,.section-title,.edu-title,.tips-title{
  font-family:var(--display);letter-spacing:-.015em;
}
.hero-h1,.s-title,.cta-h2,.auth-title{font-weight:500;letter-spacing:-.018em;line-height:1.16;}
h3,h4,.p-name,.mod-title,.c-title,.hc-title,.lecon-title{font-weight:600;}
.s-tag,.f-copy,.hstat-label,.stat-label,.perf-note,.order-meta,.pos-value,
.price-cell,.asset-label,.badge,.eyebrow,.nav-balance{font-family:var(--mono);}

.nav-name em,.ft-name em{font-style:normal;color:var(--amber);}

/* Mise en valeur dans le corps des lecons : le gras porte la notion a
   retenir, l italique la nuance ou le terme technique. */
.script-text strong{color:var(--ink,#12212B);font-weight:700;}
.script-text em{font-style:italic;color:var(--ink-soft,#43555F);}
.script-text u{text-decoration:none;background:linear-gradient(transparent 62%,var(--amber-pale,#F6EFE0) 62%);
  box-shadow:inset 0 -1px 0 var(--amber,#B8862F);}
.script-text p + p{margin-top:14px;}

/* ===== L'itineraire =====
   Une route verticale plutot qu'une liste : on voit d'ou l'on vient,
   ou l'on est, et ce qu'il reste. Meme vocabulaire graphique que le
   carnet de route et les emblemes. */
.itin{padding:4px 4px 24px;}
.itin-tete{padding:0 8px 16px;border-bottom:1px solid var(--bg-line);margin-bottom:16px;}
.itin-formation{font-family:var(--display);font-size:16px;font-weight:600;color:var(--ink);line-height:1.25;}
.itin-compte{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-muted);margin-top:7px;}
.itin-barre{height:4px;background:var(--bg-mid);border-radius:100px;overflow:hidden;margin-top:10px;}
.itin-barre span{display:block;height:100%;background:var(--amber);border-radius:100px;transition:width .4s cubic-bezier(.4,0,.2,1);}

/* La route */
.route{position:relative;padding-left:30px;}
.route::before{content:"";position:absolute;left:11px;top:14px;bottom:14px;width:2px;
  background:repeating-linear-gradient(var(--bg-line) 0 6px, transparent 6px 11px);}
.etape-i{position:relative;margin-bottom:6px;}
.borne{position:absolute;left:-30px;top:6px;width:24px;height:24px;border-radius:50%;
  background:var(--bg);border:2px solid var(--bg-line);display:grid;place-items:center;
  font-family:var(--mono);font-size:10px;color:var(--ink-faint);z-index:1;transition:all .2s;}
.borne svg{width:11px;height:11px;}
.etape-i.faite .borne{background:var(--amber);border-color:var(--amber);color:#fff;}
.etape-i.ici .borne{background:var(--green);border-color:var(--green);color:#fff;
  box-shadow:0 0 0 4px var(--green-pale);}
.etape-titre{display:block;width:100%;text-align:left;background:transparent;border:0;cursor:pointer;
  font-family:var(--display);font-size:14.5px;font-weight:600;color:var(--ink-soft);
  padding:7px 9px;border-radius:9px;line-height:1.3;transition:background .15s,color .15s;}
.etape-titre:hover{background:var(--bg-soft);color:var(--ink);}
.etape-i.ici .etape-titre{color:var(--green);}
.etape-i.faite .etape-titre{color:var(--ink);}
.etape-meta{font-family:var(--mono);font-size:10px;color:var(--ink-faint);padding:0 9px 4px;letter-spacing:.06em;}

/* Les lecons de l'etape en cours */
.arrets{margin:2px 0 12px;padding-left:9px;border-left:1px solid var(--bg-line);}
.arret{display:flex;align-items:flex-start;gap:9px;padding:7px 9px;border-radius:8px;cursor:pointer;
  font-size:12.8px;font-weight:500;color:var(--ink-muted);transition:background .15s;line-height:1.35;}
.arret:hover{background:var(--bg-soft);color:var(--ink);}
.arret.ici{background:var(--green-pale);color:var(--green);font-weight:700;}
.arret.faite{color:var(--ink);}
.arret.bloque{opacity:.42;cursor:not-allowed;}
.arret.bloque:hover{background:transparent;}
.puce{width:15px;height:15px;border-radius:4px;flex:none;margin-top:1px;border:1.5px solid var(--bg-line);
  display:grid;place-items:center;background:var(--bg);}
.puce svg{width:9px;height:9px;opacity:0;}
.arret.faite .puce{background:var(--amber);border-color:var(--amber);}
.arret.faite .puce svg{opacity:1;}
.arret.ici .puce{border-color:var(--green);border-style:dashed;}

/* Changer de formation sans repasser par le menu */
.escale{margin-top:22px;padding-top:16px;border-top:1px solid var(--bg-line);}
.escale-titre{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-faint);padding:0 9px 9px;}
.escale a{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;text-decoration:none;
  font-size:12.8px;color:var(--ink-soft);transition:background .15s;}
.escale a:hover{background:var(--bg-soft);color:var(--ink);}
.escale a.courante{background:var(--green-pale);color:var(--green);font-weight:700;}
.jeton{width:7px;height:7px;border-radius:50%;background:var(--bg-line);flex:none;}
.escale a.courante .jeton{background:var(--green);}
.escale a.prete .jeton{background:var(--amber);}

@media(max-width:860px){
  .itin{padding-bottom:8px;}
  .route{padding-left:26px;}
  .borne{left:-26px;}
}
@media(prefers-reduced-motion:reduce){*{transition:none !important;}}
</style>

<script>
/* ============ DONNÉES DES 24 LEÇONS — PREMIERS PAS EN BOURSE ============ */
const LESSONS = [
{module:"Module 1 — Comment fonctionne la bourse ?", title:"La bourse expliquée simplement", duration:"9 min",
script:[
"La bourse est un marché où des acheteurs et des vendeurs échangent des titres financiers, actions, obligations, fonds. Elle répond à un besoin fondamental : les entreprises ont besoin de capitaux pour se développer.",
"En achetant une action, vous devenez copropriétaire d'une fraction de l'entreprise. Si elle prospère, votre part prend de la valeur ; si elle distribue des bénéfices, vous en recevez une partie sous forme de dividendes.",
"La bourse n'est pas un casino. Un casino a une espérance négative pour le joueur. La bourse a une espérance positive sur le long terme, car les entreprises créent de la valeur et l'économie croît.",
"Sur les 100 dernières années, les marchés actions mondiaux ont progressé en moyenne de 7 à 10% par an, malgré les guerres, les crises, les krachs."
],
quiz:[
{q:"Qu'est-ce qu'une action ?",opts:["Un prêt accordé à une entreprise","Une fraction de propriété d'une entreprise donnant droit à une part des bénéfices","Un contrat d'assurance financier","Un bon de réduction"],correct:1,explain:"L'actionnaire participe aux succès de l'entreprise via la hausse du cours et les dividendes."},
{q:"Différence entre marché primaire et secondaire ?",opts:["Le primaire est réservé aux grandes entreprises","Le primaire est celui où l'entreprise lève des capitaux, le secondaire celui des échanges entre investisseurs","Le primaire concerne les obligations","Le primaire est plus sûr"],correct:1,explain:"Sur le marché secondaire, l'entreprise ne reçoit rien, ce sont des échanges entre investisseurs."},
{q:"Pourquoi la bourse a-t-elle une espérance positive contrairement à un casino ?",opts:["Les autorités protègent les investisseurs","Les entreprises créent de la valeur réelle et l'économie croît dans le temps","Les cours sont manipulés à la hausse","Les dividendes compensent toujours les pertes"],correct:1,explain:"Sur le long terme, les marchés reflètent la création de valeur réelle par les entreprises."}
],
action:"Cherche le cours du CAC 40 il y a 20 ans et compare-le à aujourd'hui. Calcule le rendement total sur cette période."
},
{module:"Module 1 — Comment fonctionne la bourse ?", title:"Pourquoi les marchés montent sur le long terme", duration:"9 min",
script:[
"Cinq raisons expliquent pourquoi les marchés actions montent sur le long terme : la croissance économique, l'innovation constante, l'inflation qui gonfle mécaniquement les bénéfices nominaux, les dividendes réinvestis, et la sélection naturelle des indices.",
"Les indices se renouvellent en permanence : les entreprises qui échouent sont retirées et remplacées par des plus performantes, rendant les indices structurellement plus performants que la moyenne.",
"Ces raisons n'éliminent pas les krachs. Un marché qui monte sur le long terme peut parfaitement perdre 30 à 50% sur quelques mois. C'est normal et prévisible.",
"Ce qui compte, c'est de comprendre que ces baisses sont temporaires et ont toujours été suivies de reprises."
],
quiz:[
{q:"Pourquoi l'inflation contribue-t-elle à la hausse des cours boursiers ?",opts:["Elle rend les obligations moins attractives","Les revenus et bénéfices des entreprises augmentent mécaniquement en valeur nominale","Les banques centrales baissent les taux","Elle ne contribue pas à la hausse"],correct:1,explain:"Les entreprises voient leurs revenus augmenter nominalement, ce qui se traduit par des cours plus élevés."},
{q:"Qu'est-ce que la « sélection naturelle » des marchés ?",opts:["Seuls les meilleurs investisseurs survivent","Les entreprises qui échouent sont retirées des indices et remplacées par de meilleures","Les marchés sélectionnent les meilleures périodes","Les petites entreprises remplacent les grandes"],correct:1,explain:"Ce mécanisme fait que les indices reflètent toujours les meilleures entreprises du moment."},
{q:"Quelle attitude adopter face à un krach pour un investisseur long terme ?",opts:["Vendre rapidement","Attendre de voir jusqu'où ça descend","Maintenir sa position, les baisses ont toujours été temporaires","Acheter des obligations"],correct:2,explain:"Les investisseurs qui ont maintenu leur position pendant les crises ont toujours été récompensés."}
],
action:"Cherche le graphique du S&P 500 sur 50 ans. Identifie les 5 plus grands krachs et note leur durée de récupération."
},
{module:"Module 1 — Comment fonctionne la bourse ?", title:"Actions, ETF et fonds", duration:"10 min",
script:[
"Une action individuelle représente une fraction de propriété d'une entreprise spécifique. Potentiel de gain élevé, mais risque de concentration important si on ne détient que quelques titres.",
"Un ETF réplique la performance d'un indice entier : en un seul titre, vous achetez une exposition à des centaines d'entreprises. Diversification instantanée, frais très bas (0,10 à 0,30% par an), liquidité totale.",
"Plus de 90% des fonds gérés activement sous-performent leur indice de référence sur 10 ans. La gestion active coûte cher en frais sans générer de surperformance durable.",
"Pour un investisseur particulier qui débute, les ETF passifs sont la meilleure option dans la grande majorité des cas."
],
quiz:[
{q:"Quel est le principal risque des actions individuelles pour un débutant ?",opts:["Les frais de transaction","La difficulté d'accès aux marchés","La concentration du risque sur peu d'entreprises","La faible liquidité"],correct:2,explain:"Si une entreprise fait faillite ou sous-performe, l'impact sur le portefeuille peut être dévastateur."},
{q:"Qu'est-ce qui distingue un ETF d'un fonds actif ?",opts:["Un ETF investit uniquement en actions","Un ETF réplique passivement un indice avec des frais bas, un fonds actif est géré avec des frais élevés","Un ETF est réservé aux professionnels","Un ETF garantit le capital"],correct:1,explain:"La gestion active génère des frais plus élevés et sous-performe en moyenne son indice sur le long terme."},
{q:"Quel pourcentage de fonds actifs sous-performe son indice sur 10 ans ?",opts:["Environ 50%","Environ 70%","Plus de 90%","Environ 30%"],correct:2,explain:"C'est l'argument principal en faveur de la gestion passive via les ETF."}
],
action:"Recherche l'ETF Amundi ou iShares MSCI World. Note ses frais annuels et compare-les à un fonds actif de ta banque."
},
{module:"Module 1 — Comment fonctionne la bourse ?", title:"Les indices boursiers", duration:"8 min",
script:[
"Un indice boursier mesure la performance d'un groupe d'actions sélectionnées selon des critères définis, un thermomètre d'un marché. Le CAC 40 mesure les 40 plus grandes capitalisations françaises, le S&P 500 les 500 plus grandes américaines, le MSCI World plus de 1500 entreprises dans 23 pays développés.",
"Ces indices servent de référence pour évaluer un portefeuille, et donnent une vision instantanée de l'état d'un marché.",
"Pour un débutant, les deux indices les plus importants sont le S&P 500 et le MSCI World, qui couvrent la majorité de la capitalisation mondiale.",
"Les grands indices sont pondérés par capitalisation boursière : dans le MSCI World, les entreprises américaines représentent environ 65% de l'indice."
],
quiz:[
{q:"À quoi sert un indice boursier ?",opts:["À fixer le prix des actions individuelles","À mesurer la performance d'un groupe d'actions sélectionnées","À garantir les rendements des fonds","À réguler les marchés"],correct:1,explain:"Il sert de thermomètre d'un marché et de référence pour évaluer un portefeuille."},
{q:"Différence entre MSCI World et MSCI ACWI ?",opts:["Le World est réservé aux professionnels","L'ACWI inclut en plus les pays émergents","Le World contient moins d'entreprises","L'ACWI est plus récent"],correct:1,explain:"Le MSCI ACWI, All Country World Index, s'étend aux pays émergents comme la Chine et le Brésil."},
{q:"Quelle est la part approximative des entreprises américaines dans le MSCI World ?",opts:["30%","50%","65%","80%"],correct:2,explain:"En raison de la pondération par capitalisation, un ETF MSCI World expose fortement à l'économie américaine."}
],
action:"Recherche les 5 premières entreprises du CAC 40 par poids, puis celles du S&P 500. Observe la différence de profil sectoriel."
},
{module:"Module 2 — Choisir son broker", title:"PEA versus CTO", duration:"10 min",
script:[
"Le PEA, créé pour encourager l'investissement en actions européennes, offre après 5 ans une exonération d'impôt sur le revenu (seuls 17,2% de prélèvements sociaux restent dus). Sans PEA, la flat tax est de 30%.",

{module:"Module 2 — Choisir son broker", title:"Comparatif des meilleurs courtiers", duration:"9 min",
script:[

"Les courtiers en ligne (Boursorama, Fortuneo, Bourse Direct) offrent des frais compétitifs. Les néo-courtiers (Trade Republic, Degiro) proposent parfois zéro frais de courtage sur les ETF, mais une offre parfois moins large.",
"Trois critères de sélection : les frais de courtage (rédhibitoires si fixes et élevés pour de petits montants), les ETF disponibles, et la régulation (AMF, ségrégation des actifs).",
"Pour commencer, Fortuneo ou Boursorama sont deux choix sûrs et bien établis en France."
],
quiz:[

{q:"Qu'est-ce que la ségrégation des actifs chez un courtier ?",opts:["La séparation selon le niveau de risque","La séparation entre actifs des clients et actifs propres du courtier","La protection contre la volatilité","La répartition automatique des actifs"],correct:1,explain:"En cas de faillite du courtier, les actifs des clients ne peuvent pas être saisis."},
{q:"Pour un investisseur à 100€/mois, quel niveau de frais fixes par ordre est rédhibitoire ?",opts:["1€","5€","10€","0,5%"],correct:2,explain:"10€ sur 100€ représentent 10% de frais immédiatement ponctionnés, clairement rédhibitoire."}
],

{module:"Module 2 — Choisir son broker", title:"Ouvrir son PEA pas à pas", duration:"8 min",
script:[

{q:"Qu'est-ce que la procédure KYC ?",opts:["Une évaluation des connaissances financières","Une vérification d'identité imposée par la réglementation","Un questionnaire de satisfaction","Une validation de la situation financière"],correct:1,explain:"Know Your Customer vise à prévenir le blanchiment d'argent et le financement du terrorisme."}

{module:"Module 2 — Choisir son broker", title:"Ouvrir votre compte", duration:"7 min",
script:[

{q:"Pourquoi explorer l'interface avant de passer son premier ordre ?",opts:["Pour tester la plateforme","Pour se familiariser et éviter les erreurs lors du premier investissement","Pour tester les délais d'exécution","Pour comparer les cours"],correct:1,explain:"Comprendre la plateforme à tête reposée évite les erreurs sous la pression d'un premier ordre réel."},

],

},
{module:"Module 3 — Les ETF", title:"Qu'est-ce qu'un ETF", duration:"10 min",
script:[
"Un ETF (Exchange Traded Fund) réplique la performance d'un indice et se négocie en continu comme une action, contrairement à un fonds traditionnel valorisé une fois par jour.",
"Trois caractéristiques : la réplication fidèle d'un indice sans chercher à le battre, la négociation en temps réel offrant liquidité, et des frais très bas (TER entre 0,10 et 0,30% contre 1 à 2% pour un fonds actif).",
"Sur 30 ans, avec 10 000€ initiaux et 7% de rendement brut, la différence entre 0,20% et 1,50% de frais annuels représente plus de 20 000€ d'écart de capital final.",
"Pour débuter, les ETF actions mondiales ou américaines sont les plus appropriés."
],
quiz:[
{q:"Qu'est-ce que le TER d'un ETF ?",opts:["Le taux d'erreur de réplication","Le Total Expense Ratio, le total des frais annuels","Le taux d'exposition au risque","Le temps d'exécution recommandé"],correct:1,explain:"C'est le principal indicateur de coût à comparer entre ETF similaires."},
{q:"Différence de négociation entre ETF et fonds traditionnel ?",opts:["L'ETF ne peut être acheté que mensuellement","L'ETF se négocie en continu, le fonds traditionnel une fois par jour","L'ETF est réservé aux professionnels","L'ETF n'est pas éligible au PEA"],correct:1,explain:"Un ETF se négocie en temps réel exactement comme une action."},
{q:"Impact de 0,20% vs 1,50% de frais sur 30 ans avec 10 000€ à 7% ?",opts:["5000€ d'écart","10 000€ d'écart","Plus de 20 000€ d'écart","Impact négligeable"],correct:2,explain:"L'effet des intérêts composés amplifie considérablement l'impact des frais dans le temps."}
],
action:"Compare le TER de l'Amundi MSCI World UCITS ETF et d'un fonds commun de ta banque. Calcule l'impact sur 20 ans."
},
{module:"Module 3 — Les ETF", title:"Capitalisant versus distribuant", duration:"8 min",
script:[
"Un ETF distribuant reverse les dividendes collectés aux investisseurs, généralement trimestriellement. Un ETF capitalisant les réinvestit automatiquement, augmentant mécaniquement la valeur de chaque part.",
"L'ETF capitalisant est généralement préférable en phase de construction du patrimoine : effet des intérêts composés maximisé, et dans un PEA, réinvestissement automatique sans friction fiscale.",
"En dehors d'un PEA, les dividendes distribués sont soumis à la flat tax de 30% ; avec un capitalisant, la fiscalité est différée jusqu'à la vente.",
"L'ETF distribuant devient pertinent quand on souhaite percevoir des revenus réguliers, typiquement à la retraite."
],
quiz:[
{q:"Que fait un ETF capitalisant avec les dividendes ?",opts:["Il les distribue trimestriellement","Il les conserve en cash","Il les réinvestit automatiquement, augmentant la valeur de chaque part","Il réduit ses frais de gestion"],correct:2,explain:"Cela permet de bénéficier pleinement de l'effet des intérêts composés."},
{q:"Pourquoi un ETF capitalisant est-il préférable dans un PEA ?",opts:["Frais inférieurs","Réinvestissement automatique sans friction ni action manuelle","Pas de prélèvements sociaux","Meilleures performances brutes"],correct:1,explain:"Les dividendes restent dans l'enveloppe fiscale sans aucune action de l'investisseur."},
{q:"Quand un ETF distribuant est-il préférable ?",opts:["Au tout début de l'investissement","Quand on veut des revenus réguliers, par exemple à la retraite","Toujours dans un CTO","Jamais"],correct:1,explain:"Pour percevoir des revenus réguliers sans vendre de parts."}
],
action:"Recherche un ETF MSCI World capitalisant et un distribuant. Note leurs TER et vérifie lequel est éligible PEA."
},
{module:"Module 3 — Les ETF", title:"Réplication physique versus synthétique", duration:"8 min",
script:[
"Un ETF à réplication physique détient réellement les actions de l'indice. Transparent, mais parfois par échantillonnage pour les indices très larges.",
"Un ETF synthétique conclut un contrat d'échange (swap) avec une banque qui garantit la performance de l'indice, sans détenir directement les actions. Utile pour répliquer des indices inaccessibles physiquement et, en France, pour rendre des ETF mondiaux éligibles au PEA.",
"Le risque de contrepartie (la banque du swap fait faillite) est encadré par la réglementation UCITS, limité à 10% des actifs du fonds.",
"Pour un débutant : préférer le physique quand c'est possible, utiliser le synthétique pour accéder au PEA avec des indices mondiaux."
],
quiz:[
{q:"Que détient réellement un ETF à réplication physique ?",opts:["Un contrat d'échange avec une banque","Les actions qui composent l'indice, dans les bonnes proportions","Des obligations d'entreprises","Un mix d'actions et de dérivés"],correct:1,explain:"Le fonds détient directement les actions dans les proportions de leur poids dans l'indice."},
{q:"Pourquoi les ETF synthétiques sont-ils utiles pour le PEA français ?",opts:["Frais de gestion plus bas","Ils permettent de répliquer des indices mondiaux tout en étant éligibles PEA","Ils sont plus sûrs","Meilleure réplication de l'indice"],correct:1,explain:"La structure synthétique permet la domiciliation européenne requise pour le PEA."},
{q:"Comment le risque de contrepartie est-il encadré ?",opts:["Par des stops de perte automatiques","Par une limite de 10% imposée par la réglementation UCITS","Par des contrats de couverture de change","Par une garantie de rachat quotidien"],correct:1,explain:"Cette limite encadre et minimise fortement ce risque."}
],
action:"Recherche un ETF PEA MSCI World. Identifie son type de réplication et pourquoi elle est nécessaire pour l'éligibilité PEA."
},
{module:"Module 3 — Les ETF", title:"Les ETF monde incontournables", duration:"9 min",
script:[
"Le MSCI World regroupe plus de 1500 entreprises dans 23 pays développés, TER entre 0,12 et 0,38%. C'est le premier ETF que la plupart des investisseurs devraient acheter.",
"Le S&P 500 (500 plus grandes entreprises américaines, TER 0,07 à 0,15%) est un sous-ensemble du MSCI World. Les marchés émergents (Chine, Inde, Brésil) offrent un potentiel supérieur avec plus de volatilité, TER 0,18 à 0,40%.",
"Un portefeuille simple : 80% MSCI World + 20% marchés émergents, ou encore plus simple, 100% MSCI World pour démarrer.",
"La simplicité est une vertu : un portefeuille simple maintenu 20 ans surpasse presque toujours un portefeuille complexe abandonné en cours de route."
],
quiz:[
{q:"Combien d'entreprises regroupe approximativement le MSCI World ?",opts:["Environ 100","Environ 500","Plus de 1500 dans 23 pays développés","Environ 5000"],correct:2,explain:"C'est l'un des indices les plus diversifiés disponibles pour les investisseurs particuliers."},
{q:"Quel est le TER typique d'un ETF S&P 500 ?",opts:["0,50 à 1,00%","0,07 à 0,15%","1,00 à 2,00%","0,30 à 0,50%"],correct:1,explain:"Parmi les plus faibles de l'industrie de la gestion d'actifs."},
{q:"Quel portefeuille simple est recommandé pour débuter ?",opts:["10 ETF couvrant tous les secteurs","Un mix actions/obligations complexe","100% MSCI World, ou MSCI World + marchés émergents","Un ETF par secteur économique"],correct:2,explain:"Un ou deux ETF bien diversifiés maintenus longtemps surpassent des portefeuilles trop complexes."}
],
action:"Compare l'Amundi MSCI World et l'iShares Core MSCI World : TER, taille du fonds, éligibilité PEA. Note ton choix."
},
{module:"Module 4 — La stratégie DCA", title:"Pourquoi investir régulièrement", duration:"9 min",
script:[
"Personne ne peut deviner le bon moment pour investir, pas même les experts. Le Dollar Cost Averaging (DCA) consiste à investir une somme fixe régulièrement, indépendamment des conditions de marché.",
"Ce mécanisme fait qu'on achète naturellement plus de parts quand les prix sont bas, moins quand ils sont élevés, réduisant le prix d'achat moyen sur le long terme.",
"Avantage psychologique majeur : le DCA élimine la tentation du market timing, qui échoue systématiquement pour la grande majorité des investisseurs.",
"Règle utile : à chaque augmentation de revenus, consacrez au moins la moitié à votre investissement mensuel."
],
quiz:[
{q:"Qu'est-ce que le Dollar Cost Averaging ?",opts:["N'investir que lors des baisses","Investir une somme fixe à intervalles réguliers, indépendamment du marché","Acheter au prix le plus bas possible","Convertir des devises en dollars"],correct:1,explain:"Cette approche élimine la nécessité de choisir le bon moment d'investissement."},
{q:"Pourquoi le DCA génère-t-il un prix d'achat moyen favorable ?",opts:["Il permet d'investir uniquement en baisse","Une somme fixe achète plus de parts quand les prix sont bas, moins quand ils sont hauts","Les courtiers appliquent des remises","Il optimise les frais de transaction"],correct:1,explain:"Sur le long terme, ce mécanisme fait baisser le prix d'achat moyen."},
{q:"Quelle règle accélère la construction de patrimoine lors d'une hausse de revenus ?",opts:["Investir 100% de l'augmentation","Utiliser 100% pour son niveau de vie","Consacrer au moins la moitié à l'investissement mensuel","Attendre 6 mois avant d'investir"],correct:2,explain:"Ce mécanisme simple crée une progression automatique de la capacité d'investissement."}
],
action:"Calcule ton DCA cible mensuel selon ta capacité d'épargne. Même 50€, l'important est la régularité."
},
{module:"Module 4 — La stratégie DCA", title:"Calculer son montant mensuel", duration:"8 min",
script:[
"Ordre de priorité avant d'investir en bourse : d'abord le fonds d'urgence (3 à 6 mois de dépenses), puis les dettes à taux élevé (supérieur à 5-6%, un remboursement équivaut à un investissement garanti), puis l'investissement mensuel.",
"Dimension psychologique : le montant investi doit être maintenable même lors des baisses de 30%. Mieux vaut commencer modeste et durable que trop haut et abandonner au premier krach.",
"Règle pragmatique : commencez avec 50% de votre capacité théorique, vivez avec 3 mois, puis augmentez progressivement à 75% puis 100%.",
"Mieux vaut 50€ investis pendant 20 ans que 200€ investis pendant 2 ans."
],
quiz:[
{q:"Quelle est la première priorité avant d'investir en bourse ?",opts:["Maximiser son PEA","Rembourser son crédit immobilier","Constituer un fonds d'urgence de 3 à 6 mois","Ouvrir une assurance-vie"],correct:2,explain:"Sans ce filet de sécurité, un imprévu pourrait forcer une vente au pire moment."},
{q:"Quand rembourser ses dettes avant d'investir ?",opts:["Toujours","Quand les taux dépassent 5 à 6%","Uniquement pour l'immobilier","Jamais en priorité"],correct:1,explain:"Rembourser une dette à taux élevé équivaut à un investissement garanti supérieur au rendement moyen des marchés."},
{q:"Pourquoi commencer avec 50% de sa capacité théorique ?",opts:["Pour réserver le reste","Pour s'assurer que le montant est maintenable lors des baisses","Par obligation réglementaire","Pour laisser le temps aux marchés de prouver leur rendement"],correct:1,explain:"Cela évite l'abandon lors du premier krach en testant son engagement progressivement."}
],
action:"Calcule ton montant mensuel en appliquant les 3 priorités : fonds d'urgence, dettes, investissement à 50% de ta capacité théorique."
},
{module:"Module 4 — La stratégie DCA", title:"Automatiser ses investissements", duration:"7 min",
script:[
"Configurez un virement automatique vers votre PEA le jour du salaire, puis un ordre d'achat récurrent d'ETF si votre courtier le propose. Sinon, un ordre manuel mensuel le même jour chaque mois.",
"Type d'ordre : au marché (exécution immédiate au meilleur prix) ou limité (protection contre les variations soudaines). Fréquence mensuelle pour la plupart des investisseurs.",
"Règle de non-intervention : une fois automatisé, ne regardez pas votre portefeuille tous les jours. Une fois par mois est largement suffisant.",
"Configurez une fois, ignorez intelligemment, récoltez à long terme."
],
quiz:[

{q:"Différence entre ordre au marché et ordre limité ?",opts:["L'un est réservé aux actions","L'ordre au marché s'exécute immédiatement au meilleur prix, l'ordre limité fixe un prix maximum","L'ordre au marché est moins coûteux","L'ordre limité garantit une exécution immédiate"],correct:1,explain:"Le limité protège contre des variations soudaines mais peut ne pas s'exécuter."},
{q:"À quelle fréquence regarder son portefeuille automatisé ?",opts:["Tous les jours","Chaque semaine","Une fois par mois lors de la revue mensuelle","Une fois par an"],correct:2,explain:"Regarder trop souvent augmente les risques de décisions émotionnelles."}
],
action:"Configure ton virement automatique mensuel vers ton PEA aujourd'hui. Active les ordres récurrents si disponibles."
},
{module:"Module 4 — La stratégie DCA", title:"Simuler 10 ans de DCA", duration:"8 min",
script:[
"À 7% de rendement annuel moyen : 100€/mois sur 10 ans donnent environ 17 200€ pour 12 000€ investis. 200€/mois donnent environ 34 500€ pour 24 000€ investis. 500€/mois donnent environ 86 000€ pour 60 000€ investis.",
"Sur 20 ans, 100€/mois donnent environ 52 000€ pour 24 000€ investis : les intérêts composés représentent plus de 50% du capital final.",
"Ces simulations supposent un rendement constant, ce qui n'arrive jamais en réalité (certaines années +20%, d'autres -30%), mais donnent des ordres de grandeur basés sur les moyennes historiques.",
"Le temps est le multiplicateur le plus puissant à votre disposition, et il commence à travailler dès le premier euro investi."
],
quiz:[
{q:"200€/mois pendant 10 ans à 7% donnent quel capital final estimé ?",opts:["24 000€","28 000€","Environ 34 500€","Environ 50 000€"],correct:2,explain:"24 000€ investis, avec environ 10 500€ générés par les intérêts composés."},
{q:"Sur quelle durée les intérêts composés dépassent-ils 50% du capital final ?",opts:["5 ans","Environ 20 ans","30 ans seulement","Jamais au-delà de 30%"],correct:1,explain:"L'effet composé s'accélère exponentiellement avec le temps."},
{q:"Pourquoi ces simulations ne prédisent-elles pas exactement l'avenir ?",opts:["Les rendements ne peuvent être calculés","Elles supposent un rendement constant alors qu'il varie fortement chaque année","Les frais ne sont pas inclus","L'inflation annule toujours les gains"],correct:1,explain:"Ces simulations donnent des ordres de grandeur basés sur des moyennes historiques, pas des prévisions exactes."}
],
action:"Utilise un calculateur d'intérêts composés en ligne avec ton DCA cible, 7% et 20 ans, puis compare avec 30 ans."
},
{module:"Module 5 — Construire son portefeuille", title:"Définir son profil de risque", duration:"9 min",
script:[
"Le profil de risque combine deux dimensions : la tolérance émotionnelle aux fluctuations (comment réagissez-vous à une perte de 30% ?) et l'horizon temporel (dans combien d'années aurez-vous besoin de cet argent ?).",
"Plus l'horizon est long, plus vous pouvez vous permettre une exposition élevée aux actions, car le marché a le temps de se remettre d'un krach.",
"En pratique : horizon supérieur à 10 ans, 80 à 100% d'actions. Horizon 5 à 10 ans, 60% actions / 40% obligations. Horizon inférieur à 5 ans, la bourse n'est pas adaptée, préférer l'épargne sécurisée.",
"Le meilleur portefeuille est celui que vous pouvez maintenir pendant un krach, pas celui qui a la meilleure performance théorique."
],
quiz:[
{q:"Qu'est-ce que le profil de risque en investissement ?",opts:["Une évaluation de la solidité psychologique","L'adéquation entre tolérance émotionnelle et horizon temporel","Une mesure de la volatilité du portefeuille","Un score attribué par le courtier"],correct:1,explain:"Ces deux dimensions définissent ensemble la composition optimale du portefeuille."},
{q:"Pour quel horizon la bourse est-elle déconseillée ?",opts:["Supérieur à 10 ans","Entre 5 et 10 ans","Inférieur à 5 ans","Toujours recommandée"],correct:2,explain:"Le temps de récupération après un krach pourrait être insuffisant avant d'avoir besoin de l'argent."},
{q:"Allocation en actions appropriée pour un horizon supérieur à 10 ans ?",opts:["20 à 40%","40 à 60%","80 à 100%","100% en obligations"],correct:2,explain:"Les marchés ont toujours eu le temps de se remettre de n'importe quel krach sur un tel horizon."}
],
action:"Réponds honnêtement : réaction à une perte de 30%, et horizon temporel. Déduis ton profil et l'allocation actions correspondante."
},
{module:"Module 5 — Construire son portefeuille", title:"Allocation selon son horizon", duration:"8 min",
script:[
"Trois classes d'actifs : les actions (performance élevée, volatilité élevée), les obligations (rendement modéré, volatilité faible, rôle d'amortisseur), les liquidités (sécurité totale, rendement faible).",
"La règle des 100 : pourcentage d'actions = 100 moins l'âge. À 30 ans, 70% d'actions. Certains experts préfèrent la règle des 110 ou 120 pour tenir compte de l'espérance de vie allongée.",
"Exemple profil dynamique horizon long : 90% MSCI World + 10% marchés émergents. Exemple profil équilibré : 60% MSCI World + 20% émergents + 20% obligataire mondial.",
"Ces allocations doivent évoluer avec l'âge, la situation et les objectifs."

async function loadProgressFromServer(){
  const { data } = await sb
    .from('lesson_progress')
    .select('lesson_number, completed')
    .eq('user_id', CURRENT_USER.id)
    .eq('formation', FORMATION);
  const p = {};
  if(data){ data.forEach(function(row){ if(row.completed) p[row.lesson_number] = true; }); }
  PROGRESS_CACHE = p;
  return p;
}
function getProgress(){ return PROGRESS_CACHE; }
async function setProgressServer(lessonNumber, value){
  PROGRESS_CACHE[lessonNumber] = value;
  await sb.from('lesson_progress').upsert({
    user_id: CURRENT_USER.id,
    formation: FORMATION,
    lesson_number: lessonNumber,
    completed: value,
    completed_at: value ? new Date().toISOString() : null
  }, { onConflict: 'user_id,formation,lesson_number' });

  await majCarnet(lessonNumber, value);
}

/* Le carnet de route : l'action cochée s'inscrit dans le carnet personnel,
   la décocher l'en retire. Une erreur ici ne doit jamais bloquer la
   progression de la leçon, d'où le try/catch silencieux. */
async function majCarnet(lessonNumber, value){
  try {
    const l = LESSONS[lessonNumber - 1];
    if(!l) return;

    if(!value){
      await sb.from('carnet').delete()
        .eq('user_id', CURRENT_USER.id)
        .eq('formation', FORMATION)
        .eq('lesson_number', lessonNumber);
      return;
    }

    await sb.from('carnet').upsert({
      user_id: CURRENT_USER.id,
      formation: FORMATION,
      lesson_number: lessonNumber,
      titre: l.title || ('Leçon ' + lessonNumber),
      action: l.action || ''
    }, { onConflict: 'user_id,formation,lesson_number', ignoreDuplicates: true });
  } catch(e){
    console.warn('Carnet non mis à jour :', e);
  }
}

let current = parseInt(new URLSearchParams(location.search).get('l')) || 1;
if(current < 1) current = 1;
if(current > LESSONS.length) current = LESSONS.length;

function isUnlocked(n){
  if(n === 1) return true;
  const progress = getProgress();
  return !!progress[n-1];
}

let quizState = {};

function allQuizCorrect(l){
  for(let i=0;i<l.quiz.length;i++){ if(!quizState[i]) return false; }
  return true;
}

function renderSidebar(){
  const progress = getProgress();
  const doneCount = Object.keys(progress).filter(function(k){ return progress[k]; }).length;
  document.getElementById('navProgress').textContent = doneCount + '/' + LESSONS.length + ' leçons';

  /* Regroupement des lecons par module : c'est le module qui devient
     l'etape de l'itineraire, la lecon n'est qu'un arret. */
  const etapes = [];
  LESSONS.forEach(function(l, i){
    const nom = l.module.split(' — ')[1] || l.module;
    let e = etapes.find(function(x){ return x.nom === nom; });
    if(!e){ e = { nom: nom, lecons: [] }; etapes.push(e); }
    e.lecons.push({ n: i + 1, titre: l.title });
  });

  const etapeCourante = etapes.findIndex(function(e){
    return e.lecons.some(function(a){ return a.n === current; });
  });

  const COCHE = '<svg viewBox="0 0 24 24" fill="none"><path d="M5 12L10 17L19 7" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  let html = '<div class="itin">' +
    '<div class="itin-tete">' +
      '<div class="itin-formation">' + NOM_FORMATION + '</div>' +
      '<div class="itin-compte">Étape ' + (etapeCourante + 1) + ' sur ' + etapes.length + ' · ' + doneCount + '/' + LESSONS.length + ' leçons</div>' +
      '<div class="itin-barre"><span style="width:' + Math.round(doneCount / LESSONS.length * 100) + '%"></span></div>' +
    '</div><div class="route">';

  etapes.forEach(function(e, idx){
    const toutesFaites = e.lecons.every(function(a){ return progress[a.n]; });
    const ici = idx === etapeCourante;
    const premiereAccessible = e.lecons.find(function(a){ return isUnlocked(a.n); });
    const classe = toutesFaites ? 'faite' : (ici ? 'ici' : '');
    const borne = toutesFaites ? COCHE : String(idx + 1);
    const cible = premiereAccessible ? premiereAccessible.n : e.lecons[0].n;

    html += '<div class="etape-i ' + classe + '">' +
      '<span class="borne">' + borne + '</span>' +
      '<button class="etape-titre" onclick="goTo(' + cible + ')">' + e.nom + '</button>' +
      '<div class="etape-meta">' + e.lecons.length + ' leçon' + (e.lecons.length > 1 ? 's' : '') + '</div>';

    /* On ne deroule que l'etape ou l'on se trouve : la carte reste lisible. */
    if(ici){
      html += '<div class="arrets">';
      e.lecons.forEach(function(a){
        const fait = !!progress[a.n];
        const ouvert = isUnlocked(a.n);
        const cl = (a.n === current ? 'ici ' : '') + (fait ? 'faite ' : '') + (ouvert ? '' : 'bloque');
        html += '<div class="arret ' + cl + '" onclick="goTo(' + a.n + ')">' +
          '<span class="puce">' + COCHE + '</span><span>' + a.titre + '</span></div>';
      });
      html += '</div>';
    }
    html += '</div>';
  });

  html += '</div>' + escaleHtml() + '</div>';
  document.getElementById('sidebar').innerHTML = html;
}

function goTo(n){
  if(!isUnlocked(n)){
    alert('Termine la leçon précédente pour débloquer celle-ci.');
    return;
  }
  current = n;
  history.replaceState(null, '', '?l=' + n);
  render();
  window.scrollTo(0,0);
}

function render(){
  renderSidebar();
  const l = LESSONS[current-1];
  const progress = getProgress();
  const done = !!progress[current];
  quizState = {};
  if(done){ l.quiz.forEach(function(q,i){ quizState[i] = true; }); }
  const main = document.getElementById('main');
  let quizHtml = '';
  l.quiz.forEach(function(q, qi){
    let optsHtml = '';
    q.opts.forEach(function(opt, oi){
      const preAnswered = done && oi === q.correct;
      optsHtml += '<div class="quiz-opt ' + (preAnswered?'correct disabled':'') + '" id="q' + qi + 'o' + oi + '" onclick="answerQuiz(' + qi + ',' + oi + ',' + q.correct + ')">' +
        '<span class="quiz-letter">' + String.fromCharCode(65+oi) + '</span><span class="quiz-opt-text">' + opt + '</span></div>';
    });
    quizHtml += '<div class="quiz-card"><div class="quiz-q">Question ' + (qi+1) + '. ' + q.q + '</div>' + optsHtml +
      '<div class="quiz-explain ' + (done?'show':'') + '" id="exp' + qi + '"><strong>Explication : </strong>' + q.explain + '</div></div>';
  });

  const quizOk = allQuizCorrect(l);
  const actionCardStyle = (!quizOk && !done) ? 'opacity:.5;pointer-events:none;' : '';

  main.innerHTML =
    (done ? '<div class="completion-badge show">✓ Leçon terminée</div>' : '') +
    '<div class="lesson-eyebrow">' + l.module + '</div>' +
    '<div class="lesson-title">' + (current) + '. ' + l.title + '</div>' +
    '<div class="lesson-meta">' + l.duration + ' de lecture · Leçon ' + current + ' sur ' + LESSONS.length + '</div>' +
    '<div class="section-label"><span class="dot"></span>Comprendre</div>' +
    '<div class="script-text">' + l.script.map(function(p){return '<p>'+p+'</p>';}).join('') + '</div>' +
    '<div class="section-label quiz"><span class="dot"></span>Vérifier</div>' +
    quizHtml +
    '<div class="section-label action"><span class="dot"></span>Petite action</div>' +
    (!quizOk && !done ? '<div style="font-size:12.5px;font-weight:600;color:var(--coral);margin-bottom:10px;">Réponds correctement aux ' + l.quiz.length + ' questions pour débloquer cette action.</div>' : '') +
    '<div class="action-card" id="actionCard" style="' + actionCardStyle + '">' +
      '<div class="action-text">' + l.action + '</div>' +
      '<div class="action-check" onclick="toggleAction()"><span class="action-box ' + (done?'checked':'') + '" id="actionBox">' + (done?'✓':'') + '</span><span class="action-label">Marquer cette leçon comme terminée</span></div>' +
    '</div>' +
    '<div class="lesson-nav">' +
      (current > 1 ? '<button class="nav-btn ghost" onclick="goTo(' + (current-1) + ')">← Leçon précédente</button>' : '<span></span>') +
      (current < LESSONS.length ? '<button class="nav-btn" onclick="goTo(' + (current+1) + ')">Leçon suivante →</button>' : '<a href="bourse.html" class="nav-btn">Terminer le parcours →</a>') +
    '</div>';
}

function answerQuiz(qi, oi, correct){
  if(quizState[qi]) return;
  const chosen = document.getElementById('q'+qi+'o'+oi);
  if(chosen.classList.contains('disabled')) return;

  if(oi === correct){
    for(let k=0;k<10;k++){
      const el = document.getElementById('q'+qi+'o'+k);
      if(el){ el.classList.add('disabled'); }
    }
    chosen.classList.add('correct');
    quizState[qi] = true;
    document.getElementById('exp'+qi).classList.add('show');
    const l = LESSONS[current-1];
    const quizOk = allQuizCorrect(l);
    const card = document.getElementById('actionCard');
    if(quizOk && card){
      card.style.opacity = '';
      card.style.pointerEvents = '';
      const lock = card.previousElementSibling;
      if(lock && lock.textContent.indexOf('Réponds correctement') !== -1){ lock.style.display = 'none'; }
    }
  } else {
    chosen.classList.add('wrong');
    document.getElementById('exp'+qi).classList.add('show');
    setTimeout(function(){ chosen.classList.remove('wrong'); }, 900);
  }
}

async function toggleAction(){
  const l = LESSONS[current-1];
  const progress = getProgress();
  const newValue = !progress[current];
  if(newValue && !allQuizCorrect(l)){
    alert('Réponds correctement à toutes les questions du quiz avant de valider cette leçon.');
    return;
  }
  await setProgressServer(current, newValue);
  render();
}

async function boot(){
  document.getElementById('main').innerHTML = '<div style="padding:60px 0;text-align:center;color:var(--ink-faint);font-size:14px;">Chargement de ta progression…</div>';
  const user = await requireAuth();
  if(!user) return;
  const unlocked = await requireUnlock(user.id);
  if(!unlocked) return;
  CURRENT_USER = user;
  await loadProgressFromServer();

  if(!isUnlocked(current)){
    let lastUnlocked = 1;
    for(let i=1;i<=LESSONS.length;i++){ if(isUnlocked(i)) lastUnlocked = i; else break; }
    current = lastUnlocked;
    history.replaceState(null, '', '?l=' + current);
  }
  render();
}
boot();
</script>
