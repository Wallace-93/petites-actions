{module:"Module 3 — Les fonds indiciels", title:"Qu'est-ce qu'un fonds indiciel", duration:"5 min",
script:[
"Un fonds indiciel, souvent appelé tracker ou ETF, est un fonds dont l'unique objectif est de reproduire la performance d'un indice. Il n'essaie pas de faire mieux, seulement de coller au plus près.",
"Le mécanisme est simple à comprendre. Le fonds détient les titres de l'indice, dans les mêmes proportions. Quand tu achètes une part, tu deviens propriétaire d'une fraction de l'ensemble. <strong>Avec 50 €, tu détiens une part infinitésimale de plusieurs centaines d'entreprises</strong>, ce qui serait impossible à reproduire toi-même.",
"Ce qui distingue un fonds indiciel d'un fonds classique tient en 3 points. <strong>1. Les frais.</strong> Pas d'équipe de gestion à rémunérer, donc des frais annuels souvent situés entre 0,2 et 0,4 % contre 1,5 à 2,5 % pour un fonds géré. <strong>2. La transparence.</strong> Sa composition est publique et connue en permanence. <strong>3. La négociabilité.</strong> Il s'achète et se vend en bourse comme une action, tout au long de la journée.",
"Trois notions figurent dans toute documentation et méritent d'être comprises. <strong>L'encours</strong> est le montant total géré par le fonds : <u>un encours important réduit le risque de fermeture du fonds</u>, événement qui n'entraîne pas de perte mais impose des démarches et une fiscalité non choisie.",
"<strong>L'écart de suivi</strong> mesure la différence entre la performance du fonds et celle de son indice. Plus il est faible, mieux le fonds fait son travail. <strong>La liquidité</strong> indique la facilité à acheter ou vendre : sur un fonds peu échangé, l'écart entre le prix d'achat et le prix de vente s'élargit, ce qui constitue un coût invisible.",
"Un point de vocabulaire qui embrouille beaucoup de débutants : <em>ETF</em> signifie fonds négocié en bourse, ce qui décrit son mode d'échange, pas sa stratégie. <strong>La quasi-totalité des ETF sont indiciels, mais certains ne le sont pas</strong>, et certains utilisent un effet de levier ou parient à la baisse. Ces derniers sont des produits spéculatifs qui n'ont rien à voir avec ce que décrit cette formation.",
"La règle de prudence qui en découle : <u>si le nom d'un fonds contient un multiplicateur, le mot « short », « leveraged » ou « inverse », ce n'est pas un fonds indiciel classique.</u> Ne l'achète pas sans avoir compris exactement ce qu'il fait."
],
quiz:[
{q:"Quel est l'objectif d'un fonds indiciel ?",opts:["Battre le marché","Reproduire la performance d'un indice","Garantir le capital","Verser un revenu mensuel"],correct:1,
explain:"Il ne cherche pas à faire mieux, seulement à coller au plus près, ce qui permet des frais très faibles."},
{q:"Que mesure l'écart de suivi ?",opts:["Le risque du fonds","La différence entre la performance du fonds et celle de son indice","Les frais annuels","La volatilité"],correct:1,
explain:"Plus il est faible, mieux le fonds fait le travail pour lequel tu le paies."},
{q:"Que signale un multiplicateur ou le mot « short » dans le nom d'un fonds ?",opts:["Une meilleure performance","Un produit spéculatif qui n'est pas un fonds indiciel classique","Une exonération fiscale","Une gestion active"],correct:1,
explain:"Effet de levier ou pari à la baisse : ces produits n'ont rien à voir avec ce que décrit cette formation."}
],
action:"Ouvre la fiche d'un fonds indiciel mondial et cherche 4 informations : frais annuels, encours, écart de suivi, nombre de lignes détenues. Ces 4 chiffres figurent dans le document d'information clé, et ils prennent 5 minutes à trouver."
},
{module:"Module 3 — Les fonds indiciels", title:"Capitalisant ou distribuant", duration:"5 min",
script:[
"Un même indice peut être suivi par 2 versions d'un fonds, et le choix entre elles a des conséquences réelles sur ton résultat final. C'est pourtant l'une des questions les moins posées par les débutants.",
"<strong>Un fonds distribuant</strong> te verse les dividendes des entreprises qu'il détient, généralement une à quatre fois par an. Tu reçois de l'argent sur ton compte, que tu peux dépenser ou réinvestir toi-même.",
"<strong>Un fonds capitalisant</strong> ne verse rien : il réinvestit automatiquement les dividendes dans le fonds. Ta part prend mécaniquement de la valeur, sans qu'aucun mouvement n'apparaisse sur ton compte.",
"Trois différences pratiques en découlent. <strong>1. La fiscalité.</strong> Sur un compte-titres, un dividende versé est imposable l'année où tu le reçois, même si tu le réinvestis immédiatement. Un fonds capitalisant ne déclenche aucune imposition tant que tu ne vends pas. <u>Sur un compte-titres et sur longue durée, la version capitalisante est donc fiscalement plus efficace.</u>",
"<strong>2. Les frais.</strong> Réinvestir manuellement un dividende suppose de passer un ordre, donc de payer des frais de courtage. Le fonds capitalisant le fait sans frais supplémentaires et sans que tu y penses.",
"<strong>3. L'effet psychologique.</strong> Recevoir un dividende procure une satisfaction réelle, et beaucoup d'investisseurs y tiennent. Mais cette satisfaction a un coût, et il faut le connaître : <strong>un dividende dépensé est un dividende qui ne travaille plus.</strong>",
"Dans un plan d'épargne en actions, la question fiscale disparaît puisque rien n'est imposé tant que tu ne retires pas. Le choix devient alors une question de commodité, et le capitalisant reste plus simple parce qu'il ne demande aucun geste.",
"Une exception mérite d'être nommée. <strong>Si ton objectif est de percevoir un revenu régulier</strong>, par exemple à la retraite, le distribuant devient pertinent : il produit un flux sans avoir à vendre de parts. C'est le seul cas où je le choisirais, et il ne concerne pas quelqu'un qui construit son capital."
],
quiz:[
{q:"Que fait un fonds capitalisant des dividendes ?",opts:["Il les verse chaque trimestre","Il les réinvestit automatiquement dans le fonds","Il les conserve en liquidités","Il les reverse à l'État"],correct:1,
explain:"La part prend mécaniquement de la valeur, sans aucun mouvement visible sur le compte."},
{q:"Pourquoi le capitalisant est-il plus efficace sur un compte-titres ?",opts:["Ses frais sont plus faibles","Aucune imposition n'est déclenchée tant qu'on ne vend pas","Il est mieux répliqué","Il est plus liquide"],correct:1,
explain:"Un dividende versé est imposable l'année de sa perception, même s'il est réinvesti immédiatement."},
{q:"Dans quel cas le distribuant devient-il pertinent ?",opts:["Pour construire son capital","Quand l'objectif est de percevoir un revenu régulier","Pour réduire le risque","Pour investir en PEA"],correct:1,
explain:"Il produit un flux sans avoir à vendre de parts, ce qui est utile à la retraite mais pas en phase de construction."}
],
action:"Regarde si le fonds qui t'intéresse existe en version capitalisante et en version distribuante. Elles portent souvent le même nom avec une mention « Acc » ou « Dist ». Note laquelle correspond à ton objectif actuel."
},
{module:"Module 3 — Les fonds indiciels", title:"Réplication physique ou synthétique", duration:"5 min",
script:[
"Un fonds indiciel peut reproduire son indice de 2 façons. La différence est technique, elle est mal expliquée partout, et elle explique pourtant comment un fonds mondial peut être éligible au plan d'épargne en actions.",
"<strong>La réplication physique.</strong> Le fonds achète réellement les titres de l'indice. S'il suit un indice de 1 500 entreprises, il détient effectivement ces entreprises, ou un échantillon représentatif quand le nombre est trop élevé. C'est la méthode la plus intuitive et la plus transparente.",
"<strong>La réplication synthétique.</strong> Le fonds détient un panier de titres différent, puis conclut un contrat d'échange avec une banque, appelé <em>swap</em>. Par ce contrat, la banque s'engage à lui verser exactement la performance de l'indice visé, en échange de la performance du panier détenu.",
"Cela paraît compliqué, et voici à quoi ça sert concrètement : <strong>le fonds peut détenir des actions européennes, donc rester éligible au PEA, tout en délivrant la performance d'un indice mondial.</strong> C'est le mécanisme qui rend possible ce que je t'annonçais dans le module précédent.",
"Quels risques ? Le principal est le <strong>risque de contrepartie</strong> : si la banque partenaire fait défaut, le fonds pourrait ne pas recevoir ce qui lui est dû. La réglementation européenne encadre ce risque en le plafonnant à <u>10 % de la valeur du fonds</u>, et en pratique les émetteurs le réduisent souvent bien davantage par des garanties déposées quotidiennement.",
"Il ne faut ni dramatiser ni minimiser. <strong>Le risque existe, il est encadré, et il est différent du risque de marché</strong>, qui reste de très loin le plus important. Quelqu'un qui refuserait la réplication synthétique par prudence tout en investissant 100 % en actions se protégerait d'un risque secondaire en assumant le principal.",
"Comment savoir laquelle un fonds utilise ? L'information figure dans le document d'information clé, sous les termes <em>réplication physique</em>, <em>directe</em> ou <em>synthétique</em>. <strong>C'est une vérification de 30 secondes</strong>, et elle fait partie des choses à regarder avant d'acheter."
],
quiz:[
{q:"En quoi consiste la réplication synthétique ?",opts:["Le fonds achète les titres de l'indice","Le fonds détient un autre panier et échange sa performance via un contrat avec une banque","Le fonds simule les cours","Le fonds emprunte les titres"],correct:1,
explain:"C'est ce mécanisme qui permet à un fonds mondial de rester éligible au PEA."},
{q:"Quel risque spécifique porte la réplication synthétique ?",opts:["Un risque de change","Un risque de contrepartie, encadré à 10 % de la valeur du fonds","Un risque de liquidité","Aucun risque supplémentaire"],correct:1,
explain:"Il est encadré par la réglementation et reste secondaire par rapport au risque de marché."},
{q:"Où trouver l'information sur le mode de réplication ?",opts:["Auprès du courtier uniquement","Dans le document d'information clé du fonds","Elle n'est pas publique","Sur les forums spécialisés"],correct:1,
explain:"C'est une vérification de 30 secondes, à faire avant tout achat."}
],
action:"Ouvre le document d'information clé d'un fonds mondial éligible au PEA et cherche le mot « réplication ». Comprendre ce que fait réellement un produit avant de l'acheter est exactement ce que cette formation cherche à t'apprendre."
},
{module:"Module 3 — Les fonds indiciels", title:"Comment lire la fiche d'un fonds", duration:"5 min",
script:[
"Cette leçon ne te dira pas quel fonds acheter, et c'est volontaire : NiouDem n'émet aucune recommandation. Elle t'apprend à lire une fiche, ce qui te rend capable de juger n'importe quel produit qu'on te présentera, aujourd'hui ou dans 10 ans.",
"Tout fonds distribué en Europe publie un <strong>document d'information clé</strong>, standardisé et gratuit, de quelques pages. C'est le seul document qui compte, et il contient 8 informations à vérifier.",
"<strong>1. L'indice suivi.</strong> Quel panier, combien d'entreprises, quels pays. <strong>2. Les frais courants annuels.</strong> Exprimés en pourcentage, prélevés chaque année sur l'encours, qu'il monte ou qu'il baisse. <strong>3. Le mode de réplication</strong>, physique ou synthétique, vu dans la leçon précédente.",
"<strong>4. La devise et la couverture de change.</strong> Un fonds mondial détient des actifs en dollars et dans d'autres monnaies. Sauf mention d'une couverture, <u>tu supportes le risque de change en plus du risque de marché</u>, ce qui joue dans les 2 sens et que beaucoup de débutants ignorent totalement.",
"<strong>5. L'encours total</strong>, indicateur de solidité et de pérennité du fonds. <strong>6. L'indicateur de risque</strong>, noté de 1 à 7 par la réglementation. Un fonds actions mondial se situe généralement dans le haut de l'échelle, et c'est normal.",
"<strong>7. L'éligibilité</strong> aux enveloppes : PEA, assurance-vie, plan d'épargne retraite. <strong>8. Le scénario de performance défavorable</strong>, obligatoire depuis quelques années. C'est la section la plus utile et la moins lue : elle chiffre ce que tu perdrais dans un scénario adverse. <strong>Si ce chiffre te fait peur, le produit n'est pas adapté à toi</strong>, et c'est exactement à quoi il sert.",
"Une dernière chose sur la performance passée. Elle figure sur les fiches, elle est encadrée d'un avertissement, et cet avertissement est justifié : <u>choisir un fonds sur sa performance des 3 dernières années est l'erreur la plus répandue.</u> Ce qui a le mieux performé récemment n'a aucune raison particulière de continuer.",
"Regarde plutôt les frais, l'écart de suivi et l'encours. Ce sont les seuls éléments dont tu peux dire quelque chose de fiable à l'avance."
],
quiz:[
{q:"Quel document doit être consulté avant tout achat ?",opts:["La brochure commerciale","Le document d'information clé, standardisé et gratuit","Le rapport annuel","L'avis du courtier"],correct:1,
explain:"Quelques pages, un format imposé, et 8 informations essentielles à vérifier."},
{q:"Que supportes-tu en plus du risque de marché sur un fonds mondial ?",opts:["Un risque de crédit","Le risque de change, sauf mention d'une couverture","Un risque fiscal","Aucun risque supplémentaire"],correct:1,
explain:"Il joue dans les 2 sens et beaucoup de débutants l'ignorent totalement."},
{q:"Quelle est l'erreur la plus répandue dans le choix d'un fonds ?",opts:["Regarder les frais","Choisir sur la performance des 3 dernières années","Vérifier l'encours","Comparer les indices"],correct:1,
explain:"Ce qui a le mieux performé récemment n'a aucune raison particulière de continuer."}
],
action:"Télécharge le document d'information clé d'un fonds et remplis les 8 points sur une feuille. Compte 15 minutes la première fois, 3 minutes ensuite. Cette grille est ce que tu utiliseras pour juger tous les produits qu'on te proposera."
},
{module:"Module 4 — Investir régulièrement", title:"Pourquoi la régularité bat le timing", duration:"5 min",
script:[
"Investir régulièrement une somme fixe, quel que soit le niveau des marchés, porte un nom : l'investissement programmé, souvent désigné par son sigle anglais DCA. C'est la méthode la plus enseignée aux débutants, et il faut comprendre ce qu'elle fait réellement.",
"Le principe : tu verses le même montant à date fixe, sans jamais te demander si le moment est bon. Quand les prix sont élevés, ton versement achète moins de parts. Quand ils sont bas, il en achète davantage. <strong>Mécaniquement, tu achètes plus quand c'est moins cher</strong>, sans avoir rien décidé.",
"Il faut être précis sur ce que cette méthode apporte, parce qu'elle est souvent survendue. <u>Statistiquement, investir une somme disponible en une seule fois donne en moyenne un résultat légèrement supérieur</u>, simplement parce que l'argent travaille plus longtemps. Ce n'est donc pas une méthode mathématiquement optimale.",
"<figure class=\"schema\"><svg viewBox=\"0 0 700 276\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"20\" y=\"24\" width=\"190\" height=\"54\" rx=\"9\" fill=\"#EFF0EA\" stroke=\"#12212B\" stroke-width=\"1.5\"/><text x=\"115\" y=\"47\" text-anchor=\"middle\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14.5\" font-weight=\"600\" fill=\"#12212B\">Versement fixe</text><text x=\"115\" y=\"65\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\" fill=\"#7A8A93\">chaque mois</text><path d=\"M210 51 C 270 51, 270 66, 330 66\" fill=\"none\" stroke=\"#A24332\" stroke-width=\"1.8\"/><circle cx=\"330\" cy=\"66\" r=\"4\" fill=\"#A24332\"/><rect x=\"344\" y=\"43\" width=\"336\" height=\"46\" rx=\"8\" fill=\"#F8EDEA\" stroke=\"#A24332\" stroke-width=\"1.3\"/><text x=\"360\" y=\"64\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"14\" font-weight=\"600\" fill=\"#12212B\">Marché haut</text><text x=\"664\" y=\"64\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"13\" fill=\"#A24332\">achète moins de parts</text><path d=\"M210 51 C 270 51, 270 128, 330 128\" fill=\"none\" stroke=\"#1E4B3C\" stroke-width=\"1.8\"/><circle cx=\"330\" cy=\"128\" r=\"4\" fill=\"#1E4B3C\"/><rect x=\"344\" y=\"105\" width=\"336\" height=\"46\" rx=\"8\" fill=\"#E7EFEA\" stroke=\"#1E4B3C\" stroke-width=\"1.3\"/><text x=\"360\" y=\"126\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"14\" font-weight=\"600\" fill=\"#12212B\">Marché moyen</text><text x=\"664\" y=\"126\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"13\" fill=\"#1E4B3C\">achète normalement</text><path d=\"M210 51 C 270 51, 270 190, 330 190\" fill=\"none\" stroke=\"#B8862F\" stroke-width=\"1.8\"/><circle cx=\"330\" cy=\"190\" r=\"4\" fill=\"#B8862F\"/><rect x=\"344\" y=\"167\" width=\"336\" height=\"46\" rx=\"8\" fill=\"#F6EFE0\" stroke=\"#B8862F\" stroke-width=\"1.3\"/><text x=\"360\" y=\"188\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"14\" font-weight=\"600\" fill=\"#12212B\">Marché bas</text><text x=\"664\" y=\"188\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"13\" fill=\"#B8862F\">achète plus de parts</text></svg><figcaption>Mécaniquement, tu achètes davantage quand c'est moins cher, sans avoir rien décidé.</figcaption></figure>",
"Son avantage est ailleurs, et il est décisif. <strong>Elle supprime la décision.</strong> Or la décision est précisément là où les particuliers perdent de l'argent : en attendant le bon moment qui ne vient jamais, en arrêtant de verser pendant les baisses, en investissant massivement après une hausse.",
"Elle apporte aussi une chose que les statistiques ne mesurent pas : <strong>la tranquillité.</strong> Quelqu'un qui verse 150 € par mois ne vit pas une baisse de 20 % comme quelqu'un qui a placé 20 000 € la semaine précédente. La méthode optimale sur le papier n'est pas celle qu'on tient dans la vraie vie.",
"Un point souvent mal compris : <strong>le versement programmé ne protège pas des pertes.</strong> Si les marchés baissent durablement, ton portefeuille baisse aussi. Ce qu'il évite, c'est de concentrer l'ensemble de son investissement sur une seule date, qui peut être la pire.",
"La conclusion pratique est celle-ci. Si tu disposes d'une somme importante et que tu es certain de ne pas paniquer, l'investir progressivement sur 6 à 12 mois est un compromis raisonnable. Si tu construis ton capital mois après mois, ce qui est le cas de la plupart des gens, <strong>le versement programmé n'est pas un choix parmi d'autres : c'est le seul qui corresponde à ta situation.</strong>"
],
quiz:[
{q:"Que fait mécaniquement un versement régulier ?",opts:["Il garantit un gain","Il achète plus de parts quand les prix sont bas","Il réduit les frais","Il protège des baisses"],correct:1,
explain:"Sans aucune décision de ta part, ce qui est précisément son intérêt."},
{q:"Le versement programmé est-il mathématiquement optimal ?",opts:["Oui, toujours","Non, investir en une fois donne en moyenne un résultat légèrement supérieur","Oui, sur 20 ans","Cela dépend du fonds"],correct:1,
explain:"Son avantage est comportemental : il supprime la décision, là où les particuliers perdent de l'argent."},
{q:"Que ne fait pas le versement programmé ?",opts:["Supprimer la décision","Protéger des pertes en cas de baisse durable","Lisser le prix d'achat","Faciliter l'automatisation"],correct:1,
explain:"Il évite de concentrer tout son investissement sur une seule date, ce qui est différent d'une protection."}
],
action:"Utilise le simulateur de versements réguliers dans les outils NiouDem avec ton montant envisagé et une durée de 20 ans. Puis refais le calcul en retirant 5 ans. L'écart entre les 2 est le prix de l'attente."
},
{module:"Module 4 — Investir régulièrement", title:"Calculer ton montant mensuel", duration:"5 min",
script:[
"Le bon montant n'est pas le plus élevé possible. C'est celui que tu pourras verser sans interruption pendant des années, y compris pendant un mois difficile.",
"Le calcul se fait en 3 temps, à partir de ce que la formation sur le budget t'a permis d'établir. <strong>1.</strong> Prends ton épargne mensuelle totale. <strong>2.</strong> Retire ce qui alimente encore ton fonds d'urgence s'il n'est pas complet, et ce que tu provisionnes pour tes dépenses annuelles. <strong>3.</strong> Ce qui reste est ton montant investissable.",
"Applique ensuite une règle de prudence que je te recommande vivement : <strong>commence à 70 % de ce montant.</strong> Si le calcul donne 200 €, commence à 140 €. La marge restante absorbera les mois imprévus sans que tu aies à interrompre le versement, et <u>tu pourras toujours augmenter, alors qu'une baisse est vécue comme un échec.</u>",
"Trois vérifications avant de programmer quoi que ce soit. <strong>Le fonds d'urgence est-il constitué ?</strong> S'il ne l'est pas, ce montant n'est pas investissable et doit d'abord aller là. <strong>Les dettes chères sont-elles remboursées ?</strong> Rembourser un crédit à 6 % est un rendement certain de 6 %, que peu de placements égalent avec certitude. <strong>Les frais du courtier sont-ils compatibles ?</strong> Verser 30 € par mois avec 3 € de frais par ordre revient à perdre 10 % à l'entrée.",
"Ce dernier point mérite une solution pratique : si tes frais sont élevés au regard de ton montant, <strong>verse tous les 2 ou 3 mois plutôt que chaque mois.</strong> Tu conserves la régularité tout en divisant les frais par 2 ou 3, et l'effet sur le résultat est négligeable.",
"Une question fréquente : faut-il augmenter le montant avec le temps ? Oui, et le meilleur mécanisme est celui vu dans la formation sur le budget : <strong>diriger la moitié de chaque augmentation de revenu vers le versement</strong>, avant de s'habituer à la dépenser. Le niveau de vie ne baisse jamais, et le montant investi progresse sans effort.",
"Retiens ceci : <strong>un versement de 50 € qui tient 15 ans bat un versement de 300 € abandonné au bout de 8 mois.</strong> Cette phrase résume la totalité de ce module."
],
quiz:[
{q:"À quel pourcentage du montant calculé faut-il commencer ?",opts:["100 %","Environ 70 %","50 %","120 %"],correct:1,
explain:"La marge absorbe les mois imprévus. Augmenter est facile, baisser est vécu comme un échec."},
{q:"Que faire si les frais de courtage sont élevés au regard du montant ?",opts:["Changer de fonds","Verser tous les 2 ou 3 mois plutôt que chaque mois","Renoncer à investir","Augmenter fortement le montant"],correct:1,
explain:"La régularité est conservée, les frais divisés, et l'effet sur le résultat final est négligeable."},
{q:"Quel mécanisme fait progresser le montant sans effort ?",opts:["Augmenter de 10 % chaque année","Diriger la moitié de chaque augmentation de revenu vers le versement","Réduire ses loisirs","Attendre une prime"],correct:1,
explain:"Le niveau de vie ne baisse jamais, et l'investissement progresse à chaque hausse de revenu."}
],
action:"Calcule ton montant investissable, applique les 70 %, et vérifie tes 3 conditions préalables. Si l'une n'est pas remplie, note laquelle : c'est ton prochain objectif, et il passe avant l'investissement."
},
{module:"Module 4 — Investir régulièrement", title:"Automatiser tes investissements", duration:"5 min",
script:[
"Un versement automatique est ce qui transforme une intention en résultat. Cette leçon décrit comment le mettre en place, et surtout ce qu'il faut prévoir pour qu'il survive aux périodes difficiles.",
"Deux niveaux d'automatisation existent, et il faut les distinguer. <strong>Le virement de trésorerie</strong> déplace l'argent de ton compte bancaire vers ton compte d'investissement. <strong>L'ordre programmé</strong> achète effectivement les parts. Certains établissements proposent les 2, d'autres seulement le premier.",
"Si ton courtier ne propose pas l'ordre programmé, tu devras passer l'ordre à la main. Ce n'est pas rédhibitoire, à une condition : <u>fixe une date précise et récurrente dans ton calendrier</u>, par exemple le 5 de chaque mois, et traite-la comme un rendez-vous et non comme une intention.",
"Le séquencement complet se règle une fois. Le lendemain de la paie, un virement part vers le compte d'investissement. Trois jours plus tard, délai nécessaire à la réception des fonds, l'ordre s'exécute ou tu le passes. Ce décalage évite l'échec le plus fréquent : un ordre programmé qui ne s'exécute pas faute de liquidités disponibles.",
"Voici maintenant le point qui compte le plus, et il n'est pas technique. <strong>Écris dès aujourd'hui ce que tu feras quand les marchés baisseront de 30 %.</strong> Pas si, quand : cela s'est produit plusieurs fois par décennie. La réponse à écrire, dans l'immense majorité des cas, est <em>« je continue à verser sans rien changer »</em>.",
"Cette phrase écrite à froid vaut infiniment plus que n'importe quelle analyse produite à chaud. <u>Les périodes de baisse sont précisément celles où les versements achètent le plus de parts</u>, et donc celles qui construisent le résultat des années suivantes. Interrompre à ce moment revient à renoncer au bénéfice de toute la méthode.",
"Une dernière précaution : <strong>prévois une règle de suspension</strong>, plutôt que d'improviser. Par exemple : je suspends les versements uniquement si mon fonds d'urgence descend sous 1 mois de charges, et je les reprends dès qu'il est reconstitué. Une règle écrite empêche de confondre une difficulté personnelle réelle avec une inquiétude passagère sur les marchés."
],
quiz:[
{q:"Pourquoi décaler l'ordre de quelques jours après le virement ?",opts:["Pour obtenir un meilleur prix","Pour laisser le temps aux fonds d'arriver et éviter un ordre non exécuté","Pour réduire les frais","C'est une obligation réglementaire"],correct:1,
explain:"C'est l'échec le plus fréquent des ordres programmés : des liquidités qui ne sont pas encore disponibles."},
{q:"Que faut-il écrire avant même de commencer ?",opts:["Un objectif de rendement","Ce qu'on fera quand les marchés baisseront de 30 %","La liste des fonds à surveiller","Un calendrier de revente"],correct:1,
explain:"Pas si, quand : cela s'est produit plusieurs fois par décennie. La réponse écrite à froid vaut mieux que l'analyse à chaud."},
{q:"À quoi sert une règle de suspension écrite ?",opts:["À vendre au bon moment","À distinguer une difficulté personnelle réelle d'une inquiétude passagère sur les marchés","À réduire l'imposition","À changer de courtier"],correct:1,
explain:"Sans règle, on suspend pour de mauvaises raisons, précisément quand il faudrait continuer."}
],
action:"Écris ce soir 2 phrases et range-les avec tes documents : ce que tu feras en cas de baisse de 30 %, et dans quelles conditions précises tu suspendrais tes versements. Elles ne serviront pas cette année, et elles vaudront cher le jour venu."
},
{module:"Module 4 — Investir régulièrement", title:"Ce que produisent 10 ans de versements", duration:"5 min",
script:[
"Cette leçon met des chiffres sur la méthode, avec un avertissement qui compte plus que les chiffres eux-mêmes : <strong>aucune simulation ne se réalise telle quelle.</strong> Elles servent à comprendre un mécanisme, jamais à prévoir un résultat.",
"Prenons un versement de 150 € par mois pendant 10 ans, soit 18 000 € sortis de ta poche. Avec une hypothèse de rendement annuel de 5 %, le capital final approche 23 300 €. <strong>Environ 5 300 € proviennent donc du temps</strong>, sans effort supplémentaire de ta part.",
"Prolonge à 20 ans, avec le même versement : 36 000 € versés, et un capital d'environ 61 700 €. <u>La part produite par le temps passe de 23 % à 42 % du total.</u> C'est le point essentiel : l'effet ne croît pas proportionnellement à la durée, il s'accélère.",
"Voici la comparaison la plus parlante, et je te conseille de la refaire toi-même dans l'outil. Quelqu'un qui verse 150 € pendant 20 ans obtient davantage que quelqu'un qui verse 300 € pendant 10 ans, alors que le second a sorti la même somme de sa poche. <strong>La durée pèse plus lourd que le montant.</strong>",
"Maintenant l'honnêteté nécessaire. <strong>Ce rendement de 5 % constant n'existera pas.</strong> La réalité alterne des années à plus 20 % et des années à moins 25 %, et l'ordre dans lequel elles surviennent change le résultat final. Une forte baisse en début de parcours, quand le capital est faible, pèse peu ; la même baisse à 2 ans de l'échéance pèse énormément.",
"Cette dernière remarque a une conséquence pratique importante, que nous verrons dans le module suivant : <u>on réduit progressivement l'exposition au risque à mesure que l'échéance approche</u>, précisément pour cette raison.",
"Retiens 2 choses de cette leçon. <strong>Le temps fait la majorité du travail</strong>, ce qui plaide pour commencer tôt avec peu plutôt que tard avec beaucoup. Et <strong>une simulation n'est pas une prévision</strong> : elle montre un mécanisme, et quiconque te présente un chiffre comme un objectif atteignable te vend quelque chose."
],
quiz:[
{q:"Que montre la comparaison entre 150 € sur 20 ans et 300 € sur 10 ans ?",opts:["Les 2 sont équivalents","La durée pèse plus lourd que le montant","Le montant pèse plus lourd","Cela dépend des frais"],correct:1,
explain:"La même somme sortie de la poche produit un résultat supérieur quand elle est étalée plus longtemps."},
{q:"Pourquoi une baisse en fin de parcours pèse-t-elle plus qu'au début ?",opts:["Les frais augmentent avec le temps","Parce que le capital exposé est bien plus important","Parce que la fiscalité change","Ce n'est pas le cas"],correct:1,
explain:"C'est ce qui justifie de réduire progressivement l'exposition au risque à mesure que l'échéance approche."},
{q:"Que vaut une simulation ?",opts:["Une prévision fiable","L'illustration d'un mécanisme, jamais une prévision","Un engagement du courtier","Une moyenne garantie"],correct:1,
explain:"Quiconque présente un chiffre de simulation comme un objectif atteignable vend quelque chose."}
],
action:"Ouvre le simulateur de versements réguliers et fais 3 essais : ton montant sur 10 ans, sur 20 ans, puis avec un rendement de 3 % au lieu de 5 %. Le troisième essai est le plus instructif, parce qu'il montre la sensibilité du résultat à une hypothèse."
},
{module:"Module 5 — Construire son portefeuille", title:"Définir ton profil de risque", duration:"5 min",
script:[
"Le profil de risque est présenté partout comme une question de tempérament. C'est une erreur : <strong>il dépend d'abord de ta situation, ensuite seulement de ton caractère.</strong>",
"Trois éléments objectifs le déterminent, et il faut les traiter dans cet ordre.",
"<strong>1. Ton horizon.</strong> C'est le facteur le plus important. Dans combien de temps auras-tu besoin de cet argent ? À moins de 3 ans, les actions n'ont pas leur place, quel que soit ton tempérament. Au-delà de 10 ans, une baisse temporaire cesse d'être un problème.",
"<strong>2. Ta capacité à encaisser.</strong> Elle ne se mesure pas en émotion mais en euros : que se passe-t-il concrètement si ce capital perd 40 % pendant 3 ans ? Si la réponse est <em>« rien, je n'y touche pas »</em>, ta capacité est réelle. Si c'est <em>« je ne peux pas acheter mon logement »</em>, elle ne l'est pas.",
"<strong>3. Ta tolérance psychologique.</strong> C'est le seul facteur subjectif, et il est réel. Quelqu'un qui ne dort plus quand son portefeuille baisse finira par vendre au pire moment. <u>Un portefeuille théoriquement optimal qu'on ne supporte pas est un mauvais portefeuille.</u>",
"Voici le test le plus honnête que je connaisse, et il vaut mieux que n'importe quel questionnaire : <strong>regarde ce que tu as fait en mars 2020, ou pendant la dernière baisse que tu as vécue.</strong> As-tu vendu, attendu, ou renforcé ? Le comportement passé prédit mieux que l'intention déclarée.",
"Si tu n'as jamais rien vécu, la méthode reste la même que pour le premier ordre : <strong>commence petit et observe tes réactions.</strong> Investir 500 € et ressentir une baisse de 15 % t'apprendra plus sur toi qu'une heure de questionnaire.",
"Une mise en garde pour finir. Les questionnaires réglementaires que les établissements font remplir servent une vraie fonction de protection, mais ils sont souvent remplis avec optimisme, parce qu'un profil « prudent » donne accès à moins de produits. <strong>Se surestimer dans ce questionnaire revient à désactiver une protection prévue pour soi.</strong>"
],
quiz:[
{q:"Quel est le facteur le plus déterminant du profil de risque ?",opts:["Le tempérament","L'horizon de placement","Le montant investi","L'âge"],correct:1,
explain:"À moins de 3 ans, les actions n'ont pas leur place quel que soit le caractère de l'investisseur."},
{q:"Comment mesurer sa capacité à encaisser une baisse ?",opts:["Par un questionnaire en ligne","En euros : que se passe-t-il concrètement si ce capital perd 40 % pendant 3 ans","Par son niveau de revenus","Par son expérience passée uniquement"],correct:1,
explain:"La capacité est objective : elle dépend de ce que cet argent devait financer et quand."},
{q:"Quel est le meilleur prédicteur de ton comportement futur ?",opts:["Ton intention déclarée","Ce que tu as fait lors de la dernière baisse vécue","Ton profil déclaré au courtier","Ton niveau de connaissances"],correct:1,
explain:"Le comportement passé prédit mieux que l'intention, et c'est pourquoi il vaut mieux commencer petit."}
],
action:"Réponds par écrit à une seule question : si ce que tu investis perdait 40 % pendant 3 ans, qu'est-ce que ça changerait concrètement dans ta vie ? La réponse détermine ton horizon réel, et donc tout le reste."
},
{module:"Module 5 — Construire son portefeuille", title:"Répartir selon ton horizon", duration:"5 min",
script:[
"L'allocation, c'est la répartition de ton capital entre des actifs de nature différente. C'est la décision qui explique la majeure partie de ton résultat, bien davantage que le choix des fonds eux-mêmes.",
"Trois grandes catégories suffisent à raisonner. <strong>Les actifs sans risque de perte nominale</strong> : livrets, fonds en euros. <strong>Les obligations</strong>, qui sont des prêts consentis à des États ou des entreprises, moins volatiles que les actions mais pas sans risque. <strong>Les actions</strong>, les plus volatiles et les plus productives sur longue durée.",
"Le principe d'allocation tient en une phrase : <strong>plus l'échéance est proche, moins la part d'actions doit être élevée.</strong> Ce n'est pas une question de prudence morale, c'est une question de temps disponible pour absorber une baisse.",
"<figure class=\"schema\"><svg viewBox=\"0 0 700 286\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"20\" y=\"202\" width=\"250\" height=\"52\" rx=\"9\" fill=\"#E7EFEA\" stroke=\"#1E4B3C\" stroke-width=\"1.4\"/><circle cx=\"46\" cy=\"228\" r=\"12\" fill=\"#1E4B3C\"/><text x=\"46\" y=\"232\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\" fill=\"#fff\">1</text><text x=\"70\" y=\"224\" font-family=\"Newsreader, Georgia, serif\" font-size=\"15\" font-weight=\"600\" fill=\"#12212B\">Moins de 3 ans</text><text x=\"70\" y=\"241\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#43555F\">Aucune action. Supports sans risque de perte.</text><rect x=\"20\" y=\"138\" width=\"383\" height=\"52\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#DCDDD3\" stroke-width=\"1.4\"/><circle cx=\"46\" cy=\"164\" r=\"12\" fill=\"#DCDDD3\"/><text x=\"46\" y=\"168\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\" fill=\"#fff\">2</text><text x=\"70\" y=\"160\" font-family=\"Newsreader, Georgia, serif\" font-size=\"15\" font-weight=\"600\" fill=\"#12212B\">3 à 8 ans</text><text x=\"70\" y=\"177\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#43555F\">Part d'actions minoritaire, complétée d'obligations.</text><rect x=\"20\" y=\"74\" width=\"517\" height=\"52\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#DCDDD3\" stroke-width=\"1.4\"/><circle cx=\"46\" cy=\"100\" r=\"12\" fill=\"#DCDDD3\"/><text x=\"46\" y=\"104\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\" fill=\"#fff\">3</text><text x=\"70\" y=\"96\" font-family=\"Newsreader, Georgia, serif\" font-size=\"15\" font-weight=\"600\" fill=\"#12212B\">8 à 15 ans</text><text x=\"70\" y=\"113\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#43555F\">Part d'actions majoritaire défendable.</text><rect x=\"20\" y=\"10\" width=\"650\" height=\"52\" rx=\"9\" fill=\"#F6EFE0\" stroke=\"#B8862F\" stroke-width=\"1.4\"/><circle cx=\"46\" cy=\"36\" r=\"12\" fill=\"#B8862F\"/><text x=\"46\" y=\"40\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\" fill=\"#fff\">4</text><text x=\"70\" y=\"32\" font-family=\"Newsreader, Georgia, serif\" font-size=\"15\" font-weight=\"600\" fill=\"#12212B\">Plus de 15 ans</text><text x=\"70\" y=\"49\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#43555F\">Allocation très largement en actions.</text></svg><figcaption>L'horizon détermine l'allocation, pas le tempérament. Ce sont des repères à ajuster, pas une norme.</figcaption></figure>",
"Voici des repères, à ajuster et non à appliquer mécaniquement. <u>Horizon inférieur à 3 ans : aucune action.</u> L'argent reste sur des supports sans risque de perte. Horizon de 3 à 8 ans : une part d'actions minoritaire, complétée d'obligations et de liquidités. Horizon supérieur à 8 ans : une part d'actions majoritaire devient défendable. Horizon supérieur à 15 ans sans besoin identifié : une allocation très largement en actions se justifie.",
"Une méthode ancienne consiste à retenir un pourcentage d'actions égal à 100 moins son âge. Elle a le mérite de la simplicité et le défaut de l'imprécision : <strong>elle ignore complètement l'horizon réel du projet.</strong> Quelqu'un de 55 ans qui prépare une transmission a un horizon de 30 ans, pas de 10.",
"Deux erreurs fréquentes méritent d'être nommées. <strong>La première est la fausse diversification</strong> : détenir 5 fonds qui suivent tous des indices d'actions mondiales n'est pas diversifier, c'est acheter la même chose 5 fois avec 5 lignes de frais. <strong>La seconde est de raisonner sur le portefeuille seul</strong>, en oubliant que ton fonds d'urgence, ton épargne de projet et ton éventuel bien immobilier font aussi partie de ton patrimoine.",
"Regarde toujours ton allocation à l'échelle de <strong>tout ce que tu possèdes</strong>, pas seulement du compte d'investissement. Quelqu'un qui détient 100 % d'actions sur son compte-titres mais 3 ans de charges en livret n'est pas exposé à 100 % en actions."
],
quiz:[
{q:"Quel principe gouverne l'allocation ?",opts:["Plus on est jeune, plus on prend de risque","Plus l'échéance est proche, moins la part d'actions est élevée","Il faut toujours 50 % d'actions","L'allocation dépend des frais"],correct:1,
explain:"C'est une question de temps disponible pour absorber une baisse, pas de prudence morale."},
{q:"Qu'est-ce que la fausse diversification ?",opts:["Investir dans un seul pays","Détenir 5 fonds qui suivent tous des indices d'actions mondiales","Détenir des obligations","Investir progressivement"],correct:1,
explain:"C'est acheter la même chose 5 fois, avec 5 lignes de frais et aucune diversification supplémentaire."},
{q:"À quelle échelle faut-il regarder son allocation ?",opts:["Au compte d'investissement seul","À l'échelle de tout ce qu'on possède","Par enveloppe fiscale","Par courtier"],correct:1,
explain:"Quelqu'un avec 3 ans de charges en livret n'est pas exposé à 100 % en actions, même si son compte-titres l'est."}
],
action:"Liste tout ce que tu possèdes, y compris ton fonds d'urgence et ton épargne de projet, et calcule la part réellement exposée aux actions. Ce pourcentage est probablement bien plus faible que tu ne le penses."
},
{module:"Module 5 — Construire son portefeuille", title:"Le rééquilibrage annuel", duration:"5 min",
script:[
"Une allocation décidée aujourd'hui se déforme toute seule. Si les actions montent plus vite que le reste, leur part augmente mécaniquement, et ton portefeuille devient plus risqué que ce que tu avais choisi, sans que tu aies rien décidé.",
"Le rééquilibrage consiste à ramener périodiquement les proportions à leur cible. Concrètement : si tu visais 70 % d'actions et que tu es à 80 %, tu vends une partie des actions ou, mieux, <strong>tu diriges tes versements suivants vers ce qui a baissé</strong> jusqu'à retrouver ta cible.",
"Cette seconde méthode est nettement préférable pour 2 raisons. Elle ne déclenche <u>aucune vente, donc aucune fiscalité et aucun frais de courtage</u>. Et elle correspond à ce que tu fais déjà, puisque tu verses chaque mois.",
"À quelle fréquence ? <strong>Une fois par an suffit</strong>, et c'est même préférable à davantage. Rééquilibrer trop souvent multiplie les frais et l'imposition pour un bénéfice qui n'est pas démontré. Une variante consiste à ne rééquilibrer que lorsque l'écart dépasse un seuil, par exemple 5 points, ce qui évite d'agir pour rien.",
"Le rééquilibrage a un effet secondaire qui déroute au premier abord : <strong>il oblige à vendre ce qui a monté et à acheter ce qui a baissé.</strong> C'est exactement l'inverse de ce que l'instinct commande, et c'est précisément pour ça qu'il faut le faire à date fixe plutôt qu'au jugé.",
"Il faut cependant être honnête sur ses limites. <u>Le rééquilibrage n'améliore pas nécessairement la performance</u>, et sur longue période une allocation laissée telle quelle a parfois fait mieux. Ce qu'il fait de façon certaine, c'est <strong>maintenir ton niveau de risque à celui que tu as choisi</strong>, ce qui est sa vraie fonction.",
"Un conseil pratique : rattache ce rendez-vous à ta revue annuelle, celle vue dans la formation sur l'épargne. Une seule séance d'une heure, une fois par an, couvre le rééquilibrage, la vérification des frais et le contrôle du fonds d'urgence."
],
quiz:[
{q:"Pourquoi une allocation se déforme-t-elle seule ?",opts:["À cause des frais","Parce que les actifs ne progressent pas au même rythme","À cause de l'inflation","Parce que les indices changent"],correct:1,
explain:"La part de ce qui monte le plus augmente mécaniquement, rendant le portefeuille plus risqué que prévu."},
{q:"Quelle méthode de rééquilibrage est préférable ?",opts:["Vendre ce qui a monté","Diriger les versements suivants vers ce qui a baissé","Tout vendre et racheter","Changer de fonds"],correct:1,
explain:"Aucune vente, donc aucune fiscalité ni frais de courtage, et cela correspond à ce que tu fais déjà chaque mois."},
{q:"Quelle est la vraie fonction du rééquilibrage ?",opts:["Améliorer la performance","Maintenir le niveau de risque à celui qu'on a choisi","Réduire les frais","Optimiser la fiscalité"],correct:1,
explain:"Il n'améliore pas nécessairement la performance, et c'est important de le savoir avant de s'y astreindre."}
],
action:"Ajoute une ligne « rééquilibrage » dans le rendez-vous annuel déjà présent dans ton calendrier. Note à côté ta cible d'allocation en pourcentage. Sans cible écrite, il n'y a rien à rééquilibrer."
},
{module:"Module 5 — Construire son portefeuille", title:"Écrire ta règle d'investissement", duration:"5 min",
script:[
"Cette leçon produit le document le plus utile de toute la formation : ta règle d'investissement, écrite par toi, en 10 lignes. C'est aussi le livrable central de l'accompagnement NiouDem, et tu peux parfaitement l'écrire seul.",
"Pourquoi l'écrire ? Parce qu'une décision prise à froid et notée résiste à une émotion ressentie à chaud. <strong>Sans document, tu improviseras au pire moment</strong>, et tu improviseras mal, comme la formation sur la psychologie l'a montré.",
"Ta règle contient 10 points, et chacun tient en une phrase. <strong>1.</strong> Pourquoi j'investis, avec un objectif précis. <strong>2.</strong> Mon horizon, en années. <strong>3.</strong> Mon montant mensuel. <strong>4.</strong> L'enveloppe utilisée. <strong>5.</strong> Ce que je détiens, en une ou 2 lignes maximum.",
"<strong>6.</strong> Mon allocation cible, en pourcentages. <strong>7.</strong> Ce que je fais si les marchés baissent de 30 % : la réponse est presque toujours <em>je continue à verser sans rien changer</em>. <strong>8.</strong> Ce que je fais si un actif monte fortement : je rééquilibre à la date prévue, je ne renforce pas dans l'euphorie.",
"<strong>9.</strong> Dans quelles conditions précises je suspends mes versements, formulées en termes de situation personnelle et jamais de niveau de marché. <strong>10.</strong> Quand je relis ce document : une fois par an, à date fixe.",
"Une règle importante sur la forme : <u>tout ce qui ne tient pas sur une page ne sera pas relu.</u> Résiste à l'envie de tout prévoir. Une règle courte et appliquée bat une stratégie détaillée et oubliée.",
"Un test de validité avant de la ranger. Relis ton document et demande-toi : <strong>est-ce que quelqu'un d'autre pourrait l'appliquer à ma place sans me poser de question ?</strong> Si la réponse est non, c'est qu'il reste des zones floues, et les zones floues sont exactement là où l'émotion s'engouffre.",
"Range ce document là où tu le retrouveras, et surtout <strong>relis-le avant chaque décision importante.</strong> Dans 5 ans, tu constateras que sa principale valeur n'aura pas été de te guider, mais de t'avoir empêché d'agir."
],
quiz:[
{q:"Pourquoi écrire sa règle d'investissement ?",opts:["Pour la montrer à son courtier","Parce qu'une décision prise à froid résiste à une émotion ressentie à chaud","C'est une obligation réglementaire","Pour calculer sa fiscalité"],correct:1,
explain:"Sans document, on improvise au pire moment, et on improvise mal."},
{q:"Quelle contrainte de forme s'impose ?",opts:["Au moins 5 pages détaillées","Tout doit tenir sur une page, sinon ce ne sera pas relu","Un format imposé par l'AMF","Une mise à jour mensuelle"],correct:1,
explain:"Une règle courte et appliquée bat une stratégie détaillée et oubliée."},
{q:"Quel test valide le document ?",opts:["L'avis d'un professionnel","Quelqu'un d'autre pourrait-il l'appliquer sans poser de question ?","Sa performance simulée","Sa conformité au questionnaire du courtier"],correct:1,
explain:"Les zones floues sont exactement là où l'émotion s'engouffre le jour venu."}
],
action:"Écris tes 10 lignes ce soir, sur une seule page. Ne cherche pas la perfection : une version imparfaite écrite aujourd'hui vaut mieux qu'une version parfaite écrite jamais. Tu la réviseras à ta revue annuelle."
},
{module:"Module 6 — Tenir dans la durée", title:"Les 5 erreurs qui reviennent toujours", duration:"5 min",
script:[
"Ces 5 erreurs représentent l'essentiel des pertes des investisseurs particuliers. Aucune ne relève d'un manque d'intelligence, toutes relèvent de mécanismes prévisibles.",
"<strong>Erreur 1 : chercher le bon moment.</strong> Attendre une baisse pour entrer conduit le plus souvent à ne jamais entrer, puis à entrer après une hausse par peur de rater. <u>Le temps passé hors du marché coûte davantage que le prix d'entrée</u>, et c'est mesuré.",
"<strong>Erreur 2 : réagir à l'actualité.</strong> Une information relayée partout est déjà intégrée dans les prix au moment où tu la lis. Agir dessus revient à arriver après tout le monde, en payant des frais pour le privilège.",
"<strong>Erreur 3 : concentrer sur ce qu'on connaît.</strong> Investir uniquement dans son pays, son secteur ou l'entreprise qui l'emploie procure un sentiment de maîtrise trompeur. Le cas le plus grave est celui du salarié fortement investi dans sa propre entreprise : <strong>si elle va mal, il perd son emploi et son épargne en même temps.</strong>",
"<strong>Erreur 4 : changer de stratégie tous les 6 mois.</strong> Passer d'une approche à une autre parce que la première n'a rien produit revient à vendre bas et acheter haut, méthodiquement. Une stratégie médiocre appliquée 15 ans bat une excellente stratégie changée 4 fois.",
"<strong>Erreur 5 : ignorer les frais.</strong> Ils sont le seul élément dont tu es certain à l'avance. Un point de frais annuel en plus ampute le résultat final d'environ 12 % sur 20 ans, soit près d'un quart des gains, et personne ne t'en parlera spontanément.",

async function requireUnlock(userId){
  /* La formation d'entrée n'est jamais verrouillée : la vérifier ici
     provoquerait une redirection de la page vers elle-même, donc une
     boucle infinie. */
  if(FORMATION === 'monnaie') return true;

  const { data: badge } = await sb.from('badges')
    .select('badge_name').eq('user_id', userId).eq('badge_name','le_declic').maybeSingle();

  if(ici === PAGE_PORTE){
    console.warn('Verrou actif sur la page d\'entrée : redirection ignorée.');

  window.location.href = PAGE_PORTE + '?verrou=1';

async function loadProgressFromServer(){
  const { data } = await sb
    .from('lesson_progress')
    .select('lesson_number, completed')
    .eq('user_id', CURRENT_USER.id)
    .eq('formation', FORMATION);
  const p = {};
  if(data){ data.forEach(function(row){ if(row.completed) p[row.lesson_number] = true; }); }
  PROGRESS_CACHE = p;
  return p;
}
function getProgress(){ return PROGRESS_CACHE; }
async function setProgressServer(lessonNumber, value){
  PROGRESS_CACHE[lessonNumber] = value;
  await sb.from('lesson_progress').upsert({
    user_id: CURRENT_USER.id,
    formation: FORMATION,
    lesson_number: lessonNumber,
    completed: value,
    completed_at: value ? new Date().toISOString() : null
  }, { onConflict: 'user_id,formation,lesson_number' });

  await majCarnet(lessonNumber, value);
}

/* Le carnet de route : l'action cochée s'inscrit dans le carnet personnel,
   la décocher l'en retire. Une erreur ici ne doit jamais bloquer la
   progression de la leçon, d'où le try/catch silencieux. */
async function majCarnet(lessonNumber, value){
  try {
    const l = LESSONS[lessonNumber - 1];
    if(!l) return;

    if(!value){
      await sb.from('carnet').delete()
        .eq('user_id', CURRENT_USER.id)
        .eq('formation', FORMATION)
        .eq('lesson_number', lessonNumber);
      return;
    }

    await sb.from('carnet').upsert({
      user_id: CURRENT_USER.id,
      formation: FORMATION,
      lesson_number: lessonNumber,
      titre: l.title || ('Leçon ' + lessonNumber),
      action: l.action || ''
    }, { onConflict: 'user_id,formation,lesson_number', ignoreDuplicates: true });
  } catch(e){
    console.warn('Carnet non mis à jour :', e);
  }
}

let current = parseInt(new URLSearchParams(location.search).get('l')) || 1;
if(current < 1) current = 1;
if(current > LESSONS.length) current = LESSONS.length;

function isUnlocked(n){
  if(n === 1) return true;
  const progress = getProgress();
  return !!progress[n-1];
}

let quizState = {};

function allQuizCorrect(l){
  for(let i=0;i<l.quiz.length;i++){ if(!quizState[i]) return false; }
  return true;
}

function renderSidebar(){
  const progress = getProgress();
  const doneCount = Object.keys(progress).filter(function(k){ return progress[k]; }).length;
  document.getElementById('navProgress').textContent = doneCount + '/' + LESSONS.length + ' leçons';

  /* Regroupement des lecons par module : c'est le module qui devient
     l'etape de l'itineraire, la lecon n'est qu'un arret. */
  const etapes = [];
  LESSONS.forEach(function(l, i){
    const nom = l.module.split(' — ')[1] || l.module;
    let e = etapes.find(function(x){ return x.nom === nom; });
    if(!e){ e = { nom: nom, lecons: [] }; etapes.push(e); }
    e.lecons.push({ n: i + 1, titre: l.title });
  });

  const etapeCourante = etapes.findIndex(function(e){
    return e.lecons.some(function(a){ return a.n === current; });
  });

  const COCHE = '<svg viewBox="0 0 24 24" fill="none"><path d="M5 12L10 17L19 7" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  let html = '<div class="itin">' +
    '<div class="itin-tete">' +
      '<div class="itin-formation">' + NOM_FORMATION + '</div>' +
      '<div class="itin-compte">Étape ' + (etapeCourante + 1) + ' sur ' + etapes.length + ' · ' + doneCount + '/' + LESSONS.length + ' leçons</div>' +
      '<div class="itin-barre"><span style="width:' + Math.round(doneCount / LESSONS.length * 100) + '%"></span></div>' +
    '</div><div class="route">';

  etapes.forEach(function(e, idx){
    const toutesFaites = e.lecons.every(function(a){ return progress[a.n]; });
    const ici = idx === etapeCourante;
    const premiereAccessible = e.lecons.find(function(a){ return isUnlocked(a.n); });
    const classe = toutesFaites ? 'faite' : (ici ? 'ici' : '');
    const borne = toutesFaites ? COCHE : String(idx + 1);
    const cible = premiereAccessible ? premiereAccessible.n : e.lecons[0].n;

    html += '<div class="etape-i ' + classe + '">' +
      '<span class="borne">' + borne + '</span>' +
      '<button class="etape-titre" onclick="goTo(' + cible + ')">' + e.nom + '</button>' +
      '<div class="etape-meta">' + e.lecons.length + ' leçon' + (e.lecons.length > 1 ? 's' : '') + '</div>';

    /* On ne deroule que l'etape ou l'on se trouve : la carte reste lisible. */
    if(ici){
      html += '<div class="arrets">';
      e.lecons.forEach(function(a){
        const fait = !!progress[a.n];
        const ouvert = isUnlocked(a.n);
        const cl = (a.n === current ? 'ici ' : '') + (fait ? 'faite ' : '') + (ouvert ? '' : 'bloque');
        html += '<div class="arret ' + cl + '" onclick="goTo(' + a.n + ')">' +
          '<span class="puce">' + COCHE + '</span><span>' + a.titre + '</span></div>';
      });
      html += '</div>';
    }
    html += '</div>';
  });

  html += '</div>' + escaleHtml() + '</div>';
  document.getElementById('sidebar').innerHTML = html;
}

  { cle:'immobilier',  nom:'Investir dans la pierre', page:'lecons-immobilier.html' },
  { cle:'epargne',     nom:'Épargne & sécurité',      page:'lecons-epargne.html' },
  { cle:'fiscalite',   nom:'Optimisation fiscale',    page:'lecons-fiscalite.html' }
];

function escaleHtml(){
  let h = '<div class="escale"><div class="escale-titre">Autres formations</div>';
  PARCOURS.forEach(function(p){
    const courante = p.cle === FORMATION;
    h += '<a href="' + p.page + '" class="' + (courante ? 'courante' : 'prete') + '">' +
      '<span class="jeton"></span><span>' + p.nom + '</span></a>';
  });
  h += '</div>';
  return h;
}

function goTo(n){
  if(!isUnlocked(n)){
    alert('Termine la leçon précédente pour débloquer celle-ci.');
    return;
  }
  current = n;
  history.replaceState(null, '', '?l=' + n);
  render();
  window.scrollTo(0,0);
}

function render(){
  renderSidebar();
  const l = LESSONS[current-1];
  const progress = getProgress();
  const done = !!progress[current];
  quizState = {};
  if(done){ l.quiz.forEach(function(q,i){ quizState[i] = true; }); }
  const main = document.getElementById('main');
  let quizHtml = '';
  l.quiz.forEach(function(q, qi){
    let optsHtml = '';
    q.opts.forEach(function(opt, oi){
      const preAnswered = done && oi === q.correct;
      optsHtml += '<div class="quiz-opt ' + (preAnswered?'correct disabled':'') + '" id="q' + qi + 'o' + oi + '" onclick="answerQuiz(' + qi + ',' + oi + ',' + q.correct + ')">' +
        '<span class="quiz-letter">' + String.fromCharCode(65+oi) + '</span><span class="quiz-opt-text">' + opt + '</span></div>';
    });
    quizHtml += '<div class="quiz-card"><div class="quiz-q">Question ' + (qi+1) + '. ' + q.q + '</div>' + optsHtml +
      '<div class="quiz-explain ' + (done?'show':'') + '" id="exp' + qi + '"><strong>Explication : </strong>' + q.explain + '</div></div>';
  });

  const quizOk = allQuizCorrect(l);
  const actionCardStyle = (!quizOk && !done) ? 'opacity:.5;pointer-events:none;' : '';

  main.innerHTML =
    (done ? '<div class="completion-badge show">✓ Leçon terminée</div>' : '') +
    '<div class="lesson-eyebrow">' + l.module + '</div>' +
    '<div class="lesson-title">' + (current) + '. ' + l.title + '</div>' +
    '<div class="lesson-meta">' + l.duration + ' de lecture · Leçon ' + current + ' sur ' + LESSONS.length + '</div>' +
    '<div class="section-label"><span class="dot"></span>Comprendre</div>' +
    '<div class="script-text">' + l.script.map(function(p){
      return p.indexOf('<figure') === 0 ? p : '<p>' + p + '</p>';
    }).join('') + '</div>' +
    '<div class="section-label quiz"><span class="dot"></span>Vérifier</div>' +
    quizHtml +
    '<div class="section-label action"><span class="dot"></span>Petite action</div>' +
    (!quizOk && !done ? '<div style="font-size:12.5px;font-weight:600;color:var(--coral);margin-bottom:10px;">Réponds correctement aux ' + l.quiz.length + ' questions pour débloquer cette action.</div>' : '') +
    '<div class="action-card" id="actionCard" style="' + actionCardStyle + '">' +
      '<div class="action-text">' + l.action + '</div>' +
      '<div class="action-check" onclick="toggleAction()"><span class="action-box ' + (done?'checked':'') + '" id="actionBox">' + (done?'✓':'') + '</span><span class="action-label">Marquer cette leçon comme terminée</span></div>' +
    '</div>' +
    '<div class="lesson-nav">' +
      (current > 1 ? '<button class="nav-btn ghost" onclick="goTo(' + (current-1) + ')">← Leçon précédente</button>' : '<span></span>') +
      (current < LESSONS.length ? '<button class="nav-btn" onclick="goTo(' + (current+1) + ')">Leçon suivante →</button>' : '<a href="lecons-fiscalite.html" class="nav-btn">Optimisation fiscale →</a>') +
    '</div>' +

    '<div class="lesson-sortie">' +
      '<a href="index.html#formations">Sommaire des formations</a><span>·</span>' +
      '<a href="carnet.html">Mon carnet</a><span>·</span>' +
      '<a href="index.html">Retour au site</a>' +
    '</div>';
}

function answerQuiz(qi, oi, correct){
  if(quizState[qi]) return;
  const chosen = document.getElementById('q'+qi+'o'+oi);
  if(chosen.classList.contains('disabled')) return;

  if(oi === correct){
    for(let k=0;k<10;k++){
      const el = document.getElementById('q'+qi+'o'+k);
      if(el){ el.classList.add('disabled'); }
    }
    chosen.classList.add('correct');
    quizState[qi] = true;
    document.getElementById('exp'+qi).classList.add('show');
    const l = LESSONS[current-1];
    const quizOk = allQuizCorrect(l);
    const card = document.getElementById('actionCard');
    if(quizOk && card){
      card.style.opacity = '';
      card.style.pointerEvents = '';
      const lock = card.previousElementSibling;
      if(lock && lock.textContent.indexOf('Réponds correctement') !== -1){ lock.style.display = 'none'; }
    }
  } else {
    chosen.classList.add('wrong');
    document.getElementById('exp'+qi).classList.add('show');
    setTimeout(function(){ chosen.classList.remove('wrong'); }, 900);
  }
}

async function toggleAction(){
  const l = LESSONS[current-1];
  const progress = getProgress();
  const newValue = !progress[current];
  if(newValue && !allQuizCorrect(l)){
    alert('Réponds correctement à toutes les questions du quiz avant de valider cette leçon.');
    return;
  }
  await setProgressServer(current, newValue);
  render();

  /* La formation vient-elle de s'achever ? Si oui, on plante la borne.
     On ne la montre qu'au moment du basculement, jamais en revenant
     sur une leçon déjà validée. */
  if(newValue) verifierFinDeParcours();
}

async function verifierFinDeParcours(){
  const progress = getProgress();
  const faites = Object.keys(progress).filter(function(k){ return progress[k]; }).length;
  if(faites < LESSONS.length) return;

  let prenom = '';
  let semaines = 1;
  try {
    const { data } = await sb.from('profiles').select('prenom').eq('id', CURRENT_USER.id).maybeSingle();
    if(data && data.prenom) prenom = data.prenom;

    const { data: dates } = await sb.from('lesson_progress')
      .select('completed_at').eq('user_id', CURRENT_USER.id).eq('formation', FORMATION)
      .not('completed_at', 'is', null).order('completed_at', { ascending: true }).limit(1);
    if(dates && dates.length){
      const debut = new Date(dates[0].completed_at).getTime();
      semaines = Math.max(1, Math.round((Date.now() - debut) / (7*24*3600*1000)));
    }
  } catch(e){ console.warn('Carte : données partielles', e); }

  ouvrirCarte(FORMATION, LESSONS.length, prenom, semaines);
}

async function boot(){
  document.getElementById('main').innerHTML = '<div style="padding:60px 0;text-align:center;color:var(--ink-faint);font-size:14px;">Chargement de ta progression…</div>';
  const user = await requireAuth();
  if(!user) return;
  const unlocked = await requireUnlock(user.id);
  if(!unlocked) return;
  CURRENT_USER = user;
  await loadProgressFromServer();

  if(!isUnlocked(current)){
    let lastUnlocked = 1;
    for(let i=1;i<=LESSONS.length;i++){ if(isUnlocked(i)) lastUnlocked = i; else break; }
    current = lastUnlocked;
    history.replaceState(null, '', '?l=' + current);
  }
  render();
}
boot();
</script>
