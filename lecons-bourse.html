<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --ink:#12212B;--ink-soft:#43555F;--ink-muted:#7A8A93;--ink-faint:#96A3AA;
  --bg:#FCFBF8;--bg-soft:#F5F4EE;--bg-mid:#EFF0EA;--bg-line:#DCDDD3;
  --green:#1E4B3C;--green-light:#2A6350;--green-pale:#E7EFEA;--green-bord:#BFD6C9;
  --amber:#B8862F;--amber-pale:#F6EFE0;--amber-bord:#E4D2AC;
  --violet:#4A5C6B;--violet-pale:#EDF0F2;--violet-bord:#D4DBE0;
  --coral:#A24332;--coral-pale:#F8EDEA;
  --sans:'Karla',system-ui,-apple-system,sans-serif;
  --display:'Newsreader',Georgia,serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
body{font-family:var(--sans);background:var(--bg-soft);color:var(--ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;}
a{color:inherit;}
.nav{position:sticky;top:0;z-index:200;background:rgba(255,255,255,.96);backdrop-filter:blur(20px);border-bottom:1px solid var(--bg-line);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;font-weight:800;font-size:15px;color:var(--ink);}
.nav-mark{width:26px;height:26px;border-radius:8px;background:var(--green);display:flex;align-items:center;justify-content:center;}
.nav-mark svg{width:14px;height:14px;}
.nav-back{font-size:13px;font-weight:600;color:var(--ink-muted);text-decoration:none;}
.nav-progress-pill{font-size:12px;font-weight:700;color:var(--green);background:var(--green-pale);padding:5px 12px;border-radius:100px;}
.layout{display:grid;grid-template-columns:280px 1fr;max-width:1100px;margin:0 auto;min-height:calc(100vh - 60px);}
.sidebar{border-right:1px solid var(--bg-line);background:var(--bg);padding:24px 16px;position:sticky;top:60px;align-self:start;height:calc(100vh - 60px);overflow-y:auto;}
.sb-progress-bar{height:6px;background:var(--bg-mid);border-radius:100px;overflow:hidden;margin:0 10px 18px;}
.sb-progress-fill{height:100%;background:var(--green);border-radius:100px;transition:width .3s;}
.sb-item{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:10px;cursor:pointer;margin-bottom:2px;font-size:13px;font-weight:600;color:var(--ink-muted);transition:background .15s;}
.sb-item:hover{background:var(--bg-soft);}
.sb-item.active{background:var(--green-pale);color:var(--green);}
.sb-item.done{color:var(--ink);}
.sb-item.locked{opacity:.45;cursor:not-allowed;}
.sb-item.locked:hover{background:transparent;}
.sb-check{width:20px;height:20px;border-radius:50%;background:var(--bg-mid);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink-faint);flex-shrink:0;}
.sb-item.done .sb-check{background:var(--green);color:#fff;}
.sb-item.active .sb-check{background:var(--green);color:#fff;}
.sb-module-label{font-size:10.5px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em;padding:14px 10px 6px;}
.main{padding:36px 40px 80px;max-width:720px;}
.lesson-eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green);margin-bottom:10px;}
.lesson-title{font-size:28px;font-weight:800;letter-spacing:-.03em;color:var(--ink);margin-bottom:8px;line-height:1.15;}
.lesson-meta{font-size:13px;color:var(--ink-faint);margin-bottom:32px;}
.section-label{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-muted);margin:36px 0 16px;}
.section-label .dot{width:6px;height:6px;border-radius:50%;background:var(--green);}
.section-label.quiz .dot{background:var(--violet);}
.section-label.action .dot{background:var(--amber);}
.script-text p{font-size:15.5px;font-weight:400;color:var(--ink-soft);line-height:1.75;margin-bottom:18px;}
.quiz-card{background:var(--bg);border:1px solid var(--bg-line);border-radius:16px;padding:24px;margin-bottom:14px;}
.quiz-q{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:16px;line-height:1.5;}
.quiz-opt{display:flex;align-items:flex-start;gap:12px;padding:13px 15px;border:1.5px solid var(--bg-line);border-radius:11px;margin-bottom:9px;cursor:pointer;transition:border-color .15s,background .15s;}
.quiz-opt:hover{border-color:var(--ink-faint);}
.quiz-opt.correct{border-color:var(--green);background:var(--green-pale);}
.quiz-opt.wrong{border-color:var(--coral);background:var(--coral-pale);}
.quiz-opt.disabled{cursor:default;pointer-events:none;}
.quiz-letter{width:24px;height:24px;border-radius:7px;background:var(--bg-soft);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--ink-muted);flex-shrink:0;}
.quiz-opt.correct .quiz-letter{background:var(--green);color:#fff;}
.quiz-opt.wrong .quiz-letter{background:var(--coral);color:#fff;}
.quiz-opt-text{font-size:13.5px;font-weight:500;color:var(--ink);padding-top:2px;}
.quiz-explain{display:none;font-size:13px;font-weight:400;color:var(--ink-muted);line-height:1.6;background:var(--bg-soft);border-radius:10px;padding:14px 16px;margin-top:8px;}
.quiz-explain.show{display:block;}
.quiz-explain strong{color:var(--ink);}
.action-card{background:var(--amber-pale);border:1px solid var(--amber-bord);border-radius:16px;padding:22px 24px;}
.action-text{font-size:14.5px;font-weight:500;color:var(--ink);line-height:1.65;margin-bottom:16px;}
.action-check{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;}
.action-box{width:22px;height:22px;border-radius:7px;border:2px solid var(--amber);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;transition:background .15s;}
.action-box.checked{background:var(--amber);}
.action-label{font-size:13px;font-weight:700;color:#8a6a00;}
.lesson-nav{display:flex;justify-content:space-between;align-items:center;margin-top:40px;padding-top:24px;border-top:1px solid var(--bg-line);}
.nav-btn{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border:none;cursor:pointer;font-family:var(--sans);font-size:14px;font-weight:700;padding:13px 24px;border-radius:11px;text-decoration:none;transition:background .2s;}
.nav-btn:hover{background:var(--ink-soft);}
.nav-btn.ghost{background:var(--bg-mid);color:var(--ink-muted);}
.nav-btn.ghost:hover{background:var(--bg-line);}
.completion-badge{display:none;align-items:center;gap:8px;background:var(--green-pale);color:var(--green);font-size:12.5px;font-weight:700;padding:8px 16px;border-radius:100px;margin-bottom:20px;}
.completion-badge.show{display:inline-flex;}
@media(max-width:860px){
  .layout{grid-template-columns:1fr;}
  .sidebar{position:static;height:auto;border-right:none;border-bottom:1px solid var(--bg-line);}
  .main{padding:28px 20px 60px;}
}

/* ===== Direction Encre & Laiton — surcouche typographique ===== */
body{font-family:var(--sans);letter-spacing:0;}
h1,h2,h3,h4,.hero-h1,.s-title,.cta-h2,.p-name,.mod-title,.c-title,.hc-title,
.lecon-title,.q-title,.auth-title,.perf-title,.section-title,.edu-title,.tips-title{
  font-family:var(--display);letter-spacing:-.015em;
}
.hero-h1,.s-title,.cta-h2,.auth-title{font-weight:500;letter-spacing:-.018em;line-height:1.16;}
h3,h4,.p-name,.mod-title,.c-title,.hc-title,.lecon-title{font-weight:600;}
.s-tag,.f-copy,.hstat-label,.stat-label,.perf-note,.order-meta,.pos-value,
.price-cell,.asset-label,.badge,.eyebrow,.nav-balance{font-family:var(--mono);}

.nav-name em,.ft-name em{font-style:normal;color:var(--amber);}

/* Mise en valeur dans le corps des lecons : le gras porte la notion a
   retenir, l italique la nuance ou le terme technique. */
.script-text strong{color:var(--ink,#12212B);font-weight:700;}
.script-text em{font-style:italic;color:var(--ink-soft,#43555F);}
.script-text u{text-decoration:none;background:linear-gradient(transparent 62%,var(--amber-pale,#F6EFE0) 62%);
  box-shadow:inset 0 -1px 0 var(--amber,#B8862F);}
.script-text p + p{margin-top:14px;}

/* ===== L'itineraire =====
   Une route verticale plutot qu'une liste : on voit d'ou l'on vient,
   ou l'on est, et ce qu'il reste. Meme vocabulaire graphique que le
   carnet de route et les emblemes. */
.itin{padding:4px 4px 24px;}
.itin-tete{padding:0 8px 16px;border-bottom:1px solid var(--bg-line);margin-bottom:16px;}
.itin-formation{font-family:var(--display);font-size:16px;font-weight:600;color:var(--ink);line-height:1.25;}
.itin-compte{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-muted);margin-top:7px;}
.itin-barre{height:4px;background:var(--bg-mid);border-radius:100px;overflow:hidden;margin-top:10px;}
.itin-barre span{display:block;height:100%;background:var(--amber);border-radius:100px;transition:width .4s cubic-bezier(.4,0,.2,1);}

/* La route */
.route{position:relative;padding-left:30px;}
.route::before{content:"";position:absolute;left:11px;top:14px;bottom:14px;width:2px;
  background:repeating-linear-gradient(var(--bg-line) 0 6px, transparent 6px 11px);}
.etape-i{position:relative;margin-bottom:6px;}
.borne{position:absolute;left:-30px;top:6px;width:24px;height:24px;border-radius:50%;
  background:var(--bg);border:2px solid var(--bg-line);display:grid;place-items:center;
  font-family:var(--mono);font-size:10px;color:var(--ink-faint);z-index:1;transition:all .2s;}
.borne svg{width:11px;height:11px;}
.etape-i.faite .borne{background:var(--amber);border-color:var(--amber);color:#fff;}
.etape-i.ici .borne{background:var(--green);border-color:var(--green);color:#fff;
  box-shadow:0 0 0 4px var(--green-pale);}
.etape-titre{display:block;width:100%;text-align:left;background:transparent;border:0;cursor:pointer;
  font-family:var(--display);font-size:14.5px;font-weight:600;color:var(--ink-soft);
  padding:7px 9px;border-radius:9px;line-height:1.3;transition:background .15s,color .15s;}
.etape-titre:hover{background:var(--bg-soft);color:var(--ink);}
.etape-i.ici .etape-titre{color:var(--green);}
.etape-i.faite .etape-titre{color:var(--ink);}
.etape-meta{font-family:var(--mono);font-size:10px;color:var(--ink-faint);padding:0 9px 4px;letter-spacing:.06em;}

/* Les lecons de l'etape en cours */
.arrets{margin:2px 0 12px;padding-left:9px;border-left:1px solid var(--bg-line);}
.arret{display:flex;align-items:flex-start;gap:9px;padding:7px 9px;border-radius:8px;cursor:pointer;
  font-size:12.8px;font-weight:500;color:var(--ink-muted);transition:background .15s;line-height:1.35;}
.arret:hover{background:var(--bg-soft);color:var(--ink);}
.arret.ici{background:var(--green-pale);color:var(--green);font-weight:700;}
.arret.faite{color:var(--ink);}
.arret.bloque{opacity:.42;cursor:not-allowed;}
.arret.bloque:hover{background:transparent;}
.puce{width:15px;height:15px;border-radius:4px;flex:none;margin-top:1px;border:1.5px solid var(--bg-line);
  display:grid;place-items:center;background:var(--bg);}
.puce svg{width:9px;height:9px;opacity:0;}
.arret.faite .puce{background:var(--amber);border-color:var(--amber);}
.arret.faite .puce svg{opacity:1;}
.arret.ici .puce{border-color:var(--green);border-style:dashed;}

/* Changer de formation sans repasser par le menu */
.escale{margin-top:22px;padding-top:16px;border-top:1px solid var(--bg-line);}
.escale-titre{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-faint);padding:0 9px 9px;}
.escale a{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;text-decoration:none;
  font-size:12.8px;color:var(--ink-soft);transition:background .15s;}
.escale a:hover{background:var(--bg-soft);color:var(--ink);}
.escale a.courante{background:var(--green-pale);color:var(--green);font-weight:700;}
.jeton{width:7px;height:7px;border-radius:50%;background:var(--bg-line);flex:none;}
.escale a.courante .jeton{background:var(--green);}
.escale a.prete .jeton{background:var(--amber);}

@media(max-width:860px){
  .itin{padding-bottom:8px;}
  .route{padding-left:26px;}
  .borne{left:-26px;}
}
@media(prefers-reduced-motion:reduce){*{transition:none !important;}}

/* ===== Schemas des lecons ===== */
.schema{margin:26px 0;padding:20px 18px 14px;border:1px solid var(--bg-line,#DCDDD3);
  border-radius:12px;background:var(--bg,#FCFBF8);}
.schema svg{width:100%;height:auto;display:block;}
.schema figcaption{font-family:var(--mono,monospace);font-size:11.5px;line-height:1.55;
  color:var(--ink-muted,#7A8A93);margin-top:14px;padding-top:12px;
  border-top:1px solid var(--bg-line,#DCDDD3);}
@media(max-width:620px){.schema{padding:14px 12px 10px;margin:20px -6px;}}

.script-text strong{color:var(--ink,#12212B);font-weight:700;}
.script-text em{font-style:italic;color:var(--ink-soft,#43555F);}
.script-text u{text-decoration:none;background:linear-gradient(transparent 62%,var(--amber-pale,#F6EFE0) 62%);
  box-shadow:inset 0 -1px 0 var(--amber,#B8862F);}
.script-text p + p{margin-top:14px;}

/* Sortie de leçon : on peut toujours s'arrêter sans se sentir coincé. */
.lesson-sortie{display:flex;flex-wrap:wrap;align-items:center;gap:9px;justify-content:center;
  margin-top:24px;padding-top:18px;border-top:1px solid var(--bg-line);
  font-size:13.5px;color:var(--ink-faint);}
.lesson-sortie a{color:var(--ink-muted);text-decoration:none;font-weight:600;}
.lesson-sortie a:hover{color:var(--green);}
</style>
</head>

<script>
/* ============ DONNÉES DES 24 LEÇONS — PREMIERS PAS EN BOURSE ============ */
const LESSONS = [
{module:"Module 1 — Comment fonctionne la bourse", title:"La bourse expliquée simplement", duration:"5 min",
script:[
"La bourse souffre d'une réputation double : celle du casino pour les uns, celle du club réservé pour les autres. Les 2 sont fausses, et cette leçon explique ce qu'elle est réellement.",
"<strong>Une action est une part d'entreprise.</strong> Rien de plus. Détenir une action, c'est posséder une fraction minuscule d'une société : de ses usines, de ses marques, de ses contrats et de ses bénéfices futurs. Si l'entreprise gagne de l'argent, tu y as droit à proportion de ce que tu détiens.",
"La bourse est simplement <strong>le lieu où ces parts s'échangent</strong>. Elle existe parce qu'une entreprise a besoin de capitaux pour se développer, et que des gens acceptent de les lui fournir en échange d'une part de ce qu'elle produira. Ce mécanisme a financé la quasi-totalité des entreprises que tu connais.",
"D'où vient alors l'image du casino ? De la confusion entre 2 activités qui n'ont presque rien en commun. <strong>Investir</strong>, c'est acheter une part d'entreprise pour la conserver des années, en pariant sur sa capacité à produire de la valeur. <strong>Spéculer</strong>, c'est acheter pour revendre plus cher à court terme, en pariant sur le mouvement du prix. <u>Le premier repose sur l'économie réelle, le second sur l'anticipation du comportement des autres.</u>",
"Cette formation ne traite que du premier, et il faut le dire clairement : <strong>tout ce qui promet des gains rapides relève du second</strong>, avec des résultats bien documentés. Les études sur les particuliers actifs à court terme montrent qu'une large majorité y perd de l'argent.",
"Un mot sur le prix, parce qu'il déroute souvent. Le cours d'une action ne reflète pas ce que l'entreprise vaut aujourd'hui, mais <strong>ce que les acheteurs et les vendeurs anticipent de son avenir.</strong> C'est pourquoi une action peut baisser alors que l'entreprise annonce des bénéfices : le marché attendait mieux. Comprendre cela évite beaucoup d'incompréhensions.",
"Retiens l'essentiel : la bourse n'est ni un jeu ni un privilège. C'est un mécanisme de financement, accessible avec quelques dizaines d'euros, dont le résultat dépend surtout de la durée pendant laquelle tu acceptes de ne pas y toucher."
],
quiz:[
{q:"Qu'est-ce qu'une action ?",opts:["Un prêt fait à une entreprise","Une part de propriété d'une entreprise","Une promesse de rendement","Un contrat d'assurance"],correct:1,
explain:"Tu possèdes une fraction de ses usines, de ses marques et de ses bénéfices futurs."},
{q:"Qu'est-ce qui distingue investir de spéculer ?",opts:["Le montant engagé","L'horizon : la valeur produite par l'entreprise contre le mouvement du prix à court terme","Le type de courtier","La fiscalité applicable"],correct:1,
explain:"Le premier repose sur l'économie réelle, le second sur l'anticipation du comportement des autres."},
{q:"Pourquoi une action peut-elle baisser malgré de bons résultats ?",opts:["Par erreur du marché","Parce que le cours reflète les anticipations, et que le marché attendait mieux","Parce que les dividendes sont versés","Parce que la bourse est irrationnelle"],correct:1,
explain:"Le prix intègre l'avenir espéré, pas la performance passée. C'est la source d'incompréhension la plus fréquente."}
],
action:"Choisis une entreprise dont tu utilises les produits chaque semaine. Cherche 5 minutes qui elle est, ce qu'elle vend et si elle est cotée. L'objectif n'est pas d'acheter, mais de constater que la bourse parle d'entreprises que tu connais déjà."
},
{module:"Module 1 — Comment fonctionne la bourse", title:"Pourquoi les marchés montent sur le long terme", duration:"5 min",
script:[
"Sur de longues périodes, les grands indices boursiers mondiaux ont progressé. Ce n'est ni une loi de la nature ni une garantie, et comprendre <em>pourquoi</em> permet de savoir dans quelles conditions cela pourrait cesser.",
"<strong>Raison 1 : les entreprises réinvestissent leurs bénéfices.</strong> Une société qui gagne de l'argent peut le distribuer ou l'employer à se développer. Ce réinvestissement produit de nouveaux bénéfices, qui financent de nouveaux développements. C'est le même mécanisme que les intérêts composés, appliqué à l'économie productive.",
"<strong>Raison 2 : la population et la productivité augmentent.</strong> Plus de personnes produisent et consomment, et chacune produit davantage grâce aux outils et aux connaissances accumulées. Une part de la hausse vient simplement de là.",
"<strong>Raison 3 : l'inflation gonfle les chiffres.</strong> Les prix montent, donc les chiffres d'affaires et les bénéfices montent aussi, en euros courants. Une partie de la performance affichée n'est donc pas un enrichissement réel, ce que la formation sur la monnaie t'a appris à distinguer.",
"<strong>Raison 4 : les indices se renouvellent.</strong> Point rarement expliqué et pourtant décisif. Un indice n'est pas une liste figée : les entreprises en difficulté en sortent, les entreprises en croissance y entrent. <u>L'indice se nettoie donc en permanence</u>, ce qui explique une part de sa progression et pourquoi il est plus robuste qu'une action isolée.",
"Maintenant les limites, parce qu'elles comptent autant. Cette progression n'est <strong>ni régulière ni garantie</strong>. Il existe des périodes de 10 ans, et parfois davantage, sans progression. Certains marchés nationaux ont mis des décennies à retrouver un sommet. Et le passé ne dit rien de certain sur l'avenir.",
"La conclusion pratique tient en une phrase, et c'est celle qui gouverne toute la formation : <strong>ce raisonnement ne vaut que sur des durées longues et sur un ensemble large d'entreprises.</strong> Il ne s'applique ni à une action isolée, ni à un horizon de 2 ans."
],
quiz:[
{q:"Quel mécanisme rarement expliqué contribue à la hausse des indices ?",opts:["L'intervention des banques centrales","Le renouvellement permanent des entreprises qui composent l'indice","La spéculation","Les dividendes"],correct:1,
explain:"Les entreprises en difficulté sortent, les entreprises en croissance entrent. L'indice se nettoie en continu."},
{q:"La progression des marchés est-elle garantie ?",opts:["Oui, sur 10 ans","Non, il existe des périodes longues sans progression","Oui, si l'on diversifie","Oui, dans les pays développés"],correct:1,
explain:"Certains marchés ont mis des décennies à retrouver un sommet. Le passé ne garantit rien."},
{q:"À quoi s'applique ce raisonnement ?",opts:["À toute action, sur toute durée","À un ensemble large d'entreprises, sur une durée longue","Aux entreprises technologiques","Aux marchés émergents uniquement"],correct:1,
explain:"Il ne vaut ni pour une action isolée, ni pour un horizon de 2 ans."}
],

},
{module:"Module 1 — Comment fonctionne la bourse", title:"Actions, fonds et trackers", duration:"5 min",
script:[
"Trois façons d'investir en bourse coexistent, et le choix entre elles détermine à la fois ton risque et le temps que tu devras y consacrer.",
"<strong>Acheter des actions en direct.</strong> Tu choisis toi-même les entreprises. C'est la voie la plus exigeante : elle demande d'analyser des comptes, de suivre l'actualité de chaque société, et d'accepter qu'une entreprise puisse perdre l'essentiel de sa valeur. <u>Détenir 5 actions n'est pas de la diversification</u>, c'est une concentration du risque sur 5 paris.",
"<strong>Les fonds gérés activement.</strong> Une équipe de gestion sélectionne les titres pour toi et cherche à faire mieux que le marché. Tu délègues le travail, en contrepartie de frais annuels qui se situent fréquemment entre 1,5 et 2,5 %. Le point à connaître est documenté depuis des décennies : <strong>sur des périodes longues, une majorité de ces fonds ne parvient pas à dépasser leur indice de référence après frais.</strong>",
"<figure class=\"schema\"><svg viewBox=\"0 0 700 228\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"200\" y=\"20\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" letter-spacing=\"1.4\" fill=\"#1E4B3C\">FONDS INDICIEL</text><text x=\"560\" y=\"20\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" letter-spacing=\"1.4\" fill=\"#B8862F\">FONDS GÉRÉ ACTIVEMENT</text><text x=\"20\" y=\"44\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#43555F\">Frais annuels</text><rect x=\"20\" y=\"54\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#EFF0EA\"/><rect x=\"20\" y=\"54\" width=\"561\" height=\"18\" rx=\"5\" fill=\"#E7EFEA\"/><rect x=\"581\" y=\"54\" width=\"99\" height=\"18\" rx=\"5\" fill=\"#F6EFE0\"/><text x=\"28\" y=\"67\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#1E4B3C\">0,2 à 0,4 %</text><text x=\"672\" y=\"67\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8E661F\">1,5 à 2,5 %</text><text x=\"20\" y=\"100\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#43555F\">Objectif</text><rect x=\"20\" y=\"110\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#EFF0EA\"/><rect x=\"20\" y=\"110\" width=\"330\" height=\"18\" rx=\"5\" fill=\"#E7EFEA\"/><rect x=\"350\" y=\"110\" width=\"330\" height=\"18\" rx=\"5\" fill=\"#F6EFE0\"/><text x=\"28\" y=\"123\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#1E4B3C\">reproduire l'indice</text><text x=\"672\" y=\"123\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8E661F\">battre l'indice</text><text x=\"20\" y=\"156\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#43555F\">Résultat après frais sur longue durée</text><rect x=\"20\" y=\"166\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#EFF0EA\"/><rect x=\"20\" y=\"166\" width=\"475\" height=\"18\" rx=\"5\" fill=\"#E7EFEA\"/><rect x=\"495\" y=\"166\" width=\"185\" height=\"18\" rx=\"5\" fill=\"#F6EFE0\"/><text x=\"28\" y=\"179\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#1E4B3C\">suit l'indice</text><text x=\"672\" y=\"179\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8E661F\">majorité en dessous</text></svg><figcaption>L'écart de frais paraît anodin. Sur 20 ans, 1 point de plus ampute le résultat final d'environ 12 %.</figcaption></figure>",
"<strong>Les fonds indiciels, souvent appelés trackers ou ETF.</strong> Ils ne cherchent pas à battre le marché, seulement à le reproduire. Un fonds qui suit un indice mondial détient des centaines d'entreprises dans des dizaines de pays. Leurs frais annuels sont bien plus faibles, souvent entre 0,2 et 0,4 %.",
"Cet écart de frais paraît anodin et il ne l'est pas. <strong>Sur 20 ans, 1 point de frais annuel en plus ampute le résultat final d'environ 12 %</strong>, soit près d'un quart des gains, comme le montre le comparateur disponible dans les outils NiouDem.",
"Il faut préciser une chose pour rester honnête : <em>un fonds indiciel ne protège pas des baisses.</em> Si les marchés mondiaux chutent de 30 %, il chute de 30 %. Ce qu'il apporte n'est pas la sécurité, c'est <strong>la disparition du risque lié à une entreprise particulière</strong>, ce qui est très différent.",
"Ce module continuera sur les fonds indiciels, non parce qu'ils seraient supérieurs en toute circonstance, mais parce qu'ils demandent le moins de compétences et de temps, ce qui correspond à quelqu'un qui débute."
],
quiz:[
{q:"Détenir 5 actions, est-ce diversifié ?",opts:["Oui, c'est suffisant","Non, c'est une concentration du risque sur 5 paris","Oui, si elles sont dans des secteurs différents","Cela dépend du montant"],correct:1,
explain:"La diversification suppose des centaines de titres, ce qu'un particulier ne peut pas construire seul."},
{q:"Que montrent les études sur les fonds gérés activement ?",opts:["Ils battent presque toujours leur indice","Une majorité ne dépasse pas leur indice après frais sur longue période","Ils sont plus risqués","Ils sont réservés aux professionnels"],correct:1,
explain:"Les frais de 1,5 à 2,5 % par an pèsent lourd et sont difficiles à compenser durablement."},
{q:"Qu'apporte réellement un fonds indiciel ?",opts:["Une protection contre les baisses","La disparition du risque lié à une entreprise particulière","Un rendement garanti","Une exonération d'impôt"],correct:1,
explain:"Si les marchés chutent de 30 %, il chute de 30 %. Ce n'est pas de la sécurité, c'est de la diversification."}
],
action:"Cherche les frais annuels du dernier produit d'épargne qu'on t'a proposé, en cherchant les mots « frais de gestion » dans la documentation. Compare-les à 0,3 %. L'écart obtenu est ce que tu paies chaque année, indépendamment de la performance."
},
{module:"Module 1 — Comment fonctionne la bourse", title:"Les indices boursiers", duration:"5 min",
script:[
"Un indice est un panier d'entreprises dont on suit la valeur globale. Il sert de thermomètre à un marché, et de référence pour les fonds indiciels. Savoir ce que chacun contient évite l'erreur la plus fréquente des débutants.",
"<strong>Les indices nationaux</strong> suivent les grandes entreprises d'un pays : le CAC 40 en France, une quarantaine de sociétés, ou les grands indices américains, japonais et britanniques. Leur défaut est évident une fois nommé : <u>un indice national concentre le risque sur une seule économie</u>, et parfois sur quelques secteurs dominants.",
"<strong>Les indices régionaux</strong> couvrent une zone, comme l'Europe ou les marchés émergents. <strong>Les indices mondiaux</strong> couvrent les entreprises des pays développés, voire du monde entier, et rassemblent alors plus d'un millier de sociétés dans des dizaines de pays.",
"Un point que presque personne ne vérifie et qui change beaucoup de choses : <strong>la pondération.</strong> La plupart des indices sont pondérés par la capitalisation, c'est-à-dire que les plus grosses entreprises y pèsent le plus. Conséquence concrète : dans un indice mondial, <u>les entreprises américaines représentent aujourd'hui une part majoritaire</u>, et un petit nombre de sociétés technologiques y pèse un poids considérable.",
"Autrement dit, croire qu'on est diversifié mondialement en achetant un indice monde est partiellement vrai. La diversification est réelle en nombre d'entreprises, moins réelle en répartition géographique et sectorielle. <strong>Ce n'est pas un défaut caché, c'est une caractéristique à connaître.</strong>",
"Deuxième point de vigilance : la différence entre un indice <em>prix</em> et un indice <em>rendement total</em>. Le premier ne compte que l'évolution des cours, le second réintègre les dividendes versés. L'écart entre les 2 sur longue période est très important, et beaucoup de comparaisons trouvées en ligne mélangent les 2, ce qui fausse tout.",
"Retiens la question à poser devant n'importe quel indice : <strong>combien d'entreprises, de quels pays, et selon quelle pondération ?</strong> Ces 3 réponses figurent toujours dans la documentation du fonds qui le suit."
],
quiz:[
{q:"Quel est le défaut d'un indice national ?",opts:["Il est trop cher","Il concentre le risque sur une seule économie","Il ne verse pas de dividendes","Il est réservé aux résidents"],correct:1,
explain:"Et souvent sur quelques secteurs dominants de cette économie."},
{q:"Que signifie une pondération par capitalisation ?",opts:["Chaque entreprise pèse pareil","Les plus grosses entreprises pèsent le plus dans l'indice","La pondération change chaque jour","Les dividendes sont réinvestis"],correct:1,
explain:"C'est pourquoi un indice mondial est majoritairement américain et fortement exposé à quelques géants."},
{q:"Quelle différence entre indice prix et rendement total ?",opts:["Aucune","Le second réintègre les dividendes versés","Le second exclut les frais","Le premier est calculé en euros"],correct:1,
explain:"L'écart est très important sur longue période, et beaucoup de comparaisons en ligne mélangent les 2."}
],
action:"Choisis un indice mondial et cherche sa composition : nombre d'entreprises, répartition par pays, et poids des 10 premières lignes. Ces informations sont publiques et prennent 10 minutes à trouver. Beaucoup d'investisseurs ne les ont jamais regardées."
},
{module:"Module 2 — Choisir son enveloppe et son courtier", title:"PEA ou compte-titres", duration:"5 min",
script:[
"Avant de choisir quoi acheter, il faut choisir où le loger. Deux enveloppes existent pour investir en bourse, et leur différence est essentiellement fiscale.",
"<strong>Le plan d'épargne en actions.</strong> Après 5 ans de détention, les gains ne subissent plus que les prélèvements sociaux de 17,2 %, l'impôt sur le revenu disparaissant. En contrepartie, il est plafonné à <u>150 000 €</u> de versements et ne peut contenir que des actions européennes ou des fonds éligibles. Tout retrait avant 5 ans entraîne sa clôture.",
"<strong>Le compte-titres ordinaire.</strong> Aucun plafond, aucune restriction géographique, aucune contrainte de durée. En contrepartie, les gains sont soumis au prélèvement forfaitaire unique de 30 %, à chaque vente réalisée avec plus-value.",
"<figure class=\"schema\"><svg viewBox=\"0 0 700 168\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><line x1=\"34\" y1=\"96\" x2=\"666\" y2=\"96\" stroke=\"#DCDDD3\" stroke-width=\"2\"/><path d=\"M666 96 l-9 -5 v10 z\" fill=\"#DCDDD3\"/><line x1=\"34\" y1=\"96\" x2=\"34\" y2=\"62\" stroke=\"#1E4B3C\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/><circle cx=\"34\" cy=\"96\" r=\"7\" fill=\"#1E4B3C\"/><circle cx=\"34\" cy=\"96\" r=\"12\" fill=\"none\" stroke=\"#1E4B3C\" stroke-width=\"1\" opacity=\".35\"/><text x=\"34\" y=\"52\" text-anchor=\"start\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14\" font-weight=\"600\" fill=\"#12212B\">Ouverture</text><text x=\"34\" y=\"122\" text-anchor=\"start\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12\" fill=\"#43555F\">Le compteur démarre</text><line x1=\"382\" y1=\"96\" x2=\"382\" y2=\"62\" stroke=\"#B8862F\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/><circle cx=\"382\" cy=\"96\" r=\"7\" fill=\"#B8862F\"/><circle cx=\"382\" cy=\"96\" r=\"12\" fill=\"none\" stroke=\"#B8862F\" stroke-width=\"1\" opacity=\".35\"/><text x=\"382\" y=\"52\" text-anchor=\"middle\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14\" font-weight=\"600\" fill=\"#12212B\">5 ans</text><text x=\"382\" y=\"122\" text-anchor=\"middle\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12\" fill=\"#43555F\">PEA : 17,2 % seulement</text><line x1=\"666\" y1=\"96\" x2=\"666\" y2=\"62\" stroke=\"#B8862F\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/><circle cx=\"666\" cy=\"96\" r=\"7\" fill=\"#B8862F\"/><circle cx=\"666\" cy=\"96\" r=\"12\" fill=\"none\" stroke=\"#B8862F\" stroke-width=\"1\" opacity=\".35\"/><text x=\"666\" y=\"52\" text-anchor=\"end\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14\" font-weight=\"600\" fill=\"#12212B\">Au-delà</text><text x=\"666\" y=\"122\" text-anchor=\"end\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12\" fill=\"#43555F\">Retraits partiels libres</text></svg><figcaption>Le délai court depuis l'ouverture, pas depuis le premier versement important. Ouvrir tôt ne coûte presque rien.</figcaption></figure>",
"La restriction européenne du PEA semble éliminatoire pour qui veut investir mondialement. Elle ne l'est pas, et voici pourquoi : <strong>certains fonds indiciels domiciliés en Europe reproduisent des indices mondiaux tout en restant éligibles au PEA</strong>, grâce à un mécanisme de réplication que nous verrons dans le module suivant. Cette possibilité existe, elle est légale, et elle est largement utilisée.",
"Comment choisir ? La question se ramène à 3 critères. <strong>Ton horizon :</strong> si tu peux laisser l'argent au moins 5 ans, le PEA devient nettement plus favorable. <strong>Ton besoin de liberté :</strong> si tu veux investir hors d'Europe en direct, le compte-titres est nécessaire. <strong>Ton plafond :</strong> au-delà de 150 000 € de versements, le compte-titres prend le relais.",
"Un conseil qui ne coûte rien et que presque personne n'applique : <u>le délai de 5 ans court à partir de la date d'ouverture, pas du premier versement important.</u> Ouvrir un PEA aujourd'hui avec le minimum accepté lance le compteur, même si tu n'y verses rien pendant 3 ans.",
"Beaucoup de gens détiennent les 2 enveloppes, sans que ce soit une hésitation : le PEA pour le cœur du portefeuille de long terme, le compte-titres pour ce qui n'y entre pas."
],
quiz:[
{q:"Quelle est la fiscalité du PEA après 5 ans ?",opts:["Exonération totale","17,2 % de prélèvements sociaux uniquement","30 % comme le compte-titres","12,8 % d'impôt seulement"],correct:1,
explain:"L'impôt sur le revenu disparaît, ce qui représente 12,8 points d'économie sur les gains."},
{q:"La restriction européenne empêche-t-elle d'investir mondialement ?",opts:["Oui, totalement","Non, certains fonds éligibles reproduisent des indices mondiaux","Oui, sauf pour les gros portefeuilles","Uniquement pour les actions américaines"],correct:1,
explain:"Un mécanisme de réplication permet cette éligibilité, et il est largement utilisé."},
{q:"À partir de quand court le délai de 5 ans ?",opts:["Du premier versement important","De la date d'ouverture du plan","Du premier achat de titres","De la première année fiscale complète"],correct:1,
explain:"Ouvrir avec le minimum accepté lance le compteur, même sans verser davantage pendant des années."}
],
action:"Vérifie si tu détiens déjà un PEA et depuis quand. Si tu n'en as pas et que tu envisages d'investir un jour, note que l'ouverture prend une vingtaine de minutes et qu'elle lance un compteur que rien ne rattrape ensuite."
},
{module:"Module 2 — Choisir son enveloppe et son courtier", title:"Comment comparer les courtiers", duration:"5 min",
script:[
"Cette leçon ne classe aucun établissement et n'en recommande aucun. Elle donne les critères qui permettent de comparer, parce que le paysage change chaque année et qu'une liste serait périmée avant d'être utile.",
"<strong>Critère 1 : les frais de courtage.</strong> C'est ce que tu paies à chaque ordre passé. Les écarts sont considérables, de quelques dizaines de centimes à plusieurs euros par ordre. Pour un investisseur régulier qui passe un ordre par mois, <u>un écart de 3 € par ordre représente 36 € par an</u>, ce qui pèse fortement sur de petits versements.",
"<strong>Critère 2 : les frais de garde et de tenue de compte.</strong> Certains établissements facturent la simple détention des titres, d'autres non. Ces frais sont particulièrement pénalisants parce qu'ils s'appliquent que tu agisses ou non.",
"<strong>Critère 3 : l'univers disponible.</strong> Tous les courtiers ne proposent pas les mêmes fonds. Vérifie que ceux qui t'intéressent sont accessibles, et à quel montant minimum par ordre.",
"<strong>Critère 4 : le versement programmé.</strong> Point souvent négligé et pourtant décisif pour la méthode enseignée ici. Certains courtiers permettent d'automatiser un investissement mensuel, d'autres non. <strong>Sans automatisation, la régularité repose sur ta volonté</strong>, et tu as appris dans la formation sur la psychologie ce que vaut la volonté au mauvais moment.",
"<strong>Critère 5 : la solidité et la protection.</strong> Vérifie que l'établissement est agréé pour exercer en France et qu'il relève d'un mécanisme de garantie des titres. Les titres que tu détiens t'appartiennent et sont ségrégués des comptes du courtier, mais l'agrément reste la première vérification à faire.",
"<strong>Critère 6 : la fiscalité gérée ou non.</strong> Certains courtiers établissent l'imprimé fiscal unique et préremplissent tes obligations déclaratives, d'autres te laissent tout calculer. Pour un compte-titres actif, cette différence représente plusieurs heures par an.",
"Une mise en garde pour finir. <strong>Méfie-toi des comparatifs en ligne qui affichent des liens de parrainage.</strong> Le classement y suit souvent la rémunération plutôt que la qualité. Compare toi-même sur ces 6 critères : cela prend 1 heure et te concerne pour 20 ans."
],
quiz:[
{q:"Pourquoi le versement programmé est-il un critère décisif ?",opts:["Il réduit les frais","Sans automatisation, la régularité repose sur la volonté","Il est obligatoire pour le PEA","Il améliore le rendement"],correct:1,
explain:"Et la volonté est précisément ce qui manque pendant les périodes de baisse, quand il faudrait continuer à verser."},
{q:"Quels frais s'appliquent même sans agir ?",opts:["Les frais de courtage","Les frais de garde et de tenue de compte","Les frais de transfert","Aucun"],correct:1,
explain:"C'est ce qui les rend particulièrement pénalisants pour un investisseur passif."},
{q:"Que penser des comparatifs en ligne ?",opts:["Ils sont neutres et fiables","Beaucoup affichent des liens de parrainage et classent selon leur rémunération","Ils sont interdits","Ils sont établis par les autorités"],correct:1,
explain:"Comparer soi-même sur 6 critères prend 1 heure et engage 20 ans de détention."}
],
action:"Établis un tableau à 6 colonnes, une par critère, et compare 3 établissements de ton choix. N'utilise que leurs documents tarifaires officiels, jamais un comparatif. Le tableau obtenu vaut mieux que n'importe quel classement."
},
{module:"Module 2 — Choisir son enveloppe et son courtier", title:"Ouvrir son plan, étape par étape", duration:"5 min",
script:[
"L'ouverture d'un plan d'épargne en actions bloque beaucoup de gens, alors qu'elle prend une vingtaine de minutes. Voici le déroulé complet, pour supprimer l'inconnu.",
"<strong>Étape 1 : les pièces à préparer.</strong> Une pièce d'identité en cours de validité, un justificatif de domicile de moins de 3 mois, un relevé d'identité bancaire, et parfois un justificatif de revenus ou de situation professionnelle. Les rassembler avant de commencer évite d'abandonner en cours de route, ce qui est la première cause d'échec.",
"<strong>Étape 2 : le questionnaire de connaissance.</strong> L'établissement est tenu de t'interroger sur ton expérience, tes objectifs et ta tolérance au risque. Ce n'est ni un examen ni une formalité : <u>réponds honnêtement</u>, y compris pour dire que tu débutes. Un questionnaire faussé conduit à te proposer des produits inadaptés, et il te prive d'une protection prévue pour toi.",
"<strong>Étape 3 : le versement initial.</strong> Souvent quelques dizaines d'euros suffisent, parfois moins. Rappelle-toi que l'objectif de ce premier versement n'est pas d'investir, c'est de <strong>lancer le compteur des 5 ans.</strong>",
"<strong>Étape 4 : la validation.</strong> Comptez de quelques heures à quelques jours selon l'établissement. Tu recevras un numéro de compte et des identifiants.",
"<strong>Étape 5 : le premier ordre.</strong> Il se passe depuis l'interface, en cherchant le fonds par son identifiant, puis en choisissant le type d'ordre. Retiens 2 types seulement : <strong>l'ordre au marché</strong>, exécuté immédiatement au prix disponible, et <strong>l'ordre à cours limité</strong>, exécuté seulement si le prix atteint la limite que tu fixes. <u>Pour un investissement régulier de long terme, l'ordre à cours limité évite les mauvaises surprises</u> sur les fonds peu échangés.",
"Une chose à savoir pour ne pas s'inquiéter : entre le moment où tu passes ton ordre et son exécution, quelques minutes à quelques heures peuvent s'écouler selon le marché et l'heure. C'est normal, et l'interface indique l'état de l'ordre.",
"Dernier point, plus important que tous les autres : <strong>le premier ordre est celui qui coûte le plus d'effort psychologique et le moins d'argent.</strong> Fais-le avec un montant volontairement petit. Ce n'est pas un investissement, c'est un apprentissage."
],
quiz:[
{q:"Que faut-il faire avant de commencer l'ouverture ?",opts:["Choisir ses fonds","Rassembler toutes les pièces justificatives","Prévenir sa banque actuelle","Calculer sa fiscalité"],correct:1,
explain:"L'abandon en cours de route faute de justificatif est la première cause d'échec de l'ouverture."},
{q:"Comment répondre au questionnaire de connaissance ?",opts:["En surestimant son expérience pour accéder à plus de produits","Honnêtement, y compris pour dire qu'on débute","En laissant le conseiller le remplir","Peu importe, il est indicatif"],correct:1,
explain:"Un questionnaire faussé conduit à des produits inadaptés et te prive d'une protection prévue pour toi."},
{q:"Quel type d'ordre convient à un investissement régulier ?",opts:["L'ordre au marché systématiquement","L'ordre à cours limité, qui évite les mauvaises surprises","L'ordre à seuil de déclenchement","Peu importe"],correct:1,
explain:"Sur les fonds peu échangés, le prix d'exécution peut s'écarter sensiblement de celui affiché."}
],
action:"Rassemble ce soir tes 3 justificatifs dans un dossier sur ton ordinateur : identité, domicile, relevé bancaire. Tu n'ouvres rien ce soir. Mais le jour où tu décideras, l'obstacle principal aura déjà disparu."
},
{module:"Module 2 — Choisir son enveloppe et son courtier", title:"Passer ton premier ordre", duration:"5 min",
script:[
"Cette leçon est la plus courte en explications et la plus importante en effet. Elle consiste à franchir le seul obstacle qui sépare réellement quelqu'un qui a lu de quelqu'un qui investit.",
"<strong>Le montant : petit, volontairement.</strong> 50 € suffisent, 20 € aussi selon les frais. Ce premier ordre ne vise aucun rendement. Il vise à <u>transformer une inquiétude abstraite en geste connu.</u>",
"Ce que tu vas ressentir mérite d'être annoncé, parce que c'est universel et que personne ne le dit. Au moment de valider, tu auras un doute : le sentiment de faire quelque chose d'irréversible et de mal maîtrisé. <strong>Ce doute n'est pas un signal d'alerte, c'est la sensation normale d'une première fois.</strong> Il disparaît au deuxième ordre.",
"Le déroulé pratique tient en 5 gestes. Tu te connectes, tu cherches le fonds par son identifiant, tu saisis le montant ou le nombre de parts, tu choisis le type d'ordre, tu valides. Un récapitulatif s'affiche avant confirmation, avec les frais : <strong>lis-le, c'est le seul moment où tu verras le coût réel de l'opération.</strong>",
"Les jours suivants, une chose va se produire et il faut la prévoir : <strong>ton investissement va varier, probablement à la baisse à un moment.</strong> Sur 50 €, cela représente quelques centimes. C'est précisément l'intérêt de commencer petit : tu apprends à ressentir la variation sur un montant qui ne fait pas mal.",
"Une règle pour ce premier mois, et elle compte plus que le choix du fonds : <u>ne consulte pas ton compte tous les jours.</u> Une consultation par semaine au maximum. Tu apprends à ne pas réagir, ce qui est la compétence la plus rentable de tout l'investissement.",
"Enfin, note quelque part la date et le montant de ce premier ordre. Dans 10 ans, cette ligne aura plus de valeur à tes yeux que son montant, parce qu'elle marquera le jour où le sujet a cessé d'être théorique."
],
quiz:[
