<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --ink:#12212B;--ink-soft:#43555F;--ink-muted:#7A8A93;--ink-faint:#96A3AA;
  --bg:#FCFBF8;--bg-soft:#F5F4EE;--bg-mid:#EFF0EA;--bg-line:#DCDDD3;
  --green:#1E4B3C;--green-light:#2A6350;--green-pale:#E7EFEA;--green-bord:#BFD6C9;
  --amber:#B8862F;--amber-pale:#F6EFE0;--amber-bord:#E4D2AC;
  --violet:#4A5C6B;--violet-pale:#EDF0F2;--violet-bord:#D4DBE0;
  --coral:#A24332;--coral-pale:#F8EDEA;
  --sans:'Karla',system-ui,-apple-system,sans-serif;
  --display:'Newsreader',Georgia,serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
body{font-family:var(--sans);background:var(--bg-soft);color:var(--ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;}
a{color:inherit;}

.nav{position:sticky;top:0;z-index:200;background:rgba(255,255,255,.96);backdrop-filter:blur(20px);border-bottom:1px solid var(--bg-line);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;font-weight:800;font-size:15px;color:var(--ink);}
.nav-mark{width:26px;height:26px;border-radius:8px;background:var(--green);display:flex;align-items:center;justify-content:center;}
.nav-mark svg{width:14px;height:14px;}
.nav-back{font-size:13px;font-weight:600;color:var(--ink-muted);text-decoration:none;}
.nav-progress-pill{font-size:12px;font-weight:700;color:var(--green);background:var(--green-pale);padding:5px 12px;border-radius:100px;}

.layout{display:grid;grid-template-columns:280px 1fr;max-width:1100px;margin:0 auto;min-height:calc(100vh - 60px);}
.sidebar{border-right:1px solid var(--bg-line);background:var(--bg);padding:24px 16px;position:sticky;top:60px;align-self:start;height:calc(100vh - 60px);overflow-y:auto;}
.sb-progress-bar{height:6px;background:var(--bg-mid);border-radius:100px;overflow:hidden;margin:0 10px 18px;}
.sb-progress-fill{height:100%;background:var(--green);border-radius:100px;transition:width .3s;}
.sb-item{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:10px;cursor:pointer;margin-bottom:2px;font-size:13px;font-weight:600;color:var(--ink-muted);transition:background .15s;}
.sb-item:hover{background:var(--bg-soft);}
.sb-item.active{background:var(--green-pale);color:var(--green);}
.sb-item.done{color:var(--ink);}
.sb-item.locked{opacity:.45;cursor:not-allowed;}
.sb-item.locked:hover{background:transparent;}
.sb-check{width:20px;height:20px;border-radius:50%;background:var(--bg-mid);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink-faint);flex-shrink:0;}
.sb-item.done .sb-check{background:var(--green);color:#fff;}
.sb-item.active .sb-check{background:var(--green);color:#fff;}
.sb-module-label{font-size:10.5px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em;padding:14px 10px 6px;}

.main{padding:36px 40px 80px;max-width:720px;}
.lesson-eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green);margin-bottom:10px;}
.lesson-title{font-size:28px;font-weight:800;letter-spacing:-.03em;color:var(--ink);margin-bottom:8px;line-height:1.15;}
.lesson-meta{font-size:13px;color:var(--ink-faint);margin-bottom:32px;}

.section-label{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-muted);margin:36px 0 16px;}
.section-label .dot{width:6px;height:6px;border-radius:50%;background:var(--green);}
.section-label.quiz .dot{background:var(--violet);}
.section-label.action .dot{background:var(--amber);}

.script-text p{font-size:15.5px;font-weight:400;color:var(--ink-soft);line-height:1.75;margin-bottom:18px;}

.quiz-card{background:var(--bg);border:1px solid var(--bg-line);border-radius:16px;padding:24px;margin-bottom:14px;}
.quiz-q{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:16px;line-height:1.5;}
.quiz-opt{display:flex;align-items:flex-start;gap:12px;padding:13px 15px;border:1.5px solid var(--bg-line);border-radius:11px;margin-bottom:9px;cursor:pointer;transition:border-color .15s,background .15s;}
.quiz-opt:hover{border-color:var(--ink-faint);}
.quiz-opt.correct{border-color:var(--green);background:var(--green-pale);}
.quiz-opt.wrong{border-color:var(--coral);background:var(--coral-pale);}
.quiz-opt.disabled{cursor:default;pointer-events:none;}
.quiz-letter{width:24px;height:24px;border-radius:7px;background:var(--bg-soft);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--ink-muted);flex-shrink:0;}
.quiz-opt.correct .quiz-letter{background:var(--green);color:#fff;}
.quiz-opt.wrong .quiz-letter{background:var(--coral);color:#fff;}
.quiz-opt-text{font-size:13.5px;font-weight:500;color:var(--ink);padding-top:2px;}
.quiz-explain{display:none;font-size:13px;font-weight:400;color:var(--ink-muted);line-height:1.6;background:var(--bg-soft);border-radius:10px;padding:14px 16px;margin-top:8px;}
.quiz-explain.show{display:block;}
.quiz-explain strong{color:var(--ink);}

.action-card{background:var(--amber-pale);border:1px solid var(--amber-bord);border-radius:16px;padding:22px 24px;}
.action-text{font-size:14.5px;font-weight:500;color:var(--ink);line-height:1.65;margin-bottom:16px;}
.action-check{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;}
.action-box{width:22px;height:22px;border-radius:7px;border:2px solid var(--amber);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;transition:background .15s;}
.action-box.checked{background:var(--amber);}
.action-label{font-size:13px;font-weight:700;color:#8a6a00;}

.lesson-nav{display:flex;justify-content:space-between;align-items:center;margin-top:40px;padding-top:24px;border-top:1px solid var(--bg-line);}
.nav-btn{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border:none;cursor:pointer;font-family:var(--sans);font-size:14px;font-weight:700;padding:13px 24px;border-radius:11px;text-decoration:none;transition:background .2s;}
.nav-btn:hover{background:var(--ink-soft);}
.nav-btn.ghost{background:var(--bg-mid);color:var(--ink-muted);}
.nav-btn.ghost:hover{background:var(--bg-line);}
.completion-badge{display:none;align-items:center;gap:8px;background:var(--green-pale);color:var(--green);font-size:12.5px;font-weight:700;padding:8px 16px;border-radius:100px;margin-bottom:20px;}
.completion-badge.show{display:inline-flex;}

@media(max-width:860px){
  .layout{grid-template-columns:1fr;}
  .sidebar{position:static;height:auto;border-right:none;border-bottom:1px solid var(--bg-line);}
  .main{padding:28px 20px 60px;}
}

/* ===== Direction Encre & Laiton — surcouche typographique ===== */
body{font-family:var(--sans);letter-spacing:0;}
h1,h2,h3,h4,.hero-h1,.s-title,.cta-h2,.p-name,.mod-title,.c-title,.hc-title,
.lecon-title,.q-title,.auth-title,.perf-title,.section-title,.edu-title,.tips-title{
  font-family:var(--display);letter-spacing:-.015em;
}
.hero-h1,.s-title,.cta-h2,.auth-title{font-weight:500;letter-spacing:-.018em;line-height:1.16;}
h3,h4,.p-name,.mod-title,.c-title,.hc-title,.lecon-title{font-weight:600;}
.s-tag,.f-copy,.hstat-label,.stat-label,.perf-note,.order-meta,.pos-value,
.price-cell,.asset-label,.badge,.eyebrow,.nav-balance{font-family:var(--mono);}

.nav-name em,.ft-name em{font-style:normal;color:var(--amber);}

/* Mise en valeur dans le corps des lecons : le gras porte la notion a
   retenir, l italique la nuance ou le terme technique. */
.script-text strong{color:var(--ink,#12212B);font-weight:700;}
.script-text em{font-style:italic;color:var(--ink-soft,#43555F);}
.script-text u{text-decoration:none;background:linear-gradient(transparent 62%,var(--amber-pale,#F6EFE0) 62%);
  box-shadow:inset 0 -1px 0 var(--amber,#B8862F);}
.script-text p + p{margin-top:14px;}

/* ===== L'itineraire =====
   Une route verticale plutot qu'une liste : on voit d'ou l'on vient,
   ou l'on est, et ce qu'il reste. Meme vocabulaire graphique que le
   carnet de route et les emblemes. */
.itin{padding:4px 4px 24px;}
.itin-tete{padding:0 8px 16px;border-bottom:1px solid var(--bg-line);margin-bottom:16px;}
.itin-formation{font-family:var(--display);font-size:16px;font-weight:600;color:var(--ink);line-height:1.25;}
.itin-compte{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-muted);margin-top:7px;}
.itin-barre{height:4px;background:var(--bg-mid);border-radius:100px;overflow:hidden;margin-top:10px;}
.itin-barre span{display:block;height:100%;background:var(--amber);border-radius:100px;transition:width .4s cubic-bezier(.4,0,.2,1);}

/* La route */
.route{position:relative;padding-left:30px;}
.route::before{content:"";position:absolute;left:11px;top:14px;bottom:14px;width:2px;
  background:repeating-linear-gradient(var(--bg-line) 0 6px, transparent 6px 11px);}
.etape-i{position:relative;margin-bottom:6px;}
.borne{position:absolute;left:-30px;top:6px;width:24px;height:24px;border-radius:50%;
  background:var(--bg);border:2px solid var(--bg-line);display:grid;place-items:center;
  font-family:var(--mono);font-size:10px;color:var(--ink-faint);z-index:1;transition:all .2s;}
.borne svg{width:11px;height:11px;}
.etape-i.faite .borne{background:var(--amber);border-color:var(--amber);color:#fff;}
.etape-i.ici .borne{background:var(--green);border-color:var(--green);color:#fff;
  box-shadow:0 0 0 4px var(--green-pale);}
.etape-titre{display:block;width:100%;text-align:left;background:transparent;border:0;cursor:pointer;
  font-family:var(--display);font-size:14.5px;font-weight:600;color:var(--ink-soft);
  padding:7px 9px;border-radius:9px;line-height:1.3;transition:background .15s,color .15s;}
.etape-titre:hover{background:var(--bg-soft);color:var(--ink);}
.etape-i.ici .etape-titre{color:var(--green);}
.etape-i.faite .etape-titre{color:var(--ink);}
.etape-meta{font-family:var(--mono);font-size:10px;color:var(--ink-faint);padding:0 9px 4px;letter-spacing:.06em;}

/* Les lecons de l'etape en cours */
.arrets{margin:2px 0 12px;padding-left:9px;border-left:1px solid var(--bg-line);}
.arret{display:flex;align-items:flex-start;gap:9px;padding:7px 9px;border-radius:8px;cursor:pointer;
  font-size:12.8px;font-weight:500;color:var(--ink-muted);transition:background .15s;line-height:1.35;}
.arret:hover{background:var(--bg-soft);color:var(--ink);}
.arret.ici{background:var(--green-pale);color:var(--green);font-weight:700;}
.arret.faite{color:var(--ink);}
.arret.bloque{opacity:.42;cursor:not-allowed;}
.arret.bloque:hover{background:transparent;}
.puce{width:15px;height:15px;border-radius:4px;flex:none;margin-top:1px;border:1.5px solid var(--bg-line);
  display:grid;place-items:center;background:var(--bg);}
.puce svg{width:9px;height:9px;opacity:0;}
.arret.faite .puce{background:var(--amber);border-color:var(--amber);}
.arret.faite .puce svg{opacity:1;}
.arret.ici .puce{border-color:var(--green);border-style:dashed;}

/* Changer de formation sans repasser par le menu */
.escale{margin-top:22px;padding-top:16px;border-top:1px solid var(--bg-line);}
.escale-titre{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-faint);padding:0 9px 9px;}
.escale a{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;text-decoration:none;
  font-size:12.8px;color:var(--ink-soft);transition:background .15s;}
.escale a:hover{background:var(--bg-soft);color:var(--ink);}
.escale a.courante{background:var(--green-pale);color:var(--green);font-weight:700;}
.jeton{width:7px;height:7px;border-radius:50%;background:var(--bg-line);flex:none;}
.escale a.courante .jeton{background:var(--green);}
.escale a.prete .jeton{background:var(--amber);}

@media(max-width:860px){
  .itin{padding-bottom:8px;}
  .route{padding-left:26px;}
  .borne{left:-26px;}
}
@media(prefers-reduced-motion:reduce){*{transition:none !important;}}

/* ===== Schemas des lecons ===== */
.schema{margin:26px 0;padding:20px 18px 14px;border:1px solid var(--bg-line,#DCDDD3);
  border-radius:12px;background:var(--bg,#FCFBF8);}
.schema svg{width:100%;height:auto;display:block;}
.schema figcaption{font-family:var(--mono,monospace);font-size:11.5px;line-height:1.55;
  color:var(--ink-muted,#7A8A93);margin-top:14px;padding-top:12px;
  border-top:1px solid var(--bg-line,#DCDDD3);}
@media(max-width:620px){.schema{padding:14px 12px 10px;margin:20px -6px;}}

.script-text strong{color:var(--ink,#12212B);font-weight:700;}
.script-text em{font-style:italic;color:var(--ink-soft,#43555F);}
.script-text u{text-decoration:none;background:linear-gradient(transparent 62%,var(--amber-pale,#F6EFE0) 62%);
  box-shadow:inset 0 -1px 0 var(--amber,#B8862F);}
.script-text p + p{margin-top:14px;}
</style>
</head>

<script>
/* ============ DONNÉES DES 16 LEÇONS — MAÎTRISER SON BUDGET ============ */
const LESSONS = [
{module:"Module 1 — Faire le diagnostic", title:"Où va vraiment ton argent", duration:"5 min",
script:[
"Presque tout le monde croit savoir où passe son argent. Presque personne ne le sait réellement. Ce n'est pas un défaut de mémoire : c'est que <strong>nous retenons les grosses dépenses et oublions les petites</strong>, alors que ce sont les petites, répétées, qui font l'essentiel de l'écart.",
"L'expérience à faire est simple et déroutante. Écris de mémoire ce que tu as dépensé le mois dernier, poste par poste. Puis ouvre tes relevés et compare. <u>L'écart moyen constaté est de 20 à 30 %</u>, presque toujours dans le même sens : on sous-estime.",
"Trois mécanismes expliquent cet écart. <strong>1. Le prélèvement automatique est invisible.</strong> Ce qui part sans geste de ta part ne laisse aucune trace en mémoire, et c'est justement le cas de la majorité de tes charges. <strong>2. Le paiement sans contact supprime la douleur.</strong> Payer en espèces fait ressentir la dépense ; approcher une carte ne fait rien ressentir du tout, ce qui est mesuré et exploité. <strong>3. Les petites sommes ne se comptent pas.</strong> Un café à 2 €, cinq fois par semaine, représente 43 € par mois, soit plus de 500 € par an, et personne n'a le sentiment de dépenser 500 € en café.",
"Le diagnostic ne sert pas à culpabiliser, et c'est important de le dire dès maintenant. <strong>Il sert à retrouver un pouvoir de décision.</strong> Une dépense qu'on connaît devient un choix ; une dépense qu'on ignore reste une fuite.",
"La méthode que nous suivrons dans ce module tient en 3 temps. Observer un mois complet sans rien changer, ce qui est plus difficile qu'il n'y paraît. Classer ce qui a été observé, pour séparer ce qui se subit de ce qui se décide. Puis reconstruire, à partir de chiffres réels et non d'estimations.",
"Une seule consigne pour ce mois d'observation, et elle change tout : <strong>note la dépense le jour même.</strong> Un budget reconstitué le dimanche soir de mémoire reproduit exactement l'erreur qu'on cherche à corriger.",
"Enfin, sois prêt à une surprise. La plupart des gens qui font ce travail découvrent que leur problème n'est pas là où ils le croyaient. Ceux qui pensaient trop dépenser en loisirs trouvent des charges fixes trop lourdes ; ceux qui accusaient leur loyer découvrent des abonnements oubliés. <u>Le diagnostic déplace presque toujours le problème</u>, et c'est précisément pour ça qu'il faut le faire avant de décider quoi que ce soit."
],
quiz:[
{q:"Quel écart moyen sépare l'estimation de la réalité ?",opts:["Moins de 5 %","20 à 30 %","50 %","Il n'y a pas d'écart"],correct:1,
explain:"Et presque toujours dans le même sens : on sous-estime ce qu'on dépense réellement."},
{q:"Pourquoi les prélèvements automatiques échappent-ils à la mémoire ?",opts:["Parce qu'ils sont trop petits","Parce qu'ils ne demandent aucun geste, donc ne laissent aucune trace","Parce que la banque les masque","Parce qu'ils sont mensuels"],correct:1,
explain:"C'est pourtant sur eux que porte la majorité des charges d'un foyer."},
{q:"À quoi sert le diagnostic ?",opts:["À culpabiliser sur ses excès","À transformer des fuites subies en décisions conscientes","À réduire ses dépenses de moitié","À préparer sa déclaration d'impôts"],correct:1,
explain:"Une dépense connue devient un choix. Une dépense ignorée reste une fuite."}
],
action:"Écris ce soir, de mémoire et sans regarder, ce que tu penses avoir dépensé le mois dernier dans 5 catégories. Range la feuille. Tu la compareras à la réalité dans 3 leçons, et l'écart sera ton vrai point de départ."
},
{module:"Module 1 — Faire le diagnostic", title:"Dépenses fixes et dépenses variables", duration:"5 min",
script:[
"Toutes les dépenses ne se valent pas, et les traiter de la même façon est l'erreur qui rend la plupart des budgets inutiles. La distinction fondamentale est celle-ci : <strong>certaines dépenses se décident une fois et se répètent, d'autres se décident à chaque fois.</strong>",
"<strong>Les charges fixes</strong> sont celles que tu paies quoi qu'il arrive : loyer ou crédit, énergie, assurances, transport, abonnements, remboursements. Elles ont une caractéristique décisive : <u>tu ne les décides qu'une fois, mais tu les paies chaque mois pendant des années.</u>",
"<strong>Les dépenses variables</strong> dépendent de choix quotidiens : courses, sorties, vêtements, loisirs, imprévus. Elles sont visibles, elles se ressentent, et c'est précisément pour ça qu'on les surveille alors qu'elles pèsent souvent moins lourd.",
"<figure class=\"schema\"><svg viewBox=\"0 0 700 228\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"200\" y=\"20\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" letter-spacing=\"1.4\" fill=\"#1E4B3C\">CHARGES FIXES</text><text x=\"560\" y=\"20\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" letter-spacing=\"1.4\" fill=\"#B8862F\">DÉPENSES VARIABLES</text><text x=\"20\" y=\"44\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#43555F\">Effort à fournir</text><rect x=\"20\" y=\"54\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#EFF0EA\"/><rect x=\"20\" y=\"54\" width=\"495\" height=\"18\" rx=\"5\" fill=\"#E7EFEA\"/><rect x=\"515\" y=\"54\" width=\"165\" height=\"18\" rx=\"5\" fill=\"#F6EFE0\"/><text x=\"28\" y=\"67\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#1E4B3C\">une seule fois</text><text x=\"672\" y=\"67\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8E661F\">chaque jour</text><text x=\"20\" y=\"100\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#43555F\">Gain obtenu</text><rect x=\"20\" y=\"110\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#EFF0EA\"/><rect x=\"20\" y=\"110\" width=\"528\" height=\"18\" rx=\"5\" fill=\"#E7EFEA\"/><rect x=\"548\" y=\"110\" width=\"132\" height=\"18\" rx=\"5\" fill=\"#F6EFE0\"/><text x=\"28\" y=\"123\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#1E4B3C\">répété chaque mois</text><text x=\"672\" y=\"123\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8E661F\">ponctuel</text><text x=\"20\" y=\"156\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#43555F\">Résiste à la fatigue</text><rect x=\"20\" y=\"166\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#EFF0EA\"/><rect x=\"20\" y=\"166\" width=\"561\" height=\"18\" rx=\"5\" fill=\"#E7EFEA\"/><rect x=\"581\" y=\"166\" width=\"99\" height=\"18\" rx=\"5\" fill=\"#F6EFE0\"/><text x=\"28\" y=\"179\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#1E4B3C\">oui</text><text x=\"672\" y=\"179\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8E661F\">non</text></svg><figcaption>Un budget qui tient s'attaque d'abord à la structure des charges, pas à la volonté quotidienne.</figcaption></figure>",
"Voici pourquoi cette distinction change tout, et c'est le cœur de cette leçon. <strong>Réduire une charge fixe demande un effort une seule fois et rapporte chaque mois.</strong> Renégocier une assurance à 15 € de moins prend 1 heure et rapporte 180 € par an, tous les ans, sans y repenser. <strong>Réduire une dépense variable demande un effort renouvelé en permanence</strong>, et l'effort finit toujours par céder.",
"C'est la raison pour laquelle la plupart des budgets échouent : ils portent sur les dépenses variables, donc sur la volonté, qui s'épuise. Un budget qui tient s'attaque d'abord à la structure, pas au comportement.",
"Un cas particulier mérite attention : les dépenses <em>semi-fixes</em>, celles qui reviennent régulièrement sans être mensuelles. Assurance annuelle, impôts, rentrée scolaire, entretien du véhicule, cadeaux de fin d'année. <strong>Elles sont la première cause de découvert</strong>, parce qu'elles n'apparaissent dans aucun budget mensuel et tombent toujours au mauvais moment.",
"La parade est simple et je te la donne dès maintenant : additionne ces dépenses annuelles, divise par 12, et provisionne ce montant chaque mois sur un compte séparé. Une taxe foncière de 900 € cesse d'être un problème quand 75 € sont mis de côté chaque mois depuis un an."
],
quiz:[
{q:"Quelle est la caractéristique d'une charge fixe ?",opts:["Elle est toujours élevée","Elle se décide une fois et se paie chaque mois pendant des années","Elle ne peut pas être réduite","Elle varie selon la saison"],correct:1,
explain:"C'est ce qui rend son optimisation si rentable : un effort unique produit un gain répété."},
{q:"Pourquoi la plupart des budgets échouent-ils ?",opts:["Parce qu'ils sont trop précis","Parce qu'ils portent sur les dépenses variables, donc sur la volonté","Parce que les revenus sont trop faibles","Parce qu'ils sont mensuels"],correct:1,
explain:"La volonté s'épuise. Un budget qui tient s'attaque d'abord à la structure des charges."},
{q:"Quelle est la première cause de découvert ?",opts:["Les courses alimentaires","Les dépenses semi-fixes, annuelles ou irrégulières","Les loisirs","Le loyer"],correct:1,
explain:"Elles n'apparaissent dans aucun budget mensuel et tombent toujours au mauvais moment. La parade est de les provisionner par douzièmes."}
],
action:"Liste ce soir tes dépenses annuelles ou irrégulières : impôts, assurances, rentrée, entretien, fêtes. Additionne et divise par 12. Ce montant est celui que tu devrais provisionner chaque mois, et il explique probablement tes fins de mois difficiles."
},
{module:"Module 1 — Faire le diagnostic", title:"Repérer les fuites invisibles", duration:"5 min",
script:[
"Les fuites invisibles sont des dépenses régulières dont tu ne tires plus aucune valeur. Elles ne relèvent ni du gaspillage ni du manque de discipline : elles relèvent de l'inertie, et elles se traitent en une seule séance.",
"<strong>Fuite 1 : les abonnements dormants.</strong> Streaming, applications, salles de sport, services souscrits pour un essai gratuit et jamais résiliés. Le montant moyen retrouvé par les gens qui font cet audit se situe entre 30 et 80 € par mois. La méthode est directe : reprends tes 3 derniers relevés et surligne chaque ligne qui revient à l'identique.",
"<strong>Fuite 2 : les frais bancaires.</strong> Tenue de compte, cotisation carte, assurance moyens de paiement rarement utile, commissions d'intervention en cas de découvert. Ces dernières sont plafonnées par la loi mais peuvent atteindre plusieurs dizaines d'euros par mois pour quelqu'un souvent à découvert. <u>C'est le poste où l'écart entre une banque traditionnelle et une banque en ligne est le plus fort</u>, et il se compte en centaines d'euros par an.",
"<strong>Fuite 3 : les assurances doublons.</strong> Beaucoup de gens paient 2 fois la même garantie sans le savoir : une assurance téléphone alors que la carte bancaire couvre déjà l'appareil, une garantie voyage déjà incluse, une protection juridique présente dans le contrat habitation. Vérifier prend 30 minutes.",
"<strong>Fuite 4 : les contrats jamais renégociés.</strong> Assurance auto, habitation, mutuelle, forfait mobile, énergie. Ces contrats augmentent silencieusement chaque année, et la fidélité n'y est jamais récompensée. La résiliation est aujourd'hui bien plus simple qu'avant pour l'auto et l'habitation après un an, et le changement de fournisseur d'énergie ou de forfait se fait en quelques minutes.",
"<strong>Fuite 5 : les micro-dépenses automatisées.</strong> Achats en un clic, applications qui gardent la carte enregistrée, livraisons express payantes. Le remède le plus efficace n'est pas la volonté mais la friction : <strong>supprime tes cartes enregistrées.</strong> Devoir aller chercher son portefeuille suffit à annuler une part importante des achats impulsifs.",
"Un ordre de grandeur pour te motiver : <strong>une séance de 2 heures sur ces 5 postes récupère couramment 50 à 150 € par mois</strong>, soit l'équivalent d'une augmentation nette, sans négociation et sans changer quoi que ce soit à ton mode de vie."
],
quiz:[
{q:"Comment repérer les abonnements dormants ?",opts:["En listant ses applications","En surlignant sur 3 relevés chaque ligne qui revient à l'identique","En appelant sa banque","En consultant ses courriels"],correct:1,
explain:"La régularité identique d'un montant est la signature d'un abonnement, y compris ceux qu'on a oubliés."},
{q:"Quel est le remède aux achats impulsifs en ligne ?",opts:["Se fixer un budget mensuel","Supprimer les cartes enregistrées pour créer une friction","Désinstaller les applications","Payer uniquement en espèces"],correct:1,
explain:"La friction est plus efficace que la volonté : devoir chercher son portefeuille annule une part des achats impulsifs."},
{q:"Combien récupère couramment une séance de 2 heures sur ces postes ?",opts:["5 à 10 € par mois","50 à 150 € par mois","300 € par mois","Rien de significatif"],correct:1,
explain:"L'équivalent d'une augmentation nette, sans négociation et sans changer de mode de vie."}
],
action:"Ouvre tes 3 derniers relevés et surligne toute ligne qui revient à l'identique. Ne résilie rien ce soir. Contente-toi d'additionner ce que tu ne peux pas justifier : ce chiffre décidera de ta motivation pour la suite."
},
{module:"Module 1 — Faire le diagnostic", title:"Ton bilan financier personnel", duration:"5 min",
script:[
"Le bilan est la photographie de ta situation à un instant donné. C'est un document d'une page, et pourtant très peu de gens l'ont jamais écrit. Il répond à une question que le solde du compte ne dit pas : <strong>que possèdes-tu réellement, une fois tes dettes retirées ?</strong>",
"Il se construit en 2 colonnes. <strong>À gauche, ce que tu possèdes :</strong> comptes courants, livrets, épargne, valeur d'un bien immobilier, valeur d'un véhicule, placements éventuels. <strong>À droite, ce que tu dois :</strong> capital restant dû des crédits, découvert, dettes familiales, impayés.",
"La différence entre les 2 colonnes est ton <strong>patrimoine net</strong>. C'est le seul chiffre qui mesure vraiment ta situation, et il peut être négatif, ce qui est extrêmement courant chez les jeunes actifs et chez tout propriétaire en début de crédit. <u>Un patrimoine net négatif n'est pas un échec, c'est une étape.</u>",
"L'intérêt de ce bilan n'est pas le chiffre du jour, il est dans la <strong>comparaison d'une année sur l'autre</strong>. Un patrimoine net qui progresse de 3 000 € en un an dit quelque chose que ni ton salaire ni ton solde bancaire ne diront jamais : tu construis quelque chose.",
"Deux erreurs classiques à éviter en le remplissant. La première est de surévaluer ses biens : une voiture vaut son prix de revente réel, pas son prix d'achat, et un logement vaut ce que le marché en donne, pas ce qu'on espère. La seconde est d'oublier des dettes, notamment les crédits à la consommation en cours et les sommes empruntées à des proches, qui sont des dettes même sans papier.",
"Complète ce bilan avec 3 indicateurs qui tiennent en une ligne chacun. <strong>Ton taux d'endettement</strong>, c'est-à-dire tes mensualités de crédit rapportées à tes revenus, avec un repère courant autour de 35 %. <strong>Ton taux d'épargne</strong>, ce que tu mets de côté rapporté à tes revenus. Et <strong>ton fonds d'urgence en mois de charges</strong>, qui dit combien de temps tu tiendrais sans revenu.",
"Ces 4 chiffres, patrimoine net et 3 indicateurs, forment ton tableau de bord. Ils prennent 30 minutes à établir la première fois, 10 minutes ensuite. <strong>Refais-les une fois par an, à date fixe</strong>, et tu auras en 5 ans une trajectoire que presque personne autour de toi ne peut montrer."
],
quiz:[
{q:"Comment se calcule le patrimoine net ?",opts:["Revenus moins dépenses","Ce que tu possèdes moins ce que tu dois","Épargne plus salaire annuel","Solde de tous les comptes"],correct:1,
explain:"C'est le seul chiffre qui mesure la situation réelle, et il est souvent négatif en début de parcours."},
{q:"Un patrimoine net négatif signifie-t-il un échec ?",opts:["Oui, toujours","Non, c'est très courant chez les jeunes actifs et en début de crédit immobilier","Oui, sauf pour les étudiants","Cela dépend de la banque"],correct:1,
explain:"C'est une étape, pas un verdict. Ce qui compte est l'évolution d'une année sur l'autre."},
{q:"Quel est l'intérêt principal du bilan ?",opts:["Le chiffre obtenu aujourd'hui","La comparaison d'une année sur l'autre","Le montrer à sa banque","Calculer ses impôts"],correct:1,
explain:"Une progression de 3 000 € en un an dit ce que ni le salaire ni le solde bancaire ne diront jamais."}
],
action:"Établis ton bilan ce soir, en 2 colonnes, sur une seule page. Puis compare ta feuille d'estimation de la leçon 1 avec la réalité. L'écart entre les 2 est la mesure exacte de ce que tu ignorais il y a 4 leçons."
},
{module:"Module 2 — Structurer avec la règle 50/30/20", title:"La règle 50/30/20 expliquée", duration:"5 min",
script:[
"Cette règle est le repère budgétaire le plus utilisé au monde, et aussi le plus mal appliqué. Elle propose de répartir ses revenus nets en 3 blocs : <strong>50 % pour les besoins, 30 % pour les envies, 20 % pour l'épargne et le remboursement des dettes.</strong>",
"<strong>Les besoins</strong> regroupent ce que tu paierais même en cherchant un emploi : logement, énergie, alimentation de base, transport, assurances, santé, remboursements minimums. <strong>Les envies</strong> couvrent tout ce qui améliore la vie sans être indispensable : restaurants, sorties, vêtements au-delà du nécessaire, abonnements de loisir, voyages. <strong>Le troisième bloc</strong> réunit l'épargne, l'investissement et le remboursement anticipé des dettes.",
"La force de cette règle n'est pas la précision des pourcentages, c'est sa simplicité : <u>3 catégories se tiennent en tête, 15 catégories ne se tiennent pas.</u> Un budget qu'on n'arrive pas à mémoriser est un budget qu'on abandonne.",
"<figure class=\"schema\"><svg viewBox=\"0 0 700 222\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"20\" y=\"138\" width=\"250\" height=\"52\" rx=\"9\" fill=\"#E7EFEA\" stroke=\"#1E4B3C\" stroke-width=\"1.4\"/><circle cx=\"46\" cy=\"164\" r=\"12\" fill=\"#1E4B3C\"/><text x=\"46\" y=\"168\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\" fill=\"#fff\">1</text><text x=\"70\" y=\"160\" font-family=\"Newsreader, Georgia, serif\" font-size=\"15\" font-weight=\"600\" fill=\"#12212B\">50 % : les besoins</text><text x=\"70\" y=\"177\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#43555F\">Logement, énergie, alimentation, transport, assurances.</text><rect x=\"20\" y=\"74\" width=\"450\" height=\"52\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#DCDDD3\" stroke-width=\"1.4\"/><circle cx=\"46\" cy=\"100\" r=\"12\" fill=\"#DCDDD3\"/><text x=\"46\" y=\"104\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\" fill=\"#fff\">2</text><text x=\"70\" y=\"96\" font-family=\"Newsreader, Georgia, serif\" font-size=\"15\" font-weight=\"600\" fill=\"#12212B\">30 % : les envies</text><text x=\"70\" y=\"113\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#43555F\">Sorties, loisirs, vêtements, voyages.</text><rect x=\"20\" y=\"10\" width=\"650\" height=\"52\" rx=\"9\" fill=\"#F6EFE0\" stroke=\"#B8862F\" stroke-width=\"1.4\"/><circle cx=\"46\" cy=\"36\" r=\"12\" fill=\"#B8862F\"/><text x=\"46\" y=\"40\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\" fill=\"#fff\">3</text><text x=\"70\" y=\"32\" font-family=\"Newsreader, Georgia, serif\" font-size=\"15\" font-weight=\"600\" fill=\"#12212B\">20 % : épargne et dettes</text><text x=\"70\" y=\"49\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#43555F\">Le bloc à défendre en premier, jamais celui qu'on sacrifie.</text></svg><figcaption>Un repère, pas une norme. Ce qui compte est de mesurer ton écart avec lui, pas de l'atteindre à tout prix.</figcaption></figure>",
"Il faut cependant être honnête sur ses limites, et elles sont sérieuses en France. Dans les grandes agglomérations, le logement seul peut représenter 40 % des revenus, ce qui rend la barre des 50 % inatteignable pour beaucoup. Pour un revenu modeste, les besoins peuvent dépasser 70 %, et il ne reste alors rien à répartir.",
"Cela ne rend pas la règle inutile, cela change son usage. <strong>Elle ne sert pas de norme à atteindre, mais de mesure de l'écart.</strong> Savoir que tes besoins pèsent 68 % au lieu de 50 % est une information précieuse : elle dit exactement où porter l'effort, et elle explique pourquoi épargner te semble impossible.",
"Une variante est souvent plus réaliste pour démarrer, et je te la recommande si les 20 % te paraissent hors d'atteinte : commence par <strong>5 %</strong>, puis augmente d'un point tous les 6 mois. Un taux d'épargne de 5 % qui tient 3 ans vaut infiniment mieux qu'un objectif de 20 % abandonné au deuxième mois.",
"Retiens le principe général qui compte davantage que les chiffres : <strong>l'épargne doit être un poste du budget, pas un reste.</strong> Tant qu'elle est ce qui reste à la fin, elle ne reste jamais."
],
quiz:[
{q:"Que couvre le bloc des 20 % ?",opts:["Les loisirs uniquement","L'épargne, l'investissement et le remboursement anticipé des dettes","Les impôts","Les charges fixes"],correct:1,
explain:"Rembourser une dette chère par anticipation produit un rendement certain, d'où sa présence dans ce bloc."},
{q:"Quelle est la vraie force de cette règle ?",opts:["La précision de ses pourcentages","Sa simplicité : 3 catégories se retiennent, 15 non","Son origine universitaire","Son adaptation à tous les revenus"],correct:1,
explain:"Un budget qu'on n'arrive pas à mémoriser est un budget qu'on finit par abandonner."},
{q:"Comment utiliser la règle quand les besoins dépassent 50 % ?",opts:["L'abandonner","S'en servir comme mesure de l'écart plutôt que comme norme","Réduire l'alimentation","Emprunter la différence"],correct:1,
explain:"Savoir que les besoins pèsent 68 % dit exactement où porter l'effort, et pourquoi épargner semble impossible."}
],
action:"Calcule tes 3 pourcentages réels à partir du mois que tu viens d'observer. Ne cherche pas à les corriger ce soir. Le seul objectif est de connaître ton écart avec le repère, parce que c'est lui qui indiquera par où commencer."
},
{module:"Module 2 — Structurer avec la règle 50/30/20", title:"Les enveloppes budgétaires", duration:"5 min",
script:[
"La méthode des enveloppes est probablement la plus ancienne technique de budget qui existe, et elle reste la plus efficace pour une raison qui tient à la psychologie plus qu'aux mathématiques.",
"Le principe d'origine : au début du mois, on répartit l'argent liquide dans des enveloppes physiques, une par poste. Quand une enveloppe est vide, on ne dépense plus dans cette catégorie. <strong>La contrainte est visible, matérielle, et elle ne se discute pas.</strong>",
"Ce qui rend cette méthode supérieure à un tableau, c'est qu'elle transforme une abstraction en objet. <u>Un solde de compte ne dit pas ce qui est déjà engagé</u>, alors qu'une enveloppe vide le dit immédiatement. C'est la différence entre savoir qu'on a dépassé et le constater.",
"La version moderne se pratique avec des comptes plutôt qu'avec du liquide, et la plupart des banques en ligne permettent d'ouvrir plusieurs comptes ou sous-comptes gratuitement. Une organisation qui fonctionne bien tient en 4 comptes : <strong>un compte pour les charges fixes</strong>, où arrive le salaire et d'où partent tous les prélèvements ; <strong>un compte pour les dépenses courantes</strong>, alimenté par un virement au début du mois, avec la carte associée ; <strong>un compte de provisions</strong> pour les dépenses annuelles ; <strong>un compte d'épargne</strong>, séparé et de préférence dans un autre établissement.",
"L'effet le plus important de cette organisation est celui-ci : <strong>la carte que tu utilises au quotidien n'est plus reliée à la totalité de ton argent.</strong> Elle est reliée à ton budget courant, ce qui rend le dépassement visible sans qu'aucun effort de mémoire ne soit nécessaire.",
"Deux conseils pratiques. <strong>Ne crée pas trop d'enveloppes</strong> : 4 comptes suffisent, 8 deviennent ingérables et tu abandonneras. Et <strong>prévois une enveloppe « divers »</strong>, volontairement, pour absorber ce qui n'entre nulle part. Un système sans soupape est un système qui casse au premier imprévu.",
"Enfin, si tu préfères le liquide pour certaines catégories, notamment l'alimentation et les sorties, sache que ce choix n'a rien d'archaïque : <strong>payer en espèces fait ressentir la dépense</strong>, et cette sensation est exactement ce que le paiement sans contact a supprimé."
],
quiz:[
{q:"Pourquoi une enveloppe est-elle plus efficace qu'un tableau ?",opts:["Elle est plus précise","Elle rend la contrainte visible et matérielle","Elle évite les frais bancaires","Elle est plus rapide à remplir"],correct:1,
explain:"Un solde de compte ne dit pas ce qui est déjà engagé. Une enveloppe vide le dit immédiatement."},
{q:"Quel est l'effet principal du compte de dépenses courantes séparé ?",opts:["Il rapporte des intérêts","La carte du quotidien n'est plus reliée à la totalité de l'argent","Il réduit les impôts","Il évite les prélèvements"],correct:1,
explain:"Le dépassement devient visible sans aucun effort de mémoire ni de calcul."},
{q:"Combien d'enveloppes faut-il créer ?",opts:["Une par poste de dépense","4 comptes suffisent, davantage devient ingérable","Au moins 10","Une seule"],correct:1,
explain:"Un système trop fin finit abandonné. Prévois aussi une enveloppe « divers » comme soupape."}
],
action:"Ouvre ce soir un second compte, gratuit, dans ta banque ou ailleurs, et destine-le à tes dépenses courantes. Tu y feras un virement au début du mois prochain. C'est la manipulation la plus efficace de toute cette formation."
},
{module:"Module 2 — Structurer avec la règle 50/30/20", title:"Adapter la règle à ton revenu", duration:"5 min",
script:[
"La règle 50/30/20 a été pensée pour un revenu moyen dans un pays donné. Elle demande donc à être ajustée, et cette leçon donne des repères pour 4 situations très différentes.",
"<strong>Revenu contraint, quand les besoins dépassent 70 %.</strong> Les pourcentages n'ont plus de sens ici, et prétendre le contraire serait malhonnête. La priorité est ailleurs : faire baisser une charge fixe importante, vérifier les aides auxquelles tu as droit, ce que très peu de gens font entièrement, et viser un premier palier d'épargne de 1 000 €, sans calendrier imposé. <u>Un objectif d'épargne à 20 % dans cette situation ne produit que de la culpabilité.</u>",
"<strong>Revenu moyen.</strong> C'est la situation où la règle s'applique le mieux, avec un ajustement fréquent : 55 % pour les besoins, 25 % pour les envies, 20 % conservés pour l'épargne. Le bloc à défendre est le troisième, jamais le premier.",
"<strong>Revenu confortable.</strong> Le piège change complètement de nature : ce n'est plus le manque, c'est <strong>l'inflation du mode de vie</strong>. Chaque augmentation est absorbée par une hausse du train de vie, et le taux d'épargne reste identique à 2 000 € comme à 4 000 € de revenu. La règle devient alors 45/25/30, voire davantage, et le seul mécanisme qui fonctionne consiste à <u>diriger la moitié de chaque augmentation vers l'épargne avant de s'habituer à la dépenser.</u>",
"<strong>Revenu irrégulier</strong>, pour les indépendants, intermittents et saisonniers. La règle mensuelle ne fonctionne pas. La méthode adaptée consiste à calculer un revenu de référence à partir des 12 derniers mois, en retenant plutôt une année basse, à se verser ce montant fixe chaque mois depuis un compte tampon, et à laisser le surplus des bons mois financer les mauvais. <strong>Ce compte tampon est l'équivalent d'un salaire que tu te verses à toi-même</strong>, et il transforme un revenu chaotique en revenu prévisible.",
"Un point commun à ces 4 situations mérite d'être souligné. <strong>Le taux d'épargne dépend moins du revenu qu'on ne le croit.</strong> Des gens à 1 800 € épargnent régulièrement, d'autres à 4 000 € n'y arrivent jamais. La différence tient à la structure des charges fixes et à l'automatisation, pas au montant qui entre.",
"C'est une bonne nouvelle : cela signifie que le levier est à ta portée immédiatement, sans attendre une augmentation."
],
quiz:[
{q:"Quelle priorité quand les besoins dépassent 70 % du revenu ?",opts:["Épargner 20 % quand même","Faire baisser une charge fixe, vérifier ses droits, viser un premier palier de 1 000 €","Réduire l'alimentation","Prendre un crédit"],correct:1,
explain:"Imposer un objectif de 20 % dans cette situation ne produit que de la culpabilité, pas de l'épargne."},
{q:"Quel est le piège d'un revenu confortable ?",opts:["Les impôts","L'inflation du mode de vie, qui absorbe chaque augmentation","La complexité bancaire","Le manque d'options de placement"],correct:1,
explain:"Le taux d'épargne reste identique à 2 000 € comme à 4 000 €. La parade est de diriger la moitié de chaque hausse vers l'épargne."},
{q:"Comment gérer un revenu irrégulier ?",opts:["Dépenser au fur et à mesure","Se verser un montant fixe depuis un compte tampon alimenté par les bons mois","Emprunter pendant les mois creux","Renoncer à tout budget"],correct:1,
explain:"Ce compte tampon est un salaire qu'on se verse à soi-même, et il rend prévisible un revenu qui ne l'est pas."}
],
action:"Identifie laquelle des 4 situations est la tienne, et note le seul ajustement qui en découle. Si tu es en revenu irrégulier, calcule dès ce soir ton revenu de référence sur les 12 derniers mois en retenant l'hypothèse basse."
},
{module:"Module 2 — Structurer avec la règle 50/30/20", title:"Reconstruire ton budget", duration:"5 min",
script:[
"Tu as observé, classé, et tu connais tes écarts. Il est temps de construire le budget lui-même, à partir de chiffres réels et non d'intentions.",
"<strong>Étape 1 : pars de la réalité, pas de l'idéal.</strong> Reprends la moyenne de tes 3 derniers mois, poste par poste. Un budget construit sur ce que tu voudrais dépenser est un budget faux dès le premier jour, et son échec te découragera d'en refaire un.",
"<strong>Étape 2 : fixe l'épargne en premier.</strong> C'est la seule ligne qui doit être décidée avant les autres, et c'est l'inversion la plus importante de toute cette formation. Choisis un montant que tu es certain de tenir, même un mois difficile, quitte à ce qu'il paraisse ridicule.",
"<strong>Étape 3 : bloque les charges fixes.</strong> Elles ne se négocient pas ce mois-ci, elles sont ce qu'elles sont. Note-les telles quelles, et garde la liste pour la séance de renégociation.",
"<strong>Étape 4 : ce qui reste devient ton budget courant.</strong> Divise ce montant par 4,33 pour obtenir ton budget hebdomadaire. <u>Raisonner par semaine change tout</u> : un dépassement se corrige en 6 jours au lieu de 25, et l'échelle de temps reste compréhensible.",
"<strong>Étape 5 : prévois la soupape.</strong> Ajoute une ligne « imprévus » d'environ 5 % du revenu. Un budget sans soupape casse au premier événement, et l'échec est alors attribué à la personne alors qu'il vient de la méthode.",
"Trois erreurs à éviter, tirées de ce qui fait échouer les budgets. <strong>Trop de catégories</strong> : au-delà de 8, plus personne ne remplit. <strong>Trop de rigueur</strong> : un budget qui interdit tout plaisir sera abandonné, et une ligne de loisirs assumée est une garantie de durée. <strong>Trop d'ambition</strong> : vouloir réduire de 30 % dès le premier mois est le meilleur moyen de tout arrêter au deuxième.",
"Un dernier conseil qui vaut pour la suite. <strong>Le premier budget est toujours faux</strong>, et c'est normal. Il devient juste au bout de 2 ou 3 mois d'ajustements. Ce n'est pas un document qu'on écrit une fois, c'est un instrument qu'on règle."
],
quiz:[
{q:"Sur quelle base construire son budget ?",opts:["Sur ce qu'on voudrait dépenser","Sur la moyenne réelle des 3 derniers mois","Sur les moyennes nationales","Sur le mois le plus économe"],correct:1,
explain:"Un budget construit sur des intentions est faux dès le premier jour, et son échec décourage d'en refaire un."},
{q:"Quelle ligne faut-il fixer en premier ?",opts:["Le loyer","L'épargne","L'alimentation","Les loisirs"],correct:1,
explain:"C'est l'inversion décisive : l'épargne devient un poste du budget au lieu d'être ce qui reste à la fin."},
{q:"Pourquoi raisonner par semaine plutôt que par mois ?",opts:["Parce que les salaires sont hebdomadaires","Parce qu'un dépassement se corrige en 6 jours au lieu de 25","Parce que c'est plus précis","Parce que les banques le recommandent"],correct:1,
explain:"L'échelle de temps reste compréhensible et la correction possible, ce qui n'est pas le cas sur un mois entier."}
],
action:"Construis ton budget ce soir avec le tableau NiouDem, à partir de tes chiffres réels. Fixe l'épargne en premier, puis les charges, puis divise le reste par 4,33. Tu obtiendras ton budget hebdomadaire, qui est le seul que tu auras à surveiller."
},
{module:"Module 3 — Automatiser et fluidifier", title:"Les virements automatiques", duration:"5 min",
script:[
"L'automatisation est le seul dispositif de cette formation qui fonctionne même les mois où tu ne penses pas à ton budget. C'est ce qui en fait le plus important de tous.",
"Le principe a été vu dans la formation sur l'épargne et mérite d'être répété ici : <strong>on épargne d'abord, on dépense ce qui reste.</strong> Techniquement, cela signifie un virement programmé le lendemain de la paie, exécuté sans aucune décision de ta part.",
"Voici comment construire l'architecture complète, dans l'ordre. <strong>Jour 1 :</strong> le salaire arrive sur le compte principal. <strong>Jour 2 :</strong> un virement automatique part vers le compte d'épargne. <strong>Jour 2 également :</strong> un second virement alimente le compte de provisions pour les dépenses annuelles. <strong>Jour 3 :</strong> un troisième virement alimente le compte de dépenses courantes, celui relié à ta carte. <strong>Du 5 au 10 :</strong> les prélèvements des charges fixes partent du compte principal, qui n'a plus qu'eux à assumer.",
"<figure class=\"schema\"><svg viewBox=\"0 0 700 338\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"20\" y=\"24\" width=\"190\" height=\"54\" rx=\"9\" fill=\"#EFF0EA\" stroke=\"#12212B\" stroke-width=\"1.5\"/><text x=\"115\" y=\"47\" text-anchor=\"middle\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14.5\" font-weight=\"600\" fill=\"#12212B\">Ton salaire</text><text x=\"115\" y=\"65\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\" fill=\"#7A8A93\">jour 1</text><path d=\"M210 51 C 270 51, 270 66, 330 66\" fill=\"none\" stroke=\"#B8862F\" stroke-width=\"1.8\"/><circle cx=\"330\" cy=\"66\" r=\"4\" fill=\"#B8862F\"/><rect x=\"344\" y=\"43\" width=\"336\" height=\"46\" rx=\"8\" fill=\"#F6EFE0\" stroke=\"#B8862F\" stroke-width=\"1.3\"/><text x=\"360\" y=\"64\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"14\" font-weight=\"600\" fill=\"#12212B\">Épargne, automatique</text><text x=\"664\" y=\"64\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"13\" fill=\"#B8862F\">jour 2</text><path d=\"M210 51 C 270 51, 270 128, 330 128\" fill=\"none\" stroke=\"#B8862F\" stroke-width=\"1.8\"/><circle cx=\"330\" cy=\"128\" r=\"4\" fill=\"#B8862F\"/><rect x=\"344\" y=\"105\" width=\"336\" height=\"46\" rx=\"8\" fill=\"#F6EFE0\" stroke=\"#B8862F\" stroke-width=\"1.3\"/><text x=\"360\" y=\"126\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"14\" font-weight=\"600\" fill=\"#12212B\">Provisions annuelles</text><text x=\"664\" y=\"126\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"13\" fill=\"#B8862F\">jour 2</text><path d=\"M210 51 C 270 51, 270 190, 330 190\" fill=\"none\" stroke=\"#1E4B3C\" stroke-width=\"1.8\"/><circle cx=\"330\" cy=\"190\" r=\"4\" fill=\"#1E4B3C\"/><rect x=\"344\" y=\"167\" width=\"336\" height=\"46\" rx=\"8\" fill=\"#E7EFEA\" stroke=\"#1E4B3C\" stroke-width=\"1.3\"/><text x=\"360\" y=\"188\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"14\" font-weight=\"600\" fill=\"#12212B\">Budget courant, ta carte</text><text x=\"664\" y=\"188\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"13\" fill=\"#1E4B3C\">jour 3</text><path d=\"M210 51 C 270 51, 270 252, 330 252\" fill=\"none\" stroke=\"#1E4B3C\" stroke-width=\"1.8\"/><circle cx=\"330\" cy=\"252\" r=\"4\" fill=\"#1E4B3C\"/><rect x=\"344\" y=\"229\" width=\"336\" height=\"46\" rx=\"8\" fill=\"#E7EFEA\" stroke=\"#1E4B3C\" stroke-width=\"1.3\"/><text x=\"360\" y=\"250\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"14\" font-weight=\"600\" fill=\"#12212B\">Charges fixes, prélèvements</text><text x=\"664\" y=\"250\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"13\" fill=\"#1E4B3C\">du 5 au 10</text></svg><figcaption>Au jour 3, tout est réparti : ce que tu vois sur ta carte est exactement ce que tu peux dépenser.</figcaption></figure>",
"Ce séquencement produit un effet qu'aucune discipline ne reproduit : <u>au jour 3, tout est déjà réparti, et ce que tu vois sur ta carte est exactement ce que tu peux dépenser.</u> Le budget n'est plus un document à consulter, il est devenu la structure de tes comptes.",
"Trois précautions avant de tout programmer. <strong>1. Garde un coussin</strong> de 100 à 200 € sur le compte principal, pour absorber un prélèvement plus élevé que prévu sans déclencher de frais de rejet. <strong>2. Vérifie les dates réelles</strong> de tes prélèvements, qui figurent sur tes relevés, plutôt que de te fier à ce que tu crois. <strong>3. Commence avec un montant d'épargne faible</strong>, et augmente-le une fois que le système a tourné 3 mois sans accroc.",
"Une question revient souvent : que faire les mois où c'est trop juste ? La réponse est claire et il faut la connaître à l'avance. <strong>Tu peux annuler un virement d'épargne exceptionnellement, mais tu ne le supprimes jamais.</strong> Un virement suspendu se réactive ; un virement supprimé ne se recrée jamais.",
"Enfin, un mot sur ce que cette automatisation change au-delà de l'argent. Elle supprime des dizaines de micro-décisions par mois, et donc la fatigue mentale qui va avec. <strong>C'est le seul système de cette formation qui te demande moins d'efforts à mesure que le temps passe.</strong>"
],
quiz:[
{q:"Quand programmer le virement d'épargne ?",opts:["En fin de mois","Le lendemain de la paie","Le 15 du mois","Quand le solde le permet"],correct:1,
explain:"Ce que tu ne vois jamais ne te manque pas. Un virement de fin de mois saute dès que le mois a été difficile."},
{q:"Que faut-il garder sur le compte principal ?",opts:["Rien du tout","Un coussin de 100 à 200 € pour absorber un prélèvement plus élevé","La totalité du salaire","Uniquement le montant des charges"],correct:1,
explain:"Il évite les frais de rejet, qui coûtent bien plus cher que le montant immobilisé."},
{q:"Que faire un mois trop juste ?",opts:["Supprimer le virement d'épargne","L'annuler exceptionnellement sans jamais le supprimer","Emprunter la différence","Doubler le mois suivant"],correct:1,
explain:"Un virement suspendu se réactive. Un virement supprimé ne se recrée pratiquement jamais."}
],
action:"Programme ce soir les 3 virements automatiques dans ton application bancaire, aux bonnes dates. Si tu n'en programmes qu'un, que ce soit celui de l'épargne, avec un montant que tu ne remarqueras pas."
},
{module:"Module 3 — Automatiser et fluidifier", title:"Organiser ses comptes", duration:"5 min",
script:[
"L'architecture de tes comptes fait plus pour ton budget que n'importe quel tableau. Cette leçon décrit une organisation qui fonctionne, et les cas particuliers qui demandent un ajustement.",
"<strong>Le socle : 4 comptes.</strong> Un compte principal qui reçoit les revenus et supporte les charges fixes. Un compte courant secondaire pour les dépenses quotidiennes, avec la carte associée. Un compte de provisions pour les dépenses annuelles. Un livret d'épargne, dans un autre établissement si possible.",
"Le fait de placer l'épargne <strong>ailleurs</strong> n'est pas un détail technique. La friction de quelques minutes nécessaire pour y accéder suffit à distinguer un vrai besoin d'une envie du moment, et c'est le dispositif le moins coûteux et le plus efficace de toute cette formation.",
"<strong>Le cas du couple</strong> mérite un traitement à part, parce qu'il provoque plus de conflits que n'importe quel autre sujet financier. Trois organisations existent, et aucune n'est supérieure aux autres. <em>Tout en commun</em> : simple, mais supprime toute autonomie et rend chaque dépense personnelle visible. <em>Tout séparé</em> : autonome, mais complique le partage des charges et pénalise celui qui gagne le moins. <em>Le modèle mixte</em> : un compte joint alimenté au prorata des revenus pour les charges communes, et un compte personnel chacun.",
"<u>Le modèle mixte au prorata est celui qui produit le moins de tensions</u>, parce qu'il traite la question de l'équité de façon explicite. Si l'un gagne 2 000 € et l'autre 3 000 €, chacun verse 40 % et 60 % des charges communes plutôt que la moitié. Ce qui reste sur le compte personnel n'a pas à être justifié, et c'est précisément ce qui évite les disputes.",
"<strong>Le cas de l'indépendant</strong> impose une règle non négociable : un compte strictement dédié à l'activité, distinct du compte personnel. Non seulement pour la comptabilité, mais parce que mélanger rend impossible de savoir ce que l'activité rapporte réellement. Ajoute un troisième compte pour provisionner les cotisations et l'impôt, alimenté à chaque encaissement.",
"Un conseil de simplicité pour finir. <strong>Résiste à la tentation de multiplier les comptes.</strong> Chaque compte supplémentaire ajoute un suivi, parfois des frais, et une occasion d'oublier. Quatre comptes bien utilisés valent mieux que 9 comptes ouverts avec enthousiasme et abandonnés en 3 mois."
],
quiz:[
{q:"Pourquoi placer son épargne dans un autre établissement ?",opts:["Pour un meilleur taux","Pour créer une friction qui distingue un besoin d'une envie","Pour la sécurité juridique","Pour réduire les frais"],correct:1,
explain:"Quelques minutes de délai suffisent à faire la différence, et ce dispositif ne coûte rien."},
{q:"Quelle organisation de couple produit le moins de tensions ?",opts:["Tout en commun","Le modèle mixte, avec un compte joint alimenté au prorata des revenus","Tout séparé","Un seul compte au nom d'une personne"],correct:1,
explain:"Il traite l'équité de façon explicite, et le compte personnel n'a pas à être justifié."},
{q:"Quelle règle s'impose à un indépendant ?",opts:["Ouvrir 6 comptes","Séparer strictement le compte d'activité du compte personnel","Utiliser un compte unique pour simplifier","Confier ses comptes à un tiers"],correct:1,
explain:"Sans cette séparation, il devient impossible de savoir ce que l'activité rapporte réellement."}
],
action:"Dessine sur une feuille l'organisation de tes comptes actuels, avec des flèches pour les flux. Puis dessine l'organisation cible. L'écart entre les 2 schémas te dira exactement combien d'ouvertures ou de fermetures il te reste à faire."
},
{module:"Module 3 — Automatiser et fluidifier", title:"Les applications de suivi", duration:"5 min",
script:[
"Les applications de gestion budgétaire promettent de tout automatiser. Elles rendent de vrais services et présentent de vraies limites, qu'il vaut mieux connaître avant de confier ses données bancaires à un tiers.",
"<strong>Ce qu'elles font bien.</strong> Elles agrègent plusieurs banques dans une seule vue, catégorisent automatiquement les dépenses, repèrent les abonnements récurrents et produisent des graphiques mensuels. Pour quelqu'un qui déteste les tableaux, ce gain de friction est décisif.",
"<strong>Ce qu'elles font mal.</strong> La catégorisation automatique se trompe souvent, notamment sur les paiements en ligne et les virements entre comptes, ce qui fausse les statistiques sans que tu t'en aperçoives. Et surtout, <u>elles montrent le passé sans jamais décider de l'avenir</u> : voir qu'on a dépensé 340 € en restaurants ne change rien tant qu'aucune limite n'a été fixée à l'avance.",
"<strong>La question des données mérite d'être posée sérieusement.</strong> Ces applications accèdent à l'intégralité de tes opérations bancaires, ce qui constitue une information extrêmement précise sur ta vie. Avant d'en choisir une, vérifie 3 choses : qui l'édite et dans quel pays, quel est son modèle économique, et si elle revend ou exploite des données agrégées. <strong>Une application gratuite dont on ne comprend pas le modèle économique se rémunère forcément quelque part.</strong>",
"Un point technique utile : depuis la réglementation européenne sur les services de paiement, l'accès aux comptes passe par des interfaces sécurisées et un agrément, ce qui est plus protecteur qu'auparavant. Vérifie que l'éditeur est bien agréé, l'information doit figurer sur son site.",
"Ma recommandation est nuancée. <strong>Une application est un bon outil d'observation et un mauvais outil de décision.</strong> Elle remplace avantageusement la saisie manuelle pendant la phase de diagnostic. Mais le budget lui-même, c'est-à-dire les montants décidés à l'avance, doit vivre ailleurs : dans ton tableau, et surtout dans la structure de tes comptes.",
"Si tu ne veux aucune application, sache que <strong>le tableau NiouDem et 4 comptes suffisent entièrement.</strong> Des gens tiennent un budget depuis 20 ans avec un carnet. L'outil n'a jamais été le facteur limitant."
],
quiz:[
{q:"Quelle est la principale limite de ces applications ?",opts:["Leur prix","Elles montrent le passé sans décider de l'avenir","Leur lenteur","Le nombre de banques compatibles"],correct:1,
explain:"Voir qu'on a dépensé 340 € ne change rien tant qu'aucune limite n'a été fixée à l'avance."},
{q:"Que vérifier avant d'en choisir une ?",opts:["Sa note sur les magasins d'applications","Qui l'édite, son modèle économique, et son agrément","Le nombre d'utilisateurs","La couleur de l'interface"],correct:1,
explain:"Elle accède à l'intégralité de tes opérations. Une application gratuite se rémunère forcément quelque part."},
{q:"Peut-on tenir un budget sans application ?",opts:["Non, c'est indispensable aujourd'hui","Oui, un tableau et 4 comptes suffisent entièrement","Uniquement avec un comptable","Seulement si les revenus sont fixes"],correct:1,
explain:"L'outil n'a jamais été le facteur limitant. Des gens tiennent un budget depuis 20 ans avec un carnet."}
],
action:"Si tu utilises une application, vérifie ce soir 2 choses : son éditeur et son modèle économique. Si tu n'en utilises pas, ne la cherche pas, ton tableau suffit. Dans les 2 cas, l'important reste la structure de tes comptes."
},
{module:"Module 3 — Automatiser et fluidifier", title:"Configurer ton système complet", duration:"5 min",
script:[
"Cette leçon assemble tout ce qui précède en une session unique. Compte 90 minutes, une seule fois, et ton budget fonctionnera ensuite presque sans toi.",
"<strong>Bloc 1, 20 minutes : les comptes.</strong> Ouvre le compte de dépenses courantes s'il n'existe pas, ouvre le compte de provisions, et vérifie que ton livret d'épargne est bien dans un autre établissement. Nomme chaque compte explicitement dans ton application bancaire, la plupart le permettent : « charges », « courant », « provisions », « épargne ».",
"<strong>Bloc 2, 20 minutes : les montants.</strong> Reprends ton budget. Note le montant de l'épargne mensuelle, le montant des provisions annuelles divisé par 12, et le budget courant mensuel. Ces 3 chiffres sont les seuls dont tu auras besoin.",
"<strong>Bloc 3, 20 minutes : les virements.</strong> Programme les 3 virements automatiques aux bonnes dates, comme vu 3 leçons plus tôt. Vérifie que le compte principal conserve son coussin après leur exécution.",
"<strong>Bloc 4, 20 minutes : le ménage.</strong> Résilie les abonnements repérés lors du diagnostic. Supprime les cartes enregistrées sur les sites marchands. Désactive les paiements en un clic. <u>Cette étape rapporte immédiatement plus que toutes les autres réunies.</u>",
"<strong>Bloc 5, 10 minutes : les rituels.</strong> Programme dans ton calendrier le point hebdomadaire de 10 minutes et le point mensuel de 30 minutes, en récurrence, accrochés à quelque chose que tu fais déjà.",
"Un conseil sur la manière de mener cette session : <strong>fais-la d'un seul tenant, sans téléphone.</strong> Étaler ces 5 blocs sur 5 soirs revient à payer 5 fois le coût de démarrage, et la plupart des gens abandonnent au troisième. Bloque le créneau comme un rendez-vous, parce que c'en est un.",
"Ce que tu auras à la fin : un système où <strong>l'épargne part sans y penser, les charges sont isolées, le budget courant est visible sur une carte dédiée, et les dépenses annuelles sont provisionnées.</strong> À partir de là, tenir son budget ne demande plus que 10 minutes par semaine."
],
quiz:[
{q:"Combien de temps demande la configuration complète ?",opts:["10 minutes","Environ 90 minutes, une seule fois","Une journée entière","Un mois"],correct:1,
explain:"Une session unique, d'un seul tenant. L'étaler revient à payer plusieurs fois le coût de démarrage."},
{q:"Quel bloc rapporte immédiatement le plus ?",opts:["L'ouverture des comptes","Le ménage : résiliations et suppression des cartes enregistrées","Le calcul des montants","La programmation des rituels"],correct:1,
explain:"Il produit un gain qui se répète chaque mois, dès le mois suivant, sans rien changer au mode de vie."},
{q:"Combien de chiffres sont nécessaires au système ?",opts:["Un par catégorie de dépense","3 : épargne mensuelle, provisions, budget courant","Une dizaine","Aucun, tout est automatique"],correct:1,
explain:"Toute la complexité apparente du budget se ramène à 3 montants et 3 virements."}
],
action:"Bloque dès maintenant un créneau de 90 minutes dans ton calendrier, dans les 7 prochains jours, intitulé « configuration budget ». Colle les 5 blocs dans la description. C'est la seule action de cette formation qui demande vraiment du temps."
},
{module:"Module 4 — Ancrer le rituel", title:"Le bilan mensuel en 15 minutes", duration:"5 min",
script:[
"Un système automatisé continue de tourner tout seul, mais il dérive doucement si personne ne le regarde. Le bilan mensuel est le seul rendez-vous obligatoire, et il tient en 15 minutes.",
"<strong>Le moment : le lendemain de ta paie.</strong> Toujours le même, parce que tout est frais et parce que les ajustements que tu décideras s'appliqueront au mois qui commence, pas à celui qui s'achève.",
"<strong>Minutes 1 à 5 : vérifier.</strong> Les 3 virements sont-ils bien partis ? Le compte principal a-t-il conservé son coussin ? Y a-t-il eu des frais bancaires, et si oui pourquoi ? Cette dernière question compte : <u>un frais bancaire est toujours le symptôme de quelque chose, jamais une fatalité.</u>",
"<strong>Minutes 6 à 10 : comparer.</strong> Ouvre ton tableau et regarde le mois écoulé. Compare le budget courant prévu au réalisé. Une seule question : l'écart vient-il d'un imprévu ponctuel, ou d'un budget mal calibré dès le départ ?",
"<strong>Minutes 11 à 15 : ajuster une seule chose.</strong> Une. Pas 5. Augmenter l'épargne de 10 €, résilier un abonnement, réhausser une ligne sous-estimée. <strong>Un ajustement mensuel appliqué vaut mieux que 5 ajustements notés et jamais faits.</strong>",
"Trois pièges à éviter dans ce rituel. <strong>Ne le transforme pas en séance d'auto-évaluation.</strong> Tu regardes un système, pas ta valeur personnelle, et cette distinction fait la différence entre un rituel qui dure et un rendez-vous qu'on finit par éviter.",
"<strong>Ne cherche pas la précision au centime.</strong> Un écart de 20 € n'a aucune signification, un écart de 200 € en a une. Et <strong>ne saute pas le rituel un mois difficile</strong> : c'est précisément le mois où il est le plus utile, parce que c'est là qu'un dérapage devient une habitude.",
"Enfin, garde une trace : 3 lignes par mois suffisent, notant l'écart constaté et l'ajustement décidé. Au bout d'un an, ces 36 lignes racontent une trajectoire, et elles montrent surtout que les mois difficiles alternent avec les autres, ce qu'on oublie complètement quand on est dedans."
],
quiz:[
{q:"Quand faire le bilan mensuel ?",opts:["Le dernier jour du mois","Le lendemain de la paie","Le premier dimanche du mois","Quand on y pense"],correct:1,
explain:"Les ajustements décidés s'appliquent alors au mois qui commence, pas à celui qui s'achève."},
{q:"Combien d'ajustements décider par bilan ?",opts:["Autant que nécessaire","Un seul","Au moins 3","Aucun, on observe seulement"],correct:1,

async function loadProgressFromServer(){
  const { data } = await sb
    .from('lesson_progress')
    .select('lesson_number, completed')
    .eq('user_id', CURRENT_USER.id)
    .eq('formation', FORMATION);
  const p = {};
  if(data){ data.forEach(function(row){ if(row.completed) p[row.lesson_number] = true; }); }
  PROGRESS_CACHE = p;
  return p;
}
function getProgress(){ return PROGRESS_CACHE; }
async function setProgressServer(lessonNumber, value){
  PROGRESS_CACHE[lessonNumber] = value;
  await sb.from('lesson_progress').upsert({
    user_id: CURRENT_USER.id,
    formation: FORMATION,
    lesson_number: lessonNumber,
    completed: value,
    completed_at: value ? new Date().toISOString() : null
  }, { onConflict: 'user_id,formation,lesson_number' });

  await majCarnet(lessonNumber, value);
}

/* Le carnet de route : l'action cochée s'inscrit dans le carnet personnel,
   la décocher l'en retire. Une erreur ici ne doit jamais bloquer la
   progression de la leçon, d'où le try/catch silencieux. */
async function majCarnet(lessonNumber, value){
  try {
    const l = LESSONS[lessonNumber - 1];
    if(!l) return;

    if(!value){
      await sb.from('carnet').delete()
        .eq('user_id', CURRENT_USER.id)
        .eq('formation', FORMATION)
        .eq('lesson_number', lessonNumber);
      return;
    }

    await sb.from('carnet').upsert({
      user_id: CURRENT_USER.id,
      formation: FORMATION,
      lesson_number: lessonNumber,
      titre: l.title || ('Leçon ' + lessonNumber),
      action: l.action || ''
    }, { onConflict: 'user_id,formation,lesson_number', ignoreDuplicates: true });
  } catch(e){
    console.warn('Carnet non mis à jour :', e);
  }
}

let current = parseInt(new URLSearchParams(location.search).get('l')) || 1;
if(current < 1) current = 1;
if(current > LESSONS.length) current = LESSONS.length;

function isUnlocked(n){
  if(n === 1) return true;
  const progress = getProgress();
  return !!progress[n-1];
}

function renderSidebar(){
  const progress = getProgress();
  const doneCount = Object.keys(progress).filter(function(k){ return progress[k]; }).length;
  document.getElementById('navProgress').textContent = doneCount + '/' + LESSONS.length + ' leçons';

  /* Regroupement des lecons par module : c'est le module qui devient
     l'etape de l'itineraire, la lecon n'est qu'un arret. */
  const etapes = [];
  LESSONS.forEach(function(l, i){
    const nom = l.module.split(' — ')[1] || l.module;
    let e = etapes.find(function(x){ return x.nom === nom; });
    if(!e){ e = { nom: nom, lecons: [] }; etapes.push(e); }
    e.lecons.push({ n: i + 1, titre: l.title });
  });

  const etapeCourante = etapes.findIndex(function(e){
    return e.lecons.some(function(a){ return a.n === current; });
  });

  const COCHE = '<svg viewBox="0 0 24 24" fill="none"><path d="M5 12L10 17L19 7" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  let html = '<div class="itin">' +
    '<div class="itin-tete">' +
      '<div class="itin-formation">' + NOM_FORMATION + '</div>' +
      '<div class="itin-compte">Étape ' + (etapeCourante + 1) + ' sur ' + etapes.length + ' · ' + doneCount + '/' + LESSONS.length + ' leçons</div>' +
      '<div class="itin-barre"><span style="width:' + Math.round(doneCount / LESSONS.length * 100) + '%"></span></div>' +
    '</div><div class="route">';

  etapes.forEach(function(e, idx){
    const toutesFaites = e.lecons.every(function(a){ return progress[a.n]; });
    const ici = idx === etapeCourante;
    const premiereAccessible = e.lecons.find(function(a){ return isUnlocked(a.n); });
    const classe = toutesFaites ? 'faite' : (ici ? 'ici' : '');
    const borne = toutesFaites ? COCHE : String(idx + 1);
    const cible = premiereAccessible ? premiereAccessible.n : e.lecons[0].n;

    html += '<div class="etape-i ' + classe + '">' +
      '<span class="borne">' + borne + '</span>' +
      '<button class="etape-titre" onclick="goTo(' + cible + ')">' + e.nom + '</button>' +
      '<div class="etape-meta">' + e.lecons.length + ' leçon' + (e.lecons.length > 1 ? 's' : '') + '</div>';

    /* On ne deroule que l'etape ou l'on se trouve : la carte reste lisible. */
    if(ici){
      html += '<div class="arrets">';
      e.lecons.forEach(function(a){
        const fait = !!progress[a.n];
        const ouvert = isUnlocked(a.n);
        const cl = (a.n === current ? 'ici ' : '') + (fait ? 'faite ' : '') + (ouvert ? '' : 'bloque');
        html += '<div class="arret ' + cl + '" onclick="goTo(' + a.n + ')">' +
          '<span class="puce">' + COCHE + '</span><span>' + a.titre + '</span></div>';
      });
      html += '</div>';
    }
    html += '</div>';
  });

  html += '</div>' + escaleHtml() + '</div>';
  document.getElementById('sidebar').innerHTML = html;
}

    h += '<a href="' + p.page + '" class="' + (courante ? 'courante' : 'prete') + '">' +
      '<span class="jeton"></span><span>' + p.nom + '</span></a>';

function goTo(n){
  if(!isUnlocked(n)){
    alert('Termine la leçon précédente pour débloquer celle-ci.');
    return;
  }
  current = n;
  history.replaceState(null, '', '?l=' + n);
  render();
  window.scrollTo(0,0);
}

let quizState = {};

function allQuizCorrect(l){
  for(let i=0;i<l.quiz.length;i++){ if(!quizState[i]) return false; }
  return true;
}

  const l = LESSONS[current-1];

    });
    quizHtml += '<div class="quiz-card"><div class="quiz-q">Question ' + (qi+1) + '. ' + q.q + '</div>' + optsHtml +
      '<div class="quiz-explain ' + (done?'show':'') + '" id="exp' + qi + '"><strong>Explication : </strong>' + q.explain + '</div></div>';
  });

  const quizOk = allQuizCorrect(l);
  const actionCardStyle = (!quizOk && !done) ? 'opacity:.5;pointer-events:none;' : '';

  main.innerHTML =
    (done ? '<div class="completion-badge show">✓ Leçon terminée</div>' : '') +
    '<div class="lesson-eyebrow">' + l.module + '</div>' +
    '<div class="lesson-title">' + (current) + '. ' + l.title + '</div>' +
    '<div class="lesson-meta">' + l.duration + ' de lecture · Leçon ' + current + ' sur ' + LESSONS.length + '</div>' +
    '<div class="section-label"><span class="dot"></span>Comprendre</div>' +
    '<div class="script-text">' + l.script.map(function(p){
      return p.indexOf('<figure') === 0 ? p : '<p>' + p + '</p>';
    }).join('') + '</div>' +
    '<div class="section-label quiz"><span class="dot"></span>Vérifier</div>' +
    quizHtml +
    '<div class="section-label action"><span class="dot"></span>Petite action</div>' +
    (!quizOk && !done ? '<div style="font-size:12.5px;font-weight:600;color:var(--coral);margin-bottom:10px;">Réponds correctement aux ' + l.quiz.length + ' questions pour débloquer cette action.</div>' : '') +
    '<div class="action-card" id="actionCard" style="' + actionCardStyle + '">' +
      '<div class="action-text">' + l.action + '</div>' +
      '<div class="action-check" onclick="toggleAction()"><span class="action-box ' + (done?'checked':'') + '" id="actionBox">' + (done?'✓':'') + '</span><span class="action-label">Marquer cette leçon comme terminée</span></div>' +
    '</div>' +
    '<div class="lesson-nav">' +
      (current > 1 ? '<button class="nav-btn ghost" onclick="goTo(' + (current-1) + ')">← Leçon précédente</button>' : '<span></span>') +
      (current < LESSONS.length ? '<button class="nav-btn" onclick="goTo(' + (current+1) + ')">Leçon suivante →</button>' : '<a href="budget.html" class="nav-btn">Terminer le parcours →</a>') +
    '</div>';
}

function answerQuiz(qi, oi, correct){
  if(quizState[qi]) return; // déjà répondu correctement, verrouillé
  const chosen = document.getElementById('q'+qi+'o'+oi);
  if(chosen.classList.contains('disabled')) return;

  if(oi === correct){
    for(let k=0;k<10;k++){
      const el = document.getElementById('q'+qi+'o'+k);
      if(el){ el.classList.add('disabled'); }
    }
    chosen.classList.add('correct');
    quizState[qi] = true;
    document.getElementById('exp'+qi).classList.add('show');
    const l = LESSONS[current-1];
    const quizOk = allQuizCorrect(l);
    const card = document.getElementById('actionCard');
    if(quizOk && card){
      card.style.opacity = '';
      card.style.pointerEvents = '';
      const lock = card.previousElementSibling;
      if(lock && lock.textContent.indexOf('Réponds correctement') !== -1){ lock.style.display = 'none'; }
    }
  } else {
    chosen.classList.add('wrong');
    document.getElementById('exp'+qi).classList.add('show');
    setTimeout(function(){ chosen.classList.remove('wrong'); }, 900);
  }
}

async function toggleAction(){
  const l = LESSONS[current-1];
  const progress = getProgress();
  const newValue = !progress[current];
  if(newValue && !allQuizCorrect(l)){
    alert('Réponds correctement à toutes les questions du quiz avant de valider cette leçon.');
    return;
  }
  await setProgressServer(current, newValue);
  render();

  /* La formation vient-elle de s'achever ? Si oui, on plante la borne.
     On ne la montre qu'au moment du basculement, jamais en revenant
     sur une leçon déjà validée. */
  if(newValue) verifierFinDeParcours();
}

async function verifierFinDeParcours(){
  const progress = getProgress();
  const faites = Object.keys(progress).filter(function(k){ return progress[k]; }).length;
  if(faites < LESSONS.length) return;

  let prenom = '';
  let semaines = 1;
  try {
    const { data } = await sb.from('profiles').select('prenom').eq('id', CURRENT_USER.id).maybeSingle();
    if(data && data.prenom) prenom = data.prenom;

    const { data: dates } = await sb.from('lesson_progress')
      .select('completed_at').eq('user_id', CURRENT_USER.id).eq('formation', FORMATION)
      .not('completed_at', 'is', null).order('completed_at', { ascending: true }).limit(1);
    if(dates && dates.length){
      const debut = new Date(dates[0].completed_at).getTime();
      semaines = Math.max(1, Math.round((Date.now() - debut) / (7*24*3600*1000)));
    }
  } catch(e){ console.warn('Carte : données partielles', e); }

  ouvrirCarte(FORMATION, LESSONS.length, prenom, semaines);
}

async function boot(){
  document.getElementById('main').innerHTML = '<div style="padding:60px 0;text-align:center;color:var(--ink-faint);font-size:14px;">Chargement de ta progression…</div>';
  const user = await requireAuth();
  if(!user) return;
  const unlocked = await requireUnlock(user.id);
  if(!unlocked) return;
  CURRENT_USER = user;
  await loadProgressFromServer();

  if(!isUnlocked(current)){
    let lastUnlocked = 1;
    for(let i=1;i<=LESSONS.length;i++){ if(isUnlocked(i)) lastUnlocked = i; else break; }
    current = lastUnlocked;
    history.replaceState(null, '', '?l=' + current);
  }
  render();
}
boot();
</script>
