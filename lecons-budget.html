<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --ink:#171C45;--ink-soft:#44496B;--ink-muted:#6B7094;--ink-faint:#9599B5;
  --bg:#FFFFFF;--bg-soft:#F6F7FB;--bg-mid:#F0F1F7;--bg-line:#DCDEEA;
  --green:#2B3A8F;--green-light:#3B4BA8;--green-pale:#E9EBF7;--green-bord:#C5CAEB;
  --amber:#C27C00;--amber-pale:#FDF2DA;--amber-bord:#F0D49A;
  --violet:#4D5675;--violet-pale:#EEF0F5;--violet-bord:#D5D9E6;
  --coral:#A3213D;--coral-pale:#FAEAEE;
  --sans:'Archivo',system-ui,-apple-system,sans-serif;
  --display:'Archivo',system-ui,sans-serif;
  --mono:'Archivo',system-ui,sans-serif;
}
body{font-family:var(--sans);background:var(--bg-soft);color:var(--ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;}
a{color:inherit;}

.nav{position:sticky;top:0;z-index:200;background:rgba(255,255,255,.96);backdrop-filter:blur(20px);border-bottom:1px solid var(--bg-line);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;font-weight:800;font-size:15px;color:var(--ink);}
.nav-mark{width:26px;height:26px;border-radius:8px;background:var(--green);display:flex;align-items:center;justify-content:center;}
.nav-mark svg{width:14px;height:14px;}
.nav-back{font-size:13px;font-weight:600;color:var(--ink-muted);text-decoration:none;}
.nav-progress-pill{font-size:12px;font-weight:700;color:var(--green);background:var(--green-pale);padding:5px 12px;border-radius:100px;}

.layout{display:grid;grid-template-columns:280px 1fr;max-width:1100px;margin:0 auto;min-height:calc(100vh - 60px);}
.sidebar{border-right:1px solid var(--bg-line);background:var(--bg);padding:24px 16px;position:sticky;top:60px;align-self:start;height:calc(100vh - 60px);overflow-y:auto;}
.sb-progress-bar{height:6px;background:var(--bg-mid);border-radius:100px;overflow:hidden;margin:0 10px 18px;}
.sb-progress-fill{height:100%;background:var(--green);border-radius:100px;transition:width .3s;}
.sb-item{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:10px;cursor:pointer;margin-bottom:2px;font-size:13px;font-weight:600;color:var(--ink-muted);transition:background .15s;}
.sb-item:hover{background:var(--bg-soft);}
.sb-item.active{background:var(--green-pale);color:var(--green);}
.sb-item.done{color:var(--ink);}
.sb-item.locked{opacity:.45;cursor:not-allowed;}
.sb-item.locked:hover{background:transparent;}
.sb-check{width:20px;height:20px;border-radius:50%;background:var(--bg-mid);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink-faint);flex-shrink:0;}
.sb-item.done .sb-check{background:var(--green);color:#fff;}
.sb-item.active .sb-check{background:var(--green);color:#fff;}
.sb-module-label{font-size:13.5px;font-weight:700;color:var(--ink-faint);text-transform:none;letter-spacing:0;padding:14px 10px 6px;}

.main{padding:36px 40px 80px;max-width:720px;}
.lesson-eyebrow{font-size:13.5px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--green);margin-bottom:10px;}
.lesson-title{font-size:28px;font-weight:800;letter-spacing:-.03em;color:var(--ink);margin-bottom:8px;line-height:1.15;}
.lesson-meta{font-size:13px;color:var(--ink-faint);margin-bottom:32px;}

.section-label{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:800;letter-spacing:0;text-transform:none;color:var(--ink-muted);margin:36px 0 16px;}
.section-label .dot{width:6px;height:6px;border-radius:50%;background:var(--green);}
.section-label.quiz .dot{background:var(--violet);}
.section-label.action .dot{background:var(--amber);}

.script-text p{font-size:15.5px;font-weight:400;color:var(--ink-soft);line-height:1.75;margin-bottom:18px;}

.quiz-card{background:var(--bg);border:1px solid var(--bg-line);border-radius:16px;padding:24px;margin-bottom:14px;}
.quiz-q{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:16px;line-height:1.5;}
.quiz-opt{display:flex;align-items:flex-start;gap:12px;padding:13px 15px;border:1.5px solid var(--bg-line);border-radius:11px;margin-bottom:9px;cursor:pointer;transition:border-color .15s,background .15s;}
.quiz-opt:hover{border-color:var(--ink-faint);}
.quiz-opt.correct{border-color:var(--green);background:var(--green-pale);}
.quiz-opt.wrong{border-color:var(--coral);background:var(--coral-pale);}
.quiz-opt.disabled{cursor:default;pointer-events:none;}
.quiz-letter{width:24px;height:24px;border-radius:7px;background:var(--bg-soft);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--ink-muted);flex-shrink:0;}
.quiz-opt.correct .quiz-letter{background:var(--green);color:#fff;}
.quiz-opt.wrong .quiz-letter{background:var(--coral);color:#fff;}
.quiz-opt-text{font-size:13.5px;font-weight:500;color:var(--ink);padding-top:2px;}
.quiz-explain{display:none;font-size:13px;font-weight:400;color:var(--ink-muted);line-height:1.6;background:var(--bg-soft);border-radius:10px;padding:14px 16px;margin-top:8px;}
.quiz-explain.show{display:block;}
.quiz-explain strong{color:var(--ink);}

.action-card{background:var(--amber-pale);border:1px solid var(--amber-bord);border-radius:16px;padding:22px 24px;}
.action-text{font-size:14.5px;font-weight:500;color:var(--ink);line-height:1.65;margin-bottom:16px;}
.action-check{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;}
.action-box{width:22px;height:22px;border-radius:7px;border:2px solid var(--amber);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;transition:background .15s;}
.action-box.checked{background:var(--amber);}
.action-label{font-size:13px;font-weight:700;color:#8a6a00;}

.lesson-nav{display:flex;justify-content:space-between;align-items:center;margin-top:40px;padding-top:24px;border-top:1px solid var(--bg-line);}
.nav-btn{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border:none;cursor:pointer;font-family:var(--sans);font-size:14px;font-weight:700;padding:13px 24px;border-radius:11px;text-decoration:none;transition:background .2s;}
.nav-btn:hover{background:var(--ink-soft);}
.nav-btn.ghost{background:var(--bg-mid);color:var(--ink-muted);}
.nav-btn.ghost:hover{background:var(--bg-line);}
.completion-badge{display:none;align-items:center;gap:8px;background:var(--green-pale);color:var(--green);font-size:12.5px;font-weight:700;padding:8px 16px;border-radius:100px;margin-bottom:20px;}
.completion-badge.show{display:inline-flex;}

@media(max-width:860px){
  .layout{grid-template-columns:1fr;}
  .sidebar{position:static;height:auto;border-right:none;border-bottom:1px solid var(--bg-line);}
  .main{padding:28px 20px 60px;}
}

/* ===== Direction Encre & Laiton — surcouche typographique ===== */
body{font-family:var(--sans);letter-spacing:0;}
h1,h2,h3,h4,.hero-h1,.s-title,.cta-h2,.p-name,.mod-title,.c-title,.hc-title,
.lecon-title,.q-title,.auth-title,.perf-title,.section-title,.edu-title,.tips-title{
  font-family:var(--display);letter-spacing:-.015em;
}
.hero-h1,.s-title,.cta-h2,.auth-title{font-weight:500;letter-spacing:-.018em;line-height:1.16;}
h3,h4,.p-name,.mod-title,.c-title,.hc-title,.lecon-title{font-weight:600;}
.s-tag,.f-copy,.hstat-label,.stat-label,.perf-note,.order-meta,.pos-value,
.price-cell,.asset-label,.badge,.eyebrow,.nav-balance{font-family:var(--mono);}

.nav-name em,.ft-name em{font-style:normal;color:var(--amber);}

/* Mise en valeur dans le corps des lecons : le gras porte la notion a
   retenir, l italique la nuance ou le terme technique. */
.script-text strong{color:var(--ink,#171C45);font-weight:700;}
.script-text em{font-style:italic;color:var(--ink-soft,#44496B);}
.script-text u{text-decoration:none;background:linear-gradient(transparent 62%,var(--amber-pale,#FDF2DA) 62%);
  box-shadow:inset 0 -1px 0 var(--amber,#C27C00);}
.script-text p + p{margin-top:14px;}

/* ===== L'itineraire =====
   Une route verticale plutot qu'une liste : on voit d'ou l'on vient,
   ou l'on est, et ce qu'il reste. Meme vocabulaire graphique que le
   carnet de route et les emblemes. */
.itin{padding:4px 4px 24px;}
.itin-tete{padding:0 8px 16px;border-bottom:1px solid var(--bg-line);margin-bottom:16px;}
.itin-formation{font-family:var(--display);font-size:16px;font-weight:600;color:var(--ink);line-height:1.25;}
.itin-compte{font-family:var(--mono);font-size:13.5px;letter-spacing:0;text-transform:none;
  color:var(--ink-muted);margin-top:7px;}
.itin-barre{height:4px;background:var(--bg-mid);border-radius:100px;overflow:hidden;margin-top:10px;}
.itin-barre span{display:block;height:100%;background:var(--amber);border-radius:100px;transition:width .4s cubic-bezier(.4,0,.2,1);}

/* La route */
.route{position:relative;padding-left:30px;}
.route::before{content:"";position:absolute;left:11px;top:14px;bottom:14px;width:2px;
  background:repeating-linear-gradient(var(--bg-line) 0 6px, transparent 6px 11px);}
.etape-i{position:relative;margin-bottom:6px;}
.borne{position:absolute;left:-30px;top:6px;width:24px;height:24px;border-radius:50%;
  background:var(--bg);border:2px solid var(--bg-line);display:grid;place-items:center;
  font-family:var(--mono);font-size:10px;color:var(--ink-faint);z-index:1;transition:all .2s;}
.borne svg{width:11px;height:11px;}
.etape-i.faite .borne{background:var(--amber);border-color:var(--amber);color:#fff;}
.etape-i.ici .borne{background:var(--green);border-color:var(--green);color:#fff;
  box-shadow:0 0 0 4px var(--green-pale);}
.etape-titre{display:block;width:100%;text-align:left;background:transparent;border:0;cursor:pointer;
  font-family:var(--display);font-size:14.5px;font-weight:600;color:var(--ink-soft);
  padding:7px 9px;border-radius:9px;line-height:1.3;transition:background .15s,color .15s;}
.etape-titre:hover{background:var(--bg-soft);color:var(--ink);}
.etape-i.ici .etape-titre{color:var(--green);}
.etape-i.faite .etape-titre{color:var(--ink);}
.etape-meta{font-family:var(--mono);font-size:10px;color:var(--ink-faint);padding:0 9px 4px;letter-spacing:.06em;}

/* Les lecons de l'etape en cours */
.arrets{margin:2px 0 12px;padding-left:9px;border-left:1px solid var(--bg-line);}
.arret{display:flex;align-items:flex-start;gap:9px;padding:7px 9px;border-radius:8px;cursor:pointer;
  font-size:12.8px;font-weight:500;color:var(--ink-muted);transition:background .15s;line-height:1.35;}
.arret:hover{background:var(--bg-soft);color:var(--ink);}
.arret.ici{background:var(--green-pale);color:var(--green);font-weight:700;}
.arret.faite{color:var(--ink);}
.arret.bloque{opacity:.42;cursor:not-allowed;}
.arret.bloque:hover{background:transparent;}
.puce{width:15px;height:15px;border-radius:4px;flex:none;margin-top:1px;border:1.5px solid var(--bg-line);
  display:grid;place-items:center;background:var(--bg);}
.puce svg{width:9px;height:9px;opacity:0;}
.arret.faite .puce{background:var(--amber);border-color:var(--amber);}
.arret.faite .puce svg{opacity:1;}
.arret.ici .puce{border-color:var(--green);border-style:dashed;}

/* Changer de formation sans repasser par le menu */
.escale{margin-top:22px;padding-top:16px;border-top:1px solid var(--bg-line);}
.escale-titre{font-family:var(--mono);font-size:13.5px;letter-spacing:0;text-transform:none;
  color:var(--ink-faint);padding:0 9px 9px;}
.escale a{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;text-decoration:none;
  font-size:12.8px;color:var(--ink-soft);transition:background .15s;}
.escale a:hover{background:var(--bg-soft);color:var(--ink);}
.escale a.courante{background:var(--green-pale);color:var(--green);font-weight:700;}
.jeton{width:7px;height:7px;border-radius:50%;background:var(--bg-line);flex:none;}
.escale a.courante .jeton{background:var(--green);}
.escale a.prete .jeton{background:var(--amber);}

@media(max-width:860px){
  .itin{padding-bottom:8px;}
  .route{padding-left:26px;}
  .borne{left:-26px;}
}
@media(prefers-reduced-motion:reduce){*{transition:none !important;}}

/* ===== Schemas des lecons ===== */
.schema{margin:26px 0;padding:20px 18px 14px;border:1px solid var(--bg-line,#DCDEEA);
  border-radius:12px;background:var(--bg,#FFFFFF);}
.schema svg{width:100%;height:auto;display:block;}
.schema figcaption{font-family:var(--mono,'Archivo',sans-serif);font-size:11.5px;line-height:1.55;
  color:var(--ink-muted,#6B7094);margin-top:14px;padding-top:12px;
  border-top:1px solid var(--bg-line,#DCDEEA);}
@media(max-width:620px){.schema{padding:14px 12px 10px;margin:20px -6px;}}

.script-text strong{color:var(--ink,#171C45);font-weight:700;}
.script-text em{font-style:italic;color:var(--ink-soft,#44496B);}
.script-text u{text-decoration:none;background:linear-gradient(transparent 62%,var(--amber-pale,#FDF2DA) 62%);
  box-shadow:inset 0 -1px 0 var(--amber,#C27C00);}
.script-text p + p{margin-top:14px;}

/* Sortie de leçon : on peut toujours s'arrêter sans se sentir coincé. */
.lesson-sortie{display:flex;flex-wrap:wrap;align-items:center;gap:9px;justify-content:center;
  margin-top:24px;padding-top:18px;border-top:1px solid var(--bg-line);
  font-size:13.5px;color:var(--ink-faint);}
.lesson-sortie a{color:var(--ink-muted);text-decoration:none;font-weight:600;}
.lesson-sortie a:hover{color:var(--green);}
</style>

<script>
/* ============ DONNÉES DES 16 LEÇONS — MAÎTRISER SON BUDGET ============ */
const LESSONS = [
{module:"Module 1 — Faire le diagnostic", title:"Où va vraiment ton argent", duration:"5 min",
script:[
"Presque tout le monde croit savoir où part son argent. Presque personne ne le sait vraiment. Ce n'est pas un problème de mémoire. <strong>On se souvient des grosses dépenses et on oublie les petites.</strong> Or ce sont les petites, répétées, qui font la plus grosse différence.",
"Fais un test simple. Écris de mémoire ce que tu as dépensé le mois dernier, poste par poste. Puis ouvre tes relevés et compare. <u>En moyenne, l'écart est de 20 à 30 %.</u> Et presque toujours dans le même sens : on pense dépenser moins que la réalité.",
"Trois raisons expliquent cet écart. <strong>1. Les prélèvements automatiques sont invisibles.</strong> L'argent part sans que tu fasses un geste, donc tu ne t'en souviens pas. Et c'est le cas de la plupart de tes charges. <strong>2. Le paiement sans contact ne fait pas mal.</strong> Payer en billets, on le sent. Poser sa carte, on ne sent rien. <strong>3. On ne compte pas les petites sommes.</strong> Un café à 2 €, 5 fois par semaine, c'est 43 € par mois. Plus de 500 € par an. Personne n'a l'impression de dépenser 500 € en café.",
"Le but n'est pas de te faire culpabiliser. <strong>Le but est de reprendre la main.</strong> Une dépense que tu connais devient un choix. Une dépense que tu ignores reste une fuite.",
"La méthode de ce module tient en 3 étapes. D'abord, observer un mois complet sans rien changer. C'est plus dur qu'on ne croit. Ensuite, trier : ce que tu subis d'un côté, ce que tu choisis de l'autre. Enfin, reconstruire ton budget avec de vrais chiffres, pas des estimations.",
"Une seule consigne pendant ce mois : <strong>note chaque dépense le jour même.</strong> Si tu fais le point de mémoire le dimanche soir, tu refais exactement l'erreur qu'on veut corriger.",
"Prépare-toi à être surpris. La plupart des gens découvrent que leur problème n'est pas là où ils pensaient. Certains croyaient trop dépenser en sorties, et ce sont leurs charges fixes qui sont trop lourdes. D'autres accusaient leur loyer, et trouvent des abonnements oubliés. <u>Le diagnostic change presque toujours la donne.</u> C'est pour ça qu'il faut le faire avant de décider quoi que ce soit."
],
quiz:[
{q:"En moyenne, de combien se trompe-t-on sur ses dépenses ?",opts:["Moins de 5 %","20 à 30 %","50 %","On ne se trompe pas"],correct:1,
explain:"Et presque toujours dans le même sens : on pense dépenser moins que la réalité."},
{q:"Pourquoi oublie-t-on les prélèvements automatiques ?",opts:["Parce qu'ils sont trop petits","Parce qu'ils partent sans geste de notre part","Parce que la banque les cache","Parce qu'ils sont mensuels"],correct:1,
explain:"Pourtant, ce sont eux qui représentent la plupart des charges d'un foyer."},
{q:"À quoi sert le diagnostic ?",opts:["À culpabiliser","À transformer des fuites en choix","À diviser ses dépenses par 2","À préparer sa déclaration d'impôts"],correct:1,
explain:"Une dépense connue devient un choix. Une dépense ignorée reste une fuite."}
],
action:"Ce soir, sans regarder tes comptes, écris ce que tu penses avoir dépensé le mois dernier dans 5 catégories. Range la feuille. Tu la compareras à la réalité dans 3 leçons. L'écart sera ton vrai point de départ."
},
{module:"Module 1 — Faire le diagnostic", title:"Dépenses fixes et dépenses variables", duration:"5 min",
script:[
"Toutes les dépenses ne se ressemblent pas. Les traiter de la même façon, c'est l'erreur qui rend la plupart des budgets inutiles. Voici la différence clé : <strong>certaines dépenses se décident une fois et reviennent chaque mois. D'autres se décident à chaque fois.</strong>",
"<strong>Les charges fixes</strong>, tu les paies quoi qu'il arrive : loyer ou crédit, énergie, assurances, transport, abonnements, remboursements. Leur point commun : <u>tu les choisis une fois, puis tu les paies chaque mois pendant des années.</u>",
"<strong>Les dépenses variables</strong> dépendent de tes choix de tous les jours : courses, sorties, vêtements, loisirs, imprévus. On les voit, on les sent. Alors on les surveille. Pourtant, elles pèsent souvent moins lourd.",
"<figure class=\"schema\"><svg viewBox=\"0 0 700 228\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"200\" y=\"20\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" letter-spacing=\"1.4\" fill=\"#2B3A8F\">CHARGES FIXES</text><text x=\"560\" y=\"20\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" letter-spacing=\"1.4\" fill=\"#C27C00\">DÉPENSES VARIABLES</text><text x=\"20\" y=\"44\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">Effort à fournir</text><rect x=\"20\" y=\"54\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#F0F1F7\"/><rect x=\"20\" y=\"54\" width=\"495\" height=\"18\" rx=\"5\" fill=\"#E9EBF7\"/><rect x=\"515\" y=\"54\" width=\"165\" height=\"18\" rx=\"5\" fill=\"#FDF2DA\"/><text x=\"28\" y=\"67\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#2B3A8F\">une seule fois</text><text x=\"672\" y=\"67\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8F5F00\">chaque jour</text><text x=\"20\" y=\"100\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">Gain obtenu</text><rect x=\"20\" y=\"110\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#F0F1F7\"/><rect x=\"20\" y=\"110\" width=\"528\" height=\"18\" rx=\"5\" fill=\"#E9EBF7\"/><rect x=\"548\" y=\"110\" width=\"132\" height=\"18\" rx=\"5\" fill=\"#FDF2DA\"/><text x=\"28\" y=\"123\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#2B3A8F\">répété chaque mois</text><text x=\"672\" y=\"123\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8F5F00\">ponctuel</text><text x=\"20\" y=\"156\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">Résiste à la fatigue</text><rect x=\"20\" y=\"166\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#F0F1F7\"/><rect x=\"20\" y=\"166\" width=\"561\" height=\"18\" rx=\"5\" fill=\"#E9EBF7\"/><rect x=\"581\" y=\"166\" width=\"99\" height=\"18\" rx=\"5\" fill=\"#FDF2DA\"/><text x=\"28\" y=\"179\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#2B3A8F\">oui</text><text x=\"672\" y=\"179\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8F5F00\">non</text></svg><figcaption>Un budget qui tient s'attaque d'abord à la structure des charges, pas à la volonté quotidienne.</figcaption></figure>",
"Cette différence change tout. <strong>Baisser une charge fixe demande un effort une seule fois, et ça rapporte chaque mois.</strong> Renégocier une assurance pour payer 15 € de moins prend 1 heure. Ça rapporte 180 € par an, tous les ans, sans y repenser. <strong>Baisser une dépense variable demande un effort tous les jours.</strong> Et cet effort finit toujours par lâcher.",
"C'est pour ça que la plupart des budgets échouent. Ils visent les dépenses variables, donc ils comptent sur la volonté. Et la volonté s'épuise. Un budget qui tient commence par les charges fixes, pas par les habitudes.",
"Attention à un cas à part : les dépenses <em>irrégulières</em>. Elles reviennent chaque année, mais pas chaque mois. Assurance annuelle, impôts, rentrée scolaire, entretien de la voiture, cadeaux de fin d'année. <strong>Ce sont elles qui causent le plus de découverts.</strong> Elles n'apparaissent dans aucun budget mensuel et tombent toujours au mauvais moment.",
"La solution est simple. Additionne ces dépenses de l'année et divise par 12. Mets ce montant de côté chaque mois sur un compte séparé. Une taxe foncière de 900 € ne pose plus de problème si tu as mis 75 € de côté chaque mois pendant un an."
],
quiz:[
{q:"Qu'est-ce qui caractérise une charge fixe ?",opts:["Elle est toujours élevée","On la choisit une fois et on la paie chaque mois pendant des années","On ne peut pas la baisser","Elle change selon la saison"],correct:1,
explain:"C'est pour ça qu'il est si rentable de la baisser : un seul effort, un gain chaque mois."},
{q:"Pourquoi la plupart des budgets échouent-ils ?",opts:["Parce qu'ils sont trop précis","Parce qu'ils visent les dépenses variables, donc la volonté","Parce que les revenus sont trop faibles","Parce qu'ils sont mensuels"],correct:1,
explain:"La volonté s'épuise. Un budget qui tient commence par les charges fixes."},
{q:"Qu'est-ce qui cause le plus de découverts ?",opts:["Les courses","Les dépenses irrégulières ou annuelles","Les loisirs","Le loyer"],correct:1,
explain:"Elles n'apparaissent dans aucun budget mensuel. La solution : mettre de côté 1/12 chaque mois."}
],
action:"Ce soir, liste tes dépenses annuelles ou irrégulières : impôts, assurances, rentrée, entretien, fêtes. Additionne et divise par 12. C'est ce que tu devrais mettre de côté chaque mois. Ce chiffre explique sans doute tes fins de mois difficiles."
},
{module:"Module 1 — Faire le diagnostic", title:"Repérer les fuites invisibles", duration:"5 min",
script:[
"Les fuites invisibles sont des dépenses régulières qui ne t'apportent plus rien. Ce n'est pas du gaspillage ni un manque de discipline. C'est de l'oubli. Et ça se règle en une seule fois.",
"<strong>Fuite 1 : les abonnements oubliés.</strong> Streaming, applis, salle de sport, essais gratuits jamais résiliés. En moyenne, les gens qui font ce tri retrouvent 30 à 80 € par mois. La méthode : reprends tes 3 derniers relevés et surligne chaque ligne qui revient à l'identique.",
"<strong>Fuite 2 : les frais bancaires.</strong> Tenue de compte, cotisation carte, assurance des moyens de paiement (rarement utile), frais en cas de découvert. Ces derniers sont plafonnés par la loi. Mais ils peuvent atteindre plusieurs dizaines d'euros par mois si tu es souvent à découvert. <u>C'est là que l'écart entre une banque classique et une banque en ligne est le plus grand.</u> On parle de centaines d'euros par an.",
"<strong>Fuite 3 : les assurances en double.</strong> Beaucoup de gens paient 2 fois la même chose sans le savoir. Une assurance téléphone alors que la carte bancaire couvre déjà l'appareil. Une assurance voyage déjà incluse. Une protection juridique déjà dans le contrat habitation. Vérifier prend 30 minutes.",
"<strong>Fuite 4 : les contrats jamais renégociés.</strong> Assurance auto, habitation, mutuelle, forfait mobile, énergie. Leurs prix montent un peu chaque année, sans bruit. Être fidèle ne rapporte rien. Après un an, résilier une assurance auto ou habitation est devenu simple. Changer de forfait ou de fournisseur d'énergie prend quelques minutes.",
"<strong>Fuite 5 : les petits achats trop faciles.</strong> Achats en un clic, applis qui gardent ta carte, livraisons express payantes. Le meilleur remède n'est pas la volonté. C'est de rendre l'achat moins facile : <strong>supprime tes cartes enregistrées.</strong> Devoir aller chercher ton portefeuille suffit à éviter beaucoup d'achats sur un coup de tête.",
"Pour te motiver : <strong>2 heures passées sur ces 5 fuites permettent souvent de récupérer 50 à 150 € par mois.</strong> C'est comme une augmentation, sans rien négocier et sans changer ta façon de vivre."
],
quiz:[
{q:"Comment repérer les abonnements oubliés ?",opts:["En listant ses applis","En surlignant sur 3 relevés les lignes qui reviennent à l'identique","En appelant sa banque","En lisant ses mails"],correct:1,
explain:"Un même montant qui revient chaque mois, c'est la marque d'un abonnement. Même ceux qu'on a oubliés."},
{q:"Quel est le meilleur remède aux achats en ligne sur un coup de tête ?",opts:["Se fixer un budget","Supprimer ses cartes enregistrées","Désinstaller les applis","Payer seulement en espèces"],correct:1,
explain:"Rendre l'achat moins facile marche mieux que la volonté."},
{q:"Combien récupère-t-on souvent avec 2 heures sur ces 5 fuites ?",opts:["5 à 10 € par mois","50 à 150 € par mois","300 € par mois","Rien d'important"],correct:1,
explain:"C'est comme une augmentation, sans rien négocier et sans changer sa façon de vivre."}
],
action:"Ouvre tes 3 derniers relevés. Surligne chaque ligne qui revient à l'identique. Ne résilie rien ce soir. Additionne seulement ce que tu ne sais pas justifier. Ce chiffre va te motiver pour la suite."
},
{module:"Module 1 — Faire le diagnostic", title:"Ton bilan financier personnel", duration:"5 min",
script:[
"Le bilan, c'est une photo de ta situation à un moment donné. Il tient sur une page. Pourtant, très peu de gens en ont déjà fait un. Il répond à une question que ton solde bancaire ne dit pas : <strong>que possèdes-tu vraiment, une fois tes dettes retirées ?</strong>",
"Il se fait en 2 colonnes. <strong>À gauche, ce que tu possèdes :</strong> comptes, livrets, épargne, valeur d'un logement, valeur d'une voiture, placements. <strong>À droite, ce que tu dois :</strong> ce qu'il reste à rembourser sur tes crédits, découvert, argent dû à des proches, factures impayées.",
"La différence entre les 2 colonnes, c'est ton <strong>patrimoine net</strong>. C'est le seul chiffre qui dit vraiment où tu en es. Il peut être négatif. C'est très courant chez les jeunes actifs et chez ceux qui viennent d'acheter un logement à crédit. <u>Un patrimoine net négatif n'est pas un échec. C'est une étape.</u>",
"Ce qui compte, ce n'est pas le chiffre d'aujourd'hui. <strong>C'est de le comparer d'une année sur l'autre.</strong> Si ton patrimoine net augmente de 3 000 € en un an, tu sais que tu construis quelque chose. Ni ton salaire ni ton solde ne te le diront.",
"Deux erreurs à éviter. Première erreur : surestimer ce que tu possèdes. Une voiture vaut ce que tu pourrais la revendre, pas ce que tu l'as payée. Un logement vaut ce que le marché en donne, pas ce que tu espères. Deuxième erreur : oublier des dettes. Pense aux crédits à la consommation en cours. Et à l'argent emprunté à des proches : c'est une dette, même sans papier.",
"Ajoute 3 chiffres simples. <strong>Ton taux d'endettement</strong> : tes mensualités de crédit divisées par tes revenus. Le repère courant est autour de 35 %. <strong>Ton taux d'épargne</strong> : ce que tu mets de côté divisé par tes revenus. <strong>Ton fonds d'urgence en mois de charges</strong> : combien de temps tu tiendrais sans revenu.",
"Ces 4 chiffres forment ton tableau de bord. Il faut 30 minutes la première fois, 10 minutes ensuite. <strong>Refais-le une fois par an, toujours à la même date.</strong> Dans 5 ans, tu verras ton évolution. Presque personne autour de toi ne peut en dire autant."
],
quiz:[
{q:"Comment calcule-t-on le patrimoine net ?",opts:["Revenus moins dépenses","Ce que tu possèdes moins ce que tu dois","Épargne plus salaire de l'année","Le solde de tous tes comptes"],correct:1,
explain:"C'est le seul chiffre qui dit vraiment où tu en es. Il est souvent négatif au début."},
{q:"Un patrimoine net négatif, est-ce un échec ?",opts:["Oui, toujours","Non, c'est très courant chez les jeunes actifs et après un achat à crédit","Oui, sauf pour les étudiants","Ça dépend de la banque"],correct:1,
explain:"C'est une étape. Ce qui compte, c'est l'évolution d'une année sur l'autre."},
{q:"À quoi sert surtout le bilan ?",opts:["Au chiffre d'aujourd'hui","À comparer d'une année sur l'autre","À le montrer à sa banque","À calculer ses impôts"],correct:1,
explain:"Gagner 3 000 € de patrimoine en un an, ni le salaire ni le solde ne te le montrent."}
],
action:"Ce soir, fais ton bilan en 2 colonnes sur une seule page. Puis reprends ta feuille de la leçon 1 et compare avec la réalité. L'écart te montre exactement ce que tu ne savais pas il y a 4 leçons."
},
{module:"Module 2 — Structurer avec la règle 50/30/20", title:"La règle 50/30/20 expliquée", duration:"5 min",
script:[
"C'est le repère de budget le plus connu au monde. C'est aussi le plus mal utilisé. L'idée : partager ton revenu net en 3 parts. <strong>50 % pour les besoins, 30 % pour les envies, 20 % pour l'épargne et le remboursement des dettes.</strong>",
"<strong>Les besoins</strong>, ce sont les dépenses que tu paierais même sans emploi : logement, énergie, nourriture de base, transport, assurances, santé, remboursements minimum. <strong>Les envies</strong>, c'est tout ce qui rend la vie plus agréable sans être indispensable : restaurants, sorties, vêtements en plus, abonnements loisirs, voyages. <strong>La troisième part</strong> regroupe l'épargne, les placements et le remboursement anticipé des dettes.",
"Sa force, ce ne sont pas les pourcentages exacts. C'est sa simplicité. <u>3 catégories, on s'en souvient. 15 catégories, non.</u> Et un budget qu'on n'arrive pas à retenir finit abandonné.",
"<figure class=\"schema\"><svg viewBox=\"0 0 700 222\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"20\" y=\"138\" width=\"250\" height=\"52\" rx=\"9\" fill=\"#E9EBF7\" stroke=\"#2B3A8F\" stroke-width=\"1.4\"/><circle cx=\"46\" cy=\"164\" r=\"12\" fill=\"#2B3A8F\"/><text x=\"46\" y=\"168\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\" fill=\"#fff\">1</text><text x=\"70\" y=\"160\" font-family=\"Newsreader, Georgia, serif\" font-size=\"15\" font-weight=\"600\" fill=\"#171C45\">50 % : les besoins</text><text x=\"70\" y=\"177\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">Logement, énergie, alimentation, transport, assurances.</text><rect x=\"20\" y=\"74\" width=\"450\" height=\"52\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#DCDEEA\" stroke-width=\"1.4\"/><circle cx=\"46\" cy=\"100\" r=\"12\" fill=\"#DCDEEA\"/><text x=\"46\" y=\"104\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\" fill=\"#fff\">2</text><text x=\"70\" y=\"96\" font-family=\"Newsreader, Georgia, serif\" font-size=\"15\" font-weight=\"600\" fill=\"#171C45\">30 % : les envies</text><text x=\"70\" y=\"113\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">Sorties, loisirs, vêtements, voyages.</text><rect x=\"20\" y=\"10\" width=\"650\" height=\"52\" rx=\"9\" fill=\"#FDF2DA\" stroke=\"#C27C00\" stroke-width=\"1.4\"/><circle cx=\"46\" cy=\"36\" r=\"12\" fill=\"#C27C00\"/><text x=\"46\" y=\"40\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\" fill=\"#fff\">3</text><text x=\"70\" y=\"32\" font-family=\"Newsreader, Georgia, serif\" font-size=\"15\" font-weight=\"600\" fill=\"#171C45\">20 % : épargne et dettes</text><text x=\"70\" y=\"49\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">Le bloc à défendre en premier, jamais celui qu'on sacrifie.</text></svg><figcaption>Un repère, pas une norme. Ce qui compte est de mesurer ton écart avec lui, pas de l'atteindre à tout prix.</figcaption></figure>",
"Soyons honnêtes : en France, cette règle a des limites. Dans les grandes villes, le logement seul peut prendre 40 % du revenu. Rester sous 50 % de besoins devient impossible pour beaucoup. Avec un petit revenu, les besoins peuvent dépasser 70 %. Il ne reste alors presque rien à partager.",
"La règle reste utile, mais autrement. <strong>Ce n'est pas un objectif à atteindre. C'est une façon de mesurer l'écart.</strong> Savoir que tes besoins prennent 68 % au lieu de 50 %, c'est précieux. Tu sais où faire l'effort. Et tu comprends pourquoi épargner te paraît impossible.",
"Si 20 % te paraît hors de portée, commence plus bas : <strong>5 %</strong>. Puis ajoute 1 point tous les 6 mois. Épargner 5 % pendant 3 ans vaut bien mieux que viser 20 % et abandonner au deuxième mois.",
"Retiens surtout ceci : <strong>l'épargne doit être une ligne du budget, pas ce qui reste à la fin.</strong> Si tu attends qu'il reste quelque chose, il ne reste jamais rien."
],
quiz:[
{q:"Que contient la part des 20 % ?",opts:["Seulement les loisirs","L'épargne, les placements et le remboursement anticipé des dettes","Les impôts","Les charges fixes"],correct:1,
explain:"Rembourser plus tôt une dette chère rapporte à coup sûr. C'est pour ça qu'elle est dans cette part."},
{q:"Quelle est la vraie force de cette règle ?",opts:["Ses pourcentages précis","Sa simplicité : 3 catégories se retiennent, 15 non","Son origine universitaire","Elle convient à tous les revenus"],correct:1,
explain:"Un budget qu'on n'arrive pas à retenir finit abandonné."},
{q:"Que faire si tes besoins dépassent 50 % ?",opts:["Abandonner la règle","S'en servir pour mesurer l'écart, pas comme objectif","Manger moins","Emprunter la différence"],correct:1,
explain:"Savoir que tes besoins prennent 68 % te dit où faire l'effort, et pourquoi épargner semble impossible."}
],
action:"Calcule tes 3 pourcentages à partir du mois que tu viens d'observer. N'essaie pas de les corriger ce soir. Le but est juste de connaître ton écart avec le repère. C'est lui qui te dira par où commencer."
},
{module:"Module 2 — Structurer avec la règle 50/30/20", title:"Les enveloppes budgétaires", duration:"5 min",
script:[
"La méthode des enveloppes est sans doute la plus ancienne façon de tenir un budget. Elle reste la plus efficace. La raison tient plus à la psychologie qu'au calcul.",
"Le principe de départ : en début de mois, tu répartis ton argent liquide dans des enveloppes, une par poste. Quand une enveloppe est vide, tu ne dépenses plus dans cette catégorie. <strong>La limite se voit, se touche, et ne se discute pas.</strong>",
"Pourquoi c'est mieux qu'un tableau ? Parce que l'argent devient concret. <u>Ton solde ne te dit pas ce qui est déjà prévu ailleurs.</u> Une enveloppe vide, si. Tu ne te dis pas « je crois que j'ai dépassé ». Tu le vois.",
"Aujourd'hui, on fait la même chose avec des comptes plutôt qu'avec des billets. La plupart des banques en ligne permettent d'ouvrir plusieurs comptes gratuitement. 4 comptes suffisent. <strong>Un compte pour les charges fixes</strong> : ton salaire y arrive et tous les prélèvements en partent. <strong>Un compte pour les dépenses courantes</strong> : il reçoit un virement en début de mois, et ta carte y est reliée. <strong>Un compte pour les dépenses annuelles.</strong> <strong>Un compte d'épargne</strong>, à part, de préférence dans une autre banque.",
"Le plus grand avantage : <strong>la carte que tu utilises tous les jours n'a plus accès à tout ton argent.</strong> Elle n'a accès qu'à ton budget courant. Si tu dépasses, tu le vois tout de suite, sans rien calculer.",
"Deux conseils. <strong>Ne crée pas trop d'enveloppes.</strong> 4 comptes suffisent. Avec 8, tu t'y perdras et tu abandonneras. Et <strong>garde une enveloppe « divers »</strong> pour ce qui n'entre nulle part. Sans marge, le système casse au premier imprévu.",
"Tu préfères le liquide pour certaines dépenses, comme les courses ou les sorties ? Ce n'est pas démodé du tout. <strong>Payer en billets, on le sent passer.</strong> C'est exactement ce que le paiement sans contact a fait disparaître."
],
quiz:[
{q:"Pourquoi une enveloppe marche-t-elle mieux qu'un tableau ?",opts:["Elle est plus précise","La limite se voit et se touche","Elle évite les frais bancaires","Elle est plus rapide à remplir"],correct:1,
explain:"Ton solde ne dit pas ce qui est déjà prévu. Une enveloppe vide, si."},
{q:"Quel est le grand avantage d'un compte séparé pour les dépenses courantes ?",opts:["Il rapporte des intérêts","La carte de tous les jours n'a plus accès à tout ton argent","Il fait baisser les impôts","Il évite les prélèvements"],correct:1,
explain:"Si tu dépasses, tu le vois tout de suite, sans rien calculer."},
{q:"Combien d'enveloppes faut-il créer ?",opts:["Une par dépense","4 comptes suffisent, au-delà on s'y perd","Au moins 10","Une seule"],correct:1,
explain:"Un système trop détaillé finit abandonné. Garde aussi une enveloppe « divers » pour les imprévus."}
],
action:"Ce soir, ouvre un second compte gratuit, dans ta banque ou ailleurs. Il servira à tes dépenses courantes. Tu y feras un virement au début du mois prochain. C'est le geste le plus efficace de toute cette formation."
},
{module:"Module 2 — Structurer avec la règle 50/30/20", title:"Adapter la règle à ton revenu", duration:"5 min",
script:[
"La règle 50/30/20 a été pensée pour un revenu moyen. Il faut donc l'adapter. Voici des repères pour 4 situations très différentes.",
"<strong>Petit revenu : tes besoins dépassent 70 %.</strong> Ici, les pourcentages n'ont plus de sens. Dire le contraire serait malhonnête. Tes priorités sont ailleurs. Baisse une grosse charge fixe. Vérifie toutes les aides auxquelles tu as droit : très peu de gens le font vraiment. Et vise une première épargne de 1 000 €, sans date limite. <u>Dans cette situation, viser 20 % d'épargne ne fait que culpabiliser.</u>",
"<strong>Revenu moyen.</strong> C'est là que la règle marche le mieux. On l'ajuste souvent ainsi : 55 % pour les besoins, 25 % pour les envies, 20 % pour l'épargne. La part à protéger en priorité, c'est l'épargne.",
"<strong>Bon revenu.</strong> Le piège n'est plus le manque. C'est que <strong>ton train de vie grimpe avec ton salaire</strong>. Chaque augmentation part en dépenses. Tu épargnes la même part à 2 000 € qu'à 4 000 €. Vise plutôt 45/25/30, ou plus. Et une règle qui marche : <u>dès que tu es augmenté, envoie la moitié de la hausse vers l'épargne, avant de prendre l'habitude de la dépenser.</u>",
"<strong>Revenu irrégulier</strong> (indépendants, intermittents, saisonniers). Un budget au mois ne marche pas. Calcule plutôt un revenu de référence sur les 12 derniers mois, en restant prudent. Garde tes revenus sur un compte réserve. Chaque mois, verse-toi ce montant fixe depuis ce compte. Les bons mois remplissent la réserve, les mauvais mois la vident. <strong>Ce compte réserve, c'est un salaire que tu te verses à toi-même.</strong> Ton revenu devient prévisible.",
"Ces 4 situations ont un point commun. <strong>Ce que tu épargnes dépend moins de ton revenu qu'on ne le croit.</strong> Certains épargnent chaque mois avec 1 800 €. D'autres n'y arrivent jamais avec 4 000 €. La différence vient des charges fixes et des virements automatiques, pas du salaire.",
"C'est une bonne nouvelle. Tu peux agir dès maintenant, sans attendre une augmentation."
],
quiz:[
{q:"Que faire en priorité quand tes besoins dépassent 70 % du revenu ?",opts:["Épargner 20 % quand même","Baisser une charge fixe, vérifier ses aides, viser 1 000 € d'épargne","Manger moins","Prendre un crédit"],correct:1,
explain:"Dans cette situation, viser 20 % ne fait que culpabiliser. Ça ne crée pas d'épargne."},
{q:"Quel est le piège d'un bon revenu ?",opts:["Les impôts","Le train de vie qui grimpe à chaque augmentation","La complexité des banques","Le manque de placements"],correct:1,
explain:"On épargne la même part à 2 000 € qu'à 4 000 €. La solution : envoyer la moitié de chaque hausse vers l'épargne."},
{q:"Comment gérer un revenu irrégulier ?",opts:["Dépenser au fur et à mesure","Se verser un montant fixe depuis un compte réserve","Emprunter les mois creux","Ne pas faire de budget"],correct:1,
explain:"Ce compte réserve est un salaire qu'on se verse à soi-même. Le revenu devient prévisible."}
],
action:"Repère laquelle des 4 situations est la tienne. Note le seul changement à faire. Si ton revenu est irrégulier, calcule ce soir ton revenu de référence sur les 12 derniers mois, en restant prudent."
},
{module:"Module 2 — Structurer avec la règle 50/30/20", title:"Reconstruire ton budget", duration:"5 min",
script:[
"Tu as observé, trié, et tu connais tes écarts. Place au budget lui-même. Avec de vrais chiffres, pas des intentions.",
"<strong>Étape 1 : pars de la réalité, pas de l'idéal.</strong> Fais la moyenne de tes 3 derniers mois, poste par poste. Un budget basé sur ce que tu aimerais dépenser est faux dès le premier jour. Et quand il échoue, on n'a plus envie d'en refaire un.",
"<strong>Étape 2 : décide d'abord ce que tu épargnes.</strong> C'est la seule ligne à fixer avant toutes les autres. C'est le changement le plus important de toute cette formation. Choisis un montant que tu es sûr de tenir, même un mois difficile. Même s'il te paraît ridicule.",
"<strong>Étape 3 : note tes charges fixes.</strong> Ce mois-ci, elles ne bougent pas. Note-les telles quelles. Garde la liste pour les renégocier plus tard.",
"<strong>Étape 4 : ce qui reste, c'est ton budget courant.</strong> Divise ce montant par 4,33 : tu obtiens ton budget par semaine. <u>Compter à la semaine change tout.</u> Si tu dépasses, tu te rattrapes en 6 jours au lieu de 25. Et une semaine, c'est facile à suivre.",
"<strong>Étape 5 : garde une marge.</strong> Ajoute une ligne « imprévus » d'environ 5 % de ton revenu. Sans marge, le budget casse au premier coup dur. Et on croit que c'est de sa faute, alors que c'est la méthode qui était mal faite.",
"Trois erreurs font échouer la plupart des budgets. <strong>Trop de catégories</strong> : au-delà de 8, plus personne ne remplit. <strong>Trop de sévérité</strong> : un budget sans aucun plaisir sera abandonné. Une ligne loisirs assumée l'aide à durer. <strong>Trop d'ambition</strong> : vouloir dépenser 30 % de moins dès le premier mois, c'est le meilleur moyen de tout arrêter au deuxième.",
"Un dernier conseil. <strong>Ton premier budget sera faux.</strong> C'est normal. Il devient juste après 2 ou 3 mois de réglages. Un budget, ça ne s'écrit pas une fois pour toutes. Ça se règle au fil du temps."
],
quiz:[
{q:"Sur quoi baser son budget ?",opts:["Sur ce qu'on aimerait dépenser","Sur la moyenne réelle des 3 derniers mois","Sur les moyennes nationales","Sur son mois le plus économe"],correct:1,
explain:"Un budget basé sur des intentions est faux dès le premier jour. Et son échec décourage."},
{q:"Quelle ligne fixer en premier ?",opts:["Le loyer","L'épargne","Les courses","Les loisirs"],correct:1,
explain:"C'est le changement clé : l'épargne devient une ligne du budget, pas ce qui reste à la fin."},
{q:"Pourquoi compter à la semaine plutôt qu'au mois ?",opts:["Parce que les salaires sont versés chaque semaine","Parce qu'on se rattrape en 6 jours au lieu de 25","Parce que c'est plus précis","Parce que les banques le conseillent"],correct:1,
explain:"Une semaine, c'est facile à suivre. Et on a le temps de corriger."}
],
action:"Ce soir, fais ton budget avec le tableau NiouDem, à partir de tes vrais chiffres. Fixe d'abord l'épargne, puis les charges. Divise le reste par 4,33. Tu obtiens ton budget de la semaine : c'est le seul chiffre à surveiller."
},
{module:"Module 3 — Automatiser et fluidifier", title:"Les virements automatiques", duration:"5 min",
script:[
"Les virements automatiques fonctionnent même les mois où tu ne penses pas à ton budget. C'est ce qui en fait l'outil le plus important de cette formation.",
"Tu l'as vu dans la formation sur l'épargne, et ça vaut la peine de le répéter : <strong>on épargne d'abord, on dépense ce qui reste.</strong> En pratique, un virement part tout seul le lendemain de ta paie. Tu n'as rien à décider.",
"Voici comment tout organiser, dans l'ordre. <strong>Jour 1 :</strong> ton salaire arrive sur le compte principal. <strong>Jour 2 :</strong> un virement automatique part vers le compte d'épargne. <strong>Jour 2 aussi :</strong> un deuxième virement remplit le compte des dépenses annuelles. <strong>Jour 3 :</strong> un troisième virement remplit le compte des dépenses courantes, celui de ta carte. <strong>Du 5 au 10 :</strong> les prélèvements des charges fixes partent du compte principal. Il ne sert plus qu'à ça.",
"<figure class=\"schema\"><svg viewBox=\"0 0 700 338\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"20\" y=\"24\" width=\"190\" height=\"54\" rx=\"9\" fill=\"#F0F1F7\" stroke=\"#171C45\" stroke-width=\"1.5\"/><text x=\"115\" y=\"47\" text-anchor=\"middle\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14.5\" font-weight=\"600\" fill=\"#171C45\">Ton salaire</text><text x=\"115\" y=\"65\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\" fill=\"#6B7094\">jour 1</text><path d=\"M210 51 C 270 51, 270 66, 330 66\" fill=\"none\" stroke=\"#C27C00\" stroke-width=\"1.8\"/><circle cx=\"330\" cy=\"66\" r=\"4\" fill=\"#C27C00\"/><rect x=\"344\" y=\"43\" width=\"336\" height=\"46\" rx=\"8\" fill=\"#FDF2DA\" stroke=\"#C27C00\" stroke-width=\"1.3\"/><text x=\"360\" y=\"64\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"14\" font-weight=\"600\" fill=\"#171C45\">Épargne, automatique</text><text x=\"664\" y=\"64\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"13\" fill=\"#C27C00\">jour 2</text><path d=\"M210 51 C 270 51, 270 128, 330 128\" fill=\"none\" stroke=\"#C27C00\" stroke-width=\"1.8\"/><circle cx=\"330\" cy=\"128\" r=\"4\" fill=\"#C27C00\"/><rect x=\"344\" y=\"105\" width=\"336\" height=\"46\" rx=\"8\" fill=\"#FDF2DA\" stroke=\"#C27C00\" stroke-width=\"1.3\"/><text x=\"360\" y=\"126\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"14\" font-weight=\"600\" fill=\"#171C45\">Provisions annuelles</text><text x=\"664\" y=\"126\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"13\" fill=\"#C27C00\">jour 2</text><path d=\"M210 51 C 270 51, 270 190, 330 190\" fill=\"none\" stroke=\"#2B3A8F\" stroke-width=\"1.8\"/><circle cx=\"330\" cy=\"190\" r=\"4\" fill=\"#2B3A8F\"/><rect x=\"344\" y=\"167\" width=\"336\" height=\"46\" rx=\"8\" fill=\"#E9EBF7\" stroke=\"#2B3A8F\" stroke-width=\"1.3\"/><text x=\"360\" y=\"188\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"14\" font-weight=\"600\" fill=\"#171C45\">Budget courant, ta carte</text><text x=\"664\" y=\"188\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"13\" fill=\"#2B3A8F\">jour 3</text><path d=\"M210 51 C 270 51, 270 252, 330 252\" fill=\"none\" stroke=\"#2B3A8F\" stroke-width=\"1.8\"/><circle cx=\"330\" cy=\"252\" r=\"4\" fill=\"#2B3A8F\"/><rect x=\"344\" y=\"229\" width=\"336\" height=\"46\" rx=\"8\" fill=\"#E9EBF7\" stroke=\"#2B3A8F\" stroke-width=\"1.3\"/><text x=\"360\" y=\"250\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"14\" font-weight=\"600\" fill=\"#171C45\">Charges fixes, prélèvements</text><text x=\"664\" y=\"250\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"13\" fill=\"#2B3A8F\">du 5 au 10</text></svg><figcaption>Au jour 3, tout est réparti : ce que tu vois sur ta carte est exactement ce que tu peux dépenser.</figcaption></figure>",
"Résultat, et aucune discipline ne fait aussi bien : <u>dès le jour 3, tout est réparti. Ce que tu vois sur ta carte, c'est exactement ce que tu peux dépenser.</u> Ton budget n'est plus un tableau à consulter. Il est inscrit dans tes comptes.",
"Trois précautions avant de tout programmer. <strong>1. Garde une marge</strong> de 100 à 200 € sur le compte principal. Si un prélèvement est plus élevé que prévu, tu évites les frais de rejet. <strong>2. Vérifie les vraies dates</strong> de tes prélèvements sur tes relevés. Ne te fie pas à ta mémoire. <strong>3. Commence avec une petite épargne.</strong> Augmente-la quand le système a tourné 3 mois sans problème.",
"Une question revient souvent : et si un mois est trop juste ? Mieux vaut connaître la réponse à l'avance. <strong>Tu peux sauter le virement d'épargne une fois, mais ne le supprime jamais.</strong> Un virement mis en pause, on le relance. Un virement supprimé, on ne le recrée presque jamais.",
"Ces virements changent aussi autre chose que l'argent. Ils t'évitent des dizaines de petites décisions chaque mois, et la fatigue qui va avec. <strong>C'est le seul outil de cette formation qui te demande de moins en moins d'efforts avec le temps.</strong>"
],
quiz:[
{q:"Quand programmer le virement d'épargne ?",opts:["En fin de mois","Le lendemain de la paie","Le 15 du mois","Quand il reste assez"],correct:1,
explain:"Ce que tu ne vois pas ne te manque pas. Un virement en fin de mois saute dès que le mois a été dur."},
{q:"Que garder sur le compte principal ?",opts:["Rien du tout","Une marge de 100 à 200 € pour un prélèvement plus élevé que prévu","Tout le salaire","Seulement le montant des charges"],correct:1,
explain:"Elle t'évite les frais de rejet, qui coûtent bien plus cher."},
{q:"Que faire un mois trop juste ?",opts:["Supprimer le virement d'épargne","Le sauter une fois, sans jamais le supprimer","Emprunter la différence","Doubler le mois suivant"],correct:1,
explain:"Un virement en pause se relance. Un virement supprimé ne se recrée presque jamais."}
],
action:"Ce soir, programme les 3 virements automatiques dans ton appli bancaire, aux bonnes dates. Si tu n'en fais qu'un, fais celui de l'épargne. Avec un montant assez petit pour ne pas le sentir."
},
{module:"Module 3 — Automatiser et fluidifier", title:"Organiser ses comptes", duration:"5 min",
script:[
"La façon dont tes comptes sont organisés compte plus que n'importe quel tableau. Voici une organisation qui marche, et les cas où il faut l'adapter.",
"<strong>La base : 4 comptes.</strong> Un compte principal qui reçoit tes revenus et paie les charges fixes. Un second compte pour les dépenses de tous les jours, avec ta carte. Un compte pour les dépenses annuelles. Un livret d'épargne, si possible dans une autre banque.",
"Mettre ton épargne <strong>dans une autre banque</strong>, ce n'est pas un détail. Pour y toucher, il faut quelques minutes de plus. Ce petit délai suffit pour faire la différence entre un vrai besoin et une envie du moment. Ça ne coûte rien, et c'est très efficace.",
"<strong>En couple</strong>, l'argent crée plus de disputes que n'importe quel autre sujet. Il existe 3 façons de s'organiser. Aucune n'est meilleure dans l'absolu. <em>Tout en commun</em> : simple, mais plus d'autonomie, et chaque dépense perso se voit. <em>Tout séparé</em> : chacun est libre, mais partager les charges devient compliqué, et celui qui gagne le moins est désavantagé. <em>Le modèle mixte</em> : un compte joint pour les charges communes, rempli selon les revenus de chacun, et un compte perso pour chacun.",
"<u>Le modèle mixte est celui qui crée le moins de tensions.</u> Il règle clairement la question de l'équité. Si l'un gagne 2 000 € et l'autre 3 000 €, le premier paie 40 % des charges communes et le second 60 %, au lieu de la moitié chacun. Ce qui reste sur le compte perso, on n'a pas à le justifier. C'est ce qui évite les disputes.",
"<strong>Si tu es indépendant</strong>, une règle à suivre absolument : un compte réservé à ton activité, séparé de ton compte perso. Pour ta comptabilité, mais pas seulement. Si tu mélanges tout, tu ne sais plus ce que ton activité te rapporte vraiment. Ajoute un troisième compte pour mettre de côté tes cotisations et tes impôts, à chaque paiement reçu.",
"Un dernier conseil : <strong>n'ouvre pas trop de comptes.</strong> Chaque compte en plus, c'est du suivi, parfois des frais, et un risque d'oubli. Mieux vaut 4 comptes bien utilisés que 9 comptes ouverts avec enthousiasme et abandonnés 3 mois plus tard."
],
quiz:[
{q:"Pourquoi mettre son épargne dans une autre banque ?",opts:["Pour un meilleur taux","Pour avoir un petit délai qui sépare un besoin d'une envie","Pour être mieux protégé par la loi","Pour payer moins de frais"],correct:1,
explain:"Quelques minutes de délai suffisent. Et ça ne coûte rien."},
{q:"En couple, quelle organisation crée le moins de tensions ?",opts:["Tout en commun","Le modèle mixte, avec un compte joint rempli selon les revenus","Tout séparé","Un seul compte au nom d'une personne"],correct:1,
explain:"Il règle clairement l'équité. Et on n'a pas à justifier ce qu'on fait de son compte perso."},
{q:"Quelle règle pour un indépendant ?",opts:["Ouvrir 6 comptes","Séparer le compte de l'activité du compte perso","Tout mettre sur un seul compte","Confier ses comptes à quelqu'un"],correct:1,
explain:"Sinon, impossible de savoir ce que l'activité rapporte vraiment."}
],
action:"Sur une feuille, dessine tes comptes actuels, avec des flèches pour montrer où va l'argent. Puis dessine l'organisation que tu vises. En comparant les 2, tu sauras quels comptes ouvrir ou fermer."
},
{module:"Module 3 — Automatiser et fluidifier", title:"Les applications de suivi", duration:"5 min",
script:[
"Les applis de budget promettent de tout faire à ta place. Elles rendent de vrais services. Elles ont aussi de vraies limites. Mieux vaut les connaître avant de leur confier tes données bancaires.",
"<strong>Ce qu'elles font bien.</strong> Elles regroupent plusieurs banques au même endroit. Elles classent tes dépenses toutes seules. Elles repèrent les abonnements. Elles font des graphiques chaque mois. Si tu détestes les tableaux, c'est un vrai gain.",
"<strong>Ce qu'elles font mal.</strong> Le classement automatique se trompe souvent, surtout sur les achats en ligne et les virements entre tes comptes. Tes chiffres sont faussés sans que tu le voies. Et surtout, <u>elles montrent ce que tu as dépensé, mais ne décident rien pour la suite.</u> Voir que tu as dépensé 340 € au restaurant ne change rien si tu ne t'es pas fixé de limite à l'avance.",
"<strong>Et tes données ?</strong> Ces applis voient toutes tes opérations bancaires. C'est une image très précise de ta vie. Avant d'en choisir une, vérifie 3 choses : qui la fait et dans quel pays, comment elle gagne de l'argent, et si elle revend ou utilise des données. <strong>Si une appli est gratuite et que tu ne sais pas comment elle gagne de l'argent, elle le gagne forcément quelque part.</strong>",
"Bon à savoir : grâce aux règles européennes sur les paiements, ces applis doivent passer par des accès sécurisés et avoir un agrément officiel. C'est plus sûr qu'avant. Vérifie que l'appli est bien agréée : l'info doit être sur son site.",
"Mon avis : <strong>une appli est utile pour observer, pas pour décider.</strong> Pendant le mois d'observation, elle t'évite de tout noter à la main. Mais ton budget, c'est-à-dire les montants fixés à l'avance, doit être ailleurs. Dans ton tableau, et surtout dans l'organisation de tes comptes.",
"Tu ne veux pas d'appli ? <strong>Le tableau NiouDem et 4 comptes suffisent.</strong> Des gens tiennent leur budget depuis 20 ans avec un simple carnet. Ce n'est jamais l'outil qui fait la différence."
],
quiz:[
{q:"Quelle est la grande limite de ces applis ?",opts:["Leur prix","Elles montrent le passé mais ne décident rien pour la suite","Leur lenteur","Le nombre de banques acceptées"],correct:1,
explain:"Voir qu'on a dépensé 340 € ne change rien sans limite fixée à l'avance."},
{q:"Que vérifier avant d'en choisir une ?",opts:["Sa note sur les stores","Qui la fait, comment elle gagne de l'argent, et son agrément","Son nombre d'utilisateurs","La couleur de l'écran"],correct:1,
explain:"Elle voit toutes tes opérations. Une appli gratuite gagne forcément de l'argent quelque part."},
{q:"Peut-on tenir un budget sans appli ?",opts:["Non, c'est indispensable aujourd'hui","Oui, un tableau et 4 comptes suffisent","Seulement avec un comptable","Seulement avec un salaire fixe"],correct:1,
explain:"Ce n'est jamais l'outil qui fait la différence. Certains tiennent leur budget depuis 20 ans avec un carnet."}
],
action:"Si tu utilises une appli, vérifie ce soir 2 choses : qui la fait et comment elle gagne de l'argent. Si tu n'en as pas, ne cherches-en pas : ton tableau suffit. Dans les 2 cas, l'essentiel reste l'organisation de tes comptes."
},
{module:"Module 3 — Automatiser et fluidifier", title:"Configurer ton système complet", duration:"5 min",
script:[
"Cette leçon rassemble tout ce qu'on a vu en une seule séance. Compte 90 minutes, une seule fois. Ensuite, ton budget tournera presque tout seul.",
"<strong>Étape 1, 20 minutes : les comptes.</strong> Ouvre le compte des dépenses courantes s'il n'existe pas. Ouvre le compte des dépenses annuelles. Vérifie que ton livret d'épargne est dans une autre banque. Donne un nom clair à chaque compte dans ton appli bancaire : « charges », « courant », « annuel », « épargne ».",
"<strong>Étape 2, 20 minutes : les montants.</strong> Reprends ton budget. Note 3 chiffres : ce que tu épargnes chaque mois, tes dépenses annuelles divisées par 12, et ton budget courant du mois. Ce sont les seuls chiffres dont tu as besoin.",
"<strong>Étape 3, 20 minutes : les virements.</strong> Programme les 3 virements automatiques aux bonnes dates, comme dans la leçon 9. Vérifie qu'il reste ta marge sur le compte principal après leur départ.",
"<strong>Étape 4, 20 minutes : le ménage.</strong> Résilie les abonnements repérés pendant le diagnostic. Supprime tes cartes enregistrées sur les sites. Désactive les achats en un clic. <u>C'est cette étape qui rapporte le plus, et tout de suite.</u>",
"<strong>Étape 5, 10 minutes : les rendez-vous.</strong> Mets dans ton agenda un point de 10 minutes chaque semaine et un point de 30 minutes chaque mois. Programme-les pour qu'ils se répètent. Cale-les sur une habitude que tu as déjà.",
"Un conseil : <strong>fais tout d'un coup, sans ton téléphone.</strong> Si tu étales les 5 étapes sur 5 soirs, tu perds du temps à t'y remettre à chaque fois. Et la plupart des gens abandonnent au troisième soir. Bloque ce moment comme un rendez-vous. C'en est un.",
"À la fin, tu auras un système où <strong>l'épargne part toute seule, les charges sont à part, ton budget courant est sur une carte dédiée, et les dépenses de l'année sont prévues.</strong> Ensuite, tenir ton budget ne te prendra que 10 minutes par semaine."
],
quiz:[
{q:"Combien de temps faut-il pour tout mettre en place ?",opts:["10 minutes","Environ 90 minutes, une seule fois","Une journée entière","Un mois"],correct:1,
explain:"Une seule séance, d'un coup. Si on l'étale, on perd du temps à s'y remettre."},
{q:"Quelle étape rapporte le plus, tout de suite ?",opts:["Ouvrir les comptes","Le ménage : résiliations et cartes enregistrées supprimées","Calculer les montants","Planifier les rendez-vous"],correct:1,
explain:"Le gain revient chaque mois, dès le mois suivant, sans changer ta façon de vivre."},
{q:"De combien de chiffres le système a-t-il besoin ?",opts:["Un par catégorie","3 : épargne du mois, dépenses annuelles, budget courant","Une dizaine","Aucun, tout est automatique"],correct:1,
explain:"Au fond, tout le budget tient en 3 montants et 3 virements."}
],
action:"Bloque maintenant 90 minutes dans ton agenda, dans les 7 prochains jours. Appelle ce moment « configuration budget ». Colle les 5 étapes dans la description. C'est la seule action de cette formation qui demande vraiment du temps."
},
{module:"Module 4 — Ancrer le rituel", title:"Le bilan mensuel en 15 minutes", duration:"5 min",
script:[
"Un système automatique tourne tout seul. Mais s'il n'est jamais vérifié, il dérape doucement. Le bilan du mois est le seul rendez-vous obligatoire. Il prend 15 minutes.",
"<strong>Quand ? Le lendemain de ta paie.</strong> Toujours le même jour. Tout est encore frais. Et ce que tu décides s'applique au mois qui commence, pas à celui qui se termine.",
"<strong>Minutes 1 à 5 : vérifier.</strong> Les 3 virements sont-ils bien partis ? Reste-t-il ta marge sur le compte principal ? As-tu payé des frais bancaires ? Si oui, pourquoi ? Cette question est importante : <u>des frais bancaires signalent toujours un problème. Ils ne sont jamais une fatalité.</u>",
"<strong>Minutes 6 à 10 : comparer.</strong> Ouvre ton tableau et regarde le mois passé. Compare ce que tu avais prévu à ce que tu as dépensé. Pose-toi une seule question : l'écart vient-il d'un imprévu, ou ton budget était-il mal calculé dès le départ ?",
"<strong>Minutes 11 à 15 : changer une seule chose.</strong> Une. Pas 5. Épargner 10 € de plus, résilier un abonnement, augmenter une ligne trop basse. <strong>Un seul changement fait vaut mieux que 5 changements notés et jamais faits.</strong>",
"Trois pièges à éviter. <strong>Ne te juge pas.</strong> Tu regardes un système, pas ta valeur. C'est comme ça que le rendez-vous dure au lieu d'être évité.",
"<strong>Ne cherche pas la précision au centime.</strong> 20 € d'écart, ça ne veut rien dire. 200 €, si. Et <strong>ne saute pas le bilan quand le mois a été dur.</strong> C'est justement là qu'il sert le plus. C'est le moment où un écart devient une habitude.",
"Garde une trace : 3 lignes par mois suffisent. Note l'écart et le changement décidé. Au bout d'un an, ces 36 lignes montrent ton parcours. Elles te rappellent aussi que les mois difficiles ne durent pas. On l'oublie complètement quand on est dedans."
],
quiz:[
{q:"Quand faire le bilan du mois ?",opts:["Le dernier jour du mois","Le lendemain de la paie","Le premier dimanche du mois","Quand on y pense"],correct:1,
explain:"Ce que tu décides s'applique au mois qui commence, pas à celui qui se termine."},
{q:"Combien de changements décider à chaque bilan ?",opts:["Autant qu'il faut","Un seul","Au moins 3","Aucun, on regarde seulement"],correct:1,
explain:"Un changement fait vaut mieux que 5 notés et jamais faits."},
{q:"Faut-il sauter le bilan quand le mois a été dur ?",opts:["Oui, pour ne pas se décourager","Non, c'est là qu'il sert le plus","Oui, si l'écart dépasse 200 €","Ça n'a pas d'importance"],correct:1,
explain:"Si personne ne regarde, un écart devient vite une habitude."}
],
action:"Mets le bilan du mois dans ton agenda, le lendemain de ta paie, chaque mois. Écris les 3 étapes de 5 minutes dans la description. Fais le premier dès le mois prochain, même si ton système vient juste d'être installé."
},
{module:"Module 4 — Ancrer le rituel", title:"Des objectifs qui se tiennent", duration:"5 min",
script:[
"Un objectif flou ne donne rien. <em>« Mieux gérer mon argent »</em>, <em>« épargner plus »</em>, <em>« faire attention »</em> : avec ces phrases, on ne sait ni par où commencer, ni quand on a réussi.",
"Un bon objectif a 4 éléments. S'il en manque un seul, il ne marche plus.",
"<strong>1. Un montant.</strong> Pas « épargner plus », mais « 100 € par mois ». Avec un chiffre, tu sais si tu as tenu ou non. <strong>2. Une date.</strong> Pas « un jour », mais « au 31 décembre ». Sans date, l'objectif n'est jamais prioritaire. Tout le reste passe avant.",
"<strong>3. Une raison précise.</strong> C'est l'élément le plus oublié, et le plus important. <u>Un objectif sans raison est abandonné à la première tentation.</u> « 3 000 € pour un apport » ou « 2 mois de charges pour dormir tranquille », ça tient. « Épargner », ça ne tient pas.",
"<strong>4. Une première action, avec une date.</strong> Ce que tu fais dans les 48 heures. Sans première action, l'objectif reste une simple envie, aussi précis soit-il.",
"Un exemple. Version faible : <em>« je veux mettre de l'argent de côté »</em>. Version qui tient : <strong>« 1 200 € au 31 décembre, soit 100 € par mois, pour ma première épargne de secours. Je programme le virement automatique demain. »</strong> C'est la même envie. Mais la deuxième version a bien plus de chances de réussir.",
"Un conseil : <strong>un seul objectif à la fois.</strong> Si tu en as 3 en même temps, ils se partagent le même argent, et aucun n'aboutit. Quand le premier est atteint, passe au suivant. Tu iras beaucoup plus loin comme ça.",

async function loadProgressFromServer(){
  const { data } = await sb
    .from('lesson_progress')
    .select('lesson_number, completed')
    .eq('user_id', CURRENT_USER.id)
    .eq('formation', FORMATION);
  const p = {};
  if(data){ data.forEach(function(row){ if(row.completed) p[row.lesson_number] = true; }); }
  PROGRESS_CACHE = p;
  return p;
}
function getProgress(){ return PROGRESS_CACHE; }
async function setProgressServer(lessonNumber, value){
  PROGRESS_CACHE[lessonNumber] = value;
  await sb.from('lesson_progress').upsert({
    user_id: CURRENT_USER.id,
    formation: FORMATION,
    lesson_number: lessonNumber,
    completed: value,
    completed_at: value ? new Date().toISOString() : null
  }, { onConflict: 'user_id,formation,lesson_number' });

  await majCarnet(lessonNumber, value);
}

/* Le carnet de route : l'action cochée s'inscrit dans le carnet personnel,
   la décocher l'en retire. Une erreur ici ne doit jamais bloquer la
   progression de la leçon, d'où le try/catch silencieux. */
async function majCarnet(lessonNumber, value){
  try {
    const l = LESSONS[lessonNumber - 1];
    if(!l) return;

    if(!value){
      await sb.from('carnet').delete()
        .eq('user_id', CURRENT_USER.id)
        .eq('formation', FORMATION)
        .eq('lesson_number', lessonNumber);
      return;
    }

    await sb.from('carnet').upsert({
      user_id: CURRENT_USER.id,
      formation: FORMATION,
      lesson_number: lessonNumber,
      titre: l.title || ('Leçon ' + lessonNumber),
      action: l.action || ''
    }, { onConflict: 'user_id,formation,lesson_number', ignoreDuplicates: true });
  } catch(e){
    console.warn('Carnet non mis à jour :', e);
  }
}

let current = parseInt(new URLSearchParams(location.search).get('l')) || 1;

function isUnlocked(n){
  if(n === 1) return true;
  const progress = getProgress();
  return !!progress[n-1];
}

function renderSidebar(){
  const progress = getProgress();
  const doneCount = Object.keys(progress).filter(function(k){ return progress[k]; }).length;
  document.getElementById('navProgress').textContent = doneCount + '/' + LESSONS.length + ' leçons';

  /* Regroupement des lecons par module : c'est le module qui devient
     l'etape de l'itineraire, la lecon n'est qu'un arret. */
  const etapes = [];
  LESSONS.forEach(function(l, i){
    const nom = l.module.split(' — ')[1] || l.module;
    let e = etapes.find(function(x){ return x.nom === nom; });
    if(!e){ e = { nom: nom, lecons: [] }; etapes.push(e); }
    e.lecons.push({ n: i + 1, titre: l.title });
  });

  const etapeCourante = etapes.findIndex(function(e){
    return e.lecons.some(function(a){ return a.n === current; });
  });

  const COCHE = '<svg viewBox="0 0 24 24" fill="none"><path d="M5 12L10 17L19 7" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  let html = '<div class="itin">' +
    '<div class="itin-tete">' +
      '<div class="itin-formation">' + NOM_FORMATION + '</div>' +
      '<div class="itin-compte">Étape ' + (etapeCourante + 1) + ' sur ' + etapes.length + ' · ' + doneCount + '/' + LESSONS.length + ' leçons</div>' +
      '<div class="itin-barre"><span style="width:' + Math.round(doneCount / LESSONS.length * 100) + '%"></span></div>' +
    '</div><div class="route">';

  etapes.forEach(function(e, idx){
    const toutesFaites = e.lecons.every(function(a){ return progress[a.n]; });
    const ici = idx === etapeCourante;
    const premiereAccessible = e.lecons.find(function(a){ return isUnlocked(a.n); });
    const classe = toutesFaites ? 'faite' : (ici ? 'ici' : '');
    const borne = toutesFaites ? COCHE : String(idx + 1);
    const cible = premiereAccessible ? premiereAccessible.n : e.lecons[0].n;

    html += '<div class="etape-i ' + classe + '">' +
      '<span class="borne">' + borne + '</span>' +
      '<button class="etape-titre" onclick="goTo(' + cible + ')">' + e.nom + '</button>' +
      '<div class="etape-meta">' + e.lecons.length + ' leçon' + (e.lecons.length > 1 ? 's' : '') + '</div>';

    /* On ne deroule que l'etape ou l'on se trouve : la carte reste lisible. */
    if(ici){
      html += '<div class="arrets">';
      e.lecons.forEach(function(a){
        const fait = !!progress[a.n];
        const ouvert = isUnlocked(a.n);
        const cl = (a.n === current ? 'ici ' : '') + (fait ? 'faite ' : '') + (ouvert ? '' : 'bloque');
        html += '<div class="arret ' + cl + '" onclick="goTo(' + a.n + ')">' +
          '<span class="puce">' + COCHE + '</span><span>' + a.titre + '</span></div>';
      });
      html += '</div>';
    }
    html += '</div>';
  });

  html += '</div>' + escaleHtml() + '</div>';
  document.getElementById('sidebar').innerHTML = html;
}

function goTo(n){

  current = n;
  history.replaceState(null, '', '?l=' + n);
  render();
  window.scrollTo(0,0);
}

function answerQuiz(qi, oi, correct){
  if(quizState[qi]) return; // déjà répondu correctement, verrouillé
  const chosen = document.getElementById('q'+qi+'o'+oi);
  if(chosen.classList.contains('disabled')) return;

  if(oi === correct){
    for(let k=0;k<10;k++){
      const el = document.getElementById('q'+qi+'o'+k);
      if(el){ el.classList.add('disabled'); }
    }
    chosen.classList.add('correct');
    quizState[qi] = true;
    document.getElementById('exp'+qi).classList.add('show');
    const l = LESSONS[current-1];
    const quizOk = allQuizCorrect(l);
    const card = document.getElementById('actionCard');
    if(quizOk && card){
      card.style.opacity = '';
      card.style.pointerEvents = '';
      const lock = card.previousElementSibling;
      if(lock && lock.textContent.indexOf('Réponds correctement') !== -1){ lock.style.display = 'none'; }
    }
  } else {
    chosen.classList.add('wrong');
    document.getElementById('exp'+qi).classList.add('show');
    setTimeout(function(){ chosen.classList.remove('wrong'); }, 900);
  }
}

async function toggleAction(){
  const l = LESSONS[current-1];
  const progress = getProgress();
  const newValue = !progress[current];
  if(newValue && !allQuizCorrect(l)){
    alert('Réponds correctement à toutes les questions du quiz avant de valider cette leçon.');
    return;
  }
  await setProgressServer(current, newValue);
  render();

  /* La formation vient-elle de s'achever ? Si oui, on plante la borne.
     On ne la montre qu'au moment du basculement, jamais en revenant
     sur une leçon déjà validée. */
  if(newValue) verifierFinDeParcours();
}

async function verifierFinDeParcours(){
  const progress = getProgress();
  const faites = Object.keys(progress).filter(function(k){ return progress[k]; }).length;
  if(faites < LESSONS.length) return;

  let prenom = '';
  let semaines = 1;
  try {
    const { data } = await sb.from('profiles').select('prenom').eq('id', CURRENT_USER.id).maybeSingle();
    if(data && data.prenom) prenom = data.prenom;

    const { data: dates } = await sb.from('lesson_progress')
      .select('completed_at').eq('user_id', CURRENT_USER.id).eq('formation', FORMATION)
      .not('completed_at', 'is', null).order('completed_at', { ascending: true }).limit(1);
    if(dates && dates.length){
      const debut = new Date(dates[0].completed_at).getTime();
      semaines = Math.max(1, Math.round((Date.now() - debut) / (7*24*3600*1000)));
    }
  } catch(e){ console.warn('Carte : données partielles', e); }

  ouvrirCarte(FORMATION, LESSONS.length, prenom, semaines);
}

async function boot(){
  document.getElementById('main').innerHTML = '<div style="padding:60px 0;text-align:center;color:var(--ink-faint);font-size:14px;">Chargement de ta progression…</div>';
  const user = await requireAuth();
  if(!user) return;
  const unlocked = await requireUnlock(user.id);
  if(!unlocked) return;
  CURRENT_USER = user;
  await loadProgressFromServer();

  if(!isUnlocked(current)){
    let lastUnlocked = 1;
    for(let i=1;i<=LESSONS.length;i++){ if(isUnlocked(i)) lastUnlocked = i; else break; }
    current = lastUnlocked;
    history.replaceState(null, '', '?l=' + current);
  }
  render();
}
boot();
</script>
