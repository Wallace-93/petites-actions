<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --ink:#12212B;--ink-soft:#43555F;--ink-muted:#7A8A93;--ink-faint:#96A3AA;
  --bg:#FCFBF8;--bg-soft:#F5F4EE;--bg-mid:#EFF0EA;--bg-line:#DCDDD3;
  --green:#1E4B3C;--green-light:#2A6350;--green-pale:#E7EFEA;--green-bord:#BFD6C9;
  --amber:#B8862F;--amber-pale:#F6EFE0;--amber-bord:#E4D2AC;
  --violet:#4A5C6B;--violet-pale:#EDF0F2;--violet-bord:#D4DBE0;
  --coral:#A24332;--coral-pale:#F8EDEA;
  --sans:'Karla',system-ui,-apple-system,sans-serif;
  --display:'Newsreader',Georgia,serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
body{font-family:var(--sans);background:var(--bg-soft);color:var(--ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;}
a{color:inherit;}
.nav{position:sticky;top:0;z-index:200;background:rgba(255,255,255,.96);backdrop-filter:blur(20px);border-bottom:1px solid var(--bg-line);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;font-weight:800;font-size:15px;color:var(--ink);}
.nav-mark{width:26px;height:26px;border-radius:8px;background:var(--green);display:flex;align-items:center;justify-content:center;}
.nav-mark svg{width:14px;height:14px;}
.nav-back{font-size:13px;font-weight:600;color:var(--ink-muted);text-decoration:none;}
.nav-progress-pill{font-size:12px;font-weight:700;color:var(--green);background:var(--green-pale);padding:5px 12px;border-radius:100px;}
.layout{display:grid;grid-template-columns:280px 1fr;max-width:1100px;margin:0 auto;min-height:calc(100vh - 60px);}
.sidebar{border-right:1px solid var(--bg-line);background:var(--bg);padding:24px 16px;position:sticky;top:60px;align-self:start;height:calc(100vh - 60px);overflow-y:auto;}
.sb-progress-bar{height:6px;background:var(--bg-mid);border-radius:100px;overflow:hidden;margin:0 10px 18px;}
.sb-progress-fill{height:100%;background:var(--green);border-radius:100px;transition:width .3s;}
.sb-item{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:10px;cursor:pointer;margin-bottom:2px;font-size:13px;font-weight:600;color:var(--ink-muted);transition:background .15s;}
.sb-item:hover{background:var(--bg-soft);}
.sb-item.active{background:var(--green-pale);color:var(--green);}
.sb-item.done{color:var(--ink);}
.sb-item.locked{opacity:.45;cursor:not-allowed;}
.sb-item.locked:hover{background:transparent;}
.sb-check{width:20px;height:20px;border-radius:50%;background:var(--bg-mid);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink-faint);flex-shrink:0;}
.sb-item.done .sb-check{background:var(--green);color:#fff;}
.sb-item.active .sb-check{background:var(--green);color:#fff;}
.sb-module-label{font-size:10.5px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em;padding:14px 10px 6px;}
.main{padding:36px 40px 80px;max-width:720px;}
.lesson-eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green);margin-bottom:10px;}
.lesson-title{font-size:28px;font-weight:800;letter-spacing:-.03em;color:var(--ink);margin-bottom:8px;line-height:1.15;}
.lesson-meta{font-size:13px;color:var(--ink-faint);margin-bottom:32px;}
.section-label{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-muted);margin:36px 0 16px;}
.section-label .dot{width:6px;height:6px;border-radius:50%;background:var(--green);}
.section-label.quiz .dot{background:var(--violet);}
.section-label.action .dot{background:var(--amber);}
.script-text p{font-size:15.5px;font-weight:400;color:var(--ink-soft);line-height:1.75;margin-bottom:18px;}
.quiz-card{background:var(--bg);border:1px solid var(--bg-line);border-radius:16px;padding:24px;margin-bottom:14px;}
.quiz-q{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:16px;line-height:1.5;}
.quiz-opt{display:flex;align-items:flex-start;gap:12px;padding:13px 15px;border:1.5px solid var(--bg-line);border-radius:11px;margin-bottom:9px;cursor:pointer;transition:border-color .15s,background .15s;}
.quiz-opt:hover{border-color:var(--ink-faint);}
.quiz-opt.correct{border-color:var(--green);background:var(--green-pale);}
.quiz-opt.wrong{border-color:var(--coral);background:var(--coral-pale);}
.quiz-opt.disabled{cursor:default;pointer-events:none;}
.quiz-letter{width:24px;height:24px;border-radius:7px;background:var(--bg-soft);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--ink-muted);flex-shrink:0;}
.quiz-opt.correct .quiz-letter{background:var(--green);color:#fff;}
.quiz-opt.wrong .quiz-letter{background:var(--coral);color:#fff;}
.quiz-opt-text{font-size:13.5px;font-weight:500;color:var(--ink);padding-top:2px;}
.quiz-explain{display:none;font-size:13px;font-weight:400;color:var(--ink-muted);line-height:1.6;background:var(--bg-soft);border-radius:10px;padding:14px 16px;margin-top:8px;}
.quiz-explain.show{display:block;}
.quiz-explain strong{color:var(--ink);}
.action-card{background:var(--amber-pale);border:1px solid var(--amber-bord);border-radius:16px;padding:22px 24px;}
.action-text{font-size:14.5px;font-weight:500;color:var(--ink);line-height:1.65;margin-bottom:16px;}
.action-check{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;}
.action-box{width:22px;height:22px;border-radius:7px;border:2px solid var(--amber);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;transition:background .15s;}
.action-box.checked{background:var(--amber);}
.action-label{font-size:13px;font-weight:700;color:#8a6a00;}
.lesson-nav{display:flex;justify-content:space-between;align-items:center;margin-top:40px;padding-top:24px;border-top:1px solid var(--bg-line);}
.nav-btn{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border:none;cursor:pointer;font-family:var(--sans);font-size:14px;font-weight:700;padding:13px 24px;border-radius:11px;text-decoration:none;transition:background .2s;}
.nav-btn:hover{background:var(--ink-soft);}
.nav-btn.ghost{background:var(--bg-mid);color:var(--ink-muted);}
.nav-btn.ghost:hover{background:var(--bg-line);}
.completion-badge{display:none;align-items:center;gap:8px;background:var(--green-pale);color:var(--green);font-size:12.5px;font-weight:700;padding:8px 16px;border-radius:100px;margin-bottom:20px;}
.completion-badge.show{display:inline-flex;}
@media(max-width:860px){
  .layout{grid-template-columns:1fr;}
  .sidebar{position:static;height:auto;border-right:none;border-bottom:1px solid var(--bg-line);}
  .main{padding:28px 20px 60px;}
}

/* ===== Direction Encre & Laiton — surcouche typographique ===== */
body{font-family:var(--sans);letter-spacing:0;}
h1,h2,h3,h4,.hero-h1,.s-title,.cta-h2,.p-name,.mod-title,.c-title,.hc-title,
.lecon-title,.q-title,.auth-title,.perf-title,.section-title,.edu-title,.tips-title{
  font-family:var(--display);letter-spacing:-.015em;
}
.hero-h1,.s-title,.cta-h2,.auth-title{font-weight:500;letter-spacing:-.018em;line-height:1.16;}
h3,h4,.p-name,.mod-title,.c-title,.hc-title,.lecon-title{font-weight:600;}
.s-tag,.f-copy,.hstat-label,.stat-label,.perf-note,.order-meta,.pos-value,
.price-cell,.asset-label,.badge,.eyebrow,.nav-balance{font-family:var(--mono);}

.nav-name em,.ft-name em{font-style:normal;color:var(--amber);}

/* Mise en valeur dans le corps des lecons : le gras porte la notion a
   retenir, l italique la nuance ou le terme technique. */
.script-text strong{color:var(--ink,#12212B);font-weight:700;}
.script-text em{font-style:italic;color:var(--ink-soft,#43555F);}
.script-text u{text-decoration:none;background:linear-gradient(transparent 62%,var(--amber-pale,#F6EFE0) 62%);
  box-shadow:inset 0 -1px 0 var(--amber,#B8862F);}
.script-text p + p{margin-top:14px;}

/* ===== L'itineraire =====
   Une route verticale plutot qu'une liste : on voit d'ou l'on vient,
   ou l'on est, et ce qu'il reste. Meme vocabulaire graphique que le
   carnet de route et les emblemes. */
.itin{padding:4px 4px 24px;}
.itin-tete{padding:0 8px 16px;border-bottom:1px solid var(--bg-line);margin-bottom:16px;}
.itin-formation{font-family:var(--display);font-size:16px;font-weight:600;color:var(--ink);line-height:1.25;}
.itin-compte{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-muted);margin-top:7px;}
.itin-barre{height:4px;background:var(--bg-mid);border-radius:100px;overflow:hidden;margin-top:10px;}
.itin-barre span{display:block;height:100%;background:var(--amber);border-radius:100px;transition:width .4s cubic-bezier(.4,0,.2,1);}

/* La route */
.route{position:relative;padding-left:30px;}
.route::before{content:"";position:absolute;left:11px;top:14px;bottom:14px;width:2px;
  background:repeating-linear-gradient(var(--bg-line) 0 6px, transparent 6px 11px);}
.etape-i{position:relative;margin-bottom:6px;}
.borne{position:absolute;left:-30px;top:6px;width:24px;height:24px;border-radius:50%;
  background:var(--bg);border:2px solid var(--bg-line);display:grid;place-items:center;
  font-family:var(--mono);font-size:10px;color:var(--ink-faint);z-index:1;transition:all .2s;}
.borne svg{width:11px;height:11px;}
.etape-i.faite .borne{background:var(--amber);border-color:var(--amber);color:#fff;}
.etape-i.ici .borne{background:var(--green);border-color:var(--green);color:#fff;
  box-shadow:0 0 0 4px var(--green-pale);}
.etape-titre{display:block;width:100%;text-align:left;background:transparent;border:0;cursor:pointer;
  font-family:var(--display);font-size:14.5px;font-weight:600;color:var(--ink-soft);
  padding:7px 9px;border-radius:9px;line-height:1.3;transition:background .15s,color .15s;}
.etape-titre:hover{background:var(--bg-soft);color:var(--ink);}
.etape-i.ici .etape-titre{color:var(--green);}
.etape-i.faite .etape-titre{color:var(--ink);}
.etape-meta{font-family:var(--mono);font-size:10px;color:var(--ink-faint);padding:0 9px 4px;letter-spacing:.06em;}

/* Les lecons de l'etape en cours */
.arrets{margin:2px 0 12px;padding-left:9px;border-left:1px solid var(--bg-line);}
.arret{display:flex;align-items:flex-start;gap:9px;padding:7px 9px;border-radius:8px;cursor:pointer;
  font-size:12.8px;font-weight:500;color:var(--ink-muted);transition:background .15s;line-height:1.35;}
.arret:hover{background:var(--bg-soft);color:var(--ink);}
.arret.ici{background:var(--green-pale);color:var(--green);font-weight:700;}
.arret.faite{color:var(--ink);}
.arret.bloque{opacity:.42;cursor:not-allowed;}
.arret.bloque:hover{background:transparent;}
.puce{width:15px;height:15px;border-radius:4px;flex:none;margin-top:1px;border:1.5px solid var(--bg-line);
  display:grid;place-items:center;background:var(--bg);}
.puce svg{width:9px;height:9px;opacity:0;}
.arret.faite .puce{background:var(--amber);border-color:var(--amber);}
.arret.faite .puce svg{opacity:1;}
.arret.ici .puce{border-color:var(--green);border-style:dashed;}

/* Changer de formation sans repasser par le menu */
.escale{margin-top:22px;padding-top:16px;border-top:1px solid var(--bg-line);}
.escale-titre{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-faint);padding:0 9px 9px;}
.escale a{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;text-decoration:none;
  font-size:12.8px;color:var(--ink-soft);transition:background .15s;}
.escale a:hover{background:var(--bg-soft);color:var(--ink);}
.escale a.courante{background:var(--green-pale);color:var(--green);font-weight:700;}
.jeton{width:7px;height:7px;border-radius:50%;background:var(--bg-line);flex:none;}
.escale a.courante .jeton{background:var(--green);}
.escale a.prete .jeton{background:var(--amber);}

@media(max-width:860px){
  .itin{padding-bottom:8px;}
  .route{padding-left:26px;}
  .borne{left:-26px;}
}
@media(prefers-reduced-motion:reduce){*{transition:none !important;}}

/* ===== Schemas des lecons ===== */
.schema{margin:26px 0;padding:20px 18px 14px;border:1px solid var(--bg-line,#DCDDD3);
  border-radius:12px;background:var(--bg,#FCFBF8);}
.schema svg{width:100%;height:auto;display:block;}
.schema figcaption{font-family:var(--mono,monospace);font-size:11.5px;line-height:1.55;
  color:var(--ink-muted,#7A8A93);margin-top:14px;padding-top:12px;
  border-top:1px solid var(--bg-line,#DCDDD3);}
@media(max-width:620px){.schema{padding:14px 12px 10px;margin:20px -6px;}}

.script-text strong{color:var(--ink,#12212B);font-weight:700;}
.script-text em{font-style:italic;color:var(--ink-soft,#43555F);}
.script-text u{text-decoration:none;background:linear-gradient(transparent 62%,var(--amber-pale,#F6EFE0) 62%);
  box-shadow:inset 0 -1px 0 var(--amber,#B8862F);}
.script-text p + p{margin-top:14px;}

/* Sortie de leçon : on peut toujours s'arrêter sans se sentir coincé. */
.lesson-sortie{display:flex;flex-wrap:wrap;align-items:center;gap:9px;justify-content:center;
  margin-top:24px;padding-top:18px;border-top:1px solid var(--bg-line);
  font-size:13.5px;color:var(--ink-faint);}
.lesson-sortie a{color:var(--ink-muted);text-decoration:none;font-weight:600;}
.lesson-sortie a:hover{color:var(--green);}
</style>

<script>
/* ============ DONNÉES DES 18 LEÇONS — BITCOIN & CRYPTOMONNAIES ============ */
const LESSONS = [
{module:"Module 1 — Comprendre Bitcoin", title:"Le problème que Bitcoin cherchait à résoudre", duration:"5 min",
script:[
"Bitcoin naît en 2008, quelques semaines après la faillite de Lehman Brothers, dans un document de 9 pages signé d'un pseudonyme, Satoshi Nakamoto, dont l'identité reste inconnue à ce jour.",
"Le problème posé était technique, et il faut le comprendre pour saisir le reste. <strong>Comment transférer une valeur numérique d'une personne à une autre, sans intermédiaire, sans que cette valeur puisse être dupliquée ?</strong> Un fichier se copie à l'infini. Un euro numérique aussi, sauf si une banque tient le compte et garantit qu'il n'a été dépensé qu'une fois.",
"C'est ce qu'on appelle <em>le problème de la double dépense</em>, et il avait toujours exigé un tiers de confiance. La proposition de Bitcoin est de le résoudre autrement : <u>en faisant tenir le registre par des milliers d'ordinateurs simultanément</u>, chacun vérifiant le travail des autres.",
"Le contexte de 2008 explique l'intention politique du projet. Le document fondateur et les premiers messages de son auteur font explicitement référence à la crise bancaire et à la dépendance envers des institutions. <strong>Bitcoin est né comme une réponse à un problème de confiance</strong>, pas comme un produit d'investissement.",
"Deux caractéristiques ont été inscrites dès l'origine et n'ont jamais changé. <strong>Une quantité plafonnée à 21 millions d'unités</strong>, vérifiable par n'importe qui. Et <strong>un rythme d'émission décroissant</strong>, divisé par 2 à intervalles réguliers, ce que nous verrons plus loin.",
"Il faut immédiatement poser les limites, parce que cette formation ne fait la promotion de rien. <u>Bitcoin n'a pas remplacé les monnaies, il est très peu utilisé comme moyen de paiement, et son prix varie énormément</u>, ce qui contredit l'usage monétaire qu'il visait initialement.",
"Ce que Bitcoin a réellement démontré est plus modeste et plus solide : <strong>qu'un registre partagé peut fonctionner sans autorité centrale pendant plus de 15 ans.</strong> C'est cette démonstration technique, plus que le prix, qui explique l'intérêt qu'il continue de susciter."
],
quiz:[
{q:"Quel problème technique Bitcoin cherchait-il à résoudre ?",opts:["Le blanchiment d'argent","La double dépense d'une valeur numérique sans tiers de confiance","La lenteur des virements","L'inflation"],correct:1,
explain:"Un fichier se copie à l'infini. Sans banque pour tenir le compte, il fallait un autre mécanisme."},
{q:"Comment ce problème est-il résolu ?",opts:["Par un chiffrement plus fort","En faisant tenir le registre par des milliers d'ordinateurs qui se vérifient","Par une autorité internationale","Par une limite de transactions"],correct:1,
explain:"C'est le principe du registre distribué, et c'est ce que Bitcoin a démontré depuis plus de 15 ans."},
{q:"Bitcoin a-t-il rempli son objectif monétaire initial ?",opts:["Oui, il remplace largement les monnaies","Non, il est peu utilisé comme paiement et son prix varie énormément","Oui, dans les pays émergents","Il n'avait pas d'objectif monétaire"],correct:1,
explain:"Sa démonstration réelle est technique : un registre partagé peut fonctionner sans autorité centrale."}
],
action:"Cherche le document fondateur de Bitcoin, disponible gratuitement en ligne, et lis seulement son résumé d'introduction, 2 paragraphes. Comprendre l'intention d'origine change la façon dont on lit tout le reste du sujet."
},
{module:"Module 1 — Comprendre Bitcoin", title:"La blockchain, sans jargon", duration:"5 min",
script:[
"Une blockchain est un registre de transactions, partagé et vérifiable par tous. Pour comprendre son fonctionnement, l'image du cahier collectif reste la plus juste.",
"Imagine un cahier tenu simultanément par des milliers de personnes. Chaque fois qu'une transaction a lieu, elle est annoncée à tout le monde. Les participants vérifient qu'elle est valide, puis l'inscrivent. <strong>Comme tout le monde détient le même cahier, personne ne peut modifier le sien sans être immédiatement contredit par les autres.</strong>",
"Les transactions sont regroupées par paquets, appelés <em>blocs</em>. Chaque bloc contient une empreinte numérique du bloc précédent, ce qui les enchaîne. <u>Modifier une transaction ancienne obligerait à recalculer tous les blocs suivants</u>, sur la majorité des machines du réseau, ce qui est le mécanisme de sécurité central.",
"Reste une question : qui décide de l'ordre des transactions ? C'est le rôle du <strong>minage</strong>. Des machines résolvent un problème de calcul volontairement coûteux, et la première à trouver propose le bloc suivant. Elle est rémunérée pour cela, en unités nouvellement créées et en frais de transaction.",
"Ce mécanisme, appelé <em>preuve de travail</em>, a une conséquence assumée : <strong>il consomme beaucoup d'électricité.</strong> C'est un fait, discuté et documenté, et la part d'énergie décarbonée utilisée fait débat. D'autres réseaux ont adopté un mécanisme différent, la <em>preuve d'enjeu</em>, bien moins consommateur, où la sélection dépend des unités immobilisées plutôt que de la puissance de calcul.",
"Deux idées fausses très répandues méritent d'être corrigées. <strong>La blockchain n'est pas anonyme</strong>, elle est pseudonyme : toutes les transactions sont publiques et traçables, seule l'identité derrière une adresse n'est pas inscrite. Des sociétés spécialisées font profession de relier les 2.",
"<strong>Et la blockchain ne garantit pas la vérité des informations qu'on y inscrit.</strong> Elle garantit qu'une information n'a pas été modifiée après coup. Inscrire une fausse donnée dans une blockchain produit une fausse donnée que plus personne ne pourra corriger."
],
quiz:[
{q:"Pourquoi est-il difficile de modifier une transaction ancienne ?",opts:["Elle est chiffrée","Il faudrait recalculer tous les blocs suivants sur la majorité des machines","Elle est effacée après un an","Seule la banque peut le faire"],correct:1,
explain:"L'enchaînement des blocs par empreinte numérique est le mécanisme de sécurité central."},
{q:"La blockchain est-elle anonyme ?",opts:["Oui, totalement","Non, elle est pseudonyme : les transactions sont publiques et traçables","Oui, sauf pour les autorités","Cela dépend du réseau"],correct:1,
explain:"Seule l'identité derrière une adresse n'est pas inscrite, et des sociétés font profession de relier les 2."},
{q:"Que garantit réellement une blockchain ?",opts:["La vérité des informations inscrites","Qu'une information n'a pas été modifiée après coup","La rentabilité des actifs","L'absence de fraude"],correct:1,
explain:"Une fausse donnée inscrite reste fausse, et devient impossible à corriger."}
],

},
{module:"Module 1 — Comprendre Bitcoin", title:"Le halving et la rareté programmée", duration:"5 min",
script:[
"Le <em>halving</em>, ou division par 2, est le mécanisme qui organise la rareté de Bitcoin. Il est inscrit dans le protocole depuis l'origine et ne dépend d'aucune décision humaine.",
"Le fonctionnement : les machines qui sécurisent le réseau reçoivent une récompense en unités nouvellement créées. <strong>Tous les 210 000 blocs, soit environ 4 ans, cette récompense est divisée par 2.</strong> L'émission diminue donc par paliers, jusqu'à s'arrêter complètement lorsque les 21 millions d'unités auront été émises, ce qui est prévu vers 2140.",
"La comparaison avec l'or éclaire l'intention. <u>Quand le prix de l'or monte, il devient rentable d'ouvrir de nouvelles mines, donc la production augmente et freine la hausse.</u> Avec Bitcoin, ce mécanisme d'ajustement n'existe pas : quel que soit le prix, quelle que soit la puissance de calcul déployée, le rythme d'émission reste identique.",
"<figure class=\"schema\"><svg viewBox=\"0 0 700 168\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><line x1=\"34\" y1=\"96\" x2=\"666\" y2=\"96\" stroke=\"#DCDDD3\" stroke-width=\"2\"/><path d=\"M666 96 l-9 -5 v10 z\" fill=\"#DCDDD3\"/><line x1=\"34\" y1=\"96\" x2=\"34\" y2=\"62\" stroke=\"#1E4B3C\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/><circle cx=\"34\" cy=\"96\" r=\"7\" fill=\"#1E4B3C\"/><circle cx=\"34\" cy=\"96\" r=\"12\" fill=\"none\" stroke=\"#1E4B3C\" stroke-width=\"1\" opacity=\".35\"/><text x=\"34\" y=\"52\" text-anchor=\"start\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14\" font-weight=\"600\" fill=\"#12212B\">2009</text><text x=\"34\" y=\"122\" text-anchor=\"start\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12\" fill=\"#43555F\">50 unités par bloc</text><line x1=\"255\" y1=\"96\" x2=\"255\" y2=\"62\" stroke=\"#B8862F\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/><circle cx=\"255\" cy=\"96\" r=\"7\" fill=\"#B8862F\"/><circle cx=\"255\" cy=\"96\" r=\"12\" fill=\"none\" stroke=\"#B8862F\" stroke-width=\"1\" opacity=\".35\"/><text x=\"255\" y=\"52\" text-anchor=\"middle\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14\" font-weight=\"600\" fill=\"#12212B\">1er halving</text><text x=\"255\" y=\"122\" text-anchor=\"middle\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12\" fill=\"#43555F\">récompense divisée par 2</text><line x1=\"464\" y1=\"96\" x2=\"464\" y2=\"62\" stroke=\"#B8862F\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/><circle cx=\"464\" cy=\"96\" r=\"7\" fill=\"#B8862F\"/><circle cx=\"464\" cy=\"96\" r=\"12\" fill=\"none\" stroke=\"#B8862F\" stroke-width=\"1\" opacity=\".35\"/><text x=\"464\" y=\"52\" text-anchor=\"middle\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14\" font-weight=\"600\" fill=\"#12212B\">Halvings suivants</text><text x=\"464\" y=\"122\" text-anchor=\"middle\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12\" fill=\"#43555F\">émission décroissante</text><line x1=\"666\" y1=\"96\" x2=\"666\" y2=\"62\" stroke=\"#A24332\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/><circle cx=\"666\" cy=\"96\" r=\"7\" fill=\"#A24332\"/><circle cx=\"666\" cy=\"96\" r=\"12\" fill=\"none\" stroke=\"#A24332\" stroke-width=\"1\" opacity=\".35\"/><text x=\"666\" y=\"52\" text-anchor=\"end\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14\" font-weight=\"600\" fill=\"#12212B\">~2140</text><text x=\"666\" y=\"122\" text-anchor=\"end\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12\" fill=\"#43555F\">émission terminée</text></svg><figcaption>Un fait technique documentant une politique d'émission, jamais une prédiction de prix.</figcaption></figure>",
"C'est cette caractéristique qui fait parler de <strong>rareté programmée</strong>, par opposition à une monnaie dont la quantité dépend de décisions institutionnelles, comme la formation sur la monnaie te l'a montré.",
"Maintenant la prudence indispensable. Beaucoup de contenus présentent le halving comme un déclencheur mécanique de hausse, en s'appuyant sur ce qui s'est produit lors des précédents. <strong>Ce raisonnement est fragile pour 3 raisons.</strong> Les occurrences passées sont trop peu nombreuses pour établir quoi que ce soit. L'événement est connu à l'avance de tout le marché, donc théoriquement déjà intégré dans les prix. Et corrélation ne vaut pas causalité, d'autres facteurs ayant coïncidé avec ces périodes.",
"Ce qu'il faut retenir est plus sobre. <strong>Le halving est un fait technique vérifiable, pas une prédiction de prix.</strong> Il documente une politique d'émission, ce qui est différent d'une promesse de valorisation.",
"<u>Quiconque te présente le prochain halving comme une opportunité à saisir te vend quelque chose</u>, et cette phrase vaut pour l'ensemble du secteur."
],
quiz:[
{q:"À quelle fréquence intervient le halving ?",opts:["Chaque année","Environ tous les 4 ans","Tous les 10 ans","À dates variables"],correct:1,
explain:"Tous les 210 000 blocs, la récompense des mineurs est divisée par 2, jusqu'à l'arrêt de l'émission vers 2140."},
{q:"En quoi Bitcoin diffère-t-il de l'or sur l'émission ?",opts:["Il s'extrait plus vite","Une hausse du prix n'augmente pas le rythme d'émission","Il n'a pas de limite","Son émission est décidée par un comité"],correct:1,
explain:"Avec l'or, une hausse rend de nouvelles mines rentables, ce qui freine la hausse. Ce mécanisme n'existe pas ici."},
{q:"Le halving prédit-il une hausse du prix ?",opts:["Oui, historiquement toujours","Non : trop peu d'occurrences, événement connu d'avance, et corrélation n'est pas causalité","Oui, avec 6 mois de décalage","Uniquement en marché haussier"],correct:1,
explain:"C'est un fait technique documentant une politique d'émission, pas une prédiction de valorisation."}
],
action:"Cherche la date du dernier halving et le montant de la récompense actuelle par bloc. Ces 2 informations sont publiques et vérifiables, contrairement aux prédictions de prix qui les accompagnent souvent."
},
{module:"Module 1 — Comprendre Bitcoin", title:"Comparer Bitcoin, l'or et l'euro", duration:"5 min",
script:[
"Reprenons la grille des 6 critères d'une monnaie saine, vue dans la formation sur la monnaie, et appliquons-la honnêtement à ces 3 objets. L'exercice ne désigne aucun gagnant : il montre que chacun est un compromis différent.",
"<strong>La rareté.</strong> L'euro peut être émis en quantité variable selon des décisions institutionnelles. L'or croît d'environ 1,5 à 2 % par an par l'extraction minière. Bitcoin est plafonné à 21 millions d'unités, avec une émission décroissante. <u>Sur ce seul critère, l'ordre est clair, et c'est le seul critère où il l'est.</u>",
"<strong>La durabilité.</strong> L'or est inaltérable et traverse les millénaires. L'euro est durable tant que l'institution qui l'émet existe. Bitcoin dépend d'un réseau informatique fonctionnel et d'un accès à l'électricité, ce qui est une dépendance réelle même si elle n'a jamais été prise en défaut.",
"<strong>La divisibilité et la transportabilité.</strong> Bitcoin excelle : il se divise en 100 millions de fractions et se transporte instantanément. L'or est le plus mauvais des 3 sur ce point. L'euro est excellent.",
"<figure class=\"schema\"><svg viewBox=\"0 0 700 228\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"200\" y=\"20\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" letter-spacing=\"1.4\" fill=\"#1E4B3C\">CE QUI EST SOLIDE</text><text x=\"560\" y=\"20\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" letter-spacing=\"1.4\" fill=\"#B8862F\">CE QUI EST FAIBLE</text><text x=\"20\" y=\"44\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#43555F\">Euro</text><rect x=\"20\" y=\"54\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#EFF0EA\"/><rect x=\"20\" y=\"54\" width=\"475\" height=\"18\" rx=\"5\" fill=\"#E7EFEA\"/><rect x=\"495\" y=\"54\" width=\"185\" height=\"18\" rx=\"5\" fill=\"#F6EFE0\"/><text x=\"28\" y=\"67\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#1E4B3C\">stabilité, acceptation</text><text x=\"672\" y=\"67\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8E661F\">rareté</text><text x=\"20\" y=\"100\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#43555F\">Or</text><rect x=\"20\" y=\"110\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#EFF0EA\"/><rect x=\"20\" y=\"110\" width=\"436\" height=\"18\" rx=\"5\" fill=\"#E7EFEA\"/><rect x=\"456\" y=\"110\" width=\"224\" height=\"18\" rx=\"5\" fill=\"#F6EFE0\"/><text x=\"28\" y=\"123\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#1E4B3C\">rareté, durabilité</text><text x=\"672\" y=\"123\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8E661F\">transportabilité</text><text x=\"20\" y=\"156\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#43555F\">Bitcoin</text><rect x=\"20\" y=\"166\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#EFF0EA\"/><rect x=\"20\" y=\"166\" width=\"330\" height=\"18\" rx=\"5\" fill=\"#E7EFEA\"/><rect x=\"350\" y=\"166\" width=\"330\" height=\"18\" rx=\"5\" fill=\"#F6EFE0\"/><text x=\"28\" y=\"179\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#1E4B3C\">rareté, vérifiabilité</text><text x=\"672\" y=\"179\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8E661F\">stabilité, ancienneté</text></svg><figcaption>Aucun ne l'emporte sur tous les critères. Chacun est un compromis différent, à choisir selon l'usage.</figcaption></figure>",
"<strong>La vérifiabilité.</strong> Bitcoin est vérifiable par tous, en permanence, ce qui est sa force la plus incontestable. L'or demande une expertise. L'euro repose sur des dispositifs de sécurité physiques.",
"<strong>La stabilité, critère absent de la grille classique et pourtant décisif.</strong> C'est ici que Bitcoin échoue nettement : <u>des variations de 70 % ou plus sont survenues à plusieurs reprises depuis sa création.</u> Une monnaie dont le pouvoir d'achat peut être divisé par 3 en un an ne peut pas servir d'unité de compte, ce qui est l'une des 3 fonctions monétaires.",
"La conclusion est donc nuancée, et je te la donne telle quelle. <strong>L'euro reste supérieur pour vivre. L'or a démontré sa capacité à traverser de très longues périodes. Bitcoin est un actif jeune, de moins de 20 ans, très volatil, sur lequel des experts sérieux divergent profondément.</strong>",
"Ce dernier point est un fait à connaître, pas une position à trancher, et personne ne devrait te le présenter autrement."
],
quiz:[
{q:"Sur quel critère l'ordre entre les 3 est-il clair ?",opts:["La stabilité","La rareté","La durabilité","L'acceptation"],correct:1,
explain:"Et c'est le seul critère où il l'est. Sur tous les autres, chacun est un compromis différent."},
{q:"Pourquoi Bitcoin ne peut-il pas servir d'unité de compte ?",opts:["Il est trop divisible","Sa volatilité peut diviser son pouvoir d'achat par 3 en un an","Il n'est pas accepté","Il est trop récent"],correct:1,
explain:"L'unité de compte est l'une des 3 fonctions monétaires, et elle exige une certaine stabilité."},
{q:"Quelle est la faiblesse historique de l'or ?",opts:["Sa rareté","Sa transportabilité","Sa vérifiabilité","Sa durabilité"],correct:1,
explain:"C'est la raison pour laquelle les billets, initialement des reçus de dépôt, se sont imposés."}
],
action:"Reprends le tableau à 6 critères que tu avais rempli dans la formation sur la monnaie et ajoute une septième ligne : la stabilité. Le classement change probablement, et c'est exactement l'intérêt de l'exercice."
},
{module:"Module 2 — L'écosystème", title:"Bitcoin, Ethereum et les milliers d'autres", duration:"5 min",
script:[
"Il existe aujourd'hui des dizaines de milliers de crypto-actifs. Les distinguer est indispensable, parce qu'ils ne relèvent pas du tout de la même nature ni du même risque.",
"<strong>Bitcoin</strong> vise un usage unique : transférer et conserver de la valeur sans intermédiaire. Son protocole évolue lentement et volontairement, la stabilité étant considérée comme une qualité plutôt qu'un frein.",
"<strong>Ethereum</strong> poursuit un objectif différent : permettre l'exécution de programmes sur un réseau décentralisé, appelés <em>contrats intelligents</em>. Ce sont des programmes qui s'exécutent automatiquement quand des conditions sont réunies. C'est cette capacité qui a permis l'apparition de la finance décentralisée et des jetons non fongibles.",
"<strong>Les milliers d'autres.</strong> Certains projets poursuivent des objectifs techniques sérieux. Beaucoup n'ont ni utilisateurs, ni revenus, ni utilité démontrée. Et une part significative disparaît chaque année : <u>de nombreux jetons lancés au cours des cycles précédents ne valent plus rien aujourd'hui.</u>",
"Voici la grille de lecture la plus utile, applicable à n'importe quel projet. <strong>1. Qui l'utilise réellement, et pour quoi faire ?</strong> Pas le nombre d'abonnés sur les réseaux, mais des usages vérifiables. <strong>2. Le jeton est-il nécessaire au fonctionnement</strong>, ou greffé sur un projet qui pourrait s'en passer ? <strong>3. Qui détient les jetons</strong>, et quelle part revient aux fondateurs ? <strong>4. Le code est-il public et audité ?</strong>",
"Un cas à part : les <strong>jetons mèmes</strong>, créés sans aucune prétention d'utilité, dont la valeur repose uniquement sur l'attention collective. Ils ne relèvent pas de l'investissement mais du pari, et il faut appeler cela par son nom.",
"Un phénomène à connaître, parce qu'il piège beaucoup de débutants : <strong>lors des phases d'euphorie, les projets les plus fragiles montent le plus fort</strong>, ce qui donne l'illusion qu'ils sont les meilleurs. C'est mécanique : ils sont plus petits, donc plus faciles à faire bouger. La même mécanique s'applique à la baisse."
],
quiz:[
{q:"Quelle est la différence essentielle entre Bitcoin et Ethereum ?",opts:["Leur prix","Bitcoin vise le transfert de valeur, Ethereum l'exécution de programmes décentralisés","Leur pays d'origine","Leur niveau de sécurité"],correct:1,
explain:"Ce sont 2 objectifs distincts, et donc 2 natures de risque différentes."},
{q:"Quelle question poser en premier devant un projet crypto ?",opts:["Quel est son potentiel de hausse ?","Qui l'utilise réellement, et pour quoi faire ?","Qui en fait la promotion ?","Quelle est sa capitalisation ?"],correct:1,
explain:"Des usages vérifiables, pas un nombre d'abonnés sur les réseaux sociaux."},
{q:"Pourquoi les projets fragiles montent-ils le plus en phase d'euphorie ?",opts:["Ils sont mieux conçus","Ils sont plus petits, donc plus faciles à faire bouger","Ils sont soutenus par des institutions","Leur offre est plus limitée"],correct:1,
explain:"La même mécanique s'applique à la baisse, souvent bien plus brutalement."}
],
action:"Choisis un projet crypto dont on t'a parlé récemment et applique les 4 questions de la grille. Si tu ne trouves pas de réponse claire aux 4, tu as ta réponse, et elle t'aura coûté 15 minutes au lieu de plusieurs centaines d'euros."
},
{module:"Module 2 — L'écosystème", title:"Plateformes centralisées et décentralisées", duration:"5 min",
script:[
"Pour acquérir des crypto-actifs, 2 voies existent, et leurs risques n'ont rien de comparable.",
"<strong>Les plateformes centralisées</strong> fonctionnent comme un courtier : tu ouvres un compte, tu vérifies ton identité, tu déposes des euros et tu achètes. Elles sont simples d'usage et constituent la porte d'entrée de la quasi-totalité des débutants.",
"Leur risque principal est souvent mal compris. Quand tu laisses tes actifs sur une plateforme, <u>tu ne détiens pas ces actifs : tu détiens une créance sur la plateforme.</u> C'est le sens de la formule répandue dans le secteur, <em>« pas tes clés, pas tes cryptos »</em>. Plusieurs plateformes importantes ont fait faillite en emportant les avoirs de leurs clients, et ce n'est pas une hypothèse théorique.",
"<strong>Les plateformes décentralisées</strong> fonctionnent sans intermédiaire : tu connectes ton propre portefeuille et tu échanges directement, via des programmes automatisés. Tu conserves donc le contrôle de tes actifs à tout moment.",
"En contrepartie, tu assumes la totalité des risques techniques : <strong>une erreur d'adresse est irréversible, un programme mal conçu peut être vidé, et personne ne répondra à ta réclamation</strong> puisqu'il n'y a personne. Ces plateformes ne conviennent pas à un débutant, et le dire n'est pas de la condescendance mais de la prudence élémentaire.",
"Le cadre réglementaire a nettement évolué. Le règlement européen MiCA impose désormais un agrément aux prestataires de services sur crypto-actifs, avec des obligations de ségrégation des avoirs, d'information et de solidité financière. <strong>Vérifier qu'une plateforme est enregistrée ou agréée pour opérer en France est devenu la première chose à faire</strong>, et l'information est publique.",
"Il faut cependant être clair sur la portée de cette protection : <u>un agrément encadre le fonctionnement du prestataire, il ne garantit ni la valeur des actifs ni l'absence de perte.</u> Aucun mécanisme comparable à la garantie des dépôts bancaires n'existe pour les crypto-actifs."
],
quiz:[
{q:"Que détiens-tu quand tes actifs restent sur une plateforme centralisée ?",opts:["Les actifs eux-mêmes","Une créance sur la plateforme","Un titre de propriété enregistré","Un contrat d'assurance"],correct:1,
explain:"C'est le sens de la formule « pas tes clés, pas tes cryptos ». Plusieurs faillites l'ont démontré concrètement."},
{q:"Quel risque assumes-tu sur une plateforme décentralisée ?",opts:["Le risque de faillite de l'opérateur","La totalité des risques techniques, sans recours possible","Un risque fiscal accru","Aucun risque particulier"],correct:1,
explain:"Une erreur d'adresse est irréversible et personne ne répondra, puisqu'il n'y a personne."},
{q:"Que garantit l'agrément d'une plateforme ?",opts:["La valeur des actifs","Un encadrement du fonctionnement du prestataire, sans garantie contre les pertes","Le remboursement en cas de faillite","Un rendement minimum"],correct:1,
explain:"Aucun mécanisme comparable à la garantie des dépôts bancaires n'existe pour les crypto-actifs."}
],
action:"Si tu utilises une plateforme, vérifie ce soir si elle est enregistrée ou agréée pour opérer en France. L'information est publique et se trouve en quelques minutes. Si elle ne l'est pas, c'est une information à prendre au sérieux."
},
{module:"Module 2 — L'écosystème", title:"Les stablecoins, et ce qu'ils garantissent vraiment", duration:"5 min",
script:[
"Un <em>stablecoin</em> est un crypto-actif dont la valeur est censée rester alignée sur une monnaie officielle, le plus souvent le dollar ou l'euro. Il sert à circuler dans l'univers crypto sans subir la volatilité, et il représente une part considérable des échanges.",
"Trois familles existent, et leurs risques n'ont rien de comparable.",
"<strong>Les stablecoins adossés à des réserves.</strong> L'émetteur détient des actifs, dépôts bancaires et titres de dette à court terme, censés couvrir chaque unité émise. Leur solidité dépend entièrement de 2 choses : <u>la qualité réelle de ces réserves et la fiabilité de leur vérification par un tiers indépendant.</u> Ce point a fait l'objet de contestations sérieuses par le passé.",
"<strong>Les stablecoins adossés à d'autres crypto-actifs.</strong> La garantie est déposée en crypto, avec une sur-couverture pour absorber la volatilité. Le mécanisme est transparent puisqu'il est inscrit dans un programme public, mais il reste exposé à une chute brutale des actifs déposés.",
"<strong>Les stablecoins algorithmiques.</strong> Aucune réserve : un programme est censé maintenir la parité en ajustant l'offre. <strong>Cette famille a produit l'un des effondrements les plus violents du secteur en 2022</strong>, avec la disparition de dizaines de milliards de dollars en quelques jours. Le mécanisme n'a pas résisté à une perte de confiance.",
"Le règlement européen MiCA encadre désormais ces actifs, avec des exigences de réserves et d'information pour les émetteurs opérant dans l'Union. <strong>C'est un progrès réel, qui ne supprime pas le risque</strong> mais le rend plus lisible.",
"Un usage à connaître et une mise en garde. Certaines plateformes proposent des rendements sur des stablecoins déposés. <u>Un rendement n'apparaît jamais sans contrepartie : il rémunère un prêt, un risque de contrepartie ou une stratégie</u> qu'il faut pouvoir nommer. Si personne ne peut t'expliquer d'où vient ce rendement en 2 phrases, l'information manquante est précisément le risque."
],
quiz:[
{q:"Quelle famille de stablecoin ne repose sur aucune réserve ?",opts:["Les stablecoins adossés à des dépôts","Les stablecoins algorithmiques","Les stablecoins adossés à des crypto-actifs","Toutes ont des réserves"],correct:1,
explain:"Cette famille a produit l'un des effondrements les plus violents du secteur en 2022."},
{q:"De quoi dépend la solidité d'un stablecoin adossé à des réserves ?",opts:["De sa capitalisation","De la qualité réelle des réserves et de la fiabilité de leur vérification","Du nombre d'utilisateurs","De sa plateforme d'échange"],correct:1,
explain:"Ce point a fait l'objet de contestations sérieuses par le passé, et il reste le critère central."},
{q:"Que penser d'un rendement proposé sur des stablecoins ?",opts:["C'est un revenu sans risque","Il rémunère toujours quelque chose : prêt, contrepartie ou stratégie à identifier","Il est garanti par MiCA","Il équivaut à un livret bancaire"],correct:1,
explain:"Si personne ne peut expliquer d'où vient ce rendement en 2 phrases, l'information manquante est le risque."}
],
action:"Si tu détiens ou envisages de détenir un stablecoin, cherche 10 minutes qui l'émet, quelles réserves il déclare et qui les vérifie. Ces informations doivent être publiques. Leur absence est en soi une réponse."
},
{module:"Module 3 — Décider avec méthode", title:"Les crypto-actifs ont-ils une place chez toi ?", duration:"5 min",
script:[
"Cette leçon ne te dira pas quelle part y consacrer, et ce n'est pas une prudence de façade : <strong>NiouDem n'émet aucune recommandation d'allocation</strong>, et le conseil en crypto-actifs est une activité réglementée. Elle te donne une grille pour décider seul.",
"<strong>Question 1 : les 4 étapes préalables sont-elles franchies ?</strong> Découvert comblé, fonds d'urgence constitué, dettes chères remboursées, et une épargne long terme déjà en place. Si l'une manque, la question ne se pose pas encore. <u>Les crypto-actifs sont l'actif le plus volatil accessible au grand public</u>, ils ne peuvent pas précéder les fondations.",
"<strong>Question 2 : peux-tu perdre la totalité de cette somme sans conséquence sur ta vie ?</strong> Pas « serais-tu déçu », mais : est-ce que cela changerait quelque chose à ton logement, à tes projets, à ta tranquillité ? Si la réponse est oui, le montant est trop élevé.",
"<figure class=\"schema\"><svg viewBox=\"0 0 700 350\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"20\" y=\"266\" width=\"250\" height=\"52\" rx=\"9\" fill=\"#E7EFEA\" stroke=\"#1E4B3C\" stroke-width=\"1.4\"/><circle cx=\"46\" cy=\"292\" r=\"12\" fill=\"#1E4B3C\"/><text x=\"46\" y=\"296\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\" fill=\"#fff\">1</text><text x=\"70\" y=\"288\" font-family=\"Newsreader, Georgia, serif\" font-size=\"15\" font-weight=\"600\" fill=\"#12212B\">Découvert comblé</text><text x=\"70\" y=\"305\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#43555F\">Rien ne se construit sur un compte à découvert.</text><rect x=\"20\" y=\"202\" width=\"350\" height=\"52\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#DCDDD3\" stroke-width=\"1.4\"/><circle cx=\"46\" cy=\"228\" r=\"12\" fill=\"#DCDDD3\"/><text x=\"46\" y=\"232\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\" fill=\"#fff\">2</text><text x=\"70\" y=\"224\" font-family=\"Newsreader, Georgia, serif\" font-size=\"15\" font-weight=\"600\" fill=\"#12212B\">Fonds d'urgence constitué</text><text x=\"70\" y=\"241\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#43555F\">Disponible immédiatement, sans risque de perte.</text><rect x=\"20\" y=\"138\" width=\"450\" height=\"52\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#DCDDD3\" stroke-width=\"1.4\"/><circle cx=\"46\" cy=\"164\" r=\"12\" fill=\"#DCDDD3\"/><text x=\"46\" y=\"168\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\" fill=\"#fff\">3</text><text x=\"70\" y=\"160\" font-family=\"Newsreader, Georgia, serif\" font-size=\"15\" font-weight=\"600\" fill=\"#12212B\">Dettes chères remboursées</text><text x=\"70\" y=\"177\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#43555F\">Un rendement certain, que peu de placements égalent.</text><rect x=\"20\" y=\"74\" width=\"550\" height=\"52\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#DCDDD3\" stroke-width=\"1.4\"/><circle cx=\"46\" cy=\"100\" r=\"12\" fill=\"#DCDDD3\"/><text x=\"46\" y=\"104\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\" fill=\"#fff\">4</text><text x=\"70\" y=\"96\" font-family=\"Newsreader, Georgia, serif\" font-size=\"15\" font-weight=\"600\" fill=\"#12212B\">Épargne long terme en place</text><text x=\"70\" y=\"113\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#43555F\">Enveloppes ouvertes, versements réguliers.</text><rect x=\"20\" y=\"10\" width=\"650\" height=\"52\" rx=\"9\" fill=\"#F6EFE0\" stroke=\"#B8862F\" stroke-width=\"1.4\"/><circle cx=\"46\" cy=\"36\" r=\"12\" fill=\"#B8862F\"/><text x=\"46\" y=\"40\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\" fill=\"#fff\">5</text><text x=\"70\" y=\"32\" font-family=\"Newsreader, Georgia, serif\" font-size=\"15\" font-weight=\"600\" fill=\"#12212B\">Alors seulement, actifs volatils</text><text x=\"70\" y=\"49\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#43555F\">Avec une somme dont la disparition ne change rien.</text></svg><figcaption>Les crypto-actifs sont les plus volatils accessibles au grand public : ils ne peuvent pas précéder les fondations.</figcaption></figure>",
"<strong>Question 3 : as-tu compris ce que tu achètes ?</strong> Peux-tu expliquer en 2 minutes à quelqu'un d'autre ce qu'est cet actif, qui l'émet, à quoi il sert et pourquoi il pourrait valoir quelque chose ? Si tu ne le peux pas, le problème n'est pas le prix, c'est la compréhension.",
"<strong>Question 4 : sur quel horizon ?</strong> Les cycles observés jusqu'ici s'étalent sur plusieurs années, avec des baisses de 70 % ou plus entre les sommets. Un horizon inférieur à 4 ou 5 ans expose à devoir vendre au pire moment.",
"<strong>Question 5 : es-tu prêt à assumer la conservation ?</strong> Clés, sauvegardes, transmission en cas de décès. C'est le sujet du module suivant, et il est plus exigeant qu'on ne l'imagine.",
"Une seule règle mérite d'être retenue de cette leçon, et elle vaut pour tout actif volatil : <strong>ne jamais engager une somme dont la disparition changerait quelque chose à ta vie.</strong> Ce n'est pas une formule de précaution juridique, c'est ce qui distingue un investisseur d'un joueur."
],

{module:"Module 3 — Décider avec méthode", title:"La régularité appliquée aux actifs volatils", duration:"5 min",
script:[
"Le versement régulier, vu dans la formation sur la bourse, prend une importance particulière sur des actifs très volatils. Cette leçon explique pourquoi, sans désigner aucun actif en particulier.",
"Le principe est identique : verser un montant fixe à date fixe, sans se demander si le moment est bon. Sur un actif dont le prix peut varier de 70 % en un an, <strong>l'effet de lissage est mécaniquement bien plus marqué que sur un indice actions.</strong>",
"Un exemple chiffré rend la chose concrète. Sur 4 versements de 100 € à des prix de 40 000, 25 000, 30 000 et 55 000 unités de compte, ton prix moyen d'acquisition sera nettement inférieur à la moyenne arithmétique de ces 4 prix. <u>C'est arithmétique, pas magique : à somme fixe, un prix bas achète mécaniquement plus de quantité.</u>",
"L'avantage principal reste cependant psychologique, et il est décisif sur ce type d'actif. <strong>Personne ne parvient à acheter volontairement pendant un effondrement.</strong> Un versement automatique le fait sans demander l'avis de ton cerveau, précisément au moment où il te déconseillerait de le faire.",
"Trois précautions propres à ce secteur. <strong>1. Les frais.</strong> Certaines plateformes prélèvent 1 à 2 % par achat, ce qui est considérable sur de petits versements réguliers. Vérifie la grille tarifaire avant de programmer quoi que ce soit.",
"<strong>2. La fiscalité du suivi.</strong> Chaque versement complique le calcul de la plus-value, dont la méthode française rapporte chaque cession à la valeur globale du portefeuille. Tenir un registre au fil de l'eau devient obligatoire, comme nous le verrons.",
"<strong>3. La règle de sortie, écrite à l'avance.</strong> C'est le point que presque personne n'anticipe. <strong>Verser régulièrement suppose de savoir quand et comment tu vendras</strong>, sinon tu accumules indéfiniment un actif que tu ne convertiras jamais. Écris-le maintenant : à quel horizon, dans quelles conditions, et par quelles fractions.",
"Retiens l'essentiel : <u>la régularité ne réduit pas le risque de l'actif, elle réduit le risque lié à ton comportement.</u> Sur un actif qui peut perdre 80 %, cette distinction est capitale."
],
quiz:[
{q:"Pourquoi l'effet de lissage est-il plus marqué sur un actif volatil ?",opts:["Les frais sont plus faibles","Parce que les écarts de prix entre versements sont bien plus importants","Parce que les marchés sont ouverts en continu","Ce n'est pas le cas"],correct:1,
explain:"À somme fixe, un prix bas achète mécaniquement plus de quantité. C'est arithmétique, pas magique."},
{q:"Que réduit réellement le versement régulier ?",opts:["Le risque de l'actif","Le risque lié à ton comportement","Les frais de transaction","La fiscalité"],correct:1,
explain:"Sur un actif qui peut perdre 80 %, cette distinction est capitale et souvent passée sous silence."},
{q:"Que faut-il écrire avant de programmer des versements ?",opts:["Un objectif de prix","Sa règle de sortie : horizon, conditions et fractions","La liste des actifs à surveiller","Un budget publicitaire"],correct:1,
explain:"Sans règle de sortie, on accumule indéfiniment un actif qu'on ne convertira jamais."}
],
action:"Si tu détiens déjà des crypto-actifs, écris ce soir ta règle de sortie en 3 lignes : à quel horizon, dans quelles conditions, et par quelles fractions. C'est la question que presque personne ne se pose avant d'acheter."
},
{module:"Module 3 — Décider avec méthode", title:"Reconnaître une arnaque", duration:"5 min",
script:[
"Le secteur des crypto-actifs concentre une proportion importante d'escroqueries, pour 3 raisons structurelles : les transactions sont irréversibles, les frontières n'existent pas, et la technicité du sujet permet de masquer le vide. Cette leçon donne des signaux vérifiables.",
"<strong>Signal 1 : un rendement promis, surtout s'il est régulier.</strong> Aucun actif volatil ne peut garantir un rendement. Une promesse de 2 % par mois ou de 30 % par an relève soit de l'escroquerie pure, soit d'un montage où les premiers sont payés par les suivants.",
"<strong>Signal 2 : l'urgence.</strong> Offre limitée, place réservée, cours qui va exploser. <u>L'urgence n'a qu'une fonction : t'empêcher de vérifier.</u> C'est le signal le plus fiable de tous, parce qu'aucun projet sérieux n'a besoin de te presser.",
"<strong>Signal 3 : le parrainage rémunéré.</strong> Quand le gain principal vient du recrutement de nouveaux participants plutôt que de l'activité elle-même, la structure est pyramidale par construction, quel que soit l'habillage technologique.",
"<strong>Signal 4 : l'accompagnement personnalisé non sollicité.</strong> Un inconnu qui te contacte, se montre patient, s'intéresse à ta vie, puis oriente vers une plateforme d'investissement. Cette méthode a un nom dans le secteur et elle est extrêmement répandue. <strong>Le signe distinctif est qu'on t'aide d'abord à retirer une petite somme avec profit</strong>, pour établir la confiance avant le versement important.",
"<strong>Signal 5 : l'impossibilité de retirer.</strong> Des frais de déblocage apparaissent, une taxe à régler avant retrait, un problème technique. <u>Toute demande de paiement supplémentaire pour récupérer son argent est le signe d'une escroquerie, sans aucune exception.</u>",
"Trois vérifications valent mieux que toutes les intuitions. Consulte la <strong>liste noire de l'Autorité des marchés financiers</strong>, publique et gratuite. Vérifie l'enregistrement de la plateforme auprès du régulateur français. Et cherche le nom du projet suivi du mot « arnaque » avant de verser quoi que ce soit.",
"Enfin, si tu es victime, sache ceci : <strong>signale-le, même sans espoir de récupération.</strong> Il existe des plateformes de signalement officielles, et le premier réflexe des victimes, la honte, est précisément ce qui protège les escrocs."
],
quiz:[
{q:"Quel est le signal le plus fiable d'une arnaque ?",opts:["Un site mal traduit","L'urgence, dont la seule fonction est d'empêcher de vérifier","Un rendement modeste","Une plateforme étrangère"],correct:1,
explain:"Aucun projet sérieux n'a besoin de te presser. C'est le signal le plus constant, tous secteurs confondus."},
{q:"Que signifie une demande de paiement pour débloquer un retrait ?",opts:["Une contrainte fiscale normale","Une escroquerie, sans aucune exception","Un problème technique temporaire","Une exigence réglementaire"],correct:1,
explain:"Aucune plateforme légitime ne demande un versement supplémentaire pour restituer des fonds."},
{q:"Quelle vérification gratuite existe en France ?",opts:["Un audit bancaire","La liste noire de l'Autorité des marchés financiers","Un contrôle fiscal préalable","Aucune"],correct:1,
explain:"Elle est publique, gratuite, et consultable en quelques minutes avant tout versement."}
],
action:"Consulte la liste noire de l'Autorité des marchés financiers et parcours-la 5 minutes. Repère le type de noms qui y figurent : sérieux, rassurants, professionnels. C'est exactement ce qui rend ces arnaques efficaces."
},
{module:"Module 4 — Sécuriser ce que tu détiens", title:"Clés privées et phrase de récupération", duration:"5 min",
script:[
"La conservation est le sujet le plus important de cette formation, et le plus négligé. <strong>Des sommes considérables sont définitivement perdues chaque année</strong>, non par escroquerie, mais par erreur de conservation.",
"Le principe est déroutant au premier abord. Tes crypto-actifs ne sont stockés nulle part : <u>ils sont inscrits sur la blockchain, et ce que tu détiens est la clé qui permet de les déplacer.</u> Un portefeuille ne contient donc pas d'actifs, il contient une clé.",
"<strong>La clé publique</strong> est ton adresse de réception, que tu peux communiquer sans risque. <strong>La clé privée</strong> autorise les mouvements : quiconque la détient contrôle les actifs, définitivement et sans recours.",
"<strong>La phrase de récupération</strong>, souvent appelée <em>seed phrase</em>, est une suite de 12 ou 24 mots générée à la création du portefeuille. Elle permet de régénérer l'ensemble des clés. C'est donc <strong>l'élément le plus sensible qui soit</strong> : qui la possède possède tout, et qui la perd perd tout.",
"<figure class=\"schema\"><svg viewBox=\"0 0 700 338\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"20\" y=\"24\" width=\"190\" height=\"54\" rx=\"9\" fill=\"#EFF0EA\" stroke=\"#12212B\" stroke-width=\"1.5\"/><text x=\"115\" y=\"47\" text-anchor=\"middle\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14.5\" font-weight=\"600\" fill=\"#12212B\">Ta phrase de récupération</text><text x=\"115\" y=\"65\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\" fill=\"#7A8A93\">12 ou 24 mots</text><path d=\"M210 51 C 270 51, 270 66, 330 66\" fill=\"none\" stroke=\"#B8862F\" stroke-width=\"1.8\"/><circle cx=\"330\" cy=\"66\" r=\"4\" fill=\"#B8862F\"/><rect x=\"344\" y=\"43\" width=\"336\" height=\"46\" rx=\"8\" fill=\"#F6EFE0\" stroke=\"#B8862F\" stroke-width=\"1.3\"/><text x=\"360\" y=\"64\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"14\" font-weight=\"600\" fill=\"#12212B\">Sur papier ou métal</text><text x=\"664\" y=\"64\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"13\" fill=\"#B8862F\">jamais numérique</text><path d=\"M210 51 C 270 51, 270 128, 330 128\" fill=\"none\" stroke=\"#B8862F\" stroke-width=\"1.8\"/><circle cx=\"330\" cy=\"128\" r=\"4\" fill=\"#B8862F\"/><rect x=\"344\" y=\"105\" width=\"336\" height=\"46\" rx=\"8\" fill=\"#F6EFE0\" stroke=\"#B8862F\" stroke-width=\"1.3\"/><text x=\"360\" y=\"120\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"14\" font-weight=\"600\" fill=\"#12212B\">Plusieurs copies, lieux distincts</text><text x=\"360\" y=\"137\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11\" fill=\"#B8862F\">feu, eau, vol</text><path d=\"M210 51 C 270 51, 270 190, 330 190\" fill=\"none\" stroke=\"#A24332\" stroke-width=\"1.8\"/><circle cx=\"330\" cy=\"190\" r=\"4\" fill=\"#A24332\"/><rect x=\"344\" y=\"167\" width=\"336\" height=\"46\" rx=\"8\" fill=\"#F8EDEA\" stroke=\"#A24332\" stroke-width=\"1.3\"/><text x=\"360\" y=\"182\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"14\" font-weight=\"600\" fill=\"#12212B\">Jamais communiquée</text><text x=\"360\" y=\"199\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11\" fill=\"#A24332\">aucun support ne la demande</text><path d=\"M210 51 C 270 51, 270 252, 330 252\" fill=\"none\" stroke=\"#1E4B3C\" stroke-width=\"1.8\"/><circle cx=\"330\" cy=\"252\" r=\"4\" fill=\"#1E4B3C\"/><rect x=\"344\" y=\"229\" width=\"336\" height=\"46\" rx=\"8\" fill=\"#E7EFEA\" stroke=\"#1E4B3C\" stroke-width=\"1.3\"/><text x=\"360\" y=\"244\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"14\" font-weight=\"600\" fill=\"#12212B\">Testée avant tout transfert</text><text x=\"360\" y=\"261\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11\" fill=\"#1E4B3C\">une sauvegarde non testée n'en est pas une</text></svg><figcaption>Qui la possède possède tout, qui la perd perd tout. C'est l'élément le plus sensible de toute la formation.</figcaption></figure>",
"Quatre règles de conservation, et aucune n'est optionnelle. <strong>1. Jamais sous forme numérique.</strong> Pas de photo, pas de fichier, pas de cloud, pas de gestionnaire de mots de passe. Une phrase de récupération se note sur papier, ou mieux sur métal.",
"<strong>2. Plusieurs copies, en lieux différents.</strong> Un incendie ou un dégât des eaux détruit un support unique. <strong>3. Jamais communiquée à qui que ce soit</strong>, y compris à un support technique : <u>aucun support légitime ne demandera jamais ta phrase de récupération.</u> <strong>4. Vérifiée</strong> : teste la restauration avec un petit montant avant d'y placer une somme importante.",
"Un point que presque personne n'anticipe et qui mérite une vraie réflexion : <strong>que se passe-t-il si tu disparais ?</strong> Sans transmission organisée, ces actifs sont perdus pour tes proches, définitivement. Prévoir cela suppose un dispositif réfléchi, qui protège de ton vivant tout en permettant l'accès après.",
"C'est un vrai sujet, sans solution universelle, et c'est une raison sérieuse de limiter la complexité de ce que tu détiens."
],

{module:"Module 4 — Sécuriser ce que tu détiens", title:"Portefeuille connecté ou hors ligne", duration:"5 min",
script:[
"Il existe 3 façons de conserver des crypto-actifs, avec des niveaux de risque très différents. Le choix dépend du montant et de la fréquence d'usage.",
"<strong>Sur une plateforme.</strong> Tu ne détiens aucune clé, tu détiens une créance sur l'établissement. C'est la solution la plus simple et celle qui expose au risque de faillite ou de piratage de la plateforme. Elle convient à de petits montants et à un usage fréquent.",
"<strong>Le portefeuille connecté</strong>, souvent appelé <em>hot wallet</em> : une application sur ton téléphone ou ton ordinateur, dont tu détiens les clés. Tu es réellement propriétaire, mais <u>les clés se trouvent sur un appareil connecté à internet</u>, donc exposé aux logiciels malveillants.",
"<strong>Le portefeuille matériel</strong>, ou <em>cold wallet</em> : un boîtier dédié qui conserve les clés hors ligne. Les transactions y sont signées à l'intérieur de l'appareil, et la clé ne le quitte jamais. C'est le niveau de sécurité le plus élevé accessible à un particulier.",
"Une organisation raisonnable consiste à répartir selon l'usage, comme on répartit son argent entre compte courant et livret. <strong>Un petit montant sur la plateforme pour les opérations courantes, l'essentiel sur un portefeuille matériel.</strong>",
"Trois précautions sur les portefeuilles matériels, où les erreurs coûtent cher. <strong>1. Achète uniquement chez le fabricant</strong>, jamais d'occasion ni sur une place de marché : un appareil préconfiguré peut contenir une phrase de récupération déjà connue d'un tiers. <strong>2. Génère toi-même la phrase</strong> à la première utilisation. <u>Un appareil neuf ne doit jamais arriver avec une phrase déjà inscrite</u>, et si c'est le cas, il est compromis.",
"<strong>3. La sauvegarde compte plus que l'appareil.</strong> Si le boîtier casse ou se perd, la phrase de récupération permet de tout restaurer sur un nouveau. À l'inverse, un appareil intact sans sauvegarde ne protège de rien en cas de vol ou d'oubli du code.",
"Retiens la hiérarchie : <strong>c'est la qualité de ta sauvegarde qui détermine ta sécurité, pas le prix du matériel.</strong>"
],
quiz:[
{q:"Quelle solution offre le niveau de sécurité le plus élevé ?",opts:["La plateforme d'échange","Le portefeuille matériel, dont la clé ne quitte jamais l'appareil","Le portefeuille connecté","Un fichier chiffré"],correct:1,
explain:"Les transactions sont signées à l'intérieur du boîtier, hors ligne, ce qui neutralise les logiciels malveillants."},
{q:"Pourquoi ne jamais acheter un portefeuille matériel d'occasion ?",opts:["La garantie ne s'applique plus","Un appareil préconfiguré peut contenir une phrase déjà connue d'un tiers","Les mises à jour sont bloquées","Le prix est équivalent"],correct:1,
explain:"Un appareil neuf ne doit jamais arriver avec une phrase déjà inscrite. Si c'est le cas, il est compromis."},
{q:"Qu'est-ce qui détermine réellement ta sécurité ?",opts:["Le prix du matériel","La qualité de ta sauvegarde","La marque de l'appareil","Le nombre de portefeuilles"],correct:1,
explain:"Un appareil intact sans sauvegarde ne protège de rien en cas de vol ou d'oubli du code."}
],
action:"Fais l'inventaire de ce que tu détiens et où : plateforme, application, boîtier. Puis pose-toi une question simple : si mon téléphone était volé ce soir, que perdrais-je ? La réponse dicte ce que tu dois changer en premier."
},
{module:"Module 4 — Sécuriser ce que tu détiens", title:"Configurer un portefeuille matériel", duration:"5 min",
script:[
"Cette leçon décrit la configuration pas à pas. L'opération prend une trentaine de minutes et comporte 2 moments où une erreur est irréversible : ils sont signalés.",
"<strong>Étape 1 : vérifier l'intégrité du colis.</strong> Emballage scellé, appareil neuf, aucune phrase de récupération fournie. <u>Si une phrase est déjà inscrite quelque part dans la boîte, l'appareil est compromis</u> : ne l'utilise pas et contacte le fabricant.",
"<strong>Étape 2 : installer le logiciel officiel</strong>, en tapant l'adresse du fabricant à la main dans ton navigateur. N'utilise jamais un lien reçu par message, ni un résultat sponsorisé dans un moteur de recherche : les faux sites imitant les fabricants sont une méthode d'attaque courante.",
"<strong>Étape 3 : initialiser l'appareil</strong> et choisir un code confidentiel. Il protège l'accès physique au boîtier. Choisis-le suffisamment long et sans lien avec toi.",

"Une règle de synthèse : <strong>en crypto, il n'existe ni service client, ni annulation, ni recours.</strong> Cette absence de filet impose un niveau de rigueur supérieur à tout ce que tu connais par ailleurs, et c'est un argument sérieux pour limiter les montants concernés."

{module:"Module 5 — Fiscalité et durée", title:"La fiscalité des crypto-actifs en France", duration:"5 min",
script:[
"La fiscalité des crypto-actifs est mal connue, et ses erreurs coûtent cher parce qu'elles portent souvent sur des obligations déclaratives dont la sanction est indépendante des montants.",
"<strong>Règle 1, qui surprend souvent : l'échange d'un crypto-actif contre un autre n'est pas imposable.</strong> Tant que tu restes à l'intérieur de l'univers crypto, aucun impôt n'est dû. <u>Le fait générateur est la conversion en monnaie ayant cours légal</u>, ou l'achat d'un bien ou d'un service payé en crypto.",
"<strong>Règle 2 : le régime applicable.</strong> Pour un particulier gérant son patrimoine privé, les plus-values de cession relèvent du prélèvement forfaitaire unique de <strong>30 %</strong>, avec possibilité d'opter pour le barème progressif si celui-ci est plus favorable, ce qui est le cas pour les taux marginaux faibles. Une exonération existe lorsque <u>le total annuel des cessions ne dépasse pas 305 €</u>.",
"<strong>Règle 3 : la méthode de calcul.</strong> Elle est particulière et déroute. On ne calcule pas ligne par ligne : la formule rapporte le prix de cession à la valeur globale du portefeuille au moment de l'opération, en tenant compte du total des sommes investies. <strong>Chaque cession partielle exige donc de connaître la valeur totale de ton portefeuille ce jour-là.</strong>",
"Cette règle a une conséquence pratique majeure : <strong>tenir un registre au fil de l'eau est indispensable.</strong> Reconstituer plusieurs années d'opérations a posteriori représente un travail considérable, parfois impossible si une plateforme a fermé.",
"<strong>Règle 4, la plus sanctionnée : les comptes ouverts à l'étranger doivent être déclarés chaque année</strong>, même vides, même sans aucune opération, sur un formulaire dédié joint à la déclaration de revenus. <u>L'amende est forfaitaire par compte non déclaré et indépendante du montant détenu</u>, ce qui en fait l'erreur la plus coûteuse pour de petits portefeuilles.",
"Enfin, certaines situations relèvent de régimes différents et méritent un accompagnement spécifique : minage, jalonnement de jetons, revenus de finance décentralisée, ou activité d'achat-revente exercée de manière habituelle et professionnelle.",
"Retiens la hiérarchie : <strong>déclarer tes comptes étrangers est plus urgent que d'optimiser tes plus-values</strong>, et les chiffres cités ici doivent être revérifiés chaque année après la loi de finances."
],

{module:"Module 5 — Fiscalité et durée", title:"Tenir son registre d'opérations", duration:"5 min",
script:[
"Puisque le calcul fiscal exige la valeur globale du portefeuille à chaque cession, le registre n'est pas une commodité mais une nécessité. Cette leçon explique quoi noter et comment.",
"<strong>Les informations à consigner pour chaque opération</strong>, sans exception : la date, la nature de l'opération, achat, vente, échange ou transfert, le montant en euros, la quantité concernée, la plateforme utilisée, et les frais appliqués.",

"<strong>Trois méthodes possibles, par ordre de fiabilité décroissante.</strong> Un tableur tenu à la main, gratuit et entièrement sous ton contrôle, mais qui demande de la rigueur. Un logiciel spécialisé, qui se connecte aux plateformes et calcule automatiquement, avec un abonnement annuel. Ou l'export fourni par les plateformes elles-mêmes, à réserver comme complément : <strong>les historiques y sont souvent incomplets ou perdus après une fermeture de compte.</strong>",

"Sur la durée de conservation : garde tes justificatifs au moins pendant le délai de reprise de l'administration, qui va au-delà de l'année en cours. En pratique, <u>conserve tout tant que tu détiens encore des actifs, plus les années suivantes.</u>",

{module:"Module 5 — Fiscalité et durée", title:"Comprendre les cycles de marché", duration:"5 min",
script:[
"Le marché des crypto-actifs a connu jusqu'ici des phases alternées d'euphorie et d'effondrement, d'une ampleur sans équivalent sur les marchés traditionnels. Les connaître ne permet pas de prédire, mais évite d'être surpris.",
"Les phases observées se ressemblent. <strong>Une phase d'accumulation</strong>, calme, où le sujet n'intéresse personne. <strong>Une phase de hausse</strong>, où le sujet revient dans les médias et les conversations. <strong>Une phase d'euphorie</strong>, où des gens sans intérêt préalable achètent en masse et où les projets les plus fragiles montent le plus. Puis <strong>une phase de chute</strong>, souvent brutale, avec des baisses de 70 % ou plus depuis les sommets.",
"Un signal revient à chaque cycle : <u>le sommet coïncide généralement avec le moment où le sujet devient impossible à éviter</u>, y compris chez des gens qui n'y connaissent rien. Et le creux coïncide avec le moment où plus personne n'en parle.",
"<figure class=\"schema\"><svg viewBox=\"0 0 700 168\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><line x1=\"34\" y1=\"96\" x2=\"666\" y2=\"96\" stroke=\"#DCDDD3\" stroke-width=\"2\"/><path d=\"M666 96 l-9 -5 v10 z\" fill=\"#DCDDD3\"/><line x1=\"34\" y1=\"96\" x2=\"34\" y2=\"62\" stroke=\"#1E4B3C\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/><circle cx=\"34\" cy=\"96\" r=\"7\" fill=\"#1E4B3C\"/><circle cx=\"34\" cy=\"96\" r=\"12\" fill=\"none\" stroke=\"#1E4B3C\" stroke-width=\"1\" opacity=\".35\"/><text x=\"34\" y=\"52\" text-anchor=\"start\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14\" font-weight=\"600\" fill=\"#12212B\">Accumulation</text><text x=\"34\" y=\"122\" text-anchor=\"start\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12\" fill=\"#43555F\">personne n'en parle</text><line x1=\"243\" y1=\"96\" x2=\"243\" y2=\"62\" stroke=\"#B8862F\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/><circle cx=\"243\" cy=\"96\" r=\"7\" fill=\"#B8862F\"/><circle cx=\"243\" cy=\"96\" r=\"12\" fill=\"none\" stroke=\"#B8862F\" stroke-width=\"1\" opacity=\".35\"/><text x=\"243\" y=\"52\" text-anchor=\"middle\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14\" font-weight=\"600\" fill=\"#12212B\">Hausse</text><text x=\"243\" y=\"122\" text-anchor=\"middle\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12\" fill=\"#43555F\">le sujet revient</text><line x1=\"451\" y1=\"96\" x2=\"451\" y2=\"62\" stroke=\"#A24332\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/><circle cx=\"451\" cy=\"96\" r=\"7\" fill=\"#A24332\"/><circle cx=\"451\" cy=\"96\" r=\"12\" fill=\"none\" stroke=\"#A24332\" stroke-width=\"1\" opacity=\".35\"/><text x=\"451\" y=\"52\" text-anchor=\"middle\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14\" font-weight=\"600\" fill=\"#12212B\">Euphorie</text><text x=\"451\" y=\"122\" text-anchor=\"middle\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12\" fill=\"#43555F\">impossible à éviter</text><line x1=\"666\" y1=\"96\" x2=\"666\" y2=\"62\" stroke=\"#A24332\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/><circle cx=\"666\" cy=\"96\" r=\"7\" fill=\"#A24332\"/><circle cx=\"666\" cy=\"96\" r=\"12\" fill=\"none\" stroke=\"#A24332\" stroke-width=\"1\" opacity=\".35\"/><text x=\"666\" y=\"52\" text-anchor=\"end\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14\" font-weight=\"600\" fill=\"#12212B\">Chute</text><text x=\"666\" y=\"122\" text-anchor=\"end\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12\" fill=\"#43555F\">-70 % ou plus</text></svg><figcaption>Reconnaître une phase après coup est facile. La reconnaître pendant qu'on la vit ne l'est pas du tout.</figcaption></figure>",
"Il faut immédiatement poser les limites de ce raisonnement, sinon il devient une prédiction déguisée. <strong>Trois ou quatre cycles observés ne constituent pas une régularité statistique.</strong> Le marché a profondément changé avec l'arrivée d'acteurs institutionnels et d'une réglementation. Et surtout, <em>reconnaître une phase après coup est facile ; la reconnaître pendant qu'on la vit ne l'est pas du tout.</em>",
"Ce que cette connaissance apporte réellement est plus modeste et plus utile. <strong>Elle prépare psychologiquement.</strong> Quelqu'un qui sait qu'une baisse de 70 % s'est déjà produite plusieurs fois ne vivra pas la prochaine comme un effondrement inédit.",
