<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --ink:#12212B;--ink-soft:#43555F;--ink-muted:#7A8A93;--ink-faint:#96A3AA;
  --bg:#FCFBF8;--bg-soft:#F5F4EE;--bg-mid:#EFF0EA;--bg-line:#DCDDD3;
  --green:#1E4B3C;--green-light:#2A6350;--green-pale:#E7EFEA;--green-bord:#BFD6C9;
  --amber:#B8862F;--amber-pale:#F6EFE0;--amber-bord:#E4D2AC;
  --violet:#4A5C6B;--violet-pale:#EDF0F2;--violet-bord:#D4DBE0;
  --coral:#A24332;--coral-pale:#F8EDEA;
  --sans:'Karla',system-ui,-apple-system,sans-serif;
  --display:'Newsreader',Georgia,serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
body{font-family:var(--sans);background:var(--bg-soft);color:var(--ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;}
a{color:inherit;}
.nav{position:sticky;top:0;z-index:200;background:rgba(255,255,255,.96);backdrop-filter:blur(20px);border-bottom:1px solid var(--bg-line);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;font-weight:800;font-size:15px;color:var(--ink);}
.nav-mark{width:26px;height:26px;border-radius:8px;background:var(--green);display:flex;align-items:center;justify-content:center;}
.nav-mark svg{width:14px;height:14px;}
.nav-back{font-size:13px;font-weight:600;color:var(--ink-muted);text-decoration:none;}
.nav-progress-pill{font-size:12px;font-weight:700;color:var(--green);background:var(--green-pale);padding:5px 12px;border-radius:100px;}
.layout{display:grid;grid-template-columns:280px 1fr;max-width:1100px;margin:0 auto;min-height:calc(100vh - 60px);}
.sidebar{border-right:1px solid var(--bg-line);background:var(--bg);padding:24px 16px;position:sticky;top:60px;align-self:start;height:calc(100vh - 60px);overflow-y:auto;}
.sb-progress-bar{height:6px;background:var(--bg-mid);border-radius:100px;overflow:hidden;margin:0 10px 18px;}
.sb-progress-fill{height:100%;background:var(--green);border-radius:100px;transition:width .3s;}
.sb-item{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:10px;cursor:pointer;margin-bottom:2px;font-size:13px;font-weight:600;color:var(--ink-muted);transition:background .15s;}
.sb-item:hover{background:var(--bg-soft);}
.sb-item.active{background:var(--green-pale);color:var(--green);}
.sb-item.done{color:var(--ink);}
.sb-item.locked{opacity:.45;cursor:not-allowed;}
.sb-item.locked:hover{background:transparent;}
.sb-check{width:20px;height:20px;border-radius:50%;background:var(--bg-mid);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink-faint);flex-shrink:0;}
.sb-item.done .sb-check{background:var(--green);color:#fff;}
.sb-item.active .sb-check{background:var(--green);color:#fff;}
.sb-module-label{font-size:10.5px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em;padding:14px 10px 6px;}
.main{padding:36px 40px 80px;max-width:720px;}
.lesson-eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green);margin-bottom:10px;}
.lesson-title{font-size:28px;font-weight:800;letter-spacing:-.03em;color:var(--ink);margin-bottom:8px;line-height:1.15;}
.lesson-meta{font-size:13px;color:var(--ink-faint);margin-bottom:32px;}
.section-label{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-muted);margin:36px 0 16px;}
.section-label .dot{width:6px;height:6px;border-radius:50%;background:var(--green);}
.section-label.quiz .dot{background:var(--violet);}
.section-label.action .dot{background:var(--amber);}
.script-text p{font-size:15.5px;font-weight:400;color:var(--ink-soft);line-height:1.75;margin-bottom:18px;}
.quiz-card{background:var(--bg);border:1px solid var(--bg-line);border-radius:16px;padding:24px;margin-bottom:14px;}
.quiz-q{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:16px;line-height:1.5;}
.quiz-opt{display:flex;align-items:flex-start;gap:12px;padding:13px 15px;border:1.5px solid var(--bg-line);border-radius:11px;margin-bottom:9px;cursor:pointer;transition:border-color .15s,background .15s;}
.quiz-opt:hover{border-color:var(--ink-faint);}
.quiz-opt.correct{border-color:var(--green);background:var(--green-pale);}
.quiz-opt.wrong{border-color:var(--coral);background:var(--coral-pale);}
.quiz-opt.disabled{cursor:default;pointer-events:none;}
.quiz-letter{width:24px;height:24px;border-radius:7px;background:var(--bg-soft);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--ink-muted);flex-shrink:0;}
.quiz-opt.correct .quiz-letter{background:var(--green);color:#fff;}
.quiz-opt.wrong .quiz-letter{background:var(--coral);color:#fff;}
.quiz-opt-text{font-size:13.5px;font-weight:500;color:var(--ink);padding-top:2px;}
.quiz-explain{display:none;font-size:13px;font-weight:400;color:var(--ink-muted);line-height:1.6;background:var(--bg-soft);border-radius:10px;padding:14px 16px;margin-top:8px;}
.quiz-explain.show{display:block;}
.quiz-explain strong{color:var(--ink);}
.action-card{background:var(--amber-pale);border:1px solid var(--amber-bord);border-radius:16px;padding:22px 24px;}
.action-text{font-size:14.5px;font-weight:500;color:var(--ink);line-height:1.65;margin-bottom:16px;}
.action-check{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;}
.action-box{width:22px;height:22px;border-radius:7px;border:2px solid var(--amber);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;transition:background .15s;}
.action-box.checked{background:var(--amber);}
.action-label{font-size:13px;font-weight:700;color:#8a6a00;}
.lesson-nav{display:flex;justify-content:space-between;align-items:center;margin-top:40px;padding-top:24px;border-top:1px solid var(--bg-line);}
.nav-btn{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border:none;cursor:pointer;font-family:var(--sans);font-size:14px;font-weight:700;padding:13px 24px;border-radius:11px;text-decoration:none;transition:background .2s;}
.nav-btn:hover{background:var(--ink-soft);}
.nav-btn.ghost{background:var(--bg-mid);color:var(--ink-muted);}
.nav-btn.ghost:hover{background:var(--bg-line);}
.completion-badge{display:none;align-items:center;gap:8px;background:var(--green-pale);color:var(--green);font-size:12.5px;font-weight:700;padding:8px 16px;border-radius:100px;margin-bottom:20px;}
.completion-badge.show{display:inline-flex;}
@media(max-width:860px){
  .layout{grid-template-columns:1fr;}
  .sidebar{position:static;height:auto;border-right:none;border-bottom:1px solid var(--bg-line);}
  .main{padding:28px 20px 60px;}
}

/* ===== Direction Encre & Laiton — surcouche typographique ===== */
body{font-family:var(--sans);letter-spacing:0;}
h1,h2,h3,h4,.hero-h1,.s-title,.cta-h2,.p-name,.mod-title,.c-title,.hc-title,
.lecon-title,.q-title,.auth-title,.perf-title,.section-title,.edu-title,.tips-title{
  font-family:var(--display);letter-spacing:-.015em;
}
.hero-h1,.s-title,.cta-h2,.auth-title{font-weight:500;letter-spacing:-.018em;line-height:1.16;}
h3,h4,.p-name,.mod-title,.c-title,.hc-title,.lecon-title{font-weight:600;}
.s-tag,.f-copy,.hstat-label,.stat-label,.perf-note,.order-meta,.pos-value,
.price-cell,.asset-label,.badge,.eyebrow,.nav-balance{font-family:var(--mono);}
</style>
</head>

<script>
/* ============ DONNÉES DES 18 LEÇONS — BITCOIN & CRYPTOMONNAIES ============ */
const LESSONS = [
{module:"Module 1 — Bitcoin, la révolution", title:"Pourquoi Satoshi a créé le Bitcoin", duration:"9 min",
script:[
"Le 31 octobre 2008, un mois après la faillite de Lehman Brothers, Satoshi Nakamoto publie le livre blanc de Bitcoin. Le contexte : les banques venaient de provoquer la pire crise financière depuis 1929, renflouées avec de l'argent public.",
"Satoshi voulait créer une monnaie numérique ne dépendant d'aucune autorité centrale : ni banque centrale, ni gouvernement, ni intermédiaire. Le bloc genèse (3 janvier 2009) contient un message caché : une phrase du Times sur un second renflouement bancaire, une signature politique claire.",
"Un réseau décentralisé d'ordinateurs vérifie collectivement chaque transaction selon des règles mathématiques fixées une fois pour toutes et impossibles à modifier unilatéralement.",
"Cette idée radicale a mis du temps à être prise au sérieux avant de devenir un actif détenu par des États, des fonds de pension et des dizaines de millions de particuliers."
],
quiz:[
{q:"Dans quel contexte Bitcoin a-t-il été créé ?",opts:["Une période de forte croissance mondiale","Juste après la crise financière de 2008","Pendant le Covid en 2020","Avant l'invention d'internet"],correct:1,explain:"Ce contexte de perte de confiance envers les institutions bancaires est lié à la philosophie fondatrice de Bitcoin."},
{q:"Que révèle le message caché dans le bloc genèse ?",opts:["L'identité de Satoshi","Une référence à un renflouement bancaire, ancrant Bitcoin dans une critique du système","Un code pour créer plus de bitcoins","Un message de remerciement"],correct:1,explain:"Cette signature politique ancre symboliquement Bitcoin dans une critique du système financier centralisé."},
{q:"Quel est l'objectif fondamental de Bitcoin selon le livre blanc ?",opts:["Un système de paiement plus rapide que les cartes","Remplacer l'or comme réserve mondiale","Une monnaie numérique sans autorité centrale, vérifiée par un réseau décentralisé","Faciliter les transactions anonymes"],correct:2,explain:"Un réseau décentralisé vérifie collectivement les transactions selon des règles mathématiques fixes."}
],
action:"Lis le résumé du livre blanc de Bitcoin en français. Note les trois objectifs principaux énoncés par Satoshi dans l'introduction."
},
{module:"Module 1 — Bitcoin, la révolution", title:"La blockchain expliquée", duration:"10 min",
script:[
"La blockchain est un registre géant qui enregistre chaque transaction Bitcoin depuis 2009, copié et synchronisé sur des dizaines de milliers d'ordinateurs (nœuds) à travers le monde.",
"Chaque bloc contient une empreinte numérique (hash) dépendant du bloc précédent. Modifier une transaction ancienne casserait la chaîne, immédiatement détecté par le réseau entier.",
"Falsifier la blockchain nécessiterait de modifier simultanément la majorité des dizaines de milliers de copies, mathématiquement et économiquement impossible.",
"Contrairement à un registre bancaire centralisé avec un point de défaillance unique, la blockchain n'a pas ce risque : le réseau entier devrait être compromis simultanément."
],
quiz:[
{q:"Qu'est-ce qu'un « nœud » dans le réseau Bitcoin ?",opts:["Un mineur qui crée des bitcoins","Un ordinateur avec une copie synchronisée du registre complet","Une unité de mesure du Bitcoin","Un intermédiaire rémunéré"],correct:1,explain:"Des dizaines de milliers de nœuds répartis dans le monde assurent la décentralisation du système."},
{q:"Pourquoi est-il quasi impossible de falsifier une ancienne transaction ?",opts:["Les transactions sont chiffrées par mot de passe","Modifier un bloc casserait la chaîne d'empreintes, détecté par tout le réseau","Seules les banques centrales ont accès au registre","Les transactions sont supprimées après validation"],correct:1,explain:"La chaîne d'empreintes numériques rend toute modification immédiatement détectable."},
{q:"Différence principale entre registre bancaire et blockchain ?",opts:["Le registre bancaire est plus rapide","La blockchain n'a pas de point de défaillance unique contrairement au registre centralisé","Le registre bancaire est gratuit","La blockchain n'enregistre que le Bitcoin"],correct:1,explain:"Un registre centralisé crée un risque en cas de piratage ou faillite ; la blockchain distribue ce risque."}
],
action:"Ouvre un blockchain explorer (blockchain.com/explorer) et observe les dernières transactions Bitcoin en temps réel."
},
{module:"Module 1 — Bitcoin, la révolution", title:"Le halving Bitcoin", duration:"8 min",
script:[
"Toutes les 10 minutes, un nouveau bloc est miné et récompensé en bitcoins nouvellement créés. Tous les 210 000 blocs environ (4 ans), cette récompense est divisée par deux : 50 BTC en 2009, 25 en 2012, 12,5 en 2016, 6,25 en 2020, 3,125 en 2024.",
"Ce mécanisme continuera jusqu'à épuisement des 21 millions de bitcoins prévus, vers 2140. Pas un de plus.",
"Contrairement à l'or (nouvelles découvertes imprévisibles) ou à l'euro (création selon décisions politiques), l'offre de Bitcoin suit un calendrier connu à l'avance, inscrit dans le code.",
"Historiquement, les halvings ont souvent été suivis de périodes de forte appréciation, sans garantie que ce schéma se reproduise."
],
quiz:[
{q:"Qu'est-ce que le halving de Bitcoin ?",opts:["Une division du prix par deux","La réduction de moitié de la récompense des mineurs, tous les 210 000 blocs environ","Une division du nombre total de bitcoins","Une réduction de la puissance de calcul nécessaire"],correct:1,explain:"Il survient environ tous les 4 ans et réduit le rythme de création de nouveaux bitcoins."},
{q:"Vers quelle année le dernier bitcoin sera-t-il créé ?",opts:["2040","2080","2140","2200"],correct:2,explain:"La réduction progressive par halvings successifs mène au plafond de 21 millions vers 2140."},
{q:"Qu'est-ce qui distingue la rareté du Bitcoin de celle de l'or ou l'euro ?",opts:["Bitcoin est physiquement plus rare","La rareté de Bitcoin est programmée et parfaitement prévisible","Bitcoin ne peut jamais perdre de valeur","L'euro et l'or ont aussi un plafond connu"],correct:1,explain:"L'offre de Bitcoin suit un calendrier connu à l'avance, contrairement à l'or ou l'euro."}
],
action:"Cherche « halving Bitcoin countdown » et note la date estimée du prochain halving et la nouvelle récompense."
},
{module:"Module 1 — Bitcoin, la révolution", title:"Bitcoin versus or versus euro", duration:"9 min",
script:[
"Comparons selon les 6 critères d'une monnaie saine. Divisibilité : Bitcoin va jusqu'au satoshi (100 millionième), plus précis que l'euro (centime) ou l'or (difficile à fractionner).",
"Portabilité : une clé privée peut représenter n'importe quelle somme, transportable instantanément, contrairement à l'or physique. Durabilité : Bitcoin ne se dégrade jamais tant que le réseau existe.",
"Rareté : l'euro illimité, l'or +1,5%/an via extraction, Bitcoin plafonné à 21 millions définitivement. Résistance à la censure : Bitcoin correctement sécurisé ne peut être saisi sans la clé privée, contrairement à un compte bancaire ou de l'or physique en douane.",
"Chaque actif a des usages différents : l'euro pour le quotidien, l'or comme valeur refuge éprouvée, Bitcoin pour sa combinaison unique de rareté programmée et portabilité numérique."
],
quiz:[
{q:"Comparaison de divisibilité entre euro et Bitcoin ?",opts:["L'euro va au centime, Bitcoin au satoshi (cent millionième)","Bitcoin n'est pas divisible","Même précision pour les deux","Bitcoin divisible en dixièmes seulement"],correct:0,explain:"Cette divisibilité extrême permet des transactions de très faible montant."},
{q:"Différence de rareté entre or et Bitcoin ?",opts:["Même offre totale","L'offre d'or augmente chaque année, celle de Bitcoin est plafonnée à 21 millions","L'or est plus rare que Bitcoin","Bitcoin peut être créé indéfiniment"],correct:1,explain:"L'offre de Bitcoin est définitivement fixée, contrairement à l'or extrait continuellement."},
{q:"Pourquoi Bitcoin résiste-t-il mieux à la censure que l'or physique ?",opts:["Bitcoin n'est soumis à aucune réglementation","L'or peut être saisi en douane, Bitcoin sécurisé ne peut l'être sans la clé privée","Bitcoin est totalement anonyme","L'or est illégal dans certains pays"],correct:1,explain:"Bitcoin correctement sécurisé ne peut être accédé par un tiers sans la clé privée."}
],
action:"Construis un tableau comparatif des 6 critères pour euro, or et Bitcoin, avec une note de 1 à 5 pour chacun."
},
{module:"Module 2 — L'écosystème crypto", title:"Bitcoin, Ethereum, altcoins", duration:"9 min",
script:[
"Bitcoin reste la cryptomonnaie la plus établie, la plus sécurisée, avec une proposition simple : réserve de valeur numérique rare et résistante à la censure.",
"Ethereum (2015), deuxième plus grande capitalisation, est une plateforme permettant d'exécuter des contrats intelligents, créant des applications décentralisées (échanges, prêts, autres cryptos).",
"Il existe des milliers d'altcoins. La grande majorité des projets crypto ont fini par disparaître ou perdre plus de 95% de leur valeur, beaucoup n'ayant aucune valeur fondamentale sous-jacente.",
"Pour un débutant, la prudence recommande de se concentrer sur Bitcoin, éventuellement Ethereum, plutôt que de se disperser sur des projets moins établis et statistiquement plus risqués."
],
quiz:[
{q:"Différence principale entre Bitcoin et Ethereum ?",opts:["Ethereum est plus ancien","Bitcoin vise à être une réserve de valeur, Ethereum est une plateforme de contrats intelligents","Aucune différence","Ethereum a une offre plus limitée"],correct:1,explain:"Ethereum sert de base à de nombreuses applications décentralisées au-delà d'une simple monnaie."},
{q:"Que révèle la statistique sur la majorité des projets crypto historiques ?",opts:["Ils ont tous surperformé Bitcoin","La majorité ont disparu ou perdu 95%+ de leur valeur","Ils ont tous une utilité équivalente à Bitcoin","Ils sont tous régulés comme Bitcoin"],correct:1,explain:"Beaucoup n'avaient pas de proposition de valeur fondamentale solide, contrairement à Bitcoin."},
{q:"Pourquoi se concentrer sur Bitcoin pour débuter ?",opts:["C'est le seul projet légal","Le plus long historique, la meilleure sécurité réseau, la proposition la plus simple","Les autres cryptos sont des arnaques","Bitcoin est garanti par un gouvernement"],correct:1,explain:"Cette robustesse en fait un point de départ plus prudent."}
],
action:"Recherche la capitalisation de Bitcoin et d'Ethereum. Calcule le pourcentage que représente Bitcoin (sa « dominance »)."
},
{module:"Module 2 — L'écosystème crypto", title:"Exchanges centralisés et décentralisés", duration:"8 min",
script:[
"Les exchanges centralisés (CEX comme Coinbase, Binance, Kraken) fonctionnent comme une banque en ligne : compte, KYC, dépôt, l'exchange détient vos cryptos en votre nom. Simple mais risque de contrepartie (faillite, piratage, comme FTX en 2022).",
"Les exchanges décentralisés (DEX comme Uniswap) permettent des échanges directs sans intermédiaire central, via des contrats intelligents. Vous gardez le contrôle total, mais complexité technique plus élevée.",
"Pour débuter, la recommandation habituelle : acheter sur un exchange centralisé réputé, puis transférer vers un portefeuille personnel dont vous contrôlez les clés.",
"C'est le principe « not your keys, not your coins » : sans les clés, vous ne détenez pas vraiment vos cryptomonnaies."
],
quiz:[
{q:"Quel est le principal risque de conserver ses cryptos sur un exchange centralisé ?",opts:["Frais de transaction élevés","Risque de contrepartie : faillite ou piratage possible","Absence de carte bancaire","Transactions plus lentes"],correct:1,explain:"L'exemple de FTX en 2022 illustre ce risque : des millions d'utilisateurs ont perdu l'accès à leurs fonds."},
{q:"Différence de fonctionnement entre CEX et DEX ?",opts:["Les DEX sont réservés aux professionnels","Sur un DEX, les échanges s'exécutent via contrats intelligents sans entité centrale détenant les fonds","Les CEX ne permettent pas d'acheter du Bitcoin","Les DEX ont toujours des frais plus élevés"],correct:1,explain:"Un DEX élimine l'intermédiaire qui détient les fonds au nom de l'utilisateur."},
{q:"Que signifie « not your keys, not your coins » ?",opts:["Impossible d'acheter sans clé privée","Sans contrôle des clés privées, on ne contrôle pas réellement ses cryptos","Chaque crypto nécessite une clé unique","Les clés doivent être partagées avec l'exchange"],correct:1,explain:"Ce principe résume l'importance de transférer ses actifs vers un portefeuille personnel."}
],
action:"Compare Coinbase, Kraken et Bitpanda : frais, régulation. Note lequel te semble le plus adapté pour un premier achat."
},
{module:"Module 2 — L'écosystème crypto", title:"Les stablecoins", duration:"7 min",
script:[
"Les stablecoins (USDT, USDC) sont conçus pour maintenir une valeur stable, généralement indexée sur le dollar. Ils servent d'intermédiaire de transaction et permettent de se mettre à l'abri de la volatilité sans sortir de l'écosystème crypto.",
"Le mécanisme repose sur des réserves déclarées par l'émetteur. Contrairement à Bitcoin, vérifiable publiquement, les réserves des stablecoins dépendent de la confiance envers l'entreprise émettrice.",
"Les stablecoins algorithmiques tentent une parité via des mécanismes automatisés. L'effondrement de TerraUSD en mai 2022 (perte de sa parité, dizaines de milliards effacés) illustre les risques de cette catégorie.",
"Pour un débutant concentré sur Bitcoin, les stablecoins ne sont généralement pas nécessaires."
],
quiz:[
{q:"Qu'est-ce qu'un stablecoin ?",opts:["Une cryptomonnaie qui double de valeur chaque année","Une cryptomonnaie conçue pour maintenir une valeur stable, indexée sur une monnaie traditionnelle","La première cryptomonnaie créée","Un type de portefeuille physique"],correct:1,explain:"USDT et USDC visent à valoir exactement un dollar chacun."},
{q:"Quel est le principal risque des stablecoins adossés à des réserves ?",opts:["Ils fluctuent autant que Bitcoin","La vérifiabilité des réserves dépend de la confiance envers l'émetteur","Ils ne peuvent pas être échangés contre des dollars","Ils sont illégaux"],correct:1,explain:"Contrairement à Bitcoin, ces réserves ne sont pas vérifiables publiquement sur la blockchain."},

  const progress = getProgress();
  const doneCount = Object.keys(progress).filter(k=>progress[k]).length;
  document.getElementById('navProgress').textContent = doneCount + '/' + LESSONS.length + ' leçons';
  const sbEl = document.getElementById('sidebar');
  let html = '<div class="sb-progress-bar"><div class="sb-progress-fill" style="width:' + Math.round(doneCount/LESSONS.length*100) + '%"></div></div>';
  let lastModule = '';
  LESSONS.forEach(function(l, i){
    const n = i+1;
    if(l.module !== lastModule){ html += '<div class="sb-module-label">' + l.module.split(' — ')[0] + '</div>'; lastModule = l.module; }
    const isDone = !!progress[n];
    const isActive = n === current;
    const unlocked = isUnlocked(n);
    const lockedClass = unlocked ? '' : 'locked';
    let iconContent = n;
    if(isDone) iconContent = '✓';
    else if(!unlocked) iconContent = '🔒';
    html += '<div class="sb-item ' + (isActive?'active':'') + ' ' + (isDone?'done':'') + ' ' + lockedClass + '" onclick="goTo(' + n + ')">' +
      '<span class="sb-check">' + iconContent + '</span>' + l.title + '</div>';
  });
  sbEl.innerHTML = html;
}

function goTo(n){
  if(!isUnlocked(n)){
    alert('Termine la leçon précédente pour débloquer celle-ci.');
    return;
  }
  current = n;
  history.replaceState(null, '', '?l=' + n);
  render();
  window.scrollTo(0,0);
}

function render(){
  renderSidebar();
  const l = LESSONS[current-1];
  const progress = getProgress();
  const done = !!progress[current];
  quizState = {};
  if(done){ l.quiz.forEach(function(q,i){ quizState[i] = true; }); }
  const main = document.getElementById('main');
  let quizHtml = '';
  l.quiz.forEach(function(q, qi){
    let optsHtml = '';
    q.opts.forEach(function(opt, oi){
      const preAnswered = done && oi === q.correct;
      optsHtml += '<div class="quiz-opt ' + (preAnswered?'correct disabled':'') + '" id="q' + qi + 'o' + oi + '" onclick="answerQuiz(' + qi + ',' + oi + ',' + q.correct + ')">' +
        '<span class="quiz-letter">' + String.fromCharCode(65+oi) + '</span><span class="quiz-opt-text">' + opt + '</span></div>';
    });
    quizHtml += '<div class="quiz-card"><div class="quiz-q">Question ' + (qi+1) + '. ' + q.q + '</div>' + optsHtml +
      '<div class="quiz-explain ' + (done?'show':'') + '" id="exp' + qi + '"><strong>Explication : </strong>' + q.explain + '</div></div>';
  });

  const quizOk = allQuizCorrect(l);
  const actionCardStyle = (!quizOk && !done) ? 'opacity:.5;pointer-events:none;' : '';

  main.innerHTML =
    (done ? '<div class="completion-badge show">✓ Leçon terminée</div>' : '') +
    '<div class="lesson-eyebrow">' + l.module + '</div>' +
    '<div class="lesson-title">' + (current) + '. ' + l.title + '</div>' +
    '<div class="lesson-meta">' + l.duration + ' de lecture · Leçon ' + current + ' sur ' + LESSONS.length + '</div>' +
    '<div class="section-label"><span class="dot"></span>Comprendre</div>' +
    '<div class="script-text">' + l.script.map(function(p){return '<p>'+p+'</p>';}).join('') + '</div>' +
    '<div class="section-label quiz"><span class="dot"></span>Vérifier</div>' +
    quizHtml +
    '<div class="section-label action"><span class="dot"></span>Petite action</div>' +
    (!quizOk && !done ? '<div style="font-size:12.5px;font-weight:600;color:var(--coral);margin-bottom:10px;">🔒 Réponds correctement aux ' + l.quiz.length + ' questions pour débloquer cette action.</div>' : '') +
    '<div class="action-card" id="actionCard" style="' + actionCardStyle + '">' +
      '<div class="action-text">' + l.action + '</div>' +
      '<div class="action-check" onclick="toggleAction()"><span class="action-box ' + (done?'checked':'') + '" id="actionBox">' + (done?'✓':'') + '</span><span class="action-label">Marquer cette leçon comme terminée</span></div>' +
    '</div>' +
    '<div class="lesson-nav">' +
      (current > 1 ? '<button class="nav-btn ghost" onclick="goTo(' + (current-1) + ')">← Leçon précédente</button>' : '<span></span>') +
      (current < LESSONS.length ? '<button class="nav-btn" onclick="goTo(' + (current+1) + ')">Leçon suivante →</button>' : '<a href="crypto.html" class="nav-btn">Terminer le parcours →</a>') +
    '</div>';
}

function answerQuiz(qi, oi, correct){
  if(quizState[qi]) return;
  const chosen = document.getElementById('q'+qi+'o'+oi);
  if(chosen.classList.contains('disabled')) return;

  if(oi === correct){
    for(let k=0;k<10;k++){
      const el = document.getElementById('q'+qi+'o'+k);
      if(el){ el.classList.add('disabled'); }
    }
    chosen.classList.add('correct');
    quizState[qi] = true;
    document.getElementById('exp'+qi).classList.add('show');
    const l = LESSONS[current-1];
    const quizOk = allQuizCorrect(l);
    const card = document.getElementById('actionCard');
    if(quizOk && card){
      card.style.opacity = '';
      card.style.pointerEvents = '';
      const lock = card.previousElementSibling;
      if(lock && lock.textContent.indexOf('Réponds correctement') !== -1){ lock.style.display = 'none'; }
    }
  } else {
    chosen.classList.add('wrong');
    document.getElementById('exp'+qi).classList.add('show');
    setTimeout(function(){ chosen.classList.remove('wrong'); }, 900);
  }
}

async function toggleAction(){
  const l = LESSONS[current-1];
  const progress = getProgress();
  const newValue = !progress[current];
  if(newValue && !allQuizCorrect(l)){
    alert('Réponds correctement à toutes les questions du quiz avant de valider cette leçon.');
    return;
  }
  await setProgressServer(current, newValue);
  render();
}

async function boot(){
  document.getElementById('main').innerHTML = '<div style="padding:60px 0;text-align:center;color:var(--ink-faint);font-size:14px;">Chargement de ta progression…</div>';
  const user = await requireAuth();
  if(!user) return;
  const unlocked = await requireUnlock(user.id);
  if(!unlocked) return;
  CURRENT_USER = user;
  await loadProgressFromServer();

  if(!isUnlocked(current)){
    let lastUnlocked = 1;
    for(let i=1;i<=LESSONS.length;i++){ if(isUnlocked(i)) lastUnlocked = i; else break; }
    current = lastUnlocked;
    history.replaceState(null, '', '?l=' + current);
  }
  render();
}
boot();
</script>
</body>
</html>
