<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --ink:#171C45;--ink-soft:#44496B;--ink-muted:#6B7094;--ink-faint:#9599B5;
  --bg:#FFFFFF;--bg-soft:#F6F7FB;--bg-mid:#F0F1F7;--bg-line:#DCDEEA;
  --green:#2B3A8F;--green-light:#3B4BA8;--green-pale:#E9EBF7;--green-bord:#C5CAEB;
  --amber:#C27C00;--amber-pale:#FDF2DA;--amber-bord:#F0D49A;
  --violet:#4D5675;--violet-pale:#EEF0F5;--violet-bord:#D5D9E6;
  --coral:#A3213D;--coral-pale:#FAEAEE;
  --sans:'Archivo',system-ui,-apple-system,sans-serif;
  --display:'Archivo',system-ui,sans-serif;
  --mono:'Archivo',system-ui,sans-serif;
}
body{font-family:var(--sans);background:var(--bg-soft);color:var(--ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;}
a{color:inherit;}
.nav{position:sticky;top:0;z-index:200;background:rgba(255,255,255,.96);backdrop-filter:blur(20px);border-bottom:1px solid var(--bg-line);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;font-weight:800;font-size:15px;color:var(--ink);}
.nav-mark{width:26px;height:26px;border-radius:8px;background:var(--green);display:flex;align-items:center;justify-content:center;}
.nav-mark svg{width:14px;height:14px;}
.nav-back{font-size:13px;font-weight:600;color:var(--ink-muted);text-decoration:none;}
.nav-progress-pill{font-size:12px;font-weight:700;color:var(--green);background:var(--green-pale);padding:5px 12px;border-radius:100px;}
.layout{display:grid;grid-template-columns:280px 1fr;max-width:1100px;margin:0 auto;min-height:calc(100vh - 60px);}
.sidebar{border-right:1px solid var(--bg-line);background:var(--bg);padding:24px 16px;position:sticky;top:60px;align-self:start;height:calc(100vh - 60px);overflow-y:auto;}
.sb-progress-bar{height:6px;background:var(--bg-mid);border-radius:100px;overflow:hidden;margin:0 10px 18px;}
.sb-progress-fill{height:100%;background:var(--green);border-radius:100px;transition:width .3s;}
.sb-item{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:10px;cursor:pointer;margin-bottom:2px;font-size:13px;font-weight:600;color:var(--ink-muted);transition:background .15s;}
.sb-item:hover{background:var(--bg-soft);}
.sb-item.active{background:var(--green-pale);color:var(--green);}
.sb-item.done{color:var(--ink);}
.sb-item.locked{opacity:.45;cursor:not-allowed;}
.sb-item.locked:hover{background:transparent;}
.sb-check{width:20px;height:20px;border-radius:50%;background:var(--bg-mid);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink-faint);flex-shrink:0;}
.sb-item.done .sb-check{background:var(--green);color:#fff;}
.sb-item.active .sb-check{background:var(--green);color:#fff;}
.sb-module-label{font-size:13.5px;font-weight:700;color:var(--ink-faint);text-transform:none;letter-spacing:0;padding:14px 10px 6px;}
.main{padding:36px 40px 80px;max-width:720px;}
.lesson-eyebrow{font-size:13.5px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--green);margin-bottom:10px;}
.lesson-title{font-size:28px;font-weight:800;letter-spacing:-.03em;color:var(--ink);margin-bottom:8px;line-height:1.15;}
.lesson-meta{font-size:13px;color:var(--ink-faint);margin-bottom:32px;}
.section-label{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:800;letter-spacing:0;text-transform:none;color:var(--ink-muted);margin:36px 0 16px;}
.section-label .dot{width:6px;height:6px;border-radius:50%;background:var(--green);}
.section-label.quiz .dot{background:var(--violet);}
.section-label.action .dot{background:var(--amber);}
.script-text p{font-size:15.5px;font-weight:400;color:var(--ink-soft);line-height:1.75;margin-bottom:18px;}
.quiz-card{background:var(--bg);border:1px solid var(--bg-line);border-radius:16px;padding:24px;margin-bottom:14px;}
.quiz-q{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:16px;line-height:1.5;}
.quiz-opt{display:flex;align-items:flex-start;gap:12px;padding:13px 15px;border:1.5px solid var(--bg-line);border-radius:11px;margin-bottom:9px;cursor:pointer;transition:border-color .15s,background .15s;}
.quiz-opt:hover{border-color:var(--ink-faint);}
.quiz-opt.correct{border-color:var(--green);background:var(--green-pale);}
.quiz-opt.wrong{border-color:var(--coral);background:var(--coral-pale);}
.quiz-opt.disabled{cursor:default;pointer-events:none;}
.quiz-letter{width:24px;height:24px;border-radius:7px;background:var(--bg-soft);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--ink-muted);flex-shrink:0;}
.quiz-opt.correct .quiz-letter{background:var(--green);color:#fff;}
.quiz-opt.wrong .quiz-letter{background:var(--coral);color:#fff;}
.quiz-opt-text{font-size:13.5px;font-weight:500;color:var(--ink);padding-top:2px;}
.quiz-explain{display:none;font-size:13px;font-weight:400;color:var(--ink-muted);line-height:1.6;background:var(--bg-soft);border-radius:10px;padding:14px 16px;margin-top:8px;}
.quiz-explain.show{display:block;}
.quiz-explain strong{color:var(--ink);}
.action-card{background:var(--amber-pale);border:1px solid var(--amber-bord);border-radius:16px;padding:22px 24px;}
.action-text{font-size:14.5px;font-weight:500;color:var(--ink);line-height:1.65;margin-bottom:16px;}
.action-check{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;}
.action-box{width:22px;height:22px;border-radius:7px;border:2px solid var(--amber);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;transition:background .15s;}
.action-box.checked{background:var(--amber);}
.action-label{font-size:13px;font-weight:700;color:#8a6a00;}
.lesson-nav{display:flex;justify-content:space-between;align-items:center;margin-top:40px;padding-top:24px;border-top:1px solid var(--bg-line);}
.nav-btn{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border:none;cursor:pointer;font-family:var(--sans);font-size:14px;font-weight:700;padding:13px 24px;border-radius:11px;text-decoration:none;transition:background .2s;}
.nav-btn:hover{background:var(--ink-soft);}
.nav-btn.ghost{background:var(--bg-mid);color:var(--ink-muted);}
.nav-btn.ghost:hover{background:var(--bg-line);}
.completion-badge{display:none;align-items:center;gap:8px;background:var(--green-pale);color:var(--green);font-size:12.5px;font-weight:700;padding:8px 16px;border-radius:100px;margin-bottom:20px;}
.completion-badge.show{display:inline-flex;}
@media(max-width:860px){
  .layout{grid-template-columns:1fr;}
  .sidebar{position:static;height:auto;border-right:none;border-bottom:1px solid var(--bg-line);}
  .main{padding:28px 20px 60px;}
}

/* ===== Direction Encre & Laiton — surcouche typographique ===== */
body{font-family:var(--sans);letter-spacing:0;}
h1,h2,h3,h4,.hero-h1,.s-title,.cta-h2,.p-name,.mod-title,.c-title,.hc-title,
.lecon-title,.q-title,.auth-title,.perf-title,.section-title,.edu-title,.tips-title{
  font-family:var(--display);letter-spacing:-.015em;
}
.hero-h1,.s-title,.cta-h2,.auth-title{font-weight:500;letter-spacing:-.018em;line-height:1.16;}
h3,h4,.p-name,.mod-title,.c-title,.hc-title,.lecon-title{font-weight:600;}
.s-tag,.f-copy,.hstat-label,.stat-label,.perf-note,.order-meta,.pos-value,
.price-cell,.asset-label,.badge,.eyebrow,.nav-balance{font-family:var(--mono);}

.nav-name em,.ft-name em{font-style:normal;color:var(--amber);}

/* Mise en valeur dans le corps des lecons : le gras porte la notion a
   retenir, l italique la nuance ou le terme technique. */
.script-text strong{color:var(--ink,#171C45);font-weight:700;}
.script-text em{font-style:italic;color:var(--ink-soft,#44496B);}
.script-text u{text-decoration:none;background:linear-gradient(transparent 62%,var(--amber-pale,#FDF2DA) 62%);
  box-shadow:inset 0 -1px 0 var(--amber,#C27C00);}
.script-text p + p{margin-top:14px;}

/* ===== L'itineraire =====
   Une route verticale plutot qu'une liste : on voit d'ou l'on vient,
   ou l'on est, et ce qu'il reste. Meme vocabulaire graphique que le
   carnet de route et les emblemes. */
.itin{padding:4px 4px 24px;}
.itin-tete{padding:0 8px 16px;border-bottom:1px solid var(--bg-line);margin-bottom:16px;}
.itin-formation{font-family:var(--display);font-size:16px;font-weight:600;color:var(--ink);line-height:1.25;}
.itin-compte{font-family:var(--mono);font-size:13.5px;letter-spacing:0;text-transform:none;
  color:var(--ink-muted);margin-top:7px;}
.itin-barre{height:4px;background:var(--bg-mid);border-radius:100px;overflow:hidden;margin-top:10px;}
.itin-barre span{display:block;height:100%;background:var(--amber);border-radius:100px;transition:width .4s cubic-bezier(.4,0,.2,1);}

/* La route */
.route{position:relative;padding-left:30px;}
.route::before{content:"";position:absolute;left:11px;top:14px;bottom:14px;width:2px;
  background:repeating-linear-gradient(var(--bg-line) 0 6px, transparent 6px 11px);}
.etape-i{position:relative;margin-bottom:6px;}
.borne{position:absolute;left:-30px;top:6px;width:24px;height:24px;border-radius:50%;
  background:var(--bg);border:2px solid var(--bg-line);display:grid;place-items:center;
  font-family:var(--mono);font-size:10px;color:var(--ink-faint);z-index:1;transition:all .2s;}
.borne svg{width:11px;height:11px;}
.etape-i.faite .borne{background:var(--amber);border-color:var(--amber);color:#fff;}
.etape-i.ici .borne{background:var(--green);border-color:var(--green);color:#fff;
  box-shadow:0 0 0 4px var(--green-pale);}
.etape-titre{display:block;width:100%;text-align:left;background:transparent;border:0;cursor:pointer;
  font-family:var(--display);font-size:14.5px;font-weight:600;color:var(--ink-soft);
  padding:7px 9px;border-radius:9px;line-height:1.3;transition:background .15s,color .15s;}
.etape-titre:hover{background:var(--bg-soft);color:var(--ink);}
.etape-i.ici .etape-titre{color:var(--green);}
.etape-i.faite .etape-titre{color:var(--ink);}
.etape-meta{font-family:var(--mono);font-size:10px;color:var(--ink-faint);padding:0 9px 4px;letter-spacing:.06em;}

/* Les lecons de l'etape en cours */
.arrets{margin:2px 0 12px;padding-left:9px;border-left:1px solid var(--bg-line);}
.arret{display:flex;align-items:flex-start;gap:9px;padding:7px 9px;border-radius:8px;cursor:pointer;
  font-size:12.8px;font-weight:500;color:var(--ink-muted);transition:background .15s;line-height:1.35;}
.arret:hover{background:var(--bg-soft);color:var(--ink);}
.arret.ici{background:var(--green-pale);color:var(--green);font-weight:700;}
.arret.faite{color:var(--ink);}
.arret.bloque{opacity:.42;cursor:not-allowed;}
.arret.bloque:hover{background:transparent;}
.puce{width:15px;height:15px;border-radius:4px;flex:none;margin-top:1px;border:1.5px solid var(--bg-line);
  display:grid;place-items:center;background:var(--bg);}
.puce svg{width:9px;height:9px;opacity:0;}
.arret.faite .puce{background:var(--amber);border-color:var(--amber);}
.arret.faite .puce svg{opacity:1;}
.arret.ici .puce{border-color:var(--green);border-style:dashed;}

/* Changer de formation sans repasser par le menu */
.escale{margin-top:22px;padding-top:16px;border-top:1px solid var(--bg-line);}
.escale-titre{font-family:var(--mono);font-size:13.5px;letter-spacing:0;text-transform:none;
  color:var(--ink-faint);padding:0 9px 9px;}
.escale a{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;text-decoration:none;
  font-size:12.8px;color:var(--ink-soft);transition:background .15s;}
.escale a:hover{background:var(--bg-soft);color:var(--ink);}
.escale a.courante{background:var(--green-pale);color:var(--green);font-weight:700;}
.jeton{width:7px;height:7px;border-radius:50%;background:var(--bg-line);flex:none;}
.escale a.courante .jeton{background:var(--green);}
.escale a.prete .jeton{background:var(--amber);}

@media(max-width:860px){
  .itin{padding-bottom:8px;}
  .route{padding-left:26px;}
  .borne{left:-26px;}
}
@media(prefers-reduced-motion:reduce){*{transition:none !important;}}

/* ===== Schemas des lecons ===== */
.schema{margin:26px 0;padding:20px 18px 14px;border:1px solid var(--bg-line,#DCDEEA);
  border-radius:12px;background:var(--bg,#FFFFFF);}
.schema svg{width:100%;height:auto;display:block;}
.schema figcaption{font-family:var(--mono,'Archivo',sans-serif);font-size:11.5px;line-height:1.55;
  color:var(--ink-muted,#6B7094);margin-top:14px;padding-top:12px;
  border-top:1px solid var(--bg-line,#DCDEEA);}
@media(max-width:620px){.schema{padding:14px 12px 10px;margin:20px -6px;}}

.script-text strong{color:var(--ink,#171C45);font-weight:700;}
.script-text em{font-style:italic;color:var(--ink-soft,#44496B);}
.script-text u{text-decoration:none;background:linear-gradient(transparent 62%,var(--amber-pale,#FDF2DA) 62%);
  box-shadow:inset 0 -1px 0 var(--amber,#C27C00);}
.script-text p + p{margin-top:14px;}

/* Sortie de leçon : on peut toujours s'arrêter sans se sentir coincé. */
.lesson-sortie{display:flex;flex-wrap:wrap;align-items:center;gap:9px;justify-content:center;
  margin-top:24px;padding-top:18px;border-top:1px solid var(--bg-line);
  font-size:13.5px;color:var(--ink-faint);}
.lesson-sortie a{color:var(--ink-muted);text-decoration:none;font-weight:600;}
.lesson-sortie a:hover{color:var(--green);}
</style>

<script>
/* ============ DONNÉES DES 18 LEÇONS — BITCOIN & CRYPTOMONNAIES ============ */
const LESSONS = [
{module:"Module 1 — Comprendre Bitcoin", title:"Le problème que Bitcoin cherchait à résoudre", duration:"5 min",
script:[
"Bitcoin naît en 2008, quelques semaines après la faillite de la banque Lehman Brothers. Il est présenté dans un texte de 9 pages signé Satoshi Nakamoto. C'est un faux nom, et on ne sait toujours pas qui se cache derrière.",
"Le problème de départ était technique, et il faut le comprendre pour suivre la suite. <strong>Comment envoyer de l'argent numérique à quelqu'un, sans passer par une banque, et sans qu'on puisse le copier ?</strong> Un fichier se copie à l'infini. Un euro numérique aussi, sauf si une banque tient le compte et vérifie qu'il n'a été dépensé qu'une fois.",
"On appelle ça <em>le problème de la double dépense</em>. Jusque-là, il fallait toujours un intermédiaire de confiance pour le régler. Bitcoin propose une autre solution : <u>faire tenir le registre des comptes par des milliers d'ordinateurs en même temps</u>, chacun vérifiant le travail des autres.",
"Le contexte de 2008 explique le but du projet. Le texte de départ et les premiers messages de son auteur parlent clairement de la crise des banques et de notre dépendance envers elles. <strong>Bitcoin est né comme une réponse à un problème de confiance</strong>, pas comme un placement.",
"2 règles ont été fixées dès le début et n'ont jamais changé. <strong>Il n'y aura jamais plus de 21 millions de bitcoins</strong>, et chacun peut le vérifier. Et <strong>les nouveaux bitcoins sont créés de plus en plus lentement</strong> : le rythme est divisé par 2 à intervalles réguliers. On y revient plus loin.",
"Posons tout de suite les limites, car cette formation ne vend rien. <u>Bitcoin n'a pas remplacé les monnaies. On l'utilise très peu pour payer. Et son prix bouge énormément</u>, ce qui va contre le rôle de monnaie qu'il visait au départ.",
"Ce que Bitcoin a vraiment prouvé est plus modeste, mais plus solide : <strong>un registre partagé peut fonctionner sans chef pendant plus de 15 ans.</strong> C'est cette preuve technique, plus que le prix, qui explique pourquoi il intéresse encore."
],
quiz:[
{q:"Quel problème technique Bitcoin voulait-il régler ?",opts:["Le blanchiment d'argent","Empêcher de dépenser 2 fois le même argent numérique, sans intermédiaire","La lenteur des virements","L'inflation"],correct:1,
explain:"Un fichier se copie à l'infini. Sans banque pour tenir le compte, il fallait une autre solution."},
{q:"Comment Bitcoin règle-t-il ce problème ?",opts:["Avec un code secret plus fort","En faisant tenir le registre par des milliers d'ordinateurs qui se vérifient","Avec une autorité internationale","En limitant le nombre d'opérations"],correct:1,
explain:"C'est le principe du registre partagé, et Bitcoin a prouvé qu'il marche depuis plus de 15 ans."},
{q:"Bitcoin est-il devenu la monnaie qu'il voulait être ?",opts:["Oui, il remplace largement les monnaies","Non : on l'utilise peu pour payer et son prix bouge énormément","Oui, dans les pays émergents","Il ne voulait pas être une monnaie"],correct:1,
explain:"Sa vraie réussite est technique : un registre partagé peut fonctionner sans chef."}
],
action:"Cherche le texte de départ de Bitcoin, gratuit en ligne, et lis seulement son résumé d'introduction : 2 paragraphes. Comprendre le but d'origine change la façon dont on lit tout le reste."
},
{module:"Module 1 — Comprendre Bitcoin", title:"La blockchain, sans jargon", duration:"5 min",
script:[
"Une blockchain est un registre d'opérations, partagé, que tout le monde peut vérifier. Pour comprendre comment ça marche, l'image du cahier commun reste la plus juste.",
"Imagine un cahier tenu en même temps par des milliers de personnes. À chaque opération, tout le monde est prévenu. Chacun vérifie qu'elle est valable, puis l'écrit. <strong>Comme tout le monde a le même cahier, personne ne peut modifier le sien sans être tout de suite contredit par les autres.</strong>",
"Les opérations sont regroupées par paquets, appelés <em>blocs</em>. Chaque bloc contient une empreinte du bloc d'avant, ce qui les attache entre eux comme une chaîne. <u>Pour modifier une vieille opération, il faudrait refaire tous les blocs suivants</u>, sur la majorité des ordinateurs du réseau. C'est ce qui protège le système.",
"Reste une question : qui décide de l'ordre des opérations ? C'est le rôle du <strong>minage</strong>. Des machines résolvent un calcul volontairement difficile. La 1re qui trouve propose le bloc suivant. Elle est payée pour ça, en bitcoins tout neufs et en frais d'opération.",
"Cette méthode s'appelle la <em>preuve de travail</em>. Elle a une conséquence connue : <strong>elle consomme beaucoup d'électricité.</strong> C'est un fait, discuté et mesuré. La part d'énergie propre utilisée fait débat. D'autres réseaux utilisent une autre méthode, la <em>preuve d'enjeu</em>, qui consomme bien moins : on y choisit qui valide selon le nombre de jetons bloqués, et non selon la puissance de calcul.",
"2 idées fausses très répandues. D'abord, <strong>la blockchain n'est pas anonyme.</strong> Toutes les opérations sont publiques et on peut les suivre. Seul le nom de la personne derrière une adresse n'est pas écrit. Et des entreprises ont pour métier de retrouver ce nom.",
"Ensuite, <strong>la blockchain ne garantit pas que ce qu'on y écrit est vrai.</strong> Elle garantit seulement que ça n'a pas été modifié après coup. Si on y écrit une fausse information, elle reste fausse, et plus personne ne pourra la corriger."
],
quiz:[
{q:"Pourquoi est-il difficile de modifier une vieille opération ?",opts:["Elle est codée","Il faudrait refaire tous les blocs suivants sur la majorité des ordinateurs","Elle est effacée après 1 an","Seule la banque peut le faire"],correct:1,
explain:"Les blocs sont attachés entre eux par leur empreinte. C'est ce qui protège le système."},
{q:"La blockchain est-elle anonyme ?",opts:["Oui, complètement","Non : les opérations sont publiques et on peut les suivre","Oui, sauf pour la police","Ça dépend du réseau"],correct:1,
explain:"Seul le nom derrière une adresse n'est pas écrit, et des entreprises ont pour métier de le retrouver."},
{q:"Que garantit vraiment une blockchain ?",opts:["Que ce qui est écrit est vrai","Que ce qui est écrit n'a pas été modifié après coup","Que les placements rapportent","Qu'il n'y a pas de fraude"],correct:1,
explain:"Une fausse information écrite reste fausse, et devient impossible à corriger."}
],

},
{module:"Module 1 — Comprendre Bitcoin", title:"Le halving et la rareté programmée", duration:"5 min",
script:[
"Le <em>halving</em>, ou division par 2, est la règle qui rend Bitcoin de plus en plus rare. Elle est écrite dans le programme depuis le début, et personne ne peut la changer.",
"Comment ça marche : les machines qui protègent le réseau reçoivent des bitcoins tout neufs en récompense. <strong>Tous les 210 000 blocs, soit environ tous les 4 ans, cette récompense est divisée par 2.</strong> La création de nouveaux bitcoins ralentit donc par étapes, et s'arrêtera quand les 21 millions auront été créés, vers 2140.",
"La comparaison avec l'or aide à comprendre. <u>Quand le prix de l'or monte, ouvrir de nouvelles mines devient rentable. On produit donc plus d'or, ce qui freine la hausse.</u> Avec Bitcoin, ça n'existe pas : quel que soit le prix, et quelle que soit la puissance des machines, le rythme de création reste le même.",
"<figure class=\"schema\"><svg viewBox=\"0 0 700 168\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><line x1=\"34\" y1=\"96\" x2=\"666\" y2=\"96\" stroke=\"#DCDEEA\" stroke-width=\"2\"/><path d=\"M666 96 l-9 -5 v10 z\" fill=\"#DCDEEA\"/><line x1=\"34\" y1=\"96\" x2=\"34\" y2=\"62\" stroke=\"#2B3A8F\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/><circle cx=\"34\" cy=\"96\" r=\"7\" fill=\"#2B3A8F\"/><circle cx=\"34\" cy=\"96\" r=\"12\" fill=\"none\" stroke=\"#2B3A8F\" stroke-width=\"1\" opacity=\".35\"/><text x=\"34\" y=\"52\" text-anchor=\"start\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14\" font-weight=\"600\" fill=\"#171C45\">2009</text><text x=\"34\" y=\"122\" text-anchor=\"start\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12\" fill=\"#44496B\">50 unités par bloc</text><line x1=\"255\" y1=\"96\" x2=\"255\" y2=\"62\" stroke=\"#C27C00\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/><circle cx=\"255\" cy=\"96\" r=\"7\" fill=\"#C27C00\"/><circle cx=\"255\" cy=\"96\" r=\"12\" fill=\"none\" stroke=\"#C27C00\" stroke-width=\"1\" opacity=\".35\"/><text x=\"255\" y=\"52\" text-anchor=\"middle\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14\" font-weight=\"600\" fill=\"#171C45\">1er halving</text><text x=\"255\" y=\"122\" text-anchor=\"middle\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12\" fill=\"#44496B\">récompense divisée par 2</text><line x1=\"464\" y1=\"96\" x2=\"464\" y2=\"62\" stroke=\"#C27C00\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/><circle cx=\"464\" cy=\"96\" r=\"7\" fill=\"#C27C00\"/><circle cx=\"464\" cy=\"96\" r=\"12\" fill=\"none\" stroke=\"#C27C00\" stroke-width=\"1\" opacity=\".35\"/><text x=\"464\" y=\"52\" text-anchor=\"middle\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14\" font-weight=\"600\" fill=\"#171C45\">Halvings suivants</text><text x=\"464\" y=\"122\" text-anchor=\"middle\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12\" fill=\"#44496B\">émission décroissante</text><line x1=\"666\" y1=\"96\" x2=\"666\" y2=\"62\" stroke=\"#A3213D\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/><circle cx=\"666\" cy=\"96\" r=\"7\" fill=\"#A3213D\"/><circle cx=\"666\" cy=\"96\" r=\"12\" fill=\"none\" stroke=\"#A3213D\" stroke-width=\"1\" opacity=\".35\"/><text x=\"666\" y=\"52\" text-anchor=\"end\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14\" font-weight=\"600\" fill=\"#171C45\">~2140</text><text x=\"666\" y=\"122\" text-anchor=\"end\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12\" fill=\"#44496B\">émission terminée</text></svg><figcaption>Un fait technique documentant une politique d'émission, jamais une prédiction de prix.</figcaption></figure>",
"C'est pour ça qu'on parle de <strong>rareté programmée</strong>. C'est l'inverse d'une monnaie dont la quantité dépend des décisions d'une banque centrale, comme tu l'as vu dans la formation sur la monnaie.",
"Maintenant, la prudence. Beaucoup de contenus présentent le halving comme un déclencheur automatique de hausse, parce que le prix a monté après les précédents. <strong>Ce raisonnement est fragile, pour 3 raisons.</strong> Il y a eu trop peu de halvings pour en tirer une règle. Tout le marché connaît la date à l'avance, donc c'est en principe déjà dans le prix. Et ce n'est pas parce que 2 choses arrivent en même temps que l'une cause l'autre : d'autres événements ont eu lieu à ces moments-là.",
"Ce qu'il faut retenir est plus simple. <strong>Le halving est un fait technique qu'on peut vérifier, pas une prédiction de prix.</strong> Il décrit comment les bitcoins sont créés, ce n'est pas une promesse de gain.",
"<u>Si quelqu'un te présente le prochain halving comme une occasion à saisir, il te vend quelque chose.</u> Et c'est vrai pour tout le secteur."
],
quiz:[
{q:"Tous les combien a lieu le halving ?",opts:["Chaque année","Environ tous les 4 ans","Tous les 10 ans","À des dates qui changent"],correct:1,
explain:"Tous les 210 000 blocs, la récompense des machines est divisée par 2, jusqu'à l'arrêt de la création vers 2140."},
{q:"Qu'est-ce qui différencie Bitcoin de l'or sur la création de nouvelles unités ?",opts:["Il s'extrait plus vite","Une hausse du prix n'accélère pas la création de bitcoins","Il n'a pas de limite","Un comité décide de sa création"],correct:1,
explain:"Avec l'or, une hausse rend de nouvelles mines rentables, ce qui freine la hausse. Ça n'existe pas avec Bitcoin."},
{q:"Le halving annonce-t-il une hausse du prix ?",opts:["Oui, ça a toujours été le cas","Non : trop peu de cas, date connue d'avance, et arriver en même temps ne veut pas dire causer","Oui, avec 6 mois de retard","Seulement quand le marché monte"],correct:1,
explain:"C'est un fait technique qui décrit la création des bitcoins, pas une prédiction de prix."}
],
action:"Cherche la date du dernier halving et la récompense actuelle par bloc. Ces 2 informations sont publiques et vérifiables, contrairement aux prédictions de prix qui les accompagnent souvent."
},
{module:"Module 1 — Comprendre Bitcoin", title:"Comparer Bitcoin, l'or et l'euro", duration:"5 min",
script:[
"Reprenons les critères d'une bonne monnaie, vus dans la formation sur la monnaie, et appliquons-les honnêtement à ces 3 choses. Il n'y a pas de gagnant : chacun a ses forces et ses faiblesses.",
"<strong>La rareté.</strong> La quantité d'euros peut changer selon les décisions de la banque centrale. La quantité d'or augmente d'environ 1,5 à 2 % par an avec les mines. Bitcoin est limité à 21 millions, et sa création ralentit. <u>Sur ce critère, le classement est clair. C'est le seul où il l'est.</u>",
"<strong>La durée.</strong> L'or ne s'abîme pas et traverse les siècles. L'euro dure tant que l'institution qui le crée existe. Bitcoin a besoin d'un réseau informatique qui marche et d'électricité. C'est une vraie dépendance, même si elle n'a jamais posé problème jusqu'ici.",
"<strong>Se diviser et se transporter.</strong> Bitcoin est excellent : il se divise en 100 millions de morceaux et s'envoie en un instant. L'or est le pire des 3 sur ce point. L'euro est excellent.",
"<figure class=\"schema\"><svg viewBox=\"0 0 700 228\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"200\" y=\"20\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" letter-spacing=\"1.4\" fill=\"#2B3A8F\">CE QUI EST SOLIDE</text><text x=\"560\" y=\"20\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" letter-spacing=\"1.4\" fill=\"#C27C00\">CE QUI EST FAIBLE</text><text x=\"20\" y=\"44\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">Euro</text><rect x=\"20\" y=\"54\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#F0F1F7\"/><rect x=\"20\" y=\"54\" width=\"475\" height=\"18\" rx=\"5\" fill=\"#E9EBF7\"/><rect x=\"495\" y=\"54\" width=\"185\" height=\"18\" rx=\"5\" fill=\"#FDF2DA\"/><text x=\"28\" y=\"67\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#2B3A8F\">stabilité, acceptation</text><text x=\"672\" y=\"67\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8F5F00\">rareté</text><text x=\"20\" y=\"100\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">Or</text><rect x=\"20\" y=\"110\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#F0F1F7\"/><rect x=\"20\" y=\"110\" width=\"436\" height=\"18\" rx=\"5\" fill=\"#E9EBF7\"/><rect x=\"456\" y=\"110\" width=\"224\" height=\"18\" rx=\"5\" fill=\"#FDF2DA\"/><text x=\"28\" y=\"123\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#2B3A8F\">rareté, durabilité</text><text x=\"672\" y=\"123\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8F5F00\">transportabilité</text><text x=\"20\" y=\"156\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">Bitcoin</text><rect x=\"20\" y=\"166\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#F0F1F7\"/><rect x=\"20\" y=\"166\" width=\"330\" height=\"18\" rx=\"5\" fill=\"#E9EBF7\"/><rect x=\"350\" y=\"166\" width=\"330\" height=\"18\" rx=\"5\" fill=\"#FDF2DA\"/><text x=\"28\" y=\"179\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#2B3A8F\">rareté, vérifiabilité</text><text x=\"672\" y=\"179\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8F5F00\">stabilité, ancienneté</text></svg><figcaption>Aucun ne l'emporte sur tous les critères. Chacun est un compromis différent, à choisir selon l'usage.</figcaption></figure>",
"<strong>La vérification.</strong> Tout le monde peut vérifier Bitcoin, à tout moment. C'est sa plus grande force. L'or demande un expert. L'euro repose sur des sécurités physiques (filigranes, hologrammes).",
"<strong>La stabilité, absente de la liste classique, mais décisive.</strong> C'est là que Bitcoin échoue nettement : <u>son prix a chuté de 70 % ou plus plusieurs fois depuis sa création.</u> Une monnaie qui peut perdre 2/3 de sa valeur en 1 an ne peut pas servir à fixer les prix. Or c'est l'un des 3 rôles d'une monnaie.",
"La conclusion est donc nuancée, et je te la donne telle quelle. <strong>L'euro reste meilleur pour vivre au quotidien. L'or a prouvé qu'il traverse de très longues périodes. Bitcoin est jeune (moins de 20 ans), son prix bouge énormément, et des experts sérieux ne sont pas du tout d'accord à son sujet.</strong>",
"Ce désaccord est un fait à connaître, pas un débat à trancher. Personne ne devrait te le présenter autrement."
],
quiz:[
{q:"Sur quel critère le classement entre les 3 est-il clair ?",opts:["La stabilité","La rareté","La durée","L'acceptation"],correct:1,
explain:"Et c'est le seul. Sur tous les autres, chacun a ses forces et ses faiblesses."},
{q:"Pourquoi Bitcoin ne peut-il pas servir à fixer les prix ?",opts:["Il se divise trop","Son prix bouge tellement qu'il peut perdre 2/3 de sa valeur en 1 an","Il n'est pas accepté","Il est trop récent"],correct:1,
explain:"Servir à fixer les prix est l'un des 3 rôles d'une monnaie, et ça demande une certaine stabilité."},
{q:"Quel est le point faible de l'or depuis toujours ?",opts:["Sa rareté","Il est difficile à transporter","Il est difficile à vérifier","Il ne dure pas"],correct:1,
explain:"C'est pour ça que les billets, au départ de simples reçus pour de l'or déposé, se sont imposés."}
],
action:"Reprends le tableau de critères que tu avais rempli dans la formation sur la monnaie et ajoute une ligne : la stabilité. Le classement change sûrement, et c'est justement l'intérêt de l'exercice."
},
{module:"Module 2 — L'écosystème", title:"Bitcoin, Ethereum et les milliers d'autres", duration:"5 min",
script:[
"Il existe aujourd'hui des dizaines de milliers de cryptos. Il faut savoir les distinguer, car elles ne sont pas du tout de même nature et n'ont pas le même risque.",
"<strong>Bitcoin</strong> a un seul but : envoyer et garder de la valeur sans intermédiaire. Son programme évolue lentement, et c'est voulu : la stabilité est vue comme une qualité, pas comme un frein.",
"<strong>Ethereum</strong> a un autre but : faire tourner des programmes sur un réseau sans chef. On les appelle <em>contrats intelligents</em> : ce sont des programmes qui s'exécutent tout seuls quand certaines conditions sont remplies. C'est grâce à eux que sont nées la finance décentralisée et les NFT (jetons uniques).",
"<strong>Les milliers d'autres.</strong> Certains projets ont un vrai but technique. Beaucoup n'ont ni utilisateurs, ni revenus, ni utilité prouvée. Et beaucoup disparaissent chaque année : <u>de nombreux jetons lancés ces dernières années ne valent plus rien aujourd'hui.</u>",
"Voici les 4 questions les plus utiles, valables pour n'importe quel projet. <strong>1. Qui l'utilise vraiment, et pour quoi faire ?</strong> Pas le nombre d'abonnés sur les réseaux, mais des usages qu'on peut vérifier. <strong>2. Le jeton sert-il vraiment au projet</strong>, ou est-il collé sur un projet qui pourrait s'en passer ? <strong>3. Qui possède les jetons</strong>, et quelle part revient aux créateurs ? <strong>4. Le code est-il public et vérifié par des experts ?</strong>",
"Un cas à part : les <strong>memecoins</strong>, créés sans aucune utilité, dont la valeur dépend seulement de l'attention qu'on leur porte. Ce n'est pas de l'investissement, c'est du pari. Il faut appeler ça par son nom.",
"Un piège qui attrape beaucoup de débutants : <strong>quand tout le monde s'emballe, ce sont les projets les plus fragiles qui montent le plus</strong>, ce qui donne l'impression qu'ils sont les meilleurs. C'est mécanique : ils sont plus petits, donc plus faciles à faire bouger. Et c'est pareil dans l'autre sens, à la baisse."
],
quiz:[
{q:"Quelle est la grande différence entre Bitcoin et Ethereum ?",opts:["Leur prix","Bitcoin sert à envoyer de la valeur, Ethereum à faire tourner des programmes","Leur pays d'origine","Leur niveau de sécurité"],correct:1,
explain:"Ce sont 2 buts différents, donc 2 risques différents."},
{q:"Quelle question poser en 1er face à un projet crypto ?",opts:["Combien peut-il monter ?","Qui l'utilise vraiment, et pour quoi faire ?","Qui en fait la pub ?","Combien vaut-il au total ?"],correct:1,
explain:"Des usages qu'on peut vérifier, pas un nombre d'abonnés sur les réseaux."},
{q:"Pourquoi les projets fragiles montent-ils le plus quand tout le monde s'emballe ?",opts:["Ils sont mieux faits","Ils sont plus petits, donc plus faciles à faire bouger","Des institutions les soutiennent","Il y en a moins"],correct:1,
explain:"C'est pareil à la baisse, et souvent beaucoup plus brutal."}
],
action:"Choisis un projet crypto dont on t'a parlé récemment et pose-lui les 4 questions. Si tu ne trouves pas de réponse claire aux 4, tu as ta réponse. Elle t'aura coûté 15 minutes au lieu de plusieurs centaines d'euros."
},
{module:"Module 2 — L'écosystème", title:"Plateformes centralisées et décentralisées", duration:"5 min",
script:[
"Pour acheter des cryptos, il y a 2 chemins. Leurs risques n'ont rien à voir.",
"<strong>Les plateformes centralisées</strong> marchent comme un courtier : tu ouvres un compte, tu prouves ton identité, tu déposes des euros et tu achètes. Elles sont simples à utiliser, et presque tous les débutants commencent par là.",
"Leur principal risque est souvent mal compris. Quand tu laisses tes cryptos sur une plateforme, <u>elles ne sont pas vraiment à toi : la plateforme te les doit.</u> C'est le sens de la phrase connue dans le milieu : <em>« pas tes clés, pas tes cryptos »</em>. Plusieurs grandes plateformes ont fait faillite en emportant l'argent de leurs clients. Ce n'est pas une hypothèse.",
"<strong>Les plateformes décentralisées</strong> marchent sans intermédiaire : tu y branches ton propre portefeuille et tu échanges directement, grâce à des programmes automatiques. Tu gardes donc toujours le contrôle de tes cryptos.",
"En échange, tous les risques techniques sont pour toi : <strong>une erreur d'adresse est définitive, un programme mal fait peut être vidé, et personne ne répondra à ta réclamation</strong>, puisqu'il n'y a personne. Ces plateformes ne sont pas faites pour un débutant. Le dire n'est pas du mépris, c'est de la simple prudence.",
"Les règles ont beaucoup évolué. Le règlement européen MiCA oblige maintenant les plateformes à obtenir un agrément. Elles doivent séparer l'argent des clients du leur, informer clairement et être financièrement solides. <strong>Vérifier qu'une plateforme est enregistrée ou agréée en France, c'est la 1re chose à faire</strong>, et l'information est publique.",
"Mais il faut être clair sur ce que ça protège : <u>un agrément encadre la façon dont la plateforme fonctionne. Il ne garantit ni la valeur de tes cryptos, ni que tu ne perdras rien.</u> Il n'existe rien de comparable à la garantie des dépôts des banques pour les cryptos."
],
quiz:[
{q:"Quand tes cryptos restent sur une plateforme centralisée, que possèdes-tu vraiment ?",opts:["Les cryptos elles-mêmes","Une dette de la plateforme envers toi","Un titre de propriété officiel","Un contrat d'assurance"],correct:1,
explain:"C'est le sens de « pas tes clés, pas tes cryptos ». Plusieurs faillites l'ont prouvé."},
{q:"Quel risque prends-tu sur une plateforme décentralisée ?",opts:["La faillite de la plateforme","Tous les risques techniques, sans recours possible","Plus d'impôts","Aucun risque particulier"],correct:1,
explain:"Une erreur d'adresse est définitive et personne ne répondra, puisqu'il n'y a personne."},
{q:"Que garantit l'agrément d'une plateforme ?",opts:["La valeur des cryptos","Un cadre pour son fonctionnement, sans garantie contre les pertes","Le remboursement en cas de faillite","Un gain minimum"],correct:1,
explain:"Il n'existe rien de comparable à la garantie des dépôts des banques pour les cryptos."}
],
action:"Si tu utilises une plateforme, vérifie ce soir si elle est enregistrée ou agréée en France. L'information est publique et se trouve en quelques minutes. Si elle ne l'est pas, prends-le au sérieux."
},
{module:"Module 2 — L'écosystème", title:"Les stablecoins, et ce qu'ils garantissent vraiment", duration:"5 min",
script:[
"Un <em>stablecoin</em> est une crypto dont la valeur doit rester égale à une vraie monnaie, le plus souvent le dollar ou l'euro. Il sert à circuler dans le monde des cryptos sans subir les gros mouvements de prix. Il représente une très grande part des échanges.",
"Il en existe 3 familles, avec des risques très différents.",
"<strong>Les stablecoins garantis par des réserves.</strong> L'entreprise qui les crée garde de l'argent en banque et des titres de dette à court terme, censés couvrir chaque jeton créé. Leur solidité dépend de 2 choses : <u>la qualité réelle de ces réserves, et le sérieux de leur vérification par un organisme indépendant.</u> Ce point a déjà été sérieusement contesté.",
"<strong>Les stablecoins garantis par d'autres cryptos.</strong> La garantie est déposée en cryptos, en plus grande quantité que nécessaire pour encaisser les variations de prix. Tout est visible, car c'est écrit dans un programme public. Mais si les cryptos déposées chutent brutalement, la garantie fond.",
"<strong>Les stablecoins algorithmiques.</strong> Aucune réserve : un programme est censé garder le prix stable en créant ou détruisant des jetons. <strong>Cette famille a causé l'un des pires effondrements du secteur en 2022</strong> : des dizaines de milliards de dollars ont disparu en quelques jours. Le système n'a pas tenu quand la confiance a disparu.",
"Le règlement européen MiCA encadre désormais ces jetons, avec des règles sur les réserves et l'information pour les entreprises qui les créent dans l'Union européenne. <strong>C'est un vrai progrès. Il ne supprime pas le risque</strong>, mais il le rend plus facile à voir.",
"Un usage à connaître, et une mise en garde. Certaines plateformes proposent de te verser des intérêts si tu leur confies tes stablecoins. <u>Un rendement a toujours une source : un prêt, un risque que quelqu'un ne paie pas, ou une stratégie</u> qu'on doit pouvoir nommer. Si personne ne peut t'expliquer d'où vient ce rendement en 2 phrases, ce qu'on ne te dit pas, c'est justement le risque."
],
quiz:[
{q:"Quelle famille de stablecoin n'a aucune réserve ?",opts:["Ceux garantis par de l'argent en banque","Les stablecoins algorithmiques","Ceux garantis par d'autres cryptos","Toutes ont des réserves"],correct:1,
explain:"Cette famille a causé l'un des pires effondrements du secteur en 2022."},
{q:"De quoi dépend la solidité d'un stablecoin garanti par des réserves ?",opts:["De sa valeur totale","De la qualité réelle des réserves et du sérieux de leur vérification","Du nombre d'utilisateurs","De la plateforme où on l'échange"],correct:1,
explain:"Ce point a déjà été sérieusement contesté, et c'est toujours le critère principal."},
{q:"Que penser d'intérêts proposés sur des stablecoins ?",opts:["C'est un revenu sans risque","Ils viennent toujours de quelque part : prêt, risque ou stratégie à identifier","MiCA les garantit","C'est comme un livret bancaire"],correct:1,
explain:"Si personne ne peut expliquer d'où vient ce rendement en 2 phrases, ce qui manque, c'est le risque."}
],
action:"Si tu as ou penses avoir un stablecoin, cherche pendant 10 minutes qui le crée, quelles réserves il annonce, et qui les vérifie. Ces informations doivent être publiques. Si tu ne les trouves pas, c'est déjà une réponse."
},
{module:"Module 3 — Décider avec méthode", title:"Les crypto-actifs ont-ils une place chez toi ?", duration:"5 min",
script:[
"Cette leçon ne te dira pas combien y mettre. Ce n'est pas une fausse prudence : <strong>NiouDem ne conseille aucune répartition de ton argent</strong>, et conseiller sur les cryptos est un métier encadré par la loi. Elle te donne des questions pour décider seul.",
"<strong>Question 1 : as-tu passé les 4 étapes de base ?</strong> Plus de découvert, une épargne de secours en place, plus de dettes chères, et une épargne à long terme déjà lancée. S'il en manque une, la question ne se pose pas encore. <u>Les cryptos sont le placement le plus instable accessible à tous</u> : elles ne peuvent pas passer avant les bases.",
"<strong>Question 2 : peux-tu perdre toute cette somme sans que ça change ta vie ?</strong> Pas « serais-tu déçu ? », mais : est-ce que ça changerait quelque chose à ton logement, à tes projets, à ta tranquillité ? Si oui, c'est trop.",
"<figure class=\"schema\"><svg viewBox=\"0 0 700 350\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"20\" y=\"266\" width=\"250\" height=\"52\" rx=\"9\" fill=\"#E9EBF7\" stroke=\"#2B3A8F\" stroke-width=\"1.4\"/><circle cx=\"46\" cy=\"292\" r=\"12\" fill=\"#2B3A8F\"/><text x=\"46\" y=\"296\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\" fill=\"#fff\">1</text><text x=\"70\" y=\"288\" font-family=\"Newsreader, Georgia, serif\" font-size=\"15\" font-weight=\"600\" fill=\"#171C45\">Découvert comblé</text><text x=\"70\" y=\"305\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">Rien ne se construit sur un compte à découvert.</text><rect x=\"20\" y=\"202\" width=\"350\" height=\"52\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#DCDEEA\" stroke-width=\"1.4\"/><circle cx=\"46\" cy=\"228\" r=\"12\" fill=\"#DCDEEA\"/><text x=\"46\" y=\"232\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\" fill=\"#fff\">2</text><text x=\"70\" y=\"224\" font-family=\"Newsreader, Georgia, serif\" font-size=\"15\" font-weight=\"600\" fill=\"#171C45\">Fonds d'urgence constitué</text><text x=\"70\" y=\"241\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">Disponible immédiatement, sans risque de perte.</text><rect x=\"20\" y=\"138\" width=\"450\" height=\"52\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#DCDEEA\" stroke-width=\"1.4\"/><circle cx=\"46\" cy=\"164\" r=\"12\" fill=\"#DCDEEA\"/><text x=\"46\" y=\"168\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\" fill=\"#fff\">3</text><text x=\"70\" y=\"160\" font-family=\"Newsreader, Georgia, serif\" font-size=\"15\" font-weight=\"600\" fill=\"#171C45\">Dettes chères remboursées</text><text x=\"70\" y=\"177\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">Un rendement certain, que peu de placements égalent.</text><rect x=\"20\" y=\"74\" width=\"550\" height=\"52\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#DCDEEA\" stroke-width=\"1.4\"/><circle cx=\"46\" cy=\"100\" r=\"12\" fill=\"#DCDEEA\"/><text x=\"46\" y=\"104\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\" fill=\"#fff\">4</text><text x=\"70\" y=\"96\" font-family=\"Newsreader, Georgia, serif\" font-size=\"15\" font-weight=\"600\" fill=\"#171C45\">Épargne long terme en place</text><text x=\"70\" y=\"113\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">Enveloppes ouvertes, versements réguliers.</text><rect x=\"20\" y=\"10\" width=\"650\" height=\"52\" rx=\"9\" fill=\"#FDF2DA\" stroke=\"#C27C00\" stroke-width=\"1.4\"/><circle cx=\"46\" cy=\"36\" r=\"12\" fill=\"#C27C00\"/><text x=\"46\" y=\"40\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\" fill=\"#fff\">5</text><text x=\"70\" y=\"32\" font-family=\"Newsreader, Georgia, serif\" font-size=\"15\" font-weight=\"600\" fill=\"#171C45\">Alors seulement, actifs volatils</text><text x=\"70\" y=\"49\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">Avec une somme dont la disparition ne change rien.</text></svg><figcaption>Les crypto-actifs sont les plus volatils accessibles au grand public : ils ne peuvent pas précéder les fondations.</figcaption></figure>",
"<strong>Question 3 : as-tu compris ce que tu achètes ?</strong> Peux-tu expliquer en 2 minutes à quelqu'un ce que c'est, qui le crée, à quoi ça sert et pourquoi ça pourrait valoir quelque chose ? Si non, le problème n'est pas le prix, c'est la compréhension.",
"<strong>Question 4 : pour combien de temps ?</strong> Jusqu'ici, les cycles ont duré plusieurs années, avec des baisses de 70 % ou plus entre les sommets. Si tu as besoin de l'argent avant 4 ou 5 ans, tu risques de devoir vendre au pire moment.",
"<strong>Question 5 : es-tu prêt à t'occuper de la conservation ?</strong> Clés, sauvegardes, transmission si tu décèdes. C'est le sujet du module suivant, et c'est plus exigeant qu'on ne le croit.",
"S'il ne fallait retenir qu'une règle de cette leçon, valable pour tout placement instable : <strong>ne mets jamais une somme dont la perte changerait quelque chose à ta vie.</strong> Ce n'est pas une phrase d'avocat. C'est ce qui fait la différence entre un investisseur et un joueur."
],

{module:"Module 3 — Décider avec méthode", title:"La régularité appliquée aux actifs volatils", duration:"5 min",
script:[
"Investir la même somme chaque mois, vu dans la formation sur la bourse, compte encore plus sur des placements dont le prix bouge beaucoup. Cette leçon explique pourquoi, sans parler d'une crypto en particulier.",
"Le principe ne change pas : mettre la même somme à la même date, sans te demander si c'est le bon moment. Mais sur un placement qui peut varier de 70 % en 1 an, <strong>l'effet de lissage est bien plus fort que sur la bourse.</strong>",
"Un exemple chiffré. Tu fais 4 achats de 100 €, à des prix de 40 000, 25 000, 30 000 et 55 000. Ton prix d'achat moyen sera nettement plus bas que la moyenne de ces 4 prix. <u>Ce n'est pas magique, c'est du calcul : avec la même somme, un prix bas t'en fait acheter plus.</u>",
"Mais le vrai avantage est dans ta tête, et il compte beaucoup ici. <strong>Personne n'arrive à acheter de lui-même quand tout s'effondre.</strong> Un achat automatique le fait sans demander l'avis de ton cerveau, justement au moment où il te dirait de ne pas le faire.",
"3 précautions propres aux cryptos. <strong>1. Les frais.</strong> Certaines plateformes prennent 1 à 2 % à chaque achat. Sur de petits achats réguliers, c'est énorme. Vérifie les tarifs avant de programmer quoi que ce soit.",
"<strong>2. Le calcul des impôts.</strong> Chaque achat complique le calcul du gain à déclarer. En France, chaque vente se calcule par rapport à la valeur totale de tout ce que tu possèdes. Il faudra noter chaque opération au fur et à mesure, comme on le verra.",
"<strong>3. Quand vendre : à écrire à l'avance.</strong> Presque personne n'y pense. <strong>Acheter chaque mois suppose de savoir quand et comment tu vendras.</strong> Sinon, tu accumules sans fin quelque chose que tu ne revendras jamais. Écris-le maintenant : dans combien de temps, dans quelles conditions, et par quelles parts.",
"Retiens l'essentiel : <u>acheter régulièrement ne rend pas le placement moins risqué. Ça réduit le risque qui vient de tes propres réactions.</u> Sur quelque chose qui peut perdre 80 %, cette différence est capitale."
],
quiz:[
{q:"Pourquoi l'effet de lissage est-il plus fort quand le prix bouge beaucoup ?",opts:["Les frais sont plus bas","Parce que les écarts de prix entre 2 achats sont bien plus grands","Parce que le marché est ouvert jour et nuit","Ce n'est pas le cas"],correct:1,
explain:"Avec la même somme, un prix bas t'en fait acheter plus. C'est du calcul, pas de la magie."},
{q:"Que réduit vraiment le fait d'acheter régulièrement ?",opts:["Le risque du placement","Le risque qui vient de tes propres réactions","Les frais","Les impôts"],correct:1,
explain:"Sur quelque chose qui peut perdre 80 %, cette différence est capitale, et on la passe souvent sous silence."},
{q:"Que faut-il écrire avant de programmer des achats réguliers ?",opts:["Un prix à atteindre","Quand vendre : dans combien de temps, à quelles conditions, par quelles parts","La liste des cryptos à surveiller","Un budget pub"],correct:1,
explain:"Sans règle pour vendre, on accumule sans fin quelque chose qu'on ne revendra jamais."}
],
action:"Si tu as déjà des cryptos, écris ce soir en 3 lignes quand tu vendras : dans combien de temps, dans quelles conditions, et par quelles parts. Presque personne ne se pose la question avant d'acheter."
},
{module:"Module 3 — Décider avec méthode", title:"Reconnaître une arnaque", duration:"5 min",
script:[
"Les cryptos attirent beaucoup d'arnaques, pour 3 raisons : une opération ne peut pas être annulée, il n'y a pas de frontières, et le côté technique permet de cacher qu'il n'y a rien derrière. Cette leçon te donne des signes que tu peux vérifier.",
"<strong>Signe 1 : un gain promis, surtout s'il est régulier.</strong> Un placement dont le prix bouge beaucoup ne peut garantir aucun gain. Une promesse de 2 % par mois ou de 30 % par an, c'est soit une arnaque pure, soit un système où les premiers sont payés avec l'argent des suivants.",
"<strong>Signe 2 : l'urgence.</strong> Offre limitée, place réservée, prix qui va exploser. <u>L'urgence ne sert qu'à une chose : t'empêcher de vérifier.</u> C'est le signe le plus fiable de tous, car aucun projet sérieux n'a besoin de te presser.",
"<strong>Signe 3 : le parrainage payé.</strong> Si on gagne surtout en recrutant de nouveaux membres, et pas grâce à l'activité elle-même, c'est une pyramide. Peu importe l'emballage technologique.",
"<strong>Signe 4 : un « conseiller » que tu n'as pas demandé.</strong> Un inconnu te contacte, se montre patient, s'intéresse à ta vie, puis te dirige vers une plateforme de placement. Cette méthode est très répandue. <strong>Le signe qui ne trompe pas : on t'aide d'abord à retirer une petite somme avec un gain</strong>, pour gagner ta confiance avant que tu verses une grosse somme.",
"<strong>Signe 5 : impossible de retirer ton argent.</strong> On te parle de frais de déblocage, d'une taxe à payer avant le retrait, d'un problème technique. <u>Si on te demande de payer pour récupérer ton argent, c'est une arnaque. Toujours, sans exception.</u>",
"3 vérifications valent mieux que toutes les intuitions. Regarde la <strong>liste noire de l'AMF (Autorité des marchés financiers)</strong>, publique et gratuite. Vérifie que la plateforme est enregistrée auprès des autorités françaises. Et tape le nom du projet suivi du mot « arnaque » dans un moteur de recherche avant de verser quoi que ce soit.",
"Enfin, si tu es victime : <strong>signale-le, même si tu penses ne rien récupérer.</strong> Il existe des sites officiels pour ça. La honte est souvent la 1re réaction des victimes, et c'est justement ce qui protège les arnaqueurs."
],
quiz:[
{q:"Quel est le signe le plus fiable d'une arnaque ?",opts:["Un site mal traduit","L'urgence, qui ne sert qu'à t'empêcher de vérifier","Un gain modeste","Une plateforme étrangère"],correct:1,
explain:"Aucun projet sérieux n'a besoin de te presser. C'est le signe le plus constant, dans tous les domaines."},
{q:"Que veut dire une demande de paiement pour débloquer un retrait ?",opts:["Une taxe normale","Une arnaque, sans exception","Un problème technique passager","Une obligation légale"],correct:1,
explain:"Aucune plateforme honnête ne demande de payer pour te rendre ton argent."},
{q:"Quelle vérification gratuite existe en France ?",opts:["Un contrôle par ta banque","La liste noire de l'AMF","Un contrôle des impôts","Aucune"],correct:1,
explain:"Elle est publique, gratuite, et se consulte en quelques minutes avant tout versement."}
],
action:"Va voir la liste noire de l'AMF et parcours-la pendant 5 minutes. Regarde le genre de noms qu'on y trouve : sérieux, rassurants, professionnels. C'est justement ce qui rend ces arnaques efficaces."
},
{module:"Module 4 — Sécuriser ce que tu détiens", title:"Clés privées et phrase de récupération", duration:"5 min",
script:[
"Garder ses cryptos en sécurité est le sujet le plus important de cette formation, et le plus négligé. <strong>Chaque année, des sommes énormes sont perdues pour toujours</strong>, pas à cause d'arnaques, mais à cause d'erreurs de conservation.",
"Le principe surprend au début. Tes cryptos ne sont rangées nulle part : <u>elles sont inscrites sur la blockchain, et ce que tu possèdes, c'est la clé qui permet de les déplacer.</u> Un portefeuille crypto ne contient donc pas de cryptos. Il contient une clé.",
"<strong>La clé publique</strong> est ton adresse pour recevoir. Tu peux la donner sans risque. <strong>La clé privée</strong> permet de déplacer les cryptos : celui qui l'a contrôle tout, pour toujours et sans recours.",
"<strong>La phrase de récupération</strong> (en anglais <em>seed phrase</em>) est une suite de 12 ou 24 mots créée avec le portefeuille. Elle permet de recréer toutes les clés. C'est donc <strong>la chose la plus sensible de toutes</strong> : qui l'a possède tout, qui la perd perd tout.",
"<figure class=\"schema\"><svg viewBox=\"0 0 700 338\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"20\" y=\"24\" width=\"190\" height=\"54\" rx=\"9\" fill=\"#F0F1F7\" stroke=\"#171C45\" stroke-width=\"1.5\"/><text x=\"115\" y=\"47\" text-anchor=\"middle\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14.5\" font-weight=\"600\" fill=\"#171C45\">Ta phrase de récupération</text><text x=\"115\" y=\"65\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\" fill=\"#6B7094\">12 ou 24 mots</text><path d=\"M210 51 C 270 51, 270 66, 330 66\" fill=\"none\" stroke=\"#C27C00\" stroke-width=\"1.8\"/><circle cx=\"330\" cy=\"66\" r=\"4\" fill=\"#C27C00\"/><rect x=\"344\" y=\"43\" width=\"336\" height=\"46\" rx=\"8\" fill=\"#FDF2DA\" stroke=\"#C27C00\" stroke-width=\"1.3\"/><text x=\"360\" y=\"64\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"14\" font-weight=\"600\" fill=\"#171C45\">Sur papier ou métal</text><text x=\"664\" y=\"64\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"13\" fill=\"#C27C00\">jamais numérique</text><path d=\"M210 51 C 270 51, 270 128, 330 128\" fill=\"none\" stroke=\"#C27C00\" stroke-width=\"1.8\"/><circle cx=\"330\" cy=\"128\" r=\"4\" fill=\"#C27C00\"/><rect x=\"344\" y=\"105\" width=\"336\" height=\"46\" rx=\"8\" fill=\"#FDF2DA\" stroke=\"#C27C00\" stroke-width=\"1.3\"/><text x=\"360\" y=\"120\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"14\" font-weight=\"600\" fill=\"#171C45\">Plusieurs copies, lieux distincts</text><text x=\"360\" y=\"137\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11\" fill=\"#C27C00\">feu, eau, vol</text><path d=\"M210 51 C 270 51, 270 190, 330 190\" fill=\"none\" stroke=\"#A3213D\" stroke-width=\"1.8\"/><circle cx=\"330\" cy=\"190\" r=\"4\" fill=\"#A3213D\"/><rect x=\"344\" y=\"167\" width=\"336\" height=\"46\" rx=\"8\" fill=\"#FAEAEE\" stroke=\"#A3213D\" stroke-width=\"1.3\"/><text x=\"360\" y=\"182\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"14\" font-weight=\"600\" fill=\"#171C45\">Jamais communiquée</text><text x=\"360\" y=\"199\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11\" fill=\"#A3213D\">aucun support ne la demande</text><path d=\"M210 51 C 270 51, 270 252, 330 252\" fill=\"none\" stroke=\"#2B3A8F\" stroke-width=\"1.8\"/><circle cx=\"330\" cy=\"252\" r=\"4\" fill=\"#2B3A8F\"/><rect x=\"344\" y=\"229\" width=\"336\" height=\"46\" rx=\"8\" fill=\"#E9EBF7\" stroke=\"#2B3A8F\" stroke-width=\"1.3\"/><text x=\"360\" y=\"244\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"14\" font-weight=\"600\" fill=\"#171C45\">Testée avant tout transfert</text><text x=\"360\" y=\"261\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11\" fill=\"#2B3A8F\">une sauvegarde non testée n'en est pas une</text></svg><figcaption>Qui la possède possède tout, qui la perd perd tout. C'est l'élément le plus sensible de toute la formation.</figcaption></figure>",
"4 règles pour la garder, et aucune n'est facultative. <strong>1. Jamais sur un appareil.</strong> Pas de photo, pas de fichier, pas de cloud, pas de gestionnaire de mots de passe. Une phrase de récupération s'écrit sur papier, ou mieux, sur métal.",
"<strong>2. Plusieurs copies, dans des endroits différents.</strong> Un incendie ou une fuite d'eau détruit une copie unique. <strong>3. Ne la donne jamais à personne</strong>, même pas à un service client : <u>aucun vrai service client ne te demandera jamais ta phrase de récupération.</u> <strong>4. Vérifie-la</strong> : essaie de restaurer le portefeuille avec une petite somme avant d'y mettre une grosse somme.",
"Un point auquel presque personne ne pense, et qui mérite qu'on s'y arrête : <strong>que se passe-t-il si tu meurs ?</strong> Si rien n'est prévu, tes proches perdent ces cryptos pour toujours. Il faut un système bien pensé, qui te protège de ton vivant tout en permettant à tes proches d'y accéder après.",
"C'est un vrai problème, sans solution unique. C'est une bonne raison de garder les choses simples."
],

explain:"Les cryptos ne sont rangées nulle part : ce que tu as, c'est le droit de les déplacer."},
{q:"Comment garder une phrase de récupération ?",opts:["Dans un gestionnaire de mots de passe","Sur papier ou sur métal, en plusieurs copies à des endroits différents","En photo dans un album privé","Dans un e-mail envoyé à soi-même"],correct:1,

action:"Si tu as des cryptos, vérifie ce soir où se trouve ta phrase de récupération et sous quelle forme. Si elle est sur un appareil, recopie-la sur papier et efface la version numérique. Ce seul geste évite la plupart des pertes."
},
{module:"Module 4 — Sécuriser ce que tu détiens", title:"Portefeuille connecté ou hors ligne", duration:"5 min",
script:[
"Il y a 3 façons de garder des cryptos, avec des risques très différents. Le choix dépend de la somme et de la fréquence à laquelle tu t'en sers.",
"<strong>Sur une plateforme.</strong> Tu n'as aucune clé : c'est la plateforme qui te doit tes cryptos. C'est le plus simple, mais tu risques de tout perdre si la plateforme fait faillite ou se fait pirater. Ça convient à de petites sommes que tu utilises souvent.",
"<strong>Le portefeuille en ligne</strong> (en anglais <em>hot wallet</em>) : une application sur ton téléphone ou ton ordinateur, dont tu as les clés. Les cryptos sont vraiment à toi, mais <u>les clés sont sur un appareil connecté à internet</u>, donc à la portée des virus.",
"<strong>Le portefeuille physique</strong> (en anglais <em>cold wallet</em>) : un petit boîtier qui garde les clés hors d'internet. Les opérations sont validées à l'intérieur du boîtier, et la clé n'en sort jamais. C'est le plus sûr pour un particulier.",
"Une organisation raisonnable : répartir selon l'usage, comme ton argent entre compte courant et livret. <strong>Une petite somme sur la plateforme pour les opérations courantes, l'essentiel sur un portefeuille physique.</strong>",
"3 précautions sur les portefeuilles physiques, car les erreurs coûtent cher. <strong>1. Achète-le seulement chez le fabricant</strong>, jamais d'occasion ni sur un site de revente : un appareil déjà configuré peut contenir une phrase de récupération que quelqu'un d'autre connaît. <strong>2. Crée toi-même la phrase</strong> à la 1re utilisation. <u>Un appareil neuf ne doit jamais arriver avec une phrase déjà écrite.</u> Si c'est le cas, il est piégé.",
"<strong>3. La sauvegarde compte plus que l'appareil.</strong> Si le boîtier casse ou se perd, la phrase de récupération permet de tout récupérer sur un nouveau. À l'inverse, un boîtier en bon état sans sauvegarde ne te protège de rien si on te le vole ou si tu oublies le code.",
"Retiens l'ordre d'importance : <strong>c'est la qualité de ta sauvegarde qui fait ta sécurité, pas le prix de l'appareil.</strong>"
],
quiz:[
{q:"Quelle solution est la plus sûre ?",opts:["La plateforme","Le portefeuille physique, dont la clé ne sort jamais du boîtier","Le portefeuille en ligne","Un fichier protégé par mot de passe"],correct:1,
explain:"Les opérations sont validées dans le boîtier, hors d'internet, ce qui bloque les virus."},
{q:"Pourquoi ne jamais acheter un portefeuille physique d'occasion ?",opts:["La garantie ne marche plus","Il peut contenir une phrase que quelqu'un d'autre connaît","Les mises à jour sont bloquées","Le prix est le même"],correct:1,
explain:"Un appareil neuf ne doit jamais arriver avec une phrase déjà écrite. Si c'est le cas, il est piégé."},
{q:"Qu'est-ce qui fait vraiment ta sécurité ?",opts:["Le prix de l'appareil","La qualité de ta sauvegarde","La marque de l'appareil","Le nombre de portefeuilles"],correct:1,
explain:"Un boîtier en bon état sans sauvegarde ne protège de rien en cas de vol ou d'oubli du code."}
],
action:"Fais la liste de ce que tu as et où : plateforme, application, boîtier. Puis pose-toi une question simple : si on me volait mon téléphone ce soir, qu'est-ce que je perdrais ? La réponse te dit quoi changer en premier."
},
{module:"Module 4 — Sécuriser ce que tu détiens", title:"Configurer un portefeuille matériel", duration:"5 min",
script:[
"Cette leçon explique la mise en route étape par étape. Ça prend environ 30 minutes. Il y a 2 moments où une erreur ne peut pas être réparée : ils sont signalés.",
"<strong>Étape 1 : vérifier le colis.</strong> Emballage scellé, appareil neuf, aucune phrase de récupération fournie. <u>Si une phrase est déjà écrite quelque part dans la boîte, l'appareil est piégé</u> : ne l'utilise pas et contacte le fabricant.",
"<strong>Étape 2 : installer le logiciel officiel</strong>, en tapant toi-même l'adresse du fabricant dans ton navigateur. N'utilise jamais un lien reçu par message, ni une pub dans un moteur de recherche : les faux sites qui imitent les fabricants sont une arnaque courante.",
"<strong>Étape 3 : allumer l'appareil</strong> et choisir un code secret. Il protège l'accès au boîtier. Choisis-le assez long, et sans lien avec toi (pas ta date de naissance).",
"<strong>Étape 4, moment critique : noter la phrase de récupération.</strong> L'appareil affiche 12 ou 24 mots, un par un. Écris-les à la main sur le support fourni, dans l'ordre exact. <strong>Ne les prends jamais en photo, ne les tape jamais sur un ordinateur, ne les lis jamais à voix haute.</strong>",

{module:"Module 5 — Fiscalité et durée", title:"La fiscalité des crypto-actifs en France", duration:"5 min",
script:[
"Les impôts sur les cryptos sont mal connus. Les erreurs coûtent cher, car elles portent souvent sur des déclarations oubliées, punies par des amendes qui ne dépendent pas des montants.",
"<strong>Règle 1, qui surprend souvent : échanger une crypto contre une autre n'est pas imposé.</strong> Tant que tu restes dans le monde des cryptos, tu ne dois aucun impôt. <u>L'impôt est dû quand tu repasses en euros (ou autre vraie monnaie)</u>, ou quand tu paies un achat en cryptos.",
"<strong>Règle 2 : le taux.</strong> Pour un particulier qui gère son argent personnel, les gains sont imposés à la flat tax de <strong>30 %</strong>. Tu peux choisir le barème de l'impôt sur le revenu à la place s'il te coûte moins, ce qui est le cas si ton taux marginal (le taux de ta tranche la plus haute) est bas. Il n'y a pas d'impôt si <u>le total de tes ventes dans l'année ne dépasse pas 305 €</u>.",
"<strong>Règle 3 : le calcul.</strong> Il est particulier et déroute. On ne calcule pas vente par vente. La formule compare le prix de vente à la valeur totale de tout ce que tu possèdes au moment de la vente, en tenant compte de tout ce que tu as investi. <strong>À chaque vente, il faut donc connaître la valeur totale de tes cryptos ce jour-là.</strong>",
"Conséquence pratique très importante : <strong>il faut noter chaque opération au fur et à mesure.</strong> Reconstituer plusieurs années d'opérations après coup demande énormément de travail, et c'est parfois impossible si une plateforme a fermé.",
"<strong>Règle 4, la plus punie : les comptes ouverts à l'étranger doivent être déclarés chaque année</strong>, même vides, même sans aucune opération, sur un formulaire spécial joint à ta déclaration de revenus. <u>L'amende est fixe pour chaque compte non déclaré, quel que soit le montant dessus.</u> C'est donc l'erreur la plus chère pour les petits portefeuilles.",
"Enfin, certaines situations suivent d'autres règles et demandent l'aide d'un spécialiste : le minage, le staking (bloquer des jetons pour toucher une récompense), les revenus de la finance décentralisée, ou l'achat-revente fait de façon régulière, comme un métier.",
"Retiens l'ordre des priorités : <strong>déclarer tes comptes à l'étranger est plus urgent que de chercher à payer moins sur tes gains.</strong> Et vérifie les chiffres cités ici chaque année, après le vote du budget de l'État."

  window.location.href = 'index.html';
}

async function loadProgressFromServer(){
  const { data } = await sb
    .from('lesson_progress')
    .select('lesson_number, completed')
    .eq('user_id', CURRENT_USER.id)
    .eq('formation', FORMATION);
  const p = {};
  if(data){ data.forEach(function(row){ if(row.completed) p[row.lesson_number] = true; }); }
  PROGRESS_CACHE = p;
  return p;
}
function getProgress(){ return PROGRESS_CACHE; }
async function setProgressServer(lessonNumber, value){
  PROGRESS_CACHE[lessonNumber] = value;
  await sb.from('lesson_progress').upsert({
    user_id: CURRENT_USER.id,
    formation: FORMATION,
    lesson_number: lessonNumber,
    completed: value,
    completed_at: value ? new Date().toISOString() : null
  }, { onConflict: 'user_id,formation,lesson_number' });

  await majCarnet(lessonNumber, value);
}

/* Le carnet de route : l'action cochée s'inscrit dans le carnet personnel,
   la décocher l'en retire. Une erreur ici ne doit jamais bloquer la
   progression de la leçon, d'où le try/catch silencieux. */
async function majCarnet(lessonNumber, value){
  try {
    const l = LESSONS[lessonNumber - 1];
    if(!l) return;

    if(!value){
      await sb.from('carnet').delete()
        .eq('user_id', CURRENT_USER.id)
        .eq('formation', FORMATION)
        .eq('lesson_number', lessonNumber);
      return;
    }

    await sb.from('carnet').upsert({
      user_id: CURRENT_USER.id,
      formation: FORMATION,
      lesson_number: lessonNumber,
      titre: l.title || ('Leçon ' + lessonNumber),
      action: l.action || ''
    }, { onConflict: 'user_id,formation,lesson_number', ignoreDuplicates: true });
  } catch(e){
    console.warn('Carnet non mis à jour :', e);
  }
}

let current = parseInt(new URLSearchParams(location.search).get('l')) || 1;
if(current < 1) current = 1;
if(current > LESSONS.length) current = LESSONS.length;

function isUnlocked(n){
  if(n === 1) return true;
  const progress = getProgress();
  return !!progress[n-1];
}

let quizState = {};

function allQuizCorrect(l){
  for(let i=0;i<l.quiz.length;i++){ if(!quizState[i]) return false; }
  return true;
}

function renderSidebar(){
  const progress = getProgress();
  const doneCount = Object.keys(progress).filter(function(k){ return progress[k]; }).length;
  document.getElementById('navProgress').textContent = doneCount + '/' + LESSONS.length + ' leçons';

  /* Regroupement des lecons par module : c'est le module qui devient
     l'etape de l'itineraire, la lecon n'est qu'un arret. */
  const etapes = [];
  LESSONS.forEach(function(l, i){
    const nom = l.module.split(' — ')[1] || l.module;
    let e = etapes.find(function(x){ return x.nom === nom; });
    if(!e){ e = { nom: nom, lecons: [] }; etapes.push(e); }
    e.lecons.push({ n: i + 1, titre: l.title });
  });

  const etapeCourante = etapes.findIndex(function(e){
    return e.lecons.some(function(a){ return a.n === current; });
  });

  const COCHE = '<svg viewBox="0 0 24 24" fill="none"><path d="M5 12L10 17L19 7" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  let html = '<div class="itin">' +
    '<div class="itin-tete">' +
      '<div class="itin-formation">' + NOM_FORMATION + '</div>' +
      '<div class="itin-compte">Étape ' + (etapeCourante + 1) + ' sur ' + etapes.length + ' · ' + doneCount + '/' + LESSONS.length + ' leçons</div>' +
      '<div class="itin-barre"><span style="width:' + Math.round(doneCount / LESSONS.length * 100) + '%"></span></div>' +
    '</div><div class="route">';

  etapes.forEach(function(e, idx){
    const toutesFaites = e.lecons.every(function(a){ return progress[a.n]; });
    const ici = idx === etapeCourante;
    const premiereAccessible = e.lecons.find(function(a){ return isUnlocked(a.n); });
    const classe = toutesFaites ? 'faite' : (ici ? 'ici' : '');
    const borne = toutesFaites ? COCHE : String(idx + 1);
    const cible = premiereAccessible ? premiereAccessible.n : e.lecons[0].n;

    html += '<div class="etape-i ' + classe + '">' +
      '<span class="borne">' + borne + '</span>' +
      '<button class="etape-titre" onclick="goTo(' + cible + ')">' + e.nom + '</button>' +
      '<div class="etape-meta">' + e.lecons.length + ' leçon' + (e.lecons.length > 1 ? 's' : '') + '</div>';

    /* On ne deroule que l'etape ou l'on se trouve : la carte reste lisible. */
    if(ici){
      html += '<div class="arrets">';
      e.lecons.forEach(function(a){
        const fait = !!progress[a.n];
        const ouvert = isUnlocked(a.n);
        const cl = (a.n === current ? 'ici ' : '') + (fait ? 'faite ' : '') + (ouvert ? '' : 'bloque');
        html += '<div class="arret ' + cl + '" onclick="goTo(' + a.n + ')">' +
          '<span class="puce">' + COCHE + '</span><span>' + a.titre + '</span></div>';
      });
      html += '</div>';
    }
    html += '</div>';
  });

  html += '</div>' + escaleHtml() + '</div>';
  document.getElementById('sidebar').innerHTML = html;
}

/* Changer de formation sans repasser par le menu. */
const PARCOURS = [
  { cle:'monnaie',     nom:'Comprendre la monnaie',   page:'lecons-monnaie.html' },
  { cle:'psychologie', nom:"Psychologie de l'argent", page:'lecons-psychologie.html' },
  { cle:'budget',      nom:'Maîtriser son budget',    page:'lecons-budget.html' },
  { cle:'bourse',      nom:'Premiers pas en bourse',  page:'lecons-bourse.html' },
  { cle:'crypto',      nom:'Bitcoin & cryptomonnaies',page:'lecons-crypto.html' },
  { cle:'immobilier',  nom:'Investir dans la pierre', page:'lecons-immobilier.html' },
  { cle:'epargne',     nom:'Épargne & sécurité',      page:'lecons-epargne.html' },
  { cle:'fiscalite',   nom:'Optimisation fiscale',    page:'lecons-fiscalite.html' },
  { cle:'finance-islamique', nom:'Finance islamique', page:'lecons-finance-islamique.html' }
];

function escaleHtml(){
  let h = '<div class="escale"><div class="escale-titre">Autres formations</div>';
  PARCOURS.forEach(function(p){
    const courante = p.cle === FORMATION;
    h += '<a href="' + p.page + '" class="' + (courante ? 'courante' : 'prete') + '">' +
      '<span class="jeton"></span><span>' + p.nom + '</span></a>';
  });
  h += '</div>';
  return h;
}

function goTo(n){
  if(!isUnlocked(n)){
    alert('Termine la leçon précédente pour débloquer celle-ci.');
    return;
  }
  current = n;
  history.replaceState(null, '', '?l=' + n);
  render();
  window.scrollTo(0,0);
}

function render(){
  renderSidebar();
  const l = LESSONS[current-1];
  const progress = getProgress();
  const done = !!progress[current];
  quizState = {};
  if(done){ l.quiz.forEach(function(q,i){ quizState[i] = true; }); }
  const main = document.getElementById('main');
  let quizHtml = '';
  l.quiz.forEach(function(q, qi){
    let optsHtml = '';
    q.opts.forEach(function(opt, oi){
      const preAnswered = done && oi === q.correct;
      optsHtml += '<div class="quiz-opt ' + (preAnswered?'correct disabled':'') + '" id="q' + qi + 'o' + oi + '" onclick="answerQuiz(' + qi + ',' + oi + ',' + q.correct + ')">' +
        '<span class="quiz-letter">' + String.fromCharCode(65+oi) + '</span><span class="quiz-opt-text">' + opt + '</span></div>';
    });
    quizHtml += '<div class="quiz-card"><div class="quiz-q">Question ' + (qi+1) + '. ' + q.q + '</div>' + optsHtml +
      '<div class="quiz-explain ' + (done?'show':'') + '" id="exp' + qi + '"><strong>Explication : </strong>' + q.explain + '</div></div>';
  });

  const quizOk = allQuizCorrect(l);
  const actionCardStyle = (!quizOk && !done) ? 'opacity:.5;pointer-events:none;' : '';

  main.innerHTML =
    (done ? '<div class="completion-badge show">✓ Leçon terminée</div>' : '') +
    '<div class="lesson-eyebrow">' + l.module + '</div>' +
    '<div class="lesson-title">' + (current) + '. ' + l.title + '</div>' +
    '<div class="lesson-meta">' + l.duration + ' de lecture · Leçon ' + current + ' sur ' + LESSONS.length + '</div>' +
    '<div class="section-label"><span class="dot"></span>Comprendre</div>' +
    '<div class="script-text">' + l.script.map(function(p){
      return p.indexOf('<figure') === 0 ? p : '<p>' + p + '</p>';
    }).join('') + '</div>' +
    '<div class="section-label quiz"><span class="dot"></span>Vérifier</div>' +
    quizHtml +
    '<div class="section-label action"><span class="dot"></span>Petite action</div>' +
    (!quizOk && !done ? '<div style="font-size:12.5px;font-weight:600;color:var(--coral);margin-bottom:10px;">Réponds correctement aux ' + l.quiz.length + ' questions pour débloquer cette action.</div>' : '') +
    '<div class="action-card" id="actionCard" style="' + actionCardStyle + '">' +
      '<div class="action-text">' + l.action + '</div>' +
      '<div class="action-check" onclick="toggleAction()"><span class="action-box ' + (done?'checked':'') + '" id="actionBox">' + (done?'✓':'') + '</span><span class="action-label">Marquer cette leçon comme terminée</span></div>' +
    '</div>' +
    '<div class="lesson-nav">' +
      (current > 1 ? '<button class="nav-btn ghost" onclick="goTo(' + (current-1) + ')">← Leçon précédente</button>' : '<span></span>') +
      (current < LESSONS.length ? '<button class="nav-btn" onclick="goTo(' + (current+1) + ')">Leçon suivante →</button>' : '<a href="lecons-finance-islamique.html" class="nav-btn">Finance islamique →</a>') +
    '</div>' +

    '<div class="lesson-sortie">' +
      '<a href="index.html#formations">Sommaire des formations</a><span>·</span>' +
      '<a href="carnet.html">Mon carnet</a><span>·</span>' +
      '<a href="index.html">Retour au site</a>' +
    '</div>';
}

function answerQuiz(qi, oi, correct){
  if(quizState[qi]) return;
  const chosen = document.getElementById('q'+qi+'o'+oi);
  if(chosen.classList.contains('disabled')) return;

  if(oi === correct){
    for(let k=0;k<10;k++){
      const el = document.getElementById('q'+qi+'o'+k);
      if(el){ el.classList.add('disabled'); }
    }
    chosen.classList.add('correct');
    quizState[qi] = true;
    document.getElementById('exp'+qi).classList.add('show');
    const l = LESSONS[current-1];
    const quizOk = allQuizCorrect(l);
    const card = document.getElementById('actionCard');
    if(quizOk && card){
      card.style.opacity = '';
      card.style.pointerEvents = '';
      const lock = card.previousElementSibling;
      if(lock && lock.textContent.indexOf('Réponds correctement') !== -1){ lock.style.display = 'none'; }
    }
  } else {
    chosen.classList.add('wrong');
    document.getElementById('exp'+qi).classList.add('show');
    setTimeout(function(){ chosen.classList.remove('wrong'); }, 900);
  }
}

async function toggleAction(){
  const l = LESSONS[current-1];
  const progress = getProgress();
  const newValue = !progress[current];
  if(newValue && !allQuizCorrect(l)){
    alert('Réponds correctement à toutes les questions du quiz avant de valider cette leçon.');
    return;
  }
  await setProgressServer(current, newValue);
  render();

  /* La formation vient-elle de s'achever ? Si oui, on plante la borne.
     On ne la montre qu'au moment du basculement, jamais en revenant
     sur une leçon déjà validée. */
  if(newValue) verifierFinDeParcours();
}

async function verifierFinDeParcours(){
  const progress = getProgress();
  const faites = Object.keys(progress).filter(function(k){ return progress[k]; }).length;
  if(faites < LESSONS.length) return;

  let prenom = '';
  let semaines = 1;
  try {
    const { data } = await sb.from('profiles').select('prenom').eq('id', CURRENT_USER.id).maybeSingle();
    if(data && data.prenom) prenom = data.prenom;

    const { data: dates } = await sb.from('lesson_progress')
      .select('completed_at').eq('user_id', CURRENT_USER.id).eq('formation', FORMATION)
      .not('completed_at', 'is', null).order('completed_at', { ascending: true }).limit(1);
    if(dates && dates.length){
      const debut = new Date(dates[0].completed_at).getTime();
      semaines = Math.max(1, Math.round((Date.now() - debut) / (7*24*3600*1000)));
    }
  } catch(e){ console.warn('Carte : données partielles', e); }

  ouvrirCarte(FORMATION, LESSONS.length, prenom, semaines);
}

async function boot(){
  document.getElementById('main').innerHTML = '<div style="padding:60px 0;text-align:center;color:var(--ink-faint);font-size:14px;">Chargement de ta progression…</div>';
  const user = await requireAuth();
  if(!user) return;
  const unlocked = await requireUnlock(user.id);
  if(!unlocked) return;
  CURRENT_USER = user;
  await loadProgressFromServer();

  if(!isUnlocked(current)){
    let lastUnlocked = 1;
    for(let i=1;i<=LESSONS.length;i++){ if(isUnlocked(i)) lastUnlocked = i; else break; }
    current = lastUnlocked;
    history.replaceState(null, '', '?l=' + current);
  }
  render();
}
boot();
</script>
