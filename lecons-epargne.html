<!DOCTYPE html>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --ink:#171C45;--ink-soft:#44496B;--ink-muted:#6B7094;--ink-faint:#9599B5;
  --bg:#FFFFFF;--bg-soft:#F6F7FB;--bg-mid:#F0F1F7;--bg-line:#DCDEEA;
  --green:#2B3A8F;--green-light:#3B4BA8;--green-pale:#E9EBF7;--green-bord:#C5CAEB;
  --amber:#C27C00;--amber-pale:#FDF2DA;--amber-bord:#F0D49A;
  --violet:#4D5675;--violet-pale:#EEF0F5;--violet-bord:#D5D9E6;
  --coral:#A3213D;--coral-pale:#FAEAEE;
  --sans:'Archivo',system-ui,-apple-system,sans-serif;
  --display:'Archivo',system-ui,sans-serif;
  --mono:'Archivo',system-ui,sans-serif;
}
body{font-family:var(--sans);background:var(--bg-soft);color:var(--ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;}
a{color:inherit;}

.nav{position:sticky;top:0;z-index:200;background:rgba(255,255,255,.96);backdrop-filter:blur(20px);border-bottom:1px solid var(--bg-line);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;font-weight:800;font-size:15px;color:var(--ink);}
.nav-mark{width:26px;height:26px;border-radius:8px;background:var(--green);display:flex;align-items:center;justify-content:center;}
.nav-mark svg{width:14px;height:14px;}
.nav-back{font-size:13px;font-weight:600;color:var(--ink-muted);text-decoration:none;}
.nav-progress-pill{font-size:12px;font-weight:700;color:var(--green);background:var(--green-pale);padding:5px 12px;border-radius:100px;}

.layout{display:grid;grid-template-columns:280px 1fr;max-width:1100px;margin:0 auto;min-height:calc(100vh - 60px);}
.sidebar{border-right:1px solid var(--bg-line);background:var(--bg);padding:24px 16px;position:sticky;top:60px;align-self:start;height:calc(100vh - 60px);overflow-y:auto;}
.sb-progress-bar{height:6px;background:var(--bg-mid);border-radius:100px;overflow:hidden;margin:0 10px 18px;}
.sb-progress-fill{height:100%;background:var(--green);border-radius:100px;transition:width .3s;}
.sb-item{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:10px;cursor:pointer;margin-bottom:2px;font-size:13px;font-weight:600;color:var(--ink-muted);transition:background .15s;}
.sb-item:hover{background:var(--bg-soft);}
.sb-item.active{background:var(--green-pale);color:var(--green);}
.sb-item.done{color:var(--ink);}
.sb-item.locked{opacity:.45;cursor:not-allowed;}
.sb-item.locked:hover{background:transparent;}
.sb-check{width:20px;height:20px;border-radius:50%;background:var(--bg-mid);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink-faint);flex-shrink:0;}
.sb-item.done .sb-check{background:var(--green);color:#fff;}
.sb-item.active .sb-check{background:var(--green);color:#fff;}
.sb-module-label{font-size:13.5px;font-weight:700;color:var(--ink-faint);text-transform:none;letter-spacing:0;padding:14px 10px 6px;}

.main{padding:36px 40px 80px;max-width:720px;}
.lesson-eyebrow{font-size:13.5px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--green);margin-bottom:10px;}
.lesson-title{font-size:28px;font-weight:800;letter-spacing:-.03em;color:var(--ink);margin-bottom:8px;line-height:1.15;}
.lesson-meta{font-size:13px;color:var(--ink-faint);margin-bottom:32px;}

.section-label{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:800;letter-spacing:0;text-transform:none;color:var(--ink-muted);margin:36px 0 16px;}
.section-label .dot{width:6px;height:6px;border-radius:50%;background:var(--green);}
.section-label.quiz .dot{background:var(--violet);}
.section-label.action .dot{background:var(--amber);}

.script-text p{font-size:15.5px;font-weight:400;color:var(--ink-soft);line-height:1.75;margin-bottom:18px;}

.quiz-card{background:var(--bg);border:1px solid var(--bg-line);border-radius:16px;padding:24px;margin-bottom:14px;}
.quiz-q{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:16px;line-height:1.5;}
.quiz-opt{display:flex;align-items:flex-start;gap:12px;padding:13px 15px;border:1.5px solid var(--bg-line);border-radius:11px;margin-bottom:9px;cursor:pointer;transition:border-color .15s,background .15s;}
.quiz-opt:hover{border-color:var(--ink-faint);}
.quiz-opt.correct{border-color:var(--green);background:var(--green-pale);}
.quiz-opt.wrong{border-color:var(--coral);background:var(--coral-pale);}
.quiz-opt.disabled{cursor:default;pointer-events:none;}
.quiz-letter{width:24px;height:24px;border-radius:7px;background:var(--bg-soft);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--ink-muted);flex-shrink:0;}
.quiz-opt.correct .quiz-letter{background:var(--green);color:#fff;}
.quiz-opt.wrong .quiz-letter{background:var(--coral);color:#fff;}
.quiz-opt-text{font-size:13.5px;font-weight:500;color:var(--ink);padding-top:2px;}
.quiz-explain{display:none;font-size:13px;font-weight:400;color:var(--ink-muted);line-height:1.6;background:var(--bg-soft);border-radius:10px;padding:14px 16px;margin-top:8px;}
.quiz-explain.show{display:block;}
.quiz-explain strong{color:var(--ink);}

.action-card{background:var(--amber-pale);border:1px solid var(--amber-bord);border-radius:16px;padding:22px 24px;}
.action-text{font-size:14.5px;font-weight:500;color:var(--ink);line-height:1.65;margin-bottom:16px;}
.action-check{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;}
.action-box{width:22px;height:22px;border-radius:7px;border:2px solid var(--amber);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;transition:background .15s;}
.action-box.checked{background:var(--amber);}
.action-label{font-size:13px;font-weight:700;color:#8a6a00;}

.lesson-nav{display:flex;justify-content:space-between;align-items:center;margin-top:40px;padding-top:24px;border-top:1px solid var(--bg-line);}
.nav-btn{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border:none;cursor:pointer;font-family:var(--sans);font-size:14px;font-weight:700;padding:13px 24px;border-radius:11px;text-decoration:none;transition:background .2s;}
.nav-btn:hover{background:var(--ink-soft);}
.nav-btn.ghost{background:var(--bg-mid);color:var(--ink-muted);}
.nav-btn.ghost:hover{background:var(--bg-line);}
.completion-badge{display:none;align-items:center;gap:8px;background:var(--green-pale);color:var(--green);font-size:12.5px;font-weight:700;padding:8px 16px;border-radius:100px;margin-bottom:20px;}
.completion-badge.show{display:inline-flex;}

@media(max-width:860px){
  .layout{grid-template-columns:1fr;}
  .sidebar{position:static;height:auto;border-right:none;border-bottom:1px solid var(--bg-line);}
  .main{padding:28px 20px 60px;}
}

/* ===== Direction Encre & Laiton — surcouche typographique ===== */
body{font-family:var(--sans);letter-spacing:0;}
h1,h2,h3,h4,.hero-h1,.s-title,.cta-h2,.p-name,.mod-title,.c-title,.hc-title,
.lecon-title,.q-title,.auth-title,.perf-title,.section-title,.edu-title,.tips-title{
  font-family:var(--display);letter-spacing:-.015em;
}
.hero-h1,.s-title,.cta-h2,.auth-title{font-weight:500;letter-spacing:-.018em;line-height:1.16;}
h3,h4,.p-name,.mod-title,.c-title,.hc-title,.lecon-title{font-weight:600;}
.s-tag,.f-copy,.hstat-label,.stat-label,.perf-note,.order-meta,.pos-value,
.price-cell,.asset-label,.badge,.eyebrow,.nav-balance{font-family:var(--mono);}

.nav-name em,.ft-name em{font-style:normal;color:var(--amber);}

/* Mise en valeur dans le corps des lecons : le gras porte la notion a
   retenir, l italique la nuance ou le terme technique. */
.script-text strong{color:var(--ink,#171C45);font-weight:700;}
.script-text em{font-style:italic;color:var(--ink-soft,#44496B);}
.script-text u{text-decoration:none;background:linear-gradient(transparent 62%,var(--amber-pale,#FDF2DA) 62%);
  box-shadow:inset 0 -1px 0 var(--amber,#C27C00);}
.script-text p + p{margin-top:14px;}

/* ===== L'itineraire =====
   Une route verticale plutot qu'une liste : on voit d'ou l'on vient,
   ou l'on est, et ce qu'il reste. Meme vocabulaire graphique que le
   carnet de route et les emblemes. */
.itin{padding:4px 4px 24px;}
.itin-tete{padding:0 8px 16px;border-bottom:1px solid var(--bg-line);margin-bottom:16px;}
.itin-formation{font-family:var(--display);font-size:16px;font-weight:600;color:var(--ink);line-height:1.25;}
.itin-compte{font-family:var(--mono);font-size:13.5px;letter-spacing:0;text-transform:none;
  color:var(--ink-muted);margin-top:7px;}
.itin-barre{height:4px;background:var(--bg-mid);border-radius:100px;overflow:hidden;margin-top:10px;}
.itin-barre span{display:block;height:100%;background:var(--amber);border-radius:100px;transition:width .4s cubic-bezier(.4,0,.2,1);}

/* La route */
.route{position:relative;padding-left:30px;}
.route::before{content:"";position:absolute;left:11px;top:14px;bottom:14px;width:2px;
  background:repeating-linear-gradient(var(--bg-line) 0 6px, transparent 6px 11px);}
.etape-i{position:relative;margin-bottom:6px;}
.borne{position:absolute;left:-30px;top:6px;width:24px;height:24px;border-radius:50%;
  background:var(--bg);border:2px solid var(--bg-line);display:grid;place-items:center;
  font-family:var(--mono);font-size:10px;color:var(--ink-faint);z-index:1;transition:all .2s;}
.borne svg{width:11px;height:11px;}
.etape-i.faite .borne{background:var(--amber);border-color:var(--amber);color:#fff;}
.etape-i.ici .borne{background:var(--green);border-color:var(--green);color:#fff;
  box-shadow:0 0 0 4px var(--green-pale);}
.etape-titre{display:block;width:100%;text-align:left;background:transparent;border:0;cursor:pointer;
  font-family:var(--display);font-size:14.5px;font-weight:600;color:var(--ink-soft);
  padding:7px 9px;border-radius:9px;line-height:1.3;transition:background .15s,color .15s;}
.etape-titre:hover{background:var(--bg-soft);color:var(--ink);}
.etape-i.ici .etape-titre{color:var(--green);}
.etape-i.faite .etape-titre{color:var(--ink);}
.etape-meta{font-family:var(--mono);font-size:10px;color:var(--ink-faint);padding:0 9px 4px;letter-spacing:.06em;}

/* Les lecons de l'etape en cours */
.arrets{margin:2px 0 12px;padding-left:9px;border-left:1px solid var(--bg-line);}
.arret{display:flex;align-items:flex-start;gap:9px;padding:7px 9px;border-radius:8px;cursor:pointer;
  font-size:12.8px;font-weight:500;color:var(--ink-muted);transition:background .15s;line-height:1.35;}
.arret:hover{background:var(--bg-soft);color:var(--ink);}
.arret.ici{background:var(--green-pale);color:var(--green);font-weight:700;}
.arret.faite{color:var(--ink);}
.arret.bloque{opacity:.42;cursor:not-allowed;}
.arret.bloque:hover{background:transparent;}
.puce{width:15px;height:15px;border-radius:4px;flex:none;margin-top:1px;border:1.5px solid var(--bg-line);
  display:grid;place-items:center;background:var(--bg);}
.puce svg{width:9px;height:9px;opacity:0;}
.arret.faite .puce{background:var(--amber);border-color:var(--amber);}
.arret.faite .puce svg{opacity:1;}
.arret.ici .puce{border-color:var(--green);border-style:dashed;}

/* Changer de formation sans repasser par le menu */
.escale{margin-top:22px;padding-top:16px;border-top:1px solid var(--bg-line);}
.escale-titre{font-family:var(--mono);font-size:13.5px;letter-spacing:0;text-transform:none;
  color:var(--ink-faint);padding:0 9px 9px;}
.escale a{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;text-decoration:none;
  font-size:12.8px;color:var(--ink-soft);transition:background .15s;}
.escale a:hover{background:var(--bg-soft);color:var(--ink);}
.escale a.courante{background:var(--green-pale);color:var(--green);font-weight:700;}
.jeton{width:7px;height:7px;border-radius:50%;background:var(--bg-line);flex:none;}
.escale a.courante .jeton{background:var(--green);}
.escale a.prete .jeton{background:var(--amber);}

@media(max-width:860px){
  .itin{padding-bottom:8px;}
  .route{padding-left:26px;}
  .borne{left:-26px;}
}
@media(prefers-reduced-motion:reduce){*{transition:none !important;}}

/* ===== Schemas des lecons ===== */
.schema{margin:26px 0;padding:20px 18px 14px;border:1px solid var(--bg-line,#DCDEEA);
  border-radius:12px;background:var(--bg,#FFFFFF);}
.schema svg{width:100%;height:auto;display:block;}
.schema figcaption{font-family:var(--mono,'Archivo',sans-serif);font-size:11.5px;line-height:1.55;
  color:var(--ink-muted,#6B7094);margin-top:14px;padding-top:12px;
  border-top:1px solid var(--bg-line,#DCDEEA);}
@media(max-width:620px){.schema{padding:14px 12px 10px;margin:20px -6px;}}

/* Sortie de leçon : on peut toujours s'arrêter sans se sentir coincé. */
.lesson-sortie{display:flex;flex-wrap:wrap;align-items:center;gap:9px;justify-content:center;
  margin-top:24px;padding-top:18px;border-top:1px solid var(--bg-line);
  font-size:13.5px;color:var(--ink-faint);}
.lesson-sortie a{color:var(--ink-muted);text-decoration:none;font-weight:600;}
.lesson-sortie a:hover{color:var(--green);}
</style>

<script>
/* ============ DONNÉES DES 16 LEÇONS — MAÎTRISER SON BUDGET ============ */
const LESSONS = [
{module:"Module 1 — Pourquoi se protéger d'abord", title:"L'ordre dans lequel tout doit se faire", duration:"5 min",
script:[
"Il y a une erreur qui coûte plus cher que toutes les autres. Ce n'est pas de choisir le mauvais placement. C'est d'investir avant de s'être protégé. Cette leçon est là pour te l'éviter, car elle ne se rattrape pas. Elle détruit à la fois ton argent et ta confiance dans l'investissement.",
"Ça se passe presque toujours de la même façon. Quelqu'un met de l'argent de côté pendant des mois. Il entend parler d'investissement, comprend que son livret ne rapporte presque rien, et place ses économies. 3 mois plus tard, sa voiture tombe en panne. Ou il perd son emploi. Ou son propriétaire lui demande une caution imprévue. Il doit vendre. Et il vend au pire moment, car les urgences ne choisissent jamais leur date.",
"Ce piège a un nom : <strong>la vente forcée</strong>. Une perte passagère devient une perte définitive. <strong>Un placement qui baisse de 20 % n'a rien perdu tant que tu ne vends pas.</strong> Sur une longue période, les marchés ont toujours fini par remonter. Mais si tu dois vendre pendant la baisse, ces 20 % deviennent réels et définitifs. Tu n'auras pas perdu à cause d'un mauvais placement. Tu auras perdu parce que tu n'avais pas d'épargne de secours.",
"<figure class=\"schema\"><svg viewBox=\"0 0 700 286\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"20\" y=\"202\" width=\"250\" height=\"52\" rx=\"9\" fill=\"#E9EBF7\" stroke=\"#2B3A8F\" stroke-width=\"1.4\"/><circle cx=\"46\" cy=\"228\" r=\"12\" fill=\"#2B3A8F\"/><text x=\"46\" y=\"232\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\" fill=\"#fff\">1</text><text x=\"70\" y=\"224\" font-family=\"Newsreader, Georgia, serif\" font-size=\"15\" font-weight=\"600\" fill=\"#171C45\">Combler le découvert</text><text x=\"70\" y=\"241\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">Tant qu'il dure, il coûte plus cher que tout le reste.</text><rect x=\"20\" y=\"138\" width=\"383\" height=\"52\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#DCDEEA\" stroke-width=\"1.4\"/><circle cx=\"46\" cy=\"164\" r=\"12\" fill=\"#DCDEEA\"/><text x=\"46\" y=\"168\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\" fill=\"#fff\">2</text><text x=\"70\" y=\"160\" font-family=\"Newsreader, Georgia, serif\" font-size=\"15\" font-weight=\"600\" fill=\"#171C45\">Constituer un fonds d'urgence</text><text x=\"70\" y=\"177\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">Disponible immédiatement, sans risque de perte.</text><rect x=\"20\" y=\"74\" width=\"517\" height=\"52\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#DCDEEA\" stroke-width=\"1.4\"/><circle cx=\"46\" cy=\"100\" r=\"12\" fill=\"#DCDEEA\"/><text x=\"46\" y=\"104\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\" fill=\"#fff\">3</text><text x=\"70\" y=\"96\" font-family=\"Newsreader, Georgia, serif\" font-size=\"15\" font-weight=\"600\" fill=\"#171C45\">Rembourser les dettes chères</text><text x=\"70\" y=\"113\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">Un crédit conso à 6 % est un rendement garanti de 6 %.</text><rect x=\"20\" y=\"10\" width=\"650\" height=\"52\" rx=\"9\" fill=\"#FDF2DA\" stroke=\"#C27C00\" stroke-width=\"1.4\"/><circle cx=\"46\" cy=\"36\" r=\"12\" fill=\"#C27C00\"/><text x=\"46\" y=\"40\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\" fill=\"#fff\">4</text><text x=\"70\" y=\"32\" font-family=\"Newsreader, Georgia, serif\" font-size=\"15\" font-weight=\"600\" fill=\"#171C45\">Investir</text><text x=\"70\" y=\"49\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">Et seulement maintenant, avec ce qu'on ne touchera pas.</text></svg><figcaption>L'ordre ne se discute pas : chaque étape rend la suivante possible sans avoir à revenir en arrière.</figcaption></figure>",
"Voici donc l'ordre à retenir, et à ne jamais inverser. <strong>1.</strong> Sortir du découvert, si tu y es souvent. <strong>2.</strong> Te faire une épargne de secours (on dit aussi « fonds d'urgence »), disponible tout de suite. <strong>3.</strong> Rembourser tes crédits chers. <strong>4.</strong> Et seulement ensuite, investir.",
"Cet ordre paraît lent. Il l'est. C'est justement ce qui le rend solide. Chaque étape rend la suivante possible, sans retour en arrière. Ceux qui réussissent à investir sur 20 ans ne sont pas ceux qui ont commencé le plus tôt. Ce sont ceux qui n'ont jamais eu à s'arrêter.",
"Il y a une exception. Si ton employeur ajoute de l'argent quand tu verses sur ton épargne salariale (on appelle ça l'abondement), ça peut valoir le coup d'y verser le minimum, même sans épargne de secours complète. Un abondement de 50 %, c'est un gain immédiat que rien d'autre n'égale. Mais c'est la seule exception. Et elle ne vaut que pour la somme abondée, pas un euro de plus.",
"Au fond, la sécurité n'est pas l'ennemie du rendement. Elle en est la condition. Un investisseur protégé peut traverser une crise sans rien faire. Et ne rien faire pendant une crise, c'est souvent ce qui rapporte le plus. Un investisseur sans protection sera obligé d'agir au pire moment, même s'il est très bien informé."
],
quiz:[
{q:"Pourquoi une baisse des marchés devient-elle une perte définitive ?",opts:["Parce que les marchés ne remontent jamais après une forte baisse","Parce qu'on doit vendre pendant la baisse pour faire face à un imprévu","Parce que les frais augmentent quand les marchés baissent","Parce que l'État taxe plus les pertes"],correct:1,
explain:"Tant qu'on ne vend pas, une baisse reste une perte sur le papier. C'est la vente forcée qui la rend réelle. L'épargne de secours sert à ne jamais en arriver là."},
{q:"Quel est le bon ordre ?",opts:["Investir, puis se faire une épargne de secours avec les gains","Rembourser ses crédits, investir, puis épargner","Sortir du découvert, se faire une épargne de secours, rembourser les crédits chers, puis investir","Tout faire en même temps, à parts égales"],correct:2,
explain:"Chaque étape rend la suivante possible. C'est lent, mais c'est ce qui évite de tout arrêter au premier imprévu."},
{q:"Quelle est la seule exception à cet ordre ?",opts:["Une occasion à ne pas manquer","L'argent ajouté par l'employeur sur l'épargne salariale","Un conseil d'un proche qui s'y connaît","Une période où les marchés montent fort"],correct:1,
explain:"L'abondement, c'est de l'argent offert par l'employeur : un gain immédiat. L'exception ne vaut que pour la somme abondée."}
],
action:"Ce soir, regarde honnêtement où tu en es dans les 4 étapes : découvert, épargne de secours, crédits chers, investissement. Note l'étape où tu es vraiment, pas celle où tu aimerais être. C'est ton point de départ pour toute la formation."
},
{module:"Module 1 — Pourquoi se protéger d'abord", title:"Ce qu'est vraiment un imprévu", duration:"5 min",
script:[
"Quand on demande aux gens s'ils ont des imprévus, la plupart disent non, ou rarement. Quand on regarde leurs relevés sur 3 ans, c'est presque toujours l'inverse. Pourquoi ? On appelle imprévu <em>ce qu'on ne pouvait pas deviner</em>. Il faudrait plutôt appeler imprévu <em>ce qu'on n'a pas préparé</em>. Ce n'est pas du tout pareil.",
"Voici des dépenses que presque tout le monde voit comme des imprévus. Un lave-linge à remplacer. Une réparation de voiture. Un voyage pour un enterrement. Un téléphone cassé. Une franchise d'assurance. Un mois où l'on travaille moins. Aucune n'est vraiment imprévisible. Un lave-linge dure 8 à 12 ans. Une voiture a besoin d'entretien chaque année. Un téléphone finit par tomber. <strong>Ce qu'on ne connaît pas, c'est la date. Pas le fait que ça arrivera.</strong>",
"Ça change tout. Ce n'est plus une question de chance, mais d'organisation. Tu ne sais pas quel mois ton lave-linge lâchera. Mais tu sais qu'il lâchera. Tu peux donc mettre de côté pour ça. Payé avec ton épargne de secours, un imprévu est juste un ennui. Payé avec un crédit, il devient une mensualité pendant 3 ans.",
"Voici une méthode simple. Fais-la vraiment, ne te contente pas de la lire. Reprends tes relevés des 36 derniers mois. Repère chaque dépense de plus de 200 € qui n'était pas une charge fixe. Additionne-les, puis divise par 36. Tu obtiens ce que te coûtent vraiment les imprévus chaque mois.",
"La plupart des gens trouvent un chiffre entre 60 et 150 € par mois. Cet argent partait déjà. Simplement, on ne le voyait pas. Il était payé au coup par coup, souvent avec un découvert. Une fois le chiffre écrit, on arrête de subir. On met de côté à l'avance.",
"Un mot sur la charge mentale, car elle compte autant que l'argent. Sans épargne de secours, tu sais qu'un simple incident peut te mettre en difficulté pendant des mois. Cette inquiétude permanente fatigue. Elle pousse aussi à des choix prudents par peur : renoncer à une formation, accepter un travail moins payé mais plus sûr, rester dans une situation qui ne te convient plus. Une épargne de secours n'achète pas seulement du calme. Elle te donne de la liberté pour faire des choix."
],
quiz:[
{q:"Qu'est-ce qu'un imprévu, au fond ?",opts:["Une dépense impossible à deviner","Une dépense dont on ne connaît pas la date, mais qui arrivera","Une dépense de plus de 1 000 €","Une dépense due à un accident"],correct:1,
explain:"Un lave-linge finit toujours par tomber en panne. Seule la date est inconnue. C'est pour ça qu'on peut mettre de côté à l'avance."},
{q:"Comment calculer ce que te coûtent les imprévus chaque mois ?",opts:["En estimant un montant au hasard","En prenant 10 % de son salaire","En additionnant les dépenses exceptionnelles des 36 derniers mois, puis en divisant par 36","En demandant une moyenne à sa banque"],correct:2,
explain:"Seuls tes relevés disent la vérité. 3 ans mélangent les années calmes et les années difficiles."},
{q:"Quel est l'effet le moins visible quand on n'a pas d'épargne de secours ?",opts:["Plus de frais bancaires","Moins de liberté dans ses choix de vie","Une moins bonne note auprès de la banque","Des assurances plus chères"],correct:1,
explain:"Sans épargne, on fait des choix par peur : rester dans un emploi qui ne convient plus, renoncer à une formation. Ce coût-là n'apparaît sur aucun relevé."}
],
action:"Ouvre tes relevés et remonte 36 mois en arrière. Note chaque dépense exceptionnelle de plus de 200 €. Additionne, puis divise par 36. Écris le résultat là où tu le reverras. C'est ce que tu devrais mettre de côté chaque mois. Cet argent partait déjà avant que tu le calcules."
},
{module:"Module 2 — Construire son fonds d'urgence", title:"Combien exactement, et pourquoi ce montant", duration:"5 min",
script:[
"On lit partout qu'il faut 3 à 6 mois de dépenses de côté. C'est utile, mais trop vague pour passer à l'action. Et on ne sait pas de quelles dépenses on parle. Cette leçon t'aide à trouver ton chiffre à toi.",
"Premier point, souvent mal compris : on calcule l'épargne de secours sur tes dépenses, pas sur ton salaire. Prenons 2 personnes qui gagnent 3 000 €. L'une dépense 1 800 €, l'autre 3 600 €. Elles n'ont pas besoin de la même réserve. <strong>Ce que tu dois pouvoir tenir, c'est ton train de vie, pas ton salaire.</strong>",
"Deuxième point : quelles dépenses compter. Prends seulement tes dépenses indispensables, celles que tu paierais même sans emploi : logement, énergie, nourriture, transport minimum, assurances, crédits. Laisse de côté les loisirs, les vacances et les abonnements que tu pourrais suspendre. On calcule un budget de survie, pas de confort. En général, il est 20 à 30 % plus bas que tes dépenses habituelles.",
"<figure class=\"schema\"><svg viewBox=\"0 0 700 228\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"200\" y=\"20\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" letter-spacing=\"1.4\" fill=\"#2B3A8F\">SITUATION STABLE</text><text x=\"560\" y=\"20\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" letter-spacing=\"1.4\" fill=\"#C27C00\">REVENUS IRRÉGULIERS</text><text x=\"20\" y=\"44\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">Salarié en CDI, foyer à 2 revenus</text><rect x=\"20\" y=\"54\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#F0F1F7\"/><rect x=\"20\" y=\"54\" width=\"561\" height=\"18\" rx=\"5\" fill=\"#E9EBF7\"/><rect x=\"581\" y=\"54\" width=\"99\" height=\"18\" rx=\"5\" fill=\"#FDF2DA\"/><text x=\"28\" y=\"67\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#2B3A8F\">3 mois</text><text x=\"672\" y=\"67\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8F5F00\"></text><text x=\"20\" y=\"100\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">Salarié seul, contrat court</text><rect x=\"20\" y=\"110\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#F0F1F7\"/><rect x=\"20\" y=\"110\" width=\"363\" height=\"18\" rx=\"5\" fill=\"#E9EBF7\"/><rect x=\"383\" y=\"110\" width=\"297\" height=\"18\" rx=\"5\" fill=\"#FDF2DA\"/><text x=\"28\" y=\"123\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#2B3A8F\">6 mois</text><text x=\"672\" y=\"123\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8F5F00\"></text><text x=\"20\" y=\"156\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">Indépendant, intermittent</text><rect x=\"20\" y=\"166\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#F0F1F7\"/><rect x=\"20\" y=\"166\" width=\"132\" height=\"18\" rx=\"5\" fill=\"#E9EBF7\"/><rect x=\"152\" y=\"166\" width=\"528\" height=\"18\" rx=\"5\" fill=\"#FDF2DA\"/><text x=\"28\" y=\"179\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#2B3A8F\"></text><text x=\"672\" y=\"179\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8F5F00\">9 à 12 mois</text></svg><figcaption>Le nombre de mois se calcule sur les charges incompressibles, jamais sur le salaire.</figcaption></figure>",
"Troisième point : combien de mois. Ça dépend de la stabilité de tes revenus. 3 mois suffisent pour un fonctionnaire, ou un salarié en CDI dans un foyer avec 2 salaires. 6 mois conviennent mieux à un salarié seul en contrat court, dans un secteur fragile, ou avec des enfants à charge. 9 à 12 mois pour un indépendant, un intermittent ou un revenu très irrégulier : les périodes sans travail y sont plus fréquentes et plus longues.",
"Un exemple. Dépenses indispensables : 1 400 € par mois. Salarié seul, en CDI, dans un secteur stable. 4 mois de sécurité, ça fait 5 600 €. Vu d'un coup, ça peut décourager. C'est pour ça qu'il faut le découper.",
"Voici 3 étapes. La première compte plus que les 2 autres. <strong>Étape 1 : 1 000 €.</strong> Ça couvre la plupart des petits pépins et ça suffit pour sortir du découvert. <strong>Étape 2 : 1 mois de dépenses.</strong> Tu tiens un coup dur sans emprunter. <strong>Étape 3 : le montant complet.</strong> La plupart des gens abandonnent parce qu'ils visent directement la troisième. Vise la première.",
"Dernier point : savoir s'arrêter. Une épargne de secours trop grosse a un coût. L'argent dort sur un livret qui rapporte peu et perd de la valeur avec l'inflation. Une fois le montant atteint, n'en rajoute pas juste pour te rassurer. Passe à l'étape suivante. La sécurité est une base, pas un but."
],
quiz:[
{q:"Sur quoi calcule-t-on l'épargne de secours ?",opts:["Sur son salaire net","Sur ses dépenses indispensables","Sur son loyer multiplié par 3","Sur la moyenne nationale"],correct:1,
explain:"Ce que tu dois tenir, c'est ton train de vie minimum, pas ton salaire. 2 personnes au même salaire peuvent avoir des besoins très différents."},
{q:"Combien de mois pour un indépendant ?",opts:["1 mois","3 mois","9 à 12 mois","2 ans"],correct:2,
explain:"Avec un revenu irrégulier, les périodes sans travail sont plus fréquentes et plus longues. 3 à 6 mois, c'est pour des salariés stables."},
{q:"Pourquoi ne pas dépasser le montant visé ?",opts:["Parce que la banque limite les versements","Parce que cet argent perd de la valeur avec l'inflation","Parce que les intérêts deviennent imposables","Parce que le plafond du livret A l'interdit"],correct:1,
explain:"L'épargne de secours est une base, pas un but. Au-delà, l'argent sert mieux à l'étape suivante."}
],
action:"Ce soir, calcule tes dépenses indispensables du mois, sans les loisirs ni les abonnements que tu peux suspendre. Multiplie par le nombre de mois qui correspond à ta situation. Puis note seulement la première étape, 1 000 €, et la date où tu comptes l'atteindre. C'est le seul chiffre à viser pour l'instant."
},
{module:"Module 2 — Construire son fonds d'urgence", title:"Où le placer, et pourquoi le rendement ne compte pas", duration:"5 min",
script:[
"Une fois le montant fixé, une question revient toujours : où mettre cet argent pour qu'il rapporte un peu ? La réponse surprend. Pour une épargne de secours, <strong>ce que ça rapporte passe en dernier</strong>, loin derrière 2 autres critères.",
"Premier critère : l'argent doit être disponible tout de suite. Tu dois pouvoir le récupérer en quelques heures, sans délai, sans pénalité, sans demander l'accord de personne. Un placement bloqué 3 mois ne convient pas, même s'il rapporte plus.",
"Deuxième critère : la valeur ne doit jamais baisser. Jamais. Un placement qui bouge, même un peu, peut être en baisse le jour précis où tu en as besoin. C'est exactement le problème que l'épargne de secours doit éviter.",
"Ces 2 critères éliminent beaucoup de choses. Pas d'actions, évidemment. Pas de placements bloqués sur une durée. En France, il reste surtout les livrets réglementés : le livret A, le LDDS, et le LEP pour ceux qui y ont droit selon leurs revenus. On peut retirer son argent à tout moment, on ne peut pas perdre ce qu'on a versé, et les intérêts ne sont pas imposés.",
"Ces livrets ont des plafonds. C'est plutôt une bonne chose : ils t'empêchent d'y laisser dormir trop d'argent. Les plafonds et les taux changent de temps en temps. Vérifie les chiffres du moment plutôt que de te fier à ce que tu as appris il y a 2 ans.",
"Faut-il séparer cet argent de ton compte courant ? Oui, sans hésiter. Pas pour une raison financière, mais psychologique. L'argent que tu vois sur ton compte courant finit par être dépensé, car ton cerveau le compte comme disponible. Un livret à part, si possible dans une autre banque, ajoute quelques minutes avant de pouvoir y toucher. Ça suffit pour faire la différence entre un vrai imprévu et une envie du moment.",
"Et l'inflation ? Si elle est plus forte que le taux du livret, ton épargne perd un peu de valeur chaque année. C'est vrai, et ce n'est pas grave : <strong>ce n'est pas un placement, c'est une assurance.</strong> Personne ne reproche à son assurance habitation de ne rien rapporter. Ce que tu paies, c'est le droit de ne jamais devoir vendre au mauvais moment."
],
quiz:[
{q:"Quels sont les 2 critères les plus importants pour une épargne de secours ?",opts:["Ce que ça rapporte et les impôts","Disponible tout de suite, et valeur qui ne baisse jamais","La réputation de la banque et la facilité d'ouverture","Le plafond et la durée de blocage"],correct:1,
explain:"L'argent doit être là en quelques heures, sans avoir baissé. Ce que ça rapporte passe loin derrière."},
{q:"Pourquoi séparer l'épargne de secours du compte courant ?",opts:["Parce que la loi l'oblige","Pour avoir un meilleur taux","Parce que l'argent visible sur le compte courant finit par être dépensé","Pour éviter des frais"],correct:2,
explain:"C'est une question de psychologie. Quelques minutes de délai suffisent à séparer un vrai imprévu d'une envie."},
{q:"« Cette épargne perd de la valeur avec l'inflation. » Que répondre ?",opts:["C'est faux, les livrets suivent toujours l'inflation","C'est vrai, mais c'est une assurance, pas un placement","Il faut donc la placer en actions","Il faut la réduire au strict minimum"],correct:1,
explain:"C'est le prix de la sécurité. Tu achètes le droit de ne jamais devoir vendre au pire moment."}
],
action:"Ce soir, regarde où se trouve ton épargne de secours. Si elle est sur ton compte courant, ouvre un livret à part, si possible dans une autre banque. Ça prend 10 minutes en ligne. C'est la seule action de cette formation qui a un effet dès le lendemain."
},
{module:"Module 2 — Construire son fonds d'urgence", title:"L'alimenter sans y penser", duration:"5 min",
script:[
"Presque tout le monde sait qu'il faudrait épargner. Très peu y arrivent sur la durée. Ce n'est ni de la paresse ni un manque d'argent. C'est une question de méthode, et surtout d'ordre.",
"La méthode qui échoue, c'est celle de la plupart des gens : dépenser d'abord, épargner ce qui reste en fin de mois. Ça échoue parce qu'il ne reste presque jamais rien. Nos dépenses grandissent toutes seules jusqu'à prendre tout l'argent disponible. Tant que tout ton salaire est disponible, tout ton salaire finit dépensé.",
"La méthode qui marche inverse simplement l'ordre : <strong>on épargne d'abord, on dépense ce qui reste.</strong> On appelle ça <em>se payer en premier</em>. En pratique, un virement automatique part vers ton livret le lendemain de la paie. Tu n'as rien à décider.",
"<figure class=\"schema\"><svg viewBox=\"0 0 700 276\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"20\" y=\"24\" width=\"190\" height=\"54\" rx=\"9\" fill=\"#F0F1F7\" stroke=\"#171C45\" stroke-width=\"1.5\"/><text x=\"115\" y=\"47\" text-anchor=\"middle\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14.5\" font-weight=\"600\" fill=\"#171C45\">Ton salaire</text><text x=\"115\" y=\"65\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\" fill=\"#6B7094\">le 1 du mois</text><path d=\"M210 51 C 270 51, 270 66, 330 66\" fill=\"none\" stroke=\"#C27C00\" stroke-width=\"1.8\"/><circle cx=\"330\" cy=\"66\" r=\"4\" fill=\"#C27C00\"/><rect x=\"344\" y=\"43\" width=\"336\" height=\"46\" rx=\"8\" fill=\"#FDF2DA\" stroke=\"#C27C00\" stroke-width=\"1.3\"/><text x=\"360\" y=\"64\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"14\" font-weight=\"600\" fill=\"#171C45\">Épargne, virement automatique</text><text x=\"664\" y=\"64\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"13\" fill=\"#C27C00\">le 2 du mois</text><path d=\"M210 51 C 270 51, 270 128, 330 128\" fill=\"none\" stroke=\"#2B3A8F\" stroke-width=\"1.8\"/><circle cx=\"330\" cy=\"128\" r=\"4\" fill=\"#2B3A8F\"/><rect x=\"344\" y=\"105\" width=\"336\" height=\"46\" rx=\"8\" fill=\"#E9EBF7\" stroke=\"#2B3A8F\" stroke-width=\"1.3\"/><text x=\"360\" y=\"126\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"14\" font-weight=\"600\" fill=\"#171C45\">Charges fixes, prélèvements</text><text x=\"664\" y=\"126\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"13\" fill=\"#2B3A8F\">du 5 au 10</text><path d=\"M210 51 C 270 51, 270 190, 330 190\" fill=\"none\" stroke=\"#2B3A8F\" stroke-width=\"1.8\"/><circle cx=\"330\" cy=\"190\" r=\"4\" fill=\"#2B3A8F\"/><rect x=\"344\" y=\"167\" width=\"336\" height=\"46\" rx=\"8\" fill=\"#E9EBF7\" stroke=\"#2B3A8F\" stroke-width=\"1.3\"/><text x=\"360\" y=\"188\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"14\" font-weight=\"600\" fill=\"#171C45\">Ce qui reste pour vivre</text><text x=\"664\" y=\"188\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"13\" fill=\"#2B3A8F\">le reste du mois</text></svg><figcaption>Se payer en premier : l'épargne part avant que le compte ne redevienne un solde disponible.</figcaption></figure>",
"3 détails font la différence entre un virement qui tient et un virement qu'on finit par annuler. <strong>La date</strong> : le lendemain de la paie, pas en fin de mois. <strong>Ce que tu ne vois jamais ne te manque pas.</strong> <strong>Le montant</strong> : commence volontairement trop bas. 50 € chaque mois pendant 2 ans, c'est bien mieux que 300 € abandonnés au troisième mois. <strong>L'automatique</strong> : un virement à faire à la main dépend de ta volonté. Et ta volonté sera occupée ailleurs.",
"Une fois que ça tourne, augmente doucement : 10 € de plus tous les 2 mois. Tu ne le sentiras pas. Et au bout d'un an, le montant aura bien grimpé. Encore plus efficace : à chaque augmentation de salaire, envoie la moitié de la hausse vers l'épargne, avant de t'habituer à la dépenser. Ton niveau de vie ne baisse jamais, et tu épargnes de plus en plus.",
"Une chose qu'on ne dit pas assez. Si un mois le virement ne passe pas parce que le compte est trop juste, ce n'est pas un échec. C'est un signal : le montant était trop haut. Baisse-le et continue. Le seul vrai échec serait de tout arrêter. Un virement arrêté ne repart presque jamais."
],
quiz:[
{q:"Pourquoi épargner ce qui reste en fin de mois ne marche presque jamais ?",opts:["Parce que les banques prennent leurs frais en fin de mois","Parce que les dépenses grandissent jusqu'à prendre tout l'argent disponible","Parce que les salaires arrivent trop tard","Parce que les livrets refusent les petits versements"],correct:1,
explain:"Tant que tout le salaire est disponible, il finit dépensé. Il faut mettre l'argent de côté avant, pas après."},
{q:"Quand programmer le virement ?",opts:["Le dernier jour du mois","Le lendemain de la paie","Le 15 du mois","Quand il reste assez"],correct:1,
explain:"Ce que tu ne vois pas ne te manque pas. Un virement en fin de mois saute dès que le mois a été dur."},
{q:"Que faire si le virement ne passe pas un mois ?",opts:["Tout arrêter et recommencer plus tard","Verser le double le mois suivant","Baisser le montant et continuer","Passer à un virement à la main"],correct:2,
explain:"Un virement qui saute veut dire que le montant était trop haut. Le seul vrai échec serait d'arrêter."}
],
action:"Ce soir, programme un virement automatique dans ton appli bancaire, vers ton livret, le lendemain de ta paie. Choisis un montant que tu ne sentiras pas, même s'il paraît ridicule. Ce soir, le montant compte peu. Ce qui compte, c'est que le virement existe."
},
{module:"Module 3 — Se protéger des accidents", title:"Les assurances qui comptent vraiment", duration:"5 min",
script:[
"L'épargne de secours couvre les petits coups durs. Elle ne couvre pas les événements rares qui coûtent des dizaines ou des centaines de milliers d'euros. Pour ceux-là, aucune épargne ne suffit. C'est le rôle de l'assurance : faire porter à quelqu'un d'autre un risque que tu ne peux pas payer.",
"Un principe simple pour décider. <strong>On assure ce qu'on ne pourrait pas payer soi-même. Et seulement ça.</strong> Le reste, ton épargne s'en charge. C'est pour ça qu'assurer sa responsabilité civile est presque toujours utile, et qu'assurer un téléphone à 600 € ne l'est presque jamais.",
"Voyons ce qui compte vraiment. La responsabilité civile, souvent incluse dans l'assurance habitation, paie les dégâts que tu causes aux autres. Si un accident blesse gravement quelqu'un, les sommes peuvent être énormes. C'est la protection la plus importante, et souvent la moins chère.",
"<figure class=\"schema\"><svg viewBox=\"0 0 700 284\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"200\" y=\"20\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" letter-spacing=\"1.4\" fill=\"#2B3A8F\">TON FONDS D'URGENCE ABSORBE</text><text x=\"560\" y=\"20\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" letter-spacing=\"1.4\" fill=\"#C27C00\">L'ASSURANCE PREND LE RELAIS</text><text x=\"20\" y=\"44\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">Panne d'électroménager</text><rect x=\"20\" y=\"54\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#F0F1F7\"/><rect x=\"20\" y=\"54\" width=\"594\" height=\"18\" rx=\"5\" fill=\"#E9EBF7\"/><rect x=\"614\" y=\"54\" width=\"66\" height=\"18\" rx=\"5\" fill=\"#FDF2DA\"/><text x=\"28\" y=\"67\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#2B3A8F\">600 €</text><text x=\"672\" y=\"67\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8F5F00\"></text><text x=\"20\" y=\"100\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">Franchise auto</text><rect x=\"20\" y=\"110\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#F0F1F7\"/><rect x=\"20\" y=\"110\" width=\"607\" height=\"18\" rx=\"5\" fill=\"#E9EBF7\"/><rect x=\"627\" y=\"110\" width=\"53\" height=\"18\" rx=\"5\" fill=\"#FDF2DA\"/><text x=\"28\" y=\"123\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#2B3A8F\">400 €</text><text x=\"672\" y=\"123\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8F5F00\"></text><text x=\"20\" y=\"156\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">Dommage causé à autrui</text><rect x=\"20\" y=\"166\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#F0F1F7\"/><rect x=\"20\" y=\"166\" width=\"40\" height=\"18\" rx=\"5\" fill=\"#E9EBF7\"/><rect x=\"60\" y=\"166\" width=\"620\" height=\"18\" rx=\"5\" fill=\"#FDF2DA\"/><text x=\"28\" y=\"179\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#2B3A8F\"></text><text x=\"672\" y=\"179\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8F5F00\">jusqu'à des centaines de milliers</text><text x=\"20\" y=\"212\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">Arrêt de travail de 6 mois</text><rect x=\"20\" y=\"222\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#F0F1F7\"/><rect x=\"20\" y=\"222\" width=\"79\" height=\"18\" rx=\"5\" fill=\"#E9EBF7\"/><rect x=\"99\" y=\"222\" width=\"581\" height=\"18\" rx=\"5\" fill=\"#FDF2DA\"/><text x=\"28\" y=\"235\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#2B3A8F\"></text><text x=\"672\" y=\"235\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8F5F00\">prévoyance</text></svg><figcaption>On assure ce qu'on ne pourrait pas payer soi-même. Le reste, c'est de l'auto-assurance.</figcaption></figure>",
"L'assurance habitation est obligatoire pour un locataire et très conseillée pour un propriétaire. Vérifie 2 choses qu'on oublie souvent. La franchise : elle doit rester payable avec ton épargne de secours. Et tes objets de valeur : sont-ils vraiment couverts ? Il faut parfois les déclarer à part.",
"Pour la mutuelle, fais un vrai calcul plutôt que de choisir au hasard. Compare ce qu'elle te coûte par an à tes vraies dépenses de santé des 3 dernières années. Selon ta situation, la mutuelle d'entreprise, un contrat léger ou un contrat renforcé peut être le bon choix. Ça dépend de tes soins, surtout lunettes et dentiste.",
"<strong>La prévoyance est la grande oubliée.</strong> Et c'est la plus grave. Elle te protège en cas d'arrêt de travail long, d'invalidité ou de décès. Un salarié est souvent couvert par son entreprise : vérifie-le au lieu de le supposer. Un indépendant touche souvent très peu en cas d'arrêt. 6 mois d'arrêt peuvent alors mettre toute une famille en difficulté. Si tu es à ton compte, c'est le premier contrat à regarder, avant même d'investir.",
"Un mot sur les assurances proposées au moment d'un achat. Extension de garantie sur l'électroménager, assurance carte bancaire, assurance sur un petit crédit : ces produits rapportent beaucoup à ceux qui les vendent. Ils couvrent des risques que ton épargne de secours peut déjà payer. Ce ne sont pas des arnaques. Mais on les vend à des gens qui n'en ont pas besoin, au moment où ils prennent le moins le temps de calculer."
],
quiz:[
{q:"Comment décider s'il faut assurer un risque ?",opts:["Assurer tout ce qui a de la valeur","Assurer ce qu'on ne pourrait pas payer soi-même","Assurer ce que la banque conseille","Assurer seulement ce qui est obligatoire"],correct:1,
explain:"L'assurance sert pour les risques trop lourds. Ce que ton épargne peut payer n'a pas besoin d'être assuré."},
{q:"Quelle protection les indépendants oublient-ils le plus ?",opts:["L'assurance habitation","La prévoyance, en cas d'arrêt de travail ou d'invalidité","L'assurance scolaire","L'assurance carte bancaire"],correct:1,
explain:"Un indépendant touche souvent très peu en cas d'arrêt. Un arrêt long peut mettre toute une famille en difficulté."},
{q:"Pourquoi les extensions de garantie servent-elles rarement ?",opts:["Parce qu'elles sont illégales","Parce qu'elles couvrent un risque que ton épargne peut déjà payer","Parce qu'elles ne marchent jamais","Parce qu'elles doublent le prix"],correct:1,
explain:"Les montants en jeu sont petits. Et on te les vend au moment de l'achat, quand tu calcules le moins."}
],
action:"Ce soir, cherche ton contrat de prévoyance, ou celui de ton entreprise. Trouve une seule info : combien toucherais-tu par mois pendant un arrêt de travail de 6 mois ? Si tu ne trouves pas en 10 minutes, c'est déjà un signal. C'est la question à poser en premier."
},
{module:"Module 3 — Se protéger des accidents", title:"Le crédit à la consommation, ce qu'il coûte vraiment", duration:"5 min",
script:[
"L'épargne de secours sert à ne pas emprunter. Il faut donc comprendre ce qu'on évite. Et pourquoi le crédit à la consommation mérite une attention spéciale.",
"D'abord, 2 types de dettes à ne pas confondre. Une dette qui achète un bien durable, comme un crédit immobilier : le bien garde ou prend de la valeur, et le taux est en général modéré. Une dette qui achète une consommation : ce qu'on achète perd sa valeur, et le taux est bien plus élevé. La première peut être un outil. La seconde est presque toujours un coût.",
"Pourquoi on ne voit pas ce coût ? Parce qu'on te parle en mensualités. Une mensualité paraît toujours petite, car on la compare à son salaire du mois, pas au prix total. Or la seule question qui compte : combien aurai-je payé à la fin ? Un crédit de 12 000 € sur 5 ans au TAEG de 6,5 % coûte environ 2 100 € de plus que la somme empruntée. L'objet ne coûte donc pas 12 000 €, mais 14 000 €.",
"Deuxième piège : allonger la durée. Si tu dis que la mensualité est trop haute, on te proposera d'allonger. La mensualité baisse, tu te sens soulagé. Mais le coût total grimpe fortement. <strong>C'est le seul cas où un produit devient plus cher justement parce que tu as dit qu'il l'était trop.</strong>",
"Attention au crédit renouvelable, aussi appelé <em>revolving</em>. Son taux est souvent proche du maximum autorisé par la loi. Et l'argent remboursé redevient disponible tout seul. On peut donc rembourser pendant des années sans jamais voir la dette baisser. Si tu en as un, le rembourser passe avant tout le reste. Même avant de compléter ton épargne de secours au-delà des premiers 1 000 €.",
"Il y a un ordre à respecter, et il surprend. Rembourser un crédit en avance te fait gagner à coup sûr l'équivalent de son taux. C'est excellent. Mais si tu n'as plus aucune épargne après, tu devras réemprunter au premier imprévu, souvent plus cher. D'où l'ordre : d'abord 1 000 € de côté, puis rembourser vite les dettes chères, puis compléter ton épargne de secours.",
"Un droit qu'on oublie souvent : tu peux rembourser un crédit à la consommation en avance. Des frais peuvent s'appliquer au-delà d'un certain montant. Ils sont plafonnés par la loi, et presque toujours bien plus faibles que les intérêts économisés."
],
quiz:[
{q:"Quelle est la grande différence entre les 2 types de dettes ?",opts:["Le montant emprunté","L'une achète un bien qui garde sa valeur, l'autre une consommation qui disparaît","La durée du remboursement","La banque qui la propose"],correct:1,
explain:"Un crédit immobilier achète un bien qui garde de la valeur. Un crédit à la consommation achète quelque chose qui en perd, à un taux plus élevé."},
{q:"Que se passe-t-il quand on allonge la durée d'un crédit ?",opts:["La mensualité baisse et le coût total aussi","La mensualité baisse et le coût total augmente","Rien ne change","Le taux baisse automatiquement"],correct:1,
explain:"C'est ce qu'on te proposera si tu trouves la mensualité trop haute. Et ça rend le crédit plus cher."},
{q:"Dans quel ordre gérer dettes et épargne ?",opts:["Tout rembourser d'abord, épargner ensuite","1 000 € de côté, puis les dettes chères, puis le reste de l'épargne de secours","Toute l'épargne d'abord, les dettes ensuite","Moitié-moitié"],correct:1,
explain:"Sans aucune épargne, on réemprunte au premier imprévu, souvent plus cher. Les 1 000 € protègent tes efforts de remboursement."}
],
action:"Ce soir, liste tous tes crédits en cours. Pour chacun, note le TAEG et ce qu'il reste à rembourser. Classe-les du taux le plus élevé au plus bas. Très peu de gens ont cette liste. C'est l'ordre exact dans lequel les rembourser."
},
{module:"Module 4 — Après le fonds d'urgence", title:"Les enveloppes, et à quoi sert chacune", duration:"5 min",
script:[
"Une fois l'épargne de secours faite et les dettes chères remboursées, où mettre la suite ? Pour répondre, il faut comprendre une différence que beaucoup de gens n'ont jamais entendue. Elle explique la moitié des confusions sur le sujet.",
"<strong>Une enveloppe n'est pas un placement.</strong> L'enveloppe, c'est la boîte, avec ses propres règles d'impôts et ses contraintes. Le placement, c'est ce que tu mets dans la boîte. Le livret A est une boîte qui ne contient qu'une chose : de l'argent qui rapporte un petit intérêt. Le PEA est une boîte qui contient des actions européennes ou des fonds qui les suivent. L'assurance-vie est une boîte qui peut contenir un fonds en euros et d'autres supports.",
"Cette différence aide à se poser les bonnes questions, dans le bon ordre. D'abord : quand aurai-je besoin de cet argent ? Ensuite : quelle enveloppe va avec ce délai ? Enfin seulement : que mettre dedans ? Faire l'inverse, choisir un placement puis chercher où le mettre, mène presque toujours à des erreurs qui coûtent cher.",
"<figure class=\"schema\"><svg viewBox=\"0 0 700 168\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><line x1=\"34\" y1=\"96\" x2=\"666\" y2=\"96\" stroke=\"#DCDEEA\" stroke-width=\"2\"/><path d=\"M666 96 l-9 -5 v10 z\" fill=\"#DCDEEA\"/><line x1=\"47\" y1=\"96\" x2=\"47\" y2=\"62\" stroke=\"#2B3A8F\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/><circle cx=\"47\" cy=\"96\" r=\"7\" fill=\"#2B3A8F\"/><circle cx=\"47\" cy=\"96\" r=\"12\" fill=\"none\" stroke=\"#2B3A8F\" stroke-width=\"1\" opacity=\".35\"/><text x=\"47\" y=\"52\" text-anchor=\"start\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14\" font-weight=\"600\" fill=\"#171C45\">Aujourd'hui</text><text x=\"47\" y=\"122\" text-anchor=\"start\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12\" fill=\"#44496B\">Livrets réglementés</text><line x1=\"262\" y1=\"96\" x2=\"262\" y2=\"62\" stroke=\"#C27C00\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/><circle cx=\"262\" cy=\"96\" r=\"7\" fill=\"#C27C00\"/><circle cx=\"262\" cy=\"96\" r=\"12\" fill=\"none\" stroke=\"#C27C00\" stroke-width=\"1\" opacity=\".35\"/><text x=\"262\" y=\"52\" text-anchor=\"middle\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14\" font-weight=\"600\" fill=\"#171C45\">2 ans</text><text x=\"262\" y=\"122\" text-anchor=\"middle\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12\" fill=\"#44496B\">L'assurance-vie prend le relais</text><line x1=\"451\" y1=\"96\" x2=\"451\" y2=\"62\" stroke=\"#C27C00\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/><circle cx=\"451\" cy=\"96\" r=\"7\" fill=\"#C27C00\"/><circle cx=\"451\" cy=\"96\" r=\"12\" fill=\"none\" stroke=\"#C27C00\" stroke-width=\"1\" opacity=\".35\"/><text x=\"451\" y=\"52\" text-anchor=\"middle\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14\" font-weight=\"600\" fill=\"#171C45\">5 ans</text><text x=\"451\" y=\"122\" text-anchor=\"middle\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12\" fill=\"#44496B\">Le PEA devient léger</text><line x1=\"647\" y1=\"96\" x2=\"647\" y2=\"62\" stroke=\"#C27C00\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/><circle cx=\"647\" cy=\"96\" r=\"7\" fill=\"#C27C00\"/><circle cx=\"647\" cy=\"96\" r=\"12\" fill=\"none\" stroke=\"#C27C00\" stroke-width=\"1\" opacity=\".35\"/><text x=\"647\" y=\"52\" text-anchor=\"end\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14\" font-weight=\"600\" fill=\"#171C45\">8 ans</text><text x=\"647\" y=\"122\" text-anchor=\"end\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12\" fill=\"#44496B\">L'assurance-vie mature</text></svg><figcaption>L'horizon détermine l'enveloppe. Le compteur des 5 et 8 ans démarre à l'ouverture, pas au versement.</figcaption></figure>",
"Voici les délais et leurs enveloppes. <strong>Besoin de l'argent dans moins de 2 ans</strong> : les livrets réglementés. Disponibles, sans risque, sans impôt. <strong>Entre 2 et 8 ans</strong> : l'assurance-vie devient intéressante. Son avantage fiscal arrive au bout de 8 ans : il vaut donc mieux l'ouvrir tôt, même avec peu. <strong>Plus de 8 ans, pour investir en actions</strong> : le PEA, le plus léger en impôts après 5 ans.",
"2 astuces qui ne coûtent rien et rapportent beaucoup. La première : pour le PEA et l'assurance-vie, <strong>le compteur des avantages fiscaux démarre à l'ouverture, pas au premier gros versement.</strong> Les ouvrir avec quelques dizaines d'euros lance le compteur. Ensuite, tu fais ce que tu veux. C'est sans doute la décision la plus rentable par minute que tu prendras cette année.",
"La seconde : les enveloppes ne s'opposent pas. La plupart des gens en ont plusieurs, chacune pour un délai différent. La question n'est pas laquelle choisir, mais laquelle va avec quel projet.",
"Un mot sur le PER (plan d'épargne retraite), dont on parle beaucoup. Ce que tu y verses est déduit de tes revenus imposables. Plus tu paies d'impôts, plus c'est intéressant. En échange, l'argent est bloqué jusqu'à la retraite. Sauf quelques cas prévus par la loi, comme l'achat de ta résidence principale. Ce blocage doit être pesé sérieusement. Un avantage fiscal ne compense jamais le fait de ne pas pouvoir toucher à son argent quand on en a besoin."
],
quiz:[
{q:"Quelle différence entre une enveloppe et un placement ?",opts:["Aucune, c'est la même chose","L'enveloppe est la boîte avec ses règles d'impôts, le placement est ce qu'on met dedans","L'enveloppe est réservée aux pros","Le placement est garanti, l'enveloppe non"],correct:1,
explain:"Un PEA est une boîte. Les actions ou fonds qu'il contient sont le placement. Confondre les deux pousse à choisir un placement avant de savoir où le mettre."},
{q:"Dans quel ordre réfléchir ?",opts:["Le placement, puis l'enveloppe, puis le délai","Le délai, puis l'enveloppe, puis le placement","L'enveloppe la plus connue, puis la remplir","Selon le conseil de sa banque"],correct:1,
explain:"Le délai, c'est-à-dire quand tu auras besoin de l'argent, décide de tout le reste."},
{q:"Pourquoi ouvrir tôt un PEA ou une assurance-vie, même avec peu ?",opts:["Pour avoir un meilleur taux","Parce que le compteur des avantages fiscaux démarre à l'ouverture","Parce que les frais baissent avec le temps","Parce que c'est obligatoire avant 30 ans"],correct:1,
explain:"Le compteur des 5 ans ou des 8 ans démarre à l'ouverture. Quelques dizaines d'euros suffisent."}
],
action:"Ce soir, regarde si tu as déjà un PEA ou une assurance-vie, et depuis quand. Si tu n'en as pas et que tu penses investir un jour, sache que l'ouverture prend environ 20 minutes en ligne. Pas besoin de le faire ce soir. Mais retiens que le compteur ne démarre pas tout seul."
},
{module:"Module 4 — Après le fonds d'urgence", title:"Épargner pour un projet daté", duration:"5 min",
script:[
"Entre l'épargne de secours, réservée aux coups durs, et l'investissement, qu'on ne touche pas pendant des années, il y a une épargne que presque personne n'organise : l'épargne pour un projet. Permis de conduire, déménagement, mariage, voyage, apport pour un logement, nouvelle voiture.",
"Une règle simple, et c'est ce qui fait sa force : <strong>plus le projet est proche, moins on prend de risque.</strong> Un projet dans moins de 2 ans se finance seulement avec des placements sans risque de perte. Sur une courte durée, il n'y a pas le temps de se remettre d'une baisse. Placer son apport en actions 6 mois avant d'acheter un logement, c'est un risque qu'aucun gain espéré ne justifie.",
"Le calcul est simple. Le prix du projet, divisé par le nombre de mois avant la date, donne ce qu'il faut mettre de côté chaque mois. Si c'est trop, il n'y a que 3 solutions. Repousser la date. Revoir le projet à la baisse. Ou gagner plus. Espérer un gros rendement pour combler l'écart n'est pas une solution. <em>C'est un pari.</em>",
"Sépare chaque projet. Un livret à part, ou au moins une ligne à part dans ton tableau de budget. Si tout est mélangé sur un seul compte (épargne de secours, vacances, apport pour un logement), tu finis par piocher dans l'apport pour les vacances, sans l'avoir vraiment décidé.",
"Donner un nom au compte change beaucoup. Un compte appelé « épargne », on y pioche facilement. Un compte appelé « apport appartement, juin 2028 », beaucoup moins. Retirer de l'argent veut alors dire repousser ce projet précis. C'est gratuit, et c'est une des astuces les plus efficaces de cette formation.",
"Dernier point : prévois une marge. Un projet coûte presque toujours plus cher que prévu, de 10 à 20 % selon les cas. Un déménagement, ce n'est pas que le camion. Il y a aussi la caution, les frais d'agence, les abonnements à changer, les placards à remplir. Prévoir cette marge dès le départ t'évite d'emprunter à la fin et de perdre une partie de tes efforts."
],
quiz:[
{q:"Où placer l'argent d'un projet prévu dans 18 mois ?",opts:["En actions, pour gagner plus","Sur des placements sans risque de perte","Moitié actions, moitié livret","Sur un plan bloqué jusqu'à la date"],correct:1,
explain:"Sur une courte durée, pas le temps de se remettre d'une baisse. Le risque ne vaut pas le gain espéré."},
{q:"Que faire si la somme à mettre de côté chaque mois est trop élevée ?",opts:["Chercher un placement qui rapporte plus","Repousser la date, revoir le projet à la baisse, ou gagner plus","Emprunter la différence","Puiser dans l'épargne de secours"],correct:1,
explain:"Ce sont les 3 seules vraies solutions. Espérer un gros rendement, c'est un pari, pas un plan."},
{q:"Pourquoi donner un nom précis à un compte projet ?",opts:["Pour les impôts","Parce que retirer de l'argent veut alors dire repousser ce projet","Parce que la banque l'exige","Pour avoir un meilleur taux"],correct:1,
explain:"Un compte « épargne », on y pioche sans y penser. Un compte « apport appartement, juin 2028 » oblige à voir ce qu'on abandonne."}
],
action:"Choisis un projet que tu repousses depuis longtemps. Donne-lui ce soir 3 choses : un montant, une date et un nom. Divise le montant par le nombre de mois restants, puis ajoute 15 % de marge. Tu as ton versement du mois. Ton projet n'est plus un souhait : c'est une ligne de ton budget."
},
{module:"Module 5 — Tenir dans la durée", title:"Protéger ses proches, et se protéger soi", duration:"5 min",
script:[
"Cette leçon parle d'un sujet que la plupart des formations évitent. C'est dommage : il concerne tout le monde, et l'ignorer coûte très cher. Que se passe-t-il pour ton argent si tu décèdes, ou si tu ne peux plus gérer tes affaires ?",
"Premier constat, très concret : personne ne sait où est ton argent. Tes comptes, tes contrats, tes livrets, tes comptes en ligne. Chaque année en France, des sommes énormes ne sont jamais réclamées. Simplement parce que les proches ne savaient pas qu'elles existaient. Ce n'est pas un problème de loi. C'est un manque d'information.",
"La solution tient sur une feuille, et elle est gratuite. Écris la liste de tes comptes et contrats, avec le nom des banques ou assureurs. Sans mots de passe ni codes. Indique où trouver les papiers. Range cette feuille dans un endroit qu'une personne de confiance connaît. Ce n'est pas un testament et ça n'a aucune valeur légale. Ce n'est pas le but. C'est une carte. Elle évite à tes proches des mois de recherches, au pire moment de leur vie.",
"Deuxième point : la clause bénéficiaire de l'assurance-vie. C'est le document le plus important de l'épargne, et le moins relu. C'est elle qui dit qui recevra l'argent. Une clause écrite il y a 15 ans peut désigner un ex-conjoint, oublier un enfant né depuis, ou être si floue qu'elle crée un conflit. Relis-la après chaque grand changement dans ta famille.",
"Troisième point, souvent découvert trop tard : au décès d'une personne, un compte joint et un compte individuel ne fonctionnent pas pareil. Les règles changent selon le type de compte et la situation familiale. Pose la question précise à ta banque au lieu de supposer. Ce qu'il faut retenir : <strong>un foyer où une seule personne gère tout est un foyer fragile.</strong>",
"Ce qui m'amène au dernier point, le plus facile à appliquer dès ce soir. Dans beaucoup de couples, une seule personne s'occupe de l'argent. L'autre ne sait pas où sont les comptes, ni les dates à respecter, ni comment marche le budget. C'est pratique, jusqu'au jour où ça ne l'est plus. L'autre personne se retrouve alors totalement dépendante. 1 heure de discussion par an, avec la liste sous les yeux, suffit à éviter ce risque.",
"Ce n'est agréable pour personne d'y penser. Mais 1 heure de préparation peut éviter des mois de difficultés aux gens qu'on aime. C'est aussi ça, très concrètement, se protéger."
],
quiz:[
{q:"Pourquoi certaines sommes ne sont-elles jamais réclamées après un décès ?",opts:["Parce que les banques les gardent exprès","Parce que les proches ne savent pas que les comptes existent","Parce que la loi l'autorise après un an","Parce que les frais de succession les absorbent"],correct:1,
explain:"C'est un manque d'information. Une simple liste des banques et assureurs, sans aucun code, suffit."},

async function requireUnlock(userId){
  /* La formation d'entrée n'est jamais verrouillée : la vérifier ici
     provoquerait une redirection de la page vers elle-même, donc une
     boucle infinie. */

async function loadProgressFromServer(){
  const { data } = await sb
    .from('lesson_progress')
    .select('lesson_number, completed')
    .eq('user_id', CURRENT_USER.id)
    .eq('formation', FORMATION);
  const p = {};
  if(data){ data.forEach(function(row){ if(row.completed) p[row.lesson_number] = true; }); }
  PROGRESS_CACHE = p;
  return p;
}
function getProgress(){ return PROGRESS_CACHE; }
async function setProgressServer(lessonNumber, value){
  PROGRESS_CACHE[lessonNumber] = value;
  await sb.from('lesson_progress').upsert({
    user_id: CURRENT_USER.id,
    formation: FORMATION,
    lesson_number: lessonNumber,
    completed: value,
    completed_at: value ? new Date().toISOString() : null
  }, { onConflict: 'user_id,formation,lesson_number' });

  await majCarnet(lessonNumber, value);
}

/* Le carnet de route : l'action cochée s'inscrit dans le carnet personnel,
   la décocher l'en retire. Une erreur ici ne doit jamais bloquer la
   progression de la leçon, d'où le try/catch silencieux. */
async function majCarnet(lessonNumber, value){
  try {
    const l = LESSONS[lessonNumber - 1];
    if(!l) return;

    if(!value){
      await sb.from('carnet').delete()
        .eq('user_id', CURRENT_USER.id)
        .eq('formation', FORMATION)
        .eq('lesson_number', lessonNumber);
      return;
    }

    await sb.from('carnet').upsert({
      user_id: CURRENT_USER.id,
      formation: FORMATION,
      lesson_number: lessonNumber,
      titre: l.title || ('Leçon ' + lessonNumber),
      action: l.action || ''
    }, { onConflict: 'user_id,formation,lesson_number', ignoreDuplicates: true });
  } catch(e){
    console.warn('Carnet non mis à jour :', e);
  }
}

let current = parseInt(new URLSearchParams(location.search).get('l')) || 1;
if(current < 1) current = 1;
if(current > LESSONS.length) current = LESSONS.length;

function isUnlocked(n){
  if(n === 1) return true;
  const progress = getProgress();
  return !!progress[n-1];
}

function renderSidebar(){
  const progress = getProgress();
  const doneCount = Object.keys(progress).filter(function(k){ return progress[k]; }).length;
  document.getElementById('navProgress').textContent = doneCount + '/' + LESSONS.length + ' leçons';

  /* Regroupement des lecons par module : c'est le module qui devient
     l'etape de l'itineraire, la lecon n'est qu'un arret. */
  const etapes = [];
  LESSONS.forEach(function(l, i){
    const nom = l.module.split(' — ')[1] || l.module;
    let e = etapes.find(function(x){ return x.nom === nom; });
    if(!e){ e = { nom: nom, lecons: [] }; etapes.push(e); }
    e.lecons.push({ n: i + 1, titre: l.title });
  });

  const etapeCourante = etapes.findIndex(function(e){
    return e.lecons.some(function(a){ return a.n === current; });
  });

  const COCHE = '<svg viewBox="0 0 24 24" fill="none"><path d="M5 12L10 17L19 7" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  let html = '<div class="itin">' +
    '<div class="itin-tete">' +
      '<div class="itin-formation">' + NOM_FORMATION + '</div>' +
      '<div class="itin-compte">Étape ' + (etapeCourante + 1) + ' sur ' + etapes.length + ' · ' + doneCount + '/' + LESSONS.length + ' leçons</div>' +
      '<div class="itin-barre"><span style="width:' + Math.round(doneCount / LESSONS.length * 100) + '%"></span></div>' +
    '</div><div class="route">';

  etapes.forEach(function(e, idx){
    const toutesFaites = e.lecons.every(function(a){ return progress[a.n]; });
    const ici = idx === etapeCourante;
    const premiereAccessible = e.lecons.find(function(a){ return isUnlocked(a.n); });
    const classe = toutesFaites ? 'faite' : (ici ? 'ici' : '');
    const borne = toutesFaites ? COCHE : String(idx + 1);
    const cible = premiereAccessible ? premiereAccessible.n : e.lecons[0].n;

    html += '<div class="etape-i ' + classe + '">' +
      '<span class="borne">' + borne + '</span>' +
      '<button class="etape-titre" onclick="goTo(' + cible + ')">' + e.nom + '</button>' +
      '<div class="etape-meta">' + e.lecons.length + ' leçon' + (e.lecons.length > 1 ? 's' : '') + '</div>';

    /* On ne deroule que l'etape ou l'on se trouve : la carte reste lisible. */
    if(ici){
      html += '<div class="arrets">';
      e.lecons.forEach(function(a){
        const fait = !!progress[a.n];
        const ouvert = isUnlocked(a.n);
        const cl = (a.n === current ? 'ici ' : '') + (fait ? 'faite ' : '') + (ouvert ? '' : 'bloque');
        html += '<div class="arret ' + cl + '" onclick="goTo(' + a.n + ')">' +
          '<span class="puce">' + COCHE + '</span><span>' + a.titre + '</span></div>';
      });
      html += '</div>';
    }
    html += '</div>';
  });

  html += '</div>' + escaleHtml() + '</div>';
  document.getElementById('sidebar').innerHTML = html;
}

function goTo(n){
  if(!isUnlocked(n)){
    alert('Termine la leçon précédente pour débloquer celle-ci.');
    return;
  }
  current = n;
  history.replaceState(null, '', '?l=' + n);
  render();
  window.scrollTo(0,0);
}

let quizState = {};

function allQuizCorrect(l){
  for(let i=0;i<l.quiz.length;i++){ if(!quizState[i]) return false; }
  return true;
}

function render(){
  renderSidebar();
  const l = LESSONS[current-1];
  const progress = getProgress();
  const done = !!progress[current];
  quizState = {};
  if(done){ l.quiz.forEach(function(q,i){ quizState[i] = true; }); }
  const main = document.getElementById('main');
  let quizHtml = '';
  l.quiz.forEach(function(q, qi){
    let optsHtml = '';
    q.opts.forEach(function(opt, oi){
      const preAnswered = done && oi === q.correct;
      optsHtml += '<div class="quiz-opt ' + (preAnswered?'correct disabled':'') + '" id="q' + qi + 'o' + oi + '" onclick="answerQuiz(' + qi + ',' + oi + ',' + q.correct + ')">' +
        '<span class="quiz-letter">' + String.fromCharCode(65+oi) + '</span><span class="quiz-opt-text">' + opt + '</span></div>';
    });
    quizHtml += '<div class="quiz-card"><div class="quiz-q">Question ' + (qi+1) + '. ' + q.q + '</div>' + optsHtml +
      '<div class="quiz-explain ' + (done?'show':'') + '" id="exp' + qi + '"><strong>Explication : </strong>' + q.explain + '</div></div>';
  });

  const quizOk = allQuizCorrect(l);
  const actionCardStyle = (!quizOk && !done) ? 'opacity:.5;pointer-events:none;' : '';

  main.innerHTML =
    (done ? '<div class="completion-badge show">✓ Leçon terminée</div>' : '') +
    '<div class="lesson-eyebrow">' + l.module + '</div>' +
    '<div class="lesson-title">' + (current) + '. ' + l.title + '</div>' +
    '<div class="lesson-meta">' + l.duration + ' de lecture · Leçon ' + current + ' sur ' + LESSONS.length + '</div>' +
    '<div class="section-label"><span class="dot"></span>Comprendre</div>' +
    '<div class="script-text">' + l.script.map(function(p){
      return p.indexOf('<figure') === 0 ? p : '<p>' + p + '</p>';
    }).join('') + '</div>' +
    '<div class="section-label quiz"><span class="dot"></span>Vérifier</div>' +
    quizHtml +
    '<div class="section-label action"><span class="dot"></span>Petite action</div>' +
    (!quizOk && !done ? '<div style="font-size:12.5px;font-weight:600;color:var(--coral);margin-bottom:10px;">Réponds correctement aux ' + l.quiz.length + ' questions pour débloquer cette action.</div>' : '') +
    '<div class="action-card" id="actionCard" style="' + actionCardStyle + '">' +
      '<div class="action-text">' + l.action + '</div>' +
      '<div class="action-check" onclick="toggleAction()"><span class="action-box ' + (done?'checked':'') + '" id="actionBox">' + (done?'✓':'') + '</span><span class="action-label">Marquer cette leçon comme terminée</span></div>' +
    '</div>' +
    '<div class="lesson-nav">' +
      (current > 1 ? '<button class="nav-btn ghost" onclick="goTo(' + (current-1) + ')">← Leçon précédente</button>' : '<span></span>') +
      (current < LESSONS.length ? '<button class="nav-btn" onclick="goTo(' + (current+1) + ')">Leçon suivante →</button>' : '<a href="lecons-bourse.html" class="nav-btn">Premiers pas en bourse →</a>') +
    '</div>' +

    '<div class="lesson-sortie">' +
      '<a href="index.html#formations">Sommaire des formations</a><span>·</span>' +
      '<a href="carnet.html">Mon carnet</a><span>·</span>' +
      '<a href="index.html">Retour au site</a>' +
    '</div>';
}

function answerQuiz(qi, oi, correct){
  if(quizState[qi]) return; // déjà répondu correctement, verrouillé
  const chosen = document.getElementById('q'+qi+'o'+oi);
  if(chosen.classList.contains('disabled')) return;

  if(oi === correct){
    for(let k=0;k<10;k++){
      const el = document.getElementById('q'+qi+'o'+k);
      if(el){ el.classList.add('disabled'); }
    }
    chosen.classList.add('correct');
    quizState[qi] = true;
    document.getElementById('exp'+qi).classList.add('show');
    const l = LESSONS[current-1];
    const quizOk = allQuizCorrect(l);
    const card = document.getElementById('actionCard');
    if(quizOk && card){
      card.style.opacity = '';
      card.style.pointerEvents = '';
      const lock = card.previousElementSibling;
      if(lock && lock.textContent.indexOf('Réponds correctement') !== -1){ lock.style.display = 'none'; }
    }
  } else {
    chosen.classList.add('wrong');
    document.getElementById('exp'+qi).classList.add('show');
    setTimeout(function(){ chosen.classList.remove('wrong'); }, 900);
  }
}

async function toggleAction(){
  const l = LESSONS[current-1];
  const progress = getProgress();
  const newValue = !progress[current];
  if(newValue && !allQuizCorrect(l)){
    alert('Réponds correctement à toutes les questions du quiz avant de valider cette leçon.');
    return;
  }
  await setProgressServer(current, newValue);
  render();

  /* La formation vient-elle de s'achever ? Si oui, on plante la borne.
     On ne la montre qu'au moment du basculement, jamais en revenant
     sur une leçon déjà validée. */
  if(newValue) verifierFinDeParcours();
}

async function verifierFinDeParcours(){
  const progress = getProgress();
  const faites = Object.keys(progress).filter(function(k){ return progress[k]; }).length;
  if(faites < LESSONS.length) return;

  let prenom = '';
  let semaines = 1;
  try {
    const { data } = await sb.from('profiles').select('prenom').eq('id', CURRENT_USER.id).maybeSingle();
    if(data && data.prenom) prenom = data.prenom;

    const { data: dates } = await sb.from('lesson_progress')
      .select('completed_at').eq('user_id', CURRENT_USER.id).eq('formation', FORMATION)
      .not('completed_at', 'is', null).order('completed_at', { ascending: true }).limit(1);
    if(dates && dates.length){
      const debut = new Date(dates[0].completed_at).getTime();
      semaines = Math.max(1, Math.round((Date.now() - debut) / (7*24*3600*1000)));
    }
  } catch(e){ console.warn('Carte : données partielles', e); }

  ouvrirCarte(FORMATION, LESSONS.length, prenom, semaines);
}

async function boot(){
  document.getElementById('main').innerHTML = '<div style="padding:60px 0;text-align:center;color:var(--ink-faint);font-size:14px;">Chargement de ta progression…</div>';
  const user = await requireAuth();
  if(!user) return;
  const unlocked = await requireUnlock(user.id);
  if(!unlocked) return;
  CURRENT_USER = user;
  await loadProgressFromServer();

  if(!isUnlocked(current)){
    let lastUnlocked = 1;
    for(let i=1;i<=LESSONS.length;i++){ if(isUnlocked(i)) lastUnlocked = i; else break; }
    current = lastUnlocked;
    history.replaceState(null, '', '?l=' + current);
  }
  render();
}
boot();
