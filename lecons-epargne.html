<!DOCTYPE html>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --ink:#12212B;--ink-soft:#43555F;--ink-muted:#7A8A93;--ink-faint:#96A3AA;
  --bg:#FCFBF8;--bg-soft:#F5F4EE;--bg-mid:#EFF0EA;--bg-line:#DCDDD3;
  --green:#1E4B3C;--green-light:#2A6350;--green-pale:#E7EFEA;--green-bord:#BFD6C9;
  --amber:#B8862F;--amber-pale:#F6EFE0;--amber-bord:#E4D2AC;
  --violet:#4A5C6B;--violet-pale:#EDF0F2;--violet-bord:#D4DBE0;
  --coral:#A24332;--coral-pale:#F8EDEA;
  --sans:'Karla',system-ui,-apple-system,sans-serif;
  --display:'Newsreader',Georgia,serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
body{font-family:var(--sans);background:var(--bg-soft);color:var(--ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;}
a{color:inherit;}

.nav{position:sticky;top:0;z-index:200;background:rgba(255,255,255,.96);backdrop-filter:blur(20px);border-bottom:1px solid var(--bg-line);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;font-weight:800;font-size:15px;color:var(--ink);}
.nav-mark{width:26px;height:26px;border-radius:8px;background:var(--green);display:flex;align-items:center;justify-content:center;}
.nav-mark svg{width:14px;height:14px;}
.nav-back{font-size:13px;font-weight:600;color:var(--ink-muted);text-decoration:none;}
.nav-progress-pill{font-size:12px;font-weight:700;color:var(--green);background:var(--green-pale);padding:5px 12px;border-radius:100px;}

.layout{display:grid;grid-template-columns:280px 1fr;max-width:1100px;margin:0 auto;min-height:calc(100vh - 60px);}
.sidebar{border-right:1px solid var(--bg-line);background:var(--bg);padding:24px 16px;position:sticky;top:60px;align-self:start;height:calc(100vh - 60px);overflow-y:auto;}
.sb-progress-bar{height:6px;background:var(--bg-mid);border-radius:100px;overflow:hidden;margin:0 10px 18px;}
.sb-progress-fill{height:100%;background:var(--green);border-radius:100px;transition:width .3s;}
.sb-item{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:10px;cursor:pointer;margin-bottom:2px;font-size:13px;font-weight:600;color:var(--ink-muted);transition:background .15s;}
.sb-item:hover{background:var(--bg-soft);}
.sb-item.active{background:var(--green-pale);color:var(--green);}
.sb-item.done{color:var(--ink);}
.sb-item.locked{opacity:.45;cursor:not-allowed;}
.sb-item.locked:hover{background:transparent;}
.sb-check{width:20px;height:20px;border-radius:50%;background:var(--bg-mid);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink-faint);flex-shrink:0;}
.sb-item.done .sb-check{background:var(--green);color:#fff;}
.sb-item.active .sb-check{background:var(--green);color:#fff;}
.sb-module-label{font-size:10.5px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em;padding:14px 10px 6px;}

.main{padding:36px 40px 80px;max-width:720px;}
.lesson-eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green);margin-bottom:10px;}
.lesson-title{font-size:28px;font-weight:800;letter-spacing:-.03em;color:var(--ink);margin-bottom:8px;line-height:1.15;}
.lesson-meta{font-size:13px;color:var(--ink-faint);margin-bottom:32px;}

.section-label{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-muted);margin:36px 0 16px;}
.section-label .dot{width:6px;height:6px;border-radius:50%;background:var(--green);}
.section-label.quiz .dot{background:var(--violet);}
.section-label.action .dot{background:var(--amber);}

.script-text p{font-size:15.5px;font-weight:400;color:var(--ink-soft);line-height:1.75;margin-bottom:18px;}

.quiz-card{background:var(--bg);border:1px solid var(--bg-line);border-radius:16px;padding:24px;margin-bottom:14px;}
.quiz-q{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:16px;line-height:1.5;}
.quiz-opt{display:flex;align-items:flex-start;gap:12px;padding:13px 15px;border:1.5px solid var(--bg-line);border-radius:11px;margin-bottom:9px;cursor:pointer;transition:border-color .15s,background .15s;}
.quiz-opt:hover{border-color:var(--ink-faint);}
.quiz-opt.correct{border-color:var(--green);background:var(--green-pale);}
.quiz-opt.wrong{border-color:var(--coral);background:var(--coral-pale);}
.quiz-opt.disabled{cursor:default;pointer-events:none;}
.quiz-letter{width:24px;height:24px;border-radius:7px;background:var(--bg-soft);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--ink-muted);flex-shrink:0;}
.quiz-opt.correct .quiz-letter{background:var(--green);color:#fff;}
.quiz-opt.wrong .quiz-letter{background:var(--coral);color:#fff;}
.quiz-opt-text{font-size:13.5px;font-weight:500;color:var(--ink);padding-top:2px;}
.quiz-explain{display:none;font-size:13px;font-weight:400;color:var(--ink-muted);line-height:1.6;background:var(--bg-soft);border-radius:10px;padding:14px 16px;margin-top:8px;}
.quiz-explain.show{display:block;}
.quiz-explain strong{color:var(--ink);}

.action-card{background:var(--amber-pale);border:1px solid var(--amber-bord);border-radius:16px;padding:22px 24px;}
.action-text{font-size:14.5px;font-weight:500;color:var(--ink);line-height:1.65;margin-bottom:16px;}
.action-check{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;}
.action-box{width:22px;height:22px;border-radius:7px;border:2px solid var(--amber);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;transition:background .15s;}
.action-box.checked{background:var(--amber);}
.action-label{font-size:13px;font-weight:700;color:#8a6a00;}

.lesson-nav{display:flex;justify-content:space-between;align-items:center;margin-top:40px;padding-top:24px;border-top:1px solid var(--bg-line);}
.nav-btn{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border:none;cursor:pointer;font-family:var(--sans);font-size:14px;font-weight:700;padding:13px 24px;border-radius:11px;text-decoration:none;transition:background .2s;}
.nav-btn:hover{background:var(--ink-soft);}
.nav-btn.ghost{background:var(--bg-mid);color:var(--ink-muted);}
.nav-btn.ghost:hover{background:var(--bg-line);}
.completion-badge{display:none;align-items:center;gap:8px;background:var(--green-pale);color:var(--green);font-size:12.5px;font-weight:700;padding:8px 16px;border-radius:100px;margin-bottom:20px;}
.completion-badge.show{display:inline-flex;}

@media(max-width:860px){
  .layout{grid-template-columns:1fr;}
  .sidebar{position:static;height:auto;border-right:none;border-bottom:1px solid var(--bg-line);}
  .main{padding:28px 20px 60px;}
}

/* ===== Direction Encre & Laiton — surcouche typographique ===== */
body{font-family:var(--sans);letter-spacing:0;}
h1,h2,h3,h4,.hero-h1,.s-title,.cta-h2,.p-name,.mod-title,.c-title,.hc-title,
.lecon-title,.q-title,.auth-title,.perf-title,.section-title,.edu-title,.tips-title{
  font-family:var(--display);letter-spacing:-.015em;
}
.hero-h1,.s-title,.cta-h2,.auth-title{font-weight:500;letter-spacing:-.018em;line-height:1.16;}
h3,h4,.p-name,.mod-title,.c-title,.hc-title,.lecon-title{font-weight:600;}
.s-tag,.f-copy,.hstat-label,.stat-label,.perf-note,.order-meta,.pos-value,
.price-cell,.asset-label,.badge,.eyebrow,.nav-balance{font-family:var(--mono);}

.nav-name em,.ft-name em{font-style:normal;color:var(--amber);}

/* Mise en valeur dans le corps des lecons : le gras porte la notion a
   retenir, l italique la nuance ou le terme technique. */
.script-text strong{color:var(--ink,#12212B);font-weight:700;}
.script-text em{font-style:italic;color:var(--ink-soft,#43555F);}
.script-text u{text-decoration:none;background:linear-gradient(transparent 62%,var(--amber-pale,#F6EFE0) 62%);
  box-shadow:inset 0 -1px 0 var(--amber,#B8862F);}
.script-text p + p{margin-top:14px;}

/* ===== L'itineraire =====
   Une route verticale plutot qu'une liste : on voit d'ou l'on vient,
   ou l'on est, et ce qu'il reste. Meme vocabulaire graphique que le
   carnet de route et les emblemes. */
.itin{padding:4px 4px 24px;}
.itin-tete{padding:0 8px 16px;border-bottom:1px solid var(--bg-line);margin-bottom:16px;}
.itin-formation{font-family:var(--display);font-size:16px;font-weight:600;color:var(--ink);line-height:1.25;}
.itin-compte{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-muted);margin-top:7px;}
.itin-barre{height:4px;background:var(--bg-mid);border-radius:100px;overflow:hidden;margin-top:10px;}
.itin-barre span{display:block;height:100%;background:var(--amber);border-radius:100px;transition:width .4s cubic-bezier(.4,0,.2,1);}

/* La route */
.route{position:relative;padding-left:30px;}
.route::before{content:"";position:absolute;left:11px;top:14px;bottom:14px;width:2px;
  background:repeating-linear-gradient(var(--bg-line) 0 6px, transparent 6px 11px);}
.etape-i{position:relative;margin-bottom:6px;}
.borne{position:absolute;left:-30px;top:6px;width:24px;height:24px;border-radius:50%;
  background:var(--bg);border:2px solid var(--bg-line);display:grid;place-items:center;
  font-family:var(--mono);font-size:10px;color:var(--ink-faint);z-index:1;transition:all .2s;}
.borne svg{width:11px;height:11px;}
.etape-i.faite .borne{background:var(--amber);border-color:var(--amber);color:#fff;}
.etape-i.ici .borne{background:var(--green);border-color:var(--green);color:#fff;
  box-shadow:0 0 0 4px var(--green-pale);}
.etape-titre{display:block;width:100%;text-align:left;background:transparent;border:0;cursor:pointer;
  font-family:var(--display);font-size:14.5px;font-weight:600;color:var(--ink-soft);
  padding:7px 9px;border-radius:9px;line-height:1.3;transition:background .15s,color .15s;}
.etape-titre:hover{background:var(--bg-soft);color:var(--ink);}
.etape-i.ici .etape-titre{color:var(--green);}
.etape-i.faite .etape-titre{color:var(--ink);}
.etape-meta{font-family:var(--mono);font-size:10px;color:var(--ink-faint);padding:0 9px 4px;letter-spacing:.06em;}

/* Les lecons de l'etape en cours */
.arrets{margin:2px 0 12px;padding-left:9px;border-left:1px solid var(--bg-line);}
.arret{display:flex;align-items:flex-start;gap:9px;padding:7px 9px;border-radius:8px;cursor:pointer;
  font-size:12.8px;font-weight:500;color:var(--ink-muted);transition:background .15s;line-height:1.35;}
.arret:hover{background:var(--bg-soft);color:var(--ink);}
.arret.ici{background:var(--green-pale);color:var(--green);font-weight:700;}
.arret.faite{color:var(--ink);}
.arret.bloque{opacity:.42;cursor:not-allowed;}
.arret.bloque:hover{background:transparent;}
.puce{width:15px;height:15px;border-radius:4px;flex:none;margin-top:1px;border:1.5px solid var(--bg-line);
  display:grid;place-items:center;background:var(--bg);}
.puce svg{width:9px;height:9px;opacity:0;}
.arret.faite .puce{background:var(--amber);border-color:var(--amber);}
.arret.faite .puce svg{opacity:1;}
.arret.ici .puce{border-color:var(--green);border-style:dashed;}

/* Changer de formation sans repasser par le menu */
.escale{margin-top:22px;padding-top:16px;border-top:1px solid var(--bg-line);}
.escale-titre{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-faint);padding:0 9px 9px;}
.escale a{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;text-decoration:none;
  font-size:12.8px;color:var(--ink-soft);transition:background .15s;}
.escale a:hover{background:var(--bg-soft);color:var(--ink);}
.escale a.courante{background:var(--green-pale);color:var(--green);font-weight:700;}
.jeton{width:7px;height:7px;border-radius:50%;background:var(--bg-line);flex:none;}
.escale a.courante .jeton{background:var(--green);}
.escale a.prete .jeton{background:var(--amber);}

@media(max-width:860px){
  .itin{padding-bottom:8px;}
  .route{padding-left:26px;}
  .borne{left:-26px;}
}
@media(prefers-reduced-motion:reduce){*{transition:none !important;}}

/* ===== Schemas des lecons ===== */
.schema{margin:26px 0;padding:20px 18px 14px;border:1px solid var(--bg-line,#DCDDD3);
  border-radius:12px;background:var(--bg,#FCFBF8);}
.schema svg{width:100%;height:auto;display:block;}
.schema figcaption{font-family:var(--mono,monospace);font-size:11.5px;line-height:1.55;
  color:var(--ink-muted,#7A8A93);margin-top:14px;padding-top:12px;
  border-top:1px solid var(--bg-line,#DCDDD3);}
@media(max-width:620px){.schema{padding:14px 12px 10px;margin:20px -6px;}}
</style>
</head>

<script>
/* ============ DONNÉES DES 16 LEÇONS — MAÎTRISER SON BUDGET ============ */
const LESSONS = [
{module:"Module 1 — Pourquoi se protéger d'abord", title:"L'ordre dans lequel tout doit se faire", duration:"5 min",
script:[
"Il existe une erreur qui coûte plus cher que toutes les autres réunies, et elle ne consiste pas à choisir le mauvais placement. Elle consiste à investir avant de s'être protégé. Cette leçon existe pour t'éviter de la commettre, parce qu'elle ne se rattrape pas : quand elle se produit, elle détruit en même temps ton argent et ta confiance dans le fait d'investir.",
"Voici comment elle se déroule, presque toujours de la même façon. Quelqu'un met de côté pendant des mois. Il entend parler d'investissement, comprend que son livret ne rapporte rien, et place ses économies. 3 mois plus tard, sa voiture tombe en panne, ou il perd son emploi, ou son propriétaire lui demande un dépôt de garantie qu'il n'avait pas prévu. Il doit vendre. Et il vend au pire moment, parce que les besoins urgents ne choisissent jamais leur date.",
"Ce mécanisme porte un nom que tu retiendras facilement : <strong>la vente forcée</strong>. Il transforme une perte temporaire en perte définitive. <strong>Un placement qui baisse de 20 % n'a rien perdu tant que tu ne vends pas</strong> ; les marchés remontent, l'histoire l'a toujours montré sur longue période. Mais si tu es obligé de vendre pendant la baisse, ces 20 % deviennent réels, définitifs, inscrits sur ton relevé. Et tu n'auras pas perdu à cause d'un mauvais choix d'investissement. Tu auras perdu parce que tu n'avais pas de matelas.",
"<figure class=\"schema\"><svg viewBox=\"0 0 700 286\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"20\" y=\"202\" width=\"250\" height=\"52\" rx=\"9\" fill=\"#E7EFEA\" stroke=\"#1E4B3C\" stroke-width=\"1.4\"/><circle cx=\"46\" cy=\"228\" r=\"12\" fill=\"#1E4B3C\"/><text x=\"46\" y=\"232\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\" fill=\"#fff\">1</text><text x=\"70\" y=\"224\" font-family=\"Newsreader, Georgia, serif\" font-size=\"15\" font-weight=\"600\" fill=\"#12212B\">Combler le découvert</text><text x=\"70\" y=\"241\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#43555F\">Tant qu'il dure, il coûte plus cher que tout le reste.</text><rect x=\"20\" y=\"138\" width=\"383\" height=\"52\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#DCDDD3\" stroke-width=\"1.4\"/><circle cx=\"46\" cy=\"164\" r=\"12\" fill=\"#DCDDD3\"/><text x=\"46\" y=\"168\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\" fill=\"#fff\">2</text><text x=\"70\" y=\"160\" font-family=\"Newsreader, Georgia, serif\" font-size=\"15\" font-weight=\"600\" fill=\"#12212B\">Constituer un fonds d'urgence</text><text x=\"70\" y=\"177\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#43555F\">Disponible immédiatement, sans risque de perte.</text><rect x=\"20\" y=\"74\" width=\"517\" height=\"52\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#DCDDD3\" stroke-width=\"1.4\"/><circle cx=\"46\" cy=\"100\" r=\"12\" fill=\"#DCDDD3\"/><text x=\"46\" y=\"104\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\" fill=\"#fff\">3</text><text x=\"70\" y=\"96\" font-family=\"Newsreader, Georgia, serif\" font-size=\"15\" font-weight=\"600\" fill=\"#12212B\">Rembourser les dettes chères</text><text x=\"70\" y=\"113\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#43555F\">Un crédit conso à 6 % est un rendement garanti de 6 %.</text><rect x=\"20\" y=\"10\" width=\"650\" height=\"52\" rx=\"9\" fill=\"#F6EFE0\" stroke=\"#B8862F\" stroke-width=\"1.4\"/><circle cx=\"46\" cy=\"36\" r=\"12\" fill=\"#B8862F\"/><text x=\"46\" y=\"40\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\" fill=\"#fff\">4</text><text x=\"70\" y=\"32\" font-family=\"Newsreader, Georgia, serif\" font-size=\"15\" font-weight=\"600\" fill=\"#12212B\">Investir</text><text x=\"70\" y=\"49\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#43555F\">Et seulement maintenant, avec ce qu'on ne touchera pas.</text></svg><figcaption>L'ordre ne se discute pas : chaque étape rend la suivante possible sans avoir à revenir en arrière.</figcaption></figure>",
"D'où l'ordre que je te demande de retenir, et de ne jamais inverser. <strong>1.</strong> Tu combles ton découvert permanent s'il en existe un. <strong>2.</strong> Tu constitues un fonds d'urgence disponible immédiatement. <strong>3.</strong> Tu rembourses tes crédits à taux élevé. <strong>4.</strong> Et seulement alors, tu investis.",
"Cet ordre paraît lent, et il l'est. C'est même son intérêt. Chacune de ces étapes rend la suivante possible sans avoir à revenir en arrière. Les gens qui investissent avec succès sur 20 ans ne sont pas ceux qui ont commencé le plus tôt. Ce sont ceux qui n'ont jamais eu à s'arrêter.",
"Une nuance importante, parce que la règle a une exception. Si ton employeur abonde un plan d'épargne salariale, c'est-à-dire s'il ajoute de l'argent quand tu en mets, il peut être rationnel d'y verser le minimum même sans fonds d'urgence complet. Un abondement de 50 % est un rendement immédiat que rien d'autre n'égale. Mais c'est la seule exception, et elle ne concerne que le montant abondé, pas un euro de plus.",
"Ce qu'il faut comprendre, au fond, c'est que la sécurité n'est pas l'ennemie du rendement. Elle en est la condition. Un investisseur protégé peut traverser une crise sans rien faire, ce qui est précisément la compétence la plus rentable qui existe. Un investisseur non protégé sera contraint d'agir au pire moment, quelles que soient ses connaissances et sa discipline."
],
quiz:[
{q:"Pourquoi une baisse des marchés devient-elle une perte définitive ?",opts:["Parce que les marchés ne remontent jamais après une forte baisse","Parce qu'on est contraint de vendre pendant la baisse pour faire face à un imprévu","Parce que les frais augmentent quand les marchés baissent","Parce que l'État taxe davantage les moins-values"],correct:1,
explain:"Tant qu'on ne vend pas, une baisse reste une perte sur le papier. C'est la vente forcée, provoquée par un besoin urgent d'argent, qui la rend réelle. Le fonds d'urgence sert précisément à ne jamais y être contraint."},
{q:"Quel est le bon ordre des priorités ?",opts:["Investir, puis constituer un fonds d'urgence avec les gains","Rembourser ses crédits, investir, puis épargner","Combler le découvert, constituer le fonds d'urgence, rembourser les crédits chers, puis investir","Tout faire en même temps, à parts égales"],correct:2,
explain:"Chaque étape rend la suivante possible sans avoir à revenir en arrière. Cet ordre paraît lent, mais c'est celui qui évite de tout interrompre au premier imprévu."},
{q:"Quelle est la seule exception à cet ordre ?",opts:["Une opportunité d'investissement à ne pas manquer","L'abondement de l'employeur sur un plan d'épargne salariale","Un conseil reçu d'un proche expérimenté","Une période de forte hausse des marchés"],correct:1,
explain:"Un abondement est de l'argent ajouté par l'employeur, donc un rendement immédiat qu'aucun placement n'égale. L'exception ne vaut que pour le montant abondé, pas au-delà."}
],
action:"Ce soir, situe-toi honnêtement sur les quatre étapes : découvert, fonds d'urgence, crédits chers, investissement. Note sur une feuille à quelle étape tu te trouves réellement, pas celle où tu aimerais être. C'est le point de départ de toute la formation, et la suite n'a de sens qu'à partir de là."
},
{module:"Module 1 — Pourquoi se protéger d'abord", title:"Ce qu'est vraiment un imprévu", duration:"5 min",
script:[
"Quand on demande aux gens s'ils ont des imprévus, la plupart répondent que non, ou rarement. Quand on regarde leurs relevés bancaires sur 3 ans, on constate presque toujours l'inverse. Ce décalage vient d'une confusion : nous appelons imprévu <em>ce qui est imprévisible</em>, alors qu'il faudrait appeler imprévu <em>ce qui n'est pas planifié</em>. Ce n'est pas du tout la même chose.",
"Voici quelques dépenses que presque tout le monde considère comme des imprévus. Le remplacement d'un lave-linge. Une réparation automobile. Un déplacement pour un enterrement. Le remplacement d'un téléphone tombé. Une franchise d'assurance. Un mois où l'on travaille moins. Or aucune de ces dépenses n'est imprévisible. Un lave-linge dure entre 8 et 12 ans, une voiture a besoin d'entretien chaque année, un téléphone tombe. <strong>Ce qui est imprévisible, c'est la date, jamais l'existence.</strong>",
"Cette distinction change tout, parce qu'elle transforme un problème de chance en problème d'organisation. Tu ne peux pas savoir quel mois ton lave-linge te lâchera. Tu peux savoir qu'il te lâchera, et mettre de côté en conséquence. Un imprévu financé par un fonds d'urgence est une contrariété. Le même imprévu financé par un crédit à la consommation devient une charge fixe pour 3 ans.",
"Il existe une méthode simple pour rendre cela concret, et je te demande de la faire vraiment, pas seulement de la lire. Reprends tes relevés bancaires des 36 derniers mois. Repère chaque dépense supérieure à 200 € qui n'était pas une charge fixe. Additionne-les, divise par trente-six. Le résultat est ton coût mensuel réel d'imprévus.",
"Les personnes qui font cet exercice découvrent le plus souvent un chiffre situé entre 60 et 150 € par mois. Ce montant existait déjà, il était simplement invisible, absorbé au coup par coup, souvent par un découvert. Le voir écrit change la façon dont on organise son budget : on cesse de le subir pour le provisionner.",
"Une remarque sur la charge mentale, parce qu'elle compte autant que l'argent. Vivre sans fonds d'urgence, c'est vivre en sachant qu'un événement banal peut désorganiser plusieurs mois. Cette tension permanente épuise, et elle pousse à des décisions défensives : renoncer à une formation, accepter un travail moins bien payé mais plus sûr, ne pas quitter une situation qui ne convient plus. Un fonds d'urgence n'achète pas seulement de la tranquillité. Il achète de la marge de manœuvre, et donc des choix."
],
quiz:[
{q:"Quelle est la vraie définition d'un imprévu financier ?",opts:["Une dépense totalement imprévisible","Une dépense dont on ignore la date, mais pas l'existence","Une dépense supérieure à 1 000 €","Une dépense causée par un accident"],correct:1,
explain:"Un lave-linge finit toujours par tomber en panne, une voiture a toujours besoin d'entretien. C'est la date qui est inconnue, pas l'événement. Ce qui rend le provisionnement possible."},
{q:"Comment calculer son coût mensuel réel d'imprévus ?",opts:["En estimant au jugé un montant raisonnable","En prenant 10 % de son salaire","En additionnant les dépenses exceptionnelles des 36 derniers mois, divisées par 36","En demandant à sa banque une moyenne sectorielle"],correct:2,
explain:"Seuls tes propres relevés disent la vérité sur ta situation. 3 ans lissent les années calmes et les années difficiles."},
{q:"Quel est l'effet le moins visible d'une absence de fonds d'urgence ?",opts:["Des frais bancaires plus élevés","Une réduction de la marge de manœuvre dans ses choix de vie","Une baisse du score de crédit","Une hausse des primes d'assurance"],correct:1,
explain:"Sans matelas, on prend des décisions défensives : rester dans un emploi qui ne convient plus, renoncer à une formation. Le coût le plus lourd n'apparaît sur aucun relevé."}
],
action:"Ouvre tes relevés bancaires et remonte trente-6 mois en arrière. Note chaque dépense exceptionnelle supérieure à 200 €, additionne-les et divise par trente-six. Écris le résultat quelque part où tu le reverras : c'est le montant que tu devrais provisionner chaque mois, et il existait déjà avant que tu le calcules."
},
{module:"Module 2 — Construire son fonds d'urgence", title:"Combien exactement, et pourquoi ce montant", duration:"5 min",
script:[
"On lit partout qu'il faut 3 à 6 mois de dépenses de côté. Cette fourchette est utile, mais elle est trop large pour être actionnable, et surtout elle ne dit pas de quelles dépenses on parle. Cette leçon sert à remplacer une recommandation vague par un chiffre qui est le tien.",
"Premier point, et il est souvent mal compris : on calcule le fonds d'urgence sur les dépenses, jamais sur les revenus. Quelqu'un qui gagne 3 000 € et en dépense 1 800 € n'a pas besoin du même matelas que quelqu'un qui gagne la même chose et dépense deux 1 800 €. <strong>Ce que tu dois pouvoir tenir, c'est ton train de vie, pas ton salaire.</strong>",
"Deuxième point : quelles dépenses retenir. Prends tes charges incompressibles, celles que tu paierais même en cherchant un emploi : logement, énergie, alimentation, transport minimum, assurances, remboursements de crédits. N'y mets pas les loisirs, les vacances ni les abonnements que tu pourrais suspendre. On calcule un budget de survie, pas un budget de confort. Ce montant est en général inférieur de 20 à 30 % aux dépenses habituelles.",
"<figure class=\"schema\"><svg viewBox=\"0 0 700 228\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"200\" y=\"20\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" letter-spacing=\"1.4\" fill=\"#1E4B3C\">SITUATION STABLE</text><text x=\"560\" y=\"20\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" letter-spacing=\"1.4\" fill=\"#B8862F\">REVENUS IRRÉGULIERS</text><text x=\"20\" y=\"44\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#43555F\">Salarié en CDI, foyer à 2 revenus</text><rect x=\"20\" y=\"54\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#EFF0EA\"/><rect x=\"20\" y=\"54\" width=\"561\" height=\"18\" rx=\"5\" fill=\"#E7EFEA\"/><rect x=\"581\" y=\"54\" width=\"99\" height=\"18\" rx=\"5\" fill=\"#F6EFE0\"/><text x=\"28\" y=\"67\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#1E4B3C\">3 mois</text><text x=\"672\" y=\"67\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8E661F\"></text><text x=\"20\" y=\"100\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#43555F\">Salarié seul, contrat court</text><rect x=\"20\" y=\"110\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#EFF0EA\"/><rect x=\"20\" y=\"110\" width=\"363\" height=\"18\" rx=\"5\" fill=\"#E7EFEA\"/><rect x=\"383\" y=\"110\" width=\"297\" height=\"18\" rx=\"5\" fill=\"#F6EFE0\"/><text x=\"28\" y=\"123\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#1E4B3C\">6 mois</text><text x=\"672\" y=\"123\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8E661F\"></text><text x=\"20\" y=\"156\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#43555F\">Indépendant, intermittent</text><rect x=\"20\" y=\"166\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#EFF0EA\"/><rect x=\"20\" y=\"166\" width=\"132\" height=\"18\" rx=\"5\" fill=\"#E7EFEA\"/><rect x=\"152\" y=\"166\" width=\"528\" height=\"18\" rx=\"5\" fill=\"#F6EFE0\"/><text x=\"28\" y=\"179\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#1E4B3C\"></text><text x=\"672\" y=\"179\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8E661F\">9 à 12 mois</text></svg><figcaption>Le nombre de mois se calcule sur les charges incompressibles, jamais sur le salaire.</figcaption></figure>",
"Troisième point : combien de mois. C'est ici que la fourchette prend du sens, parce qu'elle dépend de la stabilité de tes revenus. 3 mois suffisent à un fonctionnaire ou à un salarié en contrat stable dans un foyer à deux revenus. 6 mois sont plus adaptés à un salarié seul en contrat court, à un secteur fragile, ou à un foyer avec enfants à charge. 9 à 12 mois se justifient pour un indépendant, un intermittent ou un revenu très irrégulier, parce que la perte d'activité y est plus fréquente et plus longue.",
"Prenons un exemple complet. Charges incompressibles de 1 400 € par mois, salarié seul en contrat à durée indéterminée dans un secteur stable. 4 mois de sécurité représentent 5 600 €. C'est une somme, et elle peut sembler décourageante vue d'un coup. C'est pourquoi il faut la découper.",
"Je te propose trois paliers, et le premier compte plus que les deux autres. <strong>Palier 1 : 1 000 €.</strong> Il absorbe la grande majorité des incidents de la vie courante et suffit à sortir du découvert permanent. <strong>Palier 2 : 1 mois de charges.</strong> Tu tiens un accident de parcours sans emprunter. <strong>Palier 3 : la cible complète.</strong> La plupart des gens abandonnent parce qu'ils visent directement le troisième. Vise le premier.",
"Un dernier mot sur le moment où l'on s'arrête. Un fonds d'urgence trop gros a un coût réel : cet argent dort sur un support peu rémunéré et perd du pouvoir d'achat avec l'inflation. Une fois la cible atteinte, il ne faut pas continuer à l'alimenter par confort psychologique. On passe à l'étape suivante. La sécurité est un socle, pas une destination."
],
quiz:[
{q:"Sur quelle base calcule-t-on le fonds d'urgence ?",opts:["Sur les revenus mensuels nets","Sur les dépenses incompressibles","Sur le montant du loyer multiplié par trois","Sur la moyenne nationale d'épargne"],correct:1,
explain:"Ce que tu dois pouvoir tenir, c'est ton train de vie minimum, pas ton salaire. Deux personnes au même revenu peuvent avoir des besoins de sécurité très différents."},
{q:"Quelle durée conviendrait à un travailleur indépendant ?",opts:["Un mois","3 mois","9 à 12 mois","Deux ans"],correct:2,
explain:"Les revenus irréguliers rendent les interruptions plus fréquentes et plus longues. La fourchette de 3 à 6 mois vise des salariés en contrat stable."},
{q:"Pourquoi ne faut-il pas dépasser sa cible de fonds d'urgence ?",opts:["Parce que la banque limite les versements","Parce que cet argent perd du pouvoir d'achat avec l'inflation","Parce que les intérêts deviennent imposables","Parce que le plafond du livret A l'interdit"],correct:1,
explain:"Un fonds d'urgence est un socle, pas une destination. Au-delà de la cible, l'argent est mieux employé à l'étape suivante."}
],
action:"Calcule ce soir tes charges incompressibles mensuelles, en excluant loisirs et abonnements suspendables. Multiplie par le nombre de mois adapté à ta situation. Puis écris uniquement le premier palier, 1 000 €, et la date à laquelle tu comptes l'atteindre. C'est le seul chiffre à viser pour l'instant."
},
{module:"Module 2 — Construire son fonds d'urgence", title:"Où le placer, et pourquoi le rendement ne compte pas", duration:"5 min",
script:[
"Une fois le montant fixé, une question revient systématiquement : où mettre cet argent pour qu'il rapporte un peu ? Cette question est légitime et sa réponse est contre-intuitive. Pour un fonds d'urgence, <strong>le rendement est le dernier critère</strong>, très loin derrière deux autres.",
"Le premier critère est la disponibilité immédiate. L'argent doit être accessible en quelques heures, sans préavis, sans pénalité, sans avoir à demander l'autorisation de qui que ce soit. Un placement bloqué 3 mois ne remplit pas cette fonction, même s'il rapporte davantage.",
"Le deuxième critère est l'absence totale de volatilité. La valeur ne doit jamais baisser, jamais. Un support qui varie, même faiblement, peut se trouver en baisse précisément le jour où tu en as besoin, ce qui reproduit exactement le problème que le fonds d'urgence était censé résoudre.",
"Ces deux critères éliminent beaucoup de choses. Ils excluent les actions et les fonds actions, évidemment. Ils excluent aussi les placements à terme et tout ce qui impose une durée. En France, ils désignent essentiellement les livrets réglementés : le livret A, le livret de développement durable et solidaire, et le livret d'épargne populaire pour ceux qui y sont éligibles sous conditions de revenus. Ces livrets sont disponibles à tout moment, sans risque de perte nominale, et leurs intérêts ne sont ni imposés ni soumis aux prélèvements sociaux.",
"Ils imposent en revanche des plafonds, et c'est une bonne chose : ils t'obligent à ne pas y laisser dormir davantage que nécessaire. Ces plafonds, comme les taux, sont révisés périodiquement par les pouvoirs publics, donc vérifie les montants en vigueur au moment où tu lis cette leçon plutôt que de te fier à un chiffre appris il y a 2 ans.",
"Une question fréquente mérite une réponse claire : faut-il séparer ce fonds de son compte courant ? Oui, et fermement. Non pas pour des raisons financières, mais psychologiques. De l'argent visible sur le compte courant est de l'argent dépensé, parce qu'il fait partie du solde que ton cerveau considère comme disponible. Un compte séparé, dans un établissement différent si possible, crée une friction de quelques minutes qui suffit à distinguer un vrai imprévu d'une envie pressante.",
"Enfin, une remarque sur ce que le fonds d'urgence perd. Avec une inflation supérieure au taux du livret, il perd effectivement du pouvoir d'achat chaque année. C'est exact, et ce n'est pas un problème : <strong>ce n'est pas un placement, c'est une assurance</strong>. Personne ne reproche à son assurance habitation de ne pas rapporter. Ce que tu paies, c'est le droit de ne jamais avoir à vendre au mauvais moment."
],
quiz:[
{q:"Quels sont les deux critères prioritaires pour un fonds d'urgence ?",opts:["Le rendement et la fiscalité","La disponibilité immédiate et l'absence de volatilité","La réputation de la banque et la simplicité d'ouverture","Le plafond et la durée de blocage"],correct:1,
explain:"L'argent doit être accessible en quelques heures et ne jamais avoir baissé le jour où tu en as besoin. Le rendement vient très loin derrière."},
{q:"Pourquoi séparer le fonds d'urgence du compte courant ?",opts:["Parce que la loi l'impose","Pour bénéficier d'un meilleur taux","Parce que l'argent visible sur le compte courant finit par être dépensé","Pour éviter les frais de tenue de compte"],correct:2,
explain:"La raison est psychologique, pas financière. Une friction de quelques minutes suffit à distinguer un vrai imprévu d'une envie du moment."},
{q:"Que répondre à l'objection « ce fonds perd de la valeur avec l'inflation » ?",opts:["C'est faux, les livrets suivent toujours l'inflation","C'est exact, mais c'est une assurance et non un placement","Il faut donc le placer en actions","Il faut le réduire au minimum absolu"],correct:1,
explain:"C'est le prix de la disponibilité. Ce que tu achètes, c'est le droit de ne jamais être contraint de vendre au pire moment."}
],
action:"Vérifie ce soir où se trouve ton épargne de précaution. Si elle est sur ton compte courant, ouvre un livret séparé, idéalement dans un autre établissement. L'ouverture prend 10 minutes en ligne, et c'est la seule action de cette formation qui produit un effet dès le lendemain."
},
{module:"Module 2 — Construire son fonds d'urgence", title:"L'alimenter sans y penser", duration:"5 min",
script:[
"Presque tout le monde sait qu'il faudrait épargner. Très peu y parviennent durablement, et l'explication n'est ni la paresse ni le manque de revenus. C'est une question de méthode, et plus précisément d'ordre des opérations.",
"La méthode qui échoue est celle que pratiquent la plupart des gens : dépenser d'abord, épargner ce qui reste à la fin du mois. Elle échoue parce qu'il ne reste presque jamais rien, et pour une raison mécanique. Nos dépenses s'ajustent naturellement à l'argent disponible, phénomène si constant qu'il porte un nom, <em>la loi de Parkinson</em> appliquée aux finances. Tant que la totalité du salaire reste disponible, la totalité finit par être dépensée.",
"La méthode qui fonctionne inverse simplement l'ordre : <strong>on épargne d'abord, on dépense ce qui reste.</strong> C'est ce qu'on appelle <em>se payer en premier</em>. Techniquement, cela consiste en un virement automatique programmé le lendemain de la paie, vers le livret séparé, exécuté sans que tu aies à décider quoi que ce soit.",
"<figure class=\"schema\"><svg viewBox=\"0 0 700 276\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"20\" y=\"24\" width=\"190\" height=\"54\" rx=\"9\" fill=\"#EFF0EA\" stroke=\"#12212B\" stroke-width=\"1.5\"/><text x=\"115\" y=\"47\" text-anchor=\"middle\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14.5\" font-weight=\"600\" fill=\"#12212B\">Ton salaire</text><text x=\"115\" y=\"65\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\" fill=\"#7A8A93\">le 1 du mois</text><path d=\"M210 51 C 270 51, 270 66, 330 66\" fill=\"none\" stroke=\"#B8862F\" stroke-width=\"1.8\"/><circle cx=\"330\" cy=\"66\" r=\"4\" fill=\"#B8862F\"/><rect x=\"344\" y=\"43\" width=\"336\" height=\"46\" rx=\"8\" fill=\"#F6EFE0\" stroke=\"#B8862F\" stroke-width=\"1.3\"/><text x=\"360\" y=\"64\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"14\" font-weight=\"600\" fill=\"#12212B\">Épargne, virement automatique</text><text x=\"664\" y=\"64\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"13\" fill=\"#B8862F\">le 2 du mois</text><path d=\"M210 51 C 270 51, 270 128, 330 128\" fill=\"none\" stroke=\"#1E4B3C\" stroke-width=\"1.8\"/><circle cx=\"330\" cy=\"128\" r=\"4\" fill=\"#1E4B3C\"/><rect x=\"344\" y=\"105\" width=\"336\" height=\"46\" rx=\"8\" fill=\"#E7EFEA\" stroke=\"#1E4B3C\" stroke-width=\"1.3\"/><text x=\"360\" y=\"126\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"14\" font-weight=\"600\" fill=\"#12212B\">Charges fixes, prélèvements</text><text x=\"664\" y=\"126\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"13\" fill=\"#1E4B3C\">du 5 au 10</text><path d=\"M210 51 C 270 51, 270 190, 330 190\" fill=\"none\" stroke=\"#1E4B3C\" stroke-width=\"1.8\"/><circle cx=\"330\" cy=\"190\" r=\"4\" fill=\"#1E4B3C\"/><rect x=\"344\" y=\"167\" width=\"336\" height=\"46\" rx=\"8\" fill=\"#E7EFEA\" stroke=\"#1E4B3C\" stroke-width=\"1.3\"/><text x=\"360\" y=\"188\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"14\" font-weight=\"600\" fill=\"#12212B\">Ce qui reste pour vivre</text><text x=\"664\" y=\"188\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"13\" fill=\"#1E4B3C\">le reste du mois</text></svg><figcaption>Se payer en premier : l'épargne part avant que le compte ne redevienne un solde disponible.</figcaption></figure>",
"Trois détails font toute la différence entre un virement qui tient et un virement qu'on finit par annuler. Le premier est la date : programme-le le lendemain du versement du salaire, pas en fin de mois. <strong>Ce que tu ne vois jamais ne te manque pas.</strong> Le second est le montant : commence délibérément trop bas. 50 € qui partent tous les mois pendant 2 ans valent infiniment mieux que 300 € abandonnés au troisième mois. Le troisième est l'automatisation complète : un virement manuel dépend de ta volonté, et ta volonté sera occupée ailleurs.",
"Une fois le système en place, il existe une progression douce qui fonctionne remarquablement bien : augmenter le virement de 10 € tous les 2 mois. La hausse est assez faible pour ne pas être ressentie, et au bout d'un an le montant a été multiplié par plusieurs. Autre levier, plus puissant encore : à chaque augmentation de revenu, dirige la moitié de la hausse vers l'épargne avant de t'habituer à la dépenser. Le niveau de vie ne baisse jamais, et le taux d'épargne monte.",
"Enfin, une chose qu'on ne dit pas assez. Si le virement ne passe pas un mois parce que le compte est trop juste, ce n'est pas un échec du système. C'est une information : le montant était trop élevé. Baisse-le et continue. La seule vraie défaillance serait d'arrêter complètement, parce qu'un système interrompu ne se remet presque jamais en route."
],
quiz:[
{q:"Pourquoi épargner ce qui reste en fin de mois échoue-t-il presque toujours ?",opts:["Parce que les banques prélèvent leurs frais en fin de mois","Parce que les dépenses s'ajustent naturellement à l'argent disponible","Parce que les salaires sont versés trop tard","Parce que les livrets n'acceptent pas les petits versements"],correct:1,
explain:"Tant que la totalité du salaire reste visible et disponible, elle finit par être dépensée. Il faut retirer la somme avant, pas après."},
{q:"Quel est le meilleur moment pour programmer le virement ?",opts:["Le dernier jour du mois","Le lendemain du versement du salaire","Le 15 du mois","Quand le solde le permet"],correct:1,
explain:"Ce que tu ne vois jamais ne te manque pas. Un virement en fin de mois est un virement qui saute dès que le mois a été difficile."},
{q:"Que faire si le virement ne passe pas un mois ?",opts:["Arrêter le système et recommencer plus tard","Compenser le mois suivant en doublant","Baisser le montant et continuer","Passer à un virement manuel"],correct:2,
explain:"Un virement qui saute signale un montant trop élevé, pas un échec personnel. La seule vraie défaillance serait d'arrêter, car un système interrompu ne repart presque jamais."}
],
action:"Programme ce soir un virement automatique depuis ton application bancaire, vers ton livret séparé, daté du lendemain de ta paie. Choisis un montant que tu es certain de ne pas remarquer, quitte à ce qu'il paraisse ridiculement bas. L'objectif de ce soir n'est pas le montant, c'est que le système existe."
},
{module:"Module 3 — Se protéger des accidents", title:"Les assurances qui comptent vraiment", duration:"5 min",
script:[
"Un fonds d'urgence couvre les coups durs de la vie courante. Il ne couvre pas les événements rares qui coûtent des dizaines ou des centaines de milliers d'euros. Pour ceux-là, aucune épargne raisonnable ne suffit, et c'est exactement le rôle de l'assurance : transférer à un tiers un risque que tu ne peux pas absorber.",
"D'où un principe simple, qui permet de trancher rapidement. <strong>On assure ce qu'on ne peut pas se permettre de payer soi-même, et seulement cela.</strong> Tout le reste est de l'auto-assurance, c'est-à-dire de l'épargne. C'est ce principe qui explique pourquoi il est presque toujours rationnel d'assurer sa responsabilité civile, et presque jamais rationnel d'assurer un téléphone à 600 €.",
"Passons en revue ce qui compte réellement. La responsabilité civile, souvent incluse dans l'assurance habitation, couvre les dommages que tu causes à autrui. Les montants en jeu peuvent atteindre des sommes considérables si un accident cause un dommage corporel grave. C'est la protection la plus importante et souvent la moins chère.",
"<figure class=\"schema\"><svg viewBox=\"0 0 700 284\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"200\" y=\"20\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" letter-spacing=\"1.4\" fill=\"#1E4B3C\">TON FONDS D'URGENCE ABSORBE</text><text x=\"560\" y=\"20\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" letter-spacing=\"1.4\" fill=\"#B8862F\">L'ASSURANCE PREND LE RELAIS</text><text x=\"20\" y=\"44\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#43555F\">Panne d'électroménager</text><rect x=\"20\" y=\"54\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#EFF0EA\"/><rect x=\"20\" y=\"54\" width=\"594\" height=\"18\" rx=\"5\" fill=\"#E7EFEA\"/><rect x=\"614\" y=\"54\" width=\"66\" height=\"18\" rx=\"5\" fill=\"#F6EFE0\"/><text x=\"28\" y=\"67\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#1E4B3C\">600 €</text><text x=\"672\" y=\"67\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8E661F\"></text><text x=\"20\" y=\"100\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#43555F\">Franchise auto</text><rect x=\"20\" y=\"110\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#EFF0EA\"/><rect x=\"20\" y=\"110\" width=\"607\" height=\"18\" rx=\"5\" fill=\"#E7EFEA\"/><rect x=\"627\" y=\"110\" width=\"53\" height=\"18\" rx=\"5\" fill=\"#F6EFE0\"/><text x=\"28\" y=\"123\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#1E4B3C\">400 €</text><text x=\"672\" y=\"123\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8E661F\"></text><text x=\"20\" y=\"156\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#43555F\">Dommage causé à autrui</text><rect x=\"20\" y=\"166\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#EFF0EA\"/><rect x=\"20\" y=\"166\" width=\"40\" height=\"18\" rx=\"5\" fill=\"#E7EFEA\"/><rect x=\"60\" y=\"166\" width=\"620\" height=\"18\" rx=\"5\" fill=\"#F6EFE0\"/><text x=\"28\" y=\"179\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#1E4B3C\"></text><text x=\"672\" y=\"179\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8E661F\">jusqu'à des centaines de milliers</text><text x=\"20\" y=\"212\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#43555F\">Arrêt de travail de 6 mois</text><rect x=\"20\" y=\"222\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#EFF0EA\"/><rect x=\"20\" y=\"222\" width=\"79\" height=\"18\" rx=\"5\" fill=\"#E7EFEA\"/><rect x=\"99\" y=\"222\" width=\"581\" height=\"18\" rx=\"5\" fill=\"#F6EFE0\"/><text x=\"28\" y=\"235\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#1E4B3C\"></text><text x=\"672\" y=\"235\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8E661F\">prévoyance</text></svg><figcaption>On assure ce qu'on ne pourrait pas payer soi-même. Le reste, c'est de l'auto-assurance.</figcaption></figure>",
"L'assurance habitation est obligatoire pour un locataire et fortement recommandée pour un propriétaire. Vérifie surtout deux choses souvent négligées : le montant de la franchise, qui doit rester compatible avec ton fonds d'urgence, et le fait que tes biens de valeur soient réellement couverts, ce qui suppose parfois une déclaration spécifique.",
"L'assurance santé complémentaire mérite un vrai calcul plutôt qu'un réflexe. Compare la cotisation annuelle à tes dépenses de santé réelles des trois dernières années. Selon les situations, une complémentaire d'entreprise, un contrat individuel plus léger ou un contrat renforcé se justifient, et la bonne réponse dépend de tes soins, notamment optiques et dentaires.",
"<strong>La prévoyance est la grande oubliée</strong>, et c'est la plus grave. Elle couvre l'arrêt de travail prolongé, l'invalidité et le décès. Un salarié bénéficie souvent d'une couverture d'entreprise, qu'il faut vérifier plutôt que supposer. Un indépendant, lui, se retrouve fréquemment avec des indemnités journalières très faibles, ce qui signifie qu'un arrêt de 6 mois peut ruiner un foyer entier. Si tu es à ton compte, c'est le premier contrat à examiner, avant même de penser à investir.",
"Une dernière chose sur les assurances proposées au moment d'un achat. L'extension de garantie sur un électroménager, l'assurance moyens de paiement, l'assurance sur un crédit à la consommation modeste : ces produits ont des marges très élevées et couvrent des risques que ton fonds d'urgence absorbe déjà. Ils ne sont pas des arnaques, mais ils sont vendus à des gens qui n'en ont pas besoin, au moment précis où ils sont le moins en mesure de calculer."
],
quiz:[
{q:"Quel principe permet de décider s'il faut assurer un risque ?",opts:["Assurer tout ce qui a de la valeur","Assurer ce qu'on ne pourrait pas payer soi-même","Assurer ce que la banque recommande","Assurer uniquement ce qui est obligatoire"],correct:1,
explain:"L'assurance sert à transférer un risque qu'on ne peut pas absorber. Ce que le fonds d'urgence peut couvrir n'a pas besoin d'être assuré."},
{q:"Quelle protection est la plus souvent oubliée par les indépendants ?",opts:["L'assurance habitation","La prévoyance, qui couvre l'arrêt de travail et l'invalidité","L'assurance scolaire","L'assurance moyens de paiement"],correct:1,
explain:"Les indépendants ont souvent des indemnités journalières très faibles. Un arrêt prolongé peut alors mettre un foyer entier en difficulté."},
{q:"Pourquoi les extensions de garantie sont-elles rarement justifiées ?",opts:["Parce qu'elles sont illégales","Parce qu'elles couvrent un risque que le fonds d'urgence absorbe déjà","Parce qu'elles ne fonctionnent jamais","Parce qu'elles doublent le prix du produit"],correct:1,
explain:"Elles portent sur des montants que l'épargne de précaution peut supporter, et sont vendues au moment de l'achat, quand on calcule le moins."}
],
action:"Ce soir, cherche ton contrat de prévoyance, ou celui de ton entreprise, et repère une seule information : combien toucherais-tu par mois en cas d'arrêt de travail de 6 mois ? Si tu ne trouves pas la réponse en 10 minutes, c'est déjà un signal, et c'est la question à poser en priorité."
},
{module:"Module 3 — Se protéger des accidents", title:"Le crédit à la consommation, ce qu'il coûte vraiment", duration:"5 min",
script:[
"Un fonds d'urgence sert à ne pas emprunter. Il faut donc comprendre ce que l'on évite, et pourquoi le crédit à la consommation mérite une attention particulière parmi toutes les formes de dette.",
"Commençons par distinguer deux choses souvent confondues. Une dette qui finance un actif, comme un crédit immobilier, achète quelque chose qui conserve ou augmente sa valeur, à un taux généralement modéré. Une dette qui finance une consommation achète quelque chose dont la valeur disparaît, à un taux nettement plus élevé. La première peut être un outil. La seconde est presque toujours un coût.",
"Le mécanisme qui rend ce coût invisible est simple : on te parle en mensualités. Une mensualité paraît toujours petite, parce que le cerveau la compare à un revenu mensuel et non au prix total. Or la seule question qui compte est celle-ci : combien aurai-je payé à la fin ? Un crédit de 12 000 € sur 60 mois à un taux annuel effectif global de 6,5 % se rembourse environ 2 100 € au-dessus du montant emprunté. Le bien acheté ne coûte donc pas douze 1 000 €, il en coûte 14 000 €.",
"Le second mécanisme, plus vicieux, est l'allongement de la durée. Si tu dis que la mensualité est trop élevée, on te proposera d'allonger. La mensualité baisse, ce qui donne un sentiment de soulagement immédiat, et le coût total augmente fortement. <strong>C'est le seul cas où un produit devient plus cher précisément parce que tu as dit qu'il l'était trop.</strong>",
"Un cas mérite une attention spéciale : le crédit renouvelable, parfois appelé <em>revolving</em>. Son taux est souvent proche du taux maximum autorisé par la loi, et sa mécanique de reconstitution automatique du capital disponible fait qu'on peut rembourser pendant des années sans jamais réduire la dette. Si tu en as un, sa réduction est prioritaire sur tout le reste, y compris sur la constitution du fonds d'urgence au-delà du premier palier.",
"Il existe cependant une hiérarchie à respecter, et elle est contre-intuitive. Rembourser un crédit par anticipation procure un rendement certain égal à son taux, ce qui est excellent. Mais se retrouver sans aucune épargne après l'avoir remboursé conduit à réemprunter au premier imprévu, souvent à un taux plus élevé. D'où l'ordre : d'abord 1 000 € de côté, ensuite le remboursement accéléré des dettes chères, ensuite seulement la reconstitution complète du fonds d'urgence.",
"Enfin, le droit qu'on oublie de mentionner : tu peux rembourser un crédit à la consommation par anticipation. Des indemnités peuvent s'appliquer au-delà d'un certain seuil, elles sont plafonnées par la loi, et elles restent presque toujours très inférieures aux intérêts que tu économises."
],
quiz:[
{q:"Quelle est la différence essentielle entre les deux types de dette ?",opts:["Le montant emprunté","L'une finance un actif qui garde sa valeur, l'autre une consommation qui disparaît","La durée de remboursement","L'établissement qui la propose"],correct:1,
explain:"Un crédit immobilier achète un bien qui conserve une valeur. Un crédit à la consommation achète quelque chose qui se déprécie, à un taux plus élevé."},
{q:"Que se passe-t-il quand on allonge la durée d'un crédit ?",opts:["La mensualité baisse et le coût total baisse aussi","La mensualité baisse et le coût total augmente","Rien ne change, seul l'échéancier bouge","Le taux diminue automatiquement"],correct:1,
explain:"C'est la réponse qu'on te proposera si tu trouves la mensualité trop élevée, et elle rend le crédit plus cher."},
{q:"Dans quel ordre traiter dettes et épargne ?",opts:["Tout rembourser d'abord, épargner ensuite","Un premier palier d'épargne, puis les dettes chères, puis le fonds complet","Épargner entièrement avant de toucher aux dettes","Les deux à parts strictement égales"],correct:1,
explain:"Sans le moindre matelas, on réemprunte au premier imprévu, souvent plus cher. Le premier palier protège l'effort de remboursement."}
],
action:"Liste ce soir tous tes crédits en cours avec, pour chacun, le taux annuel effectif global et le capital restant dû. Range-les du taux le plus élevé au plus bas. Cette liste, que très peu de gens ont écrite, est l'ordre exact dans lequel les rembourser."
},
{module:"Module 4 — Après le fonds d'urgence", title:"Les enveloppes, et à quoi sert chacune", duration:"5 min",
script:[
"Une fois le fonds d'urgence constitué et les dettes chères remboursées, une question se pose : où mettre la suite ? Pour y répondre, il faut d'abord comprendre une distinction que beaucoup de gens n'ont jamais entendue, et qui explique la moitié des confusions sur le sujet.",
"<strong>Une enveloppe n'est pas un placement.</strong> C'est un contenant, avec ses propres règles fiscales et ses propres contraintes. Le placement, c'est ce que tu mets dedans. Un livret A est une enveloppe qui ne contient qu'une seule chose, du liquide rémunéré. Un plan d'épargne en actions est une enveloppe qui peut contenir des actions européennes ou des fonds qui les répliquent. Une assurance-vie est une enveloppe qui peut contenir un fonds en euros et des supports variés.",
"Cette distinction est utile parce qu'elle permet de poser les bonnes questions dans le bon ordre. D'abord : dans combien de temps aurai-je besoin de cet argent ? Ensuite : quelle enveloppe correspond à cet horizon ? Enfin seulement : que mettre dedans ? Faire l'inverse, choisir un placement puis chercher où le loger, conduit presque toujours à des erreurs coûteuses.",
"<figure class=\"schema\"><svg viewBox=\"0 0 700 168\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><line x1=\"34\" y1=\"96\" x2=\"666\" y2=\"96\" stroke=\"#DCDDD3\" stroke-width=\"2\"/><path d=\"M666 96 l-9 -5 v10 z\" fill=\"#DCDDD3\"/><line x1=\"47\" y1=\"96\" x2=\"47\" y2=\"62\" stroke=\"#1E4B3C\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/><circle cx=\"47\" cy=\"96\" r=\"7\" fill=\"#1E4B3C\"/><circle cx=\"47\" cy=\"96\" r=\"12\" fill=\"none\" stroke=\"#1E4B3C\" stroke-width=\"1\" opacity=\".35\"/><text x=\"47\" y=\"52\" text-anchor=\"start\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14\" font-weight=\"600\" fill=\"#12212B\">Aujourd'hui</text><text x=\"47\" y=\"122\" text-anchor=\"start\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12\" fill=\"#43555F\">Livrets réglementés</text><line x1=\"262\" y1=\"96\" x2=\"262\" y2=\"62\" stroke=\"#B8862F\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/><circle cx=\"262\" cy=\"96\" r=\"7\" fill=\"#B8862F\"/><circle cx=\"262\" cy=\"96\" r=\"12\" fill=\"none\" stroke=\"#B8862F\" stroke-width=\"1\" opacity=\".35\"/><text x=\"262\" y=\"52\" text-anchor=\"middle\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14\" font-weight=\"600\" fill=\"#12212B\">2 ans</text><text x=\"262\" y=\"122\" text-anchor=\"middle\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12\" fill=\"#43555F\">L'assurance-vie prend le relais</text><line x1=\"451\" y1=\"96\" x2=\"451\" y2=\"62\" stroke=\"#B8862F\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/><circle cx=\"451\" cy=\"96\" r=\"7\" fill=\"#B8862F\"/><circle cx=\"451\" cy=\"96\" r=\"12\" fill=\"none\" stroke=\"#B8862F\" stroke-width=\"1\" opacity=\".35\"/><text x=\"451\" y=\"52\" text-anchor=\"middle\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14\" font-weight=\"600\" fill=\"#12212B\">5 ans</text><text x=\"451\" y=\"122\" text-anchor=\"middle\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12\" fill=\"#43555F\">Le PEA devient léger</text><line x1=\"647\" y1=\"96\" x2=\"647\" y2=\"62\" stroke=\"#B8862F\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/><circle cx=\"647\" cy=\"96\" r=\"7\" fill=\"#B8862F\"/><circle cx=\"647\" cy=\"96\" r=\"12\" fill=\"none\" stroke=\"#B8862F\" stroke-width=\"1\" opacity=\".35\"/><text x=\"647\" y=\"52\" text-anchor=\"end\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14\" font-weight=\"600\" fill=\"#12212B\">8 ans</text><text x=\"647\" y=\"122\" text-anchor=\"end\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12\" fill=\"#43555F\">L'assurance-vie mature</text></svg><figcaption>L'horizon détermine l'enveloppe. Le compteur des 5 et 8 ans démarre à l'ouverture, pas au versement.</figcaption></figure>",
"Voici les horizons et leurs enveloppes. Pour de l'argent nécessaire à moins de 2 ans, les livrets réglementés restent la réponse : disponibles, sans risque nominal, sans fiscalité. Pour un horizon de 2 à 8 ans, l'assurance-vie devient intéressante, notamment parce que son avantage fiscal se déclenche après 8 ans, ce qui incite à l'ouvrir tôt même avec une petite somme. Au-delà de 8 ans et pour un objectif d'investissement en actions, le plan d'épargne en actions offre le cadre le plus léger fiscalement après 5 ans de détention.",
"Deux mécanismes méritent d'être retenus, parce qu'ils ne coûtent rien et rapportent beaucoup. Le premier : dans ces deux enveloppes, <strong>le délai fiscal court à partir de la date d'ouverture, pas du premier versement important</strong>. Ouvrir un plan d'épargne en actions et une assurance-vie avec quelques dizaines d'euros fait démarrer le compteur, et te laisse toute liberté ensuite. C'est probablement la décision la plus rentable par minute passée que tu prendras cette année.",
"Le second : les enveloppes ne s'excluent pas. La plupart des gens en détiennent plusieurs, chacune servant un horizon différent. La question n'est jamais laquelle choisir contre l'autre, mais laquelle correspond à quel projet.",
"Un mot enfin sur le plan d'épargne retraite, parce qu'il fait beaucoup parler. Il permet de déduire les versements de son revenu imposable, ce qui est d'autant plus intéressant que la tranche d'imposition est élevée. En contrepartie, l'argent est bloqué jusqu'à la retraite, sauf cas de déblocage prévus par la loi comme l'achat de la résidence principale. Ce blocage est le point à peser sérieusement : un avantage fiscal ne compense jamais l'impossibilité d'accéder à son argent quand on en a besoin."
],
quiz:[
{q:"Quelle est la différence entre une enveloppe et un placement ?",opts:["Aucune, ce sont deux mots pour la même chose","L'enveloppe est le contenant avec ses règles fiscales, le placement est ce qu'on met dedans","L'enveloppe est réservée aux professionnels","Le placement est garanti, l'enveloppe non"],correct:1,
explain:"Un PEA est un contenant ; les actions ou fonds qu'il abrite sont le contenu. Confondre les deux mène à choisir un placement avant de savoir où le loger."},
{q:"Dans quel ordre faut-il raisonner ?",opts:["Choisir le placement, puis l'enveloppe, puis l'horizon","Choisir l'horizon, puis l'enveloppe, puis le placement","Choisir l'enveloppe la plus connue, puis remplir","Choisir selon le conseil de sa banque"],correct:1,
explain:"L'horizon, c'est-à-dire la date à laquelle tu auras besoin de l'argent, détermine tout le reste."},
{q:"Pourquoi ouvrir tôt un PEA ou une assurance-vie, même avec peu d'argent ?",opts:["Pour obtenir un meilleur taux","Parce que le délai fiscal court depuis la date d'ouverture","Parce que les frais baissent avec l'ancienneté","Parce que c'est obligatoire avant trente ans"],correct:1,
explain:"Le compteur des 5 ans ou des 8 ans démarre à l'ouverture. Quelques dizaines d'euros suffisent à le lancer."}
],
action:"Vérifie ce soir si tu détiens déjà un plan d'épargne en actions ou une assurance-vie, et depuis quelle date. Si tu n'en as aucun et que tu envisages d'investir un jour, sache que l'ouverture prend une vingtaine de minutes en ligne. Tu n'es pas obligé de le faire ce soir, mais tu dois savoir que le compteur ne démarre pas tout seul."
},
{module:"Module 4 — Après le fonds d'urgence", title:"Épargner pour un projet daté", duration:"5 min",
script:[
"Entre le fonds d'urgence, qui ne sert qu'aux accidents, et l'investissement long terme, qui ne se touche pas avant des années, il existe une catégorie intermédiaire que presque personne n'organise : l'épargne de projet. C'est elle qui finance un permis de conduire, un déménagement, un mariage, un voyage, un apport immobilier ou le remplacement d'une voiture.",
"Cette épargne obéit à une règle simple, et sa simplicité fait sa force : <strong>plus l'échéance est proche, moins on prend de risque</strong>. Un projet à moins de 2 ans se finance uniquement sur des supports sans risque de perte. La raison est mathématique : sur une durée courte, il n'y a pas assez de temps pour absorber une baisse. Quelqu'un qui plaçait son apport immobilier en actions 6 mois avant l'achat a pris un risque qu'aucun gain espéré ne justifiait.",
"Le calcul à faire est direct. Montant du projet, divisé par le nombre de mois qui te séparent de l'échéance, donne le versement mensuel nécessaire. Si ce montant est intenable, il n'y a que trois leviers, et il vaut mieux les regarder en face : repousser la date, réduire l'ambition du projet, ou augmenter les revenus. Espérer un rendement élevé pour combler l'écart n'est pas un levier, <em>c'est un pari</em>.",
"Je te recommande fortement de séparer chaque projet, en pratique par un livret distinct ou au minimum par une ligne dédiée dans ton tableau de budget. Un seul compte qui mélange le fonds d'urgence, les vacances et l'apport immobilier produit une confusion coûteuse : on pioche dans l'apport pour les vacances, sans jamais en prendre la décision consciente.",
"Nommer le compte compte plus qu'on ne l'imagine. Un compte appelé « épargne » se pioche facilement. Un compte appelé « apport appartement, juin 2028 » se pioche beaucoup moins, parce que retirer de l'argent revient alors à décider explicitement de repousser un projet identifié. C'est un détail gratuit, et l'un des plus efficaces de toute cette formation.",
"Un dernier point souvent négligé : prévois une marge. Les projets coûtent presque toujours plus cher que prévu, entre 10 et 20 % selon leur nature. Un déménagement, ce n'est pas seulement le camion, ce sont aussi le dépôt de garantie, les frais d'agence, les changements d'abonnements et le premier remplissage des placards. Intégrer cette marge dès le départ évite d'avoir à emprunter à la fin, ce qui annulerait une bonne partie de l'effort d'épargne."
],
quiz:[
{q:"Comment placer une épargne destinée à un projet dans 18 mois ?",opts:["En actions, pour maximiser le rendement","Sur des supports sans risque de perte","Moitié en actions, moitié en livret","Sur un plan bloqué jusqu'à l'échéance"],correct:1,
explain:"Sur une échéance courte, il n'y a pas assez de temps pour absorber une baisse. Le risque n'est pas compensé par l'espérance de gain."},
{q:"Que faire si le versement mensuel nécessaire est intenable ?",opts:["Chercher un placement plus rentable","Repousser la date, réduire l'ambition, ou augmenter les revenus","Emprunter la différence","Réduire le fonds d'urgence"],correct:1,
explain:"Ce sont les trois seuls leviers réels. Espérer un rendement élevé pour combler l'écart est un pari, pas un plan."},
{q:"Pourquoi nommer précisément un compte d'épargne projet ?",opts:["Pour des raisons fiscales","Parce que retirer devient alors une décision explicite de repousser un projet","Parce que la banque l'exige","Pour obtenir un taux préférentiel"],correct:1,
explain:"Un compte nommé « épargne » se pioche sans y penser. Un compte nommé « apport appartement, juin 2028 » impose de regarder ce à quoi on renonce."}
],
action:"Choisis un projet que tu repousses depuis un moment et donne-lui trois choses ce soir : un montant, une date, et un nom. Divise le montant par le nombre de mois restants, ajoute 15 % de marge, et tu obtiens ton versement mensuel. Le projet cesse alors d'être un souhait pour devenir une ligne de budget."
},
{module:"Module 5 — Tenir dans la durée", title:"Protéger ses proches, et se protéger soi", duration:"5 min",
script:[
"Cette leçon aborde un sujet que la plupart des formations financières évitent, et c'est dommage, parce qu'il concerne tout le monde et qu'il coûte très cher de ne pas s'en occuper. Que se passe-t-il, financièrement, si tu disparais ou si tu deviens incapable de gérer tes affaires ?",
"Premier constat, très concret : personne ne sait où se trouve ton argent. Tes comptes, tes contrats, tes livrets, tes éventuels comptes en ligne. Des sommes considérables restent chaque année non réclamées en France, simplement parce que les héritiers ignoraient leur existence. Ce n'est pas un problème juridique, c'est un problème d'information.",
"La solution tient en une feuille, et elle ne coûte rien. Écris la liste de tes comptes et contrats, avec le nom des établissements, sans mots de passe ni codes. Indique où trouver les documents. Range cette feuille dans un endroit connu d'une personne de confiance. Ce n'est pas un testament, cela n'a aucune valeur juridique, et ce n'est pas le sujet : c'est une carte, et elle évite à tes proches des mois de recherche au pire moment de leur vie.",
"Deuxième point : la clause bénéficiaire d'une assurance-vie. C'est le document le plus important et le moins relu de toute l'épargne française. C'est elle qui désigne qui recevra le capital, et elle prime sur beaucoup d'autres considérations. Une clause rédigée il y a 15 ans peut désigner un ex-conjoint, ignorer un enfant né depuis, ou être formulée si vaguement qu'elle crée un conflit. Relis-la après chaque événement familial important.",

async function loadProgressFromServer(){
  const { data } = await sb
    .from('lesson_progress')
    .select('lesson_number, completed')
    .eq('user_id', CURRENT_USER.id)
    .eq('formation', FORMATION);
  const p = {};
  if(data){ data.forEach(function(row){ if(row.completed) p[row.lesson_number] = true; }); }
  PROGRESS_CACHE = p;
  return p;
}
function getProgress(){ return PROGRESS_CACHE; }
async function setProgressServer(lessonNumber, value){
  PROGRESS_CACHE[lessonNumber] = value;
  await sb.from('lesson_progress').upsert({
    user_id: CURRENT_USER.id,
    formation: FORMATION,
    lesson_number: lessonNumber,
    completed: value,
    completed_at: value ? new Date().toISOString() : null
  }, { onConflict: 'user_id,formation,lesson_number' });

  await majCarnet(lessonNumber, value);
}

/* Le carnet de route : l'action cochée s'inscrit dans le carnet personnel,
   la décocher l'en retire. Une erreur ici ne doit jamais bloquer la
   progression de la leçon, d'où le try/catch silencieux. */
async function majCarnet(lessonNumber, value){
  try {
    const l = LESSONS[lessonNumber - 1];
    if(!l) return;

    if(!value){
      await sb.from('carnet').delete()
        .eq('user_id', CURRENT_USER.id)
        .eq('formation', FORMATION)
        .eq('lesson_number', lessonNumber);
      return;
    }

    await sb.from('carnet').upsert({
      user_id: CURRENT_USER.id,
      formation: FORMATION,
      lesson_number: lessonNumber,
      titre: l.title || ('Leçon ' + lessonNumber),
      action: l.action || ''
    }, { onConflict: 'user_id,formation,lesson_number', ignoreDuplicates: true });
  } catch(e){
    console.warn('Carnet non mis à jour :', e);
  }
}

let current = parseInt(new URLSearchParams(location.search).get('l')) || 1;
if(current < 1) current = 1;
if(current > LESSONS.length) current = LESSONS.length;

function isUnlocked(n){
  if(n === 1) return true;
  const progress = getProgress();
  return !!progress[n-1];
}

function renderSidebar(){
  const progress = getProgress();
  const doneCount = Object.keys(progress).filter(function(k){ return progress[k]; }).length;
  document.getElementById('navProgress').textContent = doneCount + '/' + LESSONS.length + ' leçons';

  /* Regroupement des lecons par module : c'est le module qui devient
     l'etape de l'itineraire, la lecon n'est qu'un arret. */
  const etapes = [];
  LESSONS.forEach(function(l, i){
    const nom = l.module.split(' — ')[1] || l.module;
    let e = etapes.find(function(x){ return x.nom === nom; });
    if(!e){ e = { nom: nom, lecons: [] }; etapes.push(e); }
    e.lecons.push({ n: i + 1, titre: l.title });
  });

  const etapeCourante = etapes.findIndex(function(e){
    return e.lecons.some(function(a){ return a.n === current; });
  });

  const COCHE = '<svg viewBox="0 0 24 24" fill="none"><path d="M5 12L10 17L19 7" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  let html = '<div class="itin">' +
    '<div class="itin-tete">' +
      '<div class="itin-formation">' + NOM_FORMATION + '</div>' +
      '<div class="itin-compte">Étape ' + (etapeCourante + 1) + ' sur ' + etapes.length + ' · ' + doneCount + '/' + LESSONS.length + ' leçons</div>' +
      '<div class="itin-barre"><span style="width:' + Math.round(doneCount / LESSONS.length * 100) + '%"></span></div>' +
    '</div><div class="route">';

  etapes.forEach(function(e, idx){
    const toutesFaites = e.lecons.every(function(a){ return progress[a.n]; });
    const ici = idx === etapeCourante;
    const premiereAccessible = e.lecons.find(function(a){ return isUnlocked(a.n); });
    const classe = toutesFaites ? 'faite' : (ici ? 'ici' : '');
    const borne = toutesFaites ? COCHE : String(idx + 1);
    const cible = premiereAccessible ? premiereAccessible.n : e.lecons[0].n;

    html += '<div class="etape-i ' + classe + '">' +
      '<span class="borne">' + borne + '</span>' +
      '<button class="etape-titre" onclick="goTo(' + cible + ')">' + e.nom + '</button>' +
      '<div class="etape-meta">' + e.lecons.length + ' leçon' + (e.lecons.length > 1 ? 's' : '') + '</div>';

    /* On ne deroule que l'etape ou l'on se trouve : la carte reste lisible. */
    if(ici){
      html += '<div class="arrets">';
      e.lecons.forEach(function(a){
        const fait = !!progress[a.n];
        const ouvert = isUnlocked(a.n);
        const cl = (a.n === current ? 'ici ' : '') + (fait ? 'faite ' : '') + (ouvert ? '' : 'bloque');
        html += '<div class="arret ' + cl + '" onclick="goTo(' + a.n + ')">' +
          '<span class="puce">' + COCHE + '</span><span>' + a.titre + '</span></div>';
      });
      html += '</div>';
    }
    html += '</div>';
  });

  html += '</div>' + escaleHtml() + '</div>';
  document.getElementById('sidebar').innerHTML = html;
}

function escaleHtml(){
  let h = '<div class="escale"><div class="escale-titre">Autres formations</div>';
  PARCOURS.forEach(function(p){
    const courante = p.cle === FORMATION;
    h += '<a href="' + p.page + '" class="' + (courante ? 'courante' : 'prete') + '">' +
      '<span class="jeton"></span><span>' + p.nom + '</span></a>';
  });
  h += '</div>';
  return h;

function goTo(n){
  if(!isUnlocked(n)){
    alert('Termine la leçon précédente pour débloquer celle-ci.');
    return;
  }
  current = n;
  history.replaceState(null, '', '?l=' + n);
  render();
  window.scrollTo(0,0);
}

let quizState = {};

function allQuizCorrect(l){
  for(let i=0;i<l.quiz.length;i++){ if(!quizState[i]) return false; }
  return true;
}

function render(){
  renderSidebar();
  const l = LESSONS[current-1];
  const progress = getProgress();
  const done = !!progress[current];
  quizState = {};
  if(done){ l.quiz.forEach(function(q,i){ quizState[i] = true; }); }
  const main = document.getElementById('main');
  let quizHtml = '';
  l.quiz.forEach(function(q, qi){
    let optsHtml = '';
    q.opts.forEach(function(opt, oi){
      const preAnswered = done && oi === q.correct;
      optsHtml += '<div class="quiz-opt ' + (preAnswered?'correct disabled':'') + '" id="q' + qi + 'o' + oi + '" onclick="answerQuiz(' + qi + ',' + oi + ',' + q.correct + ')">' +
        '<span class="quiz-letter">' + String.fromCharCode(65+oi) + '</span><span class="quiz-opt-text">' + opt + '</span></div>';
    });
    quizHtml += '<div class="quiz-card"><div class="quiz-q">Question ' + (qi+1) + '. ' + q.q + '</div>' + optsHtml +
      '<div class="quiz-explain ' + (done?'show':'') + '" id="exp' + qi + '"><strong>Explication : </strong>' + q.explain + '</div></div>';
  });

  const quizOk = allQuizCorrect(l);
  const actionCardStyle = (!quizOk && !done) ? 'opacity:.5;pointer-events:none;' : '';

  main.innerHTML =
    (done ? '<div class="completion-badge show">✓ Leçon terminée</div>' : '') +
    '<div class="lesson-eyebrow">' + l.module + '</div>' +
    '<div class="lesson-title">' + (current) + '. ' + l.title + '</div>' +
    '<div class="lesson-meta">' + l.duration + ' de lecture · Leçon ' + current + ' sur ' + LESSONS.length + '</div>' +
    '<div class="section-label"><span class="dot"></span>Comprendre</div>' +
    '<div class="script-text">' + l.script.map(function(p){
      return p.indexOf('<figure') === 0 ? p : '<p>' + p + '</p>';
    }).join('') + '</div>' +
    '<div class="section-label quiz"><span class="dot"></span>Vérifier</div>' +
    quizHtml +
    '<div class="section-label action"><span class="dot"></span>Petite action</div>' +
    (!quizOk && !done ? '<div style="font-size:12.5px;font-weight:600;color:var(--coral);margin-bottom:10px;">Réponds correctement aux ' + l.quiz.length + ' questions pour débloquer cette action.</div>' : '') +
    '<div class="action-card" id="actionCard" style="' + actionCardStyle + '">' +
      '<div class="action-text">' + l.action + '</div>' +
      '<div class="action-check" onclick="toggleAction()"><span class="action-box ' + (done?'checked':'') + '" id="actionBox">' + (done?'✓':'') + '</span><span class="action-label">Marquer cette leçon comme terminée</span></div>' +
    '</div>' +
    '<div class="lesson-nav">' +
      (current > 1 ? '<button class="nav-btn ghost" onclick="goTo(' + (current-1) + ')">← Leçon précédente</button>' : '<span></span>') +
      (current < LESSONS.length ? '<button class="nav-btn" onclick="goTo(' + (current+1) + ')">Leçon suivante →</button>' : '<a href="budget.html" class="nav-btn">Terminer le parcours →</a>') +
    '</div>';
}

function answerQuiz(qi, oi, correct){
  if(quizState[qi]) return; // déjà répondu correctement, verrouillé
  const chosen = document.getElementById('q'+qi+'o'+oi);
  if(chosen.classList.contains('disabled')) return;

  if(oi === correct){
    for(let k=0;k<10;k++){
      const el = document.getElementById('q'+qi+'o'+k);
      if(el){ el.classList.add('disabled'); }
    }
    chosen.classList.add('correct');
    quizState[qi] = true;
    document.getElementById('exp'+qi).classList.add('show');
    const l = LESSONS[current-1];
    const quizOk = allQuizCorrect(l);
    const card = document.getElementById('actionCard');
    if(quizOk && card){
      card.style.opacity = '';
      card.style.pointerEvents = '';
      const lock = card.previousElementSibling;
      if(lock && lock.textContent.indexOf('Réponds correctement') !== -1){ lock.style.display = 'none'; }
    }
  } else {
    chosen.classList.add('wrong');
    document.getElementById('exp'+qi).classList.add('show');
    setTimeout(function(){ chosen.classList.remove('wrong'); }, 900);
  }
}

async function toggleAction(){
  const l = LESSONS[current-1];
  const progress = getProgress();
  const newValue = !progress[current];
  if(newValue && !allQuizCorrect(l)){
    alert('Réponds correctement à toutes les questions du quiz avant de valider cette leçon.');
    return;
  }
  await setProgressServer(current, newValue);
  render();

  /* La formation vient-elle de s'achever ? Si oui, on plante la borne.
     On ne la montre qu'au moment du basculement, jamais en revenant
     sur une leçon déjà validée. */
  if(newValue) verifierFinDeParcours();
}

async function verifierFinDeParcours(){
  const progress = getProgress();
  const faites = Object.keys(progress).filter(function(k){ return progress[k]; }).length;
  if(faites < LESSONS.length) return;

  let prenom = '';
  let semaines = 1;
  try {
    const { data } = await sb.from('profiles').select('prenom').eq('id', CURRENT_USER.id).maybeSingle();
    if(data && data.prenom) prenom = data.prenom;

    const { data: dates } = await sb.from('lesson_progress')
      .select('completed_at').eq('user_id', CURRENT_USER.id).eq('formation', FORMATION)
      .not('completed_at', 'is', null).order('completed_at', { ascending: true }).limit(1);
    if(dates && dates.length){
      const debut = new Date(dates[0].completed_at).getTime();
      semaines = Math.max(1, Math.round((Date.now() - debut) / (7*24*3600*1000)));
    }
  } catch(e){ console.warn('Carte : données partielles', e); }

  ouvrirCarte(FORMATION, LESSONS.length, prenom, semaines);
}

async function boot(){
  document.getElementById('main').innerHTML = '<div style="padding:60px 0;text-align:center;color:var(--ink-faint);font-size:14px;">Chargement de ta progression…</div>';
  const user = await requireAuth();
  if(!user) return;
  const unlocked = await requireUnlock(user.id);
  if(!unlocked) return;
  CURRENT_USER = user;
  await loadProgressFromServer();

  if(!isUnlocked(current)){
    let lastUnlocked = 1;
    for(let i=1;i<=LESSONS.length;i++){ if(isUnlocked(i)) lastUnlocked = i; else break; }
    current = lastUnlocked;
    history.replaceState(null, '', '?l=' + current);
  }
  render();
}
boot();
