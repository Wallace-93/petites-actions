<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --ink:#171C45;--ink-soft:#44496B;--ink-muted:#6B7094;--ink-faint:#9599B5;
  --bg:#FFFFFF;--bg-soft:#F6F7FB;--bg-mid:#F0F1F7;--bg-line:#DCDEEA;
  --green:#2B3A8F;--green-light:#3B4BA8;--green-pale:#E9EBF7;--green-bord:#C5CAEB;
  --amber:#C27C00;--amber-pale:#FDF2DA;--amber-bord:#F0D49A;
  --violet:#4D5675;--violet-pale:#EEF0F5;--violet-bord:#D5D9E6;
  --coral:#A3213D;--coral-pale:#FAEAEE;
  --sans:'Archivo',system-ui,-apple-system,sans-serif;
  --display:'Archivo',system-ui,sans-serif;
  --mono:'Archivo',system-ui,sans-serif;
}
body{font-family:var(--sans);background:var(--bg-soft);color:var(--ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;}
a{color:inherit;}

.nav{position:sticky;top:0;z-index:200;background:rgba(255,255,255,.96);backdrop-filter:blur(20px);border-bottom:1px solid var(--bg-line);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;font-weight:800;font-size:15px;color:var(--ink);}
.nav-mark{width:26px;height:26px;border-radius:8px;background:var(--green);display:flex;align-items:center;justify-content:center;}
.nav-mark svg{width:14px;height:14px;}
.nav-back{font-size:13px;font-weight:600;color:var(--ink-muted);text-decoration:none;}
.nav-progress-pill{font-size:12px;font-weight:700;color:var(--green);background:var(--green-pale);padding:5px 12px;border-radius:100px;}

.layout{display:grid;grid-template-columns:280px 1fr;max-width:1100px;margin:0 auto;min-height:calc(100vh - 60px);}
.sidebar{border-right:1px solid var(--bg-line);background:var(--bg);padding:24px 16px;position:sticky;top:60px;align-self:start;height:calc(100vh - 60px);overflow-y:auto;}
.sb-progress-bar{height:6px;background:var(--bg-mid);border-radius:100px;overflow:hidden;margin:0 10px 18px;}
.sb-progress-fill{height:100%;background:var(--green);border-radius:100px;transition:width .3s;}
.sb-item{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:10px;cursor:pointer;margin-bottom:2px;font-size:13px;font-weight:600;color:var(--ink-muted);transition:background .15s;}
.sb-item:hover{background:var(--bg-soft);}
.sb-item.active{background:var(--green-pale);color:var(--green);}
.sb-item.done{color:var(--ink);}
.sb-item.locked{opacity:.45;cursor:not-allowed;}
.sb-item.locked:hover{background:transparent;}
.sb-check{width:20px;height:20px;border-radius:50%;background:var(--bg-mid);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink-faint);flex-shrink:0;}
.sb-item.done .sb-check{background:var(--green);color:#fff;}
.sb-item.active .sb-check{background:var(--green);color:#fff;}
.sb-module-label{font-size:13.5px;font-weight:700;color:var(--ink-faint);text-transform:none;letter-spacing:0;padding:14px 10px 6px;}

.main{padding:36px 40px 80px;max-width:720px;}
.lesson-eyebrow{font-size:13.5px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--green);margin-bottom:10px;}
.lesson-title{font-size:28px;font-weight:800;letter-spacing:-.03em;color:var(--ink);margin-bottom:8px;line-height:1.15;}
.lesson-meta{font-size:13px;color:var(--ink-faint);margin-bottom:32px;}

.section-label{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:800;letter-spacing:0;text-transform:none;color:var(--ink-muted);margin:36px 0 16px;}
.section-label .dot{width:6px;height:6px;border-radius:50%;background:var(--green);}
.section-label.quiz .dot{background:var(--violet);}
.section-label.action .dot{background:var(--amber);}

.script-text p{font-size:15.5px;font-weight:400;color:var(--ink-soft);line-height:1.75;margin-bottom:18px;}

.quiz-card{background:var(--bg);border:1px solid var(--bg-line);border-radius:16px;padding:24px;margin-bottom:14px;}
.quiz-q{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:16px;line-height:1.5;}
.quiz-opt{display:flex;align-items:flex-start;gap:12px;padding:13px 15px;border:1.5px solid var(--bg-line);border-radius:11px;margin-bottom:9px;cursor:pointer;transition:border-color .15s,background .15s;}
.quiz-opt:hover{border-color:var(--ink-faint);}
.quiz-opt.correct{border-color:var(--green);background:var(--green-pale);}
.quiz-opt.wrong{border-color:var(--coral);background:var(--coral-pale);}
.quiz-opt.disabled{cursor:default;pointer-events:none;}
.quiz-letter{width:24px;height:24px;border-radius:7px;background:var(--bg-soft);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--ink-muted);flex-shrink:0;}
.quiz-opt.correct .quiz-letter{background:var(--green);color:#fff;}
.quiz-opt.wrong .quiz-letter{background:var(--coral);color:#fff;}
.quiz-opt-text{font-size:13.5px;font-weight:500;color:var(--ink);padding-top:2px;}
.quiz-explain{display:none;font-size:13px;font-weight:400;color:var(--ink-muted);line-height:1.6;background:var(--bg-soft);border-radius:10px;padding:14px 16px;margin-top:8px;}
.quiz-explain.show{display:block;}
.quiz-explain strong{color:var(--ink);}

.action-card{background:var(--amber-pale);border:1px solid var(--amber-bord);border-radius:16px;padding:22px 24px;}
.action-text{font-size:14.5px;font-weight:500;color:var(--ink);line-height:1.65;margin-bottom:16px;}
.action-check{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;}
.action-box{width:22px;height:22px;border-radius:7px;border:2px solid var(--amber);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;transition:background .15s;}
.action-box.checked{background:var(--amber);}
.action-label{font-size:13px;font-weight:700;color:#8a6a00;}

.lesson-nav{display:flex;justify-content:space-between;align-items:center;margin-top:40px;padding-top:24px;border-top:1px solid var(--bg-line);}
.nav-btn{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border:none;cursor:pointer;font-family:var(--sans);font-size:14px;font-weight:700;padding:13px 24px;border-radius:11px;text-decoration:none;transition:background .2s;}
.nav-btn:hover{background:var(--ink-soft);}
.nav-btn.ghost{background:var(--bg-mid);color:var(--ink-muted);}
.nav-btn.ghost:hover{background:var(--bg-line);}
.completion-badge{display:none;align-items:center;gap:8px;background:var(--green-pale);color:var(--green);font-size:12.5px;font-weight:700;padding:8px 16px;border-radius:100px;margin-bottom:20px;}
.completion-badge.show{display:inline-flex;}

@media(max-width:860px){
  .layout{grid-template-columns:1fr;}
  .sidebar{position:static;height:auto;border-right:none;border-bottom:1px solid var(--bg-line);}
  .main{padding:28px 20px 60px;}
}

/* ===== Direction Encre & Laiton — surcouche typographique ===== */
body{font-family:var(--sans);letter-spacing:0;}
h1,h2,h3,h4,.hero-h1,.s-title,.cta-h2,.p-name,.mod-title,.c-title,.hc-title,
.lecon-title,.q-title,.auth-title,.perf-title,.section-title,.edu-title,.tips-title{
  font-family:var(--display);letter-spacing:-.015em;
}
.hero-h1,.s-title,.cta-h2,.auth-title{font-weight:500;letter-spacing:-.018em;line-height:1.16;}
h3,h4,.p-name,.mod-title,.c-title,.hc-title,.lecon-title{font-weight:600;}
.s-tag,.f-copy,.hstat-label,.stat-label,.perf-note,.order-meta,.pos-value,
.price-cell,.asset-label,.badge,.eyebrow,.nav-balance{font-family:var(--mono);}

.nav-name em,.ft-name em{font-style:normal;color:var(--amber);}

/* Mise en valeur dans le corps des lecons : le gras porte la notion a
   retenir, l italique la nuance ou le terme technique. */
.script-text strong{color:var(--ink,#171C45);font-weight:700;}
.script-text em{font-style:italic;color:var(--ink-soft,#44496B);}
.script-text u{text-decoration:none;background:linear-gradient(transparent 62%,var(--amber-pale,#FDF2DA) 62%);
  box-shadow:inset 0 -1px 0 var(--amber,#C27C00);}
.script-text p + p{margin-top:14px;}

/* ===== L'itineraire =====
   Une route verticale plutot qu'une liste : on voit d'ou l'on vient,
   ou l'on est, et ce qu'il reste. Meme vocabulaire graphique que le
   carnet de route et les emblemes. */
.itin{padding:4px 4px 24px;}
.itin-tete{padding:0 8px 16px;border-bottom:1px solid var(--bg-line);margin-bottom:16px;}
.itin-formation{font-family:var(--display);font-size:16px;font-weight:600;color:var(--ink);line-height:1.25;}
.itin-compte{font-family:var(--mono);font-size:13.5px;letter-spacing:0;text-transform:none;
  color:var(--ink-muted);margin-top:7px;}
.itin-barre{height:4px;background:var(--bg-mid);border-radius:100px;overflow:hidden;margin-top:10px;}
.itin-barre span{display:block;height:100%;background:var(--amber);border-radius:100px;transition:width .4s cubic-bezier(.4,0,.2,1);}

/* La route */
.route{position:relative;padding-left:30px;}
.route::before{content:"";position:absolute;left:11px;top:14px;bottom:14px;width:2px;
  background:repeating-linear-gradient(var(--bg-line) 0 6px, transparent 6px 11px);}
.etape-i{position:relative;margin-bottom:6px;}
.borne{position:absolute;left:-30px;top:6px;width:24px;height:24px;border-radius:50%;
  background:var(--bg);border:2px solid var(--bg-line);display:grid;place-items:center;
  font-family:var(--mono);font-size:10px;color:var(--ink-faint);z-index:1;transition:all .2s;}
.borne svg{width:11px;height:11px;}
.etape-i.faite .borne{background:var(--amber);border-color:var(--amber);color:#fff;}
.etape-i.ici .borne{background:var(--green);border-color:var(--green);color:#fff;
  box-shadow:0 0 0 4px var(--green-pale);}
.etape-titre{display:block;width:100%;text-align:left;background:transparent;border:0;cursor:pointer;
  font-family:var(--display);font-size:14.5px;font-weight:600;color:var(--ink-soft);
  padding:7px 9px;border-radius:9px;line-height:1.3;transition:background .15s,color .15s;}
.etape-titre:hover{background:var(--bg-soft);color:var(--ink);}
.etape-i.ici .etape-titre{color:var(--green);}
.etape-i.faite .etape-titre{color:var(--ink);}
.etape-meta{font-family:var(--mono);font-size:10px;color:var(--ink-faint);padding:0 9px 4px;letter-spacing:.06em;}

/* Les lecons de l'etape en cours */
.arrets{margin:2px 0 12px;padding-left:9px;border-left:1px solid var(--bg-line);}
.arret{display:flex;align-items:flex-start;gap:9px;padding:7px 9px;border-radius:8px;cursor:pointer;
  font-size:12.8px;font-weight:500;color:var(--ink-muted);transition:background .15s;line-height:1.35;}
.arret:hover{background:var(--bg-soft);color:var(--ink);}
.arret.ici{background:var(--green-pale);color:var(--green);font-weight:700;}
.arret.faite{color:var(--ink);}
.arret.bloque{opacity:.42;cursor:not-allowed;}
.arret.bloque:hover{background:transparent;}
.puce{width:15px;height:15px;border-radius:4px;flex:none;margin-top:1px;border:1.5px solid var(--bg-line);
  display:grid;place-items:center;background:var(--bg);}
.puce svg{width:9px;height:9px;opacity:0;}
.arret.faite .puce{background:var(--amber);border-color:var(--amber);}
.arret.faite .puce svg{opacity:1;}
.arret.ici .puce{border-color:var(--green);border-style:dashed;}

/* Changer de formation sans repasser par le menu */
.escale{margin-top:22px;padding-top:16px;border-top:1px solid var(--bg-line);}
.escale-titre{font-family:var(--mono);font-size:13.5px;letter-spacing:0;text-transform:none;
  color:var(--ink-faint);padding:0 9px 9px;}
.escale a{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;text-decoration:none;
  font-size:12.8px;color:var(--ink-soft);transition:background .15s;}
.escale a:hover{background:var(--bg-soft);color:var(--ink);}
.escale a.courante{background:var(--green-pale);color:var(--green);font-weight:700;}
.jeton{width:7px;height:7px;border-radius:50%;background:var(--bg-line);flex:none;}
.escale a.courante .jeton{background:var(--green);}
.escale a.prete .jeton{background:var(--amber);}

@media(max-width:860px){
  .itin{padding-bottom:8px;}
  .route{padding-left:26px;}
  .borne{left:-26px;}
}
@media(prefers-reduced-motion:reduce){*{transition:none !important;}}

/* ===== Schemas des lecons ===== */
.schema{margin:26px 0;padding:20px 18px 14px;border:1px solid var(--bg-line,#DCDEEA);
  border-radius:12px;background:var(--bg,#FFFFFF);}
.schema svg{width:100%;height:auto;display:block;}
.schema figcaption{font-family:var(--mono,'Archivo',sans-serif);font-size:11.5px;line-height:1.55;
  color:var(--ink-muted,#6B7094);margin-top:14px;padding-top:12px;
  border-top:1px solid var(--bg-line,#DCDEEA);}
@media(max-width:620px){.schema{padding:14px 12px 10px;margin:20px -6px;}}

/* Sortie de leçon : on peut toujours s'arrêter sans se sentir coincé. */
.lesson-sortie{display:flex;flex-wrap:wrap;align-items:center;gap:9px;justify-content:center;
  margin-top:24px;padding-top:18px;border-top:1px solid var(--bg-line);
  font-size:13.5px;color:var(--ink-faint);}
.lesson-sortie a{color:var(--ink-muted);text-decoration:none;font-weight:600;}
.lesson-sortie a:hover{color:var(--green);}
</style>

<script>
/* ============ DONNÉES DES 16 LEÇONS — MAÎTRISER SON BUDGET ============ */
const LESSONS = [
{module:"Module 1 — Comprendre l'impôt avant de l'optimiser", title:"Comment ton impôt est réellement calculé", duration:"5 min",
script:[
"Avant de chercher à payer moins, il faut comprendre comment ton impôt est calculé. C'est la leçon la plus utile de cette formation. La plupart des mauvaises décisions viennent d'un calcul mal compris, pas d'un manque d'astuces.",
"L'impôt sur le revenu fonctionne <strong>par tranches</strong>. Ton revenu est découpé en morceaux, et chaque morceau a son propre taux. Il y a 5 tranches, de 0 % pour la première à 45 % pour la plus haute. Les seuils changent chaque année. Vérifie toujours ceux de l'année concernée au lieu de te fier à un chiffre retenu.",
"Le calcul se fait en 4 étapes. <strong>1.</strong> On additionne tes revenus imposables. <strong>2.</strong> On retire 10 % sur les salaires, pour couvrir tes frais de travail. <strong>3.</strong> On divise le résultat par ton nombre de parts. <strong>4.</strong> On applique les tranches à ce résultat, puis on multiplie par le nombre de parts.",
"Diviser puis multiplier, ce n'est pas un caprice de l'administration. C'est ce qui fait qu'un couple avec enfants paie moins qu'une personne seule qui gagne pareil. On y revient plus loin.",
"Retiens dès maintenant une chose essentielle : <strong>l'impôt ne se calcule pas sur ce que tu gagnes, mais sur ce qui reste après plusieurs retraits et divisions.</strong> C'est dans ces étapes que se trouvent les moyens légaux de payer moins. Optimiser ses impôts, ce n'est pas trouver une faille. C'est connaître les étapes du calcul et agir sur celles qui te concernent.",
"Une dernière remarque, valable pour toute la formation. Les taux, seuils et plafonds changent presque chaque année. Les chiffres donnés ici servent à comprendre. <u>Avant toute décision, vérifie le chiffre du moment sur impots.gouv.fr.</u> C'est gratuit et c'est la source officielle."
],
quiz:[
{q:"Que veut dire « impôt par tranches » ?",opts:["Le taux augmente chaque année","Chaque morceau du revenu a son propre taux","L'impôt est prélevé sur 12 mois","Le taux dépend de la région"],correct:1,
explain:"Ton revenu est découpé en tranches, chacune avec son taux. Aucun revenu n'est taxé en entier au taux le plus haut."},
{q:"À quoi servent les 10 % retirés sur les salaires ?",opts:["À récompenser les salariés","À couvrir les frais de travail, de façon forfaitaire","À compenser l'inflation","À financer la retraite"],correct:1,
explain:"C'est une estimation de tes frais pour aller travailler. Tu peux la remplacer par tes frais réels, on le verra plus loin."},
{q:"Pourquoi vérifier les seuils chaque année ?",opts:["Ils changent selon les départements","Ils sont mis à jour chaque année par la loi","Ils dépendent de la banque","Ils varient selon l'âge"],correct:1,
explain:"Les seuils, plafonds et taux changent presque chaque année. Un chiffre retenu il y a 3 ans est sûrement faux aujourd'hui."}
],
action:"Sors ton dernier avis d'impôt et repère 3 lignes : le revenu fiscal de référence, le nombre de parts, et le montant final. Ces 3 chiffres suffisent pour suivre toute la formation. Beaucoup de gens ne les ont jamais regardés."
},
{module:"Module 1 — Comprendre l'impôt avant de l'optimiser", title:"Taux marginal et taux moyen : la confusion qui coûte cher", duration:"5 min",
script:[
"Voici l'erreur la plus courante sur les impôts. Elle pousse des gens à refuser une augmentation, des heures sup ou une promotion. On entend toujours la même phrase : <em>« si je gagne plus, je change de tranche et je perds de l'argent »</em>. C'est faux.",
"Il y a 2 taux différents, et les confondre change tout. <strong>Le taux marginal</strong> s'applique au dernier euro gagné, c'est-à-dire à ta tranche la plus haute. <strong>Le taux moyen</strong>, c'est ton impôt total divisé par ton revenu total. Il est toujours bien plus bas.",
"Un exemple simple. Revenu imposable de 40 000 €, pour 1 part. Les premiers milliers d'euros ne sont pas taxés. La tranche suivante est à 11 %, la suivante à 30 %. Résultat : taux marginal de 30 %, mais taux moyen autour de 13 à 15 %. <strong>Une augmentation de 1 000 € coûte donc 300 € d'impôt et te rapporte 700 €.</strong> Gagner plus ne fait jamais perdre d'argent.",
"Pourquoi cette idée est-elle si tenace ? Parce que certaines aides, elles, fonctionnent par seuil. Certaines aides sociales, exonérations locales ou plafonds peuvent sauter d'un coup quand on dépasse un montant. Ça existe vraiment. Mais ça concerne des aides précises, jamais les tranches de l'impôt sur le revenu.",
"Le taux marginal sert aussi à autre chose, de bien plus intéressant. <strong>Il te dit combien rapporte chaque euro que tu peux déduire.</strong> Avec un taux marginal de 30 %, chaque euro retiré de ton revenu imposable te fait économiser 30 centimes. À 0 % ou 11 %, ce même euro ne rapporte presque rien.",
"Conséquence directe, souvent ignorée : <u>les déductions ne sont intéressantes qu'à partir d'un certain niveau d'impôt.</u> Vendre un plan d'épargne retraite à quelqu'un dont le taux marginal est de 11 %, c'est le vendre à la mauvaise personne. Connaître ton taux marginal, c'est savoir quels conseils écouter et lesquels ignorer."
],
quiz:[
{q:"Que se passe-t-il quand on « change de tranche » ?",opts:["Tout le revenu est taxé au nouveau taux","Seule la partie au-dessus du seuil a le nouveau taux","On perd les tranches d'avant","L'impôt double"],correct:1,
explain:"Seuls les euros au-dessus du seuil sont plus taxés. Gagner plus rapporte toujours plus."},
{q:"À quoi sert de connaître son taux marginal ?",opts:["À calculer son salaire net","À savoir combien rapporte chaque euro déduit","À négocier avec les impôts","À connaître sa date de déclaration"],correct:1,
explain:"Un euro déduit rapporte exactement le taux marginal. À 30 %, il fait économiser 30 centimes. À 11 %, seulement 11."},
{q:"À qui une déduction profite-t-elle le plus ?",opts:["À tout le monde pareil","À ceux qui ont un taux marginal élevé","À ceux qui ne paient pas d'impôt","Aux jeunes actifs"],correct:1,
explain:"C'est pour ça qu'on vend parfois ces produits à des gens qui n'en tireront presque rien."}
],
action:"Trouve ton taux marginal sur ton avis d'impôt, ou calcule-le avec le simulateur officiel d'impots.gouv.fr. Note-le quelque part. C'est la clé de toute la suite. Et c'est la première question à poser à quiconque te propose un placement « pour payer moins d'impôts »."
},
{module:"Module 1 — Comprendre l'impôt avant de l'optimiser", title:"Les parts fiscales, et pourquoi elles changent tout", duration:"5 min",
script:[
"Le quotient familial adapte l'impôt à la taille de ton foyer. C'est une particularité française, et l'un des moyens les plus puissants de payer moins. Il agit au moment de la division, donc avant l'application des tranches.",
"Le principe : chaque foyer a un nombre de parts. Une personne seule : 1 part. Un couple marié ou pacsé : 2 parts. Les 2 premiers enfants ajoutent chacun une demi-part. À partir du troisième, chaque enfant ajoute une part entière. Il existe des demi-parts en plus dans certains cas, par exemple pour les parents seuls ou certaines personnes en situation de handicap.",
"L'effet est automatique. Ton revenu est divisé par ton nombre de parts. Les tranches s'appliquent à ce montant plus petit. Puis on multiplie à nouveau. Comme l'impôt monte par tranches, diviser avant de taxer fait baisser le taux. <strong>Plus ton foyer a de parts, plus l'effet des tranches est adouci.</strong>",
"Cet avantage a toutefois une limite. Chaque demi-part en plus ne peut pas faire baisser l'impôt au-delà d'un certain montant, revu chaque année. Résultat : au-delà d'un certain revenu, un enfant de plus ne fait plus économiser autant qu'on pourrait le croire.",
"Une question revient souvent chez les couples : <em>faut-il se marier ou se pacser pour payer moins d'impôts ?</em> Honnêtement, ça dépend. <strong>Déclarer ensemble est avantageux quand les 2 revenus sont très différents</strong> : la division gomme l'écart. Quand les revenus sont proches, ça ne change presque rien, et c'est parfois un peu moins bien. Ce n'est donc jamais une raison suffisante pour se marier. Mais c'est bon à savoir.",
"Dernier point, source d'erreurs coûteuses : les enfants majeurs. Un jeune de moins de 21 ans, ou de moins de 25 ans s'il fait des études, peut rester rattaché à ton foyer. Tu gardes alors sa part. Il peut aussi déclarer seul : il gagne certains droits, mais ton foyer perd la part. <u>Le bon choix se calcule, il ne se devine pas.</u> Le simulateur officiel compare les 2 options en quelques minutes."
],
quiz:[
{q:"Combien de parts ajoute un troisième enfant ?",opts:["Une demi-part","Une part entière","Un quart de part","Aucune"],correct:1,
explain:"Les 2 premiers enfants ajoutent une demi-part chacun. Ensuite, chaque enfant ajoute une part entière."},
{q:"Quand déclarer en couple est-il le plus avantageux ?",opts:["Quand les 2 revenus sont proches","Quand les 2 revenus sont très différents","Quand aucun ne paie d'impôt","C'est toujours pareil"],correct:1,
explain:"Diviser le revenu total par 2 parts gomme l'écart et fait baisser le taux. À revenus proches, l'effet est faible."},
{q:"Que se passe-t-il si un enfant majeur déclare seul ?",opts:["Le foyer garde la part","Le foyer perd la part de cet enfant","Le foyer ne paie plus d'impôt","Rien ne change"],correct:1,
explain:"Le foyer perd la part, mais l'enfant peut gagner d'autres droits. Ça se calcule dans les 2 sens."}
],
action:"Regarde sur ton avis d'impôt le nombre de parts retenu. Compare-le à ta situation familiale aujourd'hui. Naissance, séparation, enfant devenu étudiant : ces changements ne sont pas pris en compte tout seuls. Il faut les signaler."
},
{module:"Module 1 — Comprendre l'impôt avant de l'optimiser", title:"Le prélèvement à la source et le solde de l'année", duration:"5 min",
script:[
"Depuis 2019, l'impôt est prélevé directement sur ton salaire ou ta pension. Beaucoup de gens en ont conclu qu'ils n'avaient plus rien à faire. C'est une erreur, et elle crée chaque année de mauvaises surprises.",
"Voici comment ça marche. Les impôts calculent <strong>un taux à partir de ta dernière déclaration</strong>, donc à partir de tes revenus de l'année d'avant. Ce taux est envoyé à ton employeur, qui le prélève chaque mois. Après ta déclaration suivante, l'impôt réel est calculé. Si tu as trop payé, on te rembourse. Sinon, tu paies la différence.",
"Le point important : <strong>le prélèvement à la source est une avance, pas le compte final.</strong> Si tes revenus ont augmenté pendant l'année, ton taux était trop bas : tu devras compléter. S'ils ont baissé, tu as trop payé : tu seras remboursé.",
"Tu peux changer ce taux à tout moment dans ton espace sur impots.gouv.fr. 2 cas le justifient vraiment. <strong>Tes revenus augmentent pour de bon</strong> : mettre ton taux à jour t'évite un gros rattrapage. <strong>Tes revenus baissent fortement</strong> (perte d'emploi, temps partiel, retraite) : baisser ton taux te rend de l'argent tout de suite, au lieu d'attendre un an.",
"Les couples ont un choix à faire : le <strong>taux individualisé</strong>. Par défaut, un couple a un seul taux, calculé sur les revenus communs. Si l'un gagne beaucoup plus que l'autre, le même pourcentage s'applique aux 2 salaires. Ça pèse plus lourd sur le petit salaire. Le taux individualisé répartit le prélèvement selon le revenu de chacun. <u>L'impôt total du foyer ne change pas du tout.</u> Seule la répartition change. C'est souvent plus une question d'équité dans le couple que d'impôts.",
"Il existe aussi le taux neutre. Il évite que ton employeur ait des infos sur les autres revenus de ton foyer. Il est en général plus élevé, et la différence est réglée ensuite. C'est un choix de discrétion, rarement un moyen de payer moins."
],
quiz:[
{q:"Sur quoi se base le taux du prélèvement à la source ?",opts:["Sur les revenus du mois","Sur ta dernière déclaration, donc tes revenus passés","Sur une moyenne nationale","Sur une estimation de l'employeur"],correct:1,
explain:"C'est pour ça qu'une hausse de revenus dans l'année crée un complément à payer l'année suivante."},
{q:"Que change le taux individualisé dans un couple ?",opts:["Il baisse l'impôt du foyer","Il répartit le prélèvement selon le revenu de chacun, sans changer le total","Il supprime la déclaration commune","Il augmente l'impôt du plus gros salaire"],correct:1,
explain:"L'impôt du foyer est le même. Seule la répartition change, souvent une question d'équité dans le couple."},
{q:"Quand demander à baisser son taux ?",opts:["Chaque année, par principe","Quand ses revenus baissent fortement et durablement","Quand on change de banque","Jamais, c'est automatique"],correct:1,
explain:"Perte d'emploi, temps partiel ou retraite : baisser ton taux te rend de l'argent tout de suite."}
],
action:"Connecte-toi à ton espace sur impots.gouv.fr et regarde ton taux actuel. Compare-le à ta situation. Si tes revenus ont changé de plus de 10 % depuis ta dernière déclaration, le modifier prend 5 minutes et t'évite une mauvaise surprise."
},
{module:"Module 2 — Réduire l'impôt sans rien acheter", title:"Déduction, réduction, crédit : 3 mots très différents", duration:"5 min",
script:[
"Ces 3 mots sont souvent utilisés comme s'ils voulaient dire la même chose, même par des vendeurs. Ce sont pourtant 3 mécanismes différents. Selon ta situation, l'effet peut aller du simple au triple. Les distinguer te permettra de juger seul n'importe quelle offre.",
"<strong>La déduction</strong> retire un montant de ton revenu imposable, <em>avant</em> le calcul de l'impôt. Ce qu'elle rapporte dépend donc de ton taux marginal. Déduire 1 000 € rapporte 300 € à quelqu'un à 30 %, et seulement 110 € à quelqu'un à 11 %.",
"<strong>La réduction d'impôt</strong> se retire de l'impôt lui-même, <em>après</em> le calcul. Elle vaut donc la même chose pour tout le monde. Mais attention : <u>si tu ne paies pas d'impôt, une réduction ne te rapporte rien.</u> Elle ne peut pas te faire rembourser.",
"<figure class=\"schema\"><svg viewBox=\"0 0 700 228\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"200\" y=\"20\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" letter-spacing=\"1.4\" fill=\"#2B3A8F\">DÉDUCTION</text><text x=\"560\" y=\"20\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" letter-spacing=\"1.4\" fill=\"#C27C00\">CRÉDIT D'IMPÔT</text><text x=\"20\" y=\"44\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">Contribuable à 30 % de taux marginal</text><rect x=\"20\" y=\"54\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#F0F1F7\"/><rect x=\"20\" y=\"54\" width=\"436\" height=\"18\" rx=\"5\" fill=\"#E9EBF7\"/><rect x=\"456\" y=\"54\" width=\"224\" height=\"18\" rx=\"5\" fill=\"#FDF2DA\"/><text x=\"28\" y=\"67\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#2B3A8F\">300 € pour 1 000 € déduits</text><text x=\"672\" y=\"67\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8F5F00\"></text><text x=\"20\" y=\"100\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">Contribuable à 11 %</text><rect x=\"20\" y=\"110\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#F0F1F7\"/><rect x=\"20\" y=\"110\" width=\"185\" height=\"18\" rx=\"5\" fill=\"#E9EBF7\"/><rect x=\"205\" y=\"110\" width=\"475\" height=\"18\" rx=\"5\" fill=\"#FDF2DA\"/><text x=\"28\" y=\"123\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#2B3A8F\">110 € pour 1 000 € déduits</text><text x=\"672\" y=\"123\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8F5F00\"></text><text x=\"20\" y=\"156\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">Foyer non imposable</text><rect x=\"20\" y=\"166\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#F0F1F7\"/><rect x=\"20\" y=\"166\" width=\"26\" height=\"18\" rx=\"5\" fill=\"#E9EBF7\"/><rect x=\"46\" y=\"166\" width=\"634\" height=\"18\" rx=\"5\" fill=\"#FDF2DA\"/><text x=\"28\" y=\"179\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#2B3A8F\"></text><text x=\"672\" y=\"179\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8F5F00\">remboursé intégralement</text></svg><figcaption>La déduction vaut le taux marginal. Le crédit d'impôt vaut la même chose pour tous, et il est remboursé.</figcaption></figure>",
"<strong>Le crédit d'impôt</strong> marche comme la réduction, avec une grosse différence : <u>s'il dépasse ton impôt, on te rembourse le surplus.</u> C'est le seul des 3 qui profite aussi aux foyers qui ne paient pas d'impôt.",
"Ça a une conséquence très concrète. Pour un foyer qui paie peu d'impôt, seuls les crédits d'impôt sont vraiment utiles. Les produits basés sur une déduction ne servent à rien. Pour un foyer qui paie beaucoup d'impôt, c'est l'inverse : la déduction devient le levier le plus puissant, car elle suit le taux marginal.",
"Un avertissement pour toute la suite. La plupart des réductions et crédits d'impôt sont limités ensemble à <strong>10 000 € par an</strong> (le « plafonnement des niches fiscales »). Ce plafond empêche de tout cumuler. Quand on te vend un produit en promettant une économie, demande d'abord s'il entre dans ce plafond, et si tu n'en utilises pas déjà une partie ailleurs.",
"Retiens la règle : <strong>n'achète jamais un produit seulement pour payer moins d'impôts.</strong> Un mauvais placement reste un mauvais placement, même avec un avantage fiscal. Et l'économie d'impôt ne compensera jamais une perte d'argent."
],
quiz:[
{q:"Quelle grande différence entre réduction et crédit d'impôt ?",opts:["Aucune, c'est pareil","Le crédit est remboursé s'il dépasse l'impôt, pas la réduction","La réduction est pour les entreprises","Le crédit ne concerne que l'immobilier"],correct:1,
explain:"C'est pour ça que le crédit d'impôt est utile même si on ne paie pas d'impôt. Pas la réduction."},
{q:"De quoi dépend ce que rapporte une déduction ?",opts:["Seulement du montant investi","Du taux marginal","De l'âge","De la durée du placement"],correct:1,
explain:"Déduire 1 000 € rapporte 300 € à 30 %, et 110 € à 11 %. Le même produit ne vaut pas la même chose pour tout le monde."},
{q:"À quoi sert le plafonnement des niches fiscales ?",opts:["À empêcher de cumuler les avantages, en général au-delà de 10 000 € par an","À limiter le nombre de déclarations","À plafonner le revenu imposable","À interdire l'immobilier"],correct:0,
explain:"Un produit présenté comme avantageux peut ne rien rapporter si tu as déjà atteint le plafond ailleurs."}
],
action:"Reprends la dernière offre « pour payer moins d'impôts » qu'on t'a faite, ou cherches-en une en ligne. Est-ce une déduction, une réduction ou un crédit ? Calcule ce qu'elle te rapporte avec ton taux marginal. Beaucoup d'offres ne résistent pas à ce calcul."
},
{module:"Module 2 — Réduire l'impôt sans rien acheter", title:"Frais réels ou abattement de 10 % : comment choisir", duration:"5 min",
script:[
"Chaque salarié a droit automatiquement à 10 % retirés de ses salaires, pour couvrir ses frais de travail. Cet abattement est plafonné, et appliqué sans rien faire. Mais tu peux y renoncer et déclarer tes frais réels. Dans certains cas, c'est intéressant.",
"Le calcul est simple : si tes vrais frais de travail dépassent 10 % de ton salaire net imposable, les frais réels te font gagner de l'argent. Sur un salaire de 30 000 €, les 10 % font 3 000 €. <strong>Il faut donc plus de 3 000 € de frais réels pour que ce soit rentable.</strong>",
"Quels frais compter ? Surtout les trajets entre ton domicile et ton travail. On les calcule avec le barème kilométrique publié chaque année par les impôts, selon la puissance de ta voiture et la distance. Tu peux ajouter les repas pris dehors pour le travail, les formations que tu paies toi-même, le matériel pour ton travail, et parfois les frais de double logement.",
"Le cas typique où ça vaut le coup : <strong>un long trajet en voiture chaque jour.</strong> 40 km aller-retour, sur environ 220 jours de travail, ça fait près de 9 000 km par an. Pour un salaire modeste, ça dépasse largement les 10 %.",
"2 pièges à éviter. Premier piège : <u>c'est l'un ou l'autre, tu ne peux pas cumuler les 10 % et les frais réels.</u> Second piège : si tu choisis les frais réels, tu dois ajouter à tes revenus les remboursements de frais versés par ton employeur. Ça réduit parfois beaucoup l'intérêt.",
"Une règle de prudence : <strong>avec les frais réels, tu dois pouvoir justifier chaque montant.</strong> Garde tes justificatifs au moins 3 ans : c'est le temps pendant lequel les impôts peuvent te poser des questions. Un tableau simple, rempli chaque mois, suffit. Tu évites de tout reconstituer au moment de déclarer."
],
quiz:[
{q:"Quand les frais réels deviennent-ils intéressants ?",opts:["Toujours","Quand ils dépassent 10 % du salaire net imposable","Seulement pour les cadres","Quand on travaille à la maison"],correct:1,
explain:"Les 10 % automatiques, il faut les dépasser en frais justifiés pour que ça rapporte."},
{q:"Quel est le cas le plus courant où les frais réels gagnent ?",opts:["Un abonnement de transport en commun","Un long trajet en voiture chaque jour","L'achat d'un ordinateur","Le télétravail"],correct:1,
explain:"Le barème kilométrique sur une longue distance quotidienne dépasse vite les 10 %."},
{q:"Que faire si l'employeur rembourse déjà certains frais ?",opts:["Rien de spécial","Ajouter ces remboursements à ses revenus imposables","Les déduire une 2e fois","Renoncer aux frais réels"],correct:1,
explain:"C'est le piège classique : ces remboursements s'ajoutent aux revenus, ce qui peut annuler l'intérêt."}
],
action:"Ce soir, calcule 10 % de ton salaire net imposable de l'année. Puis estime tes frais de trajet avec le barème kilométrique officiel. Si le second chiffre dépasse le premier, tu as sans doute payé trop d'impôt ces dernières années. Et tu peux encore corriger."
},
{module:"Module 2 — Réduire l'impôt sans rien acheter", title:"Les charges déductibles que presque personne ne déclare", duration:"5 min",
script:[
"Certaines sommes se retirent directement de ton revenu imposable, sans rien acheter. Ce sont des dépenses que tu fais déjà. Beaucoup de gens oublient de les déclarer, simplement parce qu'ils ne savent pas qu'elles comptent.",
"<strong>La pension alimentaire versée à un enfant.</strong> Si tu verses une pension à un enfant mineur dont tu n'as pas la garde, sur décision de justice, tu peux la déduire. Pour un enfant majeur qui n'est pas rattaché à ton foyer, tu peux aussi déduire ce que tu verses, jusqu'à un plafond revu chaque année. Même sans décision de justice, si tu peux prouver ton aide.",
"<strong>L'aide à un parent dans le besoin.</strong> Peu de gens le savent : l'aide versée à un parent ou grand-parent qui n'a pas assez de ressources se déduit. Si tu l'héberges chez toi, tu peux déduire un forfait sans justificatif de dépense. C'est très simple.",
"<strong>Les dons aux associations.</strong> Ils te donnent droit à une réduction d'impôt, en général de 66 % du don, dans la limite de 20 % de ton revenu imposable. Certaines associations d'aide aux personnes en difficulté donnent droit à 75 %, avec une limite à part. C'est le moyen le plus simple et le plus efficace : <u>un don de 100 € te coûte en réalité 34 €.</u>",
"<strong>Les versements sur un plan d'épargne retraite (PER)</strong>, déductibles jusqu'à un plafond indiqué sur ton avis d'impôt. On y consacre une leçon entière, car c'est aussi le produit le plus mal vendu.",
"Un point sur les années passées, et il peut rapporter. <strong>Si tu as oublié de déclarer une charge, tu peux corriger.</strong> La correction en ligne ouvre quelques semaines après la fin des déclarations. Après, tu peux encore faire une réclamation jusqu'au 31 décembre de la deuxième année qui suit l'avis d'impôt. Beaucoup de gens ignorent qu'ils peuvent récupérer un trop-payé sur 2 ans.",
"Attention à un réflexe courant : chercher des déductions avant de connaître son taux marginal. À 0 % ou 11 %, rassembler tous les justificatifs rapporte peu. Les crédits d'impôt, eux, restent utiles quel que soit ton niveau d'impôt."
],
quiz:[
{q:"Que coûte vraiment un don de 100 € avec 66 % de réduction ?",opts:["100 €","66 €","34 €","0 €"],correct:2,
explain:"La réduction te rend 66 €. Le don te coûte donc 34 €. C'est un des moyens les plus simples et efficaces."},
{q:"L'aide à un parent sans ressources se déduit-elle ?",opts:["Non, jamais","Oui, avec un forfait si tu l'héberges","Seulement avec une décision de justice","Seulement après 75 ans"],correct:1,
explain:"C'est une des déductions les plus méconnues. Héberger un parent donne droit à un forfait sans justificatif."},
{q:"Peut-on corriger une déclaration passée ?",opts:["Non, jamais","Oui, en ligne, puis par réclamation pendant 2 ans","Seulement si les impôts se sont trompés","Seulement dans les 15 jours"],correct:1,
explain:"Beaucoup de gens ignorent qu'ils peuvent récupérer un trop-payé sur les années d'avant."}
],
action:"Passe en revue ces 4 points pour ta situation : pension alimentaire, aide à un parent, dons, épargne retraite. Si tu as versé une somme sans jamais la déclarer, note-la. Tu peux peut-être encore la récupérer sur les 2 dernières années."
},
{module:"Module 2 — Réduire l'impôt sans rien acheter", title:"Les crédits d'impôt du quotidien", duration:"5 min",
script:[
"Les crédits d'impôt sont les seuls avantages qui profitent à tout le monde, même aux foyers qui ne paient pas d'impôt, puisque le surplus est remboursé. Ils concernent des dépenses de tous les jours. Et ceux qui y ont droit les oublient souvent.",
"<strong>Le crédit d'impôt pour l'emploi à domicile</strong> est le plus important. Il rembourse 50 % de ce que tu paies pour un service chez toi : ménage, jardinage, soutien scolaire, garde d'enfants, aide aux personnes âgées. Le plafond est de 12 000 € de dépenses par an, plus selon ton foyer. Soit jusqu'à 6 000 € de crédit dans le cas courant. Certains services ont des plafonds plus bas, comme le jardinage ou le dépannage informatique.",
"Avec l'avance immédiate, tu peux maintenant souvent ne payer que la moitié au moment du service, au lieu d'attendre d'être remboursé l'année suivante. <u>C'est un vrai gain pour ton budget du mois</u>, et encore peu de gens l'utilisent.",
"<strong>La garde des enfants de moins de 6 ans hors de chez toi</strong>, en crèche ou chez une assistante maternelle, donne droit à 50 % de crédit d'impôt, avec un plafond par enfant. Ce crédit est différent du précédent, et les 2 se cumulent.",
"<strong>Les travaux de rénovation énergétique</strong> passent aujourd'hui surtout par des aides directes, plutôt que par des crédits d'impôt. Il y a des conditions de revenus et l'entreprise doit être qualifiée. Les règles ont beaucoup changé ces dernières années. Vérifie ce qui s'applique au moment de ton projet, sans te fier à ce que tu as entendu il y a 2 ans.",
"Un point de méthode. Ces crédits demandent presque toujours un paiement qui laisse une trace, et une attestation. <strong>Si tu paies en espèces, tu perds le crédit</strong>, même si le service a bien eu lieu. Le bon réflexe : dès qu'une dépense semble concernée, garde la facture et paie par carte, virement ou chèque."
],
quiz:[
{q:"Combien rembourse le crédit d'impôt pour l'emploi à domicile ?",opts:["25 %","50 %","66 %","75 %"],correct:1,
explain:"La moitié de ce que tu paies, jusqu'à 12 000 € de dépenses, plus selon ton foyer."},
{q:"Pourquoi un crédit d'impôt vaut-il mieux qu'une réduction pour un foyer modeste ?",opts:["Son taux est plus élevé","Le surplus est remboursé même sans impôt à payer","Il est automatique","Il n'a pas de plafond"],correct:1,
explain:"C'est la grande différence : une réduction ne rapporte rien si on ne paie pas d'impôt. Un crédit, si."},
{q:"Que se passe-t-il si on paie un service en espèces ?",opts:["Rien, le crédit s'applique","On perd le crédit d'impôt","Le crédit est divisé par 2","Il faut déclarer 2 fois"],correct:1,
explain:"Il faut un paiement qui laisse une trace, et une attestation. C'est une cause fréquente de perte du crédit."}
],
action:"Liste les services que tu paies déjà chez toi ou pour faire garder tes enfants. Puis vérifie si tu as l'avance immédiate. Si tu y as droit et que tu ne l'as pas, l'activer divise par 2 ce que tu avances chaque mois."
},
{module:"Module 3 — La fiscalité de tes placements", title:"Le prélèvement forfaitaire unique, le tronc commun", duration:"5 min",
script:[
"Depuis 2018, la plupart des revenus de l'épargne sont taxés par défaut à <strong>30 %</strong>. On l'appelle prélèvement forfaitaire unique, ou <em>flat tax</em>. Comprendre comment il se décompose, et son alternative, aide à lire tous les placements de cette formation.",
"Ces 30 % se divisent en 2 : <strong>12,8 % d'impôt sur le revenu</strong> et <strong>17,2 % de prélèvements sociaux</strong>. Ce détail compte. Certaines enveloppes permettent d'éviter la première partie. Aucune ne permet d'éviter la seconde.",
"Les 30 % s'appliquent aux intérêts des comptes à terme, aux dividendes, aux gains sur la vente d'actions, et aux gains sur les cryptos. Ils ne s'appliquent pas aux livrets réglementés, qui sont exonérés. Ni aux loyers d'une location vide, qui suivent les tranches de l'impôt.",
"Il existe une alternative importante : <strong>choisir d'être taxé selon les tranches</strong>. Ça se coche dans la déclaration, et ça s'applique à tous tes revenus de l'épargne de l'année. C'est intéressant quand ton taux marginal est bas. <u>À 0 % ou 11 % de taux marginal, les tranches sont presque toujours plus avantageuses que 12,8 %.</u> En plus, tu as droit à 40 % d'abattement sur les dividendes, et à une partie de la CSG déductible.",
"Le piège : <strong>ce choix vaut pour tout, et pour toute l'année.</strong> Tu ne peux pas choisir les tranches pour tes dividendes et les 30 % pour tes ventes d'actions. Le simulateur officiel compare les 2 avant de cocher. Fais-le chaque année, car tes revenus changent.",
"Un dernier point mal compris. Sur les dividendes, 12,8 % sont prélevés dès le versement, comme une avance. Si ton revenu fiscal de référence est sous un certain seuil, tu peux demander à <strong>ne pas payer cette avance</strong>. La demande se fait auprès de ta banque ou de ton courtier <u>avant le 30 novembre de l'année d'avant</u>. C'est gratuit, ça se fait une fois, et tu évites d'avancer un impôt qui te serait remboursé un an plus tard."
],
quiz:[

},
{module:"Module 3 — La fiscalité de tes placements", title:"Le PEA, le cadre le plus léger après 5 ans", duration:"5 min",
script:[
"Le PEA est l'enveloppe la plus avantageuse pour investir en actions européennes. Sa règle principale tient en une phrase. Le reste en découle.",
"<strong>Après 5 ans, tes gains ne paient plus que les 17,2 % de prélèvements sociaux.</strong> L'impôt sur le revenu disparaît. Par rapport aux 30 % de la flat tax, tu économises 12,8 points sur tous tes gains. Sur une longue durée, c'est énorme.",
"Le point le plus important, et le moins connu : <u>les 5 ans comptent à partir de l'ouverture du PEA, pas du premier gros versement.</u> Ouvrir un PEA aujourd'hui avec 50 € lance le compteur. Dans 5 ans, tu auras une enveloppe prête, que tu pourras remplir librement. <strong>C'est sans doute la décision la plus rentable par minute de toute cette formation.</strong>",
"<figure class=\"schema\"><svg viewBox=\"0 0 700 168\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><line x1=\"34\" y1=\"96\" x2=\"666\" y2=\"96\" stroke=\"#DCDEEA\" stroke-width=\"2\"/><path d=\"M666 96 l-9 -5 v10 z\" fill=\"#DCDEEA\"/><line x1=\"53\" y1=\"96\" x2=\"53\" y2=\"62\" stroke=\"#2B3A8F\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/><circle cx=\"53\" cy=\"96\" r=\"7\" fill=\"#2B3A8F\"/><circle cx=\"53\" cy=\"96\" r=\"12\" fill=\"none\" stroke=\"#2B3A8F\" stroke-width=\"1\" opacity=\".35\"/><text x=\"53\" y=\"52\" text-anchor=\"start\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14\" font-weight=\"600\" fill=\"#171C45\">Ouverture</text><text x=\"53\" y=\"122\" text-anchor=\"start\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12\" fill=\"#44496B\">Le compteur démarre</text><line x1=\"350\" y1=\"96\" x2=\"350\" y2=\"62\" stroke=\"#C27C00\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/><circle cx=\"350\" cy=\"96\" r=\"7\" fill=\"#C27C00\"/><circle cx=\"350\" cy=\"96\" r=\"12\" fill=\"none\" stroke=\"#C27C00\" stroke-width=\"1\" opacity=\".35\"/><text x=\"350\" y=\"52\" text-anchor=\"middle\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14\" font-weight=\"600\" fill=\"#171C45\">5 ans</text><text x=\"350\" y=\"122\" text-anchor=\"middle\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12\" fill=\"#44496B\">PEA : plus que 17,2 % de prélèvements sociaux</text><line x1=\"641\" y1=\"96\" x2=\"641\" y2=\"62\" stroke=\"#C27C00\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/><circle cx=\"641\" cy=\"96\" r=\"7\" fill=\"#C27C00\"/><circle cx=\"641\" cy=\"96\" r=\"12\" fill=\"none\" stroke=\"#C27C00\" stroke-width=\"1\" opacity=\".35\"/><text x=\"641\" y=\"52\" text-anchor=\"end\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14\" font-weight=\"600\" fill=\"#171C45\">8 ans</text><text x=\"641\" y=\"122\" text-anchor=\"end\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12\" fill=\"#44496B\">Assurance-vie : abattement de 4 600 €</text></svg><figcaption>Les 2 enveloppes récompensent la durée, et le compteur part de l'ouverture, pas du premier versement.</figcaption></figure>",
"Maintenant les contraintes, car elles existent. Le PEA est limité à <strong>150 000 €</strong> de versements. Peu de gens atteignent ce plafond. Il ne peut contenir que des actions européennes ou des fonds autorisés. Ça semble exclure les États-Unis ou le monde entier. Mais certains fonds indiciels autorisés copient des indices mondiaux, ce qui règle en grande partie le problème.",
"La contrainte la plus lourde, ce sont les retraits. <strong>Avant 5 ans, tout retrait ferme le PEA</strong>, et tes gains sont taxés à 30 %. Après 5 ans, tu peux retirer une partie librement et continuer à verser. C'est pour ça qu'un PEA ne doit jamais contenir l'argent dont tu pourrais avoir besoin bientôt.",
"Il existe une variante, le <strong>PEA-PME</strong>, pour les petites et moyennes entreprises. Son plafond s'ajoute à celui du PEA classique, jusqu'à <strong>225 000 €</strong> au total. Ces entreprises sont plus petites, donc plus risquées. Il s'adresse à des investisseurs expérimentés.",
"Un mot sur la sortie. Si tu fermes ton PEA après 5 ans, tu peux récupérer ton argent, ou choisir une rente à vie qui a ses propres règles. Récupérer l'argent reste le plus simple et le plus souple dans presque tous les cas."
],

explain:"L'impôt sur le revenu disparaît, les prélèvements sociaux restent. Tu économises 12,8 points par rapport à la flat tax."},
{q:"À partir de quand comptent les 5 ans ?",opts:["Du premier gros versement","De l'ouverture du PEA","Du premier achat d'actions","Du premier retrait"],correct:1,

{q:"Que se passe-t-il si on retire avant 5 ans ?",opts:["Une pénalité de 10 %","Le PEA est fermé et les gains taxés","Rien de spécial","L'argent est bloqué 6 mois"],correct:1,
explain:"C'est pour ça qu'un PEA ne doit jamais contenir l'argent dont on peut avoir besoin bientôt."}
],
action:"Si tu n'as pas de PEA et que tu penses investir un jour, même dans 5 ans, ouvre-le maintenant avec le minimum demandé. Ça prend une vingtaine de minutes en ligne. Et ça lance un compteur que rien d'autre ne peut rattraper."
},
{module:"Module 3 — La fiscalité de tes placements", title:"L'assurance-vie : les 8 ans et l'abattement", duration:"5 min",
script:[
"L'assurance-vie est l'enveloppe la plus répandue en France. C'est aussi la plus mal comprise. Ce n'est ni un placement, ni une assurance décès au sens habituel. C'est une boîte avec ses propres règles d'impôts, qui peut contenir des placements très différents.",
"Sa règle principale dépend de la durée. <strong>Après 8 ans</strong>, les gains que tu retires ont droit à un abattement de <strong>4 600 € par an</strong> pour une personne seule, et <strong>9 200 €</strong> pour un couple qui déclare ensemble. Au-delà, les gains sont taxés à <strong>7,5 %</strong> (pour la part liée à moins de 150 000 € de versements), plus les 17,2 % de prélèvements sociaux.",
"Avant 8 ans, c'est la flat tax de 30 % qui s'applique. Comme pour le PEA, <u>le compteur démarre à l'ouverture du contrat.</u> Ça vaut donc vraiment le coup d'ouvrir tôt, avec une petite somme.",
"Un point que presque personne ne comprend bien : <strong>on ne paie d'impôt que sur la part de gains contenue dans le retrait, jamais sur l'argent versé.</strong> Exemple : ton contrat vaut 20 000 €, dont 4 000 € de gains (20 %). Tu retires 5 000 €. Ce retrait contient 20 % de gains, soit 1 000 €. Seuls ces 1 000 € comptent. Et l'abattement de 4 600 € les couvre entièrement. Concrètement, <strong>beaucoup de retraits après 8 ans ne paient aucun impôt sur le revenu</strong>, seulement les prélèvements sociaux.",
"Deuxième point, souvent la vraie raison d'avoir ce contrat : <strong>transmettre à ses proches</strong>. Les sommes versées avant 70 ans ont droit à un abattement par bénéficiaire, bien plus élevé que pour un héritage classique. Elles échappent en grande partie aux droits de succession. C'est pour ça qu'il faut relire la clause bénéficiaire après chaque changement familial.",
"Enfin, les frais. C'est le vrai sujet, et on en parle peu. Un contrat en agence peut prendre plusieurs pourcents à chaque versement, et près de 1 % par an. Un contrat en ligne prend souvent 0 % à l'entrée et environ 0,5 % par an. <u>Sur 20 ans, 1 % de frais en plus par an réduit le résultat d'environ 12 %, presque un quart des gains.</u> L'avantage fiscal ne rattrape jamais un mauvais contrat. Regarde les frais avant les impôts."
],
quiz:[
{q:"Après 8 ans, quel abattement par an pour une personne seule ?",opts:["1 000 €","4 600 €","9 200 €","150 000 €"],correct:1,
explain:"9 200 € pour un couple qui déclare ensemble. Beaucoup de retraits ne paient donc pas d'impôt sur le revenu."},
{q:"Sur quoi paie-t-on l'impôt lors d'un retrait ?",opts:["Sur tout le montant retiré","Seulement sur la part de gains dans le retrait","Seulement sur l'argent versé","Sur tous les gains du contrat"],correct:1,
explain:"Un retrait contient de l'argent versé et des gains, dans les mêmes proportions que le contrat. Seuls les gains sont taxés."},
{q:"Que regarder avant les impôts dans un contrat ?",opts:["La réputation de l'assureur","Les frais sur versement et les frais par an","Le nombre de placements proposés","La durée minimum"],correct:1,
explain:"Sur 20 ans, 1 % de frais en plus par an coûte environ 12 % du résultat. Aucun avantage fiscal ne compense ça."}
],
action:"Si tu as une assurance-vie, cherche 2 chiffres dans ton contrat : les frais sur versement, et les frais de gestion par an sur les unités de compte. S'ils dépassent nettement 0 % et 0,7 %, ouvre un second contrat ailleurs pour tes prochains versements. Et garde l'ancien pour qu'il prenne de l'ancienneté."
},
{module:"Module 3 — La fiscalité de tes placements", title:"Le plan d'épargne retraite : l'avantage à l'entrée, l'impôt à la sortie", duration:"5 min",
script:[
"Le PER (plan d'épargne retraite) est le produit le plus vendu en fin d'année. Souvent aux mauvaises personnes. Son principe est simple, mais il cache un décalage dans le temps que beaucoup de vendeurs oublient de mentionner.",
"Le principe : <strong>ce que tu verses est retiré de ton revenu imposable</strong>, jusqu'à un plafond écrit sur ton avis d'impôt. Verser 3 000 € baisse ton revenu imposable de 3 000 €. Avec un taux marginal de 30 %, tu économises tout de suite 900 €.",
"Voici ce qu'on oublie de dire : <strong>ce n'est pas un cadeau, c'est un report.</strong> À la retraite, quand tu retires l'argent, tu paies l'impôt. La part qui vient de tes versements est taxée selon les tranches. La part qui vient des gains est taxée à 30 %.",
"C'est donc gagnant à une seule condition : <u>que ton taux marginal à la retraite soit plus bas qu'aujourd'hui.</u> C'est souvent le cas, car les revenus baissent en général à la retraite. Mais pas toujours. <strong>Si tu es à 11 % aujourd'hui, ça n'a aucun intérêt</strong>, et ça peut même te coûter. C'est pourtant à ces personnes qu'on le propose souvent.",
"La seconde contrainte est encore plus lourde : <strong>l'argent est bloqué jusqu'à la retraite.</strong> Il y a des exceptions : achat de ta résidence principale, invalidité, décès du conjoint, surendettement, fin des droits au chômage. Sinon, impossible d'y toucher, parfois pendant 30 ans.",
"2 règles pratiques. D'abord, <strong>ne verse jamais sur un PER avant d'avoir une épargne de secours complète.</strong> Bloquer de l'argent sans réserve, c'est le meilleur moyen de devoir emprunter au premier imprévu. Ensuite, la déduction ne vaut le coup qu'à partir de 30 % de taux marginal. En dessous, une assurance-vie ou un PEA font mieux le même travail.",
"Une astuce peu connue : <u>les plafonds non utilisés des 3 années précédentes restent disponibles</u>, et tu peux utiliser ceux de ton conjoint. Une année exceptionnelle (grosse prime, revenu inhabituel), c'est là que le PER prend vraiment son sens."
],
quiz:[
{q:"L'avantage fiscal du PER est-il définitif ?",opts:["Oui, l'impôt est effacé","Non, c'est un report : on paie à la sortie","Oui, sauf en cas de retrait anticipé","Ça dépend de l'assureur"],correct:1,
explain:"Ce que tu gagnes à l'entrée, tu le paies à la sortie. C'est gagnant seulement si ton taux marginal a baissé entre-temps."},
{q:"À partir de quel taux marginal le PER devient-il vraiment intéressant ?",opts:["Dès le premier euro d'impôt","À partir de 30 %","Seulement à 45 %","Pour tout le monde"],correct:1,
explain:"En dessous, une assurance-vie ou un PEA font mieux le même travail, sans bloquer l'argent."},
{q:"Que deviennent les plafonds non utilisés ?",opts:["Ils sont perdus chaque année","Ils restent utilisables 3 ans et se partagent entre conjoints","Ils deviennent un crédit d'impôt","Il faut les déclarer à part"],correct:1,
explain:"C'est ce qui rend le PER utile une année exceptionnelle : grosse prime ou revenu inhabituel."}
],
action:"Cherche sur ton avis d'impôt la ligne de ton plafond d'épargne retraite. Puis pose-toi 2 questions. Mon taux marginal est-il d'au moins 30 % ? Mon épargne de secours est-elle complète ? Si l'une des réponses est non, ce produit n'est pas pour toi cette année."
},
{module:"Module 3 — La fiscalité de tes placements", title:"Les crypto-actifs : ce que le fisc attend de toi", duration:"5 min",
script:[
"Les impôts sur les cryptos sont mal connus. Les erreurs coûtent cher, car elles portent souvent sur des choses à déclarer. Et les amendes ne dépendent pas des sommes en jeu.",
"Première règle, qui surprend beaucoup : <strong>échanger une crypto contre une autre n'est pas imposé.</strong> Tant que tu restes dans le monde des cryptos, tu ne dois rien. <strong>L'impôt arrive quand tu convertis en monnaie officielle</strong>, l'euro par exemple. Ou quand tu achètes un bien ou un service en crypto.",
"Deuxième règle : pour un particulier, les gains sont taxés à <strong>30 %</strong> (flat tax). Tu peux choisir les tranches si c'est plus avantageux. Il n'y a pas d'impôt si <u>le total de tes ventes de l'année ne dépasse pas 305 €.</u> Ça vise les toutes petites opérations.",
"Le calcul du gain est particulier et surprend souvent. On ne calcule pas ligne par ligne, comme pour des actions. La formule compare le prix de vente à la valeur totale de ton portefeuille, en tenant compte de tout ce que tu as investi. Concrètement, <strong>pour chaque vente, tu dois connaître la valeur totale de ton portefeuille à ce moment-là.</strong> C'est pour ça qu'il faut tenir un registre au fur et à mesure. Le reconstituer après coup sur plusieurs années est un travail énorme.",
"Troisième règle, la plus sanctionnée : <strong>tes comptes sur des plateformes étrangères doivent être déclarés chaque année.</strong> Même vides. Même sans aucune opération. Ça se fait sur un formulaire à part, joint à ta déclaration de revenus. <u>L'amende par compte non déclaré est la même quel que soit le montant.</u> C'est l'erreur qui coûte le plus souvent cher pour de petits portefeuilles.",
"Certaines situations suivent d'autres règles et demandent un accompagnement : le minage, le staking, les revenus de la finance décentralisée (DeFi), ou acheter et revendre de façon habituelle, comme un métier. Ces cas sortent de cette leçon.",
"Retiens l'ordre des priorités : <strong>déclarer tes comptes étrangers est plus urgent que réduire l'impôt sur tes gains.</strong> Car l'oubli est sanctionné, que tu aies gagné ou non."
],
quiz:[
{q:"Quand le gain en crypto devient-il imposable ?",opts:["À chaque échange entre cryptos","Quand on convertit en euros ou qu'on achète un bien","Chaque 31 décembre","Dès l'achat"],correct:1,
explain:"Les échanges crypto contre crypto ne comptent pas. C'est la sortie vers l'euro qui déclenche l'impôt."},
{q:"Quelle erreur est la plus sanctionnée ?",opts:["Oublier un petit gain","Ne pas déclarer un compte à l'étranger","Ne pas garder ses justificatifs d'achat","Payer en retard"],correct:1,
explain:"L'amende est la même par compte, quel que soit le montant. Un compte vide non déclaré coûte autant qu'un compte plein."},
{q:"Pourquoi tenir un registre au fur et à mesure ?",opts:["La loi impose un format précis","Le calcul demande la valeur totale du portefeuille à chaque vente","Pour avoir un taux réduit","Pour éviter la déclaration"],correct:1,
explain:"La méthode française compare chaque vente à la valeur totale du portefeuille. Tout reconstituer après coup est très lourd."}
],
action:"Si tu as des cryptos, liste ce soir toutes les plateformes où tu as un compte. Repère celles qui sont hors de France. Ce sont elles qu'il faut mettre sur ta prochaine déclaration, même si le compte est vide."
},
{module:"Module 4 — L'immobilier face à l'impôt", title:"Revenus fonciers : micro-foncier ou régime réel", duration:"5 min",
script:[
"Louer un logement vide te rapporte des revenus fonciers. Ils sont taxés selon les tranches de l'impôt, plus les 17,2 % de prélèvements sociaux. C'est pour ça que la location vide coûte cher en impôts à quelqu'un qui est déjà très imposé.",
"Il y a 2 régimes. Choisir le bon, c'est la principale décision fiscale d'un propriétaire qui loue.",
"<strong>Le micro-foncier</strong> s'applique automatiquement si tes loyers ne dépassent pas <strong>15 000 € par an</strong>. On retire <strong>30 %</strong> de tes loyers, censés couvrir toutes tes charges. Son avantage : c'est simple. Aucun justificatif, quelques lignes dans la déclaration.",
"<strong>Le régime réel</strong> te permet de déduire tes vraies charges : intérêts d'emprunt, assurances, taxe foncière, frais de gestion, et surtout les travaux d'entretien, de réparation et d'amélioration. Il est obligatoire au-delà de 15 000 €, et au choix en dessous.",
"La règle pour choisir : <strong>si tes vraies charges dépassent 30 % de tes loyers, le régime réel est plus avantageux.</strong> C'est presque toujours le cas la première année d'un achat à crédit, quand les intérêts sont au plus haut. Et chaque année de gros travaux.",
"Attention à un piège qui coûte cher : <u>une fois choisi, le régime réel est obligatoire pendant 3 ans.</u> Ensuite, il continue tant que tu ne changes pas. Le choisir pour une année de gros travaux t'engage donc aussi pour les 2 années suivantes. Il faudra continuer à justifier chaque charge.",
"Une différence essentielle, qui cause beaucoup de redressements. <strong>Les travaux d'entretien, de réparation et d'amélioration se déduisent. Les travaux de construction, reconstruction ou agrandissement, non.</strong> Refaire une toiture se déduit. Ajouter une véranda, non. Pour un gros chantier, pose-toi la question avant les travaux, pas au moment de déclarer."
],
quiz:[
{q:"Combien retire le micro-foncier sur les loyers ?",opts:["10 %","30 %","50 %","71 %"],correct:1,
explain:"30 % pour couvrir toutes les charges, sans aucun justificatif."},
{q:"Quand le régime réel est-il plus avantageux ?",opts:["Quand les charges dépassent 30 % des loyers","Quand les loyers dépassent 30 000 €","Toujours","Seulement en cas de vente"],correct:0,
explain:"C'est presque toujours le cas la première année d'un achat à crédit, et les années de gros travaux."},
{q:"Quelle contrainte a le régime réel ?",opts:["Des frais de dossier","On ne peut pas en sortir pendant 3 ans","Il interdit la location meublée","Il oblige à prendre un comptable"],correct:1,
explain:"Le choisir pour une année de travaux t'engage aussi pour les 2 années suivantes."}
],
action:"Si tu loues un bien, additionne tes vraies charges de l'an dernier. Compare-les à 30 % des loyers encaissés. Ce petit calcul te dit si tu as le bon régime. Beaucoup de propriétaires découvrent qu'ils paient trop depuis des années."
},
{module:"Module 4 — L'immobilier face à l'impôt", title:"Le déficit foncier, un levier puissant et méconnu", duration:"5 min",
script:[
"Le déficit foncier est un des rares avantages qui ne demandent ni produit à acheter ni montage compliqué. Il arrive tout seul quand les charges d'un logement loué dépassent les loyers. En général, une année de travaux.",
"Il fonctionne en 2 temps, et c'est le second qui le rend puissant. <strong>D'abord</strong>, le déficit se retire de tes autres revenus fonciers, si tu en as. <strong>Ensuite</strong>, le reste se retire de ton revenu global, c'est-à-dire de ton salaire, jusqu'à <strong>10 700 € par an</strong>.",
"C'est ce second temps qui rend le dispositif intéressant : il baisse un revenu taxé à ton taux marginal. Pour quelqu'un à 30 %, un déficit de 10 700 € fait économiser environ 3 200 € d'impôt sur le revenu. Plus l'effet sur les prélèvements sociaux de tes loyers.",
"2 précisions importantes. La partie du déficit qui vient des <strong>intérêts d'emprunt</strong> ne peut jamais se retirer de ton salaire. Elle ne compte que sur tes revenus fonciers. Et ce qui dépasse 10 700 € <u>se reporte sur tes revenus fonciers des 10 années suivantes.</u> Rien n'est perdu, c'est juste décalé.",
"En échange, tu dois respecter une durée, et elle est stricte : <strong>le logement doit rester loué jusqu'au 31 décembre de la troisième année qui suit.</strong> Si tu le vends ou le reprends pour toi avant, tu perds l'avantage et tu dois rembourser.",
"Un conseil de méthode. Comme le plafond est annuel, <strong>étaler de gros travaux sur 2 années est souvent plus efficace que tout faire la même année.</strong> Un chantier de 20 000 € payé en une seule année dépasse le plafond. Le même chantier payé sur 2 années civiles peut être absorbé en entier. C'est la date de paiement des factures qui compte, pas celle du chantier."
],
quiz:[
{q:"Jusqu'à combien le déficit foncier se retire-t-il du salaire ?",opts:["5 000 €","10 700 €","15 000 €","Sans limite"],correct:1,
explain:"Au-delà, le reste se reporte sur tes revenus fonciers des 10 années suivantes."},
{q:"Quelle charge ne peut pas se retirer du salaire ?",opts:["La taxe foncière","Les intérêts d'emprunt","Les frais de gestion","Les travaux de réparation"],correct:1,
explain:"La partie du déficit qui vient des intérêts ne compte que sur les revenus fonciers."},
{q:"Quelle obligation va avec le déficit foncier ?",opts:["Louer meublé pendant 5 ans","Garder le logement loué jusqu'à la fin de la troisième année suivante","Faire les travaux soi-même","Passer au micro-foncier"],correct:1,
explain:"Vendre ou reprendre le logement avant fait perdre l'avantage."}
],
action:"Si tu prévois des travaux dans un logement loué, regarde le calendrier avant de signer le devis. Payer sur 2 années civiles permet souvent de tout absorber dans le plafond annuel, au lieu d'en reporter une partie sur 10 ans."
},
{module:"Module 4 — L'immobilier face à l'impôt", title:"La location meublée, un régime à part", duration:"5 min",
script:[
"Les loyers d'un meublé ne sont pas des revenus fonciers. Ils sont classés comme des bénéfices commerciaux (BIC). Ce changement a des effets importants sur l'impôt, en général favorables au propriétaire. C'est ce qui explique le succès de ce statut.",
"Ici aussi, il y a 2 régimes. <strong>Le micro-BIC</strong> retire un forfait de tes loyers : historiquement <strong>50 %</strong> pour un meublé classique, contre 30 % en location vide. Pour les meublés de tourisme, les seuils et les taux ont changé plusieurs fois récemment, avec des forfaits plus bas et des conditions selon le classement du logement. <u>C'est typiquement le point à vérifier pour l'année en cours, sans rien supposer.</u>",

  try {
    const l = LESSONS[lessonNumber - 1];
    if(!l) return;

    if(!value){
      await sb.from('carnet').delete()
        .eq('user_id', CURRENT_USER.id)
        .eq('formation', FORMATION)
        .eq('lesson_number', lessonNumber);
      return;
    }

    await sb.from('carnet').upsert({
      user_id: CURRENT_USER.id,
      formation: FORMATION,
      lesson_number: lessonNumber,
      titre: l.title || ('Leçon ' + lessonNumber),
      action: l.action || ''
    }, { onConflict: 'user_id,formation,lesson_number', ignoreDuplicates: true });
  } catch(e){
    console.warn('Carnet non mis à jour :', e);
  }
}

let current = parseInt(new URLSearchParams(location.search).get('l')) || 1;
if(current < 1) current = 1;
if(current > LESSONS.length) current = LESSONS.length;

function isUnlocked(n){
  if(n === 1) return true;
  const progress = getProgress();
  return !!progress[n-1];
}

function renderSidebar(){
  const progress = getProgress();
  const doneCount = Object.keys(progress).filter(function(k){ return progress[k]; }).length;
  document.getElementById('navProgress').textContent = doneCount + '/' + LESSONS.length + ' leçons';

  /* Regroupement des lecons par module : c'est le module qui devient
     l'etape de l'itineraire, la lecon n'est qu'un arret. */
  const etapes = [];
  LESSONS.forEach(function(l, i){
    const nom = l.module.split(' — ')[1] || l.module;
    let e = etapes.find(function(x){ return x.nom === nom; });
    if(!e){ e = { nom: nom, lecons: [] }; etapes.push(e); }
    e.lecons.push({ n: i + 1, titre: l.title });
  });

  const etapeCourante = etapes.findIndex(function(e){
    return e.lecons.some(function(a){ return a.n === current; });
  });

  const COCHE = '<svg viewBox="0 0 24 24" fill="none"><path d="M5 12L10 17L19 7" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  let html = '<div class="itin">' +
    '<div class="itin-tete">' +
      '<div class="itin-formation">' + NOM_FORMATION + '</div>' +
      '<div class="itin-compte">Étape ' + (etapeCourante + 1) + ' sur ' + etapes.length + ' · ' + doneCount + '/' + LESSONS.length + ' leçons</div>' +
      '<div class="itin-barre"><span style="width:' + Math.round(doneCount / LESSONS.length * 100) + '%"></span></div>' +
    '</div><div class="route">';

  etapes.forEach(function(e, idx){
    const toutesFaites = e.lecons.every(function(a){ return progress[a.n]; });
    const ici = idx === etapeCourante;
    const premiereAccessible = e.lecons.find(function(a){ return isUnlocked(a.n); });
    const classe = toutesFaites ? 'faite' : (ici ? 'ici' : '');
    const borne = toutesFaites ? COCHE : String(idx + 1);
    const cible = premiereAccessible ? premiereAccessible.n : e.lecons[0].n;

    html += '<div class="etape-i ' + classe + '">' +
      '<span class="borne">' + borne + '</span>' +
      '<button class="etape-titre" onclick="goTo(' + cible + ')">' + e.nom + '</button>' +
      '<div class="etape-meta">' + e.lecons.length + ' leçon' + (e.lecons.length > 1 ? 's' : '') + '</div>';

    /* On ne deroule que l'etape ou l'on se trouve : la carte reste lisible. */
    if(ici){
      html += '<div class="arrets">';
      e.lecons.forEach(function(a){
        const fait = !!progress[a.n];
        const ouvert = isUnlocked(a.n);
        const cl = (a.n === current ? 'ici ' : '') + (fait ? 'faite ' : '') + (ouvert ? '' : 'bloque');
        html += '<div class="arret ' + cl + '" onclick="goTo(' + a.n + ')">' +
          '<span class="puce">' + COCHE + '</span><span>' + a.titre + '</span></div>';
      });
      html += '</div>';
    }
    html += '</div>';
  });

  html += '</div>' + escaleHtml() + '</div>';
  document.getElementById('sidebar').innerHTML = html;
}

/* Changer de formation sans repasser par le menu. */
const PARCOURS = [
  { cle:'monnaie',     nom:'Comprendre la monnaie',   page:'lecons-monnaie.html' },
  { cle:'psychologie', nom:"Psychologie de l'argent", page:'lecons-psychologie.html' },
  { cle:'budget',      nom:'Maîtriser son budget',    page:'lecons-budget.html' },
  { cle:'bourse',      nom:'Premiers pas en bourse',  page:'lecons-bourse.html' },
  { cle:'crypto',      nom:'Bitcoin & cryptomonnaies',page:'lecons-crypto.html' },
  { cle:'immobilier',  nom:'Investir dans la pierre', page:'lecons-immobilier.html' },
  { cle:'epargne',     nom:'Épargne & sécurité',      page:'lecons-epargne.html' },
  { cle:'fiscalite',   nom:'Optimisation fiscale',    page:'lecons-fiscalite.html' },
  { cle:'finance-islamique', nom:'Finance islamique', page:'lecons-finance-islamique.html' }
];

function escaleHtml(){
  let h = '<div class="escale"><div class="escale-titre">Autres formations</div>';
  PARCOURS.forEach(function(p){
    const courante = p.cle === FORMATION;
    h += '<a href="' + p.page + '" class="' + (courante ? 'courante' : 'prete') + '">' +
      '<span class="jeton"></span><span>' + p.nom + '</span></a>';
  });
  h += '</div>';
  return h;
}

function goTo(n){
  if(!isUnlocked(n)){
    alert('Termine la leçon précédente pour débloquer celle-ci.');
    return;
  }
  current = n;
  history.replaceState(null, '', '?l=' + n);
  render();
  window.scrollTo(0,0);
}

let quizState = {};

function allQuizCorrect(l){
  for(let i=0;i<l.quiz.length;i++){ if(!quizState[i]) return false; }
  return true;
}

function render(){
  renderSidebar();
  const l = LESSONS[current-1];
  const progress = getProgress();
  const done = !!progress[current];
  quizState = {};
  if(done){ l.quiz.forEach(function(q,i){ quizState[i] = true; }); }
  const main = document.getElementById('main');
  let quizHtml = '';
  l.quiz.forEach(function(q, qi){
    let optsHtml = '';
    q.opts.forEach(function(opt, oi){
      const preAnswered = done && oi === q.correct;
      optsHtml += '<div class="quiz-opt ' + (preAnswered?'correct disabled':'') + '" id="q' + qi + 'o' + oi + '" onclick="answerQuiz(' + qi + ',' + oi + ',' + q.correct + ')">' +
        '<span class="quiz-letter">' + String.fromCharCode(65+oi) + '</span><span class="quiz-opt-text">' + opt + '</span></div>';
    });
    quizHtml += '<div class="quiz-card"><div class="quiz-q">Question ' + (qi+1) + '. ' + q.q + '</div>' + optsHtml +
      '<div class="quiz-explain ' + (done?'show':'') + '" id="exp' + qi + '"><strong>Explication : </strong>' + q.explain + '</div></div>';
  });

  const quizOk = allQuizCorrect(l);
  const actionCardStyle = (!quizOk && !done) ? 'opacity:.5;pointer-events:none;' : '';

  main.innerHTML =
    (done ? '<div class="completion-badge show">✓ Leçon terminée</div>' : '') +
    '<div class="lesson-eyebrow">' + l.module + '</div>' +
    '<div class="lesson-title">' + (current) + '. ' + l.title + '</div>' +
    '<div class="lesson-meta">' + l.duration + ' de lecture · Leçon ' + current + ' sur ' + LESSONS.length + '</div>' +
    '<div class="section-label"><span class="dot"></span>Comprendre</div>' +
    '<div class="script-text">' + l.script.map(function(p){
      return p.indexOf('<figure') === 0 ? p : '<p>' + p + '</p>';
    }).join('') + '</div>' +
    '<div class="section-label quiz"><span class="dot"></span>Vérifier</div>' +
    quizHtml +
    '<div class="section-label action"><span class="dot"></span>Petite action</div>' +
    (!quizOk && !done ? '<div style="font-size:12.5px;font-weight:600;color:var(--coral);margin-bottom:10px;">Réponds correctement aux ' + l.quiz.length + ' questions pour débloquer cette action.</div>' : '') +
    '<div class="action-card" id="actionCard" style="' + actionCardStyle + '">' +
      '<div class="action-text">' + l.action + '</div>' +
      '<div class="action-check" onclick="toggleAction()"><span class="action-box ' + (done?'checked':'') + '" id="actionBox">' + (done?'✓':'') + '</span><span class="action-label">Marquer cette leçon comme terminée</span></div>' +
    '</div>' +
    '<div class="lesson-nav">' +
      (current > 1 ? '<button class="nav-btn ghost" onclick="goTo(' + (current-1) + ')">← Leçon précédente</button>' : '<span></span>') +
      (current < LESSONS.length ? '<button class="nav-btn" onclick="goTo(' + (current+1) + ')">Leçon suivante →</button>' : '<a href="lecons-immobilier.html" class="nav-btn">Investir dans la pierre →</a>') +
    '</div>' +

    '<div class="lesson-sortie">' +
      '<a href="index.html#formations">Sommaire des formations</a><span>·</span>' +
      '<a href="carnet.html">Mon carnet</a><span>·</span>' +
      '<a href="index.html">Retour au site</a>' +
    '</div>';
}

function answerQuiz(qi, oi, correct){
  if(quizState[qi]) return; // déjà répondu correctement, verrouillé
  const chosen = document.getElementById('q'+qi+'o'+oi);
  if(chosen.classList.contains('disabled')) return;

  if(oi === correct){
    for(let k=0;k<10;k++){
      const el = document.getElementById('q'+qi+'o'+k);
      if(el){ el.classList.add('disabled'); }
    }
    chosen.classList.add('correct');
    quizState[qi] = true;
    document.getElementById('exp'+qi).classList.add('show');
    const l = LESSONS[current-1];
    const quizOk = allQuizCorrect(l);
    const card = document.getElementById('actionCard');
    if(quizOk && card){
      card.style.opacity = '';
      card.style.pointerEvents = '';
      const lock = card.previousElementSibling;
      if(lock && lock.textContent.indexOf('Réponds correctement') !== -1){ lock.style.display = 'none'; }
    }
  } else {
    chosen.classList.add('wrong');
    document.getElementById('exp'+qi).classList.add('show');
    setTimeout(function(){ chosen.classList.remove('wrong'); }, 900);
  }
}

async function toggleAction(){
  const l = LESSONS[current-1];
  const progress = getProgress();
  const newValue = !progress[current];
  if(newValue && !allQuizCorrect(l)){
    alert('Réponds correctement à toutes les questions du quiz avant de valider cette leçon.');
    return;
  }
  await setProgressServer(current, newValue);
  render();

  /* La formation vient-elle de s'achever ? Si oui, on plante la borne.
     On ne la montre qu'au moment du basculement, jamais en revenant
     sur une leçon déjà validée. */
  if(newValue) verifierFinDeParcours();
}

async function verifierFinDeParcours(){
  const progress = getProgress();
  const faites = Object.keys(progress).filter(function(k){ return progress[k]; }).length;
  if(faites < LESSONS.length) return;

  let prenom = '';
  let semaines = 1;
  try {
    const { data } = await sb.from('profiles').select('prenom').eq('id', CURRENT_USER.id).maybeSingle();
    if(data && data.prenom) prenom = data.prenom;

    const { data: dates } = await sb.from('lesson_progress')
      .select('completed_at').eq('user_id', CURRENT_USER.id).eq('formation', FORMATION)
      .not('completed_at', 'is', null).order('completed_at', { ascending: true }).limit(1);
    if(dates && dates.length){
      const debut = new Date(dates[0].completed_at).getTime();
      semaines = Math.max(1, Math.round((Date.now() - debut) / (7*24*3600*1000)));
    }
  } catch(e){ console.warn('Carte : données partielles', e); }

  ouvrirCarte(FORMATION, LESSONS.length, prenom, semaines);
}

async function boot(){
  document.getElementById('main').innerHTML = '<div style="padding:60px 0;text-align:center;color:var(--ink-faint);font-size:14px;">Chargement de ta progression…</div>';
  const user = await requireAuth();
  if(!user) return;
  const unlocked = await requireUnlock(user.id);
  if(!unlocked) return;
  CURRENT_USER = user;
  await loadProgressFromServer();

  if(!isUnlocked(current)){
    let lastUnlocked = 1;
    for(let i=1;i<=LESSONS.length;i++){ if(isUnlocked(i)) lastUnlocked = i; else break; }
    current = lastUnlocked;
    history.replaceState(null, '', '?l=' + current);
  }
  render();
}
boot();
</script>
