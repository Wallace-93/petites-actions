<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --ink:#171C45;--ink-soft:#44496B;--ink-muted:#6B7094;--ink-faint:#9599B5;
  --bg:#FFFFFF;--bg-soft:#F6F7FB;--bg-mid:#F0F1F7;--bg-line:#DCDEEA;
  --green:#2B3A8F;--green-light:#3B4BA8;--green-pale:#E9EBF7;--green-bord:#C5CAEB;
  --amber:#C27C00;--amber-pale:#FDF2DA;--amber-bord:#F0D49A;
  --violet:#4D5675;--violet-pale:#EEF0F5;--violet-bord:#D5D9E6;
  --coral:#A3213D;--coral-pale:#FAEAEE;
  --sans:'Archivo',system-ui,-apple-system,sans-serif;
  --display:'Archivo',system-ui,sans-serif;
  --mono:'Archivo',system-ui,sans-serif;
}
body{font-family:var(--sans);background:var(--bg-soft);color:var(--ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;}
a{color:inherit;}

.nav{position:sticky;top:0;z-index:200;background:rgba(255,255,255,.96);backdrop-filter:blur(20px);border-bottom:1px solid var(--bg-line);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;font-weight:800;font-size:15px;color:var(--ink);}
.nav-mark{width:26px;height:26px;border-radius:8px;background:var(--green);display:flex;align-items:center;justify-content:center;}
.nav-mark svg{width:14px;height:14px;}
.nav-back{font-size:13px;font-weight:600;color:var(--ink-muted);text-decoration:none;}
.nav-progress-pill{font-size:12px;font-weight:700;color:var(--green);background:var(--green-pale);padding:5px 12px;border-radius:100px;}

.layout{display:grid;grid-template-columns:280px 1fr;max-width:1100px;margin:0 auto;min-height:calc(100vh - 60px);}
.sidebar{border-right:1px solid var(--bg-line);background:var(--bg);padding:24px 16px;position:sticky;top:60px;align-self:start;height:calc(100vh - 60px);overflow-y:auto;}
.sb-progress-bar{height:6px;background:var(--bg-mid);border-radius:100px;overflow:hidden;margin:0 10px 18px;}
.sb-progress-fill{height:100%;background:var(--green);border-radius:100px;transition:width .3s;}
.sb-item{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:10px;cursor:pointer;margin-bottom:2px;font-size:13px;font-weight:600;color:var(--ink-muted);transition:background .15s;}
.sb-item:hover{background:var(--bg-soft);}
.sb-item.active{background:var(--green-pale);color:var(--green);}
.sb-item.done{color:var(--ink);}
.sb-item.locked{opacity:.45;cursor:not-allowed;}
.sb-item.locked:hover{background:transparent;}
.sb-check{width:20px;height:20px;border-radius:50%;background:var(--bg-mid);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink-faint);flex-shrink:0;}
.sb-item.done .sb-check{background:var(--green);color:#fff;}
.sb-item.active .sb-check{background:var(--green);color:#fff;}
.sb-module-label{font-size:13.5px;font-weight:700;color:var(--ink-faint);text-transform:none;letter-spacing:0;padding:14px 10px 6px;}

.main{padding:36px 40px 80px;max-width:720px;}
.lesson-eyebrow{font-size:13.5px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--green);margin-bottom:10px;}
.lesson-title{font-size:28px;font-weight:800;letter-spacing:-.03em;color:var(--ink);margin-bottom:8px;line-height:1.15;}
.lesson-meta{font-size:13px;color:var(--ink-faint);margin-bottom:32px;}

.section-label{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:800;letter-spacing:0;text-transform:none;color:var(--ink-muted);margin:36px 0 16px;}
.section-label .dot{width:6px;height:6px;border-radius:50%;background:var(--green);}
.section-label.quiz .dot{background:var(--violet);}
.section-label.action .dot{background:var(--amber);}

.script-text p{font-size:15.5px;font-weight:400;color:var(--ink-soft);line-height:1.75;margin-bottom:18px;}

.quiz-card{background:var(--bg);border:1px solid var(--bg-line);border-radius:16px;padding:24px;margin-bottom:14px;}
.quiz-q{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:16px;line-height:1.5;}
.quiz-opt{display:flex;align-items:flex-start;gap:12px;padding:13px 15px;border:1.5px solid var(--bg-line);border-radius:11px;margin-bottom:9px;cursor:pointer;transition:border-color .15s,background .15s;}
.quiz-opt:hover{border-color:var(--ink-faint);}
.quiz-opt.correct{border-color:var(--green);background:var(--green-pale);}
.quiz-opt.wrong{border-color:var(--coral);background:var(--coral-pale);}
.quiz-opt.disabled{cursor:default;pointer-events:none;}
.quiz-letter{width:24px;height:24px;border-radius:7px;background:var(--bg-soft);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--ink-muted);flex-shrink:0;}
.quiz-opt.correct .quiz-letter{background:var(--green);color:#fff;}
.quiz-opt.wrong .quiz-letter{background:var(--coral);color:#fff;}
.quiz-opt-text{font-size:13.5px;font-weight:500;color:var(--ink);padding-top:2px;}
.quiz-explain{display:none;font-size:13px;font-weight:400;color:var(--ink-muted);line-height:1.6;background:var(--bg-soft);border-radius:10px;padding:14px 16px;margin-top:8px;}
.quiz-explain.show{display:block;}
.quiz-explain strong{color:var(--ink);}

.action-card{background:var(--amber-pale);border:1px solid var(--amber-bord);border-radius:16px;padding:22px 24px;}
.action-text{font-size:14.5px;font-weight:500;color:var(--ink);line-height:1.65;margin-bottom:16px;}
.action-check{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;}
.action-box{width:22px;height:22px;border-radius:7px;border:2px solid var(--amber);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;transition:background .15s;}
.action-box.checked{background:var(--amber);}
.action-label{font-size:13px;font-weight:700;color:#8a6a00;}

.lesson-nav{display:flex;justify-content:space-between;align-items:center;margin-top:40px;padding-top:24px;border-top:1px solid var(--bg-line);}
.nav-btn{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border:none;cursor:pointer;font-family:var(--sans);font-size:14px;font-weight:700;padding:13px 24px;border-radius:11px;text-decoration:none;transition:background .2s;}
.nav-btn:hover{background:var(--ink-soft);}
.nav-btn.ghost{background:var(--bg-mid);color:var(--ink-muted);}
.nav-btn.ghost:hover{background:var(--bg-line);}
.completion-badge{display:none;align-items:center;gap:8px;background:var(--green-pale);color:var(--green);font-size:12.5px;font-weight:700;padding:8px 16px;border-radius:100px;margin-bottom:20px;}
.completion-badge.show{display:inline-flex;}

@media(max-width:860px){
  .layout{grid-template-columns:1fr;}
  .sidebar{position:static;height:auto;border-right:none;border-bottom:1px solid var(--bg-line);}
  .main{padding:28px 20px 60px;}
}

/* ===== Direction Encre & Laiton — surcouche typographique ===== */
body{font-family:var(--sans);letter-spacing:0;}
h1,h2,h3,h4,.hero-h1,.s-title,.cta-h2,.p-name,.mod-title,.c-title,.hc-title,
.lecon-title,.q-title,.auth-title,.perf-title,.section-title,.edu-title,.tips-title{
  font-family:var(--display);letter-spacing:-.015em;
}
.hero-h1,.s-title,.cta-h2,.auth-title{font-weight:500;letter-spacing:-.018em;line-height:1.16;}
h3,h4,.p-name,.mod-title,.c-title,.hc-title,.lecon-title{font-weight:600;}
.s-tag,.f-copy,.hstat-label,.stat-label,.perf-note,.order-meta,.pos-value,
.price-cell,.asset-label,.badge,.eyebrow,.nav-balance{font-family:var(--mono);}

.nav-name em,.ft-name em{font-style:normal;color:var(--amber);}

/* Mise en valeur dans le corps des lecons : le gras porte la notion a
   retenir, l italique la nuance ou le terme technique. */
.script-text strong{color:var(--ink,#171C45);font-weight:700;}
.script-text em{font-style:italic;color:var(--ink-soft,#44496B);}
.script-text u{text-decoration:none;background:linear-gradient(transparent 62%,var(--amber-pale,#FDF2DA) 62%);
  box-shadow:inset 0 -1px 0 var(--amber,#C27C00);}
.script-text p + p{margin-top:14px;}

/* ===== L'itineraire =====
   Une route verticale plutot qu'une liste : on voit d'ou l'on vient,
   ou l'on est, et ce qu'il reste. Meme vocabulaire graphique que le
   carnet de route et les emblemes. */
.itin{padding:4px 4px 24px;}
.itin-tete{padding:0 8px 16px;border-bottom:1px solid var(--bg-line);margin-bottom:16px;}
.itin-formation{font-family:var(--display);font-size:16px;font-weight:600;color:var(--ink);line-height:1.25;}
.itin-compte{font-family:var(--mono);font-size:13.5px;letter-spacing:0;text-transform:none;
  color:var(--ink-muted);margin-top:7px;}
.itin-barre{height:4px;background:var(--bg-mid);border-radius:100px;overflow:hidden;margin-top:10px;}
.itin-barre span{display:block;height:100%;background:var(--amber);border-radius:100px;transition:width .4s cubic-bezier(.4,0,.2,1);}

/* La route */
.route{position:relative;padding-left:30px;}
.route::before{content:"";position:absolute;left:11px;top:14px;bottom:14px;width:2px;
  background:repeating-linear-gradient(var(--bg-line) 0 6px, transparent 6px 11px);}
.etape-i{position:relative;margin-bottom:6px;}
.borne{position:absolute;left:-30px;top:6px;width:24px;height:24px;border-radius:50%;
  background:var(--bg);border:2px solid var(--bg-line);display:grid;place-items:center;
  font-family:var(--mono);font-size:10px;color:var(--ink-faint);z-index:1;transition:all .2s;}
.borne svg{width:11px;height:11px;}
.etape-i.faite .borne{background:var(--amber);border-color:var(--amber);color:#fff;}
.etape-i.ici .borne{background:var(--green);border-color:var(--green);color:#fff;
  box-shadow:0 0 0 4px var(--green-pale);}
.etape-titre{display:block;width:100%;text-align:left;background:transparent;border:0;cursor:pointer;
  font-family:var(--display);font-size:14.5px;font-weight:600;color:var(--ink-soft);
  padding:7px 9px;border-radius:9px;line-height:1.3;transition:background .15s,color .15s;}
.etape-titre:hover{background:var(--bg-soft);color:var(--ink);}
.etape-i.ici .etape-titre{color:var(--green);}
.etape-i.faite .etape-titre{color:var(--ink);}
.etape-meta{font-family:var(--mono);font-size:10px;color:var(--ink-faint);padding:0 9px 4px;letter-spacing:.06em;}

/* Les lecons de l'etape en cours */
.arrets{margin:2px 0 12px;padding-left:9px;border-left:1px solid var(--bg-line);}
.arret{display:flex;align-items:flex-start;gap:9px;padding:7px 9px;border-radius:8px;cursor:pointer;
  font-size:12.8px;font-weight:500;color:var(--ink-muted);transition:background .15s;line-height:1.35;}
.arret:hover{background:var(--bg-soft);color:var(--ink);}
.arret.ici{background:var(--green-pale);color:var(--green);font-weight:700;}
.arret.faite{color:var(--ink);}
.arret.bloque{opacity:.42;cursor:not-allowed;}
.arret.bloque:hover{background:transparent;}
.puce{width:15px;height:15px;border-radius:4px;flex:none;margin-top:1px;border:1.5px solid var(--bg-line);
  display:grid;place-items:center;background:var(--bg);}
.puce svg{width:9px;height:9px;opacity:0;}
.arret.faite .puce{background:var(--amber);border-color:var(--amber);}
.arret.faite .puce svg{opacity:1;}
.arret.ici .puce{border-color:var(--green);border-style:dashed;}

/* Changer de formation sans repasser par le menu */
.escale{margin-top:22px;padding-top:16px;border-top:1px solid var(--bg-line);}
.escale-titre{font-family:var(--mono);font-size:13.5px;letter-spacing:0;text-transform:none;
  color:var(--ink-faint);padding:0 9px 9px;}
.escale a{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;text-decoration:none;
  font-size:12.8px;color:var(--ink-soft);transition:background .15s;}
.escale a:hover{background:var(--bg-soft);color:var(--ink);}
.escale a.courante{background:var(--green-pale);color:var(--green);font-weight:700;}
.jeton{width:7px;height:7px;border-radius:50%;background:var(--bg-line);flex:none;}
.escale a.courante .jeton{background:var(--green);}
.escale a.prete .jeton{background:var(--amber);}

@media(max-width:860px){
  .itin{padding-bottom:8px;}
  .route{padding-left:26px;}
  .borne{left:-26px;}
}
@media(prefers-reduced-motion:reduce){*{transition:none !important;}}

/* ===== Schemas des lecons ===== */
.schema{margin:26px 0;padding:20px 18px 14px;border:1px solid var(--bg-line,#DCDEEA);
  border-radius:12px;background:var(--bg,#FFFFFF);}
.schema svg{width:100%;height:auto;display:block;}
.schema figcaption{font-family:var(--mono,'Archivo',sans-serif);font-size:11.5px;line-height:1.55;
  color:var(--ink-muted,#6B7094);margin-top:14px;padding-top:12px;
  border-top:1px solid var(--bg-line,#DCDEEA);}
@media(max-width:620px){.schema{padding:14px 12px 10px;margin:20px -6px;}}

/* Sortie de leçon : on peut toujours s'arrêter sans se sentir coincé. */
.lesson-sortie{display:flex;flex-wrap:wrap;align-items:center;gap:9px;justify-content:center;
  margin-top:24px;padding-top:18px;border-top:1px solid var(--bg-line);
  font-size:13.5px;color:var(--ink-faint);}
.lesson-sortie a{color:var(--ink-muted);text-decoration:none;font-weight:600;}
.lesson-sortie a:hover{color:var(--green);}
</style>

<script>
/* ============ DONNÉES DES 16 LEÇONS — MAÎTRISER SON BUDGET ============ */
const LESSONS = [
{module:"Module 1 — Avant d'acheter quoi que ce soit", title:"Ce que l'immobilier fait vraiment gagner", duration:"5 min",
script:[
"En France, on voit souvent l'immobilier comme le placement sûr, celui qui ne déçoit jamais. Cette leçon remplace cette idée par quelque chose de plus utile : les 4 façons dont un bien rapporte vraiment. Ce sont elles que tu vérifieras ensuite pour chaque bien.",
"<strong>1. Le loyer.</strong> C'est le revenu de chaque mois, celui qui rembourse le crédit. C'est le plus facile à estimer : il suffit de regarder les annonces du quartier.",
"<strong>2. Le crédit, qui te permet d'acheter avec l'argent de la banque.</strong> C'est le vrai avantage de l'immobilier. Aucune banque ne te prêtera 200 000 € pour acheter des actions. Pour un appartement, elle le fera. Les loyers de tes locataires remboursent alors une dette qui paie <em>ton</em> patrimoine.",
"<strong>3. La hausse du prix du bien.</strong> C'est celle dont on parle le plus, et c'est la moins fiable. Les prix ont beaucoup monté à certaines périodes et dans certaines villes. Ailleurs, ils ont baissé. <u>Personne ne peut prévoir les prix. Si un achat n'est rentable que si le prix monte, c'est un pari, pas un investissement.</u>",
"<strong>4. L'inflation, qui allège ta dette.</strong> On l'oublie presque toujours, et pourtant elle compte beaucoup. Ta mensualité reste la même pendant 20 ans. Pendant ce temps, les loyers et les salaires augmentent avec les prix. <strong>Ta mensualité pèse donc de moins en moins lourd avec le temps</strong>, sans que tu aies rien à faire.",
"Retiens cet ordre : <strong>un achat immobilier doit être rentable avec le loyer, le crédit et l'inflation seulement.</strong> Si le calcul ne marche qu'avec une hausse des prix, c'est que le bien est trop cher.",
"Une dernière chose, pour être honnête. Louer un bien n'est pas un revenu qui tombe tout seul. C'est une activité : des locataires, des travaux, des loyers parfois impayés, des mois sans locataire entre 2 locations, et des papiers. Ceux qui disent le contraire vendent en général une formation, pas un appartement."
],
quiz:[
{q:"Quel avantage l'immobilier a-t-il que les autres placements n'ont pas ?",opts:["Il ne baisse jamais","Le crédit : une banque prête pour un bien, pas pour d'autres placements","Il n'est pas imposé","Il ne demande aucun travail"],correct:1,
explain:"Une banque prête pour un appartement, jamais pour des actions. Tu peux donc investir avec l'argent d'un autre."},
{q:"Quelle source de gain est la moins fiable ?",opts:["Le loyer","Le crédit","La hausse du prix du bien","L'inflation qui allège la dette"],correct:2,
explain:"Personne ne prévoit les prix. Un achat qui n'est rentable qu'en cas de hausse est un pari, donc un bien acheté trop cher."},
{q:"Pourquoi la mensualité pèse-t-elle moins lourd avec le temps ?",opts:["Parce que le taux baisse tout seul","Parce qu'elle reste fixe pendant que loyers et salaires augmentent avec les prix","Parce que la banque réduit la dette","Parce que les impôts baissent"],correct:1,
explain:"On l'oublie souvent, mais cet effet joue en faveur de celui qui emprunte, pendant toute la durée du crédit."}
],
action:"Avant de chercher un bien, écris sur une feuille pourquoi tu veux investir dans l'immobilier : avoir un revenu en plus, préparer ta retraite, laisser quelque chose à tes proches, ou te loger un jour. Cette raison décidera du type de bien, de la ville et de la durée. Sans elle, tu chercheras au hasard."
},
{module:"Module 1 — Avant d'acheter quoi que ce soit", title:"Es-tu prêt ? Les 4 conditions préalables", duration:"5 min",
script:[
"Dans l'immobilier, une erreur peut te coûter des années de difficultés. Tu ne vends pas un appartement en 3 clics, comme des actions. Ces 4 conditions ne sont donc pas des conseils de confort. Ce sont des sécurités.",
"<strong>Condition 1 : garder ton épargne de secours, à part du projet.</strong> Un bien loué a ses propres imprévus : chaudière en panne, travaux de façade votés par l'immeuble, loyer impayé, 3 mois sans locataire. Si ton épargne de secours a servi à payer l'apport, tu paieras le premier problème avec un crédit à la consommation. Et tout ce que le bien devait te rapporter disparaîtra.",
"<strong>Condition 2 : avoir un travail stable.</strong> Ce n'est pas une question de morale, c'est le fonctionnement des banques. Un crédit immobilier t'engage sur 20 ans. Si tes revenus baissent en route, ta mensualité, elle, ne baisse pas. Sache aussi que ce crédit réduira pour longtemps ce que tu peux encore emprunter.",
"<figure class=\"schema\"><svg viewBox=\"0 0 700 286\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"20\" y=\"202\" width=\"250\" height=\"52\" rx=\"9\" fill=\"#E9EBF7\" stroke=\"#2B3A8F\" stroke-width=\"1.4\"/><circle cx=\"46\" cy=\"228\" r=\"12\" fill=\"#2B3A8F\"/><text x=\"46\" y=\"232\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\" fill=\"#fff\">1</text><text x=\"70\" y=\"224\" font-family=\"Newsreader, Georgia, serif\" font-size=\"15\" font-weight=\"600\" fill=\"#171C45\">Un fonds d'urgence intact</text><text x=\"70\" y=\"241\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">Le bien génère ses propres imprévus.</text><rect x=\"20\" y=\"138\" width=\"383\" height=\"52\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#DCDEEA\" stroke-width=\"1.4\"/><circle cx=\"46\" cy=\"164\" r=\"12\" fill=\"#DCDEEA\"/><text x=\"46\" y=\"168\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\" fill=\"#fff\">2</text><text x=\"70\" y=\"160\" font-family=\"Newsreader, Georgia, serif\" font-size=\"15\" font-weight=\"600\" fill=\"#171C45\">Une situation professionnelle stable</text><text x=\"70\" y=\"177\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">Un crédit engage sur 20 ans.</text><rect x=\"20\" y=\"74\" width=\"517\" height=\"52\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#DCDEEA\" stroke-width=\"1.4\"/><circle cx=\"46\" cy=\"100\" r=\"12\" fill=\"#DCDEEA\"/><text x=\"46\" y=\"104\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\" fill=\"#fff\">3</text><text x=\"70\" y=\"96\" font-family=\"Newsreader, Georgia, serif\" font-size=\"15\" font-weight=\"600\" fill=\"#171C45\">De la trésorerie au-delà de l'apport</text><text x=\"70\" y=\"113\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">7 à 8 % de frais dans l'ancien.</text><rect x=\"20\" y=\"10\" width=\"650\" height=\"52\" rx=\"9\" fill=\"#FDF2DA\" stroke=\"#C27C00\" stroke-width=\"1.4\"/><circle cx=\"46\" cy=\"36\" r=\"12\" fill=\"#C27C00\"/><text x=\"46\" y=\"40\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\" fill=\"#fff\">4</text><text x=\"70\" y=\"32\" font-family=\"Newsreader, Georgia, serif\" font-size=\"15\" font-weight=\"600\" fill=\"#171C45\">Accepter que ce soit une activité</text><text x=\"70\" y=\"49\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">Quelques heures par mois, au minimum.</text></svg><figcaption>4 conditions préalables. S'il en manque une, ce n'est pas un problème d'immobilier mais un préalable à traiter.</figcaption></figure>",
"<strong>Condition 3 : avoir de l'argent en plus de l'apport.</strong> Beaucoup de premiers acheteurs découvrent trop tard ce que coûte vraiment l'achat. Il y a les frais de notaire : environ <strong>7 à 8 % dans l'ancien</strong> et <strong>2 à 3 % dans le neuf</strong>. Il peut aussi y avoir des frais d'agence, des travaux de remise en état, des meubles si tu loues meublé, et les mois qui passent avant le premier loyer.",
"<strong>Condition 4 : accepter que ce soit du travail.</strong> Si tu gères toi-même, compte quelques heures par mois, et plus quand un locataire part. Confier la gestion à une agence coûte en général <strong>6 à 10 % des loyers</strong>. Mets ce coût dans ton calcul dès le début, pour ne pas le découvrir après.",
"Un dernier conseil de méthode, et il vaut de l'argent. <u>Le pire moment pour juger un bien, c'est juste après l'avoir visité et aimé.</u> Écris tes critères et ton budget maximum <strong>avant</strong> de commencer les visites. Si tu as envie de les changer en route, prends-le comme une alerte, pas comme une adaptation."
],

explain:"Contre 2 à 3 % dans le neuf. Pour un bien à 150 000 €, cela fait environ 11 000 € à payer en plus du prix."},

action:"Note-toi honnêtement sur les 4 conditions et entoure celles qui ne sont pas remplies. S'il en manque une, ce n'est pas un problème d'immobilier : c'est quelque chose à régler d'abord. Ça te coûtera beaucoup moins cher maintenant qu'après la signature."
},
{module:"Module 1 — Avant d'acheter quoi que ce soit", title:"Acheter sa résidence principale ou investir : le vrai calcul", duration:"5 min",
script:[
"La question revient sans cesse : faut-il d'abord acheter le logement où l'on vit ? On répond souvent que <em>« payer un loyer, c'est jeter de l'argent par les fenêtres »</em>. C'est une phrase toute faite, pas un calcul. Voici comment calculer.",
"Quand tu rembourses un crédit, une partie de l'argent devient ton patrimoine. Mais seulement une partie. <strong>Les premières années, la mensualité sert surtout à payer les intérêts.</strong> Les intérêts ne te construisent rien, comme un loyer. Et le propriétaire paie aussi la taxe foncière, une partie des charges de l'immeuble et l'entretien, ce que le locataire ne paie pas.",
"Pour être juste, il faut donc comparer ton loyer au <strong>coût réel d'être propriétaire</strong> : intérêts + taxe foncière + charges + entretien. La part du crédit qui rembourse le capital n'entre pas dans ce coût, car elle reste à toi.",
"Il faut aussi compter <strong>les frais pour acheter et pour revendre</strong>. Entre les frais de notaire à l'achat et les frais d'agence à la revente, le bien doit souvent prendre 10 % de valeur juste pour que tu retrouves ton argent. D'où la règle la plus utile de cette leçon : <u>si tu penses rester moins de 5 à 7 ans, acheter ton logement est rarement rentable</u>, sauf si les prix montent très fort.",
"Il existe une autre voie que beaucoup ignorent, surtout utile dans les villes chères : <strong>rester locataire là où tu vis, et acheter pour louer ailleurs</strong>, dans une ville où les prix sont bas par rapport aux loyers. Tu peux déménager facilement pour ton travail. Tu ne bloques pas tout ton crédit possible sur un logement qui ne te rapporte rien. Et tu te construis un patrimoine qui te verse des loyers.",
"Cette voie a aussi des défauts, et ils sont réels. Tu gères un bien à distance. Tu ne profites pas de l'absence d'impôt sur le gain à la revente, réservée au logement où l'on vit. Et tu paies des impôts sur les loyers. Ce n'est donc pas mieux, c'est différent. <strong>L'important, c'est de savoir que ce choix existe</strong>, au lieu d'acheter là où tu vis par habitude."
],
quiz:[
{q:"Quelle partie de la mensualité ne te construit aucun patrimoine ?",opts:["Le capital remboursé","Les intérêts","Seulement l'assurance","Aucune"],correct:1,
explain:"Les intérêts, c'est comme un loyer payé à la banque. Les premières années, ils sont la plus grosse part de la mensualité."},
{q:"Si tu restes moins de combien de temps, acheter ton logement est-il rarement rentable ?",opts:["2 ans","5 à 7 ans","10 ans","15 ans"],correct:1,
explain:"Avec les frais d'achat et de revente, le bien doit souvent prendre 10 % juste pour que tu retrouves ton argent."},
{q:"En quoi consiste l'autre voie présentée dans cette leçon ?",opts:["Acheter 2 biens en même temps","Rester locataire là où tu vis et acheter pour louer dans une ville plus favorable","Acheter seulement du neuf","Attendre que les prix baissent"],correct:1,
explain:"Tu restes libre de bouger et tu construis un patrimoine qui rapporte. En échange, tu gères à distance et tu paies des impôts sur les loyers."}
],
action:"Compare ton loyer actuel au coût réel d'être propriétaire d'un logement pareil : intérêts de la première année, taxe foncière, charges non récupérables, et entretien estimé à 1 % du prix du bien par an. Le résultat surprend souvent, dans un sens comme dans l'autre."
},
{module:"Module 2 — Calculer avant de visiter", title:"Rendement brut, net, net-net : les 3 chiffres", duration:"5 min",
script:[
"Les annonces et les vendeurs parlent tous de rendement. Presque tous donnent le même : le brut. C'est le plus flatteur et le moins utile. Savoir passer du brut au net-net, c'est ce qui fait la différence entre un investisseur et un simple acheteur.",
"<strong>Le rendement brut</strong> se calcule ainsi : loyer de l'année ÷ prix d'achat × 100. Un bien à 150 000 € loué 700 € par mois donne donc 5,6 % brut. C'est le chiffre des annonces. Il ne retire aucune dépense.",
"<strong>Le rendement net</strong> retire ce que tu paies vraiment chaque année : taxe foncière, charges de l'immeuble que tu ne peux pas faire payer au locataire, assurance du propriétaire, frais de gestion s'il y en a, et une réserve pour les travaux et les mois sans locataire. Il faut aussi ajouter les frais d'achat au prix, puisque tu les as payés.",
"<figure class=\"schema\"><svg viewBox=\"0 0 700 228\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"200\" y=\"20\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" letter-spacing=\"1.4\" fill=\"#2B3A8F\">CE QUI EST ANNONCÉ</text><text x=\"560\" y=\"20\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" letter-spacing=\"1.4\" fill=\"#C27C00\">CE QUI RESTE VRAIMENT</text><text x=\"20\" y=\"44\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">Rendement brut affiché</text><rect x=\"20\" y=\"54\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#F0F1F7\"/><rect x=\"20\" y=\"54\" width=\"627\" height=\"18\" rx=\"5\" fill=\"#E9EBF7\"/><rect x=\"647\" y=\"54\" width=\"33\" height=\"18\" rx=\"5\" fill=\"#FDF2DA\"/><text x=\"28\" y=\"67\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#2B3A8F\">5,6 %</text><text x=\"672\" y=\"67\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8F5F00\"></text><text x=\"20\" y=\"100\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">Après charges et frais d'acquisition</text><rect x=\"20\" y=\"110\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#F0F1F7\"/><rect x=\"20\" y=\"110\" width=\"422\" height=\"18\" rx=\"5\" fill=\"#E9EBF7\"/><rect x=\"442\" y=\"110\" width=\"238\" height=\"18\" rx=\"5\" fill=\"#FDF2DA\"/><text x=\"28\" y=\"123\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#2B3A8F\">3,8 %</text><text x=\"672\" y=\"123\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8F5F00\"></text><text x=\"20\" y=\"156\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">Après impôt et prélèvements sociaux</text><rect x=\"20\" y=\"166\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#F0F1F7\"/><rect x=\"20\" y=\"166\" width=\"297\" height=\"18\" rx=\"5\" fill=\"#E9EBF7\"/><rect x=\"317\" y=\"166\" width=\"363\" height=\"18\" rx=\"5\" fill=\"#FDF2DA\"/><text x=\"28\" y=\"179\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#2B3A8F\"></text><text x=\"672\" y=\"179\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8F5F00\">2,5 à 3 %</text></svg><figcaption>Passer de 5,6 % à moins de 3 % est la norme, pas l'exception. Ne compare jamais 2 biens sur leur brut.</figcaption></figure>",
"Reprenons l'exemple. Prix 150 000 € + 11 000 € de frais d'achat = 161 000 € dépensés. Loyers de l'année : 8 400 €. On retire 900 € de taxe foncière, 600 € de charges, 150 € d'assurance et 700 € de réserve pour les travaux et les mois vides. Il reste 6 050 €. <strong>Le rendement net tombe à 3,8 %, au lieu des 5,6 % annoncés.</strong>",
"<strong>Le rendement net-net</strong> retire en plus l'impôt. Il dépend de ton taux marginal, c'est-à-dire le taux de ta tranche d'impôt la plus haute, et du régime choisi. Si ce taux est de 30 % et que tu loues vide au régime micro-foncier, compte environ <u>30 % d'impôt + 17,2 % de prélèvements sociaux, sur 70 % du loyer</u>. Le rendement final tombe souvent autour de 2,5 à 3 %.",
"Passer de 5,6 % annoncés à moins de 3 % réels, ce n'est pas un cas rare : <strong>c'est la norme</strong>. C'est pour ça que tant d'investisseurs découvrent, déçus, que leur bien ne leur laisse rien une fois tout payé.",
"D'où cette règle : <u>ne compare jamais 2 biens sur leur rendement brut.</u> Calcule le net de chacun, avec la même réserve pour les mois vides et les travaux, et compare seulement ces chiffres. Un bien à 4 % brut avec peu de charges bat souvent un bien à 7 % brut dans un immeuble en mauvais état."
],
quiz:[
{q:"Comment calcule-t-on le rendement brut ?",opts:["Loyer de l'année ÷ prix d'achat","Loyer du mois ÷ mensualité","Gain de l'année ÷ apport","Loyer de l'année moins les charges"],correct:0,
explain:"C'est le chiffre des annonces. Il ne retire ni les charges ni les impôts."},
{q:"Quel écart y a-t-il en général entre le brut et le net-net ?",opts:["Ils sont presque pareils","Le net-net vaut souvent la moitié du brut","Le net-net est plus élevé","L'écart dépasse rarement 0,5 point"],correct:1,
explain:"Passer de 5,6 % à moins de 3 % est la norme, pas l'exception. C'est ce qui déçoit tant d'investisseurs mal préparés."},
{q:"Comment comparer 2 biens ?",opts:["Sur leur rendement brut","Sur leur rendement net, calculé de la même façon","Sur leur prix au m²","Sur leur âge"],correct:1,
explain:"Un bien à 4 % brut avec peu de charges bat souvent un bien à 7 % brut dans un immeuble en mauvais état."}
],
action:"Prends une annonce qui te plaît et calcule ses 3 rendements. Demande la taxe foncière au vendeur. Trouve les charges dans le dernier compte rendu de l'assemblée générale de l'immeuble. Compte 1 mois sans locataire par an. Le chiffre que tu obtiens est le seul qui compte."
},
{module:"Module 2 — Calculer avant de visiter", title:"Le cash-flow, ce qui reste vraiment chaque mois", duration:"5 min",
script:[
"Le rendement dit si l'investissement est bon. Le cash-flow dit autre chose, de plus concret : combien l'opération ajoute ou retire sur ton compte chaque mois. C'est lui qui décide si tu pourras tenir, et si tu pourras recommencer.",
"Le calcul est simple : loyer reçu − mensualité du crédit − charges du mois − impôt du mois. Le résultat peut être positif, nul ou négatif.",
"<strong>Un cash-flow négatif n'est pas forcément une erreur.</strong> Il veut dire que tu ajoutes de l'argent chaque mois. C'est une épargne obligée, placée dans un bien qui sera à toi un jour. Beaucoup d'achats dans les grandes villes fonctionnent ainsi : on accepte un effort chaque mois pour se construire un patrimoine.",
"Ce qui compte, c'est que <strong>cet effort soit choisi, chiffré et tenable</strong>. Ajouter 150 € par mois pendant 20 ans, c'est 36 000 € de ta poche. C'est un projet d'épargne : il faut le décider comme tel, pas le subir.",
"<strong>Un cash-flow positif</strong> a un gros avantage que peu de gens voient : tu peux continuer à emprunter. Un bien qui se paie tout seul pèse peu sur ton taux d'endettement, ce qui rend un 2e achat possible. C'est pour ça que ceux qui achètent plusieurs biens cherchent des biens qui se paient seuls, même avec un rendement plus modeste.",
"2 précautions pour finir. D'abord, <strong>calcule toujours ton cash-flow avec 11 mois de loyer</strong>, jamais 12. Les mois sans locataire et les impayés existent, et une année sur 10 se passe mal. Ensuite, garde une réserve pour les travaux d'environ <u>5 à 10 % des loyers de l'année</u>. Un bien vieillit, et l'immeuble votera des travaux tôt ou tard.",
"Un cash-flow calculé sur 12 mois pleins et sans réserve n'est pas un calcul optimiste. C'est un calcul faux."
],
quiz:[
{q:"Que veut dire un cash-flow négatif ?",opts:["Que l'investissement est raté","Que tu ajoutes de l'argent chaque mois, comme une épargne obligée","Que le loyer est illégal","Que la banque va refuser"],correct:1,
explain:"Ce n'est pas une erreur en soi, si l'effort est chiffré, choisi et tenable dans la durée."},
{q:"Quel est le principal avantage d'un cash-flow positif ?",opts:["Un rendement affiché plus haut","Tu peux encore emprunter et faire un 2e achat","Il supprime l'impôt","Il réduit les frais de notaire"],correct:1,
explain:"Un bien qui se paie tout seul pèse peu sur ton taux d'endettement. Le projet suivant devient possible."},
{q:"Sur combien de mois de loyer faut-il calculer ?",opts:["12 mois","11 mois","10 mois","13 mois avec les charges"],correct:1,
explain:"Les mois sans locataire et les impayés existent. Calculer sur 12 mois pleins sans réserve n'est pas optimiste, c'est faux."}
],
action:"Reprends ton annonce et calcule le cash-flow du mois avec 11 mois de loyer et une réserve pour les travaux. Si le résultat est négatif, calcule ce que ça fait sur toute la durée du crédit. C'est ce total que tu dois accepter, pas seulement la mensualité."
},
{module:"Module 2 — Calculer avant de visiter", title:"Choisir l'emplacement avec des critères, pas des impressions", duration:"5 min",
script:[
"On répète que l'emplacement compte plus que tout. C'est vrai, mais ça ne sert à rien si on ne sait pas comment le juger. Voici des repères que tu peux vérifier, tous gratuits.",
"<strong>Repère 1 : y a-t-il plus de locataires que de logements ?</strong> En pratique, publie une fausse annonce au loyer prévu, ou compte simplement les biens pareils déjà en location sur les sites d'annonces. <u>Beaucoup d'offres et peu de candidats, c'est le signe de mois sans locataire</u>, quel que soit le rendement affiché.",
"<strong>Repère 2 : la population.</strong> Le site de l'INSEE montre comment la population d'une commune a évolué sur plusieurs années. Une ville qui perd des habitants depuis 10 ans posera problème pour relouer et pour revendre, même si les prix semblent bas. Souvent, ils sont bas justement pour ça.",
"<strong>Repère 3 : l'emploi et les équipements.</strong> Une ville avec beaucoup d'employeurs différents est plus sûre qu'une ville qui dépend d'une seule grosse entreprise. Une gare, une université, un hôpital ou une zone d'activités attirent des locataires toute l'année, que l'économie aille bien ou mal.",
"<strong>Repère 4 : le prix comparé au loyer.</strong> Divise le prix moyen au m² par le loyer moyen au m². Ce chiffre permet de comparer 2 villes honnêtement. Dans les grandes villes les plus chères, il est élevé, donc le rendement est faible. Les villes moyennes qui se portent bien offrent souvent le meilleur équilibre.",
"Pense aussi à la rue, pas seulement à la ville. <strong>2 rues à 300 mètres l'une de l'autre peuvent être très différentes pour la location.</strong> Va sur place à des heures différentes : en semaine, le week-end, le soir. Regarde les commerces ouverts, l'état des entrées des immeubles voisins, les transports.",
"Enfin, méfie-toi des <em>villes à fort rendement</em> mises en avant par certains vendeurs. Un rendement brut de 10 % cache presque toujours un risque aussi grand : mois sans locataire, dégâts, revente difficile, ou peu de demande. <strong>Un rendement élevé paie un risque, il ne le fait pas disparaître.</strong>"
],
quiz:[
{q:"Comment savoir s'il y a assez de locataires dans un secteur ?",opts:["En demandant à l'agence","En comptant les biens pareils en location, ou en publiant une annonce test","En regardant le prix au m²","En consultant le cadastre"],correct:1,
explain:"Beaucoup d'offres et peu de candidats annoncent des mois sans locataire, quel que soit le rendement affiché."},
{q:"Que signale une ville qui perd des habitants depuis 10 ans ?",opts:["Une bonne affaire","Un risque de mois sans locataire et de revente difficile","Rien de spécial","Une baisse prochaine des impôts"],correct:1,
explain:"Les prix y semblent souvent bas, mais c'est la conséquence du problème, pas une chance."},
{q:"Que cache un rendement brut annoncé de 10 % ?",opts:["Une excellente affaire","Un risque aussi grand : mois vides, dégâts ou revente difficile","Une erreur dans l'annonce","Un bien neuf"],correct:1,
explain:"Un rendement élevé paie un risque, il ne le supprime pas. Demande-toi pourquoi il est si haut avant de l'accepter."}
],
action:"Choisis une ville qui t'intéresse et vérifie 3 choses en 20 minutes : l'évolution de sa population sur le site de l'INSEE, le nombre d'annonces de location pareilles à ton projet, et son prix au m² comparé au loyer au m². Ces 3 chiffres valent mieux qu'une impression."
},
{module:"Module 3 — Le financement", title:"Le crédit immobilier, ce qui se négocie vraiment", duration:"5 min",
script:[
"Le crédit est au cœur d'un achat immobilier. Pourtant, beaucoup d'emprunteurs ne discutent que le taux. Ils oublient d'autres points, parfois plus rentables.",
"<strong>Point 1 : le taux d'intérêt.</strong> C'est le plus visible. 0,3 point d'écart sur 200 000 € empruntés sur 20 ans, c'est plusieurs milliers d'euros. Demander à au moins 3 banques, ou passer par un courtier, vaut presque toujours le temps passé.",
"<strong>Point 2 : l'assurance du crédit.</strong> C'est le point le plus oublié, et souvent celui qui fait gagner le plus. Elle peut représenter <u>20 à 30 % du coût total du crédit</u>, et même plus pour les jeunes emprunteurs avec un taux bas. Tu n'es pas obligé de prendre celle de ta banque : tu as le droit d'en choisir une autre, et tu peux en changer à tout moment. On gagne souvent plusieurs milliers d'euros.",
"<strong>Point 3 : les frais de dossier et les pénalités.</strong> Les frais de dossier se discutent, et parfois disparaissent. Plus important : les <strong>pénalités si tu rembourses en avance</strong> peuvent parfois être supprimées. C'est précieux si tu penses revendre avant la fin du crédit, ce qui arrive souvent quand on achète pour louer.",
"<strong>Point 4 : la durée et la souplesse.</strong> Un crédit plus long coûte plus cher au total, mais te laisse plus d'argent chaque mois. Ça peut être un choix pour pouvoir emprunter encore. Demande aussi à pouvoir <strong>augmenter ou baisser tes mensualités</strong>, et à en sauter quelques-unes. Ça ne coûte souvent rien à la signature, et ça vaut cher le jour où un locataire part.",
"Un mot sur l'apport. Les banques demandent en général qu'il couvre au moins les frais d'achat. Mais quand on achète pour louer, <u>un petit apport n'est pas forcément un défaut</u> : tu empruntes plus, et tu gardes de l'argent pour les imprévus. À l'inverse, un gros apport rassure la banque et te donne un meilleur taux. Il n'y a pas une seule bonne réponse. Il faut choisir en connaissance de cause.",
"Un dernier conseil, qui change tout : <strong>obtiens un accord de principe de la banque avant de commencer les visites.</strong> En connaissant ton vrai budget, tu évites de tomber amoureux d'un bien trop cher. Et tu peux faire une offre vite, ce qui fait souvent la différence sur les bons biens."
],
quiz:[
{q:"Quel point du crédit est le plus souvent oublié ?",opts:["Le taux d'intérêt","L'assurance du crédit","Les frais de notaire","La durée"],correct:1,

{module:"Module 3 — Le financement", title:"Ce que la banque regarde, et comment présenter son dossier", duration:"5 min",
script:[
"Un dossier bien présenté obtient de meilleures conditions qu'un dossier pareil mal présenté. Ce n'est pas une question de relations ni de chance. La banque mesure un risque, et ton travail est de le rendre facile à lire.",
"<strong>Le taux d'endettement</strong> est le premier filtre. C'est la part de tes revenus qui part en crédits. La limite habituelle est de <strong>35 %, assurance comprise</strong>. Point important quand tu achètes pour louer : la banque compte en général les loyers prévus à <u>70 % de leur montant</u>, pour prévoir les mois vides et les charges.",
"<strong>Le reste à vivre</strong> vient ensuite, et il compte parfois plus. C'est ce qui te reste une fois toutes les dépenses fixes payées. 2 dossiers avec le même taux d'endettement ne se valent pas si l'un a 800 € de reste à vivre et l'autre 2 500 €.",
"<strong>Ta façon de gérer ton compte</strong> est regardée sur les 3 derniers mois de relevés, parfois 6. La banque cherche : des découverts, des prélèvements refusés, des jeux d'argent, plusieurs crédits à la consommation. <u>3 mois de relevés propres valent mieux qu'un long discours.</u> Si tu veux emprunter, remets tes comptes en ordre 3 à 6 mois avant de déposer ton dossier.",
"<strong>L'épargne qui te reste après l'achat</strong> rassure beaucoup. Si tu gardes plusieurs mois de dépenses de côté après avoir payé l'apport, le risque est bien plus faible pour la banque. Ça se voit souvent dans les conditions qu'elle te propose.",
"Pour présenter ton dossier, un conseil simple que peu de gens suivent. Prépare 1 page qui résume le projet : le bien, le prix, les frais, le loyer prévu (avec des annonces pareilles pour le prouver), le plan de financement, et le cash-flow calculé avec prudence. <strong>Tu n'es plus quelqu'un qui demande, tu es un investisseur qui présente un projet</strong>, et la discussion change.",
"Un dernier mot sur le refus. Un refus n'est pas définitif : chaque banque a ses propres règles, et elles changent d'un mois à l'autre. Demande la raison, corrige ce qui peut l'être, et va voir ailleurs. <strong>Beaucoup de projets ont été financés par la 3e banque.</strong>"
],
quiz:[
{q:"À combien la banque compte-t-elle en général les loyers prévus ?",opts:["100 %","70 %","50 %","Elle ne les compte pas"],correct:1,
explain:"Les 30 % retirés couvrent les mois vides et les charges. La plupart des banques font ce calcul prudent."},
{q:"Que regarde la banque dans tes relevés de compte ?",opts:["Le montant de tes courses","Les découverts, les prélèvements refusés et les crédits à la consommation","Le nombre de virements reçus","Seulement l'âge du compte"],correct:1,
explain:"D'où l'intérêt de remettre tes comptes en ordre 3 à 6 mois avant de déposer un dossier."},
{q:"Que faire après un refus de la banque ?",opts:["Abandonner le projet","Demander la raison, corriger et aller voir une autre banque","Augmenter ton apport de moitié","Attendre 1 an"],correct:1,
explain:"Chaque banque a ses propres règles. Beaucoup de projets ont été financés par la 3e."}
],
action:"Regarde tes 3 derniers relevés de compte comme le ferait un banquier. Note ce qui te ferait hésiter à sa place : un découvert, un petit crédit oublié, des dépenses en dents de scie. C'est exactement ce qu'il faut corriger avant de déposer un dossier, et 3 mois suffisent."
},
{module:"Module 3 — Le financement", title:"Acheter seul, à plusieurs ou en société", duration:"5 min",
script:[
"La façon dont tu possèdes un bien a des effets pendant longtemps : sur tes impôts, sur ce que tu laisseras à tes proches, et sur ta capacité à sortir du projet. Ce choix se fait avant l'achat, car le changer après coûte cher.",
"<strong>Acheter à ton nom</strong> est le plus simple, et ça convient à la plupart des premiers achats. Pas de démarches, pas de comptabilité en plus du régime d'impôt choisi, et tu as accès à tous les régimes vus dans la formation sur les impôts.",
"<strong>L'indivision</strong>, c'est quand plusieurs personnes achètent ensemble sans créer de société. Chacun possède une part du bien. C'est simple au départ et compliqué ensuite, pour une raison précise : <u>les grandes décisions demandent l'accord de tous, et chacun peut demander à sortir à tout moment</u>, ce qui peut obliger à vendre. C'est la première cause de disputes entre proches.",
"<strong>La SCI (société civile immobilière)</strong> règle ce problème. Chacun possède des parts de la société. Qui gère et comment on décide est écrit à l'avance dans les statuts. La SCI permet aussi de transmettre le bien petit à petit, en donnant des parts, et évite l'indivision entre héritiers.",
"Elle a aussi des défauts, souvent minimisés par ceux qui la conseillent trop vite : frais de création, comptabilité et déclarations chaque année. Et surtout une règle à connaître absolument : <strong>une SCI à l'impôt sur le revenu qui loue meublé de façon régulière passe obligatoirement à l'impôt sur les sociétés</strong>. Les impôts changent alors complètement, et on ne peut plus revenir en arrière.",
"L'impôt sur les sociétés mérite d'ailleurs une mise en garde. Il permet de déduire chaque année une partie de la valeur du bien (on dit « amortir »), ce qui réduit fortement l'impôt sur les loyers. C'est tentant. Mais <u>à la revente, le gain est calculé sur une valeur réduite de tous ces amortissements</u>, ce qui donne souvent une grosse facture au moment de vendre. C'est un choix pour garder longtemps, rarement pour un bien que tu revendras dans 10 ans.",
"En résumé : <strong>pour un premier achat seul, acheter à ton nom suffit presque toujours.</strong> La société devient utile à plusieurs, ou pour préparer une transmission. Dans ce cas, un rendez-vous chez un notaire ou un expert-comptable avant l'achat coûte quelques centaines d'euros, et évite des dizaines de milliers d'euros d'erreurs."
],
quiz:[
{q:"Quel est le principal risque de l'indivision ?",opts:["Plus d'impôts","Chacun peut demander à sortir, ce qui peut obliger à vendre","L'interdiction de louer","L'impossibilité d'emprunter"],correct:1,
explain:"C'est la première cause de disputes entre proches. Une société avec des statuts écrits permet de l'éviter."},
{q:"Que se passe-t-il si une SCI à l'impôt sur le revenu loue meublé de façon régulière ?",opts:["Rien de spécial","Elle passe à l'impôt sur les sociétés, sans retour possible","Elle n'est plus une société","Les loyers ne sont plus imposés"],correct:1,
explain:"C'est un piège connu, avec des conséquences lourdes et définitives sur les impôts."},
{q:"Quel est le gros défaut de l'impôt sur les sociétés ?",opts:["Les loyers sont plus imposés","À la revente, le gain est calculé sur une valeur réduite des amortissements","On ne peut pas amortir","La banque refuse le crédit"],correct:1,
explain:"Ce qu'on gagne chaque année se paie à la revente. Ce régime convient si on garde longtemps, rarement si on revend après 10 ans."}
],
action:"Si tu penses acheter à plusieurs, pose-toi 3 questions avant de signer quoi que ce soit : que se passe-t-il si l'un veut vendre, si l'un ne peut plus payer sa part, ou si l'un décède ? Si vous n'avez pas les 3 réponses par écrit, il est trop tôt pour acheter ensemble."
},
{module:"Module 4 — Acheter sans se tromper", title:"La visite : les 12 points à vérifier", duration:"5 min",
script:[
"Une visite dure rarement plus de 20 minutes. La plupart des acheteurs y regardent la déco, c'est-à-dire ce qui se change le plus facilement. Voici ce qu'il faut regarder à la place, du plus cher au moins cher à réparer.",
"<strong>Ce qui coûte très cher et se voit peu.</strong> Le toit et la charpente : regarde depuis la rue, et depuis les combles si tu peux y monter. L'humidité : odeur, traces sur les plinthes, taches en bas des murs. Les fissures : une petite fissure en surface n'est pas grave, mais une fissure qui traverse le mur ou qui forme un escalier est une vraie alerte. L'électricité et la plomberie : un coup d'œil au tableau électrique suffit pour voir s'ils sont vieux.",
"<strong>Ce qui joue sur le loyer et les mois sans locataire.</strong> La lumière et l'orientation, les voisins d'en face, le bruit selon l'heure, le bruit entre logements, et l'état de l'immeuble visible dans l'entrée et les escaliers. <u>Une entrée abîmée annonce souvent un immeuble sans argent de côté</u>, donc des travaux votés en urgence et à payer d'un coup.",
"<strong>Ce qui décide de la valeur du bien demain.</strong> Le DPE, le diagnostic qui note la consommation d'énergie, est devenu central. Les logements les plus mal notés sont peu à peu interdits à la location, selon un calendrier qui a déjà changé plusieurs fois. <strong>Un bien mal noté peut donc devenir impossible à louer</strong>, ce qui explique certains prix bas. Vérifie précisément la règle de l'année en cours.",
"Les documents à demander valent souvent plus que la visite : les comptes rendus des 3 dernières assemblées générales de l'immeuble (ils montrent les disputes et les travaux votés ou repoussés), le montant exact des charges et de la taxe foncière, le règlement de copropriété, et le carnet d'entretien de l'immeuble.",
"Une méthode simple pour ne pas te laisser emporter : <strong>visite toujours 2 fois</strong>, dont 1 fois sans l'agent ni le vendeur si possible, et à une autre heure. La 2e visite montre ce que la 1re a caché, parce que l'émotion de la découverte est passée.",
"Enfin, une règle : <u>chaque défaut repéré doit être chiffré avant l'offre, pas après</u>. Un devis, même approximatif, transforme une inquiétude floue en argument précis pour négocier. C'est le moment où tu peux récupérer le plus d'argent sur tout l'achat."
],
quiz:[
{q:"Que montre une entrée d'immeuble abîmée ?",opts:["Un manque de goût des propriétaires","Souvent un immeuble sans argent de côté, donc des travaux à payer en urgence","Un immeuble ancien","Rien d'important"],correct:1,
explain:"Les parties communes sont le meilleur indice gratuit de la santé financière d'un immeuble."},
{q:"Quel document montre le mieux la vie de l'immeuble ?",opts:["Le règlement de copropriété","Les comptes rendus des 3 dernières assemblées générales","Le diagnostic amiante","Le plan du cadastre"],correct:1,
explain:"Ils montrent les disputes, les travaux votés, ceux qui ont été repoussés, et les charges impayées."},
{q:"Quand faut-il chiffrer les travaux à faire ?",opts:["Après la signature","Avant de faire une offre","Au moment du prêt","Après la 1re année de location"],correct:1,
explain:"Un devis transforme une inquiétude floue en argument précis pour négocier. C'est là qu'on récupère le plus d'argent."}
],
action:"Prépare sur ton téléphone une liste de visite avec les points de cette leçon et les documents à demander. Le simple fait de sortir cette liste pendant la visite change la façon dont le vendeur et l'agent te répondent."
},
{module:"Module 4 — Acheter sans se tromper", title:"Négocier avec des arguments, pas avec de l'audace", duration:"5 min",
script:[
"Négocier un bien, ce n'est pas un bras de fer. C'est un travail de préparation. Celui qui arrive avec des chiffres obtient presque toujours plus que celui qui lance un prix au hasard.",
"<strong>1. Connaître les vrais prix, pas les prix affichés.</strong> Le prix d'une annonce est ce que le vendeur demande, pas ce qu'il obtiendra. Le site public DVF (« demandes de valeurs foncières ») donne gratuitement les prix vraiment payés lors des ventes récentes, adresse par adresse. C'est l'outil que les acheteurs utilisent le moins, à tort.",
"<strong>2. Regarder depuis combien de temps le bien est en vente.</strong> Si un bien est en ligne depuis 4 mois alors qu'un bien se vend en 6 semaines en moyenne dans le coin, le prix est trop haut, et le vendeur commence à douter. À l'inverse, une annonce publiée la veille laisse peu de marge.",
"<strong>3. Comprendre le vendeur.</strong> Un héritage, un divorce, une mutation ou un autre achat déjà signé le poussent à vendre vite. Pose simplement la question à l'agent, qui répond souvent sans problème : <em>pourquoi vendent-ils, et en combien de temps veulent-ils signer ?</em>",
"Ton offre se construit alors simplement. Tu pars du prix réel du marché. Tu retires le coût des travaux chiffrés par devis. Tu tiens compte des vrais défauts et du temps passé en vente. <strong>Une offre basse expliquée par écrit se discute. Une offre basse sans explication se refuse.</strong>",
"2 erreurs classiques à éviter. La 1re : montrer ton enthousiasme pendant la visite. Dire qu'on adore un bien coûte cher quelques minutes plus tard. La 2e : oublier ce qui se négocie à côté du prix : la date où le logement sera libre, les meubles laissés sur place, des travaux payés par le vendeur, ou qui paie les travaux déjà prévus par l'immeuble.",
"Enfin, une règle de discipline. <u>Écris ton prix maximum avant de négocier, et ne le dépasse pas.</u> Le regret d'avoir laissé passer un bien dure peu de temps. Celui d'avoir payé trop cher dure 20 ans, parce qu'il pèse sur chaque mensualité."
],
quiz:[
{q:"Où trouver les prix vraiment payés ?",opts:["Dans les annonces","Sur le site public des demandes de valeurs foncières (DVF)","Seulement auprès des agences","Sur les panneaux à vendre"],correct:1,
explain:"Les annonces montrent ce que les vendeurs demandent. Ce site gratuit montre les ventes réelles, adresse par adresse."},
{q:"Que veut dire un bien en vente depuis 4 mois dans un secteur où ça se vend vite ?",opts:["Un bien très demandé","Un prix trop haut et un vendeur qui commence à douter","Un problème juridique","Une erreur de l'agence"],correct:1,
explain:"Le temps passé en vente est l'un des meilleurs indices de la marge de négociation."},
{q:"Quelle offre a le plus de chances d'être acceptée ?",opts:["Une offre basse sans explication","Une offre expliquée par écrit, avec devis et prix du marché","Une offre au prix affiché","Une offre orale à la fin de la visite"],correct:1,
explain:"Une offre expliquée se discute. Une offre basse sans explication est refusée sans réponse."}
],
action:"Choisis une rue qui t'intéresse et regarde sur le site DVF les prix vraiment payés ces 2 dernières années. Compare-les aux annonces en ligne. L'écart que tu verras, c'est ta marge de négociation moyenne dans ce secteur."
},
{module:"Module 4 — Acheter sans se tromper", title:"Du compromis à l'acte : ce qui se joue vraiment", duration:"5 min",
script:[
"Entre l'offre acceptée et la remise des clés, il se passe en général 3 à 4 mois. Cette période est mal comprise, alors que c'est là que l'acheteur est le plus protégé.",
"<strong>Le compromis de vente</strong> engage l'acheteur et le vendeur. L'acheteur verse en général <strong>5 à 10 % du prix</strong>. Cet argent est bloqué chez le notaire, il ne va pas au vendeur. Le compromis fixe le prix, la date prévue de signature, et surtout les conditions suspensives.",
"<strong>Les conditions suspensives te protègent.</strong> Si l'une d'elles n'est pas remplie, la vente est annulée et tu récupères tout l'argent versé. La plus importante : obtenir ton prêt. La loi fixe une durée minimum pour ça. <u>Vérifie que cette condition indique un montant, un taux maximum et une durée qui correspondent à ta vraie demande.</u> Si le taux écrit est irréaliste, elle ne te protège pas.",
"<figure class=\"schema\"><svg viewBox=\"0 0 700 168\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><line x1=\"34\" y1=\"96\" x2=\"666\" y2=\"96\" stroke=\"#DCDEEA\" stroke-width=\"2\"/><path d=\"M666 96 l-9 -5 v10 z\" fill=\"#DCDEEA\"/><line x1=\"47\" y1=\"96\" x2=\"47\" y2=\"62\" stroke=\"#2B3A8F\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/><circle cx=\"47\" cy=\"96\" r=\"7\" fill=\"#2B3A8F\"/><circle cx=\"47\" cy=\"96\" r=\"12\" fill=\"none\" stroke=\"#2B3A8F\" stroke-width=\"1\" opacity=\".35\"/><text x=\"47\" y=\"52\" text-anchor=\"start\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14\" font-weight=\"600\" fill=\"#171C45\">Offre acceptée</text><text x=\"47\" y=\"122\" text-anchor=\"start\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12\" fill=\"#44496B\">Rien n'est encore engagé</text><line x1=\"224\" y1=\"96\" x2=\"224\" y2=\"62\" stroke=\"#C27C00\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/><circle cx=\"224\" cy=\"96\" r=\"7\" fill=\"#C27C00\"/><circle cx=\"224\" cy=\"96\" r=\"12\" fill=\"none\" stroke=\"#C27C00\" stroke-width=\"1\" opacity=\".35\"/><text x=\"224\" y=\"52\" text-anchor=\"middle\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14\" font-weight=\"600\" fill=\"#171C45\">Compromis</text><text x=\"224\" y=\"122\" text-anchor=\"middle\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12\" fill=\"#44496B\">Dépôt de 5 à 10 %, conditions suspensives</text><line x1=\"363\" y1=\"96\" x2=\"363\" y2=\"62\" stroke=\"#A3213D\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/><circle cx=\"363\" cy=\"96\" r=\"7\" fill=\"#A3213D\"/><circle cx=\"363\" cy=\"96\" r=\"12\" fill=\"none\" stroke=\"#A3213D\" stroke-width=\"1\" opacity=\".35\"/><text x=\"363\" y=\"52\" text-anchor=\"middle\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14\" font-weight=\"600\" fill=\"#171C45\">10 jours</text><text x=\"363\" y=\"122\" text-anchor=\"middle\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12\" fill=\"#44496B\">Délai de rétractation de l'acheteur</text><line x1=\"647\" y1=\"96\" x2=\"647\" y2=\"62\" stroke=\"#2B3A8F\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/><circle cx=\"647\" cy=\"96\" r=\"7\" fill=\"#2B3A8F\"/><circle cx=\"647\" cy=\"96\" r=\"12\" fill=\"none\" stroke=\"#2B3A8F\" stroke-width=\"1\" opacity=\".35\"/><text x=\"647\" y=\"52\" text-anchor=\"end\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14\" font-weight=\"600\" fill=\"#171C45\">Acte</text><text x=\"647\" y=\"122\" text-anchor=\"end\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12\" fill=\"#44496B\">3 à 4 mois plus tard</text></svg><figcaption>Entre l'offre et les clés, ce sont les conditions suspensives qui te protègent.</figcaption></figure>",
"Tu peux demander d'autres conditions, et peu d'acheteurs le font : pas de servitude cachée (un droit de passage, par exemple), l'obtention d'un permis si tu prévois des travaux, ou pas de procès en cours dans l'immeuble.",
"<strong>Le délai de rétractation</strong> est de 10 jours pour l'acheteur particulier, à partir du moment où il reçoit le compromis. Pendant ces 10 jours, tu peux renoncer sans donner de raison et sans rien payer. C'est une vraie protection. C'est aussi le bon moment pour faire relire le compromis si un point n'est pas clair.",
"Entre le compromis et l'acte, le notaire fait les vérifications : qui est vraiment propriétaire, les servitudes, les dettes liées au bien, le droit de la mairie d'acheter en priorité, la situation de l'immeuble. <strong>C'est ce travail invisible qui justifie une grande partie des frais.</strong> Et ces frais sont surtout des taxes reversées à l'État et aux collectivités, pas la paie du notaire.",
"Un conseil pratique pour finir. <u>Le jour de la signature, demande à revoir le bien juste avant.</u> Il doit être comme à la visite : chaudière en place, équipements pas démontés, pas de nouveaux dégâts. Une fois l'acte signé, les recours sont longs et incertains. Un problème vu 1 heure avant se règle tout de suite sur le prix."
],
quiz:[
{q:"À quoi sert une condition suspensive ?",opts:["À repousser la date de signature","À annuler la vente et récupérer ton argent si elle n'est pas remplie","À obtenir une remise","À éviter les frais de notaire"],correct:1,
explain:"C'est la principale protection de l'acheteur, à condition qu'elle soit écrite avec des chiffres réalistes."},
{q:"Combien de temps dure le délai de rétractation de l'acheteur ?",opts:["48 heures","10 jours","1 mois","Il n'y en a pas"],correct:1,
explain:"À partir du moment où tu reçois le compromis, sans raison à donner et sans rien payer. C'est aussi le bon moment pour le faire relire."},
{q:"Que faire juste avant de signer l'acte ?",opts:["Rien de spécial","Vérifier que le bien est comme à la visite","Renégocier le prix","Prendre l'assurance habitation"],correct:1,
explain:"Un problème vu 1 heure avant se règle sur le prix. Après la signature, les recours sont longs et incertains."}
],
action:"Si tu es en train d'acheter, relis la condition de prêt de ton compromis et vérifie 3 chiffres : le montant emprunté, le taux maximum et la durée. S'ils ne correspondent pas à ce que tu as vraiment demandé aux banques, cette clause ne te protège pas."
},
{module:"Module 5 — Louer et gérer", title:"Choisir son mode de location", duration:"5 min",
script:[
"La façon de louer décide du loyer, des impôts, de la durée d'engagement et du travail à fournir. Ce choix se fait avant l'achat, car il change le type de bien à chercher.",
"<strong>La location vide</strong> est la plus simple. Le bail dure 3 ans et se renouvelle. Le locataire reste souvent longtemps, et il y a peu de gestion. En échange, le loyer est plus bas et les impôts plus lourds, car les loyers s'ajoutent à tes revenus imposés au barème.",
"<strong>La location meublée</strong> rapporte en général <strong>10 à 20 %</strong> de loyer en plus. Le bail dure 1 an, ou 9 mois pour un étudiant. Et surtout, elle est moins imposée, comme vu dans la formation sur les impôts. En échange : il faut acheter et remplacer les meubles, et les locataires partent plus vite, donc il y a plus souvent des mois vides.",
"<strong>La colocation</strong> rapporte le plus au m² : souvent <strong>20 à 30 %</strong> de plus qu'une location classique pour le même bien. Mais elle demande beaucoup plus de gestion. Et le choix entre un seul bail pour tous, où chacun paie pour les autres, ou un bail par personne change complètement le risque d'impayé.",
"<strong>La location courte durée</strong> (type location de vacances) peut rapporter le plus, mais c'est un autre métier : accueil, ménage, réponses à toute heure, saisons creuses. Surtout, <u>les règles des communes sont de plus en plus strictes</u> : autorisations, numéro d'enregistrement, nombre de nuits limité selon les villes. <strong>C'est la location dont les règles changent le plus vite.</strong> Vérifie-les commune par commune, et pas seulement au moment d'acheter.",
"Une règle de prudence pour choisir : <strong>ne compte jamais sur la location la plus rentable sans vérifier que le bien reste rentable en location simple.</strong> Un bien rentable en courte durée mais perdant en location vide devient un problème le jour où la ville durcit ses règles. C'est arrivé dans beaucoup de villes.",
"Enfin, adapte la location au bien et au quartier, pas l'inverse. Un studio près d'une université se loue meublé. Un 4 pièces en banlieue familiale se loue vide. Aller contre le marché local, c'est des mois sans locataire."
],
quiz:[

async function requireUnlock(userId){

     boucle infinie. */

async function loadProgressFromServer(){
  const { data } = await sb
    .from('lesson_progress')
    .select('lesson_number, completed')
    .eq('user_id', CURRENT_USER.id)
    .eq('formation', FORMATION);
  const p = {};
  if(data){ data.forEach(function(row){ if(row.completed) p[row.lesson_number] = true; }); }
  PROGRESS_CACHE = p;
  return p;
}
function getProgress(){ return PROGRESS_CACHE; }
async function setProgressServer(lessonNumber, value){
  PROGRESS_CACHE[lessonNumber] = value;
  await sb.from('lesson_progress').upsert({
    user_id: CURRENT_USER.id,
    formation: FORMATION,
    lesson_number: lessonNumber,
    completed: value,
    completed_at: value ? new Date().toISOString() : null
  }, { onConflict: 'user_id,formation,lesson_number' });

  await majCarnet(lessonNumber, value);
}

/* Le carnet de route : l'action cochée s'inscrit dans le carnet personnel,
   la décocher l'en retire. Une erreur ici ne doit jamais bloquer la
   progression de la leçon, d'où le try/catch silencieux. */
async function majCarnet(lessonNumber, value){
  try {
    const l = LESSONS[lessonNumber - 1];
    if(!l) return;

    if(!value){
      await sb.from('carnet').delete()
        .eq('user_id', CURRENT_USER.id)
        .eq('formation', FORMATION)
        .eq('lesson_number', lessonNumber);
      return;
    }

    await sb.from('carnet').upsert({
      user_id: CURRENT_USER.id,
      formation: FORMATION,
      lesson_number: lessonNumber,
      titre: l.title || ('Leçon ' + lessonNumber),
      action: l.action || ''
    }, { onConflict: 'user_id,formation,lesson_number', ignoreDuplicates: true });
  } catch(e){
    console.warn('Carnet non mis à jour :', e);
  }
}

let current = parseInt(new URLSearchParams(location.search).get('l')) || 1;
if(current < 1) current = 1;
if(current > LESSONS.length) current = LESSONS.length;

function isUnlocked(n){
  if(n === 1) return true;
  const progress = getProgress();
  return !!progress[n-1];
}

function renderSidebar(){
  const progress = getProgress();
  const doneCount = Object.keys(progress).filter(function(k){ return progress[k]; }).length;
  document.getElementById('navProgress').textContent = doneCount + '/' + LESSONS.length + ' leçons';

  /* Regroupement des lecons par module : c'est le module qui devient
     l'etape de l'itineraire, la lecon n'est qu'un arret. */
  const etapes = [];
  LESSONS.forEach(function(l, i){
    const nom = l.module.split(' — ')[1] || l.module;
    let e = etapes.find(function(x){ return x.nom === nom; });
    if(!e){ e = { nom: nom, lecons: [] }; etapes.push(e); }
    e.lecons.push({ n: i + 1, titre: l.title });
  });

  const etapeCourante = etapes.findIndex(function(e){
    return e.lecons.some(function(a){ return a.n === current; });
  });

  const COCHE = '<svg viewBox="0 0 24 24" fill="none"><path d="M5 12L10 17L19 7" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  let html = '<div class="itin">' +
    '<div class="itin-tete">' +
      '<div class="itin-formation">' + NOM_FORMATION + '</div>' +
      '<div class="itin-compte">Étape ' + (etapeCourante + 1) + ' sur ' + etapes.length + ' · ' + doneCount + '/' + LESSONS.length + ' leçons</div>' +
      '<div class="itin-barre"><span style="width:' + Math.round(doneCount / LESSONS.length * 100) + '%"></span></div>' +
    '</div><div class="route">';

  etapes.forEach(function(e, idx){
    const toutesFaites = e.lecons.every(function(a){ return progress[a.n]; });
    const ici = idx === etapeCourante;
    const premiereAccessible = e.lecons.find(function(a){ return isUnlocked(a.n); });
    const classe = toutesFaites ? 'faite' : (ici ? 'ici' : '');
    const borne = toutesFaites ? COCHE : String(idx + 1);
    const cible = premiereAccessible ? premiereAccessible.n : e.lecons[0].n;

    html += '<div class="etape-i ' + classe + '">' +
      '<span class="borne">' + borne + '</span>' +
      '<button class="etape-titre" onclick="goTo(' + cible + ')">' + e.nom + '</button>' +
      '<div class="etape-meta">' + e.lecons.length + ' leçon' + (e.lecons.length > 1 ? 's' : '') + '</div>';

    /* On ne deroule que l'etape ou l'on se trouve : la carte reste lisible. */
    if(ici){
      html += '<div class="arrets">';
      e.lecons.forEach(function(a){
        const fait = !!progress[a.n];
        const ouvert = isUnlocked(a.n);
        const cl = (a.n === current ? 'ici ' : '') + (fait ? 'faite ' : '') + (ouvert ? '' : 'bloque');
        html += '<div class="arret ' + cl + '" onclick="goTo(' + a.n + ')">' +
          '<span class="puce">' + COCHE + '</span><span>' + a.titre + '</span></div>';
      });
      html += '</div>';
    }
    html += '</div>';
  });

  html += '</div>' + escaleHtml() + '</div>';
  document.getElementById('sidebar').innerHTML = html;
}

function goTo(n){
  if(!isUnlocked(n)){
    alert('Termine la leçon précédente pour débloquer celle-ci.');
    return;
  }
  current = n;
  history.replaceState(null, '', '?l=' + n);
  render();
  window.scrollTo(0,0);
}

let quizState = {};

function allQuizCorrect(l){
  for(let i=0;i<l.quiz.length;i++){ if(!quizState[i]) return false; }
  return true;
}

function render(){
  renderSidebar();
  const l = LESSONS[current-1];
  const progress = getProgress();
  const done = !!progress[current];
  quizState = {};
  if(done){ l.quiz.forEach(function(q,i){ quizState[i] = true; }); }
  const main = document.getElementById('main');
  let quizHtml = '';
  l.quiz.forEach(function(q, qi){
    let optsHtml = '';
    q.opts.forEach(function(opt, oi){
      const preAnswered = done && oi === q.correct;
      optsHtml += '<div class="quiz-opt ' + (preAnswered?'correct disabled':'') + '" id="q' + qi + 'o' + oi + '" onclick="answerQuiz(' + qi + ',' + oi + ',' + q.correct + ')">' +
        '<span class="quiz-letter">' + String.fromCharCode(65+oi) + '</span><span class="quiz-opt-text">' + opt + '</span></div>';
    });
    quizHtml += '<div class="quiz-card"><div class="quiz-q">Question ' + (qi+1) + '. ' + q.q + '</div>' + optsHtml +
      '<div class="quiz-explain ' + (done?'show':'') + '" id="exp' + qi + '"><strong>Explication : </strong>' + q.explain + '</div></div>';
  });

  const quizOk = allQuizCorrect(l);
  const actionCardStyle = (!quizOk && !done) ? 'opacity:.5;pointer-events:none;' : '';

  main.innerHTML =
    (done ? '<div class="completion-badge show">✓ Leçon terminée</div>' : '') +
    '<div class="lesson-eyebrow">' + l.module + '</div>' +
    '<div class="lesson-title">' + (current) + '. ' + l.title + '</div>' +
    '<div class="lesson-meta">' + l.duration + ' de lecture · Leçon ' + current + ' sur ' + LESSONS.length + '</div>' +
    '<div class="section-label"><span class="dot"></span>Comprendre</div>' +
    '<div class="script-text">' + l.script.map(function(p){
      return p.indexOf('<figure') === 0 ? p : '<p>' + p + '</p>';
    }).join('') + '</div>' +
    '<div class="section-label quiz"><span class="dot"></span>Vérifier</div>' +
    quizHtml +
    '<div class="section-label action"><span class="dot"></span>Petite action</div>' +
    (!quizOk && !done ? '<div style="font-size:12.5px;font-weight:600;color:var(--coral);margin-bottom:10px;">Réponds correctement aux ' + l.quiz.length + ' questions pour débloquer cette action.</div>' : '') +
    '<div class="action-card" id="actionCard" style="' + actionCardStyle + '">' +
      '<div class="action-text">' + l.action + '</div>' +
      '<div class="action-check" onclick="toggleAction()"><span class="action-box ' + (done?'checked':'') + '" id="actionBox">' + (done?'✓':'') + '</span><span class="action-label">Marquer cette leçon comme terminée</span></div>' +
    '</div>' +
    '<div class="lesson-nav">' +
      (current > 1 ? '<button class="nav-btn ghost" onclick="goTo(' + (current-1) + ')">← Leçon précédente</button>' : '<span></span>') +
      (current < LESSONS.length ? '<button class="nav-btn" onclick="goTo(' + (current+1) + ')">Leçon suivante →</button>' : '<a href="lecons-crypto.html" class="nav-btn">Bitcoin &amp; cryptomonnaies →</a>') +
    '</div>' +

    '<div class="lesson-sortie">' +
      '<a href="index.html#formations">Sommaire des formations</a><span>·</span>' +
      '<a href="carnet.html">Mon carnet</a><span>·</span>' +
      '<a href="index.html">Retour au site</a>' +
    '</div>';
}

function answerQuiz(qi, oi, correct){
  if(quizState[qi]) return; // déjà répondu correctement, verrouillé
  const chosen = document.getElementById('q'+qi+'o'+oi);
  if(chosen.classList.contains('disabled')) return;

  if(oi === correct){
    for(let k=0;k<10;k++){
      const el = document.getElementById('q'+qi+'o'+k);
      if(el){ el.classList.add('disabled'); }
    }
    chosen.classList.add('correct');
    quizState[qi] = true;
    document.getElementById('exp'+qi).classList.add('show');
    const l = LESSONS[current-1];
    const quizOk = allQuizCorrect(l);
    const card = document.getElementById('actionCard');
    if(quizOk && card){
      card.style.opacity = '';
      card.style.pointerEvents = '';
      const lock = card.previousElementSibling;
      if(lock && lock.textContent.indexOf('Réponds correctement') !== -1){ lock.style.display = 'none'; }
    }
  } else {
    chosen.classList.add('wrong');
    document.getElementById('exp'+qi).classList.add('show');
    setTimeout(function(){ chosen.classList.remove('wrong'); }, 900);
  }
}

async function toggleAction(){
  const l = LESSONS[current-1];
  const progress = getProgress();
  const newValue = !progress[current];
  if(newValue && !allQuizCorrect(l)){
    alert('Réponds correctement à toutes les questions du quiz avant de valider cette leçon.');
    return;
  }
  await setProgressServer(current, newValue);
  render();

  /* La formation vient-elle de s'achever ? Si oui, on plante la borne.
     On ne la montre qu'au moment du basculement, jamais en revenant
     sur une leçon déjà validée. */
  if(newValue) verifierFinDeParcours();
}

async function verifierFinDeParcours(){
  const progress = getProgress();
  const faites = Object.keys(progress).filter(function(k){ return progress[k]; }).length;
  if(faites < LESSONS.length) return;

  let prenom = '';
  let semaines = 1;
  try {
    const { data } = await sb.from('profiles').select('prenom').eq('id', CURRENT_USER.id).maybeSingle();
    if(data && data.prenom) prenom = data.prenom;

    const { data: dates } = await sb.from('lesson_progress')
      .select('completed_at').eq('user_id', CURRENT_USER.id).eq('formation', FORMATION)
      .not('completed_at', 'is', null).order('completed_at', { ascending: true }).limit(1);
    if(dates && dates.length){
      const debut = new Date(dates[0].completed_at).getTime();
      semaines = Math.max(1, Math.round((Date.now() - debut) / (7*24*3600*1000)));
    }
  } catch(e){ console.warn('Carte : données partielles', e); }

  ouvrirCarte(FORMATION, LESSONS.length, prenom, semaines);
}

async function boot(){
  document.getElementById('main').innerHTML = '<div style="padding:60px 0;text-align:center;color:var(--ink-faint);font-size:14px;">Chargement de ta progression…</div>';
  const user = await requireAuth();
  if(!user) return;
  const unlocked = await requireUnlock(user.id);
  if(!unlocked) return;
  CURRENT_USER = user;
  await loadProgressFromServer();

  if(!isUnlocked(current)){
    let lastUnlocked = 1;
    for(let i=1;i<=LESSONS.length;i++){ if(isUnlocked(i)) lastUnlocked = i; else break; }
    current = lastUnlocked;
    history.replaceState(null, '', '?l=' + current);
  }
  render();
}
boot();
</script>
