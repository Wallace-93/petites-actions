<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --ink:#12212B;--ink-soft:#43555F;--ink-muted:#7A8A93;--ink-faint:#96A3AA;
  --bg:#FCFBF8;--bg-soft:#F5F4EE;--bg-mid:#EFF0EA;--bg-line:#DCDDD3;
  --green:#1E4B3C;--green-light:#2A6350;--green-pale:#E7EFEA;--green-bord:#BFD6C9;
  --amber:#B8862F;--amber-pale:#F6EFE0;--amber-bord:#E4D2AC;
  --violet:#4A5C6B;--violet-pale:#EDF0F2;--violet-bord:#D4DBE0;
  --coral:#A24332;--coral-pale:#F8EDEA;
  --sans:'Karla',system-ui,-apple-system,sans-serif;
  --display:'Newsreader',Georgia,serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
body{font-family:var(--sans);background:var(--bg-soft);color:var(--ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;}
a{color:inherit;}

.nav{position:sticky;top:0;z-index:200;background:rgba(255,255,255,.96);backdrop-filter:blur(20px);border-bottom:1px solid var(--bg-line);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;font-weight:800;font-size:15px;color:var(--ink);}
.nav-mark{width:26px;height:26px;border-radius:8px;background:var(--green);display:flex;align-items:center;justify-content:center;}
.nav-mark svg{width:14px;height:14px;}
.nav-back{font-size:13px;font-weight:600;color:var(--ink-muted);text-decoration:none;}
.nav-progress-pill{font-size:12px;font-weight:700;color:var(--green);background:var(--green-pale);padding:5px 12px;border-radius:100px;}

.layout{display:grid;grid-template-columns:280px 1fr;max-width:1100px;margin:0 auto;min-height:calc(100vh - 60px);}
.sidebar{border-right:1px solid var(--bg-line);background:var(--bg);padding:24px 16px;position:sticky;top:60px;align-self:start;height:calc(100vh - 60px);overflow-y:auto;}
.sb-progress-bar{height:6px;background:var(--bg-mid);border-radius:100px;overflow:hidden;margin:0 10px 18px;}
.sb-progress-fill{height:100%;background:var(--green);border-radius:100px;transition:width .3s;}
.sb-item{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:10px;cursor:pointer;margin-bottom:2px;font-size:13px;font-weight:600;color:var(--ink-muted);transition:background .15s;}
.sb-item:hover{background:var(--bg-soft);}
.sb-item.active{background:var(--green-pale);color:var(--green);}
.sb-item.done{color:var(--ink);}
.sb-item.locked{opacity:.45;cursor:not-allowed;}
.sb-item.locked:hover{background:transparent;}
.sb-check{width:20px;height:20px;border-radius:50%;background:var(--bg-mid);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink-faint);flex-shrink:0;}
.sb-item.done .sb-check{background:var(--green);color:#fff;}
.sb-item.active .sb-check{background:var(--green);color:#fff;}
.sb-module-label{font-size:10.5px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em;padding:14px 10px 6px;}

.main{padding:36px 40px 80px;max-width:720px;}
.lesson-eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green);margin-bottom:10px;}
.lesson-title{font-size:28px;font-weight:800;letter-spacing:-.03em;color:var(--ink);margin-bottom:8px;line-height:1.15;}
.lesson-meta{font-size:13px;color:var(--ink-faint);margin-bottom:32px;}

.section-label{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-muted);margin:36px 0 16px;}
.section-label .dot{width:6px;height:6px;border-radius:50%;background:var(--green);}
.section-label.quiz .dot{background:var(--violet);}
.section-label.action .dot{background:var(--amber);}

.script-text p{font-size:15.5px;font-weight:400;color:var(--ink-soft);line-height:1.75;margin-bottom:18px;}

.quiz-card{background:var(--bg);border:1px solid var(--bg-line);border-radius:16px;padding:24px;margin-bottom:14px;}
.quiz-q{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:16px;line-height:1.5;}
.quiz-opt{display:flex;align-items:flex-start;gap:12px;padding:13px 15px;border:1.5px solid var(--bg-line);border-radius:11px;margin-bottom:9px;cursor:pointer;transition:border-color .15s,background .15s;}
.quiz-opt:hover{border-color:var(--ink-faint);}
.quiz-opt.correct{border-color:var(--green);background:var(--green-pale);}
.quiz-opt.wrong{border-color:var(--coral);background:var(--coral-pale);}
.quiz-opt.disabled{cursor:default;pointer-events:none;}
.quiz-letter{width:24px;height:24px;border-radius:7px;background:var(--bg-soft);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--ink-muted);flex-shrink:0;}
.quiz-opt.correct .quiz-letter{background:var(--green);color:#fff;}
.quiz-opt.wrong .quiz-letter{background:var(--coral);color:#fff;}
.quiz-opt-text{font-size:13.5px;font-weight:500;color:var(--ink);padding-top:2px;}
.quiz-explain{display:none;font-size:13px;font-weight:400;color:var(--ink-muted);line-height:1.6;background:var(--bg-soft);border-radius:10px;padding:14px 16px;margin-top:8px;}
.quiz-explain.show{display:block;}
.quiz-explain strong{color:var(--ink);}

.action-card{background:var(--amber-pale);border:1px solid var(--amber-bord);border-radius:16px;padding:22px 24px;}
.action-text{font-size:14.5px;font-weight:500;color:var(--ink);line-height:1.65;margin-bottom:16px;}
.action-check{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;}
.action-box{width:22px;height:22px;border-radius:7px;border:2px solid var(--amber);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;transition:background .15s;}
.action-box.checked{background:var(--amber);}
.action-label{font-size:13px;font-weight:700;color:#8a6a00;}

.lesson-nav{display:flex;justify-content:space-between;align-items:center;margin-top:40px;padding-top:24px;border-top:1px solid var(--bg-line);}
.nav-btn{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border:none;cursor:pointer;font-family:var(--sans);font-size:14px;font-weight:700;padding:13px 24px;border-radius:11px;text-decoration:none;transition:background .2s;}
.nav-btn:hover{background:var(--ink-soft);}
.nav-btn.ghost{background:var(--bg-mid);color:var(--ink-muted);}
.nav-btn.ghost:hover{background:var(--bg-line);}
.completion-badge{display:none;align-items:center;gap:8px;background:var(--green-pale);color:var(--green);font-size:12.5px;font-weight:700;padding:8px 16px;border-radius:100px;margin-bottom:20px;}
.completion-badge.show{display:inline-flex;}

@media(max-width:860px){
  .layout{grid-template-columns:1fr;}
  .sidebar{position:static;height:auto;border-right:none;border-bottom:1px solid var(--bg-line);}
  .main{padding:28px 20px 60px;}
}

/* ===== Direction Encre & Laiton — surcouche typographique ===== */
body{font-family:var(--sans);letter-spacing:0;}
h1,h2,h3,h4,.hero-h1,.s-title,.cta-h2,.p-name,.mod-title,.c-title,.hc-title,
.lecon-title,.q-title,.auth-title,.perf-title,.section-title,.edu-title,.tips-title{
  font-family:var(--display);letter-spacing:-.015em;
}
.hero-h1,.s-title,.cta-h2,.auth-title{font-weight:500;letter-spacing:-.018em;line-height:1.16;}
h3,h4,.p-name,.mod-title,.c-title,.hc-title,.lecon-title{font-weight:600;}
.s-tag,.f-copy,.hstat-label,.stat-label,.perf-note,.order-meta,.pos-value,
.price-cell,.asset-label,.badge,.eyebrow,.nav-balance{font-family:var(--mono);}

.nav-name em,.ft-name em{font-style:normal;color:var(--amber);}

/* Mise en valeur dans le corps des lecons : le gras porte la notion a
   retenir, l italique la nuance ou le terme technique. */
.script-text strong{color:var(--ink,#12212B);font-weight:700;}
.script-text em{font-style:italic;color:var(--ink-soft,#43555F);}
.script-text u{text-decoration:none;background:linear-gradient(transparent 62%,var(--amber-pale,#F6EFE0) 62%);
  box-shadow:inset 0 -1px 0 var(--amber,#B8862F);}
.script-text p + p{margin-top:14px;}

/* ===== L'itineraire =====
   Une route verticale plutot qu'une liste : on voit d'ou l'on vient,
   ou l'on est, et ce qu'il reste. Meme vocabulaire graphique que le
   carnet de route et les emblemes. */
.itin{padding:4px 4px 24px;}
.itin-tete{padding:0 8px 16px;border-bottom:1px solid var(--bg-line);margin-bottom:16px;}
.itin-formation{font-family:var(--display);font-size:16px;font-weight:600;color:var(--ink);line-height:1.25;}
.itin-compte{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-muted);margin-top:7px;}
.itin-barre{height:4px;background:var(--bg-mid);border-radius:100px;overflow:hidden;margin-top:10px;}
.itin-barre span{display:block;height:100%;background:var(--amber);border-radius:100px;transition:width .4s cubic-bezier(.4,0,.2,1);}

/* La route */
.route{position:relative;padding-left:30px;}
.route::before{content:"";position:absolute;left:11px;top:14px;bottom:14px;width:2px;
  background:repeating-linear-gradient(var(--bg-line) 0 6px, transparent 6px 11px);}
.etape-i{position:relative;margin-bottom:6px;}
.borne{position:absolute;left:-30px;top:6px;width:24px;height:24px;border-radius:50%;
  background:var(--bg);border:2px solid var(--bg-line);display:grid;place-items:center;
  font-family:var(--mono);font-size:10px;color:var(--ink-faint);z-index:1;transition:all .2s;}
.borne svg{width:11px;height:11px;}
.etape-i.faite .borne{background:var(--amber);border-color:var(--amber);color:#fff;}
.etape-i.ici .borne{background:var(--green);border-color:var(--green);color:#fff;
  box-shadow:0 0 0 4px var(--green-pale);}
.etape-titre{display:block;width:100%;text-align:left;background:transparent;border:0;cursor:pointer;
  font-family:var(--display);font-size:14.5px;font-weight:600;color:var(--ink-soft);
  padding:7px 9px;border-radius:9px;line-height:1.3;transition:background .15s,color .15s;}
.etape-titre:hover{background:var(--bg-soft);color:var(--ink);}
.etape-i.ici .etape-titre{color:var(--green);}
.etape-i.faite .etape-titre{color:var(--ink);}
.etape-meta{font-family:var(--mono);font-size:10px;color:var(--ink-faint);padding:0 9px 4px;letter-spacing:.06em;}

/* Les lecons de l'etape en cours */
.arrets{margin:2px 0 12px;padding-left:9px;border-left:1px solid var(--bg-line);}
.arret{display:flex;align-items:flex-start;gap:9px;padding:7px 9px;border-radius:8px;cursor:pointer;
  font-size:12.8px;font-weight:500;color:var(--ink-muted);transition:background .15s;line-height:1.35;}
.arret:hover{background:var(--bg-soft);color:var(--ink);}
.arret.ici{background:var(--green-pale);color:var(--green);font-weight:700;}
.arret.faite{color:var(--ink);}
.arret.bloque{opacity:.42;cursor:not-allowed;}
.arret.bloque:hover{background:transparent;}
.puce{width:15px;height:15px;border-radius:4px;flex:none;margin-top:1px;border:1.5px solid var(--bg-line);
  display:grid;place-items:center;background:var(--bg);}
.puce svg{width:9px;height:9px;opacity:0;}
.arret.faite .puce{background:var(--amber);border-color:var(--amber);}
.arret.faite .puce svg{opacity:1;}
.arret.ici .puce{border-color:var(--green);border-style:dashed;}

/* Changer de formation sans repasser par le menu */
.escale{margin-top:22px;padding-top:16px;border-top:1px solid var(--bg-line);}
.escale-titre{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-faint);padding:0 9px 9px;}
.escale a{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;text-decoration:none;
  font-size:12.8px;color:var(--ink-soft);transition:background .15s;}
.escale a:hover{background:var(--bg-soft);color:var(--ink);}
.escale a.courante{background:var(--green-pale);color:var(--green);font-weight:700;}
.jeton{width:7px;height:7px;border-radius:50%;background:var(--bg-line);flex:none;}
.escale a.courante .jeton{background:var(--green);}
.escale a.prete .jeton{background:var(--amber);}

@media(max-width:860px){
  .itin{padding-bottom:8px;}
  .route{padding-left:26px;}
  .borne{left:-26px;}
}
@media(prefers-reduced-motion:reduce){*{transition:none !important;}}

/* ===== Schemas des lecons ===== */
.schema{margin:26px 0;padding:20px 18px 14px;border:1px solid var(--bg-line,#DCDDD3);
  border-radius:12px;background:var(--bg,#FCFBF8);}
.schema svg{width:100%;height:auto;display:block;}
.schema figcaption{font-family:var(--mono,monospace);font-size:11.5px;line-height:1.55;
  color:var(--ink-muted,#7A8A93);margin-top:14px;padding-top:12px;
  border-top:1px solid var(--bg-line,#DCDDD3);}
@media(max-width:620px){.schema{padding:14px 12px 10px;margin:20px -6px;}}
</style>
</head>

<script>
/* ============ DONNÉES DES 16 LEÇONS — MAÎTRISER SON BUDGET ============ */
const LESSONS = [
{module:"Module 1 — Avant d'acheter quoi que ce soit", title:"Ce que l'immobilier fait vraiment gagner", duration:"5 min",
script:[
"L'immobilier occupe une place particulière dans l'imaginaire français. On le présente comme la valeur sûre, celle qui ne peut pas décevoir. Cette leçon sert à remplacer cette croyance par une compréhension des 4 mécanismes qui produisent réellement le rendement, parce que ce sont eux qu'il faudra ensuite évaluer bien par bien.",
"<strong>Mécanisme 1 : le loyer.</strong> C'est le revenu régulier, celui qui rembourse le crédit. Il est le plus visible et le plus facile à estimer, puisqu'il suffit de comparer aux annonces du quartier.",
"<strong>Mécanisme 2 : l'effet de levier du crédit.</strong> C'est le vrai avantage de l'immobilier sur tous les autres placements. Aucune banque ne te prêtera 200 000 € pour acheter des actions, mais elle le fera pour un appartement. Tu investis donc l'argent d'un autre, et les loyers de tes locataires remboursent une dette qui finance <em>ton</em> patrimoine.",
"<strong>Mécanisme 3 : l'appréciation du bien.</strong> C'est celui dont on parle le plus, et c'est le moins fiable. Les prix ont fortement monté sur certaines périodes et dans certaines villes, ils ont baissé ailleurs. <u>Personne ne peut prévoir l'évolution des prix, et un investissement qui n'est rentable que si le bien prend de la valeur est un pari, pas un investissement.</u>",
"<strong>Mécanisme 4 : l'effet de l'inflation sur la dette.</strong> Celui-ci est presque toujours oublié, et il est puissant. Tu rembourses une somme fixe pendant 20 ans, pendant que les loyers et les salaires progressent avec l'inflation. <strong>La mensualité devient donc mécaniquement plus légère avec le temps</strong>, sans qu'aucune décision de ta part n'intervienne.",
"Retiens la hiérarchie : <strong>un investissement immobilier doit tenir debout avec les mécanismes 1, 2 et 4 seulement.</strong> Si le calcul ne fonctionne qu'en supposant une hausse des prix, c'est que le prix d'achat est trop élevé.",
"Un dernier point d'honnêteté avant d'aller plus loin. L'immobilier locatif n'est pas un revenu passif. C'est une activité, avec des locataires, des travaux, des impayés possibles, de la vacance entre 2 locations, et une comptabilité. Ceux qui le présentent comme de l'argent qui tombe tout seul vendent en général une formation, pas un immeuble."
],
quiz:[
{q:"Quel est l'avantage propre à l'immobilier par rapport aux autres placements ?",opts:["Il ne baisse jamais","L'effet de levier du crédit, qu'aucune banque n'accorde pour d'autres actifs","Il est exonéré d'impôt","Il ne demande aucune gestion"],correct:1,
explain:"Une banque prête pour un appartement, jamais pour un portefeuille d'actions. C'est ce qui permet d'investir l'argent d'un autre."},
{q:"Quel mécanisme est le moins fiable ?",opts:["Le loyer","L'effet de levier","L'appréciation du bien","L'effet de l'inflation sur la dette"],correct:2,
explain:"Personne ne prévoit les prix. Un projet qui n'est rentable qu'en cas de hausse est un pari, donc un projet trop cher à l'achat."},
{q:"Pourquoi la mensualité s'allège-t-elle avec le temps ?",opts:["Parce que le taux baisse automatiquement","Parce qu'elle est fixe pendant que loyers et salaires progressent avec l'inflation","Parce que la banque réduit la dette","Parce que les impôts diminuent"],correct:1,
explain:"C'est l'effet le plus souvent oublié, et il joue en faveur de l'emprunteur sur toute la durée du crédit."}
],
action:"Avant toute recherche de bien, écris sur une feuille pourquoi tu veux investir dans l'immobilier : compléter tes revenus, préparer ta retraite, transmettre, ou te loger un jour. Cette raison déterminera le type de bien, la ville et la durée. Sans elle, tu chercheras au hasard."
},
{module:"Module 1 — Avant d'acheter quoi que ce soit", title:"Es-tu prêt ? Les 4 conditions préalables", duration:"5 min",
script:[
"L'immobilier locatif est le seul investissement où une erreur peut coûter des années de difficultés. Contrairement à un portefeuille d'actions, on ne vend pas un appartement en 3 clics. Ces 4 conditions ne sont donc pas des recommandations de confort, ce sont des garde-fous.",
"<strong>Condition 1 : un fonds d'urgence intact, distinct du projet.</strong> Un bien locatif génère ses propres imprévus : chaudière, ravalement voté par la copropriété, impayé, vacance de 3 mois. Si ton matelas a servi à l'apport, le premier incident se financera par un crédit à la consommation, et la rentabilité disparaîtra.",
"<strong>Condition 2 : une situation professionnelle stable.</strong> Ce n'est pas une question de morale mais de mécanique bancaire. Un crédit immobilier engage sur 20 ans, et une baisse de revenus en cours de route ne réduit pas la mensualité. Prévois aussi que ta capacité d'emprunt sera durablement mobilisée par ce projet.",
"<figure class=\"schema\"><svg viewBox=\"0 0 700 286\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"20\" y=\"202\" width=\"250\" height=\"52\" rx=\"9\" fill=\"#E7EFEA\" stroke=\"#1E4B3C\" stroke-width=\"1.4\"/><circle cx=\"46\" cy=\"228\" r=\"12\" fill=\"#1E4B3C\"/><text x=\"46\" y=\"232\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\" fill=\"#fff\">1</text><text x=\"70\" y=\"224\" font-family=\"Newsreader, Georgia, serif\" font-size=\"15\" font-weight=\"600\" fill=\"#12212B\">Un fonds d'urgence intact</text><text x=\"70\" y=\"241\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#43555F\">Le bien génère ses propres imprévus.</text><rect x=\"20\" y=\"138\" width=\"383\" height=\"52\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#DCDDD3\" stroke-width=\"1.4\"/><circle cx=\"46\" cy=\"164\" r=\"12\" fill=\"#DCDDD3\"/><text x=\"46\" y=\"168\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\" fill=\"#fff\">2</text><text x=\"70\" y=\"160\" font-family=\"Newsreader, Georgia, serif\" font-size=\"15\" font-weight=\"600\" fill=\"#12212B\">Une situation professionnelle stable</text><text x=\"70\" y=\"177\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#43555F\">Un crédit engage sur 20 ans.</text><rect x=\"20\" y=\"74\" width=\"517\" height=\"52\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#DCDDD3\" stroke-width=\"1.4\"/><circle cx=\"46\" cy=\"100\" r=\"12\" fill=\"#DCDDD3\"/><text x=\"46\" y=\"104\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\" fill=\"#fff\">3</text><text x=\"70\" y=\"96\" font-family=\"Newsreader, Georgia, serif\" font-size=\"15\" font-weight=\"600\" fill=\"#12212B\">De la trésorerie au-delà de l'apport</text><text x=\"70\" y=\"113\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#43555F\">7 à 8 % de frais dans l'ancien.</text><rect x=\"20\" y=\"10\" width=\"650\" height=\"52\" rx=\"9\" fill=\"#F6EFE0\" stroke=\"#B8862F\" stroke-width=\"1.4\"/><circle cx=\"46\" cy=\"36\" r=\"12\" fill=\"#B8862F\"/><text x=\"46\" y=\"40\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\" fill=\"#fff\">4</text><text x=\"70\" y=\"32\" font-family=\"Newsreader, Georgia, serif\" font-size=\"15\" font-weight=\"600\" fill=\"#12212B\">Accepter que ce soit une activité</text><text x=\"70\" y=\"49\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#43555F\">Quelques heures par mois, au minimum.</text></svg><figcaption>4 conditions préalables. S'il en manque une, ce n'est pas un problème d'immobilier mais un préalable à traiter.</figcaption></figure>",
"<strong>Condition 3 : de la trésorerie au-delà de l'apport.</strong> Beaucoup de primo-investisseurs découvrent tard le coût réel de l'entrée. Aux frais dits de notaire, qui représentent environ <strong>7 à 8 % dans l'ancien</strong> et <strong>2 à 3 % dans le neuf</strong>, s'ajoutent les éventuels frais d'agence, les travaux de remise en état, l'ameublement s'il s'agit d'un meublé, et les mois précédant la première location.",
"<strong>Condition 4 : accepter que ce soit une activité.</strong> Compte quelques heures par mois en gestion directe, plus les périodes intenses lors d'un changement de locataire. La gestion déléguée à une agence coûte généralement de <strong>6 à 10 % des loyers</strong>, ce qui doit figurer dans ton calcul de rentabilité dès le départ, et non être découvert après.",
"Une question de méthode pour finir, et elle vaut de l'argent. <u>Le pire moment pour évaluer un bien est celui où on l'a visité et qu'on l'aime.</u> Fixe tes critères et ton budget maximal <strong>avant</strong> de commencer les visites, écris-les, et considère que les modifier en cours de route est un signal d'alerte et non une adaptation."
],

explain:"Contre 2 à 3 % dans le neuf. Sur un bien à 150 000 €, cela représente environ 11 000 € à sortir en plus du prix."},
{q:"Pourquoi conserver son fonds d'urgence intact ?",opts:["Pour rassurer la banque","Parce qu'un bien locatif génère ses propres imprévus, chaudière, travaux, impayés","Pour payer les impôts","Ce n'est pas nécessaire avec un crédit"],correct:1,

},
{module:"Module 1 — Avant d'acheter quoi que ce soit", title:"Acheter sa résidence principale ou investir : le vrai calcul", duration:"5 min",
script:[
"La question revient dans presque toutes les conversations : faut-il d'abord acheter là où l'on vit ? La réponse habituelle, <em>« payer un loyer c'est jeter de l'argent par les fenêtres »</em>, est un slogan et non un raisonnement. Voici comment calculer.",
"Ce que rembourser un crédit a de différent d'un loyer, c'est qu'une partie construit un patrimoine. Mais seulement une partie. <strong>Les premières années d'un crédit, la mensualité est composée majoritairement d'intérêts</strong>, qui ne construisent rien, exactement comme un loyer. S'y ajoutent la taxe foncière, les charges de copropriété non récupérables et l'entretien, qui n'existent pas pour un locataire.",
"Le calcul honnête compare donc le loyer que tu paies au <strong>coût réel de la propriété</strong>, c'est-à-dire les intérêts plus la taxe foncière plus les charges plus l'entretien, en excluant la part de capital remboursée qui, elle, t'appartient.",
"S'y ajoute un élément décisif : <strong>les frais d'entrée et de sortie</strong>. Entre les frais de notaire à l'achat et les éventuels frais d'agence à la revente, il faut souvent que le bien prenne 10 % de valeur simplement pour rentrer dans ses frais. D'où la règle empirique la plus utile de cette leçon : <u>en dessous de 5 à 7 ans de détention prévisible, acheter sa résidence principale est rarement rentable</u>, sauf marché exceptionnellement porteur.",
"Il existe une stratégie intermédiaire que beaucoup ignorent, et qui convient particulièrement aux villes chères. Elle consiste à <strong>rester locataire là où l'on vit, et investir ailleurs</strong>, dans une ville au rapport prix sur loyer plus favorable. On conserve la mobilité professionnelle, on évite de mobiliser toute sa capacité d'emprunt sur un bien qui ne rapporte rien, et on construit un patrimoine qui, lui, génère des revenus.",
"Cette stratégie a ses contreparties, et elles sont réelles : gérer un bien à distance, ne pas bénéficier de l'exonération de plus-value réservée à la résidence principale, et supporter une fiscalité sur les loyers. Elle n'est donc pas supérieure, elle est différente. <strong>Ce qui compte, c'est de savoir que le choix existe</strong>, plutôt que d'acheter là où l'on vit par réflexe."
],
quiz:[
{q:"Quelle part de la mensualité ne construit aucun patrimoine ?",opts:["Le capital remboursé","Les intérêts","L'assurance seulement","Aucune"],correct:1,
explain:"Les intérêts sont l'équivalent d'un loyer versé à la banque, et ils dominent la mensualité les premières années."},
{q:"En dessous de quelle durée l'achat de sa résidence principale est-il rarement rentable ?",opts:["2 ans","5 à 7 ans","10 ans","15 ans"],correct:1,
explain:"Les frais d'entrée et de sortie imposent souvent une hausse de 10 % simplement pour rentrer dans ses frais."},
{q:"En quoi consiste la stratégie intermédiaire ?",opts:["Acheter 2 biens en même temps","Rester locataire là où l'on vit et investir dans une ville au rapport plus favorable","Acheter uniquement dans le neuf","Attendre une baisse des prix"],correct:1,
explain:"Elle préserve la mobilité et construit un patrimoine qui rapporte, au prix d'une gestion à distance et d'une fiscalité sur les loyers."}
],
action:"Compare ton loyer actuel au coût réel de la propriété pour un bien équivalent : intérêts de la première année, taxe foncière, charges non récupérables, entretien estimé à 1 % de la valeur du bien par an. Le résultat surprend souvent, dans un sens comme dans l'autre."
},
{module:"Module 2 — Calculer avant de visiter", title:"Rendement brut, net, net-net : les 3 chiffres", duration:"5 min",
script:[
"Toutes les annonces et tous les vendeurs parlent de rendement, et presque tous parlent du même : le brut, qui est aussi le plus flatteur et le moins utile. Savoir passer du brut au net-net est la compétence qui sépare un investisseur d'un acheteur.",
"<strong>Le rendement brut</strong> se calcule ainsi : loyer annuel divisé par le prix d'achat, multiplié par 100. Un bien à 150 000 € loué 700 € par mois affiche donc un brut de 5,6 %. C'est le chiffre des annonces, et il ignore absolument toutes les charges.",
"<strong>Le rendement net de charges</strong> retire ce que tu paies réellement chaque année : taxe foncière, charges de copropriété non récupérables, assurance propriétaire non occupant, éventuels frais de gestion, provision pour travaux, et provision pour vacance locative. Il faut aussi intégrer les frais d'acquisition au dénominateur, puisque tu les as réellement déboursés.",
"<figure class=\"schema\"><svg viewBox=\"0 0 700 228\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"200\" y=\"20\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" letter-spacing=\"1.4\" fill=\"#1E4B3C\">CE QUI EST ANNONCÉ</text><text x=\"560\" y=\"20\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" letter-spacing=\"1.4\" fill=\"#B8862F\">CE QUI RESTE VRAIMENT</text><text x=\"20\" y=\"44\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#43555F\">Rendement brut affiché</text><rect x=\"20\" y=\"54\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#EFF0EA\"/><rect x=\"20\" y=\"54\" width=\"627\" height=\"18\" rx=\"5\" fill=\"#E7EFEA\"/><rect x=\"647\" y=\"54\" width=\"33\" height=\"18\" rx=\"5\" fill=\"#F6EFE0\"/><text x=\"28\" y=\"67\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#1E4B3C\">5,6 %</text><text x=\"672\" y=\"67\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8E661F\"></text><text x=\"20\" y=\"100\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#43555F\">Après charges et frais d'acquisition</text><rect x=\"20\" y=\"110\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#EFF0EA\"/><rect x=\"20\" y=\"110\" width=\"422\" height=\"18\" rx=\"5\" fill=\"#E7EFEA\"/><rect x=\"442\" y=\"110\" width=\"238\" height=\"18\" rx=\"5\" fill=\"#F6EFE0\"/><text x=\"28\" y=\"123\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#1E4B3C\">3,8 %</text><text x=\"672\" y=\"123\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8E661F\"></text><text x=\"20\" y=\"156\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#43555F\">Après impôt et prélèvements sociaux</text><rect x=\"20\" y=\"166\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#EFF0EA\"/><rect x=\"20\" y=\"166\" width=\"297\" height=\"18\" rx=\"5\" fill=\"#E7EFEA\"/><rect x=\"317\" y=\"166\" width=\"363\" height=\"18\" rx=\"5\" fill=\"#F6EFE0\"/><text x=\"28\" y=\"179\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#1E4B3C\"></text><text x=\"672\" y=\"179\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8E661F\">2,5 à 3 %</text></svg><figcaption>Passer de 5,6 % à moins de 3 % est la norme, pas l'exception. Ne compare jamais 2 biens sur leur brut.</figcaption></figure>",
"Reprenons l'exemple. Prix 150 000 €, frais d'acquisition 11 000 €, soit 161 000 € engagés. Loyer annuel 8 400 €. Retirons 900 € de taxe foncière, 600 € de charges non récupérables, 150 € d'assurance, et une provision de 700 € pour vacance et travaux. Il reste 6 050 €. <strong>Le rendement net tombe à 3,8 %, contre 5,6 % annoncés.</strong>",
"<strong>Le rendement net-net</strong> retire enfin l'impôt, qui dépend de ton taux marginal et du régime choisi. Pour un contribuable imposé à 30 %, en location nue au régime micro-foncier, il faut compter environ <u>30 % plus 17,2 % de prélèvements sociaux sur 70 % du loyer</u>, ce qui ramène souvent le rendement final autour de 2,5 à 3 %.",
"Cet écart entre 5,6 % annoncés et moins de 3 % réels n'est pas une anomalie : <strong>c'est la norme</strong>. Il explique pourquoi tant d'investisseurs déçus découvrent que leur bien ne dégage aucun excédent une fois tout payé.",
"Ce qui donne la règle de travail : <u>ne compare jamais 2 biens sur leur rendement brut.</u> Calcule le net pour chacun, avec les mêmes hypothèses de vacance et de travaux, et compare seulement ces chiffres. Un bien à 4 % brut avec de faibles charges bat souvent un bien à 7 % brut dans une copropriété dégradée."
],
quiz:[
{q:"Comment se calcule le rendement brut ?",opts:["Loyer annuel divisé par le prix d'achat","Loyer mensuel divisé par la mensualité","Bénéfice annuel divisé par l'apport","Loyer annuel moins les charges"],correct:0,
explain:"C'est le chiffre des annonces. Il ignore la totalité des charges et des impôts."},
{q:"Quel ordre de grandeur sépare le brut du net-net ?",opts:["Ils sont presque identiques","Le net-net vaut souvent la moitié du brut","Le net-net est supérieur","L'écart dépasse rarement 0,5 point"],correct:1,
explain:"Passer de 5,6 % à moins de 3 % est la norme, pas l'exception. C'est ce qui déçoit tant d'investisseurs mal préparés."},
{q:"Sur quelle base comparer 2 biens ?",opts:["Leur rendement brut","Leur rendement net calculé avec les mêmes hypothèses","Leur prix au mètre carré","Leur ancienneté"],correct:1,
explain:"Un bien à 4 % brut avec de faibles charges bat souvent un bien à 7 % brut dans une copropriété dégradée."}
],
action:"Prends une annonce qui te plaît et calcule ses 3 rendements. Cherche la taxe foncière auprès du vendeur, les charges dans le dernier procès-verbal d'assemblée générale, et applique une provision de vacance de 1 mois par an. Le chiffre obtenu est le seul qui compte."
},
{module:"Module 2 — Calculer avant de visiter", title:"Le cash-flow, ce qui reste vraiment chaque mois", duration:"5 min",
script:[
"Le rendement mesure la performance de l'investissement. Le cash-flow mesure autre chose, et de plus immédiat : ce que l'opération met ou retire de ton compte chaque mois. C'est lui qui détermine si tu pourras tenir, et si tu pourras recommencer.",
"Le calcul est direct : loyer encaissé, moins mensualité de crédit, moins charges mensualisées, moins impôt mensualisé. Le résultat peut être positif, neutre ou négatif.",
"<strong>Un cash-flow négatif n'est pas nécessairement une erreur.</strong> Il signifie que tu complètes chaque mois, ce qui revient à épargner de force dans un actif que tu finiras par posséder. Beaucoup d'investissements dans les grandes villes fonctionnent ainsi, avec un effort d'épargne mensuel assumé et un pari sur la constitution du patrimoine.",
"Ce qui compte, c'est que <strong>l'effort soit choisi, chiffré et soutenable</strong>. Un complément de 150 € par mois pendant 20 ans représente 36 000 € de ta poche : c'est un projet d'épargne, il doit être décidé comme tel, pas subi.",
"<strong>Un cash-flow positif</strong> a un avantage décisif que peu de gens mesurent : il préserve ta capacité d'emprunt. Une opération qui s'autofinance ne pèse pas, ou peu, sur ton taux d'endettement, ce qui rend le deuxième achat possible. C'est la raison pour laquelle les investisseurs qui construisent un parc de plusieurs biens visent l'autofinancement, parfois au prix d'un rendement affiché plus modeste.",
"Deux réflexes de prudence pour finir. Premièrement, <strong>calcule toujours ton cash-flow avec 11 mois de loyer</strong>, jamais 12 : la vacance et les impayés existent, et un an sur dix se passe mal. Deuxièmement, prévois une provision pour travaux d'environ <u>5 à 10 % du loyer annuel</u>, parce qu'un bien vieillit et que la copropriété votera des travaux tôt ou tard.",
"Un cash-flow calculé sur 12 mois pleins et sans provision n'est pas un calcul optimiste, c'est un calcul faux."
],
quiz:[
{q:"Qu'indique un cash-flow négatif ?",opts:["Que l'investissement est raté","Que tu complètes chaque mois, ce qui revient à une épargne forcée","Que le loyer est illégal","Que la banque va refuser"],correct:1,
explain:"Ce n'est pas une erreur en soi, à condition que l'effort soit chiffré, choisi et soutenable dans la durée."},
{q:"Quel est l'avantage principal d'un cash-flow positif ?",opts:["Un rendement affiché plus élevé","Il préserve la capacité d'emprunt et permet un second achat","Il supprime l'impôt","Il réduit les frais de notaire"],correct:1,
explain:"Une opération qui s'autofinance pèse peu sur le taux d'endettement, ce qui rend le projet suivant possible."},
{q:"Sur combien de mois de loyer faut-il calculer ?",opts:["12 mois","11 mois","10 mois","13 mois avec les charges"],correct:1,
explain:"La vacance et les impayés existent. Calculer sur 12 mois pleins sans provision n'est pas optimiste, c'est faux."}
],
action:"Reprends ton annonce et calcule le cash-flow mensuel avec 11 mois de loyer et une provision de travaux. Si le résultat est négatif, écris le montant total que cela représente sur toute la durée du crédit. C'est ce chiffre-là que tu dois accepter, pas la mensualité."
},
{module:"Module 2 — Calculer avant de visiter", title:"Choisir l'emplacement avec des critères, pas des impressions", duration:"5 min",
script:[
"On répète que l'emplacement est le critère numéro un, ce qui est vrai mais inutile tant qu'on ne dit pas comment l'évaluer. Voici des indicateurs vérifiables, tous accessibles gratuitement.",
"<strong>Indicateur 1 : la tension locative.</strong> C'est le rapport entre la demande et l'offre de logements. En pratique, publie une annonce fictive au loyer envisagé, ou compte simplement le nombre de biens comparables disponibles sur les sites d'annonces. <u>Beaucoup d'offres et peu de demandes annoncent de la vacance</u>, quel que soit le rendement affiché.",
"<strong>Indicateur 2 : la démographie.</strong> Les données publiques de l'INSEE donnent l'évolution de la population d'une commune sur plusieurs années. Une ville qui perd des habitants depuis 10 ans posera un problème de revente et de relocation, même si les prix y semblent attractifs. C'est souvent parce qu'ils sont attractifs.",
"<strong>Indicateur 3 : l'emploi et les infrastructures.</strong> Un bassin d'emploi diversifié protège mieux qu'une ville dépendante d'une seule grande entreprise. Une gare, une université, un hôpital ou une zone d'activité créent une demande locative structurelle, indépendante de la conjoncture.",
"<strong>Indicateur 4 : le rapport prix sur loyer.</strong> Divise le prix moyen au mètre carré par le loyer moyen au mètre carré. Ce ratio permet de comparer objectivement 2 villes. Les métropoles les plus chères affichent des ratios élevés, donc des rendements faibles, tandis que des villes moyennes dynamiques offrent souvent le meilleur compromis.",
"Un point sur le micro-emplacement, trop souvent négligé au profit de la ville. <strong>Deux rues séparées de 300 mètres peuvent avoir des marchés locatifs radicalement différents.</strong> Va sur place, à des heures différentes, en semaine et le week-end, en soirée. Regarde les commerces ouverts, l'état des parties communes des immeubles voisins, la présence de transports.",
"Enfin, une mise en garde sur les <em>villes à fort rendement</em> mises en avant par certains vendeurs. Un rendement brut de 10 % annoncé signale presque toujours un risque proportionné : vacance élevée, dégradations, difficultés de revente, ou marché locatif fragile. <strong>Le rendement rémunère un risque, il ne l'annule pas.</strong>"
],
quiz:[
{q:"Comment vérifier concrètement la tension locative ?",opts:["En demandant à l'agence","En comptant les biens comparables disponibles ou en publiant une annonce test","En regardant le prix au mètre carré","En consultant le cadastre"],correct:1,
explain:"Beaucoup d'offres et peu de demandes annoncent de la vacance, quel que soit le rendement affiché."},
{q:"Que signale une ville qui perd des habitants depuis 10 ans ?",opts:["Une bonne affaire à saisir","Un risque de vacance et de difficulté à la revente","Rien de particulier","Une baisse prochaine des impôts"],correct:1,
explain:"Les prix y semblent souvent attractifs, et c'est précisément la conséquence du problème, pas une opportunité."},
{q:"Que signifie un rendement brut annoncé de 10 % ?",opts:["Une excellente affaire","Un risque proportionné : vacance, dégradations ou revente difficile","Une erreur de l'annonce","Un bien neuf"],correct:1,
explain:"Le rendement rémunère un risque, il ne le supprime pas. Un rendement anormalement élevé mérite d'être expliqué avant d'être accepté."}
],
action:"Choisis une ville qui t'intéresse et vérifie 3 choses en 20 minutes : l'évolution de sa population sur le site de l'INSEE, le nombre d'annonces de location comparables au loyer visé, et son rapport prix sur loyer. Ces 3 données valent mieux qu'une intuition."
},
{module:"Module 3 — Le financement", title:"Le crédit immobilier, ce qui se négocie vraiment", duration:"5 min",
script:[
"Le crédit est le cœur d'un investissement immobilier, et pourtant beaucoup d'emprunteurs ne négocient qu'une seule chose, le taux, en ignorant plusieurs leviers parfois plus rentables.",
"<strong>Levier 1 : le taux d'intérêt.</strong> C'est le plus visible. Retiens qu'un écart de 0,3 point sur 200 000 € empruntés sur 20 ans représente plusieurs milliers d'euros. Faire jouer la concurrence sur au moins 3 établissements, ou passer par un courtier, est presque toujours rentable au regard du temps investi.",
"<strong>Levier 2 : l'assurance emprunteur.</strong> C'est le poste le plus négligé et souvent le plus rentable. Elle peut représenter <u>de 20 à 30 % du coût total du crédit</u>, davantage encore pour les emprunteurs jeunes bénéficiant de taux d'intérêt bas. Or tu n'es pas obligé de prendre celle de la banque : la délégation d'assurance est un droit, et la résiliation est désormais possible à tout moment. L'économie atteint fréquemment plusieurs milliers d'euros.",
"<strong>Levier 3 : les frais de dossier et les pénalités.</strong> Les frais de dossier se négocient, et parfois s'annulent. Plus important encore, les <strong>indemnités de remboursement anticipé</strong> peuvent parfois être supprimées à la négociation : c'est précieux si tu envisages de revendre avant le terme, ce qui est fréquent en investissement locatif.",
"<strong>Levier 4 : la durée et la modularité.</strong> Une durée plus longue augmente le coût total mais améliore le cash-flow, ce qui peut être un choix assumé pour préserver la capacité d'emprunt. Demande aussi la possibilité de <strong>moduler les mensualités</strong> à la hausse ou à la baisse, et de suspendre quelques échéances : cette souplesse ne coûte souvent rien à la signature et vaut cher le jour où un locataire part.",
"Un mot sur l'apport. Les banques demandent généralement de couvrir au moins les frais d'acquisition. Mais en investissement locatif, <u>un apport plus faible n'est pas forcément un défaut</u> : il maximise l'effet de levier et préserve ta trésorerie pour les imprévus. À l'inverse, un apport important rassure la banque et améliore le taux. Il n'y a pas de réponse unique, seulement un arbitrage à faire consciemment.",
"Dernier conseil, et il change tout : <strong>obtiens un accord de principe avant de commencer les visites.</strong> Connaître son budget réel évite de tomber amoureux d'un bien hors de portée, et permet de faire une offre rapidement, ce qui est souvent décisif sur les biens intéressants."
],

{q:"Pourquoi négocier la suppression des indemnités de remboursement anticipé ?",opts:["Pour réduire la mensualité","Parce qu'une revente avant le terme est fréquente en locatif","Pour obtenir un meilleur taux","Parce que la loi l'impose"],correct:1,

{q:"Quand faut-il obtenir un accord de principe ?",opts:["Après avoir trouvé le bien","Avant de commencer les visites","Au moment du compromis","Après l'offre acceptée"],correct:1,

],
action:"Si tu as déjà un crédit immobilier, cherche dans ton offre de prêt le coût total de l'assurance emprunteur. Compare-le à une offre en délégation obtenue en ligne. Le changement est possible à tout moment, et l'écart dépasse souvent plusieurs milliers d'euros sur la durée restante."
},
{module:"Module 3 — Le financement", title:"Ce que la banque regarde, et comment présenter son dossier", duration:"5 min",
script:[
"Un dossier bien présenté obtient de meilleures conditions qu'un dossier équivalent mal présenté. Ce n'est ni une question de relations ni de chance : la banque évalue un risque, et ton travail consiste à le rendre lisible.",
"<strong>Le taux d'endettement</strong> est le premier filtre. Il rapporte tes charges de crédit à tes revenus, et la limite couramment appliquée se situe autour de <strong>35 % assurance comprise</strong>. Point important pour l'investissement locatif : les loyers attendus sont généralement pris en compte à hauteur de <u>70 % de leur montant</u>, l'abattement couvrant la vacance et les charges.",
"<strong>Le reste à vivre</strong> vient ensuite, et il est parfois plus déterminant que le taux d'endettement. C'est ce qui te reste une fois toutes les charges payées. Deux dossiers au même taux d'endettement ne se valent pas si l'un dispose de 800 € de reste à vivre et l'autre de 2 500 €.",
"<strong>Le comportement bancaire</strong> est examiné sur les 3 derniers mois de relevés, parfois 6. Ce que la banque cherche : des découverts, des rejets de prélèvement, des jeux d'argent, des crédits à la consommation multiples. <u>3 mois de relevés propres valent mieux qu'un long discours</u>, donc si tu envisages d'emprunter, commence par assainir tes comptes 3 à 6 mois avant de déposer le dossier.",
"<strong>L'épargne résiduelle</strong> après l'opération rassure fortement. Un emprunteur qui conserve plusieurs mois de charges de côté après avoir payé son apport présente un risque bien moindre, et cela se traduit souvent dans les conditions obtenues.",
"Sur la présentation du dossier, un conseil simple et rarement suivi. Prépare un document d'une page qui récapitule le projet : le bien, le prix, les frais, le loyer attendu justifié par des annonces comparables, le plan de financement, et le cash-flow prévisionnel calculé prudemment. <strong>Tu passes ainsi du statut de particulier qui demande à celui d'investisseur qui présente</strong>, et cela change la conversation.",
"Dernier point sur le refus. Un refus n'est pas une sentence : les politiques de risque varient fortement d'un établissement à l'autre et d'un mois à l'autre. Demande simplement le motif, corrige ce qui peut l'être, et présente ailleurs. <strong>Beaucoup de projets financés l'ont été au troisième établissement.</strong>"
],
quiz:[
{q:"À quelle hauteur les loyers attendus sont-ils généralement retenus ?",opts:["100 %","70 %","50 %","Ils ne sont pas pris en compte"],correct:1,
explain:"L'abattement de 30 % couvre la vacance et les charges. C'est une prudence appliquée par la plupart des établissements."},
{q:"Que regarde la banque dans les relevés bancaires ?",opts:["Le montant des courses","Les découverts, rejets de prélèvement et crédits à la consommation multiples","Le nombre de virements reçus","L'ancienneté du compte uniquement"],correct:1,
explain:"D'où l'intérêt d'assainir ses comptes 3 à 6 mois avant de déposer un dossier."},
{q:"Que faire après un refus bancaire ?",opts:["Renoncer au projet","Demander le motif, corriger et présenter ailleurs","Augmenter son apport de moitié","Attendre un an"],correct:1,
explain:"Les politiques de risque varient d'un établissement à l'autre. Beaucoup de projets financés l'ont été au troisième."}
],
action:"Regarde tes 3 derniers relevés bancaires avec les yeux d'un banquier. Note ce qui te ferait hésiter à ta place : un découvert, un crédit conso oublié, des dépenses irrégulières. C'est exactement ce qu'il faut corriger avant de déposer un dossier, et 3 mois suffisent."
},
{module:"Module 3 — Le financement", title:"Acheter seul, à plusieurs ou en société", duration:"5 min",
script:[
"La façon dont tu détiens un bien a des conséquences durables sur la fiscalité, la transmission et la capacité à sortir du projet. Cette décision se prend avant l'achat, car la modifier ensuite coûte des frais importants.",
"<strong>L'achat en nom propre</strong> est le plus simple, et il convient à la grande majorité des premiers investissements. Aucune formalité, aucune comptabilité au-delà du régime fiscal choisi, et un accès direct à tous les régimes vus dans la formation fiscale.",
"<strong>L'indivision</strong> survient dès que plusieurs personnes achètent ensemble sans structure. Chacun détient une quote-part. C'est simple à constituer et compliqué à vivre, pour une raison précise : <u>les décisions importantes nécessitent l'accord de tous, et chaque indivisaire peut demander à sortir de l'indivision à tout moment</u>, ce qui peut contraindre à vendre. C'est la source de conflits la plus fréquente entre proches.",
"<strong>La société civile immobilière</strong> répond à ce problème. Les associés détiennent des parts sociales, la gérance est organisée par les statuts, et les décisions suivent des règles écrites à l'avance. Elle facilite aussi la transmission progressive, par donation de parts, et évite l'indivision entre héritiers.",
"Ses contreparties sont réelles et souvent minimisées par ceux qui la recommandent trop vite : frais de création, obligations comptables et déclaratives annuelles, et surtout une règle à connaître absolument. <strong>Une société civile immobilière soumise à l'impôt sur le revenu ne peut pas louer en meublé de façon habituelle sans basculer à l'impôt sur les sociétés</strong>, ce qui change entièrement la fiscalité et rend l'option irréversible.",
"La question de l'impôt sur les sociétés mérite d'ailleurs une mise en garde. Ce régime permet d'amortir le bien et de réduire fortement l'imposition des loyers, ce qui séduit. Mais <u>la plus-value de revente y est calculée sur une valeur diminuée des amortissements</u>, ce qui produit souvent une facture élevée au moment de vendre. C'est un choix de long terme, cohérent pour de la détention patrimoniale, rarement pour un bien qu'on revendra dans 10 ans.",
"En résumé : <strong>pour un premier investissement seul, le nom propre suffit presque toujours.</strong> La société devient pertinente à plusieurs, ou dans une logique de transmission. Et dans ce cas, une consultation chez un notaire ou un expert-comptable avant l'achat coûte quelques centaines d'euros et évite des dizaines de milliers d'euros d'erreurs."
],
quiz:[
{q:"Quel est le principal risque de l'indivision ?",opts:["Une fiscalité plus lourde","Chaque indivisaire peut demander à sortir, ce qui peut contraindre à vendre","L'interdiction de louer","L'impossibilité d'emprunter"],correct:1,
explain:"C'est la source de conflits la plus fréquente entre proches, et elle se prévient par une société aux statuts écrits."},
{q:"Que se passe-t-il si une SCI à l'impôt sur le revenu loue en meublé de façon habituelle ?",opts:["Rien de particulier","Elle bascule à l'impôt sur les sociétés, de façon irréversible","Elle perd son statut de société","Les loyers deviennent exonérés"],correct:1,
explain:"C'est un piège classique, aux conséquences fiscales lourdes et définitives."},
{q:"Quel est l'inconvénient majeur de l'impôt sur les sociétés ?",opts:["Les loyers sont plus imposés","La plus-value de revente est calculée sur une valeur diminuée des amortissements","L'amortissement est interdit","Le crédit est refusé"],correct:1,
explain:"L'avantage annuel se paie au moment de la revente. Ce régime convient à la détention longue, rarement à une revente à 10 ans."}
],
action:"Si tu envisages d'acheter à plusieurs, pose-toi 3 questions avant de signer quoi que ce soit : que se passe-t-il si l'un veut vendre, si l'un ne peut plus payer sa part, ou si l'un décède ? Si vous n'avez pas les 3 réponses par écrit, l'indivision est prématurée."
},
{module:"Module 4 — Acheter sans se tromper", title:"La visite : les 12 points à vérifier", duration:"5 min",
script:[
"Une visite dure rarement plus de 20 minutes, et la plupart des acheteurs y regardent la décoration, c'est-à-dire précisément ce qui se change le plus facilement. Voici ce qu'il faut examiner à la place, dans l'ordre du coût de réparation.",
"<strong>Ce qui coûte très cher et se voit peu.</strong> La toiture et la charpente, à observer depuis la rue et depuis les combles s'ils sont accessibles. L'humidité, repérable aux odeurs, aux traces sur les plinthes et aux taches en bas des murs. Les fissures, en distinguant les micro-fissures de surface des fissures traversantes ou en escalier, qui sont un signal d'alerte majeur. L'installation électrique et la plomberie, dont l'ancienneté saute aux yeux au tableau électrique.",
"<strong>Ce qui pèse sur le loyer et la vacance.</strong> La luminosité et l'orientation, le vis-à-vis, le bruit selon l'heure, l'isolation phonique entre logements, et l'état général de la copropriété visible dans les parties communes. <u>Un hall dégradé annonce souvent une copropriété sans trésorerie</u>, donc des travaux votés en urgence et appelés en une fois.",
"<strong>Ce qui décide de la valeur future.</strong> Le diagnostic de performance énergétique, dont l'importance est devenue centrale. Les logements les plus mal classés font l'objet d'un calendrier progressif d'interdiction de mise en location, calendrier qui a évolué plusieurs fois. <strong>Un bien mal classé peut donc devenir non louable</strong>, ce qui explique des prix apparemment attractifs. C'est un point à vérifier précisément pour l'année en cours.",
"Les documents à réclamer valent souvent plus que la visite elle-même : les 3 derniers procès-verbaux d'assemblée générale, qui révèlent les conflits et les travaux votés ou reportés, le montant exact des charges et de la taxe foncière, le règlement de copropriété, et le carnet d'entretien de l'immeuble.",
"Une méthode simple pour ne pas se laisser emporter : <strong>visite toujours 2 fois, dont une seule</strong>, sans l'agent ni le vendeur si possible, et à une heure différente. La deuxième visite montre ce que la première a masqué, parce que l'émotion de la découverte est retombée.",
"Enfin, retiens la règle du chiffrage : <u>tout défaut identifié doit être chiffré avant l'offre, pas après</u>. Un devis, même approximatif, transforme une inquiétude vague en argument de négociation précis. C'est le moment où l'on récupère le plus d'argent sur toute l'opération."
],
quiz:[
{q:"Que révèle un hall d'immeuble dégradé ?",opts:["Un manque de goût des copropriétaires","Souvent une copropriété sans trésorerie, donc des travaux appelés en urgence","Un immeuble ancien","Rien de significatif"],correct:1,
explain:"Les parties communes sont le meilleur indicateur gratuit de la santé financière d'une copropriété."},
{q:"Quel document révèle le mieux la vie de la copropriété ?",opts:["Le règlement de copropriété","Les 3 derniers procès-verbaux d'assemblée générale","Le diagnostic amiante","Le plan cadastral"],correct:1,
explain:"Ils montrent les conflits, les travaux votés, ceux qui ont été reportés, et l'état des impayés."},
{q:"Quand faut-il chiffrer les travaux nécessaires ?",opts:["Après la signature","Avant de faire une offre","Au moment du prêt","Après la première année de location"],correct:1,
explain:"Un devis transforme une inquiétude vague en argument de négociation précis. C'est là qu'on récupère le plus d'argent."}
],
action:"Prépare une liste de visite sur ton téléphone avec les 12 points de cette leçon, et la liste des documents à réclamer. Le simple fait de sortir cette liste pendant la visite change la façon dont le vendeur et l'agent te répondent."
},
{module:"Module 4 — Acheter sans se tromper", title:"Négocier avec des arguments, pas avec de l'audace", duration:"5 min",
script:[
"La négociation immobilière n'est pas un rapport de force, c'est un travail de préparation. Celui qui arrive avec des chiffres obtient presque toujours davantage que celui qui propose un montant au hasard.",
"<strong>Premier travail : connaître le marché réel, pas les prix affichés.</strong> Les prix des annonces sont des demandes, pas des transactions. La base publique des demandes de valeurs foncières, accessible gratuitement en ligne, donne les prix réellement payés pour les ventes récentes, adresse par adresse. C'est l'outil le plus sous-utilisé par les acheteurs particuliers.",
"<strong>Deuxième travail : mesurer le temps de mise en vente.</strong> Un bien affiché depuis 4 mois dans un marché où la moyenne est de 6 semaines signale un prix trop élevé, et surtout un vendeur qui commence à douter. À l'inverse, une annonce publiée la veille laisse peu de marge.",
"<strong>Troisième travail : comprendre le vendeur.</strong> Une succession, un divorce, une mutation professionnelle ou un achat déjà engagé ailleurs créent une contrainte de délai. Cette question se pose simplement et directement à l'agent, qui y répond souvent sans difficulté : <em>pourquoi vendent-ils, et dans quel délai souhaitent-ils conclure ?</em>",
"La construction de l'offre suit alors une logique simple. Tu pars du prix du marché constaté, tu déduis les travaux chiffrés par devis, tu tiens compte des défauts objectifs et du temps de mise en vente. <strong>Une offre argumentée par écrit, même basse, se discute ; une offre basse sans explication se refuse.</strong>",
"Deux erreurs classiques à éviter. La première est de montrer son enthousiasme pendant la visite : dire qu'on adore un bien coûte cher quelques minutes plus tard. La seconde est de négliger ce qui se négocie en dehors du prix : la date de libération, le mobilier laissé sur place, la prise en charge de certains travaux par le vendeur, ou la répartition des frais d'assemblée générale à venir.",
"Enfin, un principe de discipline. <u>Fixe ton prix maximal par écrit avant la négociation, et considère-le comme définitif.</u> Le regret de laisser passer un bien est temporaire ; celui d'avoir surpayé un bien dure 20 ans, parce qu'il pèse sur chaque mensualité."
],
quiz:[
{q:"Où trouver les prix réellement payés ?",opts:["Dans les annonces immobilières","Dans la base publique des demandes de valeurs foncières","Auprès des agences uniquement","Sur les panneaux de vente"],correct:1,
explain:"Les annonces affichent des demandes, pas des transactions. Cette base gratuite donne les ventes réelles, adresse par adresse."},
{q:"Que signale un bien en vente depuis 4 mois dans un marché rapide ?",opts:["Un bien recherché","Un prix trop élevé et un vendeur qui commence à douter","Un problème juridique","Une erreur de l'agence"],correct:1,
explain:"Le temps de mise en vente est l'un des meilleurs indicateurs de marge de négociation disponible."},
{q:"Quelle offre a le plus de chances d'aboutir ?",opts:["Une offre basse sans explication","Une offre argumentée par écrit avec devis et prix du marché","Une offre au prix affiché","Une offre orale en fin de visite"],correct:1,
explain:"Une offre argumentée se discute, une offre basse sans explication se refuse sans réponse."}
],
action:"Choisis une rue qui t'intéresse et consulte la base des demandes de valeurs foncières pour connaître les prix réellement payés ces 2 dernières années. Compare-les aux annonces en cours : l'écart que tu constateras est ta marge de négociation moyenne sur ce secteur."
},
{module:"Module 4 — Acheter sans se tromper", title:"Du compromis à l'acte : ce qui se joue vraiment", duration:"5 min",
script:[
"Entre l'offre acceptée et la remise des clés s'écoulent généralement 3 à 4 mois. Cette période est mal comprise, alors qu'elle contient les principales protections de l'acheteur.",
"<strong>Le compromis de vente</strong> engage les 2 parties. L'acheteur verse en général un dépôt de garantie de <strong>5 à 10 % du prix</strong>, séquestré chez le notaire, et non versé au vendeur. Ce document fixe le prix, la date prévue de signature, et surtout les conditions suspensives.",
"<strong>Les conditions suspensives sont ta protection principale.</strong> Si l'une d'elles ne se réalise pas, la vente est annulée et le dépôt te revient intégralement. La plus importante est la condition d'obtention du prêt, dont la loi encadre la durée minimale. <u>Vérifie qu'elle mentionne un montant, un taux maximal et une durée cohérents avec ta demande réelle</u> : une condition rédigée avec un taux irréaliste ne te protège pas.",
"<figure class=\"schema\"><svg viewBox=\"0 0 700 168\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><line x1=\"34\" y1=\"96\" x2=\"666\" y2=\"96\" stroke=\"#DCDDD3\" stroke-width=\"2\"/><path d=\"M666 96 l-9 -5 v10 z\" fill=\"#DCDDD3\"/><line x1=\"47\" y1=\"96\" x2=\"47\" y2=\"62\" stroke=\"#1E4B3C\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/><circle cx=\"47\" cy=\"96\" r=\"7\" fill=\"#1E4B3C\"/><circle cx=\"47\" cy=\"96\" r=\"12\" fill=\"none\" stroke=\"#1E4B3C\" stroke-width=\"1\" opacity=\".35\"/><text x=\"47\" y=\"52\" text-anchor=\"start\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14\" font-weight=\"600\" fill=\"#12212B\">Offre acceptée</text><text x=\"47\" y=\"122\" text-anchor=\"start\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12\" fill=\"#43555F\">Rien n'est encore engagé</text><line x1=\"224\" y1=\"96\" x2=\"224\" y2=\"62\" stroke=\"#B8862F\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/><circle cx=\"224\" cy=\"96\" r=\"7\" fill=\"#B8862F\"/><circle cx=\"224\" cy=\"96\" r=\"12\" fill=\"none\" stroke=\"#B8862F\" stroke-width=\"1\" opacity=\".35\"/><text x=\"224\" y=\"52\" text-anchor=\"middle\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14\" font-weight=\"600\" fill=\"#12212B\">Compromis</text><text x=\"224\" y=\"122\" text-anchor=\"middle\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12\" fill=\"#43555F\">Dépôt de 5 à 10 %, conditions suspensives</text><line x1=\"363\" y1=\"96\" x2=\"363\" y2=\"62\" stroke=\"#A24332\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/><circle cx=\"363\" cy=\"96\" r=\"7\" fill=\"#A24332\"/><circle cx=\"363\" cy=\"96\" r=\"12\" fill=\"none\" stroke=\"#A24332\" stroke-width=\"1\" opacity=\".35\"/><text x=\"363\" y=\"52\" text-anchor=\"middle\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14\" font-weight=\"600\" fill=\"#12212B\">10 jours</text><text x=\"363\" y=\"122\" text-anchor=\"middle\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12\" fill=\"#43555F\">Délai de rétractation de l'acheteur</text><line x1=\"647\" y1=\"96\" x2=\"647\" y2=\"62\" stroke=\"#1E4B3C\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/><circle cx=\"647\" cy=\"96\" r=\"7\" fill=\"#1E4B3C\"/><circle cx=\"647\" cy=\"96\" r=\"12\" fill=\"none\" stroke=\"#1E4B3C\" stroke-width=\"1\" opacity=\".35\"/><text x=\"647\" y=\"52\" text-anchor=\"end\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14\" font-weight=\"600\" fill=\"#12212B\">Acte</text><text x=\"647\" y=\"122\" text-anchor=\"end\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12\" fill=\"#43555F\">3 à 4 mois plus tard</text></svg><figcaption>Entre l'offre et les clés, ce sont les conditions suspensives qui te protègent.</figcaption></figure>",
"D'autres conditions peuvent être ajoutées à la négociation, et elles sont trop rarement demandées : l'absence de servitude non déclarée, l'obtention d'une autorisation d'urbanisme si tu prévois des travaux, ou l'absence de procédure en cours dans la copropriété.",
"<strong>Le délai de rétractation</strong> de 10 jours bénéficie à l'acheteur non professionnel, à compter de la notification du compromis. Pendant ce délai, tu peux renoncer sans motif et sans pénalité. C'est une protection réelle, et c'est aussi le moment de faire relire le compromis par quelqu'un si un point te semble obscur.",
"Entre compromis et acte, le notaire mène les vérifications : titre de propriété, servitudes, hypothèques, droit de préemption de la commune, situation de la copropriété. <strong>C'est ce travail invisible qui justifie une grande partie des frais</strong>, dont il faut rappeler qu'ils sont composés très majoritairement de taxes reversées à l'État et aux collectivités, et non d'honoraires.",
"Un point pratique pour finir. <u>Le jour de l'acte, exige un état des lieux du bien juste avant la signature</u>, ou au minimum une visite de vérification. Le bien doit être conforme à celui visité : chaudière en place, équipements non démontés, aucun dégât nouveau. Une fois l'acte signé, les recours deviennent longs et incertains, alors qu'un problème constaté 1 heure avant se règle immédiatement sur le prix."
],
quiz:[
{q:"À quoi sert une condition suspensive ?",opts:["À reporter la date de signature","À annuler la vente et récupérer son dépôt si elle ne se réalise pas","À obtenir une remise","À éviter les frais de notaire"],correct:1,
explain:"C'est la protection principale de l'acheteur, à condition qu'elle soit rédigée avec des paramètres réalistes."},
{q:"Quelle est la durée du délai de rétractation de l'acheteur ?",opts:["48 heures","10 jours","1 mois","Il n'y en a pas"],correct:1,
explain:"À compter de la notification du compromis, sans motif ni pénalité. C'est aussi le bon moment pour faire relire le document."},
{q:"Que faut-il faire juste avant la signature de l'acte ?",opts:["Rien de particulier","Vérifier que le bien est conforme à celui visité","Renégocier le prix","Souscrire l'assurance habitation"],correct:1,
explain:"Un problème constaté 1 heure avant se règle sur le prix. Après signature, les recours sont longs et incertains."}
],
action:"Si tu es en cours d'achat, relis la condition suspensive de prêt de ton compromis et vérifie 3 paramètres : le montant emprunté, le taux maximal et la durée. S'ils ne correspondent pas à ta demande réelle auprès des banques, cette clause ne te protège pas."
},
{module:"Module 5 — Louer et gérer", title:"Choisir son mode de location", duration:"5 min",
script:[
"Le mode de location détermine le loyer, la fiscalité, la durée d'engagement et la charge de gestion. C'est une décision qui se prend avant l'achat, car elle influence le type de bien à rechercher.",
"<strong>La location nue</strong> est la plus simple. Le bail dure 3 ans renouvelables, le locataire reste souvent longtemps, et la gestion est légère. En contrepartie, le loyer est plus faible et la fiscalité plus lourde, puisque les revenus fonciers s'ajoutent au revenu imposable au barème progressif.",
"<strong>La location meublée</strong> offre un loyer généralement supérieur de <strong>10 à 20 %</strong>, un bail d'1 an renouvelable ou de 9 mois pour un étudiant, et surtout la fiscalité avantageuse vue dans la formation sur l'optimisation fiscale. Ses contreparties : il faut meubler, remplacer, et la rotation des locataires est plus rapide, donc la vacance plus fréquente.",

async function loadProgressFromServer(){
  const { data } = await sb
    .from('lesson_progress')
    .select('lesson_number, completed')
    .eq('user_id', CURRENT_USER.id)
    .eq('formation', FORMATION);
  const p = {};
  if(data){ data.forEach(function(row){ if(row.completed) p[row.lesson_number] = true; }); }
  PROGRESS_CACHE = p;
  return p;
}
function getProgress(){ return PROGRESS_CACHE; }
async function setProgressServer(lessonNumber, value){
  PROGRESS_CACHE[lessonNumber] = value;
  await sb.from('lesson_progress').upsert({
    user_id: CURRENT_USER.id,
    formation: FORMATION,
    lesson_number: lessonNumber,
    completed: value,
    completed_at: value ? new Date().toISOString() : null
  }, { onConflict: 'user_id,formation,lesson_number' });

  await majCarnet(lessonNumber, value);
}

/* Le carnet de route : l'action cochée s'inscrit dans le carnet personnel,
   la décocher l'en retire. Une erreur ici ne doit jamais bloquer la
   progression de la leçon, d'où le try/catch silencieux. */
async function majCarnet(lessonNumber, value){
  try {
    const l = LESSONS[lessonNumber - 1];
    if(!l) return;

    if(!value){
      await sb.from('carnet').delete()
        .eq('user_id', CURRENT_USER.id)
        .eq('formation', FORMATION)
        .eq('lesson_number', lessonNumber);
      return;
    }

    await sb.from('carnet').upsert({
      user_id: CURRENT_USER.id,
      formation: FORMATION,
      lesson_number: lessonNumber,
      titre: l.title || ('Leçon ' + lessonNumber),
      action: l.action || ''
    }, { onConflict: 'user_id,formation,lesson_number', ignoreDuplicates: true });
  } catch(e){
    console.warn('Carnet non mis à jour :', e);
  }
}

let current = parseInt(new URLSearchParams(location.search).get('l')) || 1;
if(current < 1) current = 1;
if(current > LESSONS.length) current = LESSONS.length;

function isUnlocked(n){
  if(n === 1) return true;
  const progress = getProgress();
  return !!progress[n-1];
}

function renderSidebar(){
  const progress = getProgress();
  const doneCount = Object.keys(progress).filter(function(k){ return progress[k]; }).length;
  document.getElementById('navProgress').textContent = doneCount + '/' + LESSONS.length + ' leçons';

  /* Regroupement des lecons par module : c'est le module qui devient
     l'etape de l'itineraire, la lecon n'est qu'un arret. */
  const etapes = [];
  LESSONS.forEach(function(l, i){
    const nom = l.module.split(' — ')[1] || l.module;
    let e = etapes.find(function(x){ return x.nom === nom; });
    if(!e){ e = { nom: nom, lecons: [] }; etapes.push(e); }
    e.lecons.push({ n: i + 1, titre: l.title });
  });

  const etapeCourante = etapes.findIndex(function(e){
    return e.lecons.some(function(a){ return a.n === current; });
  });

  const COCHE = '<svg viewBox="0 0 24 24" fill="none"><path d="M5 12L10 17L19 7" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  let html = '<div class="itin">' +
    '<div class="itin-tete">' +
      '<div class="itin-formation">' + NOM_FORMATION + '</div>' +
      '<div class="itin-compte">Étape ' + (etapeCourante + 1) + ' sur ' + etapes.length + ' · ' + doneCount + '/' + LESSONS.length + ' leçons</div>' +
      '<div class="itin-barre"><span style="width:' + Math.round(doneCount / LESSONS.length * 100) + '%"></span></div>' +
    '</div><div class="route">';

  etapes.forEach(function(e, idx){
    const toutesFaites = e.lecons.every(function(a){ return progress[a.n]; });
    const ici = idx === etapeCourante;
    const premiereAccessible = e.lecons.find(function(a){ return isUnlocked(a.n); });
    const classe = toutesFaites ? 'faite' : (ici ? 'ici' : '');
    const borne = toutesFaites ? COCHE : String(idx + 1);
    const cible = premiereAccessible ? premiereAccessible.n : e.lecons[0].n;

    html += '<div class="etape-i ' + classe + '">' +
      '<span class="borne">' + borne + '</span>' +
      '<button class="etape-titre" onclick="goTo(' + cible + ')">' + e.nom + '</button>' +
      '<div class="etape-meta">' + e.lecons.length + ' leçon' + (e.lecons.length > 1 ? 's' : '') + '</div>';

    /* On ne deroule que l'etape ou l'on se trouve : la carte reste lisible. */
    if(ici){
      html += '<div class="arrets">';
      e.lecons.forEach(function(a){
        const fait = !!progress[a.n];
        const ouvert = isUnlocked(a.n);
        const cl = (a.n === current ? 'ici ' : '') + (fait ? 'faite ' : '') + (ouvert ? '' : 'bloque');
        html += '<div class="arret ' + cl + '" onclick="goTo(' + a.n + ')">' +
          '<span class="puce">' + COCHE + '</span><span>' + a.titre + '</span></div>';
      });
      html += '</div>';
    }
    html += '</div>';
  });

  html += '</div>' + escaleHtml() + '</div>';
  document.getElementById('sidebar').innerHTML = html;
}

/* Changer de formation sans repasser par le menu. */
const PARCOURS = [
  { cle:'monnaie',     nom:'Comprendre la monnaie',   page:'lecons-monnaie.html' },
  { cle:'psychologie', nom:"Psychologie de l'argent", page:'lecons-psychologie.html' },
  { cle:'budget',      nom:'Maîtriser son budget',    page:'lecons-budget.html' },
  { cle:'bourse',      nom:'Premiers pas en bourse',  page:'lecons-bourse.html' },
  { cle:'crypto',      nom:'Bitcoin & cryptomonnaies',page:'lecons-crypto.html' },
  { cle:'immobilier',  nom:'Investir dans la pierre', page:'lecons-immobilier.html' },
  { cle:'epargne',     nom:'Épargne & sécurité',      page:'lecons-epargne.html' },
  { cle:'fiscalite',   nom:'Investir dans la pierre',    page:'lecons-fiscalite.html' }
];

function escaleHtml(){
  let h = '<div class="escale"><div class="escale-titre">Autres formations</div>';
  PARCOURS.forEach(function(p){
    const courante = p.cle === FORMATION;
    h += '<a href="' + p.page + '" class="' + (courante ? 'courante' : 'prete') + '">' +
      '<span class="jeton"></span><span>' + p.nom + '</span></a>';
  });
  h += '</div>';
  return h;
}

function goTo(n){
  if(!isUnlocked(n)){
    alert('Termine la leçon précédente pour débloquer celle-ci.');
    return;
  }
  current = n;
  history.replaceState(null, '', '?l=' + n);
  render();
  window.scrollTo(0,0);
}

let quizState = {};

function allQuizCorrect(l){
  for(let i=0;i<l.quiz.length;i++){ if(!quizState[i]) return false; }
  return true;
}

function render(){
  renderSidebar();
  const l = LESSONS[current-1];
  const progress = getProgress();
  const done = !!progress[current];
  quizState = {};
  if(done){ l.quiz.forEach(function(q,i){ quizState[i] = true; }); }
  const main = document.getElementById('main');
  let quizHtml = '';
  l.quiz.forEach(function(q, qi){
    let optsHtml = '';
    q.opts.forEach(function(opt, oi){
      const preAnswered = done && oi === q.correct;
      optsHtml += '<div class="quiz-opt ' + (preAnswered?'correct disabled':'') + '" id="q' + qi + 'o' + oi + '" onclick="answerQuiz(' + qi + ',' + oi + ',' + q.correct + ')">' +
        '<span class="quiz-letter">' + String.fromCharCode(65+oi) + '</span><span class="quiz-opt-text">' + opt + '</span></div>';
    });
    quizHtml += '<div class="quiz-card"><div class="quiz-q">Question ' + (qi+1) + '. ' + q.q + '</div>' + optsHtml +
      '<div class="quiz-explain ' + (done?'show':'') + '" id="exp' + qi + '"><strong>Explication : </strong>' + q.explain + '</div></div>';
  });

  const quizOk = allQuizCorrect(l);
  const actionCardStyle = (!quizOk && !done) ? 'opacity:.5;pointer-events:none;' : '';

  main.innerHTML =
    (done ? '<div class="completion-badge show">✓ Leçon terminée</div>' : '') +
    '<div class="lesson-eyebrow">' + l.module + '</div>' +
    '<div class="lesson-title">' + (current) + '. ' + l.title + '</div>' +
    '<div class="lesson-meta">' + l.duration + ' de lecture · Leçon ' + current + ' sur ' + LESSONS.length + '</div>' +
    '<div class="section-label"><span class="dot"></span>Comprendre</div>' +
    '<div class="script-text">' + l.script.map(function(p){
      return p.indexOf('<figure') === 0 ? p : '<p>' + p + '</p>';
    }).join('') + '</div>' +
    '<div class="section-label quiz"><span class="dot"></span>Vérifier</div>' +
    quizHtml +
    '<div class="section-label action"><span class="dot"></span>Petite action</div>' +
    (!quizOk && !done ? '<div style="font-size:12.5px;font-weight:600;color:var(--coral);margin-bottom:10px;">Réponds correctement aux ' + l.quiz.length + ' questions pour débloquer cette action.</div>' : '') +
    '<div class="action-card" id="actionCard" style="' + actionCardStyle + '">' +
      '<div class="action-text">' + l.action + '</div>' +
      '<div class="action-check" onclick="toggleAction()"><span class="action-box ' + (done?'checked':'') + '" id="actionBox">' + (done?'✓':'') + '</span><span class="action-label">Marquer cette leçon comme terminée</span></div>' +
    '</div>' +
    '<div class="lesson-nav">' +
      (current > 1 ? '<button class="nav-btn ghost" onclick="goTo(' + (current-1) + ')">← Leçon précédente</button>' : '<span></span>') +
      (current < LESSONS.length ? '<button class="nav-btn" onclick="goTo(' + (current+1) + ')">Leçon suivante →</button>' : '<a href="budget.html" class="nav-btn">Terminer le parcours →</a>') +
    '</div>';
}

function answerQuiz(qi, oi, correct){
  if(quizState[qi]) return; // déjà répondu correctement, verrouillé
  const chosen = document.getElementById('q'+qi+'o'+oi);
  if(chosen.classList.contains('disabled')) return;

  if(oi === correct){
    for(let k=0;k<10;k++){
      const el = document.getElementById('q'+qi+'o'+k);
      if(el){ el.classList.add('disabled'); }
    }
    chosen.classList.add('correct');
    quizState[qi] = true;
    document.getElementById('exp'+qi).classList.add('show');
    const l = LESSONS[current-1];
    const quizOk = allQuizCorrect(l);
    const card = document.getElementById('actionCard');
    if(quizOk && card){
      card.style.opacity = '';
      card.style.pointerEvents = '';
      const lock = card.previousElementSibling;
      if(lock && lock.textContent.indexOf('Réponds correctement') !== -1){ lock.style.display = 'none'; }
    }
  } else {
    chosen.classList.add('wrong');
    document.getElementById('exp'+qi).classList.add('show');
    setTimeout(function(){ chosen.classList.remove('wrong'); }, 900);
  }
}

async function toggleAction(){
  const l = LESSONS[current-1];
  const progress = getProgress();
  const newValue = !progress[current];
  if(newValue && !allQuizCorrect(l)){
    alert('Réponds correctement à toutes les questions du quiz avant de valider cette leçon.');
    return;
  }
  await setProgressServer(current, newValue);
  render();
}

async function boot(){
  document.getElementById('main').innerHTML = '<div style="padding:60px 0;text-align:center;color:var(--ink-faint);font-size:14px;">Chargement de ta progression…</div>';
  const user = await requireAuth();
  if(!user) return;
  const unlocked = await requireUnlock(user.id);
  if(!unlocked) return;
  CURRENT_USER = user;
  await loadProgressFromServer();

  if(!isUnlocked(current)){
    let lastUnlocked = 1;
    for(let i=1;i<=LESSONS.length;i++){ if(isUnlocked(i)) lastUnlocked = i; else break; }
    current = lastUnlocked;
    history.replaceState(null, '', '?l=' + current);
  }
  render();
}
boot();
</script>
