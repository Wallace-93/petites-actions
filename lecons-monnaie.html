<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comprendre la monnaie — Leçons — Petites Actions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --ink:#16181D;--ink-soft:#383B42;--ink-muted:#6B6F76;--ink-faint:#9498A0;
  --bg:#FFFFFF;--bg-soft:#F7F8FA;--bg-mid:#EEF0F3;--bg-line:#E3E6EA;
  --green:#16A34A;--green-light:#22C55E;--green-pale:#EDFBF1;--green-bord:#BBF0CC;
  --amber:#F59E0B;--amber-pale:#FFF7E8;--amber-bord:#FCE3A8;
  --violet:#7C5CFC;--violet-pale:#F1EEFE;--violet-bord:#D9D0FC;
  --coral:#FB6B4F;--coral-pale:#FFEEEA;
  --sans:'Inter',system-ui,-apple-system,sans-serif;
}
body{font-family:var(--sans);background:var(--bg-soft);color:var(--ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;}
a{color:inherit;}

/* NAV */
.nav{position:sticky;top:0;z-index:200;background:rgba(255,255,255,.96);backdrop-filter:blur(20px);border-bottom:1px solid var(--bg-line);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;font-weight:800;font-size:15px;color:var(--ink);}
.nav-mark{width:26px;height:26px;border-radius:8px;background:var(--green);display:flex;align-items:center;justify-content:center;}
.nav-mark svg{width:14px;height:14px;}
.nav-back{font-size:13px;font-weight:600;color:var(--ink-muted);text-decoration:none;}
.nav-progress-pill{font-size:12px;font-weight:700;color:var(--green);background:var(--green-pale);padding:5px 12px;border-radius:100px;}

/* LAYOUT */
.layout{display:grid;grid-template-columns:280px 1fr;max-width:1100px;margin:0 auto;min-height:calc(100vh - 60px);}
.sidebar{border-right:1px solid var(--bg-line);background:var(--bg);padding:24px 16px;position:sticky;top:60px;align-self:start;height:calc(100vh - 60px);overflow-y:auto;}
.sb-title{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);padding:0 10px;margin-bottom:12px;}
.sb-progress-bar{height:6px;background:var(--bg-mid);border-radius:100px;overflow:hidden;margin:0 10px 18px;}
.sb-progress-fill{height:100%;background:var(--green);border-radius:100px;transition:width .3s;}
.sb-item{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:10px;cursor:pointer;margin-bottom:2px;font-size:13px;font-weight:600;color:var(--ink-muted);transition:background .15s;}
.sb-item:hover{background:var(--bg-soft);}
.sb-item.active{background:var(--green-pale);color:var(--green);}
.sb-item.done{color:var(--ink);}
.sb-check{width:20px;height:20px;border-radius:50%;background:var(--bg-mid);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink-faint);flex-shrink:0;}
.sb-item.locked{opacity:.45;cursor:not-allowed;}
.sb-item.locked:hover{background:transparent;}
.sb-item.done .sb-check{background:var(--green);color:#fff;}
.sb-item.active .sb-check{background:var(--green);color:#fff;}
.sb-module-label{font-size:10.5px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em;padding:14px 10px 6px;}

/* MAIN */
.main{padding:36px 40px 80px;max-width:720px;}
.lesson-eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green);margin-bottom:10px;}
.lesson-title{font-size:28px;font-weight:800;letter-spacing:-.03em;color:var(--ink);margin-bottom:8px;line-height:1.15;}
.lesson-meta{font-size:13px;color:var(--ink-faint);margin-bottom:32px;}

.section-label{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-muted);margin:36px 0 16px;}
.section-label .dot{width:6px;height:6px;border-radius:50%;background:var(--green);}
.section-label.quiz .dot{background:var(--violet);}
.section-label.action .dot{background:var(--amber);}

.script-text p{font-size:15.5px;font-weight:400;color:var(--ink-soft);line-height:1.75;margin-bottom:18px;}

/* QUIZ */
.quiz-card{background:var(--bg);border:1px solid var(--bg-line);border-radius:16px;padding:24px;margin-bottom:14px;}
.quiz-q{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:16px;line-height:1.5;}
.quiz-opt{display:flex;align-items:flex-start;gap:12px;padding:13px 15px;border:1.5px solid var(--bg-line);border-radius:11px;margin-bottom:9px;cursor:pointer;transition:border-color .15s,background .15s;}
.quiz-opt:hover{border-color:var(--ink-faint);}
.quiz-opt.correct{border-color:var(--green);background:var(--green-pale);}
.quiz-opt.wrong{border-color:var(--coral);background:var(--coral-pale);}
.quiz-opt.disabled{cursor:default;pointer-events:none;}
.quiz-letter{width:24px;height:24px;border-radius:7px;background:var(--bg-soft);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--ink-muted);flex-shrink:0;}
.quiz-opt.correct .quiz-letter{background:var(--green);color:#fff;}
.quiz-opt.wrong .quiz-letter{background:var(--coral);color:#fff;}
.quiz-opt-text{font-size:13.5px;font-weight:500;color:var(--ink);padding-top:2px;}
.quiz-explain{display:none;font-size:13px;font-weight:400;color:var(--ink-muted);line-height:1.6;background:var(--bg-soft);border-radius:10px;padding:14px 16px;margin-top:8px;}
.quiz-explain.show{display:block;}
.quiz-explain strong{color:var(--ink);}

/* ACTION */
.action-card{background:var(--amber-pale);border:1px solid var(--amber-bord);border-radius:16px;padding:22px 24px;}
.action-text{font-size:14.5px;font-weight:500;color:var(--ink);line-height:1.65;margin-bottom:16px;}
.action-check{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;}
.action-box{width:22px;height:22px;border-radius:7px;border:2px solid var(--amber);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;transition:background .15s;}
.action-box.checked{background:var(--amber);}
.action-label{font-size:13px;font-weight:700;color:#8a6a00;}

/* NAV BUTTONS */
.lesson-nav{display:flex;justify-content:space-between;align-items:center;margin-top:40px;padding-top:24px;border-top:1px solid var(--bg-line);}
.nav-btn{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border:none;cursor:pointer;font-family:var(--sans);font-size:14px;font-weight:700;padding:13px 24px;border-radius:11px;text-decoration:none;transition:background .2s;}
.nav-btn:hover{background:var(--ink-soft);}
.nav-btn.ghost{background:var(--bg-mid);color:var(--ink-muted);}
.nav-btn.ghost:hover{background:var(--bg-line);}
.nav-btn:disabled{opacity:.4;cursor:not-allowed;}
.completion-badge{display:none;align-items:center;gap:8px;background:var(--green-pale);color:var(--green);font-size:12.5px;font-weight:700;padding:8px 16px;border-radius:100px;margin-bottom:20px;}
.completion-badge.show{display:inline-flex;}

@media(max-width:860px){
  .layout{grid-template-columns:1fr;}
  .sidebar{position:static;height:auto;border-right:none;border-bottom:1px solid var(--bg-line);}
  .main{padding:28px 20px 60px;}
}
</style>
</head>

<script>
/* ============ DONNÉES DES 14 LEÇONS ============ */
const LESSONS = [
{module:"Module 1 — Qu'est-ce que la monnaie ?", title:"L'origine de la monnaie", duration:"8 min",
script:[
"Avant de parler d'investissement, de bourse ou d'épargne, il y a une question que presque personne ne se pose vraiment. Qu'est-ce que l'argent ? Pas au sens philosophique. Au sens concret, mécanique. D'où vient-il ? Pourquoi existe-t-il ? Et pourquoi est-ce que ça change tout de le comprendre ?",
"Remontons quelques milliers d'années en arrière. À l'origine, les êtres humains échangeaient directement ce qu'ils produisaient. Un agriculteur échangeait du blé contre du bois. Un pêcheur échangeait du poisson contre des vêtements. C'est ce qu'on appelle le troc.",
"Le problème du troc, c'est qu'il exige une double coïncidence des besoins. Il faut que tu aies exactement ce que l'autre veut, au moment où il le veut. C'est lourd, lent, et très limité.",
"Les sociétés humaines ont alors inventé un intermédiaire accepté par tous en échange de n'importe quoi. Les premières formes de monnaie ont été des coquillages, du sel, du bétail. Puis les métaux précieux, le cuivre, l'argent, l'or.",
"Pourquoi l'or ? Parce qu'il est rare, ne rouille pas, est facilement divisible, et sa quantité ne peut pas être manipulée facilement. C'est là que se trouve la première leçon fondamentale : une bonne monnaie est avant tout une réserve de valeur fiable. Ce n'est pas juste un bout de papier ou un chiffre sur un écran. C'est un outil qui doit préserver la valeur de votre travail dans le temps.",
"Retenez bien cette phrase, parce que tout ce qui suit dans cette formation va tourner autour d'elle."
],
quiz:[
{q:"Quel était le principal problème du système de troc ?",opts:["Il était trop lent à mettre en place","Il nécessitait que chaque partie ait exactement ce que l'autre voulait","Il ne fonctionnait qu'entre voisins","Il était réservé aux marchands"],correct:1,
explain:"Le troc exige une « double coïncidence des besoins » : les deux parties doivent vouloir exactement ce que l'autre propose, au même moment. C'est ce qui le rend très limité."},
{q:"Pourquoi l'or s'est-il imposé comme monnaie ?",opts:["Parce qu'il était beau et décoratif","Parce que les rois le décidaient","Parce qu'il est rare, durable, divisible et non manipulable","Parce qu'il était facile à trouver"],correct:2,
explain:"L'or coche les quatre critères d'une bonne monnaie : rareté, durabilité, divisibilité et résistance à la manipulation."},
{q:"Qu'est-ce qu'une bonne monnaie doit être avant tout ?",opts:["Contrôlée par un gouvernement stable","Disponible en grande quantité","Une réserve de valeur fiable dans le temps","Facile à imprimer"],correct:2,
explain:"La fonction première d'une monnaie saine est de préserver la valeur du travail fourni dans le temps."}
],
action:"Ce soir, prends 5 minutes et note : à quoi as-tu consacré la majorité de ton énergie ce mois-ci ? Maintenant demande-toi : est-ce que la monnaie que tu reçois en échange préserve vraiment la valeur de cet effort dans le temps ?"
},
{module:"Module 1 — Qu'est-ce que la monnaie ?", title:"Les 3 fonctions d'une monnaie saine", duration:"10 min",
script:[
"Dans la leçon précédente, on a vu pourquoi la monnaie a été inventée. Aujourd'hui on va voir pourquoi toutes les monnaies ne se valent pas, à travers trois fonctions qu'une monnaie saine doit remplir.",
"Première fonction : l'unité de compte. Une monnaie sert à mesurer la valeur des choses, un langage commun aux échanges. Elle doit être stable pour que les mesures aient du sens.",
"Deuxième fonction : le moyen d'échange. La monnaie sert à acheter et à vendre. Pour remplir cette fonction, elle doit être largement acceptée, facile à transporter, et divisible.",
"Troisième fonction : la réserve de valeur. C'est là que ça devient crucial, et c'est là que beaucoup de monnaies modernes échouent. Une monnaie qui joue ce rôle permet de conserver le fruit de son travail dans le temps.",
"Or l'inflation érode en permanence le pouvoir d'achat des monnaies modernes. L'euro d'aujourd'hui achète moins que l'euro d'il y a dix ans. Une monnaie qui échoue à remplir la troisième fonction vous vole silencieusement, chaque année, mécaniquement.",
"C'est pour ça que laisser son argent dormir sur un compte courant n'est pas une décision neutre. C'est une décision qui coûte."
],
quiz:[
{q:"Quelle est la fonction d'unité de compte ?",opts:["Permettre d'acheter des biens partout dans le monde","Mesurer et comparer la valeur des choses avec un langage commun","Garantir que l'argent garde sa valeur dans le temps","Faciliter les échanges entre pays"],correct:1,
explain:"L'unité de compte est le « mètre étalon » de l'économie. Elle permet de comparer des choses très différentes."},
{q:"Quelle fonction les monnaies modernes comme l'euro remplissent-elles mal ?",opts:["L'unité de compte","Le moyen d'échange","La réserve de valeur","Aucune, l'euro remplit toutes ses fonctions"],correct:2,
explain:"L'inflation érode en permanence le pouvoir d'achat de l'euro, qui perd donc sa capacité à préserver la valeur du travail dans le temps."},
{q:"Laisser son argent sur un compte courant est une décision :",opts:["Neutre, l'argent ne perd pas de valeur s'il ne bouge pas","Sage, mieux vaut ne prendre aucun risque","Coûteuse, l'inflation réduit sa valeur chaque année","Dépend du montant épargné"],correct:2,
explain:"L'inflation tourne autour de 3 à 5% par an. Un compte courant à 0% perd donc réellement de la valeur chaque année."}
],
action:"Prends un relevé bancaire d'il y a un an. Compare le solde à aujourd'hui. Applique mentalement le taux d'inflation de l'année (environ 3-4%) et calcule ce que ce solde représente vraiment en pouvoir d'achat réel."
},
{module:"Module 1 — Qu'est-ce que la monnaie ?", title:"Pourquoi la monnaie n'est pas la richesse", duration:"9 min",
script:[
"On va parler d'une confusion que presque tout le monde fait, et qui coûte très cher à ceux qui ne la voient pas : la monnaie n'est pas la richesse.",
"Imaginez un pays qui multiplie par dix la quantité de billets en circulation. Est-ce que ce pays est dix fois plus riche ? Non. Il y a toujours le même nombre de maisons, de voitures, de denrées disponibles. Seul le nombre de billets a changé, et chaque billet vaut mécaniquement dix fois moins.",
"La monnaie est un outil de représentation. Elle représente de la valeur, mais elle n'est pas la valeur elle-même. La vraie richesse, ce sont les actifs réels : une maison, un terrain, une entreprise, des compétences.",
"L'histoire nous donne des exemples frappants : l'hyperinflation en Allemagne dans les années 1920, le Zimbabwe dans les années 2000, plus récemment le Venezuela. Ce ne sont pas des accidents, mais les conséquences logiques d'un système où la monnaie est créée sans lien avec la richesse réelle.",
"L'euro est stable comparé à ces exemples extrêmes, mais il perd environ 2 à 4% de valeur chaque année. Sur 20 ans, c'est considérable.",
"La vraie question n'est pas combien j'ai sur mon compte, mais combien d'actifs réels je possède. C'est tout l'objet des formations suivantes."
],
quiz:[
{q:"Si un gouvernement multiplie par dix la quantité de billets en circulation, que se passe-t-il ?",opts:["Le pays devient dix fois plus riche","Les prix baissent car il y a plus d'argent disponible","Chaque billet vaut dix fois moins, la richesse réelle ne change pas","L'économie se stabilise grâce à la liquidité supplémentaire"],correct:2,
explain:"Multiplier la quantité de monnaie ne crée pas de richesse réelle. Les biens et services disponibles restent les mêmes."},
{q:"Qu'est-ce que la richesse réelle ?",opts:["Le solde de son compte bancaire","Des actifs ayant une valeur intrinsèque, indépendante des décisions monétaires","La quantité de billets que l'on possède","Un salaire élevé et stable"],correct:1,
explain:"La richesse réelle, ce sont des actifs comme l'immobilier, les métaux précieux, les entreprises, les compétences."},
{q:"Quelle est la vraie question à se poser concernant son patrimoine ?",opts:["Combien ai-je d'argent sur mon compte en banque ?","Mon salaire augmente-t-il chaque année ?","Combien d'actifs réels est-ce que je possède ?","Est-ce que mon livret A est bien rempli ?"],correct:2,
explain:"Accumuler de la monnaie n'est pas la même chose que construire de la richesse."}
],
action:"Fais deux colonnes : dans la première, note tout ce que tu possèdes en monnaie. Dans la seconde, tout ce que tu possèdes en actifs réels. Regarde l'équilibre entre les deux."
},
{module:"Module 2 — L'étalon-or et sa disparition", title:"Bretton Woods", duration:"10 min",
script:[
"Juillet 1944. Le monde est encore en guerre mais les Alliés réfléchissent déjà à l'après. La Première Guerre mondiale avait laissé un chaos économique mondial qui avait contribué aux conditions ayant mené à la Seconde Guerre.",
"44 pays se réunissent dans un hôtel du New Hampshire pour créer un nouveau système monétaire mondial, ancré dans quelque chose de réel. La solution : toutes les monnaies seront indexées sur le dollar américain, et le dollar sur l'or, à 35 dollars l'once.",
"N'importe quelle banque centrale peut échanger ses dollars contre de l'or physique. Ce système crée une limite naturelle à la création monétaire.",
"Le système fonctionne bien pendant 30 ans. Mais les États-Unis dépensent massivement (guerre du Vietnam, programmes sociaux) et impriment trop de dollars. En 1971, leurs réserves d'or ne représentent plus qu'une fraction des dollars en circulation.",
"Bretton Woods était une tentative de créer un système ancré dans la réalité, avec une discipline imposée par l'or. Cette discipline a été respectée jusqu'à devenir trop contraignante pour ceux qui tenaient les rênes."
],
quiz:[
{q:"Quelle était l'idée centrale de Bretton Woods ?",opts:["Créer une monnaie unique mondiale","Indexer toutes les monnaies sur le dollar, lui-même indexé sur l'or","Donner aux États-Unis le contrôle total de l'économie mondiale","Interdire aux pays de créer leur propre monnaie"],correct:1,
explain:"Ce double ancrage créait une discipline naturelle sur la création monétaire."},
{q:"À quel taux le dollar était-il convertible en or ?",opts:["10 dollars l'once","100 dollars l'once","35 dollars l'once","Le taux variait selon les marchés"],correct:2,
explain:"N'importe quelle banque centrale pouvait échanger ses dollars contre de l'or à ce taux fixe."},
{q:"Pourquoi le système a-t-il commencé à vaciller dans les années 60 ?",opts:["L'or est devenu trop rare","Les États-Unis ont imprimé trop de dollars par rapport à leurs réserves d'or","Les autres pays ont refusé le dollar","Une crise mondiale a rendu le système obsolète"],correct:1,
explain:"Les dépenses massives américaines ont conduit à l'impression de plus de dollars que les réserves d'or ne pouvaient couvrir."}
],
action:"Cherche « Bretton Woods 1944 résumé » et lis un contenu de 3-5 minutes sur le sujet. Note une idée qui t'a frappé et que tu n'avais pas retenue de la leçon."
},
{module:"Module 2 — L'étalon-or et sa disparition", title:"1971, le tournant Nixon", duration:"10 min",
script:[
"Le 15 août 1971. Richard Nixon annonce à la télévision la suspension de la convertibilité du dollar en or. La promesse de Bretton Woods est rompue, unilatéralement.",
"Ce moment s'appelle le Nixon Shock. Avant 1971, il y avait une limite naturelle à la création monétaire. Après, cette limite disparaît. Le dollar devient une monnaie fiduciaire, du latin « fides », la confiance.",
"Quand la contrainte de l'or disparaît, les banques centrales créent de la monnaie de façon beaucoup plus agressive. En 1971, la masse monétaire américaine était d'environ 600 milliards de dollars. Aujourd'hui elle dépasse les 20 000 milliards. Multiplication par plus de 30 en 50 ans.",
"C'est pour ça que l'immobilier, les actions, l'or ont explosé. Ce n'est pas que ces actifs valent tellement plus. C'est que la monnaie avec laquelle on les mesure vaut tellement moins.",
"Le monde dans lequel vous gérez votre argent aujourd'hui est directement le produit de cette décision prise un dimanche soir en 1971."
],
quiz:[
{q:"Qu'a annoncé Nixon le 15 août 1971 ?",opts:["La création d'une nouvelle monnaie mondiale","La suspension de la convertibilité du dollar en or","La fin des échanges commerciaux internationaux","La création du FMI"],correct:1,
explain:"Cette décision a définitivement rompu le lien entre le dollar et l'or établi à Bretton Woods."},
{q:"Qu'est-ce qu'une monnaie fiduciaire ?",opts:["Une monnaie garantie par des réserves d'or","Une monnaie émise uniquement par les banques privées","Une monnaie dont la valeur repose sur la confiance, non sur un actif réel","Une monnaie utilisée pour les transactions internationales"],correct:2,
explain:"« Fiduciaire » vient du latin « fides », confiance. Elle ne vaut que parce que les gens y croient."},
{q:"Par combien la masse monétaire américaine a-t-elle été multipliée depuis 1971 ?",opts:["Par 3","Par 10","Par plus de 30","Par 5"],correct:2,
explain:"De 600 milliards à plus de 20 000 milliards de dollars en 50 ans."}
],
action:"Tape « WTFHappenedin1971 » dans ton navigateur. Parcours les graphiques 5 minutes. Note celui qui t'a le plus frappé."
},
{module:"Module 2 — L'étalon-or et sa disparition", title:"Ce qui a changé depuis", duration:"11 min",
script:[
"Qu'est-ce qui a vraiment changé depuis 1971 ? Premier changement : la création monétaire est devenue illimitée. La crise 2008 et le Covid en 2020 ont vu des milliers de milliards créés en quelques semaines.",
"Deuxième changement : la dette est devenue le moteur de l'économie. La dette publique mondiale a explosé, et elle ne sera jamais remboursée au sens traditionnel : elle sera restructurée ou diluée par l'inflation.",
"Troisième changement : l'épargne traditionnelle est devenue une stratégie perdante. Un livret A à 3% avec une inflation à 5%, c'est une perte nette de 2% par an, silencieuse mais certaine.",
"Quatrième changement : les actifs réels sont devenus indispensables. Les grandes fortunes ne gardent pas leurs richesses en cash, elles les gardent dans des choses qui résistent à l'inflation.",
"La bonne nouvelle : comprendre ce système est désormais accessible à tous. Il manquait juste quelqu'un pour l'expliquer clairement. C'est ce que Petites Actions est là pour faire."
],
quiz:[
{q:"Depuis 1971, qu'est-il arrivé à la création monétaire ?",opts:["Elle est restée stable","Elle a diminué","Elle est devenue illimitée, sans contrainte liée à l'or","Elle a été confiée aux marchés privés"],correct:2,
explain:"Sans la contrainte de l'or, les banques centrales peuvent créer de la monnaie par simple décision."},

/* ============ GATE D'ACCÈS ============ */
(function(){
  try{
    const u = JSON.parse(localStorage.getItem('pa_user'));
    if(!u || !u.email){
      window.location.href = 'inscription.html?redirect=lecons-monnaie.html';
    }
  }catch(e){
    window.location.href = 'inscription.html?redirect=lecons-monnaie.html';
  }
})();

/* ============ MOTEUR ============ */
const KEY = 'pa_progress_monnaie';
function getProgress(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
function setProgress(p){ localStorage.setItem(KEY, JSON.stringify(p)); }

let current = parseInt(new URLSearchParams(location.search).get('l')) || 1;
if(current < 1) current = 1;
if(current > LESSONS.length) current = LESSONS.length;
// isUnlocked defined below; re-clamp after definition happens in render() via goTo guard on load

function isUnlocked(n){
  if(n === 1) return true;
  const progress = getProgress();
  return !!progress[n-1];
}

function renderSidebar(){
  const progress = getProgress();
  const doneCount = Object.keys(progress).filter(k=>progress[k]).length;
  document.getElementById('navProgress').textContent = doneCount + '/' + LESSONS.length + ' leçons';
  const sb = document.getElementById('sidebar');
  let html = '<div class="sb-progress-bar"><div class="sb-progress-fill" style="width:' + Math.round(doneCount/LESSONS.length*100) + '%"></div></div>';
  let lastModule = '';
  LESSONS.forEach(function(l, i){
    const n = i+1;
    if(l.module !== lastModule){ html += '<div class="sb-module-label">' + l.module.split(' — ')[0] + '</div>'; lastModule = l.module; }
    const isDone = !!progress[n];
    const isActive = n === current;
    const unlocked = isUnlocked(n);
    const lockedClass = unlocked ? '' : 'locked';
    let iconContent = n;
    if(isDone) iconContent = '✓';
    else if(!unlocked) iconContent = '🔒';
    html += '<div class="sb-item ' + (isActive?'active':'') + ' ' + (isDone?'done':'') + ' ' + lockedClass + '" onclick="goTo(' + n + ')">' +
      '<span class="sb-check">' + iconContent + '</span>' + l.title + '</div>';
  });
  sb.innerHTML = html;
}

function goTo(n){
  if(!isUnlocked(n)){
    alert('Termine la leçon précédente pour débloquer celle-ci.');
    return;
  }
  current = n;
  history.replaceState(null, '', '?l=' + n);
  render();
  window.scrollTo(0,0);
}

function render(){
  renderSidebar();
  const l = LESSONS[current-1];
  const progress = getProgress();
  const done = !!progress[current];
  const main = document.getElementById('main');
  let quizHtml = '';
  l.quiz.forEach(function(q, qi){
    let optsHtml = '';
    q.opts.forEach(function(opt, oi){
      optsHtml += '<div class="quiz-opt" id="q' + qi + 'o' + oi + '" onclick="answerQuiz(' + qi + ',' + oi + ',' + q.correct + ')">' +
        '<span class="quiz-letter">' + String.fromCharCode(65+oi) + '</span><span class="quiz-opt-text">' + opt + '</span></div>';
    });
    quizHtml += '<div class="quiz-card"><div class="quiz-q">Question ' + (qi+1) + '. ' + q.q + '</div>' + optsHtml +
      '<div class="quiz-explain" id="exp' + qi + '"><strong>Explication : </strong>' + q.explain + '</div></div>';
  });

  main.innerHTML =
    (done ? '<div class="completion-badge show">✓ Leçon terminée</div>' : '') +
    '<div class="lesson-eyebrow">' + l.module + '</div>' +
    '<div class="lesson-title">' + (current) + '. ' + l.title + '</div>' +
    '<div class="lesson-meta">' + l.duration + ' de lecture · Leçon ' + current + ' sur ' + LESSONS.length + '</div>' +
    '<div class="section-label"><span class="dot"></span>Comprendre</div>' +
    '<div class="script-text">' + l.script.map(function(p){return '<p>'+p+'</p>';}).join('') + '</div>' +
    '<div class="section-label quiz"><span class="dot"></span>Vérifier</div>' +
    quizHtml +
    '<div class="section-label action"><span class="dot"></span>Petite action</div>' +
    '<div class="action-card">' +
      '<div class="action-text">' + l.action + '</div>' +
      '<div class="action-check" onclick="toggleAction()"><span class="action-box ' + (done?'checked':'') + '" id="actionBox">' + (done?'✓':'') + '</span><span class="action-label">Marquer cette leçon comme terminée</span></div>' +
    '</div>' +
    '<div class="lesson-nav">' +
      (current > 1 ? '<button class="nav-btn ghost" onclick="goTo(' + (current-1) + ')">← Leçon précédente</button>' : '<span></span>') +
      (current < LESSONS.length ? '<button class="nav-btn" onclick="goTo(' + (current+1) + ')">Leçon suivante →</button>' : '<a href="monnaie.html" class="nav-btn">Terminer le parcours →</a>') +
    '</div>';
}

function answerQuiz(qi, oi, correct){
  for(let k=0;k<10;k++){
    const el = document.getElementById('q'+qi+'o'+k);
    if(el){ el.classList.add('disabled'); }
  }
  const chosen = document.getElementById('q'+qi+'o'+oi);
  const correctEl = document.getElementById('q'+qi+'o'+correct);
  if(oi === correct){ chosen.classList.add('correct'); }
  else { chosen.classList.add('wrong'); correctEl.classList.add('correct'); }
  document.getElementById('exp'+qi).classList.add('show');
}

function toggleAction(){
  const progress = getProgress();
  progress[current] = !progress[current];
  setProgress(progress);

  const allDone = LESSONS.every(function(l,i){ return !!progress[i+1]; });
  if(allDone){
    localStorage.setItem('pa_completed_monnaie', 'true');
    setTimeout(function(){ window.location.href = 'succes.html'; }, 600);
    return;
  }
  render();
}

if(!isUnlocked(current)){
  const progress = getProgress();
  let lastUnlocked = 1;
  for(let i=1;i<=LESSONS.length;i++){ if(isUnlocked(i)) lastUnlocked = i; else break; }
  current = lastUnlocked;
  history.replaceState(null, '', '?l=' + current);
}
render();
</script>
