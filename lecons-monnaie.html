<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --ink:#171C45;--ink-soft:#44496B;--ink-muted:#6B7094;--ink-faint:#9599B5;
  --bg:#FFFFFF;--bg-soft:#F6F7FB;--bg-mid:#F0F1F7;--bg-line:#DCDEEA;
  --green:#2B3A8F;--green-light:#3B4BA8;--green-pale:#E9EBF7;--green-bord:#C5CAEB;
  --amber:#C27C00;--amber-pale:#FDF2DA;--amber-bord:#F0D49A;
  --violet:#4D5675;--violet-pale:#EEF0F5;--violet-bord:#D5D9E6;
  --coral:#A3213D;--coral-pale:#FAEAEE;
  --sans:'Archivo',system-ui,-apple-system,sans-serif;
  --display:'Archivo',system-ui,sans-serif;
  --mono:'Archivo',system-ui,sans-serif;
}
body{font-family:var(--sans);background:var(--bg-soft);color:var(--ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;}
a{color:inherit;}

.nav{position:sticky;top:0;z-index:200;background:rgba(255,255,255,.96);backdrop-filter:blur(20px);border-bottom:1px solid var(--bg-line);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;font-weight:800;font-size:15px;color:var(--ink);}
.nav-mark{width:26px;height:26px;border-radius:8px;background:var(--green);display:flex;align-items:center;justify-content:center;}
.nav-mark svg{width:14px;height:14px;}
.nav-back{font-size:13px;font-weight:600;color:var(--ink-muted);text-decoration:none;}
.nav-progress-pill{font-size:12px;font-weight:700;color:var(--green);background:var(--green-pale);padding:5px 12px;border-radius:100px;}

.layout{display:grid;grid-template-columns:280px 1fr;max-width:1100px;margin:0 auto;min-height:calc(100vh - 60px);}
.sidebar{border-right:1px solid var(--bg-line);background:var(--bg);padding:24px 16px;position:sticky;top:60px;align-self:start;height:calc(100vh - 60px);overflow-y:auto;}
.sb-progress-bar{height:6px;background:var(--bg-mid);border-radius:100px;overflow:hidden;margin:0 10px 18px;}
.sb-progress-fill{height:100%;background:var(--green);border-radius:100px;transition:width .3s;}
.sb-item{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:10px;cursor:pointer;margin-bottom:2px;font-size:13px;font-weight:600;color:var(--ink-muted);transition:background .15s;}
.sb-item:hover{background:var(--bg-soft);}
.sb-item.active{background:var(--green-pale);color:var(--green);}
.sb-item.done{color:var(--ink);}
.sb-item.locked{opacity:.45;cursor:not-allowed;}
.sb-item.locked:hover{background:transparent;}
.sb-check{width:20px;height:20px;border-radius:50%;background:var(--bg-mid);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink-faint);flex-shrink:0;}
.sb-item.done .sb-check{background:var(--green);color:#fff;}
.sb-item.active .sb-check{background:var(--green);color:#fff;}
.sb-module-label{font-size:13.5px;font-weight:700;color:var(--ink-faint);text-transform:none;letter-spacing:0;padding:14px 10px 6px;}

.main{padding:36px 40px 80px;max-width:720px;}
.lesson-eyebrow{font-size:13.5px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--green);margin-bottom:10px;}
.lesson-title{font-size:28px;font-weight:800;letter-spacing:-.03em;color:var(--ink);margin-bottom:8px;line-height:1.15;}
.lesson-meta{font-size:13px;color:var(--ink-faint);margin-bottom:32px;}

.section-label{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:800;letter-spacing:0;text-transform:none;color:var(--ink-muted);margin:36px 0 16px;}
.section-label .dot{width:6px;height:6px;border-radius:50%;background:var(--green);}
.section-label.quiz .dot{background:var(--violet);}
.section-label.action .dot{background:var(--amber);}

.script-text p{font-size:15.5px;font-weight:400;color:var(--ink-soft);line-height:1.75;margin-bottom:18px;}

.quiz-card{background:var(--bg);border:1px solid var(--bg-line);border-radius:16px;padding:24px;margin-bottom:14px;}
.quiz-q{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:16px;line-height:1.5;}
.quiz-opt{display:flex;align-items:flex-start;gap:12px;padding:13px 15px;border:1.5px solid var(--bg-line);border-radius:11px;margin-bottom:9px;cursor:pointer;transition:border-color .15s,background .15s;}
.quiz-opt:hover{border-color:var(--ink-faint);}
.quiz-opt.correct{border-color:var(--green);background:var(--green-pale);}
.quiz-opt.wrong{border-color:var(--coral);background:var(--coral-pale);}
.quiz-opt.disabled{cursor:default;pointer-events:none;}
.quiz-letter{width:24px;height:24px;border-radius:7px;background:var(--bg-soft);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--ink-muted);flex-shrink:0;}
.quiz-opt.correct .quiz-letter{background:var(--green);color:#fff;}
.quiz-opt.wrong .quiz-letter{background:var(--coral);color:#fff;}
.quiz-opt-text{font-size:13.5px;font-weight:500;color:var(--ink);padding-top:2px;}
.quiz-explain{display:none;font-size:13px;font-weight:400;color:var(--ink-muted);line-height:1.6;background:var(--bg-soft);border-radius:10px;padding:14px 16px;margin-top:8px;}
.quiz-explain.show{display:block;}
.quiz-explain strong{color:var(--ink);}

.action-card{background:var(--amber-pale);border:1px solid var(--amber-bord);border-radius:16px;padding:22px 24px;}
.action-text{font-size:14.5px;font-weight:500;color:var(--ink);line-height:1.65;margin-bottom:16px;}
.action-check{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;}
.action-box{width:22px;height:22px;border-radius:7px;border:2px solid var(--amber);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;transition:background .15s;}
.action-box.checked{background:var(--amber);}
.action-label{font-size:13px;font-weight:700;color:#8a6a00;}

.lesson-nav{display:flex;justify-content:space-between;align-items:center;margin-top:40px;padding-top:24px;border-top:1px solid var(--bg-line);}
.nav-btn{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border:none;cursor:pointer;font-family:var(--sans);font-size:14px;font-weight:700;padding:13px 24px;border-radius:11px;text-decoration:none;transition:background .2s;}
.nav-btn:hover{background:var(--ink-soft);}
.nav-btn.ghost{background:var(--bg-mid);color:var(--ink-muted);}
.nav-btn.ghost:hover{background:var(--bg-line);}
.completion-badge{display:none;align-items:center;gap:8px;background:var(--green-pale);color:var(--green);font-size:12.5px;font-weight:700;padding:8px 16px;border-radius:100px;margin-bottom:20px;}
.completion-badge.show{display:inline-flex;}

@media(max-width:860px){
  .layout{grid-template-columns:1fr;}
  .sidebar{position:static;height:auto;border-right:none;border-bottom:1px solid var(--bg-line);}
  .main{padding:28px 20px 60px;}
}

/* ===== Direction Encre & Laiton — surcouche typographique ===== */
body{font-family:var(--sans);letter-spacing:0;}
h1,h2,h3,h4,.hero-h1,.s-title,.cta-h2,.p-name,.mod-title,.c-title,.hc-title,
.lecon-title,.q-title,.auth-title,.perf-title,.section-title,.edu-title,.tips-title{
  font-family:var(--display);letter-spacing:-.015em;
}
.hero-h1,.s-title,.cta-h2,.auth-title{font-weight:500;letter-spacing:-.018em;line-height:1.16;}
h3,h4,.p-name,.mod-title,.c-title,.hc-title,.lecon-title{font-weight:600;}
.s-tag,.f-copy,.hstat-label,.stat-label,.perf-note,.order-meta,.pos-value,
.price-cell,.asset-label,.badge,.eyebrow,.nav-balance{font-family:var(--mono);}

.nav-name em,.ft-name em{font-style:normal;color:var(--amber);}

/* Mise en valeur dans le corps des lecons : le gras porte la notion a
   retenir, l italique la nuance ou le terme technique. */
.script-text strong{color:var(--ink,#171C45);font-weight:700;}
.script-text em{font-style:italic;color:var(--ink-soft,#44496B);}
.script-text u{text-decoration:none;background:linear-gradient(transparent 62%,var(--amber-pale,#FDF2DA) 62%);
  box-shadow:inset 0 -1px 0 var(--amber,#C27C00);}
.script-text p + p{margin-top:14px;}

/* ===== L'itineraire =====
   Une route verticale plutot qu'une liste : on voit d'ou l'on vient,
   ou l'on est, et ce qu'il reste. Meme vocabulaire graphique que le
   carnet de route et les emblemes. */
.itin{padding:4px 4px 24px;}
.itin-tete{padding:0 8px 16px;border-bottom:1px solid var(--bg-line);margin-bottom:16px;}
.itin-formation{font-family:var(--display);font-size:16px;font-weight:600;color:var(--ink);line-height:1.25;}
.itin-compte{font-family:var(--mono);font-size:13.5px;letter-spacing:0;text-transform:none;
  color:var(--ink-muted);margin-top:7px;}
.itin-barre{height:4px;background:var(--bg-mid);border-radius:100px;overflow:hidden;margin-top:10px;}
.itin-barre span{display:block;height:100%;background:var(--amber);border-radius:100px;transition:width .4s cubic-bezier(.4,0,.2,1);}

/* La route */
.route{position:relative;padding-left:30px;}
.route::before{content:"";position:absolute;left:11px;top:14px;bottom:14px;width:2px;
  background:repeating-linear-gradient(var(--bg-line) 0 6px, transparent 6px 11px);}
.etape-i{position:relative;margin-bottom:6px;}
.borne{position:absolute;left:-30px;top:6px;width:24px;height:24px;border-radius:50%;
  background:var(--bg);border:2px solid var(--bg-line);display:grid;place-items:center;
  font-family:var(--mono);font-size:10px;color:var(--ink-faint);z-index:1;transition:all .2s;}
.borne svg{width:11px;height:11px;}
.etape-i.faite .borne{background:var(--amber);border-color:var(--amber);color:#fff;}
.etape-i.ici .borne{background:var(--green);border-color:var(--green);color:#fff;
  box-shadow:0 0 0 4px var(--green-pale);}
.etape-titre{display:block;width:100%;text-align:left;background:transparent;border:0;cursor:pointer;
  font-family:var(--display);font-size:14.5px;font-weight:600;color:var(--ink-soft);
  padding:7px 9px;border-radius:9px;line-height:1.3;transition:background .15s,color .15s;}
.etape-titre:hover{background:var(--bg-soft);color:var(--ink);}
.etape-i.ici .etape-titre{color:var(--green);}
.etape-i.faite .etape-titre{color:var(--ink);}
.etape-meta{font-family:var(--mono);font-size:10px;color:var(--ink-faint);padding:0 9px 4px;letter-spacing:.06em;}

/* Les lecons de l'etape en cours */
.arrets{margin:2px 0 12px;padding-left:9px;border-left:1px solid var(--bg-line);}
.arret{display:flex;align-items:flex-start;gap:9px;padding:7px 9px;border-radius:8px;cursor:pointer;
  font-size:12.8px;font-weight:500;color:var(--ink-muted);transition:background .15s;line-height:1.35;}
.arret:hover{background:var(--bg-soft);color:var(--ink);}
.arret.ici{background:var(--green-pale);color:var(--green);font-weight:700;}
.arret.faite{color:var(--ink);}
.arret.bloque{opacity:.42;cursor:not-allowed;}
.arret.bloque:hover{background:transparent;}
.puce{width:15px;height:15px;border-radius:4px;flex:none;margin-top:1px;border:1.5px solid var(--bg-line);
  display:grid;place-items:center;background:var(--bg);}
.puce svg{width:9px;height:9px;opacity:0;}
.arret.faite .puce{background:var(--amber);border-color:var(--amber);}
.arret.faite .puce svg{opacity:1;}
.arret.ici .puce{border-color:var(--green);border-style:dashed;}

/* Changer de formation sans repasser par le menu */
.escale{margin-top:22px;padding-top:16px;border-top:1px solid var(--bg-line);}
.escale-titre{font-family:var(--mono);font-size:13.5px;letter-spacing:0;text-transform:none;
  color:var(--ink-faint);padding:0 9px 9px;}
.escale a{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;text-decoration:none;
  font-size:12.8px;color:var(--ink-soft);transition:background .15s;}
.escale a:hover{background:var(--bg-soft);color:var(--ink);}
.escale a.courante{background:var(--green-pale);color:var(--green);font-weight:700;}
.jeton{width:7px;height:7px;border-radius:50%;background:var(--bg-line);flex:none;}
.escale a.courante .jeton{background:var(--green);}
.escale a.prete .jeton{background:var(--amber);}

@media(max-width:860px){
  .itin{padding-bottom:8px;}
  .route{padding-left:26px;}
  .borne{left:-26px;}
}
@media(prefers-reduced-motion:reduce){*{transition:none !important;}}

/* ===== Schemas des lecons ===== */
.schema{margin:26px 0;padding:20px 18px 14px;border:1px solid var(--bg-line,#DCDEEA);
  border-radius:12px;background:var(--bg,#FFFFFF);}
.schema svg{width:100%;height:auto;display:block;}
.schema figcaption{font-family:var(--mono,'Archivo',sans-serif);font-size:11.5px;line-height:1.55;
  color:var(--ink-muted,#6B7094);margin-top:14px;padding-top:12px;
  border-top:1px solid var(--bg-line,#DCDEEA);}
@media(max-width:620px){.schema{padding:14px 12px 10px;margin:20px -6px;}}

/* Sortie de leçon : on peut toujours s'arrêter sans se sentir coincé. */
.lesson-sortie{display:flex;flex-wrap:wrap;align-items:center;gap:9px;justify-content:center;
  margin-top:24px;padding-top:18px;border-top:1px solid var(--bg-line);
  font-size:13.5px;color:var(--ink-faint);}
.lesson-sortie a{color:var(--ink-muted);text-decoration:none;font-weight:600;}
.lesson-sortie a:hover{color:var(--green);}

.bandeau-verrou{background:var(--amber-pale,#FDF2DA);border:1px solid #F0D49A;border-radius:11px;
  padding:14px 18px;margin-bottom:22px;font-size:14.5px;color:#7A4D00;line-height:1.6;}
.bandeau-verrou strong{color:#5C3A00;}

/* La porte d'inscription, en fin de module ouvert. */
.porte{background:var(--green-pale,#E9EBF7);border:1px solid #C5CAEB;border-radius:14px;
  padding:26px 26px 24px;margin-top:32px;}
.porte-sur{font-family:var(--mono,'Archivo',sans-serif);font-size:13.5px;letter-spacing:0;
  text-transform:none;color:var(--green,#2B3A8F);margin-bottom:10px;}
.porte-titre{font-family:var(--display,'Archivo',sans-serif);font-size:22px;font-weight:600;
  color:var(--ink,#171C45);line-height:1.2;margin-bottom:9px;}
.porte-txt{font-size:15px;color:var(--ink-soft,#44496B);line-height:1.62;margin-bottom:18px;max-width:60ch;}
.porte-btns{display:flex;flex-wrap:wrap;gap:10px;}
.porte-btns .nav-btn.ghost{background:transparent;color:var(--ink,#171C45);border:1px solid var(--bg-line,#DCDEEA);}
.porte-note{font-family:var(--mono,'Archivo',sans-serif);font-size:11px;color:var(--ink-faint,#6B7094);margin-top:14px;}
</style>

<script>
/* ============ DONNÉES DES 16 LEÇONS — MAÎTRISER SON BUDGET ============ */
const LESSONS = [
{module:"Module 1 — Qu'est-ce que la monnaie ?", title:"L'origine de la monnaie", duration:"5 min",
script:[
"Avant de parler d'épargne ou d'investissement, il faut répondre à une question que presque personne ne se pose : <strong>qu'est-ce que l'argent, exactement ?</strong> Pas à quoi il sert, mais ce qu'il est. Quand on sait ce qu'est l'argent, on s'en sert autrement. C'est pour ça qu'on commence par là.",
"Imagine un monde sans monnaie. Tu es boulanger et tu veux des chaussures. Tu dois trouver un cordonnier qui veut du pain, au même moment, et qui pense qu'une paire de chaussures vaut exactement ton pain. Ça arrive rarement. Les économistes appellent ce problème <em>la double coïncidence des besoins</em>. La monnaie a été inventée pour le régler.",
"Partout dans le monde, les gens ont trouvé la même solution : choisir un objet que tout le monde accepte. Le boulanger vend son pain contre cet objet, puis utilise cet objet pour acheter des chaussures. <strong>La monnaie n'a donc pas été inventée par l'État, mais par le commerce.</strong>",
"Au fil de l'histoire, beaucoup de choses ont servi de monnaie : coquillages, sel, bétail, barres de fer, perles de verre. Le mot <em>salaire</em> vient d'ailleurs du sel, qui servait à payer les soldats romains. Toutes ces monnaies ont disparu, toujours pour la même raison : <u>quand un objet devient trop facile à fabriquer, il ne vaut plus rien</u>.",
"L'exemple le plus parlant, ce sont les perles de verre en Afrique de l'Ouest. Elles ont servi de monnaie pendant des siècles, car elles étaient difficiles à fabriquer sur place. Puis les Européens sont arrivés avec des perles fabriquées en usine, pour presque rien. En quelques dizaines d'années, l'épargne de générations entières n'a plus rien valu. Pas parce que les gens avaient mal travaillé, mais <strong>parce que quelqu'un pouvait fabriquer leur monnaie plus vite qu'eux ne pouvaient l'épargner.</strong>",
"Retiens bien cette idée : toute la formation en découle. Si l'or a fini par s'imposer, c'est justement parce qu'il échappe à ce problème. Personne ne peut en fabriquer. Il faut l'extraire du sol, et ça coûte cher.",
"Une dernière idée, plus profonde. Quand tu reçois ton salaire, tu ne reçois pas vraiment des euros. <strong>Tu reçois un droit sur le travail des autres</strong> : le droit de demander plus tard un objet ou un service à quelqu'un que tu ne connais pas. La monnaie, c'est du temps de travail mis de côté. Quand elle perd de la valeur, c'est donc ton travail passé qui s'efface."
],
quiz:[
{q:"Quel problème la monnaie a-t-elle résolu ?",opts:["Le manque de matières premières","La double coïncidence des besoins dans le troc","Le besoin de payer des impôts","L'absence de banques"],correct:1,
explain:"Il fallait qu'un boulanger voulant des chaussures trouve un cordonnier voulant du pain, au même moment et pour la même valeur. La monnaie supprime cette contrainte."},
{q:"Pourquoi les perles de verre ont-elles cessé d'être une monnaie ?",opts:["Les gens ont préféré l'or","Elles sont devenues faciles à produire en masse","Un roi les a interdites","Elles se cassaient trop facilement"],correct:1,
explain:"Quand un bien devient facile à produire, l'épargne accumulée dans ce bien s'efface. C'est le mécanisme central de toute cette formation."},
{q:"Que représente vraiment ton salaire ?",opts:["Un objet","Un droit sur le travail futur des autres","Une dette envers l'État","Une part de la richesse du pays"],correct:1,
explain:"C'est du temps de travail mis de côté. Quand la monnaie perd de la valeur, c'est ce travail passé qui s'efface."}
],
action:"Ce soir, prends une dépense que tu prévois et calcule combien d'heures de travail elle te coûte : divise son prix par ce que tu gagnes en une heure (net). Ce chiffre, c'est le vrai prix. Il change souvent la décision."
},
{module:"Module 1 — Qu'est-ce que la monnaie ?", title:"Les 3 fonctions d'une monnaie saine", duration:"5 min",
script:[
"Une monnaie a 3 rôles. Et quand elle se dégrade, elle les perd toujours dans le même ordre. Les connaître t'aide à comprendre ce qui se passe avec l'euro aujourd'hui, et ce qui s'est passé ailleurs avec des monnaies qui se sont effondrées.",
"<strong>Rôle 1 : servir aux échanges.</strong> C'est le plus visible. La monnaie sert à acheter et à vendre sans troc. L'euro le fait parfaitement, et c'est pour ça que la plupart des gens n'ont jamais pensé aux 2 autres rôles.",
"<strong>Rôle 2 : mesurer la valeur.</strong> La monnaie sert à comparer le prix des choses. C'est grâce à elle qu'on peut dire qu'un vélo vaut 3 fois plus qu'un manteau. Une bonne mesure doit rester stable : personne n'accepterait un mètre qui raccourcit chaque année. Pourtant, on accepte une monnaie qui perd de la valeur.",
"<figure class=\"schema\"><svg viewBox=\"0 0 700 228\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"200\" y=\"20\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" letter-spacing=\"1.4\" fill=\"#2B3A8F\">L'EURO LE FAIT BIEN</text><text x=\"560\" y=\"20\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" letter-spacing=\"1.4\" fill=\"#C27C00\">L'EURO LE FAIT MAL</text><text x=\"20\" y=\"44\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">Servir aux échanges du quotidien</text><rect x=\"20\" y=\"54\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#F0F1F7\"/><rect x=\"20\" y=\"54\" width=\"614\" height=\"18\" rx=\"5\" fill=\"#E9EBF7\"/><rect x=\"634\" y=\"54\" width=\"46\" height=\"18\" rx=\"5\" fill=\"#FDF2DA\"/><text x=\"28\" y=\"67\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#2B3A8F\">excellent</text><text x=\"672\" y=\"67\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8F5F00\"></text><text x=\"20\" y=\"100\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">Mesurer et comparer les prix</text><rect x=\"20\" y=\"110\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#F0F1F7\"/><rect x=\"20\" y=\"110\" width=\"475\" height=\"18\" rx=\"5\" fill=\"#E9EBF7\"/><rect x=\"495\" y=\"110\" width=\"185\" height=\"18\" rx=\"5\" fill=\"#FDF2DA\"/><text x=\"28\" y=\"123\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#2B3A8F\">correct</text><text x=\"672\" y=\"123\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8F5F00\"></text><text x=\"20\" y=\"156\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">Conserver la valeur sur 20 ans</text><rect x=\"20\" y=\"166\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#F0F1F7\"/><rect x=\"20\" y=\"166\" width=\"79\" height=\"18\" rx=\"5\" fill=\"#E9EBF7\"/><rect x=\"99\" y=\"166\" width=\"581\" height=\"18\" rx=\"5\" fill=\"#FDF2DA\"/><text x=\"28\" y=\"179\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#2B3A8F\"></text><text x=\"672\" y=\"179\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8F5F00\">environ -33 %</text></svg><figcaption>Une monnaie remplit 3 fonctions. L'euro en réussit 2, et échoue sur celle qui compte pour l'épargnant.</figcaption></figure>",
"<strong>Rôle 3 : garder la valeur dans le temps.</strong> La monnaie doit te permettre de mettre de côté le fruit de ton travail pour plus tard, sans qu'il fonde. <u>C'est le rôle le plus important pour quelqu'un qui épargne, et c'est le premier à se dégrader.</u>",
"Un exemple. Avec des prix qui augmentent de 2 % par an en moyenne (c'est l'inflation), une somme perd environ <strong>18 % de ce qu'elle permet d'acheter en 10 ans</strong>, et environ 33 % en 20 ans. Sur toute une carrière, c'est énorme. Et ce n'est pas un accident : la Banque centrale européenne vise volontairement 2 % d'inflation, car elle pense que c'est bon pour l'économie.",
"Il faut le dire clairement, car ça explique presque tout le reste : <strong>une petite inflation est bonne pour l'économie, mais mauvaise pour celui qui épargne.</strong> Elle pousse les gens à dépenser et à investir plutôt qu'à garder leur argent, elle rend les dettes plus légères avec le temps, et elle facilite les hausses de salaire. Mais celui qui laisse son argent sans bouger, lui, paie la note.",
"Ce n'est donc ni un complot ni une erreur. C'est un choix fait par les institutions. Résultat : <strong>l'euro remplit bien 2 rôles sur 3.</strong> Il est excellent pour échanger, correct pour mesurer, mauvais pour garder la valeur sur le long terme. D'où la conclusion pratique de toute cette formation : garde en euros l'argent dont tu as besoin bientôt, et place ailleurs celui que tu veux faire durer."
],

{module:"Module 1 — Qu'est-ce que la monnaie ?", title:"Pourquoi la monnaie n'est pas la richesse", duration:"5 min",
script:[
"Voici une idée qui semble théorique, mais qui change la façon de construire un patrimoine : <strong>la monnaie n'est pas la richesse. Elle donne seulement un droit sur la richesse.</strong>",
"La vraie richesse, ce sont les choses qui produisent ou qui servent : des terres, des logements, des machines, des entreprises, des savoir-faire, des routes. La monnaie, elle, ne produit rien. <em>Elle donne seulement le droit d'y accéder.</em>",
"Fais cette expérience dans ta tête. Imagine que demain, la quantité d'euros double, et que chaque compte en banque double aussi. Serions-nous 2 fois plus riches ? Non : il y aurait toujours autant de logements, de voitures et de pain. Les prix doubleraient, et chacun reviendrait au même point. <u>Créer de la monnaie ne crée pas de richesse. Ça change seulement qui peut en profiter.</u>",
"Et ce changement n'est jamais égal pour tous. C'est le point le plus important de la leçon. <strong>Ceux qui reçoivent l'argent nouveau en premier achètent aux anciens prix. Ceux qui le reçoivent en dernier achètent aux nouveaux prix, plus élevés.</strong> Les premiers servis sont en général les acteurs de la finance, les grandes entreprises et ceux qui empruntent beaucoup. Les derniers sont les salariés, dont les salaires augmentent en retard.",
"Ce phénomène s'appelle l'effet Cantillon, du nom d'un économiste du XVIIIe siècle. Il explique une bonne partie de l'écart entre ceux qui possèdent des biens (logements, entreprises) et ceux qui n'ont que leur salaire et un compte en banque.",
"La conséquence est simple. <strong>Garder tout son argent en monnaie, c'est se mettre volontairement en fin de file.</strong> Posséder des biens réels, c'est se rapprocher de la vraie richesse, celle dont le prix suit l'inflation. Ça ne veut pas dire qu'il faut tout transformer : tu as besoin d'argent disponible, et une réserve pour les imprévus reste indispensable.",
"Ça veut dire qu'il faut choisir combien tu gardes en monnaie, au lieu de laisser faire. <strong>Le compte courant est un lieu de passage, pas un lieu de stockage.</strong>"
],
quiz:[
{q:"Que se passerait-il si tous les comptes doublaient du jour au lendemain ?",opts:["Chacun serait 2 fois plus riche","Les prix doubleraient et la vraie richesse ne changerait pas","L'économie s'effondrerait tout de suite","Les banques feraient faillite"],correct:1,
explain:"Il y aurait toujours autant de logements, de voitures et de pain. Créer de la monnaie ne crée pas de richesse."},
{q:"Qu'est-ce que l'effet Cantillon ?",opts:["Une taxe sur les achats","L'avantage de ceux qui reçoivent l'argent nouveau en premier","Un indicateur de la banque centrale","Une façon de calculer l'inflation"],correct:1,
explain:"Les premiers servis achètent aux anciens prix, les derniers aux nouveaux. Ça creuse l'écart entre ceux qui possèdent des biens et ceux qui ont seulement un salaire."},
{q:"Quelle conclusion pratique en tirer ?",opts:["Ne jamais garder d'argent disponible","Choisir combien on garde en monnaie, au lieu de laisser faire","Emprunter le plus possible","Mettre toute son épargne dans l'or"],correct:1,
explain:"La réserve pour les imprévus reste indispensable. Ce qui change, c'est de décider de son montant au lieu de le subir."}
],
action:"Ce soir, fais 2 colonnes. À gauche, tout ce que tu as en monnaie : comptes, livrets, espèces. À droite, tout ce que tu possèdes en biens réels (logement, parts d'entreprise, placements en actions). Regarde l'équilibre, sans te juger. C'est ton point de départ, et la plupart des gens sont surpris."
},
{module:"Module 2 — L'étalon-or et sa disparition", title:"Bretton Woods, l'ordre monétaire de 1944", duration:"5 min",
script:[
"Pour comprendre la monnaie d'aujourd'hui, il faut connaître 2 dates. La première, c'est 1944. Cette année-là, alors que la Seconde Guerre mondiale n'est pas finie, des pays se réunissent dans un hôtel aux États-Unis, à Bretton Woods, pour organiser la monnaie du monde entier.",
"Ils veulent éviter le chaos des années 1930 : des pays qui baissaient la valeur de leur monnaie les uns après les autres et se faisaient la guerre commerciale. Ce désordre avait aggravé la crise, puis mené à la guerre. <strong>Le but est donc la stabilité</strong>, et 44 pays se mettent d'accord sur des règles communes.",
"Le système est simple. Le dollar peut être échangé contre de l'or à un prix fixe : <strong>35 dollars l'once</strong> (environ 31 grammes). Toutes les autres monnaies ont un taux fixe par rapport au dollar. Donc, à travers le dollar, chaque monnaie est liée à l'or.",
"Pourquoi les États-Unis ? Parce qu'en 1944, ils ont la plus grande partie de l'or du monde, leur pays n'a pas été détruit par la guerre, et leur économie est la seule qui tourne à plein. Personne n'a vraiment négocié cette place : c'était un fait.",
"Le système marche bien pendant environ 25 ans. Le commerce entre pays se développe, les taux de change ne bougent pas, et <u>les prix restent assez stables dans la plupart des pays riches</u>. C'est souvent cité comme la période où le niveau de vie a le plus progressé.",
"Mais le système a un défaut, repéré dans les années 1960 par l'économiste Robert Triffin. <strong>Le monde a besoin de dollars pour commercer, donc les États-Unis en impriment toujours plus. Mais plus il y a de dollars, moins il y a d'or pour chacun</strong>, et moins la promesse « 1 dollar = de l'or » est crédible.",
"Ce problème n'a pas de solution : il faut soit freiner le commerce mondial, soit arrêter d'échanger les dollars contre de l'or. Les dépenses de la guerre du Vietnam aggravent la situation. À la fin des années 1960, plusieurs pays commencent à demander de l'or en échange de leurs dollars. Ce qui nous amène à la deuxième date, dans la leçon suivante."
],
quiz:[
{q:"À quel prix pouvait-on échanger des dollars contre de l'or ?",opts:["1 dollar l'once","35 dollars l'once","100 dollars l'once","Ça changeait chaque année"],correct:1,
explain:"Un prix fixe. Toutes les autres monnaies avaient elles-mêmes un taux fixe avec le dollar."},
{q:"Quel était le défaut repéré par Triffin ?",opts:["Les pays refusaient le dollar","Le monde avait besoin de toujours plus de dollars, mais il n'y avait pas assez d'or derrière","Les mines d'or étaient vides","Les taux de change bougeaient trop"],correct:1,
explain:"Il fallait soit freiner le commerce mondial, soit arrêter d'échanger les dollars contre de l'or."},
{q:"Pourquoi les États-Unis étaient-ils au centre du système ?",opts:["Les 44 pays avaient voté","Ils avaient presque tout l'or du monde et la seule grande économie intacte","Ils avaient inventé l'or comme monnaie","Le dollar était la plus vieille monnaie"],correct:1,
explain:"En 1944, c'était un fait plus qu'un choix."}
],
action:"Cherche « Bretton Woods 1944 » et lis un article de 5 minutes. Note une seule idée qui t'a surpris. Savoir d'où vient le système actuel aide à comprendre l'actualité économique."
},
{module:"Module 2 — L'étalon-or et sa disparition", title:"1971, le tournant Nixon", duration:"5 min",
script:[
"La deuxième date à retenir est le <strong>15 août 1971</strong>. Ce jour-là, le président américain Richard Nixon annonce à la télévision qu'on ne peut plus échanger les dollars contre de l'or. Il dit que c'est temporaire. Ce sera définitif.",
"Pourquoi ? Depuis des années, d'autres pays, la France en tête, échangent leurs dollars contre de l'or américain. Les réserves d'or fondent. Il n'y a plus assez d'or pour tous les dollars en circulation. Les États-Unis doivent choisir : vider leurs réserves, ou arrêter.",
"Ce jour-là, le monde passe à un système jamais vu à cette échelle : <strong>une monnaie qui n'est liée à rien de matériel</strong>. On parle de monnaie <em>fiduciaire</em>, du latin <em>fiducia</em>, la confiance. L'euro dans ta poche ne repose sur aucun métal ni aucune marchandise. Sa valeur repose sur la confiance qu'on a dans la banque centrale qui l'émet, et dans l'économie qui l'utilise.",
"<figure class=\"schema\"><svg viewBox=\"0 0 700 168\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><line x1=\"34\" y1=\"96\" x2=\"666\" y2=\"96\" stroke=\"#DCDEEA\" stroke-width=\"2\"/><path d=\"M666 96 l-9 -5 v10 z\" fill=\"#DCDEEA\"/><line x1=\"53\" y1=\"96\" x2=\"53\" y2=\"62\" stroke=\"#2B3A8F\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/><circle cx=\"53\" cy=\"96\" r=\"7\" fill=\"#2B3A8F\"/><circle cx=\"53\" cy=\"96\" r=\"12\" fill=\"none\" stroke=\"#2B3A8F\" stroke-width=\"1\" opacity=\".35\"/><text x=\"53\" y=\"52\" text-anchor=\"start\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14\" font-weight=\"600\" fill=\"#171C45\">1944</text><text x=\"53\" y=\"122\" text-anchor=\"start\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12\" fill=\"#44496B\">Bretton Woods, le dollar adossé à l'or</text><line x1=\"299\" y1=\"96\" x2=\"299\" y2=\"62\" stroke=\"#A3213D\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/><circle cx=\"299\" cy=\"96\" r=\"7\" fill=\"#A3213D\"/><circle cx=\"299\" cy=\"96\" r=\"12\" fill=\"none\" stroke=\"#A3213D\" stroke-width=\"1\" opacity=\".35\"/><text x=\"299\" y=\"52\" text-anchor=\"middle\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14\" font-weight=\"600\" fill=\"#171C45\">1971</text><text x=\"299\" y=\"122\" text-anchor=\"middle\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12\" fill=\"#44496B\">Fin de la convertibilité</text><line x1=\"647\" y1=\"96\" x2=\"647\" y2=\"62\" stroke=\"#C27C00\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/><circle cx=\"647\" cy=\"96\" r=\"7\" fill=\"#C27C00\"/><circle cx=\"647\" cy=\"96\" r=\"12\" fill=\"none\" stroke=\"#C27C00\" stroke-width=\"1\" opacity=\".35\"/><text x=\"647\" y=\"52\" text-anchor=\"end\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14\" font-weight=\"600\" fill=\"#171C45\">Aujourd'hui</text><text x=\"647\" y=\"122\" text-anchor=\"end\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12\" fill=\"#44496B\">Monnaie fiduciaire, sans ancrage</text></svg><figcaption>Depuis 1971, plus aucune limite physique n'encadre la création monétaire.</figcaption></figure>",
"Attention, ce point est souvent mal compris. <u>Une monnaie fiduciaire n'est pas une monnaie sans valeur.</u> Elle a de la valeur parce qu'elle est acceptée partout, qu'on doit l'utiliser pour payer ses impôts, et que la banque centrale a des outils pour la garder stable. Ce n'est pas rien.",
"Ce qui change vraiment, c'est ça : <strong>il n'y a plus de limite physique à la création de monnaie.</strong> Avec l'or, créer plus de monnaie demandait d'avoir plus d'or, donc d'en extraire, ce qui coûte cher et prend du temps. Depuis 1971, la quantité de monnaie dépend seulement de décisions humaines.",
"C'est pour ça que beaucoup de courbes économiques changent de direction autour de cette date : quantité de monnaie, dette des États, prix des logements, écart entre riches et pauvres. Ça ne prouve pas que 1971 est la seule cause, et les économistes en débattent. Mais <strong>le changement de système est réel, et il a une date.</strong>",
"Retiens la conséquence pratique, c'est le vrai sujet de cette formation. Depuis 1971, <strong>l'argent que tu gardes en monnaie n'est plus protégé par une limite naturelle.</strong> Sa valeur dépend de décisions politiques. Elles peuvent être raisonnables, mais ce n'est pas toi qui les prends."
],

action:"Cherche un graphique de la quantité de monnaie (on dit « masse monétaire ») en zone euro ou aux États-Unis depuis 1960. Regarde la courbe avant et après 1971. Tu n'as rien à conclure ce soir : juste à voir de tes yeux ce dont parle cette leçon."

{module:"Module 2 — L'étalon-or et sa disparition", title:"Ce qui a changé depuis", duration:"5 min",
script:[
"50 ans après 1971, qu'est-ce qui a changé concrètement ? Cette leçon rassemble ce qui est mesuré, en séparant bien les faits des opinions, car ce sujet attire beaucoup d'exagérations, dans un sens comme dans l'autre.",
"<strong>Fait 1 : la quantité de monnaie a augmenté beaucoup plus vite que ce qu'on produit.</strong> Dans la plupart des pays riches, il y a beaucoup plus d'argent en circulation, alors que la quantité de biens et de services a augmenté moins vite. Ce n'est pas contesté : les banques centrales le mesurent elles-mêmes.",
"<strong>Fait 2 : les prix de la vie courante ont peu augmenté.</strong> On aurait pu s'attendre à pire, mais les prix des courses et des objets ont augmenté lentement pendant des dizaines d'années, autour de 2 % par an, avec quelques périodes plus fortes. La mondialisation et les progrès techniques ont permis de garder des prix bas.",
"<strong>Fait 3 : le prix des biens qu'on possède a explosé.</strong> Logements, actions, objets rares : leur prix a augmenté bien plus vite que les salaires. Il y a 50 ans, en France, un logement coûtait quelques années de salaire moyen. Aujourd'hui, dans les grandes villes, il en coûte beaucoup plus.",
"C'est le point le plus utile de la leçon, et il explique pourquoi on se sent plus pauvre alors que l'inflation officielle est basse. <u>L'argent créé ne va pas d'abord vers le pain et les légumes. Il va vers les logements et les placements.</u> Résultat : on peut toujours faire ses courses à peu près pareil, mais <strong>il devient de plus en plus dur de devenir propriétaire.</strong>",
"Conséquence directe : <strong>épargner sur un livret ne suffit plus pour suivre le prix des logements.</strong> Celui qui met de côté pour acheter plus tard voit son objectif s'éloigner plus vite qu'il n'avance. Celui qui possède déjà un logement ou des placements voit son patrimoine grossir sans rien faire.",
"Deux nuances pour être honnête. D'abord, la monnaie n'explique pas tout : la démographie, les villes qui grandissent, les règles de construction et la baisse des taux d'intérêt jouent aussi. Ensuite, cette période a aussi apporté une vie plus longue, de meilleurs soins et l'accès à l'information. <strong>Le tableau n'est pas noir, il est contrasté.</strong> Mais ta conclusion pratique reste la même : l'argent que tu veux faire durer ne doit pas rester en monnaie."
],
quiz:[
{q:"Pourquoi les prix de la vie courante ont-ils peu augmenté ?",opts:["Parce que la quantité de monnaie n'a pas bougé","Parce que la mondialisation et les progrès techniques ont gardé les prix bas","Parce que la loi bloque les prix","Parce que les salaires ont baissé"],correct:1,
explain:"L'argent créé est surtout allé vers les logements et les placements, pas vers les courses."},
{q:"Quelle est la conséquence pour quelqu'un qui épargne seulement sur un livret ?",opts:["Il ne peut plus faire ses courses","Il a de plus en plus de mal à devenir propriétaire","Rien ne change","Son épargne double tous les 10 ans"],correct:1,
explain:"Son objectif s'éloigne plus vite qu'il n'avance, alors que celui qui possède déjà des biens s'enrichit sans effort."},
{q:"Quelle nuance faut-il garder ?",opts:["Tout vient de la création de monnaie","D'autres causes jouent aussi : démographie, villes, taux d'intérêt","Rien n'a changé depuis 1971","Les chiffres officiels sont faux"],correct:1,
explain:"La monnaie explique une partie du phénomène, pas tout. Un raisonnement honnête tient compte des autres causes."}
],
action:"Cherche le prix moyen du mètre carré dans ta ville il y a 20 ans, puis aujourd'hui. Compare avec l'évolution du salaire moyen en France sur la même période. L'écart entre les 2, c'est exactement le sujet de cette leçon."
},
{module:"Module 3 — Banques centrales et inflation", title:"Comment fonctionne une banque centrale", duration:"5 min",
script:[
"On parle des banques centrales dans toutes les actualités économiques, mais presque personne ne sait ce qu'elles font. Voici l'essentiel, sans jargon et sans caricature.",
"Une banque centrale n'est pas une banque pour les particuliers : <strong>c'est la banque des banques.</strong> Pour la zone euro, c'est la Banque centrale européenne (BCE). Son but principal est fixé par les traités : <u>garder les prix stables, avec une inflation proche de 2 % par an</u>. Tout le reste découle de ce but.",
"Son outil principal, c'est <strong>le taux directeur</strong> : le taux auquel les banques empruntent auprès d'elle. Ce taux se répercute ensuite partout. Et c'est là que ça te concerne : il influence le taux de ton crédit immobilier, celui de ton crédit à la consommation, et ce que te rapporte ton épargne.",
"Ça marche dans les 2 sens. <strong>Quand les prix montent trop vite, la banque centrale monte ses taux.</strong> Emprunter coûte plus cher, les gens et les entreprises empruntent moins, ils achètent moins, et les prix se calment. Le revers : l'économie ralentit, et le chômage augmente souvent. <strong>Quand l'économie ralentit trop, elle baisse ses taux</strong>. Le crédit devient moins cher et l'activité repart, mais les prix des logements et des placements risquent de trop monter.",
"Un deuxième outil est apparu après la crise de 2008 : la banque centrale <strong>achète en masse des dettes d'États et d'entreprises</strong>, avec de l'argent qu'elle crée. On appelle ça l'« assouplissement quantitatif ». Ça fait baisser les taux sur le long terme et met beaucoup d'argent dans le système financier.",
"Voici ce qu'il faut retenir pour toi. <strong>Ces décisions ont un effet direct sur ton argent.</strong> Des taux bas avantagent ceux qui empruntent et ceux qui possèdent des biens, et pénalisent ceux qui épargnent sur un livret. Des taux hauts font l'inverse. Une bonne partie de ce qui arrive à ton argent chaque année dépend de décisions sur lesquelles tu n'as aucun pouvoir.",
"La solution n'est pas de suivre l'actualité des banques centrales : ça ne servirait à rien. C'est de t'organiser <strong>pour ne pas dépendre de leurs décisions</strong> : une réserve d'argent disponible pour les imprévus, des biens réels pour le long terme, et un crédit à taux fixe plutôt que variable quand tu empruntes."
],

{module:"Module 3 — Banques centrales et inflation", title:"L'inflation expliquée simplement", duration:"5 min",
script:[
"L'inflation, c'est le mot d'économie qu'on entend le plus et qu'on comprend le moins. Cette leçon le définit clairement, puis explique pourquoi le chiffre officiel te paraît souvent faux.",
"<strong>L'inflation, c'est la hausse générale et durable des prix.</strong> Les 2 mots comptent. <em>Générale</em> : si un seul produit augmente, ce n'est pas de l'inflation. <em>Durable</em> : si les prix montent puis redescendent vite, ce n'en est pas non plus. Dit autrement, ce qui est plus utile quand on épargne : l'inflation, c'est quand ton argent permet d'acheter moins de choses.",
"En France, l'INSEE la mesure avec un <strong>« panier » de produits et services</strong> qui représente ce qu'achète un ménage moyen. Ce panier est mis à jour régulièrement. Chaque dépense compte selon son poids réel dans le budget : le logement pèse lourd, les appareils électroniques beaucoup moins.",
"Alors pourquoi le chiffre annoncé ne correspond-il presque jamais à ce que les gens ressentent ? Pour 3 raisons précises. Aucune n'est un complot.",
"<strong>1. Ton panier n'est pas le panier moyen.</strong> Si tu es locataire dans une grande ville avec une voiture, tes prix augmentent beaucoup plus que ceux d'un propriétaire sans crédit qui vit à la campagne. La moyenne ne décrit personne en particulier.",
"<strong>2. On se souvient surtout de certaines hausses.</strong> On remarque quand l'essence ou les courses augmentent, car on en achète souvent. On oublie quand l'électroménager ou les forfaits téléphoniques baissent, car on en achète rarement.",
"<strong>3. La qualité entre dans le calcul.</strong> Si un produit coûte 10 % plus cher mais dure 2 fois plus longtemps, l'INSEE considère qu'une partie de la hausse vient d'une amélioration, et pas de l'inflation. Cette méthode se défend et se discute, mais elle explique une partie de l'écart.",
"Pour toi, la conclusion est simple : <u>ce qui compte, c'est ton inflation à toi, pas la moyenne nationale</u>. Tu peux la calculer en comparant tes propres dépenses d'une année sur l'autre, poste par poste. C'est exactement ce que permet ton tableau de budget.",
"Un dernier point, qui surprend souvent. <strong>Une petite inflation n'est pas dangereuse pour celui qui investit. Elle l'est pour celui qui garde son argent sans le placer.</strong> Les salaires, les loyers et le prix des biens finissent par suivre les prix. Les euros posés sur un compte, eux, ne bougent jamais."
],
quiz:[
{q:"Qu'est-ce que l'inflation, exactement ?",opts:["La hausse du prix de l'essence","La hausse générale et durable des prix","La baisse des salaires","L'augmentation de la quantité de monnaie"],correct:1,
explain:"Générale et durable : la hausse d'un seul produit, ou une hausse qui ne dure pas, n'en est pas."},
{q:"Pourquoi le chiffre officiel paraît-il souvent faux ?",opts:["Il est truqué","Parce que tes dépenses ne ressemblent pas à celles du ménage moyen","Parce qu'il est calculé tous les 5 ans","Parce qu'il ne compte pas l'alimentation"],correct:1,
explain:"S'ajoutent notre mémoire sélective des prix et la prise en compte de la qualité dans le calcul."},
{q:"Qui souffre le plus de l'inflation ?",opts:["Celui qui investit","Celui qui laisse son argent sur un compte sans le placer","Celui qui emprunte","Celui qui possède un logement"],correct:1,
explain:"Salaires, loyers et prix des biens finissent par suivre. Les euros posés sur un compte, jamais."}
],
action:"Reprends ton tableau de budget et compare 3 dépenses entre l'an dernier et cette année : logement, courses, transport. Le pourcentage obtenu, c'est ton inflation personnelle. C'est le seul chiffre qui te concerne vraiment."
},
{module:"Module 3 — Banques centrales et inflation", title:"Calculer ta perte réelle", duration:"5 min",
script:[
"C'est la leçon la plus concrète de la formation. Elle sert à mettre un chiffre sur une chose que personne ne voit : ce que ton épargne perd chaque année, sans qu'aucune ligne ne l'affiche sur ton relevé.",
"Le calcul repose sur une idée simple : <strong>le taux réel</strong>. Ce n'est pas le taux affiché sur ton livret. C'est ce que ton argent gagne vraiment une fois l'inflation retirée. La formule simple : <strong>taux réel = taux du livret moins inflation.</strong>",
"Un exemple. Ton livret rapporte 2 % une année où l'inflation est de 3 %. Ton taux réel est de moins 1 %. Si tu avais 10 000 €, ton relevé affichera 10 200 € en fin d'année. Pourtant, <u>avec cette somme, tu pourras acheter moins de choses qu'avec tes 10 000 € de départ</u>. C'est pour ça que l'inflation est si difficile à voir : ton solde monte, ton pouvoir d'achat baisse, et seul le premier chiffre est affiché.",
"Et ça s'aggrave avec le temps, car les pertes s'accumulent. Perdre 1 % par an, c'est perdre environ <strong>10 % de ce que ton argent peut acheter en 10 ans</strong>. Sur une réserve de 15 000 €, ça fait 1 500 € envolés, sans qu'aucun prélèvement n'apparaisse nulle part.",
"Faut-il vider ses livrets ? <strong>Non, et c'est important.</strong> Ta réserve pour les imprévus doit rester disponible et sans risque, même si elle perd un peu de valeur. Ce que tu paies, c'est une assurance : celle de ne jamais être obligé de vendre un placement au mauvais moment. Personne ne reproche à son assurance habitation de ne rien rapporter.",
"La bonne conclusion : <strong>range ton argent en 3 étages.</strong> L'argent dont tu peux avoir besoin demain reste disponible, et tu acceptes qu'il perde un peu. L'argent dont tu auras besoin dans 2 à 5 ans va sur des placements sûrs qui rapportent un peu plus. L'argent dont tu n'auras pas besoin avant 8 ans ou plus n'a rien à faire en monnaie.",
"L'erreur la plus fréquente n'est pas d'avoir un livret. C'est d'y laisser <strong>toute</strong> son épargne pendant 10 ans, parce qu'on n'a jamais fait ce calcul."
],
quiz:[
{q:"Comment calculer simplement le taux réel ?",opts:["Taux du livret plus inflation","Taux du livret moins inflation","Taux du livret fois inflation","Taux du livret divisé par 2"],correct:1,
explain:"Il existe une formule plus précise, mais la soustraction donne un résultat très proche."},
{q:"Un livret à 2 % avec 3 % d'inflation, ça donne quoi ?",opts:["Un gain de 2 %","Une perte de 1 % de pouvoir d'achat","Ni gain ni perte","Un gain de 5 %"],correct:1,
explain:"Pourtant, ton relevé affiche une hausse. C'est ce qui rend l'inflation invisible."},
{q:"Faut-il vider ses livrets ?",opts:["Oui, tout de suite","Non, la réserve pour les imprévus doit rester disponible malgré la perte","Oui, sauf le livret A","Seulement si l'inflation dépasse 5 %"],correct:1,
explain:"C'est le prix d'une assurance : ne jamais être obligé de vendre un placement au mauvais moment."}
],
action:"Note le total de ton épargne et le taux moyen de tes livrets. Retire le dernier chiffre d'inflation publié, et applique le résultat à ton total. Tu obtiens ta perte réelle sur un an. Beaucoup de gens sont surpris."
},
{module:"Module 4 — Bonnes et mauvaises monnaies", title:"Les critères d'une monnaie saine", duration:"5 min",
script:[
"Pourquoi certaines choses ont-elles servi de monnaie pendant des milliers d'années, et d'autres seulement quelques dizaines ? Les économistes ont trouvé <strong>6 critères</strong> pour comparer n'importe quelle monnaie, ancienne ou récente.",
"<strong>1. La rareté.</strong> La quantité doit être limitée et difficile à augmenter. C'est le critère le plus important. C'est lui qui a fait disparaître les coquillages et les perles de verre.",
"<strong>2. La solidité.</strong> La monnaie ne doit pas s'abîmer avec le temps. Le bétail et le sel remplissaient mal ce critère, l'or parfaitement.",
"<strong>3. La division.</strong> On doit pouvoir la couper en petites parts pour payer aussi bien une maison qu'un pain, sans perdre de valeur.",
"<strong>4. Le transport.</strong> Elle doit se déplacer facilement. C'est le point faible de l'or. C'est pour ça que les billets se sont imposés : au départ, c'étaient des reçus qui prouvaient qu'on avait déposé de l'or quelque part.",
"<figure class=\"schema\"><svg viewBox=\"0 0 700 340\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"200\" y=\"20\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" letter-spacing=\"1.4\" fill=\"#2B3A8F\">L'OR</text><text x=\"560\" y=\"20\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" letter-spacing=\"1.4\" fill=\"#C27C00\">L'EURO</text><text x=\"20\" y=\"44\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">Rareté</text><rect x=\"20\" y=\"54\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#F0F1F7\"/><rect x=\"20\" y=\"54\" width=\"581\" height=\"18\" rx=\"5\" fill=\"#E9EBF7\"/><rect x=\"601\" y=\"54\" width=\"79\" height=\"18\" rx=\"5\" fill=\"#FDF2DA\"/><text x=\"28\" y=\"67\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#2B3A8F\">quantité limitée</text><text x=\"672\" y=\"67\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8F5F00\"></text><text x=\"20\" y=\"100\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">Durabilité</text><rect x=\"20\" y=\"110\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#F0F1F7\"/><rect x=\"20\" y=\"110\" width=\"528\" height=\"18\" rx=\"5\" fill=\"#E9EBF7\"/><rect x=\"548\" y=\"110\" width=\"132\" height=\"18\" rx=\"5\" fill=\"#FDF2DA\"/><text x=\"28\" y=\"123\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#2B3A8F\">inaltérable</text><text x=\"672\" y=\"123\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8F5F00\"></text><text x=\"20\" y=\"156\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">Divisibilité</text><rect x=\"20\" y=\"166\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#F0F1F7\"/><rect x=\"20\" y=\"166\" width=\"165\" height=\"18\" rx=\"5\" fill=\"#E9EBF7\"/><rect x=\"185\" y=\"166\" width=\"495\" height=\"18\" rx=\"5\" fill=\"#FDF2DA\"/><text x=\"28\" y=\"179\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#2B3A8F\"></text><text x=\"672\" y=\"179\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8F5F00\">parfaite</text><text x=\"20\" y=\"212\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">Transportabilité</text><rect x=\"20\" y=\"222\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#F0F1F7\"/><rect x=\"20\" y=\"222\" width=\"99\" height=\"18\" rx=\"5\" fill=\"#E9EBF7\"/><rect x=\"119\" y=\"222\" width=\"561\" height=\"18\" rx=\"5\" fill=\"#FDF2DA\"/><text x=\"28\" y=\"235\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#2B3A8F\"></text><text x=\"672\" y=\"235\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8F5F00\">immédiate</text><text x=\"20\" y=\"268\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">Vérifiabilité</text><rect x=\"20\" y=\"278\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#F0F1F7\"/><rect x=\"20\" y=\"278\" width=\"409\" height=\"18\" rx=\"5\" fill=\"#E9EBF7\"/><rect x=\"429\" y=\"278\" width=\"251\" height=\"18\" rx=\"5\" fill=\"#FDF2DA\"/><text x=\"28\" y=\"291\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#2B3A8F\">difficile</text><text x=\"672\" y=\"291\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8F5F00\"></text></svg><figcaption>Aucune monnaie ne coche les 6 critères. Le choix se fait toujours entre des compromis.</figcaption></figure>",
"<strong>5. L'égalité des unités.</strong> Chaque unité doit valoir exactement la même chose qu'une autre. Un billet de 20 € vaut n'importe quel autre billet de 20 €. Ce n'est pas le cas de 2 diamants ou de 2 tableaux. Les économistes appellent ça la « fongibilité ».",
"<strong>6. La vérification.</strong> On doit pouvoir vérifier facilement qu'elle n'est pas fausse.",
"Applique ces critères à l'euro. Il est excellent sur la solidité, la division, le transport, l'égalité des unités et la vérification. <u>Il échoue sur un seul critère : la rareté</u>, puisque sa quantité peut augmenter sur décision de la banque centrale. C'est exactement pour ça qu'il est très bon pour échanger, et moyen pour garder la valeur.",
"Ce classement explique aussi pourquoi l'or a dominé pendant des milliers d'années : il coche presque tout, sauf le transport. Et pourquoi certaines monnaies numériques, dont la quantité est limitée, intéressent autant : elles cochent la rareté et le transport, mais posent d'autres problèmes, notamment de stabilité, et elles sont difficiles à vérifier pour quelqu'un qui n'est pas spécialiste.",
"Retiens surtout l'idée générale, plus utile que la liste : <strong>aucune monnaie ne coche parfaitement les 6 critères.</strong> On ne choisit jamais entre une bonne et une mauvaise monnaie, mais entre des avantages et des défauts. Ce qui compte, c'est de savoir ce que tu utilises, et pour quoi faire."
],

explain:"Sa quantité peut être augmentée sur décision de la banque centrale. Il est excellent sur les 5 autres critères."},
{q:"Quel est le point faible de l'or ?",opts:["Sa rareté","Le transport","Sa solidité","L'égalité des unités"],correct:1,
explain:"C'est pour ça que les billets, au départ des reçus de dépôt d'or, se sont imposés."},
{q:"Quelle idée générale retenir ?",opts:["L'or est la seule vraie monnaie","Aucune monnaie ne coche les 6 critères : il y a toujours des avantages et des défauts","Les monnaies numériques sont les meilleures","Seule la rareté compte"],correct:1,
explain:"Ce qui compte, c'est de savoir ce que tu utilises, et pour quoi faire."}
],

},
{module:"Module 4 — Bonnes et mauvaises monnaies", title:"Comparer l'euro, l'or et le Bitcoin", duration:"5 min",
script:[
"Appliquons la grille de la leçon précédente à 3 choses très différentes, en restant factuel. Cette leçon ne te recommande rien : elle décrit, et c'est à toi de tirer tes conclusions.",
"<strong>L'euro.</strong> Sa quantité peut augmenter sur décision de la banque centrale. On peut l'utiliser partout dans la zone euro, tout de suite. Ton argent à la banque est garanti jusqu'à 100 000 € par personne et par banque. Il perd de la valeur lentement mais régulièrement. <u>C'est le meilleur outil pour le court terme, et le pire pour le très long terme.</u>",
"<strong>L'or.</strong> Sa quantité est limitée par la nature. Elle augmente d'environ 1,5 à 2 % par an grâce aux mines. Il ne rapporte rien : une once d'or reste une once d'or, sans intérêts ni dividendes. Sur de très longues périodes, il a gardé sa valeur, mais son prix peut beaucoup bouger à court terme, et même stagner ou baisser pendant des années. En pratique, il faut le stocker, l'assurer, et en France, sa revente est taxée de façon particulière.",
"<strong>Le Bitcoin.</strong> Sa quantité est limitée à 21 millions d'unités par ses règles de fonctionnement, et tout le monde peut le vérifier. Il est très facile à transporter et à diviser. Mais <strong>son prix bouge énormément</strong> : il a déjà perdu 70 % ou plus de sa valeur plusieurs fois. Il existe depuis moins de 20 ans, on peut le perdre si on perd ses codes d'accès, et ses règles légales changent encore.",
"Ce que cette comparaison t'apprend, et qui vaut mieux qu'un conseil : <strong>ces 3 choses ne servent pas à la même chose.</strong> L'euro sert à vivre au quotidien. L'or a servi, dans l'histoire, à traverser de très longues périodes. Le Bitcoin est jeune, son prix bouge beaucoup, et les experts sérieux ne sont pas du tout d'accord à son sujet. C'est un fait à connaître, pas une question à trancher.",
"Deux mises en garde, valables pour toute cette formation. D'abord, <u>aucune de ces 3 choses ne rapporte de revenu</u>, contrairement à une entreprise ou à un logement loué. Avoir de l'or ou du Bitcoin, c'est espérer que son prix tienne ou monte. Ce n'est pas toucher un revenu.",
"Ensuite, méfie-toi de toute personne qui te présente l'une des 3 comme la solution évidente. <strong>Celui qui te promet une certitude a presque toujours quelque chose à vendre.</strong> Cette formation ne te vend rien : elle t'apprend à poser les bonnes questions."
],

explain:"La limite est inscrite dans ses règles et tout le monde peut la vérifier. C'est une grande différence avec l'euro."},
{q:"Quel point commun ont l'or et le Bitcoin ?",opts:["Ils sont garantis par l'État","Ils ne rapportent aucun revenu","Leur prix bouge peu","On peut les utiliser partout"],correct:1,
explain:"Contrairement à une entreprise ou à un logement loué, les posséder, c'est miser sur leur prix, pas toucher un revenu."},
{q:"Que penser de quelqu'un qui présente l'un des 3 comme la solution évidente ?",opts:["Il a sûrement raison","Celui qui promet une certitude a souvent quelque chose à vendre","Il faut le suivre si c'est un expert","Ça n'a pas d'importance"],correct:1,
explain:"Sur ces sujets, les experts sérieux ne sont pas d'accord. Une certitude affichée est un argument de vente."}
],
action:"Note aujourd'hui le prix de l'or et du Bitcoin en euros, avec la date. Range cette note et relis-la dans 6 mois. Voir toi-même les prix bouger pendant quelques mois t'en apprendra plus que n'importe quel graphique."
},
{module:"Module 4 — Bonnes et mauvaises monnaies", title:"Pourquoi certaines monnaies s'effondrent", duration:"5 min",
script:[
"L'hyperinflation, ça paraît loin, réservé à d'autres pays et à d'autres époques. Pourtant, ça vaut la peine de la comprendre : elle montre en accéléré ce qui se passe avec la monnaie.",
"On parle d'hyperinflation quand les prix augmentent de plus de <strong>50 % par mois</strong>. À ce rythme, les prix doublent en moins de 2 mois. Le cas le plus extrême connu, c'est le Zimbabwe à la fin des années 2000 : les prix montaient si vite que les chiffres ne voulaient presque plus rien dire.",
"Ça se passe toujours de la même façon, en 4 étapes. <strong>1.</strong> Un État a des dépenses qu'il ne peut plus payer, ni avec les impôts, ni en empruntant. <strong>2.</strong> Il crée de la monnaie pour payer. <strong>3.</strong> Les prix montent, ses dépenses augmentent encore, donc il crée encore plus de monnaie. <strong>4.</strong> Les gens perdent confiance : ils ne veulent plus garder cette monnaie et la dépensent tout de suite, ce qui fait monter les prix encore plus vite.",
"La 4e étape est la plus importante. <u>L'hyperinflation, ce n'est pas seulement une question de quantité de monnaie : c'est une perte de confiance.</u> Tant que les gens acceptent une monnaie, elle tient. Le jour où ils la refusent, ni l'or ni les lois ne peuvent la sauver.",
"Que se passe-t-il concrètement ? <strong>L'épargne en monnaie disparaît</strong>, souvent en quelques mois. Les retraités et les petits salaires sont les plus touchés. Les gens se tournent vers les monnaies étrangères, les biens réels et le troc. Les dettes disparaissent aussi, ce qui explique que ceux qui avaient emprunté s'en sortent parfois mieux que ceux qui avaient épargné.",
"Ça peut arriver dans la zone euro ? <strong>C'est très peu probable.</strong> L'euro repose sur une grande économie variée, une banque centrale indépendante dont le rôle est de garder les prix stables, et une monnaie utilisée dans le commerce mondial. L'hyperinflation touche des pays fragiles, souvent en guerre, avec des institutions qui s'effondrent, ou qui dépendent d'une seule ressource.",
"Alors pourquoi étudier ça ? Parce que ça montre une vérité valable partout : <strong>la valeur d'une monnaie repose entièrement sur la confiance, et la confiance n'est jamais garantie.</strong> Pas de quoi avoir peur. Juste une raison d'être prudent : ne jamais mettre 100 % de son patrimoine dans un seul type de bien, quel qu'il soit."
],
quiz:[
{q:"À partir de quand parle-t-on d'hyperinflation ?",opts:["10 % par an","50 % par mois","100 % par an","5 % par trimestre"],correct:1,
explain:"À ce rythme, les prix doublent en moins de 2 mois. Épargner en monnaie devient impossible."},
{q:"Qu'est-ce qui fait basculer dans l'hyperinflation ?",opts:["Une décision de la banque centrale","La perte de confiance : les gens ne veulent plus garder la monnaie","Un manque d'or","Une invasion étrangère"],correct:1,

/* Les leçons du module 1 sont ouvertes sans compte : on ne demande pas

const LECONS_LIBRES = 3;

async function requireAuth(){
  const { data: { session } } = await sb.auth.getSession();
  return session ? session.user : null;
}

function progresLocal(){
  try { return JSON.parse(localStorage.getItem(CLE_LOCALE) || '{}'); }
  catch(e){ return {}; }
}

function enregistrerLocal(n, valeur){
  try {
    const p = progresLocal();
    if(valeur) p[n] = true; else delete p[n];
    localStorage.setItem(CLE_LOCALE, JSON.stringify(p));
  } catch(e){ /* navigation privée : on continue sans mémoire */ }
}

const PAGE_PORTE = 'lecons-monnaie.html';

async function requireUnlock(userId){
  /* La formation d'entrée n'est jamais verrouillée : la vérifier ici
     provoquerait une redirection de la page vers elle-même, donc une
     boucle infinie. */
  if(FORMATION === 'monnaie') return true;

  const { data: badge } = await sb.from('badges')
    .select('badge_name').eq('user_id', userId).eq('badge_name','le_declic').maybeSingle();
  if(badge) return true;

  /* Garde-fou : ne jamais rediriger vers la page courante. */
  const ici = window.location.pathname.split('/').pop() || 'index.html';
  if(ici === PAGE_PORTE){
    console.warn('Verrou actif sur la page d\'entrée : redirection ignorée.');
    return true;
  }
  window.location.href = PAGE_PORTE + '?verrou=1';
  return false;
}

async function signOut(){

async function loadProgressFromServer(){
  if(!CURRENT_USER){ PROGRESS_CACHE = progresLocal(); return PROGRESS_CACHE; }

  const { data } = await sb
    .from('lesson_progress')
    .select('lesson_number, completed')
    .eq('user_id', CURRENT_USER.id)
    .eq('formation', FORMATION);
  const p = {};
  if(data){ data.forEach(function(row){ if(row.completed) p[row.lesson_number] = true; }); }

  /* Reprise de ce qui a été fait avant l'inscription. */
  const local = progresLocal();
  const aReprendre = Object.keys(local).filter(function(n){ return !p[n]; });
  if(aReprendre.length){
    for(const n of aReprendre){
      p[n] = true;
      await sb.from('lesson_progress').upsert({
        user_id: CURRENT_USER.id, formation: FORMATION,
        lesson_number: parseInt(n, 10), completed: true,
        completed_at: new Date().toISOString()
      }, { onConflict: 'user_id,formation,lesson_number' });
    }
    try { localStorage.removeItem(CLE_LOCALE); } catch(e){}
  }

  PROGRESS_CACHE = p;
  return p;
}
function getProgress(){ return PROGRESS_CACHE; }
async function setProgressServer(lessonNumber, value){
  PROGRESS_CACHE[lessonNumber] = value;

  if(!CURRENT_USER){ enregistrerLocal(lessonNumber, value); return; }

  await sb.from('lesson_progress').upsert({
    user_id: CURRENT_USER.id,
    formation: FORMATION,
    lesson_number: lessonNumber,
    completed: value,
    completed_at: value ? new Date().toISOString() : null
  }, { onConflict: 'user_id,formation,lesson_number' });

  await majCarnet(lessonNumber, value);
}

/* Le carnet de route : l'action cochée s'inscrit dans le carnet personnel,
   la décocher l'en retire. Une erreur ici ne doit jamais bloquer la
   progression de la leçon, d'où le try/catch silencieux. */
async function majCarnet(lessonNumber, value){
  try {
    const l = LESSONS[lessonNumber - 1];
    if(!l) return;

    if(!value){
      await sb.from('carnet').delete()
        .eq('user_id', CURRENT_USER.id)
        .eq('formation', FORMATION)
        .eq('lesson_number', lessonNumber);
      return;
    }

    await sb.from('carnet').upsert({
      user_id: CURRENT_USER.id,
      formation: FORMATION,
      lesson_number: lessonNumber,
      titre: l.title || ('Leçon ' + lessonNumber),
      action: l.action || ''
    }, { onConflict: 'user_id,formation,lesson_number', ignoreDuplicates: true });
  } catch(e){
    console.warn('Carnet non mis à jour :', e);
  }
}

let current = parseInt(new URLSearchParams(location.search).get('l')) || 1;
if(current < 1) current = 1;
if(current > LESSONS.length) current = LESSONS.length;

function isUnlocked(n){
  if(n === 1) return true;
  /* Sans compte, le parcours s'arrête à la fin du module ouvert. */
  if(!CURRENT_USER && n > LECONS_LIBRES) return false;
  const progress = getProgress();
  return !!progress[n-1];
}

function renderSidebar(){
  const progress = getProgress();
  const doneCount = Object.keys(progress).filter(function(k){ return progress[k]; }).length;
  document.getElementById('navProgress').textContent = doneCount + '/' + LESSONS.length + ' leçons';

  /* Regroupement des lecons par module : c'est le module qui devient
     l'etape de l'itineraire, la lecon n'est qu'un arret. */
  const etapes = [];
  LESSONS.forEach(function(l, i){
    const nom = l.module.split(' — ')[1] || l.module;
    let e = etapes.find(function(x){ return x.nom === nom; });
    if(!e){ e = { nom: nom, lecons: [] }; etapes.push(e); }
    e.lecons.push({ n: i + 1, titre: l.title });
  });

  const etapeCourante = etapes.findIndex(function(e){
    return e.lecons.some(function(a){ return a.n === current; });
  });

  const COCHE = '<svg viewBox="0 0 24 24" fill="none"><path d="M5 12L10 17L19 7" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  let html = '<div class="itin">' +
    '<div class="itin-tete">' +
      '<div class="itin-formation">' + NOM_FORMATION + '</div>' +
      '<div class="itin-compte">Étape ' + (etapeCourante + 1) + ' sur ' + etapes.length + ' · ' + doneCount + '/' + LESSONS.length + ' leçons</div>' +
      '<div class="itin-barre"><span style="width:' + Math.round(doneCount / LESSONS.length * 100) + '%"></span></div>' +
    '</div><div class="route">';

  etapes.forEach(function(e, idx){
    const toutesFaites = e.lecons.every(function(a){ return progress[a.n]; });
    const ici = idx === etapeCourante;
    const premiereAccessible = e.lecons.find(function(a){ return isUnlocked(a.n); });
    const classe = toutesFaites ? 'faite' : (ici ? 'ici' : '');
    const borne = toutesFaites ? COCHE : String(idx + 1);
    const cible = premiereAccessible ? premiereAccessible.n : e.lecons[0].n;

    html += '<div class="etape-i ' + classe + '">' +
      '<span class="borne">' + borne + '</span>' +
      '<button class="etape-titre" onclick="goTo(' + cible + ')">' + e.nom + '</button>' +
      '<div class="etape-meta">' + e.lecons.length + ' leçon' + (e.lecons.length > 1 ? 's' : '') + '</div>';

    /* On ne deroule que l'etape ou l'on se trouve : la carte reste lisible. */
    if(ici){
      html += '<div class="arrets">';
      e.lecons.forEach(function(a){
        const fait = !!progress[a.n];
        const ouvert = isUnlocked(a.n);
        const cl = (a.n === current ? 'ici ' : '') + (fait ? 'faite ' : '') + (ouvert ? '' : 'bloque');
        html += '<div class="arret ' + cl + '" onclick="goTo(' + a.n + ')">' +
          '<span class="puce">' + COCHE + '</span><span>' + a.titre + '</span></div>';
      });
      html += '</div>';
    }
    html += '</div>';
  });

  html += '</div>' + escaleHtml() + '</div>';
  document.getElementById('sidebar').innerHTML = html;
}

function goTo(n){
  if(!isUnlocked(n)){
    alert('Termine la leçon précédente pour débloquer celle-ci.');
    return;
  }
  current = n;
  history.replaceState(null, '', '?l=' + n);
  render();
  window.scrollTo(0,0);
}

    (done ? '<div class="completion-badge show">✓ Leçon terminée</div>' : '') +
    '<div class="lesson-eyebrow">' + l.module + '</div>' +
    '<div class="lesson-title">' + (current) + '. ' + l.title + '</div>' +
    '<div class="lesson-meta">' + l.duration + ' de lecture · Leçon ' + current + ' sur ' + LESSONS.length + '</div>' +
    '<div class="section-label"><span class="dot"></span>Comprendre</div>' +
    '<div class="script-text">' + l.script.map(function(p){
      return p.indexOf('<figure') === 0 ? p : '<p>' + p + '</p>';
    }).join('') + '</div>' +
    '<div class="section-label quiz"><span class="dot"></span>Vérifier</div>' +
    quizHtml +
    '<div class="section-label action"><span class="dot"></span>Petite action</div>' +
    (!quizOk && !done ? '<div style="font-size:12.5px;font-weight:600;color:var(--coral);margin-bottom:10px;">Réponds correctement aux ' + l.quiz.length + ' questions pour débloquer cette action.</div>' : '') +
    '<div class="action-card" id="actionCard" style="' + actionCardStyle + '">' +
      '<div class="action-text">' + l.action + '</div>' +
      '<div class="action-check" onclick="toggleAction()"><span class="action-box ' + (done?'checked':'') + '" id="actionBox">' + (done?'✓':'') + '</span><span class="action-label">Marquer cette leçon comme terminée</span></div>' +
    '</div>' +
    '<div class="lesson-nav">' +
      (current > 1 ? '<button class="nav-btn ghost" onclick="goTo(' + (current-1) + ')">← Leçon précédente</button>' : '<span></span>') +
      (current < LESSONS.length ? '<button class="nav-btn" onclick="goTo(' + (current+1) + ')">Leçon suivante →</button>' : '<a href="lecons-psychologie.html" class="nav-btn">Psychologie de l\'argent →</a>') +
    '</div>' +

    (!CURRENT_USER && current >= LECONS_LIBRES ? porteInscription() : '') +

    '<div class="lesson-sortie">' +
      '<a href="index.html#formations">Sommaire des formations</a><span>·</span>' +
      '<a href="carnet.html">Mon carnet</a><span>·</span>' +
      '<a href="index.html">Retour au site</a>' +
    '</div>';
}

function answerQuiz(qi, oi, correct){
  if(quizState[qi]) return; // déjà répondu correctement, verrouillé
  const chosen = document.getElementById('q'+qi+'o'+oi);
  if(chosen.classList.contains('disabled')) return;

  if(oi === correct){
    for(let k=0;k<10;k++){
      const el = document.getElementById('q'+qi+'o'+k);
      if(el){ el.classList.add('disabled'); }
    }
    chosen.classList.add('correct');
    quizState[qi] = true;
    document.getElementById('exp'+qi).classList.add('show');
    const l = LESSONS[current-1];
    const quizOk = allQuizCorrect(l);
    const card = document.getElementById('actionCard');
    if(quizOk && card){
      card.style.opacity = '';
      card.style.pointerEvents = '';
      const lock = card.previousElementSibling;
      if(lock && lock.textContent.indexOf('Réponds correctement') !== -1){ lock.style.display = 'none'; }
    }
  } else {
    chosen.classList.add('wrong');
    document.getElementById('exp'+qi).classList.add('show');
    setTimeout(function(){ chosen.classList.remove('wrong'); }, 900);
  }
}

async function toggleAction(){
  const l = LESSONS[current-1];
  const progress = getProgress();
  const newValue = !progress[current];
  if(newValue && !allQuizCorrect(l)){
    alert('Réponds correctement à toutes les questions du quiz avant de valider cette leçon.');
    return;
  }
  await setProgressServer(current, newValue);
  render();

  /* La formation vient-elle de s'achever ? Si oui, on plante la borne.
     On ne la montre qu'au moment du basculement, jamais en revenant
     sur une leçon déjà validée. */
  if(newValue) verifierFinDeParcours();
}

/* Première formation terminée : le badge Le Déclic est accordé côté
   serveur, puis la page de célébration s'affiche. C'est ce badge qui
   déverrouille les 7 formations suivantes. */
async function accorderDeclic(){
  const progress = getProgress();
  const faites = Object.keys(progress).filter(function(k){ return progress[k]; }).length;
  if(faites < LESSONS.length) return false;

  try {
    const { data, error } = await sb.rpc('accorder_declic', { nb_lecons: LESSONS.length });
    if(error){ console.warn('Badge non accordé :', error.message); return false; }
    return data === true;
  } catch(e){
    console.warn('Badge non accordé :', e);
    return false;
  }
}

async function verifierFinDeParcours(){
  const progress = getProgress();
  const faites = Object.keys(progress).filter(function(k){ return progress[k]; }).length;
  if(faites < LESSONS.length) return;

  let prenom = '';
  let semaines = 1;
  try {
    const { data } = await sb.from('profiles').select('prenom').eq('id', CURRENT_USER.id).maybeSingle();
    if(data && data.prenom) prenom = data.prenom;

    const { data: dates } = await sb.from('lesson_progress')
      .select('completed_at').eq('user_id', CURRENT_USER.id).eq('formation', FORMATION)
      .not('completed_at', 'is', null).order('completed_at', { ascending: true }).limit(1);
    if(dates && dates.length){
      const debut = new Date(dates[0].completed_at).getTime();
      semaines = Math.max(1, Math.round((Date.now() - debut) / (7*24*3600*1000)));
    }
  } catch(e){ console.warn('Carte : données partielles', e); }

  const declic = await accorderDeclic();
  if(declic){
    /* Première formation : célébration complète, badge compris. */
    window.location.href = 'succes.html';
    return;
  }
  ouvrirCarte(FORMATION, LESSONS.length, prenom, semaines);
}


/* Fin du module ouvert : on demande le compte au moment où la personne
   a vu ce que vaut la suite, pas avant. */
function porteInscription(){
  const faites = Object.keys(getProgress()).filter(function(k){ return getProgress()[k]; }).length;
  return '<div class="porte">' +
    '<div class="porte-sur">Fin du module 1</div>' +
    '<div class="porte-titre">Tu as lu ' + faites + ' leçon' + (faites > 1 ? 's' : '') + ' sur ' + LESSONS.length + '.</div>' +
    '<p class="porte-txt">La suite est gratuite aussi. Un compte sert seulement à retenir où tu en es, ' +
      'd\'un appareil à l\'autre, et à garder la trace des actions que tu as faites.</p>' +
    '<div class="porte-btns">' +
      '<a href="inscription.html?redirect=lecons-monnaie.html" class="nav-btn">Créer mon compte, gratuit</a>' +
      '<a href="connexion.html?redirect=lecons-monnaie.html" class="nav-btn ghost">J\'ai déjà un compte</a>' +
    '</div>' +
    '<div class="porte-note">Ta progression de ces 3 leçons sera reprise automatiquement.</div>' +
  '</div>';
}

async function boot(){
  document.getElementById('main').innerHTML = '<div style="padding:60px 0;text-align:center;color:var(--ink-faint);font-size:14px;">Chargement de ta progression…</div>';
  const user = await requireAuth();
  if(user){
    const unlocked = await requireUnlock(user.id);
    if(!unlocked) return;
  }
  CURRENT_USER = user;
  await loadProgressFromServer();

  /* Sans compte, on ne va pas au-delà du module 1. */
  if(!CURRENT_USER && current > LECONS_LIBRES){
    current = LECONS_LIBRES;
    history.replaceState(null, '', '?l=' + current);
  }

  if(!isUnlocked(current)){
    let lastUnlocked = 1;
    for(let i=1;i<=LESSONS.length;i++){ if(isUnlocked(i)) lastUnlocked = i; else break; }
    current = lastUnlocked;
    history.replaceState(null, '', '?l=' + current);
  }
  render();
}
boot();
</script>
