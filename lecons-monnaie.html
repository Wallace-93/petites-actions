<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --ink:#12212B;--ink-soft:#43555F;--ink-muted:#7A8A93;--ink-faint:#96A3AA;
  --bg:#FCFBF8;--bg-soft:#F5F4EE;--bg-mid:#EFF0EA;--bg-line:#DCDDD3;
  --green:#1E4B3C;--green-light:#2A6350;--green-pale:#E7EFEA;--green-bord:#BFD6C9;
  --amber:#B8862F;--amber-pale:#F6EFE0;--amber-bord:#E4D2AC;
  --violet:#4A5C6B;--violet-pale:#EDF0F2;--violet-bord:#D4DBE0;
  --coral:#A24332;--coral-pale:#F8EDEA;
  --sans:'Karla',system-ui,-apple-system,sans-serif;
  --display:'Newsreader',Georgia,serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
body{font-family:var(--sans);background:var(--bg-soft);color:var(--ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;}
a{color:inherit;}

.nav{position:sticky;top:0;z-index:200;background:rgba(255,255,255,.96);backdrop-filter:blur(20px);border-bottom:1px solid var(--bg-line);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;font-weight:800;font-size:15px;color:var(--ink);}
.nav-mark{width:26px;height:26px;border-radius:8px;background:var(--green);display:flex;align-items:center;justify-content:center;}
.nav-mark svg{width:14px;height:14px;}
.nav-back{font-size:13px;font-weight:600;color:var(--ink-muted);text-decoration:none;}
.nav-progress-pill{font-size:12px;font-weight:700;color:var(--green);background:var(--green-pale);padding:5px 12px;border-radius:100px;}

.layout{display:grid;grid-template-columns:280px 1fr;max-width:1100px;margin:0 auto;min-height:calc(100vh - 60px);}
.sidebar{border-right:1px solid var(--bg-line);background:var(--bg);padding:24px 16px;position:sticky;top:60px;align-self:start;height:calc(100vh - 60px);overflow-y:auto;}
.sb-progress-bar{height:6px;background:var(--bg-mid);border-radius:100px;overflow:hidden;margin:0 10px 18px;}
.sb-progress-fill{height:100%;background:var(--green);border-radius:100px;transition:width .3s;}
.sb-item{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:10px;cursor:pointer;margin-bottom:2px;font-size:13px;font-weight:600;color:var(--ink-muted);transition:background .15s;}
.sb-item:hover{background:var(--bg-soft);}
.sb-item.active{background:var(--green-pale);color:var(--green);}
.sb-item.done{color:var(--ink);}
.sb-item.locked{opacity:.45;cursor:not-allowed;}
.sb-item.locked:hover{background:transparent;}
.sb-check{width:20px;height:20px;border-radius:50%;background:var(--bg-mid);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink-faint);flex-shrink:0;}
.sb-item.done .sb-check{background:var(--green);color:#fff;}
.sb-item.active .sb-check{background:var(--green);color:#fff;}
.sb-module-label{font-size:10.5px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em;padding:14px 10px 6px;}

.main{padding:36px 40px 80px;max-width:720px;}
.lesson-eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green);margin-bottom:10px;}
.lesson-title{font-size:28px;font-weight:800;letter-spacing:-.03em;color:var(--ink);margin-bottom:8px;line-height:1.15;}
.lesson-meta{font-size:13px;color:var(--ink-faint);margin-bottom:32px;}

.section-label{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-muted);margin:36px 0 16px;}
.section-label .dot{width:6px;height:6px;border-radius:50%;background:var(--green);}
.section-label.quiz .dot{background:var(--violet);}
.section-label.action .dot{background:var(--amber);}

.script-text p{font-size:15.5px;font-weight:400;color:var(--ink-soft);line-height:1.75;margin-bottom:18px;}

.quiz-card{background:var(--bg);border:1px solid var(--bg-line);border-radius:16px;padding:24px;margin-bottom:14px;}
.quiz-q{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:16px;line-height:1.5;}
.quiz-opt{display:flex;align-items:flex-start;gap:12px;padding:13px 15px;border:1.5px solid var(--bg-line);border-radius:11px;margin-bottom:9px;cursor:pointer;transition:border-color .15s,background .15s;}
.quiz-opt:hover{border-color:var(--ink-faint);}
.quiz-opt.correct{border-color:var(--green);background:var(--green-pale);}
.quiz-opt.wrong{border-color:var(--coral);background:var(--coral-pale);}
.quiz-opt.disabled{cursor:default;pointer-events:none;}
.quiz-letter{width:24px;height:24px;border-radius:7px;background:var(--bg-soft);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--ink-muted);flex-shrink:0;}
.quiz-opt.correct .quiz-letter{background:var(--green);color:#fff;}
.quiz-opt.wrong .quiz-letter{background:var(--coral);color:#fff;}
.quiz-opt-text{font-size:13.5px;font-weight:500;color:var(--ink);padding-top:2px;}
.quiz-explain{display:none;font-size:13px;font-weight:400;color:var(--ink-muted);line-height:1.6;background:var(--bg-soft);border-radius:10px;padding:14px 16px;margin-top:8px;}
.quiz-explain.show{display:block;}
.quiz-explain strong{color:var(--ink);}

.action-card{background:var(--amber-pale);border:1px solid var(--amber-bord);border-radius:16px;padding:22px 24px;}
.action-text{font-size:14.5px;font-weight:500;color:var(--ink);line-height:1.65;margin-bottom:16px;}
.action-check{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;}
.action-box{width:22px;height:22px;border-radius:7px;border:2px solid var(--amber);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;transition:background .15s;}
.action-box.checked{background:var(--amber);}
.action-label{font-size:13px;font-weight:700;color:#8a6a00;}

.lesson-nav{display:flex;justify-content:space-between;align-items:center;margin-top:40px;padding-top:24px;border-top:1px solid var(--bg-line);}
.nav-btn{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border:none;cursor:pointer;font-family:var(--sans);font-size:14px;font-weight:700;padding:13px 24px;border-radius:11px;text-decoration:none;transition:background .2s;}
.nav-btn:hover{background:var(--ink-soft);}
.nav-btn.ghost{background:var(--bg-mid);color:var(--ink-muted);}
.nav-btn.ghost:hover{background:var(--bg-line);}
.completion-badge{display:none;align-items:center;gap:8px;background:var(--green-pale);color:var(--green);font-size:12.5px;font-weight:700;padding:8px 16px;border-radius:100px;margin-bottom:20px;}
.completion-badge.show{display:inline-flex;}

@media(max-width:860px){
  .layout{grid-template-columns:1fr;}
  .sidebar{position:static;height:auto;border-right:none;border-bottom:1px solid var(--bg-line);}
  .main{padding:28px 20px 60px;}
}

/* ===== Direction Encre & Laiton — surcouche typographique ===== */
body{font-family:var(--sans);letter-spacing:0;}
h1,h2,h3,h4,.hero-h1,.s-title,.cta-h2,.p-name,.mod-title,.c-title,.hc-title,
.lecon-title,.q-title,.auth-title,.perf-title,.section-title,.edu-title,.tips-title{
  font-family:var(--display);letter-spacing:-.015em;
}
.hero-h1,.s-title,.cta-h2,.auth-title{font-weight:500;letter-spacing:-.018em;line-height:1.16;}
h3,h4,.p-name,.mod-title,.c-title,.hc-title,.lecon-title{font-weight:600;}
.s-tag,.f-copy,.hstat-label,.stat-label,.perf-note,.order-meta,.pos-value,
.price-cell,.asset-label,.badge,.eyebrow,.nav-balance{font-family:var(--mono);}

.nav-name em,.ft-name em{font-style:normal;color:var(--amber);}

/* Mise en valeur dans le corps des lecons : le gras porte la notion a
   retenir, l italique la nuance ou le terme technique. */
.script-text strong{color:var(--ink,#12212B);font-weight:700;}
.script-text em{font-style:italic;color:var(--ink-soft,#43555F);}
.script-text u{text-decoration:none;background:linear-gradient(transparent 62%,var(--amber-pale,#F6EFE0) 62%);
  box-shadow:inset 0 -1px 0 var(--amber,#B8862F);}
.script-text p + p{margin-top:14px;}

/* ===== L'itineraire =====
   Une route verticale plutot qu'une liste : on voit d'ou l'on vient,
   ou l'on est, et ce qu'il reste. Meme vocabulaire graphique que le
   carnet de route et les emblemes. */
.itin{padding:4px 4px 24px;}
.itin-tete{padding:0 8px 16px;border-bottom:1px solid var(--bg-line);margin-bottom:16px;}
.itin-formation{font-family:var(--display);font-size:16px;font-weight:600;color:var(--ink);line-height:1.25;}
.itin-compte{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-muted);margin-top:7px;}
.itin-barre{height:4px;background:var(--bg-mid);border-radius:100px;overflow:hidden;margin-top:10px;}
.itin-barre span{display:block;height:100%;background:var(--amber);border-radius:100px;transition:width .4s cubic-bezier(.4,0,.2,1);}

/* La route */
.route{position:relative;padding-left:30px;}
.route::before{content:"";position:absolute;left:11px;top:14px;bottom:14px;width:2px;
  background:repeating-linear-gradient(var(--bg-line) 0 6px, transparent 6px 11px);}
.etape-i{position:relative;margin-bottom:6px;}
.borne{position:absolute;left:-30px;top:6px;width:24px;height:24px;border-radius:50%;
  background:var(--bg);border:2px solid var(--bg-line);display:grid;place-items:center;
  font-family:var(--mono);font-size:10px;color:var(--ink-faint);z-index:1;transition:all .2s;}
.borne svg{width:11px;height:11px;}
.etape-i.faite .borne{background:var(--amber);border-color:var(--amber);color:#fff;}
.etape-i.ici .borne{background:var(--green);border-color:var(--green);color:#fff;
  box-shadow:0 0 0 4px var(--green-pale);}
.etape-titre{display:block;width:100%;text-align:left;background:transparent;border:0;cursor:pointer;
  font-family:var(--display);font-size:14.5px;font-weight:600;color:var(--ink-soft);
  padding:7px 9px;border-radius:9px;line-height:1.3;transition:background .15s,color .15s;}
.etape-titre:hover{background:var(--bg-soft);color:var(--ink);}
.etape-i.ici .etape-titre{color:var(--green);}
.etape-i.faite .etape-titre{color:var(--ink);}
.etape-meta{font-family:var(--mono);font-size:10px;color:var(--ink-faint);padding:0 9px 4px;letter-spacing:.06em;}

/* Les lecons de l'etape en cours */
.arrets{margin:2px 0 12px;padding-left:9px;border-left:1px solid var(--bg-line);}
.arret{display:flex;align-items:flex-start;gap:9px;padding:7px 9px;border-radius:8px;cursor:pointer;
  font-size:12.8px;font-weight:500;color:var(--ink-muted);transition:background .15s;line-height:1.35;}
.arret:hover{background:var(--bg-soft);color:var(--ink);}
.arret.ici{background:var(--green-pale);color:var(--green);font-weight:700;}
.arret.faite{color:var(--ink);}
.arret.bloque{opacity:.42;cursor:not-allowed;}
.arret.bloque:hover{background:transparent;}
.puce{width:15px;height:15px;border-radius:4px;flex:none;margin-top:1px;border:1.5px solid var(--bg-line);
  display:grid;place-items:center;background:var(--bg);}
.puce svg{width:9px;height:9px;opacity:0;}
.arret.faite .puce{background:var(--amber);border-color:var(--amber);}
.arret.faite .puce svg{opacity:1;}
.arret.ici .puce{border-color:var(--green);border-style:dashed;}

/* Changer de formation sans repasser par le menu */
.escale{margin-top:22px;padding-top:16px;border-top:1px solid var(--bg-line);}
.escale-titre{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-faint);padding:0 9px 9px;}
.escale a{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;text-decoration:none;
  font-size:12.8px;color:var(--ink-soft);transition:background .15s;}
.escale a:hover{background:var(--bg-soft);color:var(--ink);}
.escale a.courante{background:var(--green-pale);color:var(--green);font-weight:700;}
.jeton{width:7px;height:7px;border-radius:50%;background:var(--bg-line);flex:none;}
.escale a.courante .jeton{background:var(--green);}
.escale a.prete .jeton{background:var(--amber);}

@media(max-width:860px){
  .itin{padding-bottom:8px;}
  .route{padding-left:26px;}
  .borne{left:-26px;}
}
@media(prefers-reduced-motion:reduce){*{transition:none !important;}}

/* ===== Schemas des lecons ===== */
.schema{margin:26px 0;padding:20px 18px 14px;border:1px solid var(--bg-line,#DCDDD3);
  border-radius:12px;background:var(--bg,#FCFBF8);}
.schema svg{width:100%;height:auto;display:block;}
.schema figcaption{font-family:var(--mono,monospace);font-size:11.5px;line-height:1.55;
  color:var(--ink-muted,#7A8A93);margin-top:14px;padding-top:12px;
  border-top:1px solid var(--bg-line,#DCDDD3);}
@media(max-width:620px){.schema{padding:14px 12px 10px;margin:20px -6px;}}
</style>

<script>
/* ============ DONNÉES DES 16 LEÇONS — MAÎTRISER SON BUDGET ============ */
const LESSONS = [
{module:"Module 1 — Qu'est-ce que la monnaie ?", title:"L'origine de la monnaie", duration:"5 min",
script:[
"Avant de parler d'épargne ou d'investissement, il faut répondre à une question que presque personne ne se pose : <strong>qu'est-ce que l'argent, exactement ?</strong> Pas à quoi il sert, mais ce qu'il est. La réponse change la façon dont on le regarde ensuite, et c'est pour cela que cette formation commence ici.",
"Imagine une société sans monnaie. Tu es boulanger, tu veux des chaussures. Tu dois trouver un cordonnier qui, au même moment, a besoin de pain, et qui estime qu'une paire de chaussures vaut exactement la quantité de pain que tu proposes. Cette coïncidence est si improbable que les économistes lui ont donné un nom : <em>la double coïncidence des besoins</em>. C'est le problème que la monnaie a été inventée pour résoudre.",
"La solution trouvée partout dans le monde, indépendamment, a été la même : choisir un bien intermédiaire que tout le monde accepte. Le boulanger vend son pain contre ce bien, puis échange ce bien contre des chaussures. <strong>La monnaie n'est donc pas une invention de l'État, c'est une invention du commerce.</strong>",
"Ce qui a servi de monnaie au fil de l'histoire est instructif : coquillages, sel, bétail, barres de fer, perles de verre. Le mot <em>salaire</em> vient d'ailleurs du sel, qui servait à payer les soldats romains. Toutes ces monnaies ont fini par disparaître, et toujours pour la même raison : <u>quand un bien devient trop facile à produire, il cesse de valoir quelque chose</u>.",
"L'exemple le plus parlant est celui des perles de verre en Afrique de l'Ouest. Elles ont servi de monnaie pendant des siècles, parce qu'elles étaient difficiles à fabriquer localement. Puis les Européens sont arrivés avec des perles produites industriellement, à un coût dérisoire. En quelques décennies, l'épargne accumulée par des générations entières est devenue sans valeur, non parce que les gens avaient mal travaillé, mais <strong>parce que quelqu'un pouvait fabriquer leur monnaie plus vite qu'eux ne pouvaient l'épargner.</strong>",
"Retiens cette phrase, car toute la suite de la formation en découle. L'or a fini par s'imposer précisément parce qu'il échappait à ce problème : personne ne peut en fabriquer, il faut l'extraire, et l'extraire coûte cher.",
"Une dernière idée, plus profonde. Quand tu reçois ton salaire, tu ne reçois pas des euros. <strong>Tu reçois une créance sur le travail des autres</strong>, un droit de demander plus tard un bien ou un service à quelqu'un que tu ne connais pas. La monnaie est du temps de vie mis en réserve. C'est pour cela que la voir se déprécier n'est pas un sujet abstrait : c'est du travail déjà fourni qui s'efface."
],
quiz:[
{q:"Quel problème la monnaie a-t-elle résolu ?",opts:["Le manque de matières premières","La double coïncidence des besoins dans le troc","Le besoin de payer des impôts","L'absence de banques"],correct:1,
explain:"Il fallait qu'un boulanger voulant des chaussures trouve un cordonnier voulant du pain, au même moment et pour la même valeur. La monnaie supprime cette contrainte."},
{q:"Pourquoi les perles de verre ont-elles cessé d'être une monnaie ?",opts:["Les gens ont préféré l'or","Elles sont devenues faciles à produire en masse","Un roi les a interdites","Elles se cassaient trop facilement"],correct:1,
explain:"Quand un bien devient facile à produire, l'épargne accumulée dans ce bien s'efface. C'est le mécanisme central de toute cette formation."},
{q:"Que représente vraiment ton salaire ?",opts:["Un bien matériel","Une créance sur le travail futur des autres","Une dette envers l'État","Une part de la richesse nationale"],correct:1,
explain:"C'est du temps de travail mis en réserve. Sa dépréciation efface donc du travail déjà fourni."}
],
action:"Ce soir, calcule combien d'heures de ton travail représente une dépense que tu envisages : divise son prix par ton salaire horaire net. Ce chiffre-là est le prix réel, et il change souvent la décision."
},
{module:"Module 1 — Qu'est-ce que la monnaie ?", title:"Les 3 fonctions d'une monnaie saine", duration:"5 min",
script:[
"Une monnaie remplit 3 fonctions, et l'ordre dans lequel elle les perd raconte toujours la même histoire. Savoir les distinguer permet de comprendre ce qui se passe aujourd'hui avec l'euro, et ce qui s'est passé ailleurs avec des monnaies effondrées.",
"<strong>Fonction 1 : l'intermédiaire des échanges.</strong> C'est la plus visible. La monnaie sert à acheter et à vendre sans troc. L'euro remplit parfaitement cette fonction, et c'est la raison pour laquelle la plupart des gens n'ont jamais réfléchi aux 2 autres.",
"<strong>Fonction 2 : l'unité de compte.</strong> La monnaie sert à mesurer et à comparer la valeur des choses. C'est elle qui permet de dire qu'un vélo vaut 3 fois plus qu'un manteau. Une bonne unité de mesure doit être stable : personne n'accepterait un mètre qui raccourcit chaque année, et pourtant nous acceptons une unité monétaire qui perd de la valeur.",
"<figure class=\"schema\"><svg viewBox=\"0 0 700 228\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"200\" y=\"20\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" letter-spacing=\"1.4\" fill=\"#1E4B3C\">L'EURO LE FAIT BIEN</text><text x=\"560\" y=\"20\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" letter-spacing=\"1.4\" fill=\"#B8862F\">L'EURO LE FAIT MAL</text><text x=\"20\" y=\"44\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#43555F\">Servir aux échanges du quotidien</text><rect x=\"20\" y=\"54\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#EFF0EA\"/><rect x=\"20\" y=\"54\" width=\"614\" height=\"18\" rx=\"5\" fill=\"#E7EFEA\"/><rect x=\"634\" y=\"54\" width=\"46\" height=\"18\" rx=\"5\" fill=\"#F6EFE0\"/><text x=\"28\" y=\"67\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#1E4B3C\">excellent</text><text x=\"672\" y=\"67\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8E661F\"></text><text x=\"20\" y=\"100\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#43555F\">Mesurer et comparer les prix</text><rect x=\"20\" y=\"110\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#EFF0EA\"/><rect x=\"20\" y=\"110\" width=\"475\" height=\"18\" rx=\"5\" fill=\"#E7EFEA\"/><rect x=\"495\" y=\"110\" width=\"185\" height=\"18\" rx=\"5\" fill=\"#F6EFE0\"/><text x=\"28\" y=\"123\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#1E4B3C\">correct</text><text x=\"672\" y=\"123\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8E661F\"></text><text x=\"20\" y=\"156\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#43555F\">Conserver la valeur sur 20 ans</text><rect x=\"20\" y=\"166\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#EFF0EA\"/><rect x=\"20\" y=\"166\" width=\"79\" height=\"18\" rx=\"5\" fill=\"#E7EFEA\"/><rect x=\"99\" y=\"166\" width=\"581\" height=\"18\" rx=\"5\" fill=\"#F6EFE0\"/><text x=\"28\" y=\"179\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#1E4B3C\"></text><text x=\"672\" y=\"179\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8E661F\">environ -33 %</text></svg><figcaption>Une monnaie remplit 3 fonctions. L'euro en réussit 2, et échoue sur celle qui compte pour l'épargnant.</figcaption></figure>",
"<strong>Fonction 3 : la réserve de valeur.</strong> La monnaie doit permettre de conserver du pouvoir d'achat dans le temps, pour reporter à plus tard le fruit de son travail. <u>C'est la fonction la plus importante pour l'épargnant, et c'est la première à se dégrader.</u>",
"Prenons un exemple concret. Avec une inflation moyenne de 2 % par an, une somme perd environ <strong>18 % de son pouvoir d'achat en 10 ans</strong>, et environ 33 % en 20 ans. Sur une carrière entière, l'ordre de grandeur devient considérable. Ce n'est pas un accident : la Banque centrale européenne vise explicitement une inflation de 2 %, considérée comme le niveau souhaitable pour l'économie.",
"Il y a là une tension qu'il faut nommer clairement, car elle explique presque tout le reste. <strong>Une inflation modérée est bonne pour l'économie et mauvaise pour l'épargnant.</strong> Elle encourage à dépenser et à investir plutôt qu'à thésauriser, elle allège le poids des dettes, elle facilite les ajustements de salaires. Mais celui qui laisse dormir son argent en supporte le coût.",
"Ce n'est donc ni un complot ni une anomalie. C'est un arbitrage assumé par les institutions, dont la conséquence pratique est simple : <strong>l'euro remplit très bien 2 fonctions sur 3</strong>. Excellent moyen d'échange, unité de compte acceptable, mauvaise réserve de valeur sur le long terme. La conclusion pratique de toute cette formation tient d'ailleurs en une phrase : garde en euros ce dont tu as besoin à court terme, et conserve ailleurs ce que tu veux faire durer."
],

{module:"Module 1 — Qu'est-ce que la monnaie ?", title:"Pourquoi la monnaie n'est pas la richesse", duration:"5 min",
script:[
"Voici une distinction qui paraît théorique et qui décide pourtant de la façon dont on construit un patrimoine. <strong>La monnaie n'est pas la richesse, elle en est le titre de propriété.</strong>",
"La richesse réelle, ce sont les choses qui produisent ou qui servent : des terres, des immeubles, des machines, des entreprises, des compétences, des infrastructures. La monnaie, elle, ne produit rien. <em>Elle donne le droit d'y accéder.</em>",
"L'expérience de pensée la plus parlante est la suivante. Imagine qu'on double du jour au lendemain la quantité d'euros en circulation, et que chacun voie son compte doubler. Sommes-nous 2 fois plus riches ? Non, évidemment : il y a toujours autant de logements, de voitures et de pain. Les prix doubleront simplement, et chacun se retrouvera exactement au même point. <u>Créer de la monnaie ne crée aucune richesse, cela redistribue seulement les droits sur la richesse existante.</u>",
"Cette redistribution n'est jamais neutre, et c'est le point le plus important de la leçon. <strong>Ceux qui reçoivent la monnaie nouvelle en premier achètent aux anciens prix ; ceux qui la reçoivent en dernier achètent aux nouveaux prix.</strong> Les premiers servis sont généralement les acteurs financiers, les grandes entreprises et les emprunteurs importants. Les derniers servis sont les salariés, dont les revenus s'ajustent avec retard.",
"Ce phénomène porte un nom, l'effet Cantillon, du nom d'un économiste du XVIIIe siècle. Il explique une part importante de l'écart de patrimoine que l'on observe entre ceux qui détiennent des actifs et ceux qui détiennent de la monnaie et un salaire.",
"La conséquence pratique est directe et sans idéologie. <strong>Détenir de la monnaie, c'est se placer volontairement en fin de file.</strong> Détenir des actifs, c'est se rapprocher de la richesse réelle, celle dont le prix s'ajuste. Cela ne veut pas dire qu'il faut tout convertir : on a besoin de liquidités, et on l'a vu, l'épargne de précaution reste indispensable.",
"Cela veut dire qu'il faut décider consciemment de la part qu'on laisse en monnaie, plutôt que de la subir. <strong>Le compte courant est un lieu de passage, pas un lieu de stockage.</strong>"
],
quiz:[
{q:"Que se passerait-il si tous les comptes doublaient du jour au lendemain ?",opts:["Chacun serait 2 fois plus riche","Les prix doubleraient et la richesse réelle serait inchangée","L'économie s'effondrerait immédiatement","Les banques feraient faillite"],correct:1,
explain:"La quantité de logements, de voitures et de pain n'aurait pas bougé. Créer de la monnaie redistribue des droits, cela ne crée aucune richesse."},
{q:"Qu'est-ce que l'effet Cantillon ?",opts:["Une taxe sur les transactions","L'avantage de ceux qui reçoivent la monnaie nouvelle en premier","Un indicateur de la Banque centrale","Une méthode de calcul de l'inflation"],correct:1,
explain:"Les premiers servis achètent aux anciens prix, les derniers aux nouveaux. Cela explique une part de l'écart entre détenteurs d'actifs et détenteurs de salaires."},
{q:"Quelle conclusion pratique en tirer ?",opts:["Ne jamais garder d'argent liquide","Décider consciemment de la part laissée en monnaie plutôt que la subir","Emprunter le plus possible","Convertir toute son épargne en or"],correct:1,
explain:"L'épargne de précaution reste indispensable. Ce qui change, c'est de choisir cette part au lieu de la laisser s'installer par défaut."}
],
action:"Fais 2 colonnes ce soir. À gauche, tout ce que tu possèdes en monnaie : comptes, livrets, liquidités. À droite, tout ce que tu possèdes en actifs réels. Regarde la proportion, sans jugement. C'est ton point de départ, et la plupart des gens sont surpris du déséquilibre."
},
{module:"Module 2 — L'étalon-or et sa disparition", title:"Bretton Woods, l'ordre monétaire de 1944", duration:"5 min",
script:[
"Pour comprendre la monnaie d'aujourd'hui, il faut connaître 2 dates. La première est 1944, l'année où le système monétaire mondial actuel a été conçu, dans un hôtel du New Hampshire, alors que la Seconde Guerre mondiale n'était pas terminée.",
"Le contexte est décisif. Les nations veulent éviter le désordre monétaire des années 1930, fait de dévaluations en chaîne et de guerres commerciales, qui a contribué à la crise puis au conflit. <strong>L'objectif est la stabilité</strong>, et 44 pays s'accordent sur une architecture commune.",
"Le mécanisme est simple à décrire. Le dollar américain devient convertible en or à un taux fixe, <strong>35 dollars l'once</strong>. Toutes les autres monnaies sont rattachées au dollar par des taux de change fixes. Autrement dit, chaque monnaie est indirectement adossée à l'or, à travers le dollar.",
"Pourquoi les États-Unis ? Parce qu'en 1944, ils détiennent l'essentiel des réserves d'or mondiales, leur territoire est intact, et leur économie est la seule en état de fonctionner à plein. La position n'est donc pas négociée, elle est constatée.",
"Le système fonctionne, et bien, pendant environ 25 ans. Les échanges internationaux se développent, les taux de change ne varient pas, et <u>l'inflation reste faible dans la plupart des pays industrialisés</u>. Cette période est souvent citée comme celle de la plus forte progression du niveau de vie de l'histoire moderne.",
"Mais le système contient une contradiction que l'économiste Robert Triffin identifie dès les années 1960, et qui porte son nom. <strong>Le monde a besoin de dollars pour commercer, donc les États-Unis doivent en émettre toujours plus. Mais plus ils en émettent, moins chaque dollar est réellement couvert par de l'or</strong>, et moins la promesse de convertibilité est crédible.",
"Cette contradiction n'a pas de solution interne : le système doit soit freiner le commerce mondial, soit renoncer à la convertibilité. Les dépenses de la guerre du Vietnam et des programmes sociaux américains accélèrent le déséquilibre, et à la fin des années 1960, plusieurs États commencent à demander la conversion de leurs dollars en or. Ce qui nous mène à la seconde date, celle de la leçon suivante."
],
quiz:[
{q:"À quel taux le dollar était-il convertible en or ?",opts:["1 dollar l'once","35 dollars l'once","100 dollars l'once","Il variait chaque année"],correct:1,
explain:"Un taux fixe, auquel toutes les autres monnaies étaient rattachées par des changes fixes."},
{q:"En quoi consiste le dilemme de Triffin ?",opts:["Les pays refusaient de commercer en dollars","Le monde a besoin de dollars, mais plus il y en a, moins ils sont couverts par l'or","L'or manquait dans les mines","Les taux de change étaient trop volatils"],correct:1,
explain:"Une contradiction sans solution interne : le système devait soit freiner le commerce mondial, soit renoncer à la convertibilité."},
{q:"Pourquoi les États-Unis étaient-ils au centre du système ?",opts:["Par un vote démocratique des 44 pays","Parce qu'ils détenaient l'essentiel des réserves d'or et la seule économie intacte","Parce qu'ils avaient inventé l'étalon-or","Parce que le dollar était la plus ancienne monnaie"],correct:1,
explain:"La position n'a pas été négociée, elle a été constatée en 1944."}
],
action:"Cherche « Bretton Woods 1944 » et lis un article de 5 minutes sur le sujet. Note une seule idée qui t'a surpris. Comprendre d'où vient le système actuel change la façon dont on interprète l'actualité économique."
},
{module:"Module 2 — L'étalon-or et sa disparition", title:"1971, le tournant Nixon", duration:"5 min",
script:[
"La seconde date à retenir est le <strong>15 août 1971</strong>. Ce dimanche-là, le président américain Richard Nixon annonce à la télévision la suspension de la convertibilité du dollar en or. Il présente la mesure comme temporaire. Elle est définitive.",
"Ce qui l'a provoquée : les réserves d'or américaines fondent depuis des années, parce que les États étrangers, la France en tête, demandent à convertir leurs dollars. Le stock d'or ne couvre plus qu'une fraction des dollars en circulation. Le choix se résume à honorer la convertibilité en asséchant les réserves, ou à y renoncer.",
"Ce jour-là, le monde bascule dans un système entièrement nouveau, et jamais expérimenté à cette échelle : <strong>une monnaie sans aucun ancrage matériel</strong>. On parle de monnaie <em>fiduciaire</em>, du latin <em>fiducia</em>, la confiance. La valeur de l'euro que tu as en poche ne repose sur aucun métal, aucune marchandise, aucune promesse de conversion. Elle repose sur la confiance dans l'institution qui l'émet et dans l'économie qui l'accepte.",
"<figure class=\"schema\"><svg viewBox=\"0 0 700 168\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><line x1=\"34\" y1=\"96\" x2=\"666\" y2=\"96\" stroke=\"#DCDDD3\" stroke-width=\"2\"/><path d=\"M666 96 l-9 -5 v10 z\" fill=\"#DCDDD3\"/><line x1=\"53\" y1=\"96\" x2=\"53\" y2=\"62\" stroke=\"#1E4B3C\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/><circle cx=\"53\" cy=\"96\" r=\"7\" fill=\"#1E4B3C\"/><circle cx=\"53\" cy=\"96\" r=\"12\" fill=\"none\" stroke=\"#1E4B3C\" stroke-width=\"1\" opacity=\".35\"/><text x=\"53\" y=\"52\" text-anchor=\"start\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14\" font-weight=\"600\" fill=\"#12212B\">1944</text><text x=\"53\" y=\"122\" text-anchor=\"start\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12\" fill=\"#43555F\">Bretton Woods, le dollar adossé à l'or</text><line x1=\"299\" y1=\"96\" x2=\"299\" y2=\"62\" stroke=\"#A24332\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/><circle cx=\"299\" cy=\"96\" r=\"7\" fill=\"#A24332\"/><circle cx=\"299\" cy=\"96\" r=\"12\" fill=\"none\" stroke=\"#A24332\" stroke-width=\"1\" opacity=\".35\"/><text x=\"299\" y=\"52\" text-anchor=\"middle\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14\" font-weight=\"600\" fill=\"#12212B\">1971</text><text x=\"299\" y=\"122\" text-anchor=\"middle\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12\" fill=\"#43555F\">Fin de la convertibilité</text><line x1=\"647\" y1=\"96\" x2=\"647\" y2=\"62\" stroke=\"#B8862F\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/><circle cx=\"647\" cy=\"96\" r=\"7\" fill=\"#B8862F\"/><circle cx=\"647\" cy=\"96\" r=\"12\" fill=\"none\" stroke=\"#B8862F\" stroke-width=\"1\" opacity=\".35\"/><text x=\"647\" y=\"52\" text-anchor=\"end\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14\" font-weight=\"600\" fill=\"#12212B\">Aujourd'hui</text><text x=\"647\" y=\"122\" text-anchor=\"end\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12\" fill=\"#43555F\">Monnaie fiduciaire, sans ancrage</text></svg><figcaption>Depuis 1971, plus aucune limite physique n'encadre la création monétaire.</figcaption></figure>",
"Il faut être précis et éviter le catastrophisme, car ce point est souvent mal utilisé. <u>Une monnaie fiduciaire n'est pas une monnaie sans valeur.</u> Elle a une valeur parce qu'elle est acceptée partout, qu'elle est exigée pour payer l'impôt, et que l'institution qui l'émet dispose d'outils pour défendre sa stabilité. Ce n'est pas rien.",
"Ce qui change, en revanche, est fondamental : <strong>il n'existe plus de limite physique à la création monétaire.</strong> Sous l'étalon-or, émettre davantage supposait de détenir davantage d'or, donc d'en extraire, ce qui coûte cher et prend du temps. Depuis 1971, la quantité de monnaie dépend de décisions humaines et institutionnelles, pas d'une contrainte matérielle.",
"C'est la raison pour laquelle beaucoup de graphiques économiques changent de pente autour de cette date : masse monétaire, dette publique, prix de l'immobilier, écarts de patrimoine. La corrélation ne prouve pas à elle seule la causalité, et les économistes en débattent sérieusement. Mais <strong>le changement de régime est réel, et il est daté.</strong>",
"Retiens la conséquence pratique, qui est le vrai sujet de cette formation. Depuis 1971, <strong>l'épargne en monnaie n'est plus protégée par une contrainte extérieure.</strong> Elle dépend d'arbitrages politiques et institutionnels, qui peuvent être raisonnables, et qui ne t'appartiennent pas."
],
quiz:[
{q:"Qu'a annoncé Nixon le 15 août 1971 ?",opts:["La création de l'euro","La suspension de la convertibilité du dollar en or","Une dévaluation du dollar de 50 %","La fin de la Réserve fédérale"],correct:1,
explain:"Présentée comme temporaire, la mesure est devenue définitive et a fait basculer le monde en régime de monnaie fiduciaire."},
{q:"Que signifie « monnaie fiduciaire » ?",opts:["Une monnaie garantie par l'or","Une monnaie dont la valeur repose sur la confiance et l'acceptation","Une monnaie électronique","Une monnaie émise par les banques privées"],correct:1,
explain:"Du latin fiducia, la confiance. Elle n'est pas sans valeur : elle est acceptée partout et exigée pour payer l'impôt."},
{q:"Quel est le changement fondamental apporté par 1971 ?",opts:["Les billets ont changé d'apparence","Il n'existe plus de limite physique à la création monétaire","Les banques ont été nationalisées","L'or est devenu illégal"],correct:1,
explain:"Sous l'étalon-or, émettre supposait d'extraire du métal. Depuis, la quantité de monnaie dépend de décisions institutionnelles."}
],
action:"Cherche un graphique de la masse monétaire de la zone euro ou des États-Unis depuis 1960. Regarde la pente avant et après 1971. Tu n'as rien à en conclure ce soir, seulement à voir de tes yeux ce dont parle cette leçon."
},
{module:"Module 2 — L'étalon-or et sa disparition", title:"Ce qui a changé depuis", duration:"5 min",
script:[
"Un demi-siècle après 1971, quels effets concrets observe-t-on ? Cette leçon rassemble ce qui est mesuré et documenté, en distinguant soigneusement les faits des interprétations, parce que ce sujet attire beaucoup de discours excessifs dans les 2 sens.",
"<strong>Fait 1 : la masse monétaire a crû beaucoup plus vite que la production.</strong> Dans la plupart des économies développées, la quantité de monnaie en circulation a progressé nettement plus rapidement que la quantité de biens et de services produits. Ce n'est pas contesté, c'est mesuré par les banques centrales elles-mêmes.",
"<strong>Fait 2 : l'inflation des biens courants est restée modérée.</strong> Contrairement à ce qu'on pourrait attendre, les prix à la consommation ont augmenté lentement pendant des décennies, autour de 2 % par an, avec des épisodes plus vifs. La mondialisation et les gains de productivité ont largement absorbé la pression.",
"<strong>Fait 3 : les prix des actifs ont explosé.</strong> Immobilier, actions, objets rares : ces prix ont progressé bien plus vite que les salaires. Un logement représentait en France l'équivalent de quelques années de revenu moyen il y a 50 ans ; il en représente aujourd'hui bien davantage dans les grandes villes.",
"C'est ici que se trouve le mécanisme le plus utile à comprendre, et il explique le sentiment d'appauvrissement malgré une inflation officiellement basse. <u>L'argent créé ne se dirige pas prioritairement vers le pain et les légumes, il se dirige vers les actifs.</u> Résultat : le pouvoir d'achat courant se maintient à peu près, mais <strong>le pouvoir d'accès au patrimoine se dégrade fortement.</strong>",
"Conséquence directe, et c'est le vrai enjeu social du sujet : <strong>épargner en monnaie ne permet plus de rattraper le prix des actifs.</strong> Celui qui met de côté sur un livret pour acheter un logement plus tard voit son objectif s'éloigner plus vite qu'il n'avance. Celui qui détient déjà des actifs voit son patrimoine progresser sans effort supplémentaire.",
"Deux précautions pour finir, car l'honnêteté intellectuelle compte plus que l'effet de manche. Premièrement, ces évolutions ont d'autres causes que la monnaie : démographie, urbanisation, réglementation de la construction, baisse des taux d'intérêt. Deuxièmement, cette période a aussi vu progresser l'espérance de vie, l'accès aux soins et à l'information. <strong>Le tableau n'est pas noir, il est contrasté</strong>, et ta conclusion pratique reste la même : ce que tu veux faire durer ne doit pas rester en monnaie."
],
quiz:[
{q:"Pourquoi l'inflation des biens courants est-elle restée modérée ?",opts:["Parce que la monnaie n'a pas augmenté","Parce que mondialisation et gains de productivité ont absorbé la pression","Parce que les prix sont plafonnés par la loi","Parce que les salaires ont baissé"],correct:1,
explain:"La création monétaire s'est surtout dirigée vers les actifs plutôt que vers les biens de consommation courante."},
{q:"Quelle est la conséquence pour un épargnant en monnaie ?",opts:["Son pouvoir d'achat courant s'effondre","Son pouvoir d'accès au patrimoine se dégrade","Il ne se passe rien","Son épargne double tous les 10 ans"],correct:1,
explain:"L'objectif s'éloigne plus vite qu'on n'avance, alors que celui qui détient déjà des actifs progresse sans effort supplémentaire."},
{q:"Quelle précaution intellectuelle faut-il garder ?",opts:["Tout attribuer à la création monétaire","Reconnaître d'autres causes : démographie, urbanisation, taux d'intérêt","Considérer que rien n'a changé","Ignorer les données officielles"],correct:1,
explain:"La monnaie explique une partie du phénomène, pas la totalité. Un raisonnement honnête tient compte des autres facteurs."}
],
action:"Cherche le prix moyen du mètre carré dans ta ville il y a 20 ans, puis aujourd'hui. Compare l'évolution à celle du salaire moyen français sur la même période. L'écart entre les 2 courbes est le sujet exact de cette leçon."
},
{module:"Module 3 — Banques centrales et inflation", title:"Comment fonctionne une banque centrale", duration:"5 min",
script:[
"Les banques centrales sont citées dans toutes les actualités économiques, et presque personne ne sait ce qu'elles font concrètement. Voici l'essentiel, en évitant à la fois le jargon et la caricature.",
"Une banque centrale n'est pas une banque pour les particuliers : <strong>c'est la banque des banques.</strong> La Banque centrale européenne, pour la zone euro, poursuit un objectif principal fixé par les traités : <u>la stabilité des prix, définie comme une inflation proche de 2 % à moyen terme</u>. Tout le reste découle de cet objectif.",
"Son outil principal est <strong>le taux directeur</strong>, c'est-à-dire le taux auquel les banques commerciales se financent auprès d'elle. Ce taux se diffuse ensuite dans toute l'économie, et c'est ce qui te concerne directement : il influence le taux de ton crédit immobilier, celui de ton crédit à la consommation, et la rémunération de ton épargne.",
"Le mécanisme fonctionne dans les 2 sens. <strong>Quand l'inflation est trop forte, la banque centrale monte les taux.</strong> Emprunter coûte plus cher, les ménages et les entreprises empruntent moins, la demande ralentit, et les prix se calment. Le prix à payer est un ralentissement de l'activité, et souvent une hausse du chômage. <strong>Quand l'économie ralentit trop, elle baisse les taux</strong>, ce qui stimule le crédit et l'activité, au risque de nourrir l'inflation et les bulles d'actifs.",
"Un second outil est apparu après la crise de 2008 : <strong>l'assouplissement quantitatif</strong>, qui consiste pour la banque centrale à acheter massivement des obligations, notamment d'État, avec de la monnaie qu'elle crée. Cela fait baisser les taux de long terme et injecte des liquidités dans le système financier.",
"Voici le point qu'il faut retenir pour toi, et il est concret. <strong>Ces décisions ne sont pas neutres pour ton patrimoine.</strong> Des taux bas favorisent les emprunteurs et les détenteurs d'actifs, et pénalisent les épargnants en livret. Des taux hauts font l'inverse. Une part importante de ce qui arrive à ton argent chaque année vient de décisions prises par une institution sur laquelle tu n'as aucune prise.",
"La conclusion n'est pas de suivre l'actualité des banques centrales, ce qui ne servirait à rien. C'est de construire une organisation financière <strong>qui ne dépende pas de ces décisions</strong> : une épargne de précaution disponible, des actifs réels pour le long terme, et une dette à taux fixe plutôt que variable quand on emprunte."
],

{module:"Module 3 — Banques centrales et inflation", title:"L'inflation expliquée simplement", duration:"5 min",
script:[
"L'inflation est le mot le plus employé et le moins compris de l'économie courante. Cette leçon sert à la définir précisément, puis à expliquer pourquoi le chiffre officiel te semble souvent faux.",
"<strong>Définition : l'inflation est la hausse générale et durable du niveau des prix.</strong> Les 2 adjectifs comptent. <em>Générale</em>, car la hausse d'un seul produit n'est pas de l'inflation. <em>Durable</em>, car une flambée passagère n'en est pas non plus. Autre façon de le dire, plus utile pour un épargnant : l'inflation est la baisse du pouvoir d'achat de la monnaie.",
"En France, elle est mesurée par l'INSEE à l'aide d'un <strong>panier de biens et services</strong> représentatif de la consommation moyenne des ménages, dont la composition est révisée régulièrement. Chaque poste y est pondéré selon son poids réel dans les dépenses : le logement pèse lourd, les biens électroniques beaucoup moins.",
"D'où vient alors le décalage constant entre le chiffre annoncé et le sentiment des gens ? De 3 raisons précises, et aucune n'est un complot.",
"<strong>1. Ton panier n'est pas le panier moyen.</strong> Si tu es locataire dans une grande ville avec une voiture, ton inflation personnelle est très supérieure à celle d'un propriétaire sans crédit vivant à la campagne. La moyenne ne décrit personne en particulier.",
"<strong>2. La mémoire des prix est sélective.</strong> Nous retenons les hausses des produits achetés souvent, comme le carburant ou l'alimentation, et nous oublions les baisses de produits achetés rarement, comme l'électroménager ou les télécommunications.",
"<strong>3. La qualité est prise en compte dans le calcul.</strong> Si un produit coûte 10 % de plus mais dure 2 fois plus longtemps, l'INSEE considère qu'une partie de la hausse correspond à une amélioration et non à de l'inflation. Cette méthode est défendable et discutée, mais elle explique une partie de l'écart perçu.",
"Pour toi, la conclusion est simple et opérationnelle : <u>c'est ton inflation personnelle qui compte, pas la moyenne nationale</u>. Elle se calcule en comparant tes propres dépenses d'une année sur l'autre, poste par poste, ce qui est précisément ce que permet ton tableau de budget.",
"Un dernier point à retenir, car il est contre-intuitif. <strong>Une inflation modérée n'est pas dangereuse pour celui qui investit ; elle l'est pour celui qui thésaurise.</strong> Les revenus, les loyers et les prix des actifs s'ajustent au fil du temps. Les euros posés sur un compte, eux, ne s'ajustent jamais."
],
quiz:[
{q:"Quelle est la définition exacte de l'inflation ?",opts:["La hausse du prix du carburant","La hausse générale et durable du niveau des prix","La baisse des salaires","L'augmentation de la masse monétaire"],correct:1,
explain:"Générale et durable : la hausse d'un seul produit ou une flambée passagère n'en sont pas."},
{q:"Pourquoi le chiffre officiel semble-t-il souvent faux ?",opts:["Il est truqué","Parce que ton panier de consommation diffère du panier moyen","Parce qu'il est calculé tous les 5 ans","Parce qu'il exclut l'alimentation"],correct:1,
explain:"S'y ajoutent la mémoire sélective des prix et la prise en compte de la qualité dans le calcul."},
{q:"Qui subit le plus l'inflation ?",opts:["Celui qui investit","Celui qui laisse son argent dormir sur un compte","Celui qui emprunte","Celui qui possède un logement"],correct:1,
explain:"Revenus, loyers et prix d'actifs s'ajustent avec le temps. Les euros posés sur un compte, jamais."}
],
action:"Reprends ton tableau de budget et compare 3 postes entre l'an dernier et cette année : logement, alimentation, transport. Le pourcentage obtenu est ton inflation personnelle, et c'est le seul chiffre qui te concerne vraiment."
},
{module:"Module 3 — Banques centrales et inflation", title:"Calculer ta perte réelle", duration:"5 min",
script:[
"Cette leçon est la plus concrète du module. Elle consiste à mettre un chiffre sur quelque chose que personne ne voit passer : ce que ton épargne perd chaque année sans qu'aucune ligne de relevé ne l'indique.",
"Le calcul repose sur une notion simple, <strong>le taux réel</strong>, qui se distingue du taux affiché sur ton livret, dit taux nominal. La formule exacte divise 1 plus le rendement par 1 plus l'inflation. Dans la vie courante, la soustraction donne un résultat très proche : <strong>taux réel égale rendement moins inflation.</strong>",
"Prenons un exemple chiffré. Un livret rémunéré à 2 % pendant une année où l'inflation atteint 3 % donne un taux réel de moins 1 %. Sur 10 000 € placés, le relevé affichera 10 200 € en fin d'année, et pourtant <u>cette somme achètera moins de choses que les 10 000 € de départ</u>. C'est ce paradoxe qui rend l'inflation si difficile à percevoir : les 2 chiffres évoluent en sens contraire, et seul le premier est affiché.",
"Le mécanisme s'aggrave avec le temps, parce qu'il se compose. Une perte de 1 % par an représente environ <strong>10 % de pouvoir d'achat sur 10 ans</strong>. Sur une épargne de précaution de 15 000 €, cela correspond à 1 500 € évaporés, sans qu'aucun prélèvement n'apparaisse nulle part.",
"Faut-il en conclure qu'il faut vider ses livrets ? <strong>Non, et c'est important.</strong> L'épargne de précaution doit rester disponible et sans risque, même si elle perd un peu de valeur. Ce que tu paies, c'est une assurance : le droit de ne jamais être contraint de vendre un actif au mauvais moment. Personne ne reproche à son assurance habitation de ne rien rapporter.",
"La bonne conclusion est celle-ci. <strong>Distingue les 3 étages de ton argent.</strong> Ce dont tu peux avoir besoin demain reste liquide, et tu acceptes qu'il perde un peu. Ce dont tu auras besoin dans 2 à 5 ans se place sur des supports sûrs et un peu mieux rémunérés. Ce dont tu n'auras pas besoin avant 8 ans ou plus n'a rien à faire en monnaie.",
"L'erreur la plus fréquente n'est pas de détenir un livret, c'est d'y laisser dormir <strong>la totalité</strong> de son épargne pendant 10 ans, faute d'avoir jamais fait ce calcul."
],
quiz:[
{q:"Comment se calcule le taux réel, en approximation courante ?",opts:["Rendement plus inflation","Rendement moins inflation","Rendement multiplié par l'inflation","Rendement divisé par 2"],correct:1,
explain:"La formule exacte divise 1 plus le rendement par 1 plus l'inflation, mais la soustraction en est très proche."},
{q:"Un livret à 2 % avec 3 % d'inflation, que produit-il ?",opts:["Un gain de 2 %","Une perte de pouvoir d'achat de 1 %","Un résultat neutre","Un gain de 5 %"],correct:1,
explain:"Le relevé affiche pourtant une progression. C'est ce paradoxe qui rend l'inflation invisible."},
{q:"Faut-il vider ses livrets ?",opts:["Oui, immédiatement","Non, l'épargne de précaution doit rester disponible malgré la perte","Oui, sauf le livret A","Seulement si l'inflation dépasse 5 %"],correct:1,
explain:"C'est le prix d'une assurance : le droit de ne jamais être contraint de vendre au mauvais moment."}
],
action:"Note le montant total de ton épargne et le taux moyen de tes livrets. Soustrais le dernier taux d'inflation publié, et applique le résultat à ton montant. Le chiffre obtenu est ta perte annuelle réelle, et beaucoup de gens le découvrent avec surprise."
},
{module:"Module 4 — Bonnes et mauvaises monnaies", title:"Les critères d'une monnaie saine", duration:"5 min",
script:[
"Pourquoi certaines choses ont-elles servi de monnaie pendant des millénaires, et d'autres quelques décennies ? Les économistes ont dégagé <strong>6 critères</strong> qui permettent de comparer objectivement n'importe quelle monnaie, ancienne ou récente.",
"<strong>1. La rareté.</strong> La quantité disponible doit être limitée et difficile à augmenter. C'est le critère décisif, celui qui a fait disparaître les coquillages et les perles de verre.",
"<strong>2. La durabilité.</strong> La monnaie ne doit pas se dégrader avec le temps. Le bétail et le sel remplissaient mal ce critère, l'or parfaitement.",
"<strong>3. La divisibilité.</strong> Il faut pouvoir la fractionner pour payer aussi bien une maison qu'un pain, sans perdre de valeur dans l'opération.",
"<strong>4. La transportabilité.</strong> Elle doit pouvoir se déplacer facilement. C'est la faiblesse principale de l'or physique, et la raison historique pour laquelle les billets, initialement des reçus de dépôt, se sont imposés.",
"<figure class=\"schema\"><svg viewBox=\"0 0 700 340\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"200\" y=\"20\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" letter-spacing=\"1.4\" fill=\"#1E4B3C\">L'OR</text><text x=\"560\" y=\"20\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" letter-spacing=\"1.4\" fill=\"#B8862F\">L'EURO</text><text x=\"20\" y=\"44\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#43555F\">Rareté</text><rect x=\"20\" y=\"54\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#EFF0EA\"/><rect x=\"20\" y=\"54\" width=\"581\" height=\"18\" rx=\"5\" fill=\"#E7EFEA\"/><rect x=\"601\" y=\"54\" width=\"79\" height=\"18\" rx=\"5\" fill=\"#F6EFE0\"/><text x=\"28\" y=\"67\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#1E4B3C\">quantité limitée</text><text x=\"672\" y=\"67\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8E661F\"></text><text x=\"20\" y=\"100\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#43555F\">Durabilité</text><rect x=\"20\" y=\"110\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#EFF0EA\"/><rect x=\"20\" y=\"110\" width=\"528\" height=\"18\" rx=\"5\" fill=\"#E7EFEA\"/><rect x=\"548\" y=\"110\" width=\"132\" height=\"18\" rx=\"5\" fill=\"#F6EFE0\"/><text x=\"28\" y=\"123\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#1E4B3C\">inaltérable</text><text x=\"672\" y=\"123\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8E661F\"></text><text x=\"20\" y=\"156\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#43555F\">Divisibilité</text><rect x=\"20\" y=\"166\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#EFF0EA\"/><rect x=\"20\" y=\"166\" width=\"165\" height=\"18\" rx=\"5\" fill=\"#E7EFEA\"/><rect x=\"185\" y=\"166\" width=\"495\" height=\"18\" rx=\"5\" fill=\"#F6EFE0\"/><text x=\"28\" y=\"179\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#1E4B3C\"></text><text x=\"672\" y=\"179\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8E661F\">parfaite</text><text x=\"20\" y=\"212\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#43555F\">Transportabilité</text><rect x=\"20\" y=\"222\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#EFF0EA\"/><rect x=\"20\" y=\"222\" width=\"99\" height=\"18\" rx=\"5\" fill=\"#E7EFEA\"/><rect x=\"119\" y=\"222\" width=\"561\" height=\"18\" rx=\"5\" fill=\"#F6EFE0\"/><text x=\"28\" y=\"235\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#1E4B3C\"></text><text x=\"672\" y=\"235\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8E661F\">immédiate</text><text x=\"20\" y=\"268\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#43555F\">Vérifiabilité</text><rect x=\"20\" y=\"278\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#EFF0EA\"/><rect x=\"20\" y=\"278\" width=\"409\" height=\"18\" rx=\"5\" fill=\"#E7EFEA\"/><rect x=\"429\" y=\"278\" width=\"251\" height=\"18\" rx=\"5\" fill=\"#F6EFE0\"/><text x=\"28\" y=\"291\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#1E4B3C\">difficile</text><text x=\"672\" y=\"291\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8E661F\"></text></svg><figcaption>Aucune monnaie ne coche les 6 critères. Le choix se fait toujours entre des compromis.</figcaption></figure>",
"<strong>5. La fongibilité.</strong> Chaque unité doit être équivalente à une autre. Un billet de 20 € en vaut un autre, ce qui n'est pas le cas de 2 diamants ou de 2 tableaux.",
"<strong>6. La vérifiabilité.</strong> On doit pouvoir s'assurer facilement qu'elle est authentique.",
"Applique maintenant ces critères à l'euro. Il excelle sur la durabilité, la divisibilité, la transportabilité, la fongibilité et la vérifiabilité. <u>Il échoue sur un seul critère, la rareté</u>, puisque la quantité peut être augmentée par décision institutionnelle. C'est exactement pourquoi il est excellent pour échanger et médiocre pour conserver.",
"Ce classement explique aussi pourquoi l'or a dominé pendant des millénaires : il coche presque tout, sauf la transportabilité. Et pourquoi les monnaies numériques à quantité plafonnée intéressent tant de gens : elles cochent la rareté et la transportabilité, mais posent d'autres questions, notamment de stabilité et de vérifiabilité pour un non-spécialiste.",
"Retiens le principe général, car il est plus utile que la liste : <strong>aucune monnaie ne coche les 6 critères parfaitement.</strong> Le choix n'est jamais entre une bonne et une mauvaise monnaie, mais entre des compromis. Ce qui compte est de savoir lequel tu utilises, et pour quel usage."
],

{module:"Module 4 — Bonnes et mauvaises monnaies", title:"Comparer l'euro, l'or et le Bitcoin", duration:"5 min",
script:[
"Appliquons la grille précédente à 3 objets très différents, en restant factuel. Cette leçon ne recommande rien : elle décrit des caractéristiques, et c'est à toi d'en tirer tes conclusions.",
"<strong>L'euro.</strong> Quantité modifiable par décision institutionnelle. Parfaitement liquide, accepté partout dans la zone, garanti jusqu'à 100 000 € par déposant et par établissement par le mécanisme de garantie des dépôts. Perd du pouvoir d'achat de façon lente et régulière. <u>C'est l'outil idéal du court terme, et le pire du très long terme.</u>",
"<strong>L'or.</strong> Quantité physiquement limitée, croissant d'environ 1,5 à 2 % par an par l'extraction minière. Aucun rendement : une once d'or reste une once d'or, elle ne produit ni intérêt ni dividende. Historiquement, il a conservé son pouvoir d'achat sur de très longues périodes, avec des variations fortes à court terme. Son prix peut stagner ou baisser pendant de nombreuses années consécutives. Contraintes concrètes : stockage, assurance, et fiscalité spécifique à la revente en France.",
"<strong>Le Bitcoin.</strong> Quantité plafonnée par son protocole à 21 millions d'unités, ce qui est vérifiable par n'importe qui. Très facile à transporter et à diviser. Mais <strong>une volatilité considérable</strong>, avec des baisses de 70 % ou plus survenues à plusieurs reprises depuis sa création, une histoire courte de moins de 20 ans, un risque technique réel lié à la conservation des clés, et un environnement réglementaire encore mouvant.",
"Ce que cette comparaison permet de comprendre, et qui vaut mieux qu'une recommandation : <strong>ces 3 objets ne servent pas au même usage.</strong> L'euro sert à vivre. L'or a historiquement servi à traverser de très longues périodes. Le Bitcoin est un actif jeune, très volatil, sur lequel les avis d'experts sérieux divergent profondément, et c'est un fait à connaître plutôt qu'à trancher.",
"Deux mises en garde qui valent pour toute cette formation. Premièrement, <u>aucun de ces 3 objets ne produit de revenu</u>, contrairement à une entreprise ou à un bien loué. Détenir de l'or ou du Bitcoin, c'est parier sur la conservation ou la hausse d'un prix, pas percevoir un flux.",
"Deuxièmement, méfie-toi de quiconque te présente l'un des 3 comme la solution évidente. <strong>Le discours qui promet la certitude est toujours celui qui vend quelque chose</strong>, et cette formation ne te vend rien : elle t'apprend à poser les bonnes questions."
],
quiz:[
{q:"Quelle est la limite de quantité du Bitcoin ?",opts:["Aucune","21 millions d'unités","100 millions","Fixée chaque année"],correct:1,
explain:"Le plafond est inscrit dans le protocole et vérifiable par tous, ce qui le distingue d'une monnaie fiduciaire."},
{q:"Quel point commun ont l'or et le Bitcoin ?",opts:["Ils sont garantis par l'État","Ils ne produisent aucun revenu","Ils sont peu volatils","Ils sont acceptés partout"],correct:1,
explain:"Contrairement à une entreprise ou à un bien loué, les détenir revient à parier sur un prix, pas à percevoir un flux."},
{q:"Que penser d'un discours qui présente l'un des 3 comme la solution évidente ?",opts:["Il est probablement fondé","Le discours qui promet la certitude vend généralement quelque chose","Il faut le suivre s'il vient d'un expert","Il n'a aucune importance"],correct:1,
explain:"Sur ces sujets, les avis d'experts sérieux divergent profondément. La certitude affichée est un signal commercial."}
],
action:"Note aujourd'hui le prix de l'or et du Bitcoin en euros, avec la date. Range cette note et reviens la lire dans 6 mois. Observer soi-même la volatilité pendant quelques mois enseigne davantage que n'importe quel graphique commenté."
},
{module:"Module 4 — Bonnes et mauvaises monnaies", title:"Pourquoi certaines monnaies s'effondrent", duration:"5 min",
script:[
"L'hyperinflation semble être un phénomène lointain, réservé à d'autres pays et à d'autres époques. Elle mérite pourtant d'être comprise, parce qu'elle montre le mécanisme monétaire à l'état pur, en accéléré.",
"La définition technique retenue par les économistes est une inflation supérieure à <strong>50 % par mois</strong>. À ce rythme, les prix doublent en moins de 2 mois. Le cas le plus extrême documenté est celui du Zimbabwe à la fin des années 2000, où l'inflation a atteint des ordres de grandeur qui rendent les chiffres presque abstraits.",
"Le scénario est toujours le même, et il se déroule en 4 temps. <strong>1.</strong> Un État fait face à des dépenses qu'il ne peut plus financer par l'impôt ni par l'emprunt. <strong>2.</strong> Il finance ce déficit en créant de la monnaie. <strong>3.</strong> Les prix montent, ce qui creuse encore le déficit réel, donc l'État crée davantage de monnaie. <strong>4.</strong> La confiance se rompt : les gens cessent de détenir la monnaie et s'en débarrassent immédiatement, ce qui accélère encore la hausse des prix.",
"Ce quatrième temps est le plus important à comprendre. <u>L'hyperinflation n'est pas seulement un phénomène mécanique, c'est un effondrement de la confiance.</u> Tant que les gens acceptent de détenir une monnaie, elle tient. Le jour où ils la refusent, aucune quantité d'or ou de décret ne la sauve.",
"Que se passe-t-il alors concrètement ? <strong>L'épargne en monnaie est effacée</strong>, souvent en quelques mois, ce qui frappe le plus durement les retraités et les salariés modestes. Les gens se réfugient dans les devises étrangères, les biens réels et le troc. Les dettes libellées en monnaie locale, elles, s'effacent aussi, ce qui explique que les emprunteurs s'en sortent parfois mieux que les épargnants.",
"Cela peut-il arriver en zone euro ? <strong>La probabilité est très faible</strong>, et il faut le dire clairement. L'euro repose sur une économie large et diversifiée, une banque centrale indépendante dont le mandat est la stabilité des prix, et une monnaie utilisée dans les échanges internationaux. Les hyperinflations frappent des économies fragiles, souvent en guerre, en effondrement institutionnel ou dépendantes d'une seule ressource.",
"Alors pourquoi étudier ce cas ? Parce qu'il révèle une vérité qui vaut partout : <strong>la valeur d'une monnaie repose entièrement sur la confiance, et la confiance n'est pas une garantie.</strong> Cela n'appelle pas la peur, mais la prudence élémentaire : ne jamais concentrer 100 % de son patrimoine sur un seul type d'actif, quel qu'il soit."
],

async function loadProgressFromServer(){
  const { data } = await sb
    .from('lesson_progress')
    .select('lesson_number, completed')
    .eq('user_id', CURRENT_USER.id)
    .eq('formation', FORMATION);
  const p = {};
  if(data){ data.forEach(function(row){ if(row.completed) p[row.lesson_number] = true; }); }
  PROGRESS_CACHE = p;
  return p;
}
function getProgress(){ return PROGRESS_CACHE; }
async function setProgressServer(lessonNumber, value){
  PROGRESS_CACHE[lessonNumber] = value;
  await sb.from('lesson_progress').upsert({
    user_id: CURRENT_USER.id,
    formation: FORMATION,
    lesson_number: lessonNumber,
    completed: value,
    completed_at: value ? new Date().toISOString() : null
  }, { onConflict: 'user_id,formation,lesson_number' });

  await majCarnet(lessonNumber, value);
}

/* Le carnet de route : l'action cochée s'inscrit dans le carnet personnel,
   la décocher l'en retire. Une erreur ici ne doit jamais bloquer la
   progression de la leçon, d'où le try/catch silencieux. */
async function majCarnet(lessonNumber, value){
  try {
    const l = LESSONS[lessonNumber - 1];
    if(!l) return;

    if(!value){
      await sb.from('carnet').delete()
        .eq('user_id', CURRENT_USER.id)
        .eq('formation', FORMATION)
        .eq('lesson_number', lessonNumber);
      return;
    }

    await sb.from('carnet').upsert({
      user_id: CURRENT_USER.id,
      formation: FORMATION,
      lesson_number: lessonNumber,
      titre: l.title || ('Leçon ' + lessonNumber),
      action: l.action || ''
    }, { onConflict: 'user_id,formation,lesson_number', ignoreDuplicates: true });
  } catch(e){
    console.warn('Carnet non mis à jour :', e);
  }
}

let current = parseInt(new URLSearchParams(location.search).get('l')) || 1;
if(current < 1) current = 1;
if(current > LESSONS.length) current = LESSONS.length;

function isUnlocked(n){
  if(n === 1) return true;
  const progress = getProgress();
  return !!progress[n-1];
}

function renderSidebar(){
  const progress = getProgress();
  const doneCount = Object.keys(progress).filter(function(k){ return progress[k]; }).length;
  document.getElementById('navProgress').textContent = doneCount + '/' + LESSONS.length + ' leçons';

  /* Regroupement des lecons par module : c'est le module qui devient
     l'etape de l'itineraire, la lecon n'est qu'un arret. */
  const etapes = [];
  LESSONS.forEach(function(l, i){
    const nom = l.module.split(' — ')[1] || l.module;
    let e = etapes.find(function(x){ return x.nom === nom; });
    if(!e){ e = { nom: nom, lecons: [] }; etapes.push(e); }
    e.lecons.push({ n: i + 1, titre: l.title });
  });

  const etapeCourante = etapes.findIndex(function(e){
    return e.lecons.some(function(a){ return a.n === current; });
  });

  const COCHE = '<svg viewBox="0 0 24 24" fill="none"><path d="M5 12L10 17L19 7" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  let html = '<div class="itin">' +
    '<div class="itin-tete">' +
      '<div class="itin-formation">' + NOM_FORMATION + '</div>' +
      '<div class="itin-compte">Étape ' + (etapeCourante + 1) + ' sur ' + etapes.length + ' · ' + doneCount + '/' + LESSONS.length + ' leçons</div>' +
      '<div class="itin-barre"><span style="width:' + Math.round(doneCount / LESSONS.length * 100) + '%"></span></div>' +
    '</div><div class="route">';

  etapes.forEach(function(e, idx){
    const toutesFaites = e.lecons.every(function(a){ return progress[a.n]; });
    const ici = idx === etapeCourante;
    const premiereAccessible = e.lecons.find(function(a){ return isUnlocked(a.n); });
    const classe = toutesFaites ? 'faite' : (ici ? 'ici' : '');
    const borne = toutesFaites ? COCHE : String(idx + 1);
    const cible = premiereAccessible ? premiereAccessible.n : e.lecons[0].n;

    html += '<div class="etape-i ' + classe + '">' +
      '<span class="borne">' + borne + '</span>' +
      '<button class="etape-titre" onclick="goTo(' + cible + ')">' + e.nom + '</button>' +
      '<div class="etape-meta">' + e.lecons.length + ' leçon' + (e.lecons.length > 1 ? 's' : '') + '</div>';

    /* On ne deroule que l'etape ou l'on se trouve : la carte reste lisible. */
    if(ici){
      html += '<div class="arrets">';
      e.lecons.forEach(function(a){
        const fait = !!progress[a.n];
        const ouvert = isUnlocked(a.n);
        const cl = (a.n === current ? 'ici ' : '') + (fait ? 'faite ' : '') + (ouvert ? '' : 'bloque');
        html += '<div class="arret ' + cl + '" onclick="goTo(' + a.n + ')">' +
          '<span class="puce">' + COCHE + '</span><span>' + a.titre + '</span></div>';
      });
      html += '</div>';
    }
    html += '</div>';
  });

  html += '</div>' + escaleHtml() + '</div>';
  document.getElementById('sidebar').innerHTML = html;
}

function goTo(n){
  if(!isUnlocked(n)){
    alert('Termine la leçon précédente pour débloquer celle-ci.');
    return;
  }
  current = n;
  history.replaceState(null, '', '?l=' + n);
  render();
  window.scrollTo(0,0);
}

let quizState = {};

function allQuizCorrect(l){
  for(let i=0;i<l.quiz.length;i++){ if(!quizState[i]) return false; }
  return true;
}

  renderSidebar();
  const l = LESSONS[current-1];

  if(done){ l.quiz.forEach(function(q,i){ quizState[i] = true; }); }
  const main = document.getElementById('main');

  l.quiz.forEach(function(q, qi){
    let optsHtml = '';
    q.opts.forEach(function(opt, oi){
      const preAnswered = done && oi === q.correct;
      optsHtml += '<div class="quiz-opt ' + (preAnswered?'correct disabled':'') + '" id="q' + qi + 'o' + oi + '" onclick="answerQuiz(' + qi + ',' + oi + ',' + q.correct + ')">' +

    });
    quizHtml += '<div class="quiz-card"><div class="quiz-q">Question ' + (qi+1) + '. ' + q.q + '</div>' + optsHtml +
      '<div class="quiz-explain ' + (done?'show':'') + '" id="exp' + qi + '"><strong>Explication : </strong>' + q.explain + '</div></div>';
  });

  const quizOk = allQuizCorrect(l);
  const actionCardStyle = (!quizOk && !done) ? 'opacity:.5;pointer-events:none;' : '';

  main.innerHTML =
    (done ? '<div class="completion-badge show">✓ Leçon terminée</div>' : '') +
    '<div class="lesson-eyebrow">' + l.module + '</div>' +
    '<div class="lesson-title">' + (current) + '. ' + l.title + '</div>' +
    '<div class="lesson-meta">' + l.duration + ' de lecture · Leçon ' + current + ' sur ' + LESSONS.length + '</div>' +
    '<div class="section-label"><span class="dot"></span>Comprendre</div>' +
    '<div class="script-text">' + l.script.map(function(p){
      return p.indexOf('<figure') === 0 ? p : '<p>' + p + '</p>';
    }).join('') + '</div>' +
    '<div class="section-label quiz"><span class="dot"></span>Vérifier</div>' +
    quizHtml +
    '<div class="section-label action"><span class="dot"></span>Petite action</div>' +
    (!quizOk && !done ? '<div style="font-size:12.5px;font-weight:600;color:var(--coral);margin-bottom:10px;">Réponds correctement aux ' + l.quiz.length + ' questions pour débloquer cette action.</div>' : '') +
    '<div class="action-card" id="actionCard" style="' + actionCardStyle + '">' +
      '<div class="action-text">' + l.action + '</div>' +
      '<div class="action-check" onclick="toggleAction()"><span class="action-box ' + (done?'checked':'') + '" id="actionBox">' + (done?'✓':'') + '</span><span class="action-label">Marquer cette leçon comme terminée</span></div>' +
    '</div>' +
    '<div class="lesson-nav">' +
      (current > 1 ? '<button class="nav-btn ghost" onclick="goTo(' + (current-1) + ')">← Leçon précédente</button>' : '<span></span>') +
      (current < LESSONS.length ? '<button class="nav-btn" onclick="goTo(' + (current+1) + ')">Leçon suivante →</button>' : '<a href="budget.html" class="nav-btn">Terminer le parcours →</a>') +
    '</div>';
}

function answerQuiz(qi, oi, correct){
  if(quizState[qi]) return; // déjà répondu correctement, verrouillé
  const chosen = document.getElementById('q'+qi+'o'+oi);
  if(chosen.classList.contains('disabled')) return;

  if(oi === correct){
    for(let k=0;k<10;k++){
      const el = document.getElementById('q'+qi+'o'+k);
      if(el){ el.classList.add('disabled'); }
    }
    chosen.classList.add('correct');
    quizState[qi] = true;
    document.getElementById('exp'+qi).classList.add('show');
    const l = LESSONS[current-1];
    const quizOk = allQuizCorrect(l);
    const card = document.getElementById('actionCard');
    if(quizOk && card){
      card.style.opacity = '';
      card.style.pointerEvents = '';
      const lock = card.previousElementSibling;
      if(lock && lock.textContent.indexOf('Réponds correctement') !== -1){ lock.style.display = 'none'; }
    }
  } else {
    chosen.classList.add('wrong');
    document.getElementById('exp'+qi).classList.add('show');
    setTimeout(function(){ chosen.classList.remove('wrong'); }, 900);
  }
}

async function toggleAction(){
  const l = LESSONS[current-1];
  const progress = getProgress();
  const newValue = !progress[current];
  if(newValue && !allQuizCorrect(l)){
    alert('Réponds correctement à toutes les questions du quiz avant de valider cette leçon.');
    return;
  }
  await setProgressServer(current, newValue);
  render();

  /* La formation vient-elle de s'achever ? Si oui, on plante la borne.
     On ne la montre qu'au moment du basculement, jamais en revenant
     sur une leçon déjà validée. */
  if(newValue) verifierFinDeParcours();
}

async function verifierFinDeParcours(){
  const progress = getProgress();
  const faites = Object.keys(progress).filter(function(k){ return progress[k]; }).length;
  if(faites < LESSONS.length) return;

  let prenom = '';
  let semaines = 1;
  try {
    const { data } = await sb.from('profiles').select('prenom').eq('id', CURRENT_USER.id).maybeSingle();
    if(data && data.prenom) prenom = data.prenom;

    const { data: dates } = await sb.from('lesson_progress')
      .select('completed_at').eq('user_id', CURRENT_USER.id).eq('formation', FORMATION)
      .not('completed_at', 'is', null).order('completed_at', { ascending: true }).limit(1);
    if(dates && dates.length){
      const debut = new Date(dates[0].completed_at).getTime();
      semaines = Math.max(1, Math.round((Date.now() - debut) / (7*24*3600*1000)));
    }
  } catch(e){ console.warn('Carte : données partielles', e); }

  ouvrirCarte(FORMATION, LESSONS.length, prenom, semaines);
}

async function boot(){
  document.getElementById('main').innerHTML = '<div style="padding:60px 0;text-align:center;color:var(--ink-faint);font-size:14px;">Chargement de ta progression…</div>';
  const user = await requireAuth();
  if(!user) return;
  const unlocked = await requireUnlock(user.id);
  if(!unlocked) return;
  CURRENT_USER = user;
  await loadProgressFromServer();

  if(!isUnlocked(current)){
    let lastUnlocked = 1;
    for(let i=1;i<=LESSONS.length;i++){ if(isUnlocked(i)) lastUnlocked = i; else break; }
    current = lastUnlocked;
    history.replaceState(null, '', '?l=' + current);
  }
  render();
}
boot();
</script>
