<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --ink:#171C45;--ink-soft:#44496B;--ink-muted:#6B7094;--ink-faint:#9599B5;
  --bg:#FFFFFF;--bg-soft:#F6F7FB;--bg-mid:#F0F1F7;--bg-line:#DCDEEA;
  --green:#2B3A8F;--green-light:#3B4BA8;--green-pale:#E9EBF7;--green-bord:#C5CAEB;
  --amber:#C27C00;--amber-pale:#FDF2DA;--amber-bord:#F0D49A;
  --violet:#4D5675;--violet-pale:#EEF0F5;--violet-bord:#D5D9E6;
  --coral:#A3213D;--coral-pale:#FAEAEE;
  --sans:'Archivo',system-ui,-apple-system,sans-serif;
  --display:'Archivo',system-ui,sans-serif;
  --mono:'Archivo',system-ui,sans-serif;
}
body{font-family:var(--sans);background:var(--bg-soft);color:var(--ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;}
a{color:inherit;}

.nav{position:sticky;top:0;z-index:200;background:rgba(255,255,255,.96);backdrop-filter:blur(20px);border-bottom:1px solid var(--bg-line);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;font-weight:800;font-size:15px;color:var(--ink);}
.nav-mark{width:26px;height:26px;border-radius:8px;background:var(--green);display:flex;align-items:center;justify-content:center;}
.nav-mark svg{width:14px;height:14px;}
.nav-back{font-size:13px;font-weight:600;color:var(--ink-muted);text-decoration:none;}
.nav-progress-pill{font-size:12px;font-weight:700;color:var(--green);background:var(--green-pale);padding:5px 12px;border-radius:100px;}

.layout{display:grid;grid-template-columns:280px 1fr;max-width:1100px;margin:0 auto;min-height:calc(100vh - 60px);}
.sidebar{border-right:1px solid var(--bg-line);background:var(--bg);padding:24px 16px;position:sticky;top:60px;align-self:start;height:calc(100vh - 60px);overflow-y:auto;}
.sb-progress-bar{height:6px;background:var(--bg-mid);border-radius:100px;overflow:hidden;margin:0 10px 18px;}
.sb-progress-fill{height:100%;background:var(--green);border-radius:100px;transition:width .3s;}
.sb-item{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:10px;cursor:pointer;margin-bottom:2px;font-size:13px;font-weight:600;color:var(--ink-muted);transition:background .15s;}
.sb-item:hover{background:var(--bg-soft);}
.sb-item.active{background:var(--green-pale);color:var(--green);}
.sb-item.done{color:var(--ink);}
.sb-item.locked{opacity:.45;cursor:not-allowed;}
.sb-item.locked:hover{background:transparent;}
.sb-check{width:20px;height:20px;border-radius:50%;background:var(--bg-mid);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink-faint);flex-shrink:0;}
.sb-item.done .sb-check{background:var(--green);color:#fff;}
.sb-item.active .sb-check{background:var(--green);color:#fff;}
.sb-module-label{font-size:13.5px;font-weight:700;color:var(--ink-faint);text-transform:none;letter-spacing:0;padding:14px 10px 6px;}

.main{padding:36px 40px 80px;max-width:720px;}
.lesson-eyebrow{font-size:13.5px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--green);margin-bottom:10px;}
.lesson-title{font-size:28px;font-weight:800;letter-spacing:-.03em;color:var(--ink);margin-bottom:8px;line-height:1.15;}
.lesson-meta{font-size:13px;color:var(--ink-faint);margin-bottom:32px;}

.section-label{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:800;letter-spacing:0;text-transform:none;color:var(--ink-muted);margin:36px 0 16px;}
.section-label .dot{width:6px;height:6px;border-radius:50%;background:var(--green);}
.section-label.quiz .dot{background:var(--violet);}
.section-label.action .dot{background:var(--amber);}

.script-text p{font-size:15.5px;font-weight:400;color:var(--ink-soft);line-height:1.75;margin-bottom:18px;}

.quiz-card{background:var(--bg);border:1px solid var(--bg-line);border-radius:16px;padding:24px;margin-bottom:14px;}
.quiz-q{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:16px;line-height:1.5;}
.quiz-opt{display:flex;align-items:flex-start;gap:12px;padding:13px 15px;border:1.5px solid var(--bg-line);border-radius:11px;margin-bottom:9px;cursor:pointer;transition:border-color .15s,background .15s;}
.quiz-opt:hover{border-color:var(--ink-faint);}
.quiz-opt.correct{border-color:var(--green);background:var(--green-pale);}
.quiz-opt.wrong{border-color:var(--coral);background:var(--coral-pale);}
.quiz-opt.disabled{cursor:default;pointer-events:none;}
.quiz-letter{width:24px;height:24px;border-radius:7px;background:var(--bg-soft);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--ink-muted);flex-shrink:0;}
.quiz-opt.correct .quiz-letter{background:var(--green);color:#fff;}
.quiz-opt.wrong .quiz-letter{background:var(--coral);color:#fff;}
.quiz-opt-text{font-size:13.5px;font-weight:500;color:var(--ink);padding-top:2px;}
.quiz-explain{display:none;font-size:13px;font-weight:400;color:var(--ink-muted);line-height:1.6;background:var(--bg-soft);border-radius:10px;padding:14px 16px;margin-top:8px;}
.quiz-explain.show{display:block;}
.quiz-explain strong{color:var(--ink);}

.action-card{background:var(--amber-pale);border:1px solid var(--amber-bord);border-radius:16px;padding:22px 24px;}
.action-text{font-size:14.5px;font-weight:500;color:var(--ink);line-height:1.65;margin-bottom:16px;}
.action-check{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;}
.action-box{width:22px;height:22px;border-radius:7px;border:2px solid var(--amber);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;transition:background .15s;}
.action-box.checked{background:var(--amber);}
.action-label{font-size:13px;font-weight:700;color:#8a6a00;}

.lesson-nav{display:flex;justify-content:space-between;align-items:center;margin-top:40px;padding-top:24px;border-top:1px solid var(--bg-line);}
.nav-btn{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border:none;cursor:pointer;font-family:var(--sans);font-size:14px;font-weight:700;padding:13px 24px;border-radius:11px;text-decoration:none;transition:background .2s;}
.nav-btn:hover{background:var(--ink-soft);}
.nav-btn.ghost{background:var(--bg-mid);color:var(--ink-muted);}
.nav-btn.ghost:hover{background:var(--bg-line);}
.completion-badge{display:none;align-items:center;gap:8px;background:var(--green-pale);color:var(--green);font-size:12.5px;font-weight:700;padding:8px 16px;border-radius:100px;margin-bottom:20px;}
.completion-badge.show{display:inline-flex;}

@media(max-width:860px){
  .layout{grid-template-columns:1fr;}
  .sidebar{position:static;height:auto;border-right:none;border-bottom:1px solid var(--bg-line);}
  .main{padding:28px 20px 60px;}
}

/* ===== Direction Encre & Laiton — surcouche typographique ===== */
body{font-family:var(--sans);letter-spacing:0;}
h1,h2,h3,h4,.hero-h1,.s-title,.cta-h2,.p-name,.mod-title,.c-title,.hc-title,
.lecon-title,.q-title,.auth-title,.perf-title,.section-title,.edu-title,.tips-title{
  font-family:var(--display);letter-spacing:-.015em;
}
.hero-h1,.s-title,.cta-h2,.auth-title{font-weight:500;letter-spacing:-.018em;line-height:1.16;}
h3,h4,.p-name,.mod-title,.c-title,.hc-title,.lecon-title{font-weight:600;}
.s-tag,.f-copy,.hstat-label,.stat-label,.perf-note,.order-meta,.pos-value,
.price-cell,.asset-label,.badge,.eyebrow,.nav-balance{font-family:var(--mono);}

.nav-name em,.ft-name em{font-style:normal;color:var(--amber);}

/* Mise en valeur dans le corps des lecons : le gras porte la notion a
   retenir, l italique la nuance ou le terme technique. */
.script-text strong{color:var(--ink,#171C45);font-weight:700;}
.script-text em{font-style:italic;color:var(--ink-soft,#44496B);}
.script-text u{text-decoration:none;background:linear-gradient(transparent 62%,var(--amber-pale,#FDF2DA) 62%);
  box-shadow:inset 0 -1px 0 var(--amber,#C27C00);}
.script-text p + p{margin-top:14px;}

/* ===== L'itineraire =====
   Une route verticale plutot qu'une liste : on voit d'ou l'on vient,
   ou l'on est, et ce qu'il reste. Meme vocabulaire graphique que le
   carnet de route et les emblemes. */
.itin{padding:4px 4px 24px;}
.itin-tete{padding:0 8px 16px;border-bottom:1px solid var(--bg-line);margin-bottom:16px;}
.itin-formation{font-family:var(--display);font-size:16px;font-weight:600;color:var(--ink);line-height:1.25;}
.itin-compte{font-family:var(--mono);font-size:13.5px;letter-spacing:0;text-transform:none;
  color:var(--ink-muted);margin-top:7px;}
.itin-barre{height:4px;background:var(--bg-mid);border-radius:100px;overflow:hidden;margin-top:10px;}
.itin-barre span{display:block;height:100%;background:var(--amber);border-radius:100px;transition:width .4s cubic-bezier(.4,0,.2,1);}

/* La route */
.route{position:relative;padding-left:30px;}
.route::before{content:"";position:absolute;left:11px;top:14px;bottom:14px;width:2px;
  background:repeating-linear-gradient(var(--bg-line) 0 6px, transparent 6px 11px);}
.etape-i{position:relative;margin-bottom:6px;}
.borne{position:absolute;left:-30px;top:6px;width:24px;height:24px;border-radius:50%;
  background:var(--bg);border:2px solid var(--bg-line);display:grid;place-items:center;
  font-family:var(--mono);font-size:10px;color:var(--ink-faint);z-index:1;transition:all .2s;}
.borne svg{width:11px;height:11px;}
.etape-i.faite .borne{background:var(--amber);border-color:var(--amber);color:#fff;}
.etape-i.ici .borne{background:var(--green);border-color:var(--green);color:#fff;
  box-shadow:0 0 0 4px var(--green-pale);}
.etape-titre{display:block;width:100%;text-align:left;background:transparent;border:0;cursor:pointer;
  font-family:var(--display);font-size:14.5px;font-weight:600;color:var(--ink-soft);
  padding:7px 9px;border-radius:9px;line-height:1.3;transition:background .15s,color .15s;}
.etape-titre:hover{background:var(--bg-soft);color:var(--ink);}
.etape-i.ici .etape-titre{color:var(--green);}
.etape-i.faite .etape-titre{color:var(--ink);}
.etape-meta{font-family:var(--mono);font-size:10px;color:var(--ink-faint);padding:0 9px 4px;letter-spacing:.06em;}

/* Les lecons de l'etape en cours */
.arrets{margin:2px 0 12px;padding-left:9px;border-left:1px solid var(--bg-line);}
.arret{display:flex;align-items:flex-start;gap:9px;padding:7px 9px;border-radius:8px;cursor:pointer;
  font-size:12.8px;font-weight:500;color:var(--ink-muted);transition:background .15s;line-height:1.35;}
.arret:hover{background:var(--bg-soft);color:var(--ink);}
.arret.ici{background:var(--green-pale);color:var(--green);font-weight:700;}
.arret.faite{color:var(--ink);}
.arret.bloque{opacity:.42;cursor:not-allowed;}
.arret.bloque:hover{background:transparent;}
.puce{width:15px;height:15px;border-radius:4px;flex:none;margin-top:1px;border:1.5px solid var(--bg-line);
  display:grid;place-items:center;background:var(--bg);}
.puce svg{width:9px;height:9px;opacity:0;}
.arret.faite .puce{background:var(--amber);border-color:var(--amber);}
.arret.faite .puce svg{opacity:1;}
.arret.ici .puce{border-color:var(--green);border-style:dashed;}

/* Changer de formation sans repasser par le menu */
.escale{margin-top:22px;padding-top:16px;border-top:1px solid var(--bg-line);}
.escale-titre{font-family:var(--mono);font-size:13.5px;letter-spacing:0;text-transform:none;
  color:var(--ink-faint);padding:0 9px 9px;}
.escale a{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;text-decoration:none;
  font-size:12.8px;color:var(--ink-soft);transition:background .15s;}
.escale a:hover{background:var(--bg-soft);color:var(--ink);}
.escale a.courante{background:var(--green-pale);color:var(--green);font-weight:700;}
.jeton{width:7px;height:7px;border-radius:50%;background:var(--bg-line);flex:none;}
.escale a.courante .jeton{background:var(--green);}
.escale a.prete .jeton{background:var(--amber);}

@media(max-width:860px){
  .itin{padding-bottom:8px;}
  .route{padding-left:26px;}
  .borne{left:-26px;}
}
@media(prefers-reduced-motion:reduce){*{transition:none !important;}}

/* ===== Schemas des lecons ===== */
.schema{margin:26px 0;padding:20px 18px 14px;border:1px solid var(--bg-line,#DCDEEA);
  border-radius:12px;background:var(--bg,#FFFFFF);}
.schema svg{width:100%;height:auto;display:block;}
.schema figcaption{font-family:var(--mono,'Archivo',sans-serif);font-size:11.5px;line-height:1.55;
  color:var(--ink-muted,#6B7094);margin-top:14px;padding-top:12px;
  border-top:1px solid var(--bg-line,#DCDEEA);}
@media(max-width:620px){.schema{padding:14px 12px 10px;margin:20px -6px;}}

.script-text strong{color:var(--ink,#171C45);font-weight:700;}
.script-text em{font-style:italic;color:var(--ink-soft,#44496B);}
.script-text u{text-decoration:none;background:linear-gradient(transparent 62%,var(--amber-pale,#FDF2DA) 62%);
  box-shadow:inset 0 -1px 0 var(--amber,#C27C00);}
.script-text p + p{margin-top:14px;}

/* Sortie de leçon : on peut toujours s'arrêter sans se sentir coincé. */
.lesson-sortie{display:flex;flex-wrap:wrap;align-items:center;gap:9px;justify-content:center;
  margin-top:24px;padding-top:18px;border-top:1px solid var(--bg-line);
  font-size:13.5px;color:var(--ink-faint);}
.lesson-sortie a{color:var(--ink-muted);text-decoration:none;font-weight:600;}
.lesson-sortie a:hover{color:var(--green);}
</style>

<script>
/* ============ DONNÉES DES 12 LEÇONS — PSYCHOLOGIE DE L'ARGENT ============ */
const LESSONS = [
{module:"Module 1 — Tes fondations mentales", title:"D'où viennent tes croyances sur l'argent", duration:"5 min",
script:[
"Avant de parler de placements, il faut regarder quelque chose de plus important : <strong>ce que tu penses de l'argent sans l'avoir jamais choisi.</strong> Ces idées guident tes décisions avant même que tu réfléchisses. Et elles ne viennent pas de toi.",
"Selon les recherches, ces idées se forment <u>avant l'âge de 7 ans</u>, en observant. Un enfant n'écoute pas ce qu'on dit de l'argent : il regarde ce qu'on en fait. Les silences à table, les disputes de fin de mois, la façon dont un parent sort son porte-monnaie ou évite un magasin.",
"Ces observations deviennent des règles, qu'on prend pour des vérités. <em>L'argent ne fait pas le bonheur. Les riches sont malhonnêtes. Il faut travailler dur pour en gagner. Ce n'est pas pour les gens comme nous. On n'en parle pas.</em> Ces phrases ressemblent à de la sagesse populaire. En réalité, ce sont des consignes, et tu les suis encore.",
"Un exemple très courant. Quelqu'un qui a grandi en entendant <em>« l'argent file entre les doigts »</em> aura tendance à dépenser vite ce qu'il reçoit. Pas par manque de volonté, mais parce qu'une partie de lui pense qu'il est impossible de le garder. L'idée crée le comportement, et le comportement confirme l'idée.",
"Bonne nouvelle : <strong>une idée qu'on a repérée perd beaucoup de son pouvoir.</strong> Tant qu'on ne la voit pas, elle agit comme une évidence. Dès qu'on la nomme, elle redevient une simple opinion, qu'on peut remettre en question.",
"C'est tout le travail de ce premier module, et ce n'est pas une thérapie. Il s'agit juste de repérer les règles que tu suis sans les avoir choisies. Tu n'as pas à les combattre, ni à t'en vouloir. Tu dois seulement savoir qu'elles sont là quand tu prends une décision d'argent.",
"Attention : ces idées ne sont pas toutes fausses ou mauvaises. <strong>Certaines te protègent.</strong> Se méfier des promesses trop belles a sauvé beaucoup de gens. Le but n'est pas de tout effacer, mais de trier ce qui t'aide et ce qui te freine."
],
quiz:[
{q:"À quel âge se forment surtout nos idées sur l'argent ?",opts:["À l'adolescence","Avant 7 ans, en observant","Au premier emploi","À la naissance du premier enfant"],correct:1,
explain:"Un enfant regarde ce qu'on fait de l'argent plus qu'il n'écoute ce qu'on en dit. Les règles se forment très tôt."},
{q:"Que se passe-t-il quand on repère une de ces idées ?",opts:["Elle disparaît tout de suite","Elle redevient une opinion, qu'on peut remettre en question","Elle devient plus forte","Une autre la remplace"],correct:1,
explain:"Tant qu'on ne la voit pas, elle agit comme une évidence. Une fois nommée, elle perd beaucoup de son pouvoir."},
{q:"Faut-il effacer toutes ses idées sur l'argent ?",opts:["Oui, elles sont toutes mauvaises","Non, certaines protègent : il faut trier","Oui, sauf celles des grands-parents","Ça n'a pas d'importance"],correct:1,
explain:"Se méfier des promesses trop belles, par exemple, protège. On trie, on n'efface pas."}
],
action:"Ce soir, écris 3 phrases sur l'argent que tu entendais quand tu étais enfant, exactement comme elles étaient dites. Ne les commente pas, ne les juge pas. Les voir écrites suffit pour ce soir."
},
{module:"Module 1 — Tes fondations mentales", title:"Les 5 rapports à l'argent", duration:"5 min",
script:[
"Les psychologues ont repéré plusieurs façons typiques de se comporter avec l'argent. Ce ne sont pas des cases fermées ni un test de personnalité, juste des tendances. <strong>La plupart des gens en reconnaissent 2 chez eux</strong> : une principale, et une autre qui apparaît quand ça va mal.",
"<strong>Le gardien.</strong> Il épargne beaucoup, contrôle tout, et voit l'argent comme une sécurité à protéger. Sa force : la discipline. Sa faiblesse : l'inquiétude. Il laisse souvent de grosses sommes sur des livrets qui rapportent peu, pas par ignorance, mais parce que bouger lui fait peur.",
"<strong>Le dépensier.</strong> Pour lui, l'argent est fait pour circuler, pour vivre et pour partager. Sa force : la générosité et le plaisir de profiter du présent. Sa faiblesse : il n'a pas de réserve. Le moindre imprévu devient une crise, et l'épargne ne commence jamais.",
"<figure class=\"schema\"><svg viewBox=\"0 0 700 340\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"200\" y=\"20\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" letter-spacing=\"1.4\" fill=\"#2B3A8F\">CE QUI AIDE</text><text x=\"560\" y=\"20\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" letter-spacing=\"1.4\" fill=\"#C27C00\">CE QUI COÛTE</text><text x=\"20\" y=\"44\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">Le gardien</text><rect x=\"20\" y=\"54\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#F0F1F7\"/><rect x=\"20\" y=\"54\" width=\"363\" height=\"18\" rx=\"5\" fill=\"#E9EBF7\"/><rect x=\"383\" y=\"54\" width=\"297\" height=\"18\" rx=\"5\" fill=\"#FDF2DA\"/><text x=\"28\" y=\"67\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#2B3A8F\">discipline</text><text x=\"672\" y=\"67\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8F5F00\">immobilisme</text><text x=\"20\" y=\"100\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">Le dépensier</text><rect x=\"20\" y=\"110\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#F0F1F7\"/><rect x=\"20\" y=\"110\" width=\"277\" height=\"18\" rx=\"5\" fill=\"#E9EBF7\"/><rect x=\"297\" y=\"110\" width=\"383\" height=\"18\" rx=\"5\" fill=\"#FDF2DA\"/><text x=\"28\" y=\"123\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#2B3A8F\">générosité</text><text x=\"672\" y=\"123\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8F5F00\">aucune réserve</text><text x=\"20\" y=\"156\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">L'évitant</text><rect x=\"20\" y=\"166\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#F0F1F7\"/><rect x=\"20\" y=\"166\" width=\"79\" height=\"18\" rx=\"5\" fill=\"#E9EBF7\"/><rect x=\"99\" y=\"166\" width=\"581\" height=\"18\" rx=\"5\" fill=\"#FDF2DA\"/><text x=\"28\" y=\"179\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#2B3A8F\"></text><text x=\"672\" y=\"179\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8F5F00\">inaction coûteuse</text><text x=\"20\" y=\"212\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">Le joueur</text><rect x=\"20\" y=\"222\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#F0F1F7\"/><rect x=\"20\" y=\"222\" width=\"231\" height=\"18\" rx=\"5\" fill=\"#E9EBF7\"/><rect x=\"251\" y=\"222\" width=\"429\" height=\"18\" rx=\"5\" fill=\"#FDF2DA\"/><text x=\"28\" y=\"235\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#2B3A8F\">audace</text><text x=\"672\" y=\"235\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8F5F00\">confond investir et parier</text><text x=\"20\" y=\"268\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">Le bâtisseur</text><rect x=\"20\" y=\"278\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#F0F1F7\"/><rect x=\"20\" y=\"278\" width=\"581\" height=\"18\" rx=\"5\" fill=\"#E9EBF7\"/><rect x=\"601\" y=\"278\" width=\"79\" height=\"18\" rx=\"5\" fill=\"#FDF2DA\"/><text x=\"28\" y=\"291\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#2B3A8F\">régularité, méthode</text><text x=\"672\" y=\"291\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8F5F00\"></text></svg><figcaption>Personne n'est un seul profil. Repère ta dominante, puis celle vers laquelle tu bascules sous stress.</figcaption></figure>",
"<strong>L'évitant.</strong> Il n'ouvre pas ses relevés, repousse les décisions et se sent vraiment mal à l'aise avec l'argent. On le croit négligent, mais c'est souvent de la honte. C'est le profil qui paie le plus cher, car ne rien faire a un coût qu'on ne voit jamais.",
"<strong>Le joueur.</strong> Il cherche le bon coup, la performance, l'histoire à raconter. Sa force : l'audace et le goût du risque. Sa faiblesse : il confond investir et parier, et il pense toujours avoir fait mieux qu'en réalité.",
"<strong>Le bâtisseur.</strong> Il pense à long terme, accepte un risque raisonnable et automatise ses décisions. C'est le profil le plus efficace. Et c'est important : <u>presque personne ne l'est naturellement. On le devient avec une méthode.</u>",
"Le plus utile à retenir : <strong>quand on est stressé, on bascule vers son profil de secours</strong>, et c'est là qu'on prend les mauvaises décisions. Un gardien devient évitant quand la bourse baisse. Un dépensier devient joueur quand il manque d'argent. Repérer ce basculement au moment où il arrive, c'est déjà l'essentiel."
],
quiz:[

explain:"Ne rien faire a un coût qu'on ne voit jamais. Et cette attitude vient souvent de la honte, pas de la négligence."},
{q:"Est-on bâtisseur de naissance ?",opts:["Oui","Non, on le devient avec une méthode","Seulement si on a hérité","Seulement après 50 ans"],correct:1,
explain:"C'est le profil le plus efficace, et il vient de règles et d'habitudes, pas du caractère."},
{q:"Que se passe-t-il quand on est stressé ?",opts:["Notre profil se renforce","On bascule vers un profil de secours, souvent moins bon","On réfléchit mieux","Rien ne change"],correct:1,
explain:"Un gardien devient évitant quand la bourse baisse, un dépensier devient joueur quand il manque d'argent."}
],
action:"Repère ton profil principal, et celui vers lequel tu bascules quand ça se complique. Écris-les sur la même feuille que tes 3 phrases d'hier. C'est ta carte de départ, elle servira dans toutes les leçons suivantes."
},
{module:"Module 1 — Tes fondations mentales", title:"Cartographier tes croyances limitantes", duration:"5 min",
script:[
"Cette leçon est un exercice, et il vaut mieux le faire lentement. Le but : transformer des impressions floues en phrases précises. Car <strong>une idée floue est impossible à changer, alors qu'une idée bien écrite peut être vérifiée.</strong>",
"La méthode tient en 3 étapes. <strong>1. Repérer.</strong> Pense à une décision d'argent que tu repousses depuis longtemps : ouvrir un compte, demander une augmentation, parler d'argent avec un proche. Écris la phrase qui te vient quand tu y penses.",
"<strong>2. Retrouver d'où elle vient.</strong> Demande-toi où tu as entendu cette phrase pour la première fois. Souvent, on découvre qu'elle vient de quelqu'un d'autre : un parent, un professeur, un ex. <u>Quand on sait à qui appartient une idée, ce n'est plus une vérité, c'est un héritage.</u> Et un héritage, on peut le refuser.",
"<strong>3. La comparer à la réalité.</strong> Cherche un contre-exemple réel, dans ta vie ou autour de toi. Si ta phrase est <em>« je suis nul avec l'argent »</em>, cherche une fois où tu as bien géré quelque chose, même petit. Pas besoin de détruire l'idée : il suffit qu'elle ne soit plus vraie à 100 %.",
"Voici les 4 phrases qu'on entend le plus souvent, et ce qu'elles cachent. <em>« Ce n'est pas pour les gens comme nous »</em> : c'est une question de sentiment d'appartenance, pas de compétence. <em>« Je ne suis pas doué pour les chiffres »</em> : gérer son argent demande surtout de la régularité, pas des maths. <em>« Il faut avoir de l'argent pour en gagner »</em> : c'est vrai dans quelques cas, faux dans la grande majorité. <em>« Parler d'argent, c'est vulgaire »</em> : c'est la plus coûteuse, car elle empêche de comparer, de négocier et de demander.",
"Ce que cette leçon n'est pas : de la pensée positive. Se répéter des phrases positives ne change rien. <strong>Ce qui change une idée, c'est de vivre le contraire</strong>, même à toute petite échelle. C'est pour ça que chaque leçon de NiouDem se termine par une action : on ne défait pas une idée en raisonnant, mais en la mettant à l'épreuve.",
"Et sois indulgent avec toi pendant cet exercice. Ces idées t'ont servi à un moment, souvent pour te protéger d'une déception. <strong>Les remercier avant de les ranger marche mieux que de les combattre.</strong>"
],
quiz:[
{q:"Pourquoi retrouver d'où vient une idée sur l'argent ?",opts:["Pour accuser ses parents","Parce qu'une idée qui appartient à quelqu'un d'autre devient un héritage, qu'on peut refuser","Pour la dater","Ce n'est pas utile"],correct:1,
explain:"Elle cesse d'être une vérité : c'est juste ce que quelqu'un d'autre pensait avant toi."},
{q:"Quelle idée coûte le plus cher ?",opts:["« Je ne suis pas doué pour les chiffres »","« Parler d'argent, c'est vulgaire »","« L'argent ne fait pas le bonheur »","« Il faut travailler dur »"],correct:1,
explain:"Elle empêche de comparer, de négocier et de demander : les 3 gestes qui rapportent le plus."},
{q:"Qu'est-ce qui change vraiment une idée ?",opts:["Se répéter des phrases positives","Vivre le contraire, même en petit","Lire un livre","Le temps qui passe"],correct:1,
explain:"C'est pour ça que chaque leçon finit par une action : la preuve change ce que le raisonnement ne change pas."}
],
action:"Applique les 3 étapes à une seule idée, celle qui te bloque le plus. Écris la phrase, cherche qui l'a dite en premier, trouve un contre-exemple réel. Une seule idée bien traitée ce soir vaut mieux que 5 survolées."
},
{module:"Module 2 — Les biais qui coûtent cher", title:"Aversion à la perte et statu quo", duration:"5 min",
script:[
"Notre cerveau utilise des raccourcis automatiques, qu'on appelle des « biais ». Ils ont aidé l'humanité à survivre, mais ils sont catastrophiques avec l'argent : la bourse récompense justement ce que notre cerveau évite. Cette leçon présente les 2 biais qui coûtent le plus cher.",
"<strong>La peur de perdre.</strong> Deux chercheurs, Kahneman et Tversky, ont reçu un prix Nobel pour avoir montré que <u>perdre fait environ 2 fois plus mal que gagner ne fait plaisir.</u> Perdre 100 € fait à peu près 2 fois plus mal que gagner 100 € ne rend heureux.",
"Les conséquences sont énormes. On garde un placement qui perd, en espérant revenir à zéro, et une petite perte devient grande. On vend trop tôt un placement qui gagne, pour « sécuriser », et on rate la suite. Et surtout, <strong>on n'investit pas du tout</strong>, car la peur de perdre pèse plus lourd que la perte certaine due à l'inflation.",
"<figure class=\"schema\"><svg viewBox=\"0 0 700 172\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"200\" y=\"20\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" letter-spacing=\"1.4\" fill=\"#2B3A8F\">DOULEUR RESSENTIE</text><text x=\"560\" y=\"20\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" letter-spacing=\"1.4\" fill=\"#C27C00\">PLAISIR RESSENTI</text><text x=\"20\" y=\"44\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">Perdre 100 €</text><rect x=\"20\" y=\"54\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#F0F1F7\"/><rect x=\"20\" y=\"54\" width=\"449\" height=\"18\" rx=\"5\" fill=\"#E9EBF7\"/><rect x=\"469\" y=\"54\" width=\"211\" height=\"18\" rx=\"5\" fill=\"#FDF2DA\"/><text x=\"28\" y=\"67\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#2B3A8F\">intensité 2</text><text x=\"672\" y=\"67\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8F5F00\"></text><text x=\"20\" y=\"100\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#44496B\">Gagner 100 €</text><rect x=\"20\" y=\"110\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#F0F1F7\"/><rect x=\"20\" y=\"110\" width=\"224\" height=\"18\" rx=\"5\" fill=\"#E9EBF7\"/><rect x=\"244\" y=\"110\" width=\"436\" height=\"18\" rx=\"5\" fill=\"#FDF2DA\"/><text x=\"28\" y=\"123\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#2B3A8F\"></text><text x=\"672\" y=\"123\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8F5F00\">intensité 1</text></svg><figcaption>L'aversion à la perte : la douleur pèse environ 2 fois plus lourd que le plaisir équivalent. C'est ce déséquilibre qui fait vendre au mauvais moment.</figcaption></figure>",
"<em>Ne rien faire semble sans risque. C'est pourtant le seul choix où l'on est sûr de perdre.</em>",
"<strong>La préférence pour ne rien changer.</strong> À situation égale, on préfère laisser les choses comme elles sont. C'est pour ça que des millions de gens gardent pendant des années un contrat trop cher, une banque trop chère ou un livret qui rapporte peu. Changer demande une décision. Garder n'en demande aucune. Et notre cerveau confond « pas de décision » et « pas de risque ».",
"Ces 2 biais se renforcent l'un l'autre. La peur de perdre rend le changement effrayant, et l'habitude rend l'immobilité confortable. Résultat : on peut rester bloqué 10 ans.",
"La solution n'est pas une question de volonté : <strong>on ne corrige pas un biais en se forçant, on le contourne avec une règle.</strong> Décide à l'avance, par écrit, ce que tu feras dans telle situation, puis automatise ce qui peut l'être. Un virement automatique ne connaît ni la peur ni la flemme."
],
quiz:[
{q:"Selon Kahneman et Tversky, une perte fait mal comment, par rapport à un gain ?",opts:["Pareil","Environ 2 fois plus","5 fois plus","Moins"],correct:1,
explain:"C'est pour ça qu'on garde les placements qui perdent et qu'on vend trop tôt ceux qui gagnent."},
{q:"Pourquoi ne rien faire semble-t-il sans risque ?",opts:["Parce que c'est vraiment sans risque","Parce que le cerveau confond « pas de décision » et « pas de risque »","Parce que l'inflation est faible","Parce que les banques le garantissent"],correct:1,
explain:"C'est pourtant le seul choix où la perte est certaine, puisque l'inflation agit de toute façon."},
{q:"Comment contourner un biais ?",opts:["Avec de la volonté","Avec une règle décidée à l'avance et automatisée","En lisant plus","En demandant à un expert à chaque fois"],correct:1,
explain:"Un virement automatique ne connaît ni la peur ni la flemme. La règle remplace la volonté quand elle manque."}
],
action:"Trouve un contrat que tu as depuis plus de 3 ans sans l'avoir comparé : assurance, forfait, banque. Ne le change pas ce soir. Compare-le juste à une offre concurrente et note la différence sur un an. C'est le prix de ton immobilité."
},
{module:"Module 2 — Les biais qui coûtent cher", title:"Effet de dotation et biais de confirmation", duration:"5 min",
script:[
"Deux autres biais méritent d'être connus. Ils agissent après un achat, et t'empêchent de corriger une erreur.",
"<strong>L'effet de possession.</strong> On donne plus de valeur à ce qu'on possède qu'à ce qu'on pourrait acheter. Une expérience célèbre : on donne une tasse à un groupe et on lui demande à quel prix il la revendrait. Puis on demande à un autre groupe combien il paierait pour la même tasse. <u>Ceux qui possèdent la tasse demandent toujours plus que ce que les autres sont prêts à payer</u>, alors que c'est la même tasse.",
"Avec l'argent, ça donne 2 comportements coûteux. On surestime le prix de son propre logement, ce qui fait rater des ventes. Et on garde un placement <em>parce qu'il est à nous</em>, sans jamais se demander si on l'achèterait aujourd'hui, à son prix actuel.",
"Cette question est d'ailleurs le meilleur remède : <strong>si je ne l'avais pas déjà, est-ce que je l'achèterais aujourd'hui, à ce prix ?</strong> Si la réponse est non, le garder n'est plus un choix, c'est une habitude.",
"<strong>Le biais de confirmation.</strong> On cherche les informations qui confirment ce qu'on pense déjà, et on ignore celles qui disent le contraire. Après un achat, on lit surtout les avis positifs et on trouve que les critiques ne connaissent rien.",
"Ce biais est devenu bien plus fort qu'avant, pour une raison simple : <u>les réseaux sociaux te montrent ce qui te ressemble.</u> Si tu t'intéresses à un placement, tu ne verras bientôt que des vidéos enthousiastes à son sujet. Tu auras l'impression que tout le monde est d'accord, alors que c'est juste l'algorithme qui te renvoie ton propre avis.",
"La solution est simple à dire et inconfortable à faire : <strong>cherche les arguments contre avant de décider, pas après.</strong> Pour chaque placement envisagé, passe autant de temps à comprendre pourquoi des gens sérieux sont contre qu'à écouter ceux qui sont pour. Si tu ne trouves aucun argument contre sérieux, c'est en général que tu n'as pas assez cherché."
],
quiz:[
{q:"Qu'est-ce que l'effet de possession ?",opts:["Une aide de l'État","Le fait de donner plus de valeur à ce qu'on possède déjà","Un impôt sur les dons","Le fait d'acheter trop de choses différentes"],correct:1,
explain:"Ceux qui possèdent un objet en demandent toujours plus que ce que les autres paieraient, pour un objet identique."},
{q:"Quelle question permet d'éviter ce piège ?",opts:["Combien je l'ai payé ?","Si je ne l'avais pas, est-ce que je l'achèterais aujourd'hui à ce prix ?","Depuis combien de temps je l'ai ?","Qui d'autre en a ?"],correct:1,
explain:"Si la réponse est non, le garder n'est plus un choix, c'est une habitude."},
{q:"Pourquoi le biais de confirmation est-il plus fort aujourd'hui ?",opts:["Parce qu'il y a moins d'informations","Parce que les réseaux sociaux nous montrent ce qui nous ressemble","Parce qu'il y a moins d'experts","Parce que la bourse bouge plus"],correct:1,
explain:"Quand tout ce qu'on voit est enthousiaste, on croit que tout le monde est d'accord. En réalité, c'est notre propre avis qui nous revient."}
],
action:"Choisis un placement ou un produit financier qui t'attire en ce moment. Pendant 20 minutes, cherche seulement des arguments contre, écrits par des gens sérieux. Note le meilleur. S'il ne te fait pas changer d'avis, ta décision sera plus solide."
},
{module:"Module 2 — Les biais qui coûtent cher", title:"L'audit de tes 3 dernières décisions", duration:"5 min",
script:[
"Cette leçon applique les 4 biais vus précédemment à ta propre vie. C'est l'exercice le plus inconfortable de la formation, et celui qui t'apprendra le plus, car il transforme des idées abstraites en preuves personnelles.",
"Choisis 3 décisions d'argent prises ces 2 dernières années. Pas besoin qu'elles soient importantes : un achat de plus de 300 €, un contrat signé, un placement, un abonnement, une occasion refusée. <strong>Prends-en une dont tu es fier, une que tu regrettes, et une dont tu ne sais pas quoi penser.</strong>",
"Pour chacune, réponds par écrit à 5 questions. <strong>1.</strong> Qu'est-ce qui m'a poussé à décider : un vrai besoin, une émotion, une discussion, une publicité ? <strong>2.</strong> Combien de temps entre l'idée et la décision ? <strong>3.</strong> Quelles informations j'avais, et lesquelles me manquaient ? <strong>4.</strong> Est-ce que j'ai cherché un avis contraire ? <strong>5.</strong> Avec le recul, est-ce que je referais pareil ?",
"Ce que les gens découvrent le plus souvent tient en 3 points. <u>Les meilleures décisions ont presque toutes été prises lentement.</u> Les pires ont été prises sous le coup d'une émotion : excitation, peur, fatigue, ou pression des autres. Et dans presque tous les regrets, l'information qui manquait était disponible, mais on ne l'a pas cherchée.",
"Ce 3e point est le plus important, car on peut le corriger. <strong>Ce qui sépare une bonne décision d'une mauvaise, c'est rarement l'intelligence. C'est le temps qu'on s'est donné.</strong>",
"Attention à une erreur fréquente. <em>Une bonne décision peut mal tourner, et une mauvaise décision peut bien tourner.</em> Acheter au hasard quelque chose qui monte reste une mauvaise décision, juste chanceuse. Juge la façon dont tu as décidé, pas le résultat. Sinon, tu tireras les mauvaises leçons.",
"Garde cet exercice. Le relire dans 1 an, en ajoutant les décisions de l'année, est l'un des exercices les plus utiles qui soient. Et presque personne ne le fait."
],
quiz:[
{q:"Qu'ont en commun les meilleures décisions d'argent ?",opts:["Elles ont été rapides","Elles ont été prises lentement","Elles suivaient l'avis d'un expert","Elles portaient sur de petites sommes"],correct:1,
explain:"Le temps qu'on se donne compte plus que l'intelligence."},
{q:"Que faut-il juger dans une décision passée ?",opts:["Le résultat","La façon dont on a décidé","L'avis de l'entourage","Le montant"],correct:1,
explain:"Une bonne décision peut mal tourner, et l'inverse. Juger seulement le résultat fait tirer les mauvaises leçons."},
{q:"Qu'est-ce qui manquait le plus souvent dans les décisions regrettées ?",opts:["De l'argent","Une information disponible, mais qu'on n'a pas cherchée","Un conseiller","De la chance"],correct:1,
explain:"C'est la meilleure nouvelle de la leçon : c'est la seule chose qu'on peut entièrement corriger."}
],
action:"Ce soir, fais l'exercice avec tes 3 décisions et les 5 questions, par écrit. Compte 20 minutes. Range la feuille avec ta carte de profil, et note dans ton agenda de la relire dans 1 an."
},
{module:"Module 3 — Émotions et argent", title:"Peur, cupidité, impatience", duration:"5 min",
script:[
"Trois émotions expliquent la plupart des mauvaises décisions d'argent. Ce ne sont pas des défauts : ce sont des réactions normales. Elles coûtent cher seulement parce qu'elles arrivent au mauvais moment.",
"<strong>La peur.</strong> Elle arrive quand la bourse baisse, quand ton revenu devient incertain, quand une échéance approche. Elle est facile à reconnaître : <u>elle te pousse à agir vite pour que le malaise s'arrête</u>, alors que la situation demande justement de ne rien faire.",
"On connaît bien ce mécanisme. Après une forte baisse, beaucoup de particuliers vendent, et transforment ainsi une perte temporaire en perte réelle. Puis ils rachètent quand les prix sont remontés, donc plus cher. Ils font l'inverse de ce qu'il faudrait, pas par ignorance, mais parce que la peur devient insupportable.",
"<strong>L'envie de gagner plus (l'avidité).</strong> Elle arrive quand quelque chose monte fort et que d'autres en profitent. On a peur de rater l'occasion. Et voir quelqu'un gagner fait beaucoup plus d'effet que de lire un chiffre. C'est ce qu'utilisent les vendeurs de placements douteux : ils montrent toujours des gagnants, jamais des perdants.",
"<strong>L'impatience.</strong> C'est la plus discrète, et sans doute la plus coûteuse. Elle ne provoque pas de catastrophe : elle empêche juste le temps de faire son travail. On change de stratégie tous les 6 mois, on regarde ses placements tous les jours, ou on abandonne un plan avant qu'il ait eu le temps de donner quoi que ce soit.",
"Pour ne pas culpabiliser pour rien : <strong>on ne peut pas supprimer ces 3 émotions.</strong> Aucune méthode ne rend insensible, et les professionnels les ressentent aussi. La différence, c'est qu'ils ont prévu à l'avance ce qu'ils feraient quand elles arriveraient.",
"C'est le sujet des 2 leçons suivantes : construire des règles qui prennent le relais quand l'émotion arrive. Une règle écrite quand on est calme vaut mieux qu'une décision prise sous le coup de l'émotion. C'est vrai même pour les gens les plus raisonnables."
],
quiz:[
{q:"Comment reconnaître la peur quand il s'agit d'argent ?",opts:["Elle pousse à attendre","Elle pousse à agir vite pour que le malaise s'arrête","Elle aide à mieux réfléchir","Elle n'a aucun effet"],correct:1,
explain:"Elle arrive justement quand il faudrait ne rien faire. D'où les ventes après les baisses."},
{q:"Quelle émotion est la plus discrète et la plus coûteuse ?",opts:["La peur","L'avidité","L'impatience","La colère"],correct:2,
explain:"Elle ne provoque pas de catastrophe visible : elle empêche juste le temps de faire son effet."},
{q:"Peut-on supprimer ces émotions ?",opts:["Oui, avec l'expérience","Non, mais on peut prévoir à l'avance quoi faire quand elles arrivent","Oui, en laissant quelqu'un décider à sa place","Seulement si on investit peu"],correct:1,
explain:"Les professionnels les ressentent aussi. Leur différence : une règle écrite quand ils étaient calmes."}
],
action:"Repense à la dernière fois où tu as pris une décision d'argent sous le coup d'une émotion. Laquelle des 3 était-ce ? Qu'est-ce que ça t'a coûté ou fait rater ? Écris-le en 2 lignes : c'est la base de tes protections."
},
{module:"Module 3 — Émotions et argent", title:"Construire ton pare-feu émotionnel", duration:"5 min",
script:[
"Un « pare-feu émotionnel », c'est un ensemble de protections que tu mets en place quand tu es calme, et qui se placent entre une émotion et une décision. Le but n'est pas de mieux te contrôler, mais de <strong>rendre la mauvaise décision plus difficile à prendre que la bonne.</strong>",
"<strong>Protection 1 : le délai obligatoire.</strong> Toute décision d'argent au-dessus d'un montant que tu fixes, par exemple 300 €, attend 72 heures. Sans exception, même pour les offres « qui expirent ». <u>Une occasion qui ne survit pas à 3 jours de réflexion n'en était pas une.</u> L'urgence est l'arme préférée des mauvais vendeurs.",
"<strong>Protection 2 : la règle écrite à l'avance.</strong> Avant d'investir, écris ce que tu feras si ton placement baisse de 20 %, de 30 %, de 50 %. Le plus souvent, la bonne réponse est <em>ne rien faire et continuer à verser</em>. Mais ce qui compte, ce n'est pas la réponse : c'est de l'avoir écrite avant, quand tu étais calme.",
"<figure class=\"schema\"><svg viewBox=\"0 0 700 338\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"20\" y=\"24\" width=\"190\" height=\"54\" rx=\"9\" fill=\"#F0F1F7\" stroke=\"#171C45\" stroke-width=\"1.5\"/><text x=\"115\" y=\"47\" text-anchor=\"middle\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14.5\" font-weight=\"600\" fill=\"#171C45\">Une émotion</text><text x=\"115\" y=\"65\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\" fill=\"#6B7094\">peur, envie, urgence</text><path d=\"M210 51 C 270 51, 270 66, 330 66\" fill=\"none\" stroke=\"#C27C00\" stroke-width=\"1.8\"/><circle cx=\"330\" cy=\"66\" r=\"4\" fill=\"#C27C00\"/><rect x=\"344\" y=\"43\" width=\"336\" height=\"46\" rx=\"8\" fill=\"#FDF2DA\" stroke=\"#C27C00\" stroke-width=\"1.3\"/><text x=\"360\" y=\"64\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"14\" font-weight=\"600\" fill=\"#171C45\">Délai de 72 heures</text><text x=\"664\" y=\"64\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"13\" fill=\"#C27C00\">filtre 1</text><path d=\"M210 51 C 270 51, 270 128, 330 128\" fill=\"none\" stroke=\"#C27C00\" stroke-width=\"1.8\"/><circle cx=\"330\" cy=\"128\" r=\"4\" fill=\"#C27C00\"/><rect x=\"344\" y=\"105\" width=\"336\" height=\"46\" rx=\"8\" fill=\"#FDF2DA\" stroke=\"#C27C00\" stroke-width=\"1.3\"/><text x=\"360\" y=\"126\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"14\" font-weight=\"600\" fill=\"#171C45\">Règle écrite à froid</text><text x=\"664\" y=\"126\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"13\" fill=\"#C27C00\">filtre 2</text><path d=\"M210 51 C 270 51, 270 190, 330 190\" fill=\"none\" stroke=\"#2B3A8F\" stroke-width=\"1.8\"/><circle cx=\"330\" cy=\"190\" r=\"4\" fill=\"#2B3A8F\"/><rect x=\"344\" y=\"167\" width=\"336\" height=\"46\" rx=\"8\" fill=\"#E9EBF7\" stroke=\"#2B3A8F\" stroke-width=\"1.3\"/><text x=\"360\" y=\"188\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"14\" font-weight=\"600\" fill=\"#171C45\">Virement automatique</text><text x=\"664\" y=\"188\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"13\" fill=\"#2B3A8F\">filtre 3</text><path d=\"M210 51 C 270 51, 270 252, 330 252\" fill=\"none\" stroke=\"#2B3A8F\" stroke-width=\"1.8\"/><circle cx=\"330\" cy=\"252\" r=\"4\" fill=\"#2B3A8F\"/><rect x=\"344\" y=\"229\" width=\"336\" height=\"46\" rx=\"8\" fill=\"#E9EBF7\" stroke=\"#2B3A8F\" stroke-width=\"1.3\"/><text x=\"360\" y=\"250\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"14\" font-weight=\"600\" fill=\"#171C45\">Décision</text><text x=\"664\" y=\"250\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"13\" fill=\"#2B3A8F\">ce qui reste passe</text></svg><figcaption>Le pare-feu ne supprime pas l'émotion : il place des filtres entre elle et la décision.</figcaption></figure>",
"<strong>Protection 3 : l'automatisation.</strong> Tout ce qui est automatique échappe à l'émotion. Un virement programmé continue de partir même quand tu doutes. Résultat : tu investis aussi quand les prix sont bas, au moment où personne n'en a envie.",
"<strong>Protection 4 : regarder moins souvent.</strong> Regarder tes placements tous les jours, c'est multiplier les occasions de voir une baisse, donc d'avoir peur. <strong>Une fois par mois suffit largement</strong> pour un placement à long terme, et une fois tous les 3 mois, c'est encore mieux. Ça ne coûte rien, et c'est une des protections les plus efficaces.",
"<strong>Protection 5 : le témoin.</strong> Choisis une personne à qui tu annonces tes grosses décisions avant de les prendre. Pas pour avoir son avis, mais parce que dire à voix haute ce qu'on va faire montre tout de suite ce qui ne tient pas debout.",
"Ces 5 protections ont un point commun, qui explique pourquoi elles marchent : <strong>on les met en place quand tout va bien, et elles agissent quand tout va mal.</strong> C'est l'inverse de la volonté, qui disparaît justement au moment où on en a besoin."
],

explain:"Une occasion qui ne survit pas à 3 jours n'en était pas une. L'urgence est l'arme des mauvais vendeurs."},
{q:"À quelle fréquence regarder un placement à long terme ?",opts:["Tous les jours","Toutes les semaines","Une fois par mois, voire tous les 3 mois","Jamais"],correct:2,
explain:"Chaque coup d'œil est une occasion de voir une baisse, d'avoir peur, et d'agir au mauvais moment."},
{q:"Quel est le point commun des 5 protections ?",opts:["Elles coûtent de l'argent","On les met en place quand tout va bien, et elles agissent quand tout va mal","Il faut un professionnel","Elles servent seulement pour les grosses sommes"],correct:1,
explain:"C'est l'inverse de la volonté, qui manque justement au moment où on en a besoin."}
],
action:"Choisis 2 protections sur les 5 et mets-les en place ce soir. Le délai de 72 heures demande juste une décision, et regarder moins souvent demande juste de régler tes notifications. Les 3 autres viendront plus tard."
},
{module:"Module 3 — Émotions et argent", title:"Décider quand tout va mal", duration:"5 min",
script:[
"Parfois, on doit décider vite, sous vraie pression : perte d'emploi, séparation, grosse dépense imprévue, chute brutale de la bourse. Les protections de la leçon précédente demandent du temps. Cette leçon te donne une méthode pour quand tu n'en as pas.",
"<strong>Étape 1 : nommer l'émotion, à voix haute ou par écrit.</strong> Ça paraît bête, mais c'est prouvé : mettre un mot sur ce qu'on ressent la rend moins forte. Dis simplement <em>« j'ai peur »</em> ou <em>« je suis en colère »</em>. Le but n'est pas de te calmer, mais de prendre un peu de recul.",
"<strong>Étape 2 : séparer ce qui est vraiment urgent de ce qui te met la pression.</strong> Très peu de décisions d'argent sont vraiment urgentes. Payer le loyer à temps, oui. Une occasion d'investir, jamais. Demande-toi : <u>que se passe-t-il concrètement si je décide dans 48 heures ?</u> 9 fois sur 10, la réponse est : rien.",
"<strong>Étape 3 : réduire le problème.</strong> Quand on est stressé, on décide mal. N'essaie pas de tout régler. Trouve la <strong>seule prochaine action</strong>, la plus petite possible : passer un appel, ouvrir un relevé, écrire un message. Une petite action faite vaut mieux qu'un grand plan jamais commencé.",
"<strong>Étape 4 : demander un avis extérieur, pas un avis rassurant.</strong> La différence est importante. Un avis rassurant te dit ce que tu veux entendre et te laisse dans ton état. Un avis extérieur te pose des questions auxquelles tu n'avais pas pensé. Choisis quelqu'un de calme plutôt que quelqu'un qui sera d'accord avec toi.",
"<strong>Étape 5 : décider, puis écrire pourquoi.</strong> Note en 3 lignes ta décision et tes raisons, avec la date. Ça sert 2 fois : sur le moment, écrire t'oblige à être clair ; plus tard, relire te permet de juger ta façon de décider, pas seulement le résultat.",
"Un dernier point, important. <strong>Si tu as de vraies difficultés d'argent, il existe de l'aide gratuite.</strong> Les Points conseil budget, les assistantes sociales et les associations de consommateurs t'accompagnent sans rien te vendre. Y aller n'est pas un échec : c'est exactement ce qu'un bon plan prévoit."
],
quiz:[
{q:"Pourquoi nommer son émotion avant de décider ?",opts:["Pour se justifier","Parce que mettre un mot dessus la rend moins forte","Pour gagner du temps","Pour convaincre les autres"],correct:1,
explain:"Le but n'est pas de se calmer, mais de prendre un peu de recul sur sa situation."},
{q:"Quelle question aide à savoir si c'est vraiment urgent ?",opts:["Combien ça coûte ?","Que se passe-t-il concrètement si je décide dans 48 heures ?","Qui d'autre est concerné ?","Ai-je déjà vécu ça ?"],correct:1,
explain:"9 fois sur 10, la réponse est : rien. Une occasion d'investir n'est jamais urgente."},
{q:"Quel avis chercher quand on est stressé ?",opts:["Un avis rassurant","Un avis extérieur, de quelqu'un de calme plutôt que d'accord avec toi","L'avis du vendeur","Aucun, il faut décider seul"],correct:1,
explain:"Un avis rassurant dit ce qu'on veut entendre. Un avis extérieur pose les questions qu'on n'avait pas vues."}
],
action:"Recopie les 5 étapes dans une note de ton téléphone, que tu appelles « avant de décider ». Tu n'en as pas besoin ce soir, et c'est justement pour ça qu'il faut la créer maintenant."
},
{module:"Module 4 — Reprogrammer et agir", title:"3 rituels financiers qui tiennent", duration:"5 min",
script:[
"Les bonnes résolutions ne survivent pas à un mois chargé. Ce qui tient, ce sont les rituels : des gestes courts, à date fixe, qui finissent par se faire tout seuls. Voici les 3 seuls qui comptent vraiment.",
"<strong>Rituel 1 : 10 minutes, une fois par semaine.</strong> Toujours le même jour, à la même heure. Tu regardes ton solde et tes dépenses de la semaine, et tu notes une seule chose à ajuster. Pas de tableau compliqué, pas d'analyse : un coup d'œil et une note. <u>C'est la régularité qui fait l'effet, pas la profondeur.</u>",
"<strong>Rituel 2 : 30 minutes, une fois par mois.</strong> Le lendemain de ta paie. Tu vérifies que le virement d'épargne est bien parti, tu regardes le mois passé dans ton tableau de budget, et tu ajustes le montant si besoin. C'est aussi le moment de résilier ce qui ne sert plus.",
"<strong>Rituel 3 : 1 heure, une fois par an.</strong> Celle décrite dans la formation sur l'épargne : réserve pour les imprévus, virements, dépenses fixes, contrats, frais, projets. Une seule heure, à une date facile à retenir (ton anniversaire, le 1er janvier...).",
"Trois conseils pour que ces rituels tiennent. <strong>1. Accroche-les à une habitude que tu as déjà</strong>, plutôt qu'à une bonne intention : après le café du dimanche matin, après avoir sorti les poubelles. L'ancienne habitude déclenche la nouvelle.",
"<strong>2. Commence tout petit, presque ridiculement.</strong> 5 minutes par semaine pendant 3 mois valent bien mieux qu'une heure abandonnée au bout de 2 semaines. On augmente ensuite, jamais l'inverse.",
"<strong>3. Prévois les ratés.</strong> Tu vas sauter des semaines, c'est sûr. Une règle sauve les habitudes : <em>ne jamais rater 2 fois de suite.</em> Un oubli, c'est un accident. Deux oublis, c'est le début de l'abandon.",
"Combien de temps tout ça prend ? Une fois en place, ces 3 rituels représentent environ <strong>10 heures par an</strong>. C'est peu, comparé au temps passé à gagner cet argent. Et c'est pourtant ce qui décide de ce qu'il en reste."
],
quiz:[
{q:"À quelle fréquence se fait le premier rituel ?",opts:["Tous les jours","Une fois par semaine, 10 minutes","Une fois par mois","Tous les 3 mois"],correct:1,
explain:"Un coup d'œil et une note. C'est la régularité qui compte, pas la profondeur."},
{q:"Comment installer une nouvelle habitude ?",opts:["En se motivant chaque matin","En l'accrochant à une habitude qu'on a déjà","En se fixant un grand objectif","En prévenant ses proches"],correct:1,
explain:"Après le café du dimanche, après les poubelles : l'ancienne habitude déclenche la nouvelle, sans effort."},
{q:"Quelle règle sauve une habitude ?",opts:["Ne jamais rater","Ne jamais rater 2 fois de suite","Rattraper le lendemain","Recommencer tous les 3 mois"],correct:1,
explain:"Un oubli, c'est un accident. Deux oublis de suite, c'est le début de l'abandon."}
],
action:"Ce soir, programme le rituel de la semaine dans ton agenda, en répétition, accroché à quelque chose que tu fais déjà. 10 minutes, un jour fixe. C'est le seul des 3 à mettre en place aujourd'hui."
},
{module:"Module 4 — Reprogrammer et agir", title:"Sortir de la procrastination financière", duration:"5 min",
script:[
"Presque tout le monde repousse au moins une démarche d'argent : ouvrir un compte, résilier un contrat, réclamer un remboursement, regarder une situation qu'on préfère ignorer. Cette leçon explique pourquoi, et te donne 4 moyens d'en sortir.",
"Repousser ses démarches d'argent, ce n'est pas de la paresse. Il y a 3 causes connues, et savoir laquelle te concerne change la solution.",
"<strong>Cause 1 : la peur de découvrir.</strong> Ne pas ouvrir ses relevés évite une mauvaise nouvelle. C'est de l'évitement, et ça coûte cher, car la situation empire pendant qu'on ne regarde pas.",
"<strong>Cause 2 : la tâche paraît trop compliquée.</strong> Une tâche floue bloque. <em>« M'occuper de mon épargne »</em>, ce n'est pas une tâche, c'est un sujet. Le cerveau ne sait pas par où commencer, donc il ne commence pas.",
"<strong>Cause 3 : pas de récompense immédiate.</strong> Résilier un abonnement inutile rapporte 15 € par mois, mais ça ne fait aucun plaisir sur le moment. Notre cerveau préfère les gains tout de suite aux gains plus tard. C'est le même mécanisme qui rend l'épargne difficile.",
"Voici 4 moyens d'en sortir, selon la cause. <strong>La règle des 2 minutes :</strong> tout ce qui prend moins de 2 minutes se fait tout de suite, sans le noter ni le prévoir. Rien qu'avec ça, une bonne partie de la liste disparaît.",
"<strong>Le découpage :</strong> transforme le sujet en une toute petite première action. Pas <em>« m'occuper de mon épargne »</em>, mais <em>« ouvrir l'application et noter le solde »</em>. Une tâche doit pouvoir se faire sans réfléchir.",
"<strong>La séance unique :</strong> bloque 45 minutes dans ton agenda, sans téléphone, pour faire d'un coup les 5 démarches en attente. <u>Le plus dur, c'est de se lancer. Comme ça, tu ne le fais qu'une fois</u>, ce qui marche bien mieux que d'étaler.",
"<strong>L'annonce :</strong> dis à quelqu'un ce que tu vas faire et quand. Le simple fait de l'avoir dit augmente beaucoup les chances que tu le fasses. C'est aussi ce qui rend un accompagnement efficace, au-delà de son contenu.",
"Retiens ceci : <strong>ce n'est pas la motivation qui manque, c'est la première action qui est trop grosse.</strong> Réduis-la jusqu'à ce qu'elle paraisse ridicule, et tu la feras."
],
quiz:[
{q:"Quelle est la première cause pour laquelle on repousse ses démarches d'argent ?",opts:["La paresse","La peur de découvrir une mauvaise nouvelle","Le manque de temps","L'absence de conseiller"],correct:1,
explain:"C'est de l'évitement, pas un défaut. Et ça coûte cher, car la situation empire pendant qu'on ne regarde pas."},
{q:"Pourquoi « m'occuper de mon épargne » ne marche pas ?",opts:["C'est trop long","Ce n'est pas une tâche mais un sujet : le cerveau ne sait pas par où commencer","Il faut un professionnel","C'est trop cher"],correct:1,
explain:"Une tâche doit pouvoir se faire sans réfléchir : « ouvrir l'application et noter le solde », c'est une tâche."},
{q:"Pourquoi la séance unique de 45 minutes marche-t-elle bien ?",opts:["Parce qu'elle est plus courte","Parce qu'on ne paie qu'une fois l'effort de se lancer","Parce qu'elle est plus agréable","Parce qu'elle évite les erreurs"],correct:1,
explain:"Étaler 5 démarches sur 5 jours, c'est devoir se lancer 5 fois. Et se lancer, c'est le vrai obstacle."}
],
action:"Fais la liste des démarches d'argent que tu repousses. Pour chacune, note la première action, celle qui prend moins de 2 minutes. Fais-en une seule ce soir, la plus petite. La liste te paraîtra déjà moitié moins lourde."
},
{module:"Module 4 — Reprogrammer et agir", title:"Ton plan sur 30 jours", duration:"5 min",
script:[
"Dernière leçon. Elle rassemble les 11 précédentes en un plan de 30 jours. Un plan volontairement modeste, car un plan ambitieux abandonné au 10e jour ne sert à rien.",
"<strong>Semaine 1 : regarder.</strong> Aucune décision, aucun changement. Tu notes tes dépenses au jour le jour, tu relis tes 3 phrases et ton profil, et tu mets en place le rituel de 10 minutes par semaine. Le seul but : regarder sans rien corriger. C'est plus dur qu'on ne croit.",
"<strong>Semaine 2 : alléger.</strong> Tu t'attaques aux dépenses fixes : abonnements oubliés, contrats jamais renégociés, frais bancaires. Une séance unique de 45 minutes suffit pour l'essentiel. <u>C'est la semaine qui rapporte le plus d'argent par heure passée</u>, et de loin.",
"<strong>Semaine 3 : automatiser.</strong> Tu programmes un virement d'épargne le lendemain de ta paie, vers un compte à part, avec un montant volontairement petit. Tu mets aussi en place le délai de 72 heures, et tu règles la fréquence à laquelle tu regardes tes comptes.",
"<figure class=\"schema\"><svg viewBox=\"0 0 700 168\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><line x1=\"34\" y1=\"96\" x2=\"666\" y2=\"96\" stroke=\"#DCDEEA\" stroke-width=\"2\"/><path d=\"M666 96 l-9 -5 v10 z\" fill=\"#DCDEEA\"/><line x1=\"34\" y1=\"96\" x2=\"34\" y2=\"62\" stroke=\"#2B3A8F\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/><circle cx=\"34\" cy=\"96\" r=\"7\" fill=\"#2B3A8F\"/><circle cx=\"34\" cy=\"96\" r=\"12\" fill=\"none\" stroke=\"#2B3A8F\" stroke-width=\"1\" opacity=\".35\"/><text x=\"34\" y=\"52\" text-anchor=\"start\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14\" font-weight=\"600\" fill=\"#171C45\">Semaine 1</text><text x=\"34\" y=\"122\" text-anchor=\"start\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12\" fill=\"#44496B\">Voir, sans corriger</text><line x1=\"243\" y1=\"96\" x2=\"243\" y2=\"62\" stroke=\"#C27C00\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/><circle cx=\"243\" cy=\"96\" r=\"7\" fill=\"#C27C00\"/><circle cx=\"243\" cy=\"96\" r=\"12\" fill=\"none\" stroke=\"#C27C00\" stroke-width=\"1\" opacity=\".35\"/><text x=\"243\" y=\"52\" text-anchor=\"middle\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14\" font-weight=\"600\" fill=\"#171C45\">Semaine 2</text><text x=\"243\" y=\"122\" text-anchor=\"middle\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12\" fill=\"#44496B\">Alléger les charges fixes</text><line x1=\"451\" y1=\"96\" x2=\"451\" y2=\"62\" stroke=\"#C27C00\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/><circle cx=\"451\" cy=\"96\" r=\"7\" fill=\"#C27C00\"/><circle cx=\"451\" cy=\"96\" r=\"12\" fill=\"none\" stroke=\"#C27C00\" stroke-width=\"1\" opacity=\".35\"/><text x=\"451\" y=\"52\" text-anchor=\"middle\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14\" font-weight=\"600\" fill=\"#171C45\">Semaine 3</text><text x=\"451\" y=\"122\" text-anchor=\"middle\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12\" fill=\"#44496B\">Automatiser l'épargne</text><line x1=\"666\" y1=\"96\" x2=\"666\" y2=\"62\" stroke=\"#2B3A8F\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/><circle cx=\"666\" cy=\"96\" r=\"7\" fill=\"#2B3A8F\"/><circle cx=\"666\" cy=\"96\" r=\"12\" fill=\"none\" stroke=\"#2B3A8F\" stroke-width=\"1\" opacity=\".35\"/><text x=\"666\" y=\"52\" text-anchor=\"end\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14\" font-weight=\"600\" fill=\"#171C45\">Semaine 4</text><text x=\"666\" y=\"122\" text-anchor=\"end\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12\" fill=\"#44496B\">Décider une seule chose</text></svg><figcaption>Un plan de 30 jours volontairement modeste : c'est ce qui le rend tenable jusqu'au bout.</figcaption></figure>",
"<strong>Semaine 4 : prendre une décision.</strong> Une seule décision que tu repoussais : ouvrir un livret à part, ouvrir un PEA pour faire démarrer son compteur, résilier un gros contrat, ou prendre un rendez-vous. Une seule, mais faite.",
"Ce plan donne des résultats modestes mais réels : quelques dizaines d'euros récupérés chaque mois, une épargne qui démarre, des protections contre tes propres réactions, et surtout <strong>la preuve que tu es capable de tenir.</strong> C'est ça le plus important, car ça défait l'idée la plus répandue de toutes.",
"Un dernier mot. Tu as passé 12 leçons à regarder ce qui se passe dans ta tête quand on parle d'argent. Peu de gens font ce travail. Et c'est ce qui explique que 2 personnes qui gagnent pareil n'aient pas du tout le même patrimoine 20 ans plus tard.",
"<strong>Les formations suivantes sont plus techniques : budget, épargne, bourse, immobilier, fiscalité.</strong> Elles te donneront des outils. Mais aucun outil ne marche chez quelqu'un qui n'a pas fait ce premier travail. C'est pour ça que cette formation arrive si tôt dans le parcours."
],
quiz:[

const PAGE_PORTE = 'lecons-monnaie.html';

async function requireUnlock(userId){
  /* La formation d'entrée n'est jamais verrouillée : la vérifier ici
     provoquerait une redirection de la page vers elle-même, donc une
     boucle infinie. */
  if(FORMATION === 'monnaie') return true;

  const { data: badge } = await sb.from('badges')

  if(badge) return true;

  /* Garde-fou : ne jamais rediriger vers la page courante. */

  if(ici === PAGE_PORTE){
    console.warn('Verrou actif sur la page d\'entrée : redirection ignorée.');

async function loadProgressFromServer(){
  const { data } = await sb
    .from('lesson_progress')
    .select('lesson_number, completed')
    .eq('user_id', CURRENT_USER.id)
    .eq('formation', FORMATION);
  const p = {};
  if(data){ data.forEach(function(row){ if(row.completed) p[row.lesson_number] = true; }); }
  PROGRESS_CACHE = p;
  return p;
}
function getProgress(){ return PROGRESS_CACHE; }
async function setProgressServer(lessonNumber, value){
  PROGRESS_CACHE[lessonNumber] = value;
  await sb.from('lesson_progress').upsert({
    user_id: CURRENT_USER.id,
    formation: FORMATION,
    lesson_number: lessonNumber,
    completed: value,
    completed_at: value ? new Date().toISOString() : null
  }, { onConflict: 'user_id,formation,lesson_number' });

  await majCarnet(lessonNumber, value);
}

/* Le carnet de route : l'action cochée s'inscrit dans le carnet personnel,
   la décocher l'en retire. Une erreur ici ne doit jamais bloquer la
   progression de la leçon, d'où le try/catch silencieux. */
async function majCarnet(lessonNumber, value){
  try {
    const l = LESSONS[lessonNumber - 1];
    if(!l) return;

    if(!value){
      await sb.from('carnet').delete()
        .eq('user_id', CURRENT_USER.id)
        .eq('formation', FORMATION)
        .eq('lesson_number', lessonNumber);
      return;
    }

    await sb.from('carnet').upsert({
      user_id: CURRENT_USER.id,
      formation: FORMATION,
      lesson_number: lessonNumber,
      titre: l.title || ('Leçon ' + lessonNumber),
      action: l.action || ''
    }, { onConflict: 'user_id,formation,lesson_number', ignoreDuplicates: true });
  } catch(e){
    console.warn('Carnet non mis à jour :', e);
  }
}

let current = parseInt(new URLSearchParams(location.search).get('l')) || 1;
if(current < 1) current = 1;
if(current > LESSONS.length) current = LESSONS.length;

function isUnlocked(n){
  if(n === 1) return true;
  const progress = getProgress();
  return !!progress[n-1];
}

function renderSidebar(){
  const progress = getProgress();
  const doneCount = Object.keys(progress).filter(function(k){ return progress[k]; }).length;
  document.getElementById('navProgress').textContent = doneCount + '/' + LESSONS.length + ' leçons';

  /* Regroupement des lecons par module : c'est le module qui devient
     l'etape de l'itineraire, la lecon n'est qu'un arret. */
  const etapes = [];
  LESSONS.forEach(function(l, i){
    const nom = l.module.split(' — ')[1] || l.module;
    let e = etapes.find(function(x){ return x.nom === nom; });
    if(!e){ e = { nom: nom, lecons: [] }; etapes.push(e); }
    e.lecons.push({ n: i + 1, titre: l.title });
  });

  const etapeCourante = etapes.findIndex(function(e){
    return e.lecons.some(function(a){ return a.n === current; });
  });

  const COCHE = '<svg viewBox="0 0 24 24" fill="none"><path d="M5 12L10 17L19 7" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  let html = '<div class="itin">' +
    '<div class="itin-tete">' +
      '<div class="itin-formation">' + NOM_FORMATION + '</div>' +
      '<div class="itin-compte">Étape ' + (etapeCourante + 1) + ' sur ' + etapes.length + ' · ' + doneCount + '/' + LESSONS.length + ' leçons</div>' +
      '<div class="itin-barre"><span style="width:' + Math.round(doneCount / LESSONS.length * 100) + '%"></span></div>' +
    '</div><div class="route">';

  etapes.forEach(function(e, idx){
    const toutesFaites = e.lecons.every(function(a){ return progress[a.n]; });
    const ici = idx === etapeCourante;
    const premiereAccessible = e.lecons.find(function(a){ return isUnlocked(a.n); });
    const classe = toutesFaites ? 'faite' : (ici ? 'ici' : '');
    const borne = toutesFaites ? COCHE : String(idx + 1);
    const cible = premiereAccessible ? premiereAccessible.n : e.lecons[0].n;

    html += '<div class="etape-i ' + classe + '">' +
      '<span class="borne">' + borne + '</span>' +
      '<button class="etape-titre" onclick="goTo(' + cible + ')">' + e.nom + '</button>' +
      '<div class="etape-meta">' + e.lecons.length + ' leçon' + (e.lecons.length > 1 ? 's' : '') + '</div>';

    /* On ne deroule que l'etape ou l'on se trouve : la carte reste lisible. */
    if(ici){
      html += '<div class="arrets">';
      e.lecons.forEach(function(a){
        const fait = !!progress[a.n];
        const ouvert = isUnlocked(a.n);
        const cl = (a.n === current ? 'ici ' : '') + (fait ? 'faite ' : '') + (ouvert ? '' : 'bloque');
        html += '<div class="arret ' + cl + '" onclick="goTo(' + a.n + ')">' +
          '<span class="puce">' + COCHE + '</span><span>' + a.titre + '</span></div>';
      });
      html += '</div>';
    }
    html += '</div>';
  });

  html += '</div>' + escaleHtml() + '</div>';
  document.getElementById('sidebar').innerHTML = html;
}

function escaleHtml(){
  let h = '<div class="escale"><div class="escale-titre">Autres formations</div>';

    const courante = p.cle === FORMATION;
    h += '<a href="' + p.page + '" class="' + (courante ? 'courante' : 'prete') + '">' +

function goTo(n){
  if(!isUnlocked(n)){
    alert('Termine la leçon précédente pour débloquer celle-ci.');
    return;
  }
  current = n;
  history.replaceState(null, '', '?l=' + n);
  render();
  window.scrollTo(0,0);
}

let quizState = {};

function allQuizCorrect(l){
  for(let i=0;i<l.quiz.length;i++){ if(!quizState[i]) return false; }
  return true;
}

function render(){
  renderSidebar();
  const l = LESSONS[current-1];
  const progress = getProgress();
  const done = !!progress[current];
  quizState = {};
  if(done){ l.quiz.forEach(function(q,i){ quizState[i] = true; }); }
  const main = document.getElementById('main');
  let quizHtml = '';
  l.quiz.forEach(function(q, qi){
    let optsHtml = '';
    q.opts.forEach(function(opt, oi){
      const preAnswered = done && oi === q.correct;
      optsHtml += '<div class="quiz-opt ' + (preAnswered?'correct disabled':'') + '" id="q' + qi + 'o' + oi + '" onclick="answerQuiz(' + qi + ',' + oi + ',' + q.correct + ')">' +
        '<span class="quiz-letter">' + String.fromCharCode(65+oi) + '</span><span class="quiz-opt-text">' + opt + '</span></div>';
    });
    quizHtml += '<div class="quiz-card"><div class="quiz-q">Question ' + (qi+1) + '. ' + q.q + '</div>' + optsHtml +
      '<div class="quiz-explain ' + (done?'show':'') + '" id="exp' + qi + '"><strong>Explication : </strong>' + q.explain + '</div></div>';
  });

  const quizOk = allQuizCorrect(l);
  const actionCardStyle = (!quizOk && !done) ? 'opacity:.5;pointer-events:none;' : '';

  main.innerHTML =
    (done ? '<div class="completion-badge show">✓ Leçon terminée</div>' : '') +
    '<div class="lesson-eyebrow">' + l.module + '</div>' +
    '<div class="lesson-title">' + (current) + '. ' + l.title + '</div>' +
    '<div class="lesson-meta">' + l.duration + ' de lecture · Leçon ' + current + ' sur ' + LESSONS.length + '</div>' +
    '<div class="section-label"><span class="dot"></span>Comprendre</div>' +
    '<div class="script-text">' + l.script.map(function(p){
      return p.indexOf('<figure') === 0 ? p : '<p>' + p + '</p>';
    }).join('') + '</div>' +
    '<div class="section-label quiz"><span class="dot"></span>Vérifier</div>' +
    quizHtml +
    '<div class="section-label action"><span class="dot"></span>Petite action</div>' +
    (!quizOk && !done ? '<div style="font-size:12.5px;font-weight:600;color:var(--coral);margin-bottom:10px;">Réponds correctement aux ' + l.quiz.length + ' questions pour débloquer cette action.</div>' : '') +
    '<div class="action-card" id="actionCard" style="' + actionCardStyle + '">' +
      '<div class="action-text">' + l.action + '</div>' +
      '<div class="action-check" onclick="toggleAction()"><span class="action-box ' + (done?'checked':'') + '" id="actionBox">' + (done?'✓':'') + '</span><span class="action-label">Marquer cette leçon comme terminée</span></div>' +
    '</div>' +
    '<div class="lesson-nav">' +
      (current > 1 ? '<button class="nav-btn ghost" onclick="goTo(' + (current-1) + ')">← Leçon précédente</button>' : '<span></span>') +
      (current < LESSONS.length ? '<button class="nav-btn" onclick="goTo(' + (current+1) + ')">Leçon suivante →</button>' : '<a href="lecons-budget.html" class="nav-btn">Maîtriser son budget →</a>') +
    '</div>' +

    '<div class="lesson-sortie">' +
      '<a href="index.html#formations">Sommaire des formations</a><span>·</span>' +
      '<a href="carnet.html">Mon carnet</a><span>·</span>' +
      '<a href="index.html">Retour au site</a>' +
    '</div>';
}

function answerQuiz(qi, oi, correct){
  if(quizState[qi]) return; // déjà répondu correctement, verrouillé
  const chosen = document.getElementById('q'+qi+'o'+oi);
  if(chosen.classList.contains('disabled')) return;

  if(oi === correct){
    for(let k=0;k<10;k++){
      const el = document.getElementById('q'+qi+'o'+k);
      if(el){ el.classList.add('disabled'); }
    }
    chosen.classList.add('correct');
    quizState[qi] = true;
    document.getElementById('exp'+qi).classList.add('show');
    const l = LESSONS[current-1];
    const quizOk = allQuizCorrect(l);
    const card = document.getElementById('actionCard');
    if(quizOk && card){
      card.style.opacity = '';
      card.style.pointerEvents = '';
      const lock = card.previousElementSibling;
      if(lock && lock.textContent.indexOf('Réponds correctement') !== -1){ lock.style.display = 'none'; }
    }
  } else {
    chosen.classList.add('wrong');
    document.getElementById('exp'+qi).classList.add('show');
    setTimeout(function(){ chosen.classList.remove('wrong'); }, 900);
  }
}

async function toggleAction(){
  const l = LESSONS[current-1];
  const progress = getProgress();
  const newValue = !progress[current];
  if(newValue && !allQuizCorrect(l)){
    alert('Réponds correctement à toutes les questions du quiz avant de valider cette leçon.');
    return;
  }
  await setProgressServer(current, newValue);
  render();

  /* La formation vient-elle de s'achever ? Si oui, on plante la borne.
     On ne la montre qu'au moment du basculement, jamais en revenant
     sur une leçon déjà validée. */
  if(newValue) verifierFinDeParcours();
}

async function verifierFinDeParcours(){
  const progress = getProgress();
  const faites = Object.keys(progress).filter(function(k){ return progress[k]; }).length;
  if(faites < LESSONS.length) return;

  let prenom = '';
  let semaines = 1;
  try {
    const { data } = await sb.from('profiles').select('prenom').eq('id', CURRENT_USER.id).maybeSingle();
    if(data && data.prenom) prenom = data.prenom;

    const { data: dates } = await sb.from('lesson_progress')
      .select('completed_at').eq('user_id', CURRENT_USER.id).eq('formation', FORMATION)
      .not('completed_at', 'is', null).order('completed_at', { ascending: true }).limit(1);
    if(dates && dates.length){
      const debut = new Date(dates[0].completed_at).getTime();
      semaines = Math.max(1, Math.round((Date.now() - debut) / (7*24*3600*1000)));
    }
  } catch(e){ console.warn('Carte : données partielles', e); }

  ouvrirCarte(FORMATION, LESSONS.length, prenom, semaines);
}

async function boot(){
  document.getElementById('main').innerHTML = '<div style="padding:60px 0;text-align:center;color:var(--ink-faint);font-size:14px;">Chargement de ta progression…</div>';
  const user = await requireAuth();
  if(!user) return;
  const unlocked = await requireUnlock(user.id);
  if(!unlocked) return;
  CURRENT_USER = user;
  await loadProgressFromServer();

  if(!isUnlocked(current)){
    let lastUnlocked = 1;
    for(let i=1;i<=LESSONS.length;i++){ if(isUnlocked(i)) lastUnlocked = i; else break; }
    current = lastUnlocked;
    history.replaceState(null, '', '?l=' + current);
  }
  render();
}
boot();
