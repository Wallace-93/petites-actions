<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --ink:#12212B;--ink-soft:#43555F;--ink-muted:#7A8A93;--ink-faint:#96A3AA;
  --bg:#FCFBF8;--bg-soft:#F5F4EE;--bg-mid:#EFF0EA;--bg-line:#DCDDD3;
  --green:#1E4B3C;--green-light:#2A6350;--green-pale:#E7EFEA;--green-bord:#BFD6C9;
  --amber:#B8862F;--amber-pale:#F6EFE0;--amber-bord:#E4D2AC;
  --violet:#4A5C6B;--violet-pale:#EDF0F2;--violet-bord:#D4DBE0;

  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
body{font-family:var(--sans);background:var(--bg-soft);color:var(--ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;}
a{color:inherit;}

.nav{position:sticky;top:0;z-index:200;background:rgba(255,255,255,.96);backdrop-filter:blur(20px);border-bottom:1px solid var(--bg-line);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;font-weight:800;font-size:15px;color:var(--ink);}
.nav-mark{width:26px;height:26px;border-radius:8px;background:var(--green);display:flex;align-items:center;justify-content:center;}
.nav-mark svg{width:14px;height:14px;}
.nav-back{font-size:13px;font-weight:600;color:var(--ink-muted);text-decoration:none;}
.nav-progress-pill{font-size:12px;font-weight:700;color:var(--green);background:var(--green-pale);padding:5px 12px;border-radius:100px;}

.layout{display:grid;grid-template-columns:280px 1fr;max-width:1100px;margin:0 auto;min-height:calc(100vh - 60px);}
.sidebar{border-right:1px solid var(--bg-line);background:var(--bg);padding:24px 16px;position:sticky;top:60px;align-self:start;height:calc(100vh - 60px);overflow-y:auto;}
.sb-progress-bar{height:6px;background:var(--bg-mid);border-radius:100px;overflow:hidden;margin:0 10px 18px;}
.sb-progress-fill{height:100%;background:var(--green);border-radius:100px;transition:width .3s;}
.sb-item{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:10px;cursor:pointer;margin-bottom:2px;font-size:13px;font-weight:600;color:var(--ink-muted);transition:background .15s;}
.sb-item:hover{background:var(--bg-soft);}
.sb-item.active{background:var(--green-pale);color:var(--green);}
.sb-item.done{color:var(--ink);}
.sb-item.locked{opacity:.45;cursor:not-allowed;}
.sb-item.locked:hover{background:transparent;}
.sb-check{width:20px;height:20px;border-radius:50%;background:var(--bg-mid);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink-faint);flex-shrink:0;}
.sb-item.done .sb-check{background:var(--green);color:#fff;}
.sb-item.active .sb-check{background:var(--green);color:#fff;}
.sb-module-label{font-size:10.5px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em;padding:14px 10px 6px;}

.main{padding:36px 40px 80px;max-width:720px;}
.lesson-eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green);margin-bottom:10px;}
.lesson-title{font-size:28px;font-weight:800;letter-spacing:-.03em;color:var(--ink);margin-bottom:8px;line-height:1.15;}
.lesson-meta{font-size:13px;color:var(--ink-faint);margin-bottom:32px;}

.section-label{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-muted);margin:36px 0 16px;}
.section-label .dot{width:6px;height:6px;border-radius:50%;background:var(--green);}
.section-label.quiz .dot{background:var(--violet);}
.section-label.action .dot{background:var(--amber);}

.script-text p{font-size:15.5px;font-weight:400;color:var(--ink-soft);line-height:1.75;margin-bottom:18px;}

.quiz-card{background:var(--bg);border:1px solid var(--bg-line);border-radius:16px;padding:24px;margin-bottom:14px;}
.quiz-q{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:16px;line-height:1.5;}
.quiz-opt{display:flex;align-items:flex-start;gap:12px;padding:13px 15px;border:1.5px solid var(--bg-line);border-radius:11px;margin-bottom:9px;cursor:pointer;transition:border-color .15s,background .15s;}
.quiz-opt:hover{border-color:var(--ink-faint);}
.quiz-opt.correct{border-color:var(--green);background:var(--green-pale);}
.quiz-opt.wrong{border-color:var(--coral);background:var(--coral-pale);}
.quiz-opt.disabled{cursor:default;pointer-events:none;}
.quiz-letter{width:24px;height:24px;border-radius:7px;background:var(--bg-soft);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--ink-muted);flex-shrink:0;}
.quiz-opt.correct .quiz-letter{background:var(--green);color:#fff;}
.quiz-opt.wrong .quiz-letter{background:var(--coral);color:#fff;}
.quiz-opt-text{font-size:13.5px;font-weight:500;color:var(--ink);padding-top:2px;}
.quiz-explain{display:none;font-size:13px;font-weight:400;color:var(--ink-muted);line-height:1.6;background:var(--bg-soft);border-radius:10px;padding:14px 16px;margin-top:8px;}
.quiz-explain.show{display:block;}
.quiz-explain strong{color:var(--ink);}

.action-card{background:var(--amber-pale);border:1px solid var(--amber-bord);border-radius:16px;padding:22px 24px;}
.action-text{font-size:14.5px;font-weight:500;color:var(--ink);line-height:1.65;margin-bottom:16px;}
.action-check{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;}
.action-box{width:22px;height:22px;border-radius:7px;border:2px solid var(--amber);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;transition:background .15s;}
.action-box.checked{background:var(--amber);}
.action-label{font-size:13px;font-weight:700;color:#8a6a00;}

.lesson-nav{display:flex;justify-content:space-between;align-items:center;margin-top:40px;padding-top:24px;border-top:1px solid var(--bg-line);}
.nav-btn{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border:none;cursor:pointer;font-family:var(--sans);font-size:14px;font-weight:700;padding:13px 24px;border-radius:11px;text-decoration:none;transition:background .2s;}
.nav-btn:hover{background:var(--ink-soft);}
.nav-btn.ghost{background:var(--bg-mid);color:var(--ink-muted);}
.nav-btn.ghost:hover{background:var(--bg-line);}
.completion-badge{display:none;align-items:center;gap:8px;background:var(--green-pale);color:var(--green);font-size:12.5px;font-weight:700;padding:8px 16px;border-radius:100px;margin-bottom:20px;}
.completion-badge.show{display:inline-flex;}

@media(max-width:860px){
  .layout{grid-template-columns:1fr;}
  .sidebar{position:static;height:auto;border-right:none;border-bottom:1px solid var(--bg-line);}
  .main{padding:28px 20px 60px;}
}

/* ===== Direction Encre & Laiton — surcouche typographique ===== */

h1,h2,h3,h4,.hero-h1,.s-title,.cta-h2,.p-name,.mod-title,.c-title,.hc-title,
.lecon-title,.q-title,.auth-title,.perf-title,.section-title,.edu-title,.tips-title{

}
.hero-h1,.s-title,.cta-h2,.auth-title{font-weight:500;letter-spacing:-.018em;line-height:1.16;}
h3,h4,.p-name,.mod-title,.c-title,.hc-title,.lecon-title{font-weight:600;}
.s-tag,.f-copy,.hstat-label,.stat-label,.perf-note,.order-meta,.pos-value,
.price-cell,.asset-label,.badge,.eyebrow,.nav-balance{font-family:var(--mono);}

.nav-name em,.ft-name em{font-style:normal;color:var(--amber);}
</style>

<script>
/* ============ DONNÉES DES 12 LEÇONS — PSYCHOLOGIE DE L'ARGENT ============ */
const LESSONS = [
{module:"Module 1 — Vos fondations mentales", title:"D'où viennent vos croyances sur l'argent", duration:"9 min",
script:[
"Votre rapport à l'argent n'est pas né de vous. Il a été construit, progressivement, par votre environnement, votre famille, votre culture, votre histoire, souvent sans que vous en ayez conscience.",
"Pensez à la première fois que vous avez entendu parler d'argent dans votre famille. « L'argent ne pousse pas dans les arbres. » « Les riches sont des voleurs. » Ces phrases, répétées des centaines de fois, deviennent des croyances profondes qui guident vos comportements financiers à l'âge adulte.",
"Un enfant qui grandit dans un foyer où l'argent est source de conflits associera inconsciemment l'argent à la tension. À l'âge adulte, il sabote souvent ses propres succès financiers sans comprendre pourquoi.",
"La bonne nouvelle : ces croyances, aussi profondes soient-elles, ont été apprises. Elles peuvent être désapprises, remplacées par des croyances plus utiles, basées sur des faits et non sur des peurs héritées.",
"L'objectif de ce module n'est pas de vous culpabiliser ni de critiquer votre famille. C'est de vous aider à identifier ce qui, dans votre fonctionnement actuel, vous aide, et ce qui vous freine."
],
quiz:[
{q:"D'où viennent principalement nos croyances sur l'argent ?",opts:["De notre éducation scolaire","De nos lectures et formations","De notre environnement familial et culturel pendant l'enfance","De nos expériences professionnelles"],correct:2,
explain:"Nos croyances les plus profondes se forment pendant l'enfance, dans notre environnement familial et culturel."},
{q:"Que se passe-t-il chez quelqu'un qui a entendu que « les riches sont sans scrupules » ?",opts:["Il devient plus motivé à s'enrichir","Il développe une résistance inconsciente à s'enrichir","Il n'est pas affecté, c'est une opinion","Il cherche à aider les pauvres"],correct:1,
explain:"Il sabote souvent ses propres succès financiers pour rester cohérent avec l'image de « quelqu'un de bien »."},
{q:"Peut-on changer ses croyances sur l'argent ?",opts:["Non, trop profondes","Oui, mais avec un thérapeute uniquement","Oui, elles ont été apprises et peuvent être remplacées","Oui, mais seulement après une mauvaise enfance"],correct:2,
explain:"Les croyances limitantes ont été apprises et peuvent être désapprises, avec conscience et pratique."}
],
action:"Écris les 3 phrases sur l'argent que tu as le plus entendues dans ton enfance. Pour chacune, note si tu y crois encore et comment elle influence ton comportement financier."
},
{module:"Module 1 — Vos fondations mentales", title:"Les 5 archétypes financiers", duration:"10 min",
script:[
"Les psychologues en finance comportementale ont identifié des archétypes financiers, des profils types de comportement avec l'argent. Personne n'est un seul archétype pur, mais la plupart des gens se reconnaissent dans un ou deux.",
"Le gardien accumule mais a du mal à dépenser ou investir, même quand ça ne rapporte rien. Sa peur : manquer. Son angle mort : l'inaction qui coûte en opportunités.",
"Le dépensier vit dans le présent, a du mal à épargner même en gagnant bien. Sa peur : se priver. Son angle mort : l'absence de filet de sécurité.",
"L'évitant préfère ne pas penser à l'argent, reporte les décisions indéfiniment. Sa peur : regarder la réalité en face. Son angle mort : l'évitement a un coût réel.",
"Le bâtisseur a une vision long terme, investit, planifie, parfois au détriment du présent. L'inconscient dépense ce qui vient, sans stratégie, flexible mais souvent stressé quand ça ne passe plus.",
"Connaître son archétype dominant, c'est comprendre ses forces et ses angles morts, le point de départ pour construire une relation plus saine avec l'argent."
],
quiz:[
{q:"Quel est le principal angle mort du gardien ?",opts:["Il dépense trop","Il évite ses relevés bancaires","L'inaction qui lui fait manquer des opportunités","Il fait trop confiance aux autres"],correct:2,
explain:"Le gardien épargne bien mais garde tout sur des comptes sûrs à faible rendement, subissant l'inflation sans agir."},
{q:"Quel archétype remet les décisions financières à plus tard ?",opts:["Le bâtisseur","Le dépensier","L'évitant","L'inconscient"],correct:2,
explain:"L'évitant préfère ne pas penser à l'argent, les décisions sont reportées indéfiniment par peur de la réalité."},
{q:"Pourquoi connaître son archétype financier dominant ?",opts:["Pour changer de personnalité","Pour se comparer aux autres","Pour conscientiser ses automatismes et les ajuster","Pour choisir un conseiller"],correct:2,
explain:"Cette conscience permet d'ajuster les comportements qui desservent sans renier sa nature profonde."}
],
action:"Identifie l'archétype qui te ressemble le plus, puis le deuxième. Pour chacun, note un exemple concret de comportement qui t'a aidé et un qui t'a nui."
},
{module:"Module 1 — Vos fondations mentales", title:"Cartographier vos croyances limitantes", duration:"9 min",
script:[
"Une croyance inconsciente a beaucoup plus de pouvoir qu'une croyance consciente. Dès qu'on la met en lumière, on peut l'examiner et décider si elle mérite encore de prendre autant de place.",
"Croyances limitantes courantes : « Je ne suis pas fait pour l'argent » (faux, c'est une compétence qui s'apprend). « L'argent corrompt » (l'argent amplifie ce qu'on est déjà, il ne change pas la nature d'une personne).",
"« Je ne mérite pas d'être riche » (souvent liée à une faible estime de soi). « Parler d'argent c'est vulgaire » (empêche les conversations importantes en famille, en négociation). « L'investissement c'est trop risqué pour moi » (souvent née d'une méconnaissance, pas d'une analyse réelle).",
"La méthode : écrivez « Ce que je crois sur l'argent » et laissez venir les phrases sans filtre, même celles qui semblent honteuses. Pour chacune, demandez-vous : d'où vient cette croyance ? Est-elle vraie, ou juste quelque chose qu'on m'a appris à croire ?"
],
quiz:[
{q:"Pourquoi conscientiser ses croyances limitantes plutôt que les laisser inconscientes ?",opts:["Pour les partager avec son entourage","Une croyance inconsciente guide sans pouvoir être questionnée","Pour prouver que sa famille avait tort","Les croyances conscientes sont plus puissantes"],correct:1,
explain:"Dès qu'on la met en lumière, on peut l'analyser et décider si elle mérite encore de guider nos comportements."},
{q:"La croyance « l'argent corrompt » est-elle fondée ?",opts:["Oui, les riches sont moins honnêtes","Non, l'argent amplifie ce qu'on est déjà","Ça dépend du montant","Oui, le pouvoir corrompt toujours"],correct:1,
explain:"L'argent n'a pas de valeur morale en lui-même, il amplifie les traits existants d'une personne."},
{q:"Quelle est la première étape pour cartographier ses croyances ?",opts:["Lire des livres de développement personnel","Consulter un thérapeute","Écrire sans filtre toutes ses croyances, même gênantes","Analyser ses dépenses"],correct:2,
explain:"Les croyances gênantes ou irrationnelles sont souvent les plus importantes à examiner."}
],
action:"Prends 15 minutes, écris sans censure tout ce que tu crois sur l'argent. Entoure celle qui a le plus d'impact négatif. Note d'où elle vient et si elle est vraie objectivement."
},
{module:"Module 2 — Biais cognitifs coûteux", title:"Aversion à la perte et biais de statu quo", duration:"10 min",
script:[
"Kahneman et Tversky ont démontré que la douleur de perdre est environ deux fois plus intense que le plaisir de gagner l'équivalent. Perdre 100€ fait deux fois plus souffrir que gagner 100€ ne fait plaisir.",
"Conséquence 1 : on garde trop longtemps des investissements perdants, car vendre officialise la perte. Conséquence 2 : on vend trop vite les gagnants, par peur de les voir disparaître. C'est l'inverse de ce qu'il faudrait faire.",
"Le biais de statu quo, c'est la préférence pour la situation actuelle même quand un changement serait bénéfique. On garde le même livret depuis 10 ans, la même banque malgré des frais excessifs, on ne commence pas à investir parce que ça demande d'agir.",
"Changer demande un effort, rester ne demande rien. Comprendre ces biais, c'est apprendre à les reconnaître avant d'agir, ou de ne pas agir."
],
quiz:[
{q:"Selon la recherche, perdre 100€ est ressenti comment par rapport à en gagner 100€ ?",opts:["De la même façon","Deux fois moins intensément","Deux fois plus intensément","Cinq fois plus intensément"],correct:2,
explain:"Cette asymétrie explique de nombreux comportements irrationnels en matière d'investissement."},
{q:"Quelle est la conséquence de l'aversion à la perte sur un portefeuille ?",opts:["On investit trop vite","On garde les perdants trop longtemps et on vend les gagnants trop vite","On diversifie trop","On prend plus de risques"],correct:1,
explain:"C'est exactement l'inverse de la stratégie optimale."},
{q:"Comment le biais de statu quo se manifeste-t-il en finance ?",opts:["En prenant trop de risques","En changeant trop souvent de banque","En restant dans des produits sous-optimaux par résistance au changement","En dépensant impulsivement"],correct:2,
explain:"On garde le même livret ou la même banque même quand un changement serait objectivement bénéfique."}
],
action:"Identifie une situation où le biais de statu quo joue un rôle dans ta vie financière. Note ce que tu perdrais à changer, et ce que tu gagnerais."
},
{module:"Module 2 — Biais cognitifs coûteux", title:"Effet de dotation et biais de confirmation", duration:"9 min",
script:[
"L'effet de dotation, c'est surévaluer ce qu'on possède simplement parce qu'on le possède. Une expérience classique : les propriétaires d'une tasse demandent en moyenne deux fois plus pour la vendre que ce que les non-propriétaires paieraient pour la même tasse.",
"En finance : garder une action héritée même si l'analyse montre qu'il faudrait la vendre, garder une maison familiale trop grande, ne pas renégocier son prêt par attachement à sa banque historique.",
"Le biais de confirmation, c'est chercher les informations qui confirment ce qu'on croit déjà et ignorer celles qui le contredisent. Dangereux en finance : on ne cherche que les analyses qui disent qu'une action va monter, on ignore les signaux d'alarme.",
"Remède pour l'effet de dotation : « Si je ne possédais pas cet actif aujourd'hui, est-ce que je l'achèterais à ce prix, dans les conditions actuelles ? » Remède pour la confirmation : chercher activement les arguments contre sa position."
],
quiz:[
{q:"Qu'est-ce que l'effet de dotation ?",opts:["Dépenser plus quand on a de l'argent","Surévaluer ce qu'on possède simplement parce qu'on le possède","Offrir ses biens aux autres","Accumuler des objets sans valeur"],correct:1,
explain:"Les propriétaires demandent en moyenne deux fois plus pour vendre un objet que les non-propriétaires ne paieraient."},
{q:"Comment le biais de confirmation affecte-t-il les décisions d'investissement ?",opts:["Il pousse à trop diversifier","Il pousse à chercher uniquement les infos qui confirment ses convictions","Il pousse à suivre les experts","Il pousse à prendre trop de risques"],correct:1,
explain:"On ignore les signaux d'alarme importants qui contredisent ce qu'on veut croire."},
{q:"Quelle question contrer l'effet de dotation sur un investissement ?",opts:["Combien ai-je payé cet actif ?","Qu'en pensent les autres ?","L'achèterais-je à ce prix aujourd'hui, dans les conditions actuelles ?","Depuis quand le détiens-je ?"],correct:2,
explain:"Cette question permet de se défaire de l'attachement et d'évaluer l'actif plus objectivement."}
],
action:"Identifie un actif que tu possèdes depuis longtemps sans le questionner. Pose la question clé et note ta réponse honnête."
},
{module:"Module 2 — Biais cognitifs coûteux", title:"Audit de vos 3 dernières décisions", duration:"8 min",
script:[
"On va appliquer les biais vus dans ce module à votre réalité. Identifiez trois décisions financières prises au cours des 12 à 24 derniers mois, grandes ou petites, y compris une décision de ne pas agir.",
"Pour chacune, posez quatre questions : quelle était la décision et le contexte ? Quelles émotions la guidaient ? Quel biais reconnaissez-vous maintenant ? Avec ce que vous savez maintenant, auriez-vous fait pareil ?",
"L'objectif n'est pas de se flageller sur des décisions passées, mais de développer une conscience de ses propres automatismes. La prochaine décision importante, vous la prendrez avec plus de recul.",
"C'est ça, l'éducation financière en action : pas juste des concepts théoriques, une capacité améliorée à prendre de meilleures décisions dans la vraie vie."
],
quiz:[
{q:"Quel est l'objectif d'un audit de ses décisions financières passées ?",opts:["Calculer précisément les pertes et gains","Identifier les biais pour mieux les reconnaître à l'avenir","Comparer ses performances au marché","Trouver des responsables"],correct:1,
explain:"L'audit n'est pas un exercice de culpabilisation mais d'apprentissage."},
{q:"Quelle question identifie l'aversion à la perte dans une décision passée ?",opts:["Ai-je bien diversifié ?","Ai-je gardé quelque chose trop longtemps pour éviter d'officialiser une perte ?","Ai-je comparé les offres ?","Ai-je demandé un avis expert ?"],correct:1,
explain:"L'aversion à la perte pousse à garder des investissements perdants pour éviter la douleur psychologique."},
{q:"Une décision de ne pas agir compte-t-elle dans cet audit ?",opts:["Non, seules les actions comptent","Oui, l'inaction a des conséquences financières réelles","Ça dépend du montant","Seulement après 6 mois"],correct:1,
explain:"Ne pas ouvrir un PEA, ne pas changer de banque, sont des décisions à part entière, souvent guidées par des biais."}
],
action:"Fais l'audit de tes 3 dernières décisions financières avec les 4 questions. 15 minutes maximum, l'honnêteté prime sur l'exhaustivité."
},

let PROGRESS_CACHE = {};

async function requireAuth(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){
    window.location.href = 'inscription.html?redirect=lecons-psychologie.html';
    return null;
  }

async function requireUnlock(userId){
  const { data: badge } = await sb.from('badges').select('badge_name').eq('user_id', userId).eq('badge_name','le_declic').maybeSingle();
  if(!badge){
    window.location.href = 'lecons-monnaie.html';
    return false;
  }
  return true;
}

async function signOut(){
  await sb.auth.signOut();
  window.location.href = 'index.html';
}

async function loadProgressFromServer(){
  const { data } = await sb
    .from('lesson_progress')
    .select('lesson_number, completed')
    .eq('user_id', CURRENT_USER.id)
    .eq('formation', FORMATION);
  const p = {};
  if(data){ data.forEach(function(row){ if(row.completed) p[row.lesson_number] = true; }); }
  PROGRESS_CACHE = p;
  return p;
}
function getProgress(){ return PROGRESS_CACHE; }
async function setProgressServer(lessonNumber, value){
  PROGRESS_CACHE[lessonNumber] = value;
  await sb.from('lesson_progress').upsert({
    user_id: CURRENT_USER.id,
    formation: FORMATION,
    lesson_number: lessonNumber,
    completed: value,
    completed_at: value ? new Date().toISOString() : null
  }, { onConflict: 'user_id,formation,lesson_number' });
}

let current = parseInt(new URLSearchParams(location.search).get('l')) || 1;
if(current < 1) current = 1;
if(current > LESSONS.length) current = LESSONS.length;

function isUnlocked(n){
  if(n === 1) return true;
  const progress = getProgress();
  return !!progress[n-1];
}

function renderSidebar(){
  const progress = getProgress();
  const doneCount = Object.keys(progress).filter(k=>progress[k]).length;
  document.getElementById('navProgress').textContent = doneCount + '/' + LESSONS.length + ' leçons';
  const sbEl = document.getElementById('sidebar');
  let html = '<div class="sb-progress-bar"><div class="sb-progress-fill" style="width:' + Math.round(doneCount/LESSONS.length*100) + '%"></div></div>';
  let lastModule = '';
  LESSONS.forEach(function(l, i){
    const n = i+1;
    if(l.module !== lastModule){ html += '<div class="sb-module-label">' + l.module.split(' — ')[0] + '</div>'; lastModule = l.module; }
    const isDone = !!progress[n];
    const isActive = n === current;
    const unlocked = isUnlocked(n);
    const lockedClass = unlocked ? '' : 'locked';
    let iconContent = n;
    if(isDone) iconContent = '✓';
    else if(!unlocked) iconContent = '🔒';
    html += '<div class="sb-item ' + (isActive?'active':'') + ' ' + (isDone?'done':'') + ' ' + lockedClass + '" onclick="goTo(' + n + ')">' +
      '<span class="sb-check">' + iconContent + '</span>' + l.title + '</div>';
  });
  sbEl.innerHTML = html;
}

function goTo(n){
  if(!isUnlocked(n)){
    alert('Termine la leçon précédente pour débloquer celle-ci.');
    return;
  }
  current = n;
  history.replaceState(null, '', '?l=' + n);
  render();
  window.scrollTo(0,0);
}

let quizState = {};

function allQuizCorrect(l){
  for(let i=0;i<l.quiz.length;i++){ if(!quizState[i]) return false; }
  return true;
}

function render(){
  renderSidebar();
  const l = LESSONS[current-1];
  const progress = getProgress();
  const done = !!progress[current];
  quizState = {};
  if(done){ l.quiz.forEach(function(q,i){ quizState[i] = true; }); }
  const main = document.getElementById('main');
  let quizHtml = '';
  l.quiz.forEach(function(q, qi){
    let optsHtml = '';
    q.opts.forEach(function(opt, oi){
      const preAnswered = done && oi === q.correct;
      optsHtml += '<div class="quiz-opt ' + (preAnswered?'correct disabled':'') + '" id="q' + qi + 'o' + oi + '" onclick="answerQuiz(' + qi + ',' + oi + ',' + q.correct + ')">' +
        '<span class="quiz-letter">' + String.fromCharCode(65+oi) + '</span><span class="quiz-opt-text">' + opt + '</span></div>';
    });
    quizHtml += '<div class="quiz-card"><div class="quiz-q">Question ' + (qi+1) + '. ' + q.q + '</div>' + optsHtml +
      '<div class="quiz-explain ' + (done?'show':'') + '" id="exp' + qi + '"><strong>Explication : </strong>' + q.explain + '</div></div>';
  });

  const quizOk = allQuizCorrect(l);
  const actionCardStyle = (!quizOk && !done) ? 'opacity:.5;pointer-events:none;' : '';

  main.innerHTML =
    (done ? '<div class="completion-badge show">✓ Leçon terminée</div>' : '') +
    '<div class="lesson-eyebrow">' + l.module + '</div>' +
    '<div class="lesson-title">' + (current) + '. ' + l.title + '</div>' +
    '<div class="lesson-meta">' + l.duration + ' de lecture · Leçon ' + current + ' sur ' + LESSONS.length + '</div>' +
    '<div class="section-label"><span class="dot"></span>Comprendre</div>' +
    '<div class="script-text">' + l.script.map(function(p){return '<p>'+p+'</p>';}).join('') + '</div>' +
    '<div class="section-label quiz"><span class="dot"></span>Vérifier</div>' +
    quizHtml +
    '<div class="section-label action"><span class="dot"></span>Petite action</div>' +
    (!quizOk && !done ? '<div style="font-size:12.5px;font-weight:600;color:var(--coral);margin-bottom:10px;">🔒 Réponds correctement aux ' + l.quiz.length + ' questions pour débloquer cette action.</div>' : '') +
    '<div class="action-card" id="actionCard" style="' + actionCardStyle + '">' +
      '<div class="action-text">' + l.action + '</div>' +
      '<div class="action-check" onclick="toggleAction()"><span class="action-box ' + (done?'checked':'') + '" id="actionBox">' + (done?'✓':'') + '</span><span class="action-label">Marquer cette leçon comme terminée</span></div>' +
    '</div>' +
    '<div class="lesson-nav">' +
      (current > 1 ? '<button class="nav-btn ghost" onclick="goTo(' + (current-1) + ')">← Leçon précédente</button>' : '<span></span>') +
      (current < LESSONS.length ? '<button class="nav-btn" onclick="goTo(' + (current+1) + ')">Leçon suivante →</button>' : '<a href="psychologie.html" class="nav-btn">Terminer le parcours →</a>') +
    '</div>';
}

function answerQuiz(qi, oi, correct){
  if(quizState[qi]) return; // déjà répondu correctement, verrouillé
  const chosen = document.getElementById('q'+qi+'o'+oi);
  if(chosen.classList.contains('disabled')) return;

  if(oi === correct){
    for(let k=0;k<10;k++){
      const el = document.getElementById('q'+qi+'o'+k);
      if(el){ el.classList.add('disabled'); }
    }
    chosen.classList.add('correct');
    quizState[qi] = true;
    document.getElementById('exp'+qi).classList.add('show');
    const l = LESSONS[current-1];
    const quizOk = allQuizCorrect(l);
    const card = document.getElementById('actionCard');
    if(quizOk && card){
      card.style.opacity = '';
      card.style.pointerEvents = '';
      const lock = card.previousElementSibling;
      if(lock && lock.textContent.indexOf('Réponds correctement') !== -1){ lock.style.display = 'none'; }
    }
  } else {
    chosen.classList.add('wrong');
    document.getElementById('exp'+qi).classList.add('show');
    setTimeout(function(){ chosen.classList.remove('wrong'); }, 900);
  }
}

async function toggleAction(){
  const l = LESSONS[current-1];
  const progress = getProgress();
  const newValue = !progress[current];
  if(newValue && !allQuizCorrect(l)){
    alert('Réponds correctement à toutes les questions du quiz avant de valider cette leçon.');
    return;
  }
  await setProgressServer(current, newValue);
  render();
}

async function boot(){
  document.getElementById('main').innerHTML = '<div style="padding:60px 0;text-align:center;color:var(--ink-faint);font-size:14px;">Chargement de ta progression…</div>';
  const user = await requireAuth();
  if(!user) return;
  const unlocked = await requireUnlock(user.id);
  if(!unlocked) return;
  CURRENT_USER = user;
  await loadProgressFromServer();

  if(!isUnlocked(current)){
    let lastUnlocked = 1;
    for(let i=1;i<=LESSONS.length;i++){ if(isUnlocked(i)) lastUnlocked = i; else break; }
    current = lastUnlocked;
    history.replaceState(null, '', '?l=' + current);
  }
  render();
}
boot();
