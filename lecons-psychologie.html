<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --ink:#12212B;--ink-soft:#43555F;--ink-muted:#7A8A93;--ink-faint:#96A3AA;
  --bg:#FCFBF8;--bg-soft:#F5F4EE;--bg-mid:#EFF0EA;--bg-line:#DCDDD3;
  --green:#1E4B3C;--green-light:#2A6350;--green-pale:#E7EFEA;--green-bord:#BFD6C9;
  --amber:#B8862F;--amber-pale:#F6EFE0;--amber-bord:#E4D2AC;
  --violet:#4A5C6B;--violet-pale:#EDF0F2;--violet-bord:#D4DBE0;
  --coral:#A24332;--coral-pale:#F8EDEA;
  --sans:'Karla',system-ui,-apple-system,sans-serif;
  --display:'Newsreader',Georgia,serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
body{font-family:var(--sans);background:var(--bg-soft);color:var(--ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;}
a{color:inherit;}

.nav{position:sticky;top:0;z-index:200;background:rgba(255,255,255,.96);backdrop-filter:blur(20px);border-bottom:1px solid var(--bg-line);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;font-weight:800;font-size:15px;color:var(--ink);}
.nav-mark{width:26px;height:26px;border-radius:8px;background:var(--green);display:flex;align-items:center;justify-content:center;}
.nav-mark svg{width:14px;height:14px;}
.nav-back{font-size:13px;font-weight:600;color:var(--ink-muted);text-decoration:none;}
.nav-progress-pill{font-size:12px;font-weight:700;color:var(--green);background:var(--green-pale);padding:5px 12px;border-radius:100px;}

.layout{display:grid;grid-template-columns:280px 1fr;max-width:1100px;margin:0 auto;min-height:calc(100vh - 60px);}
.sidebar{border-right:1px solid var(--bg-line);background:var(--bg);padding:24px 16px;position:sticky;top:60px;align-self:start;height:calc(100vh - 60px);overflow-y:auto;}
.sb-progress-bar{height:6px;background:var(--bg-mid);border-radius:100px;overflow:hidden;margin:0 10px 18px;}
.sb-progress-fill{height:100%;background:var(--green);border-radius:100px;transition:width .3s;}
.sb-item{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:10px;cursor:pointer;margin-bottom:2px;font-size:13px;font-weight:600;color:var(--ink-muted);transition:background .15s;}
.sb-item:hover{background:var(--bg-soft);}
.sb-item.active{background:var(--green-pale);color:var(--green);}
.sb-item.done{color:var(--ink);}
.sb-item.locked{opacity:.45;cursor:not-allowed;}
.sb-item.locked:hover{background:transparent;}
.sb-check{width:20px;height:20px;border-radius:50%;background:var(--bg-mid);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink-faint);flex-shrink:0;}
.sb-item.done .sb-check{background:var(--green);color:#fff;}
.sb-item.active .sb-check{background:var(--green);color:#fff;}
.sb-module-label{font-size:10.5px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em;padding:14px 10px 6px;}

.main{padding:36px 40px 80px;max-width:720px;}
.lesson-eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green);margin-bottom:10px;}
.lesson-title{font-size:28px;font-weight:800;letter-spacing:-.03em;color:var(--ink);margin-bottom:8px;line-height:1.15;}
.lesson-meta{font-size:13px;color:var(--ink-faint);margin-bottom:32px;}

.section-label{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-muted);margin:36px 0 16px;}
.section-label .dot{width:6px;height:6px;border-radius:50%;background:var(--green);}
.section-label.quiz .dot{background:var(--violet);}
.section-label.action .dot{background:var(--amber);}

.script-text p{font-size:15.5px;font-weight:400;color:var(--ink-soft);line-height:1.75;margin-bottom:18px;}

.quiz-card{background:var(--bg);border:1px solid var(--bg-line);border-radius:16px;padding:24px;margin-bottom:14px;}
.quiz-q{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:16px;line-height:1.5;}
.quiz-opt{display:flex;align-items:flex-start;gap:12px;padding:13px 15px;border:1.5px solid var(--bg-line);border-radius:11px;margin-bottom:9px;cursor:pointer;transition:border-color .15s,background .15s;}
.quiz-opt:hover{border-color:var(--ink-faint);}
.quiz-opt.correct{border-color:var(--green);background:var(--green-pale);}
.quiz-opt.wrong{border-color:var(--coral);background:var(--coral-pale);}
.quiz-opt.disabled{cursor:default;pointer-events:none;}
.quiz-letter{width:24px;height:24px;border-radius:7px;background:var(--bg-soft);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--ink-muted);flex-shrink:0;}
.quiz-opt.correct .quiz-letter{background:var(--green);color:#fff;}
.quiz-opt.wrong .quiz-letter{background:var(--coral);color:#fff;}
.quiz-opt-text{font-size:13.5px;font-weight:500;color:var(--ink);padding-top:2px;}
.quiz-explain{display:none;font-size:13px;font-weight:400;color:var(--ink-muted);line-height:1.6;background:var(--bg-soft);border-radius:10px;padding:14px 16px;margin-top:8px;}
.quiz-explain.show{display:block;}
.quiz-explain strong{color:var(--ink);}

.action-card{background:var(--amber-pale);border:1px solid var(--amber-bord);border-radius:16px;padding:22px 24px;}
.action-text{font-size:14.5px;font-weight:500;color:var(--ink);line-height:1.65;margin-bottom:16px;}
.action-check{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;}
.action-box{width:22px;height:22px;border-radius:7px;border:2px solid var(--amber);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;transition:background .15s;}
.action-box.checked{background:var(--amber);}
.action-label{font-size:13px;font-weight:700;color:#8a6a00;}

.lesson-nav{display:flex;justify-content:space-between;align-items:center;margin-top:40px;padding-top:24px;border-top:1px solid var(--bg-line);}
.nav-btn{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border:none;cursor:pointer;font-family:var(--sans);font-size:14px;font-weight:700;padding:13px 24px;border-radius:11px;text-decoration:none;transition:background .2s;}
.nav-btn:hover{background:var(--ink-soft);}
.nav-btn.ghost{background:var(--bg-mid);color:var(--ink-muted);}
.nav-btn.ghost:hover{background:var(--bg-line);}
.completion-badge{display:none;align-items:center;gap:8px;background:var(--green-pale);color:var(--green);font-size:12.5px;font-weight:700;padding:8px 16px;border-radius:100px;margin-bottom:20px;}
.completion-badge.show{display:inline-flex;}

@media(max-width:860px){
  .layout{grid-template-columns:1fr;}
  .sidebar{position:static;height:auto;border-right:none;border-bottom:1px solid var(--bg-line);}
  .main{padding:28px 20px 60px;}
}

/* ===== Direction Encre & Laiton — surcouche typographique ===== */
body{font-family:var(--sans);letter-spacing:0;}
h1,h2,h3,h4,.hero-h1,.s-title,.cta-h2,.p-name,.mod-title,.c-title,.hc-title,
.lecon-title,.q-title,.auth-title,.perf-title,.section-title,.edu-title,.tips-title{
  font-family:var(--display);letter-spacing:-.015em;
}
.hero-h1,.s-title,.cta-h2,.auth-title{font-weight:500;letter-spacing:-.018em;line-height:1.16;}
h3,h4,.p-name,.mod-title,.c-title,.hc-title,.lecon-title{font-weight:600;}
.s-tag,.f-copy,.hstat-label,.stat-label,.perf-note,.order-meta,.pos-value,
.price-cell,.asset-label,.badge,.eyebrow,.nav-balance{font-family:var(--mono);}

.nav-name em,.ft-name em{font-style:normal;color:var(--amber);}

/* Mise en valeur dans le corps des lecons : le gras porte la notion a
   retenir, l italique la nuance ou le terme technique. */
.script-text strong{color:var(--ink,#12212B);font-weight:700;}
.script-text em{font-style:italic;color:var(--ink-soft,#43555F);}
.script-text u{text-decoration:none;background:linear-gradient(transparent 62%,var(--amber-pale,#F6EFE0) 62%);
  box-shadow:inset 0 -1px 0 var(--amber,#B8862F);}
.script-text p + p{margin-top:14px;}

/* ===== L'itineraire =====
   Une route verticale plutot qu'une liste : on voit d'ou l'on vient,
   ou l'on est, et ce qu'il reste. Meme vocabulaire graphique que le
   carnet de route et les emblemes. */
.itin{padding:4px 4px 24px;}
.itin-tete{padding:0 8px 16px;border-bottom:1px solid var(--bg-line);margin-bottom:16px;}
.itin-formation{font-family:var(--display);font-size:16px;font-weight:600;color:var(--ink);line-height:1.25;}
.itin-compte{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-muted);margin-top:7px;}
.itin-barre{height:4px;background:var(--bg-mid);border-radius:100px;overflow:hidden;margin-top:10px;}
.itin-barre span{display:block;height:100%;background:var(--amber);border-radius:100px;transition:width .4s cubic-bezier(.4,0,.2,1);}

/* La route */
.route{position:relative;padding-left:30px;}
.route::before{content:"";position:absolute;left:11px;top:14px;bottom:14px;width:2px;
  background:repeating-linear-gradient(var(--bg-line) 0 6px, transparent 6px 11px);}
.etape-i{position:relative;margin-bottom:6px;}
.borne{position:absolute;left:-30px;top:6px;width:24px;height:24px;border-radius:50%;
  background:var(--bg);border:2px solid var(--bg-line);display:grid;place-items:center;
  font-family:var(--mono);font-size:10px;color:var(--ink-faint);z-index:1;transition:all .2s;}
.borne svg{width:11px;height:11px;}
.etape-i.faite .borne{background:var(--amber);border-color:var(--amber);color:#fff;}
.etape-i.ici .borne{background:var(--green);border-color:var(--green);color:#fff;
  box-shadow:0 0 0 4px var(--green-pale);}
.etape-titre{display:block;width:100%;text-align:left;background:transparent;border:0;cursor:pointer;
  font-family:var(--display);font-size:14.5px;font-weight:600;color:var(--ink-soft);
  padding:7px 9px;border-radius:9px;line-height:1.3;transition:background .15s,color .15s;}
.etape-titre:hover{background:var(--bg-soft);color:var(--ink);}
.etape-i.ici .etape-titre{color:var(--green);}
.etape-i.faite .etape-titre{color:var(--ink);}
.etape-meta{font-family:var(--mono);font-size:10px;color:var(--ink-faint);padding:0 9px 4px;letter-spacing:.06em;}

/* Les lecons de l'etape en cours */
.arrets{margin:2px 0 12px;padding-left:9px;border-left:1px solid var(--bg-line);}
.arret{display:flex;align-items:flex-start;gap:9px;padding:7px 9px;border-radius:8px;cursor:pointer;
  font-size:12.8px;font-weight:500;color:var(--ink-muted);transition:background .15s;line-height:1.35;}
.arret:hover{background:var(--bg-soft);color:var(--ink);}
.arret.ici{background:var(--green-pale);color:var(--green);font-weight:700;}
.arret.faite{color:var(--ink);}
.arret.bloque{opacity:.42;cursor:not-allowed;}
.arret.bloque:hover{background:transparent;}
.puce{width:15px;height:15px;border-radius:4px;flex:none;margin-top:1px;border:1.5px solid var(--bg-line);
  display:grid;place-items:center;background:var(--bg);}
.puce svg{width:9px;height:9px;opacity:0;}
.arret.faite .puce{background:var(--amber);border-color:var(--amber);}
.arret.faite .puce svg{opacity:1;}
.arret.ici .puce{border-color:var(--green);border-style:dashed;}

/* Changer de formation sans repasser par le menu */
.escale{margin-top:22px;padding-top:16px;border-top:1px solid var(--bg-line);}
.escale-titre{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-faint);padding:0 9px 9px;}
.escale a{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;text-decoration:none;
  font-size:12.8px;color:var(--ink-soft);transition:background .15s;}
.escale a:hover{background:var(--bg-soft);color:var(--ink);}
.escale a.courante{background:var(--green-pale);color:var(--green);font-weight:700;}
.jeton{width:7px;height:7px;border-radius:50%;background:var(--bg-line);flex:none;}
.escale a.courante .jeton{background:var(--green);}
.escale a.prete .jeton{background:var(--amber);}

@media(max-width:860px){
  .itin{padding-bottom:8px;}
  .route{padding-left:26px;}
  .borne{left:-26px;}
}
@media(prefers-reduced-motion:reduce){*{transition:none !important;}}

/* ===== Schemas des lecons ===== */
.schema{margin:26px 0;padding:20px 18px 14px;border:1px solid var(--bg-line,#DCDDD3);
  border-radius:12px;background:var(--bg,#FCFBF8);}
.schema svg{width:100%;height:auto;display:block;}
.schema figcaption{font-family:var(--mono,monospace);font-size:11.5px;line-height:1.55;
  color:var(--ink-muted,#7A8A93);margin-top:14px;padding-top:12px;
  border-top:1px solid var(--bg-line,#DCDDD3);}
@media(max-width:620px){.schema{padding:14px 12px 10px;margin:20px -6px;}}

.script-text strong{color:var(--ink,#12212B);font-weight:700;}
.script-text em{font-style:italic;color:var(--ink-soft,#43555F);}
.script-text u{text-decoration:none;background:linear-gradient(transparent 62%,var(--amber-pale,#F6EFE0) 62%);
  box-shadow:inset 0 -1px 0 var(--amber,#B8862F);}
.script-text p + p{margin-top:14px;}

/* Sortie de leçon : on peut toujours s'arrêter sans se sentir coincé. */
.lesson-sortie{display:flex;flex-wrap:wrap;align-items:center;gap:9px;justify-content:center;
  margin-top:24px;padding-top:18px;border-top:1px solid var(--bg-line);
  font-size:13.5px;color:var(--ink-faint);}
.lesson-sortie a{color:var(--ink-muted);text-decoration:none;font-weight:600;}
.lesson-sortie a:hover{color:var(--green);}
</style>

<script>
/* ============ DONNÉES DES 12 LEÇONS — PSYCHOLOGIE DE L'ARGENT ============ */
const LESSONS = [
{module:"Module 1 — Tes fondations mentales", title:"D'où viennent tes croyances sur l'argent", duration:"5 min",
script:[
"Avant de parler de placements, il faut regarder quelque chose de plus déterminant : <strong>ce que tu penses de l'argent sans jamais l'avoir décidé.</strong> Ces pensées gouvernent tes décisions bien avant que le raisonnement n'intervienne, et elles ne viennent pas de toi.",
"Les recherches en psychologie financière situent la formation de ces croyances <u>avant l'âge de 7 ans</u>, par observation. Un enfant n'écoute pas ce qu'on dit de l'argent, il regarde ce qu'on en fait : les silences à table, les disputes de fin de mois, la façon dont un parent sort son portefeuille ou évite un magasin.",
"Ces observations se figent en règles, presque toujours formulées comme des évidences. <em>L'argent ne fait pas le bonheur. Les riches sont malhonnêtes. Il faut travailler dur pour en gagner. Ce n'est pas pour les gens comme nous. On n'en parle pas.</em> Ces phrases ont l'air de sagesse populaire. Ce sont en réalité des instructions, et tu les appliques encore.",
"Un exemple qui revient constamment. Quelqu'un qui a grandi en entendant <em>« l'argent file entre les doigts »</em> aura tendance à dépenser rapidement ce qu'il reçoit, non par manque de discipline, mais parce qu'une part de lui considère que le garder est impossible. La croyance produit le comportement, qui confirme la croyance.",
"Il y a une bonne nouvelle, et elle est solide. <strong>Une croyance identifiée perd une grande partie de son pouvoir.</strong> Tant qu'elle reste implicite, elle agit comme une évidence ; dès qu'elle est nommée, elle redevient une opinion, donc quelque chose qui se discute.",
"C'est exactement le travail de ce premier module, et il n'a rien de thérapeutique : il s'agit de repérer les règles que tu appliques sans les avoir choisies. Tu n'as pas à les combattre ni à t'en vouloir de les avoir. Tu as seulement à savoir qu'elles sont là quand une décision financière se présente.",
"Une précision utile pour finir. Ces croyances ne sont pas toutes fausses ni nuisibles. <strong>Certaines protègent</strong> : la méfiance envers les promesses trop belles a sauvé beaucoup de gens. Le but n'est pas de tout effacer, mais de trier ce qui te sert de ce qui te freine."
],
quiz:[
{q:"À quel âge se forment principalement les croyances sur l'argent ?",opts:["À l'adolescence","Avant 7 ans, par observation","Au premier emploi","À la naissance du premier enfant"],correct:1,
explain:"Un enfant n'écoute pas ce qu'on dit de l'argent, il regarde ce qu'on en fait. Les règles se figent bien avant tout raisonnement."},
{q:"Que se passe-t-il quand une croyance est identifiée ?",opts:["Elle disparaît immédiatement","Elle redevient une opinion, donc quelque chose qui se discute","Elle se renforce","Elle est remplacée par une autre"],correct:1,
explain:"Tant qu'elle reste implicite, elle agit comme une évidence. Nommée, elle perd l'essentiel de son pouvoir."},
{q:"Faut-il effacer toutes ses croyances sur l'argent ?",opts:["Oui, elles sont toutes nuisibles","Non, certaines protègent, il s'agit de trier","Oui, sauf celles héritées des grands-parents","Cela n'a aucune importance"],correct:1,
explain:"La méfiance envers les promesses trop belles, par exemple, a sauvé beaucoup de gens. On trie, on n'efface pas."}
],
action:"Écris ce soir 3 phrases sur l'argent que tu as entendues dans ton enfance, telles qu'elles étaient dites. Ne les commente pas, ne les juge pas. Le simple fait de les voir écrites suffit pour ce soir."
},
{module:"Module 1 — Tes fondations mentales", title:"Les 5 rapports à l'argent", duration:"5 min",
script:[
"Les psychologues qui étudient le rapport à l'argent décrivent des profils récurrents. Ce ne sont ni des catégories étanches ni un test de personnalité : ce sont des tendances, et <strong>la plupart des gens en reconnaissent 2 chez eux</strong>, une dominante et une secondaire qui apparaît sous stress.",
"<strong>Le gardien.</strong> Il épargne beaucoup, contrôle tout, et vit l'argent comme une sécurité à préserver. Sa force est la discipline. Sa faiblesse est l'anxiété : il conserve souvent des sommes importantes sur des supports peu rémunérés, non par ignorance, mais parce que bouger l'inquiète.",
"<strong>Le dépensier.</strong> L'argent est fait pour circuler, pour vivre et pour partager. Sa force est la générosité et la capacité à profiter du présent. Sa faiblesse est l'absence de réserve : le moindre imprévu devient une crise, et l'épargne ne démarre jamais.",
"<figure class=\"schema\"><svg viewBox=\"0 0 700 340\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"200\" y=\"20\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" letter-spacing=\"1.4\" fill=\"#1E4B3C\">CE QUI AIDE</text><text x=\"560\" y=\"20\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" letter-spacing=\"1.4\" fill=\"#B8862F\">CE QUI COÛTE</text><text x=\"20\" y=\"44\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#43555F\">Le gardien</text><rect x=\"20\" y=\"54\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#EFF0EA\"/><rect x=\"20\" y=\"54\" width=\"363\" height=\"18\" rx=\"5\" fill=\"#E7EFEA\"/><rect x=\"383\" y=\"54\" width=\"297\" height=\"18\" rx=\"5\" fill=\"#F6EFE0\"/><text x=\"28\" y=\"67\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#1E4B3C\">discipline</text><text x=\"672\" y=\"67\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8E661F\">immobilisme</text><text x=\"20\" y=\"100\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#43555F\">Le dépensier</text><rect x=\"20\" y=\"110\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#EFF0EA\"/><rect x=\"20\" y=\"110\" width=\"277\" height=\"18\" rx=\"5\" fill=\"#E7EFEA\"/><rect x=\"297\" y=\"110\" width=\"383\" height=\"18\" rx=\"5\" fill=\"#F6EFE0\"/><text x=\"28\" y=\"123\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#1E4B3C\">générosité</text><text x=\"672\" y=\"123\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8E661F\">aucune réserve</text><text x=\"20\" y=\"156\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#43555F\">L'évitant</text><rect x=\"20\" y=\"166\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#EFF0EA\"/><rect x=\"20\" y=\"166\" width=\"79\" height=\"18\" rx=\"5\" fill=\"#E7EFEA\"/><rect x=\"99\" y=\"166\" width=\"581\" height=\"18\" rx=\"5\" fill=\"#F6EFE0\"/><text x=\"28\" y=\"179\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#1E4B3C\"></text><text x=\"672\" y=\"179\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8E661F\">inaction coûteuse</text><text x=\"20\" y=\"212\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#43555F\">Le joueur</text><rect x=\"20\" y=\"222\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#EFF0EA\"/><rect x=\"20\" y=\"222\" width=\"231\" height=\"18\" rx=\"5\" fill=\"#E7EFEA\"/><rect x=\"251\" y=\"222\" width=\"429\" height=\"18\" rx=\"5\" fill=\"#F6EFE0\"/><text x=\"28\" y=\"235\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#1E4B3C\">audace</text><text x=\"672\" y=\"235\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8E661F\">confond investir et parier</text><text x=\"20\" y=\"268\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#43555F\">Le bâtisseur</text><rect x=\"20\" y=\"278\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#EFF0EA\"/><rect x=\"20\" y=\"278\" width=\"581\" height=\"18\" rx=\"5\" fill=\"#E7EFEA\"/><rect x=\"601\" y=\"278\" width=\"79\" height=\"18\" rx=\"5\" fill=\"#F6EFE0\"/><text x=\"28\" y=\"291\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#1E4B3C\">régularité, méthode</text><text x=\"672\" y=\"291\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8E661F\"></text></svg><figcaption>Personne n'est un seul profil. Repère ta dominante, puis celle vers laquelle tu bascules sous stress.</figcaption></figure>",
"<strong>L'évitant.</strong> Il n'ouvre pas ses relevés, repousse les décisions et ressent un malaise réel devant les sujets financiers. Cette attitude passe pour de la négligence alors qu'elle relève souvent de la honte. C'est le profil qui paie le plus cher, parce que l'inaction a un coût qui ne se voit jamais.",
"<strong>Le joueur.</strong> Il cherche le coup, la performance, l'histoire à raconter. Sa force est l'audace et une vraie tolérance au risque. Sa faiblesse est la confusion entre investir et parier, et une surestimation systématique de ses propres résultats passés.",
"<strong>Le bâtisseur.</strong> Il pense en années, accepte le risque mesuré et automatise ses décisions. C'est le profil le plus efficace, et il faut préciser une chose importante : <u>presque personne ne l'est naturellement, on le devient par méthode.</u>",
"Le mécanisme le plus utile à retenir est le suivant. <strong>Sous stress, chacun bascule vers son profil de secours</strong>, et c'est là que se prennent les mauvaises décisions. Un gardien devient évitant quand les marchés baissent. Un dépensier devient joueur quand il manque d'argent. Repérer ce basculement au moment où il survient, c'est déjà l'essentiel du travail."
],

explain:"L'inaction a un coût qui ne se voit jamais, et cette attitude relève souvent de la honte plutôt que de la négligence."},
{q:"Le bâtisseur est-il un profil naturel ?",opts:["Oui, on naît ainsi","Non, on le devient par méthode","Uniquement chez les héritiers","Seulement après 50 ans"],correct:1,

action:"Identifie ton profil dominant et celui vers lequel tu bascules quand la situation se tend. Écris les 2 sur la même feuille que tes 3 phrases d'hier. C'est ta carte de départ, et elle servira dans toutes les leçons suivantes."

{module:"Module 1 — Tes fondations mentales", title:"Cartographier tes croyances limitantes", duration:"5 min",
script:[
"Cette leçon est un exercice, et il vaut mieux le faire lentement. Il s'agit de transformer des impressions diffuses en phrases précises, parce qu'<strong>une croyance vague est indéboulonnable, alors qu'une croyance formulée se teste.</strong>",
"La méthode tient en 3 étapes. <strong>1. Repérer.</strong> Pense à une décision financière que tu repousses depuis longtemps : ouvrir un compte, demander une augmentation, parler d'argent avec un proche. Écris la phrase qui te vient quand tu y penses.",
"<strong>2. Remonter à la source.</strong> Demande-toi où tu as entendu cette phrase pour la première fois. Beaucoup de gens découvrent qu'elle appartient à quelqu'un d'autre, souvent un parent, parfois un professeur ou un ancien conjoint. <u>Une croyance dont on identifie le propriétaire cesse d'être une vérité pour devenir un héritage</u>, et un héritage se refuse.",
"<strong>3. Confronter aux faits.</strong> Cherche un contre-exemple réel, dans ta vie ou autour de toi. Si ta phrase est <em>« je suis nul avec l'argent »</em>, cherche une situation où tu as bien géré quelque chose, même modeste. La croyance n'a pas besoin d'être détruite, il suffit qu'elle cesse d'être absolue.",
"Voici les 4 phrases que l'on rencontre le plus souvent, avec ce qu'elles cachent. <em>« Ce n'est pas pour les gens comme nous »</em> cache une question d'appartenance, pas de compétence. <em>« Je ne suis pas doué pour les chiffres »</em> confond l'arithmétique et la décision, alors que gérer son argent demande surtout de la régularité. <em>« Il faut avoir de l'argent pour en gagner »</em> est vrai pour certains montages, faux pour l'immense majorité des situations. <em>« Parler d'argent, c'est vulgaire »</em> est la plus coûteuse de toutes, parce qu'elle empêche de comparer, de négocier et de demander.",
"Un mot sur ce que cette leçon n'est pas. Ce n'est pas de la pensée positive, et répéter des affirmations ne change rien. <strong>Ce qui change une croyance, c'est une expérience contraire</strong>, même minuscule. C'est précisément pour cela que chaque leçon de NiouDem se termine par une action : une croyance ne se démonte pas par le raisonnement, elle se démonte par la preuve.",
"Enfin, sois indulgent avec toi-même en faisant cet exercice. Ces croyances ont été utiles à un moment, souvent pour se protéger d'une déception. <strong>Les remercier avant de les ranger fonctionne mieux que de les combattre.</strong>"
],
quiz:[
{q:"Pourquoi remonter à la source d'une croyance ?",opts:["Pour blâmer ses parents","Parce qu'une croyance dont on identifie le propriétaire devient un héritage, donc refusable","Pour la dater précisément","Ce n'est pas nécessaire"],correct:1,
explain:"Elle cesse d'être une vérité pour devenir quelque chose que quelqu'un d'autre a pensé avant toi."},
{q:"Quelle croyance est la plus coûteuse ?",opts:["« Je ne suis pas doué pour les chiffres »","« Parler d'argent, c'est vulgaire »","« L'argent ne fait pas le bonheur »","« Il faut travailler dur »"],correct:1,
explain:"Elle empêche de comparer, de négocier et de demander, c'est-à-dire les 3 gestes qui rapportent le plus."},
{q:"Qu'est-ce qui change réellement une croyance ?",opts:["La répétition d'affirmations positives","Une expérience contraire, même minuscule","La lecture d'un livre","Le temps qui passe"],correct:1,
explain:"C'est pourquoi chaque leçon se termine par une action : la preuve défait ce que le raisonnement ne défait pas."}
],
action:"Applique les 3 étapes à une seule croyance, celle qui te bloque le plus. Repère la phrase, cherche qui l'a dite en premier, trouve un contre-exemple réel. Une seule croyance ce soir, traitée sérieusement, vaut mieux que 5 survolées."
},
{module:"Module 2 — Les biais qui coûtent cher", title:"Aversion à la perte et statu quo", duration:"5 min",
script:[
"Les biais cognitifs sont des raccourcis mentaux automatiques. Ils ont été utiles à l'espèce et ils sont désastreux en finance, parce que les marchés récompensent exactement les comportements que notre cerveau évite. Cette leçon en présente 2, les plus coûteux.",
"<strong>L'aversion à la perte.</strong> Les travaux de Kahneman et Tversky, qui ont valu un prix Nobel d'économie, ont établi que <u>la douleur d'une perte est environ 2 fois plus intense que le plaisir d'un gain équivalent.</u> Perdre 100 € fait à peu près 2 fois plus mal que gagner 100 € ne fait plaisir.",
"Les conséquences sont massives et concrètes. On garde une position perdante en espérant revenir à l'équilibre, ce qui transforme une petite perte en grande. On vend trop tôt une position gagnante pour sécuriser le plaisir, ce qui coupe les meilleurs résultats. Et surtout, <strong>on n'investit pas du tout</strong>, parce que le risque de perdre pèse plus lourd dans l'esprit que la certitude de perdre à l'inflation.",
"<figure class=\"schema\"><svg viewBox=\"0 0 700 172\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"200\" y=\"20\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" letter-spacing=\"1.4\" fill=\"#1E4B3C\">DOULEUR RESSENTIE</text><text x=\"560\" y=\"20\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" letter-spacing=\"1.4\" fill=\"#B8862F\">PLAISIR RESSENTI</text><text x=\"20\" y=\"44\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#43555F\">Perdre 100 €</text><rect x=\"20\" y=\"54\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#EFF0EA\"/><rect x=\"20\" y=\"54\" width=\"449\" height=\"18\" rx=\"5\" fill=\"#E7EFEA\"/><rect x=\"469\" y=\"54\" width=\"211\" height=\"18\" rx=\"5\" fill=\"#F6EFE0\"/><text x=\"28\" y=\"67\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#1E4B3C\">intensité 2</text><text x=\"672\" y=\"67\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8E661F\"></text><text x=\"20\" y=\"100\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12.5\" fill=\"#43555F\">Gagner 100 €</text><rect x=\"20\" y=\"110\" width=\"660\" height=\"18\" rx=\"5\" fill=\"#EFF0EA\"/><rect x=\"20\" y=\"110\" width=\"224\" height=\"18\" rx=\"5\" fill=\"#E7EFEA\"/><rect x=\"244\" y=\"110\" width=\"436\" height=\"18\" rx=\"5\" fill=\"#F6EFE0\"/><text x=\"28\" y=\"123\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#1E4B3C\"></text><text x=\"672\" y=\"123\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11.5\" fill=\"#8E661F\">intensité 1</text></svg><figcaption>L'aversion à la perte : la douleur pèse environ 2 fois plus lourd que le plaisir équivalent. C'est ce déséquilibre qui fait vendre au mauvais moment.</figcaption></figure>",
"Ce dernier point mérite d'être souligné : <em>ne rien faire semble sans risque, alors que c'est la seule option dont la perte est certaine.</em>",
"<strong>Le biais de statu quo.</strong> À situation égale, nous préférons ne rien changer. C'est pourquoi des millions de personnes conservent un contrat trop cher, une banque trop chère ou un livret mal rémunéré pendant des années. Changer demande une décision, garder n'en demande aucune, et notre cerveau traite l'absence de décision comme une absence de risque.",
"Ces 2 biais se renforcent l'un l'autre, et c'est ce qui les rend puissants. L'aversion à la perte rend le changement effrayant, le statu quo rend l'immobilité confortable. Le résultat est une inertie qui peut durer 10 ans.",
"La parade est technique, pas morale, et c'est important : <strong>on ne corrige pas un biais par la volonté, on le contourne par une règle.</strong> Décider à l'avance, par écrit, ce qu'on fera dans telle situation, puis automatiser ce qui peut l'être. Un virement automatique ne connaît ni la peur ni l'inertie."
],
quiz:[
{q:"Quelle est l'intensité relative d'une perte selon Kahneman et Tversky ?",opts:["Identique à un gain","Environ 2 fois plus forte qu'un gain équivalent","5 fois plus forte","Plus faible qu'un gain"],correct:1,
explain:"Ce déséquilibre explique qu'on garde ses positions perdantes et qu'on vende trop tôt les gagnantes."},
{q:"Pourquoi ne rien faire semble-t-il sans risque ?",opts:["Parce que c'est effectivement sans risque","Parce que le cerveau traite l'absence de décision comme une absence de risque","Parce que l'inflation est faible","Parce que les banques le garantissent"],correct:1,
explain:"C'est pourtant la seule option dont la perte est certaine, puisque l'inflation agit sans qu'on décide quoi que ce soit."},
{q:"Comment neutraliser un biais ?",opts:["Par la volonté et la discipline","Par une règle décidée à l'avance et automatisée","En lisant davantage","En consultant un expert à chaque décision"],correct:1,
explain:"Un virement automatique ne connaît ni la peur ni l'inertie. La règle remplace la volonté au moment où elle manque."}
],
action:"Repère un contrat que tu gardes depuis plus de 3 ans sans l'avoir comparé : assurance, forfait, banque. Ne le change pas ce soir. Contente-toi de comparer une offre concurrente et de noter l'écart annuel. C'est le prix de ton statu quo."
},
{module:"Module 2 — Les biais qui coûtent cher", title:"Effet de dotation et biais de confirmation", duration:"5 min",
script:[
"Deux autres biais méritent d'être connus, parce qu'ils agissent après la décision d'achat et empêchent de la corriger.",
"<strong>L'effet de dotation.</strong> Nous accordons plus de valeur à ce que nous possédons qu'à ce que nous pourrions acquérir. L'expérience classique consiste à donner une tasse à un groupe et à lui demander à quel prix il la revendrait, puis à demander à un autre groupe combien il paierait pour la même. <u>Les propriétaires demandent systématiquement plus que les acheteurs n'offrent</u>, alors que la tasse est identique.",
"En finance, cet effet produit 2 comportements coûteux. On surestime la valeur d'un bien immobilier qu'on possède, ce qui fait rater des ventes et allonge les délais. Et on conserve une action ou un placement <em>parce qu'il est à nous</em>, sans jamais se demander si on l'achèterait aujourd'hui au prix du marché.",
"Cette dernière question est d'ailleurs le meilleur antidote, et elle se pose en une phrase : <strong>si je ne détenais pas cet actif, l'achèterais-je maintenant à ce prix ?</strong> Si la réponse est non, le conserver n'est plus une décision, c'est une habitude.",
"<strong>Le biais de confirmation.</strong> Nous cherchons les informations qui confirment ce que nous pensons déjà, et nous écartons celles qui le contredisent. Après avoir acheté quelque chose, nous lisons surtout les avis favorables et trouvons les critiques mal informées.",
"Ce biais est devenu bien plus puissant qu'avant, pour une raison mécanique : <u>les algorithmes des réseaux sociaux sélectionnent ce qui te ressemble.</u> Quelqu'un qui s'intéresse à un actif ne verra bientôt que des contenus enthousiastes à son sujet, ce qui ressemble à un consensus alors que ce n'est qu'un reflet.",
"La parade est simple à énoncer et inconfortable à pratiquer : <strong>cherche activement l'argument contraire avant de décider, pas après.</strong> Pour tout investissement envisagé, consacre autant de temps à comprendre pourquoi quelqu'un de sérieux s'y oppose qu'à écouter ceux qui le défendent. Si tu ne trouves aucun argument contraire crédible, c'est en général que tu n'as pas assez cherché."
],
quiz:[
{q:"Qu'est-ce que l'effet de dotation ?",opts:["Une aide financière de l'État","Le fait de surévaluer ce que l'on possède déjà","Un impôt sur les donations","La tendance à trop diversifier"],correct:1,
explain:"Les propriétaires demandent systématiquement plus que les acheteurs n'offrent, pour un objet identique."},
{q:"Quelle question neutralise cet effet ?",opts:["Combien ai-je payé ce bien ?","Si je ne le détenais pas, l'achèterais-je aujourd'hui à ce prix ?","Depuis combien de temps je le possède ?","Qui d'autre en possède ?"],correct:1,
explain:"Si la réponse est non, le conserver n'est plus une décision, c'est une habitude."},
{q:"Pourquoi le biais de confirmation s'est-il renforcé ?",opts:["Parce que l'information est plus rare","Parce que les algorithmes sélectionnent ce qui nous ressemble","Parce que les experts sont moins nombreux","Parce que les marchés sont plus volatils"],correct:1,
explain:"Un flux entièrement enthousiaste ressemble à un consensus alors qu'il n'est qu'un reflet de soi-même."}
],
action:"Choisis un investissement ou un produit financier qui t'attire en ce moment. Cherche 20 minutes uniquement des arguments contre, écrits par des gens sérieux. Note le meilleur d'entre eux. S'il ne te fait pas changer d'avis, ta décision en sortira renforcée."
},
{module:"Module 2 — Les biais qui coûtent cher", title:"L'audit de tes 3 dernières décisions", duration:"5 min",
script:[
"Cette leçon applique les 4 biais précédents à ta propre histoire. C'est l'exercice le plus inconfortable de la formation, et le plus formateur, parce qu'il transforme des notions abstraites en preuves personnelles.",
"Choisis 3 décisions financières prises au cours des 2 dernières années. Elles n'ont pas besoin d'être importantes : un achat de plus de 300 €, un contrat souscrit, un placement, un abonnement, une opportunité refusée. <strong>Prends-en une dont tu es fier, une que tu regrettes, et une dont tu ne sais pas quoi penser.</strong>",
"Pour chacune, réponds à 5 questions, par écrit. <strong>1.</strong> Quel était le déclencheur exact : un besoin réel, une émotion, une conversation, une publicité ? <strong>2.</strong> Combien de temps s'est écoulé entre l'idée et la décision ? <strong>3.</strong> Quelles informations avais-je, et lesquelles me manquaient ? <strong>4.</strong> Ai-je cherché un avis contraire ? <strong>5.</strong> Avec le recul, referais-je la même chose ?",
"Ce que les gens découvrent le plus souvent tient en 3 constats. <u>Les meilleures décisions ont presque toutes été lentes.</u> Les pires ont été prises dans un état émotionnel particulier : euphorie, peur, fatigue, ou pression sociale. Et dans presque tous les cas de regret, l'information manquante était disponible, mais on ne l'a pas cherchée.",
"Ce troisième constat est le plus important, parce qu'il est réparable. <strong>La différence entre une bonne et une mauvaise décision est rarement l'intelligence : c'est le temps qu'on s'est accordé.</strong>",
"Une précision pour éviter un contresens fréquent. <em>Une bonne décision peut avoir un mauvais résultat, et une mauvaise décision peut avoir un bon résultat.</em> Acheter au hasard un actif qui monte reste une mauvaise décision, simplement chanceuse. Juge le processus, pas le résultat, sinon tu tireras exactement les mauvaises leçons.",
"Garde cet audit. Le relire dans 1 an, en y ajoutant les décisions de l'année, est l'un des exercices les plus rentables qui existent, et presque personne ne le fait."
],
quiz:[
{q:"Quel est le point commun des meilleures décisions financières ?",opts:["Elles ont été rapides","Elles ont été lentes","Elles suivaient un conseil d'expert","Elles portaient sur de petits montants"],correct:1,
explain:"Le temps accordé à la décision compte davantage que l'intelligence de celui qui la prend."},
{q:"Que faut-il juger dans une décision passée ?",opts:["Le résultat obtenu","Le processus suivi","L'avis de l'entourage","Le montant engagé"],correct:1,
explain:"Une bonne décision peut avoir un mauvais résultat, et l'inverse. Juger le résultat conduit à tirer les mauvaises leçons."},
{q:"Qu'est-ce qui manquait le plus souvent dans les décisions regrettées ?",opts:["De l'argent","Une information pourtant disponible, mais non cherchée","Un conseiller","De la chance"],correct:1,
explain:"C'est le constat le plus encourageant, parce que c'est le seul qui soit entièrement réparable."}
],
action:"Fais l'audit de tes 3 décisions ce soir, par écrit, avec les 5 questions. Compte 20 minutes. Range la feuille avec ta carte de profil, et note dans ton calendrier une relecture dans 1 an."
},
{module:"Module 3 — Émotions et argent", title:"Peur, cupidité, impatience", duration:"5 min",
script:[
"Trois émotions expliquent la majorité des mauvaises décisions financières. Elles ne sont ni des défauts ni des faiblesses de caractère : ce sont des réactions normales, qui deviennent coûteuses uniquement parce qu'elles arrivent au mauvais moment.",
"<strong>La peur.</strong> Elle survient quand les marchés baissent, quand un revenu devient incertain, quand une échéance approche. Sa signature est simple à reconnaître : <u>elle pousse à agir vite pour faire cesser un inconfort</u>, alors que la situation demande précisément de ne rien faire.",
"Le mécanisme est bien documenté. Après une forte baisse, les particuliers vendent massivement, ce qui matérialise leurs pertes, puis rachètent après la remontée, donc plus cher. Ils font le contraire de ce qu'il faudrait, non par ignorance, mais parce que la douleur devient insupportable.",
"<strong>La cupidité.</strong> Elle apparaît quand quelque chose monte fort et que d'autres en profitent. Sa signature est la peur de rater, et elle est renforcée par l'exposition sociale : voir quelqu'un gagner produit une sensation bien plus forte que lire une statistique. C'est ce mécanisme qu'exploitent les promoteurs de placements douteux, qui montrent toujours des gagnants et jamais des perdants.",
"<strong>L'impatience.</strong> C'est la plus discrète et probablement la plus coûteuse. Elle ne provoque aucune catastrophe, elle empêche simplement le temps de faire son travail. Elle se manifeste par le changement de stratégie tous les 6 mois, la vérification quotidienne d'un portefeuille, ou l'abandon d'un plan qui n'a pas encore eu le temps de produire quoi que ce soit.",
"Un point important pour éviter la culpabilité inutile. <strong>Ces 3 émotions ne se suppriment pas.</strong> Aucune méthode ne rend insensible, et les professionnels les ressentent aussi. Ce qui les distingue est qu'ils ont prévu à l'avance ce qu'ils feraient quand elles se présenteraient.",
"C'est précisément l'objet des 2 leçons suivantes : construire les règles qui prennent le relais quand l'émotion arrive. Une règle écrite à froid vaut mieux qu'une décision prise à chaud, et c'est vrai même pour quelqu'un de parfaitement rationnel le reste du temps."
],
quiz:[
{q:"Quelle est la signature de la peur en finance ?",opts:["Elle pousse à attendre","Elle pousse à agir vite pour faire cesser un inconfort","Elle améliore l'analyse","Elle n'a aucun effet mesurable"],correct:1,
explain:"Elle survient précisément dans les situations qui demandent de ne rien faire, d'où les ventes après les baisses."},
{q:"Quelle émotion est la plus discrète et la plus coûteuse ?",opts:["La peur","La cupidité","L'impatience","La colère"],correct:2,
explain:"Elle ne provoque aucune catastrophe visible, elle empêche simplement le temps de produire ses effets."},
{q:"Peut-on supprimer ces émotions ?",opts:["Oui, avec de l'expérience","Non, on prévoit à l'avance ce qu'on fera quand elles arrivent","Oui, en déléguant ses décisions","Seulement en investissant peu"],correct:1,
explain:"Les professionnels les ressentent aussi. Ce qui les distingue est la règle écrite à froid."}
],
action:"Repense à la dernière fois où tu as pris une décision d'argent sous le coup d'une émotion. Identifie laquelle des 3 c'était, et ce qu'elle t'a coûté ou fait rater. Écris-le en 2 lignes : c'est la base de ton pare-feu."
},
{module:"Module 3 — Émotions et argent", title:"Construire ton pare-feu émotionnel", duration:"5 min",
script:[
"Un pare-feu émotionnel est un ensemble de dispositifs décidés à froid, qui s'interposent entre une émotion et une décision. L'idée n'est pas de mieux se contrôler, mais de <strong>rendre la mauvaise décision plus difficile à prendre que la bonne.</strong>",
"<strong>Dispositif 1 : le délai obligatoire.</strong> Toute décision financière au-dessus d'un montant que tu fixes toi-même, par exemple 300 €, attend 72 heures. Aucune exception, y compris pour les offres qui expirent. <u>Une opportunité qui ne survit pas à 3 jours de réflexion n'en était pas une</u>, et l'urgence est le principal outil de ceux qui vendent mal.",
"<strong>Dispositif 2 : la règle écrite à l'avance.</strong> Avant d'investir, écris ce que tu feras si la valeur baisse de 20 %, de 30 %, de 50 %. Le plus souvent, la bonne réponse est <em>ne rien faire et continuer à verser</em>. Mais ce qui compte n'est pas la réponse, c'est de l'avoir écrite avant, quand tu étais calme.",
"<figure class=\"schema\"><svg viewBox=\"0 0 700 338\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"20\" y=\"24\" width=\"190\" height=\"54\" rx=\"9\" fill=\"#EFF0EA\" stroke=\"#12212B\" stroke-width=\"1.5\"/><text x=\"115\" y=\"47\" text-anchor=\"middle\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14.5\" font-weight=\"600\" fill=\"#12212B\">Une émotion</text><text x=\"115\" y=\"65\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\" fill=\"#7A8A93\">peur, envie, urgence</text><path d=\"M210 51 C 270 51, 270 66, 330 66\" fill=\"none\" stroke=\"#B8862F\" stroke-width=\"1.8\"/><circle cx=\"330\" cy=\"66\" r=\"4\" fill=\"#B8862F\"/><rect x=\"344\" y=\"43\" width=\"336\" height=\"46\" rx=\"8\" fill=\"#F6EFE0\" stroke=\"#B8862F\" stroke-width=\"1.3\"/><text x=\"360\" y=\"64\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"14\" font-weight=\"600\" fill=\"#12212B\">Délai de 72 heures</text><text x=\"664\" y=\"64\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"13\" fill=\"#B8862F\">filtre 1</text><path d=\"M210 51 C 270 51, 270 128, 330 128\" fill=\"none\" stroke=\"#B8862F\" stroke-width=\"1.8\"/><circle cx=\"330\" cy=\"128\" r=\"4\" fill=\"#B8862F\"/><rect x=\"344\" y=\"105\" width=\"336\" height=\"46\" rx=\"8\" fill=\"#F6EFE0\" stroke=\"#B8862F\" stroke-width=\"1.3\"/><text x=\"360\" y=\"126\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"14\" font-weight=\"600\" fill=\"#12212B\">Règle écrite à froid</text><text x=\"664\" y=\"126\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"13\" fill=\"#B8862F\">filtre 2</text><path d=\"M210 51 C 270 51, 270 190, 330 190\" fill=\"none\" stroke=\"#1E4B3C\" stroke-width=\"1.8\"/><circle cx=\"330\" cy=\"190\" r=\"4\" fill=\"#1E4B3C\"/><rect x=\"344\" y=\"167\" width=\"336\" height=\"46\" rx=\"8\" fill=\"#E7EFEA\" stroke=\"#1E4B3C\" stroke-width=\"1.3\"/><text x=\"360\" y=\"188\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"14\" font-weight=\"600\" fill=\"#12212B\">Virement automatique</text><text x=\"664\" y=\"188\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"13\" fill=\"#1E4B3C\">filtre 3</text><path d=\"M210 51 C 270 51, 270 252, 330 252\" fill=\"none\" stroke=\"#1E4B3C\" stroke-width=\"1.8\"/><circle cx=\"330\" cy=\"252\" r=\"4\" fill=\"#1E4B3C\"/><rect x=\"344\" y=\"229\" width=\"336\" height=\"46\" rx=\"8\" fill=\"#E7EFEA\" stroke=\"#1E4B3C\" stroke-width=\"1.3\"/><text x=\"360\" y=\"250\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"14\" font-weight=\"600\" fill=\"#12212B\">Décision</text><text x=\"664\" y=\"250\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" font-size=\"13\" fill=\"#1E4B3C\">ce qui reste passe</text></svg><figcaption>Le pare-feu ne supprime pas l'émotion : il place des filtres entre elle et la décision.</figcaption></figure>",
"<strong>Dispositif 3 : l'automatisation.</strong> Tout ce qui est automatique échappe à l'émotion. Un virement programmé continue de partir pendant les périodes de doute, ce qui produit exactement l'effet recherché : investir aussi quand les prix sont bas, moment où personne n'en a envie.",
"<strong>Dispositif 4 : la fréquence de consultation.</strong> Regarder son portefeuille tous les jours multiplie les occasions de voir une baisse, donc de ressentir de la peur. <strong>Une consultation par mois suffit largement</strong> pour un investissement de long terme, et une par trimestre est encore mieux. Ce dispositif ne coûte rien et il est l'un des plus efficaces.",
"<strong>Dispositif 5 : le témoin.</strong> Choisis une personne à qui tu annonces tes décisions importantes avant de les prendre. Pas pour obtenir son avis, mais parce que devoir formuler à voix haute ce qu'on s'apprête à faire révèle immédiatement ce qui ne tient pas debout.",
"Ces 5 dispositifs ont un point commun qui explique leur efficacité : <strong>ils sont mis en place quand tout va bien, et ils agissent quand tout va mal.</strong> C'est l'inverse de la volonté, qui est justement absente au moment où on en aurait besoin."
],

explain:"Une opportunité qui ne survit pas à 3 jours n'en était pas une. L'urgence est l'outil principal des mauvais vendeurs."},
{q:"À quelle fréquence consulter un portefeuille de long terme ?",opts:["Chaque jour","Chaque semaine","Une fois par mois, voire par trimestre","Jamais"],correct:2,

{module:"Module 3 — Émotions et argent", title:"Décider quand tout va mal", duration:"5 min",
script:[
"Il arrive que la situation impose de décider vite, sous pression réelle : perte d'emploi, séparation, dépense imprévue importante, chute brutale des marchés. Les dispositifs de la leçon précédente supposent du temps. Cette leçon donne un protocole pour les moments où il n'y en a pas.",
"<strong>Étape 1 : nommer l'émotion, à voix haute ou par écrit.</strong> Cela paraît anodin et c'est mesuré : mettre un mot sur ce qu'on ressent en réduit l'intensité. Dis simplement <em>« j'ai peur »</em> ou <em>« je suis en colère »</em>. Tu ne cherches pas à te calmer, seulement à reprendre une place d'observateur.",
"<strong>Étape 2 : séparer l'urgent du pressant.</strong> Très peu de décisions financières sont réellement urgentes. Une échéance de loyer l'est. Une opportunité d'investissement ne l'est jamais. Pose-toi la question : <u>que se passe-t-il concrètement si je décide dans 48 heures ?</u> Dans 9 cas sur 10, la réponse est : rien.",
"<strong>Étape 3 : réduire le champ.</strong> Sous stress, notre capacité de décision s'effondre. N'essaie pas de résoudre toute la situation. Identifie la <strong>seule prochaine action</strong>, la plus petite possible : passer un appel, ouvrir un relevé, écrire un message. Une action minuscule accomplie vaut mieux qu'un plan complet non commencé.",
"<strong>Étape 4 : chercher un avis extérieur, pas un avis rassurant.</strong> La différence est essentielle. Un avis rassurant confirme ce que tu veux entendre et te maintient dans ton état. Un avis extérieur pose des questions que tu n'as pas envisagées. Choisis quelqu'un de calme plutôt que quelqu'un d'accord.",
"<strong>Étape 5 : décider, puis écrire pourquoi.</strong> Note en 3 lignes la décision prise et ses raisons, datées. Cela sert 2 fois : sur le moment, écrire oblige à clarifier ; plus tard, relire permet de juger le processus plutôt que le résultat, comme vu dans l'audit.",
"Un dernier point, et il est important à entendre. <strong>En situation de vraie difficulté financière, l'aide existe et elle est gratuite.</strong> Les points conseil budget, les travailleurs sociaux et les associations de consommateurs accompagnent sans rien vendre. Y avoir recours n'est pas un échec : c'est exactement le genre de décision qu'un plan bien construit prévoit."
],
quiz:[
{q:"Pourquoi nommer l'émotion avant de décider ?",opts:["Pour se justifier","Parce que mettre un mot sur ce qu'on ressent en réduit l'intensité","Pour gagner du temps","Pour convaincre les autres"],correct:1,
explain:"L'objectif n'est pas de se calmer mais de reprendre une place d'observateur de sa propre situation."},
{q:"Quelle question distingue l'urgent du pressant ?",opts:["Combien cela coûte-t-il ?","Que se passe-t-il concrètement si je décide dans 48 heures ?","Qui d'autre est concerné ?","Ai-je déjà vécu cela ?"],correct:1,
explain:"Dans 9 cas sur 10, la réponse est : rien. Une opportunité d'investissement n'est jamais urgente."},
{q:"Quel type d'avis faut-il chercher sous stress ?",opts:["Un avis rassurant","Un avis extérieur, de quelqu'un de calme plutôt que d'accord","L'avis du vendeur","Aucun, il faut décider seul"],correct:1,
explain:"Un avis rassurant confirme ce qu'on veut entendre. Un avis extérieur pose les questions qu'on n'a pas envisagées."}
],
action:"Recopie les 5 étapes dans une note de ton téléphone, intitulée « avant de décider ». Tu n'en auras pas besoin ce soir, et c'est précisément pour ça qu'il faut la créer maintenant."
},
{module:"Module 4 — Reprogrammer et agir", title:"3 rituels financiers qui tiennent", duration:"5 min",
script:[
"Les bonnes intentions ne survivent pas à un mois chargé. Ce qui tient, ce sont les rituels : des gestes courts, à date fixe, qui finissent par ne plus demander de décision. Voici les 3 seuls qui comptent vraiment.",
"<strong>Rituel 1 : le point de 10 minutes, une fois par semaine.</strong> Toujours le même jour, à la même heure. Tu regardes ton solde, tes dépenses de la semaine, et tu notes une seule chose à ajuster. Pas de tableau complexe, pas d'analyse : un coup d'œil et une note. <u>C'est la régularité qui produit l'effet, pas la profondeur.</u>",
"<strong>Rituel 2 : le point de 30 minutes, une fois par mois.</strong> Le lendemain de ta paie. Tu vérifies que le virement d'épargne est bien parti, tu regardes le mois écoulé dans ton tableau de budget, et tu ajustes le montant si nécessaire. C'est aussi le moment de résilier ce qui ne sert plus.",
"<strong>Rituel 3 : la revue d'1 heure, une fois par an.</strong> Celle décrite dans la formation sur l'épargne : fonds d'urgence, virements, charges fixes, contrats, frais, projets. Une seule heure, à une date liée à un repère existant pour ne pas l'oublier.",
"Trois conseils pour que ces rituels tiennent. <strong>1. Accroche-les à une habitude existante</strong> plutôt qu'à une intention : après le café du dimanche matin, après avoir sorti les poubelles. L'habitude ancienne sert de déclencheur à la nouvelle.",
"<strong>2. Commence ridiculement petit.</strong> 5 minutes par semaine pendant 3 mois valent infiniment mieux qu'une heure abandonnée au bout de 2 semaines. On augmente ensuite, jamais l'inverse.",
"<strong>3. Prévois l'échec.</strong> Tu vas sauter des semaines, c'est certain. La règle qui sauve les habitudes tient en une phrase : <em>ne jamais rater 2 fois de suite.</em> Un oubli est un accident, 2 oublis sont un abandon qui commence.",
"Un mot sur le temps que tout cela demande. Une fois installés, ces 3 rituels représentent environ <strong>10 heures par an</strong>. C'est peu comparé au temps consacré à gagner cet argent, et c'est pourtant ce qui décide de ce qu'il en reste."
],
quiz:[
{q:"Quelle est la fréquence du premier rituel ?",opts:["Quotidienne","Hebdomadaire, 10 minutes","Mensuelle","Trimestrielle"],correct:1,
explain:"Un coup d'œil et une note à ajuster. C'est la régularité qui produit l'effet, pas la profondeur de l'analyse."},
{q:"Comment ancrer une nouvelle habitude ?",opts:["En se motivant chaque matin","En l'accrochant à une habitude existante qui sert de déclencheur","En se fixant un objectif ambitieux","En prévenant son entourage"],correct:1,
explain:"Après le café du dimanche, après les poubelles : l'ancienne habitude déclenche la nouvelle sans effort de volonté."},
{q:"Quelle règle sauve une habitude ?",opts:["Ne jamais rater","Ne jamais rater 2 fois de suite","Rattraper le lendemain","Recommencer chaque trimestre"],correct:1,
explain:"Un oubli est un accident, 2 oublis consécutifs sont un abandon qui commence."}
],
action:"Programme dès ce soir le rituel hebdomadaire dans ton calendrier, en récurrence, accroché à quelque chose que tu fais déjà. Dix minutes, un jour fixe. C'est le seul des 3 à mettre en place aujourd'hui."
},
{module:"Module 4 — Reprogrammer et agir", title:"Sortir de la procrastination financière", duration:"5 min",
script:[
"Presque tout le monde repousse au moins une démarche financière : ouvrir un compte, résilier un contrat, relancer un impayé, regarder une situation qu'on préfère ignorer. Cette leçon explique pourquoi, et donne 4 moyens d'en sortir.",
"La procrastination financière n'est pas de la paresse. Elle a 3 causes identifiées, et reconnaître la sienne change la solution à appliquer.",
"<strong>Cause 1 : la peur de découvrir.</strong> Ne pas ouvrir ses relevés protège d'une information désagréable. C'est un mécanisme d'évitement classique, et il coûte cher parce que la situation empire pendant qu'on ne regarde pas.",
"<strong>Cause 2 : la complexité perçue.</strong> Une tâche floue paralyse. <em>« M'occuper de mon épargne »</em> n'est pas une tâche, c'est un sujet. Le cerveau ne sait pas par où commencer, donc il ne commence pas.",
"<strong>Cause 3 : l'absence de récompense immédiate.</strong> Résilier un abonnement inutile rapporte 15 € par mois, ce qui ne procure aucune satisfaction sur le moment. Notre cerveau est bien plus sensible aux gains immédiats qu'aux gains différés, et c'est le même mécanisme qui rend l'épargne difficile.",
"Quatre moyens d'en sortir, à choisir selon la cause. <strong>La règle des 2 minutes :</strong> toute tâche qui prend moins de 2 minutes se fait immédiatement, sans être notée ni planifiée. Elle élimine à elle seule une bonne partie de la liste.",
"<strong>Le découpage :</strong> transforme le sujet en première action minuscule. Pas <em>« m'occuper de mon épargne »</em> mais <em>« ouvrir l'application et noter le solde »</em>. Une tâche doit pouvoir se faire sans réfléchir.",
"<strong>La session unique :</strong> bloque 45 minutes dans ton agenda, sans téléphone, pour traiter d'un coup les 5 démarches en attente. <u>Le coût de démarrage n'est alors payé qu'une seule fois</u>, ce qui rend cette méthode bien plus efficace que d'étaler.",
"<strong>L'engagement annoncé :</strong> dis à quelqu'un ce que tu vas faire et quand. Le simple fait d'avoir annoncé change fortement la probabilité de passer à l'acte, et c'est aussi ce qui rend un accompagnement efficace au-delà de son contenu.",
"Retiens ceci : <strong>ce n'est pas la motivation qui manque, c'est la première action qui est trop grosse.</strong> Réduis-la jusqu'à ce qu'elle devienne ridicule, et elle se fera."
],
quiz:[
{q:"Quelle est la première cause de procrastination financière ?",opts:["La paresse","La peur de découvrir une information désagréable","Le manque de temps","L'absence de conseiller"],correct:1,
explain:"C'est un évitement, pas un défaut de caractère. Et il coûte cher parce que la situation empire pendant qu'on ne regarde pas."},
{q:"Pourquoi « m'occuper de mon épargne » ne fonctionne pas ?",opts:["C'est trop long","Ce n'est pas une tâche mais un sujet, le cerveau ne sait pas par où commencer","Cela demande un professionnel","C'est trop coûteux"],correct:1,
explain:"Une tâche doit pouvoir se faire sans réfléchir : « ouvrir l'application et noter le solde » est une tâche."},
{q:"Pourquoi la session unique de 45 minutes est-elle efficace ?",opts:["Parce qu'elle est plus courte","Parce que le coût de démarrage n'est payé qu'une seule fois","Parce qu'elle est plus agréable","Parce qu'elle évite les erreurs"],correct:1,
explain:"Étaler 5 démarches sur 5 jours revient à payer 5 fois le coût de démarrage, qui est justement le vrai obstacle."}
],
action:"Écris la liste des démarches financières que tu repousses. Pour chacune, note la première action, celle qui prend moins de 2 minutes. Fais-en une seule ce soir, la plus petite. La liste perdra la moitié de son poids."
},
{module:"Module 4 — Reprogrammer et agir", title:"Ton plan sur 30 jours", duration:"5 min",
script:[
"Dernière leçon. Elle rassemble les 11 précédentes en un plan de 30 jours, volontairement modeste, parce qu'un plan ambitieux abandonné au dixième jour ne vaut rien.",
"<strong>Semaine 1 : voir.</strong> Aucune décision, aucun changement. Tu notes tes dépenses au fil des jours, tu relis tes 3 croyances et ton profil, et tu mets en place le rituel hebdomadaire de 10 minutes. L'objectif est uniquement de regarder sans rien corriger, ce qui est plus difficile qu'il n'y paraît.",
"<strong>Semaine 2 : alléger.</strong> Tu attaques les charges fixes : abonnements oubliés, contrats jamais renégociés, frais bancaires. Une session unique de 45 minutes suffit à traiter l'essentiel. <u>C'est la semaine qui rapporte le plus d'argent par heure passée</u>, et de loin.",
"<strong>Semaine 3 : automatiser.</strong> Tu programmes le virement d'épargne le lendemain de ta paie, vers un compte séparé, avec un montant délibérément trop bas. Tu mets aussi en place le délai de 72 heures et tu règles la fréquence de consultation de tes comptes.",
"<figure class=\"schema\"><svg viewBox=\"0 0 700 168\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><line x1=\"34\" y1=\"96\" x2=\"666\" y2=\"96\" stroke=\"#DCDDD3\" stroke-width=\"2\"/><path d=\"M666 96 l-9 -5 v10 z\" fill=\"#DCDDD3\"/><line x1=\"34\" y1=\"96\" x2=\"34\" y2=\"62\" stroke=\"#1E4B3C\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/><circle cx=\"34\" cy=\"96\" r=\"7\" fill=\"#1E4B3C\"/><circle cx=\"34\" cy=\"96\" r=\"12\" fill=\"none\" stroke=\"#1E4B3C\" stroke-width=\"1\" opacity=\".35\"/><text x=\"34\" y=\"52\" text-anchor=\"start\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14\" font-weight=\"600\" fill=\"#12212B\">Semaine 1</text><text x=\"34\" y=\"122\" text-anchor=\"start\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12\" fill=\"#43555F\">Voir, sans corriger</text><line x1=\"243\" y1=\"96\" x2=\"243\" y2=\"62\" stroke=\"#B8862F\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/><circle cx=\"243\" cy=\"96\" r=\"7\" fill=\"#B8862F\"/><circle cx=\"243\" cy=\"96\" r=\"12\" fill=\"none\" stroke=\"#B8862F\" stroke-width=\"1\" opacity=\".35\"/><text x=\"243\" y=\"52\" text-anchor=\"middle\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14\" font-weight=\"600\" fill=\"#12212B\">Semaine 2</text><text x=\"243\" y=\"122\" text-anchor=\"middle\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12\" fill=\"#43555F\">Alléger les charges fixes</text><line x1=\"451\" y1=\"96\" x2=\"451\" y2=\"62\" stroke=\"#B8862F\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/><circle cx=\"451\" cy=\"96\" r=\"7\" fill=\"#B8862F\"/><circle cx=\"451\" cy=\"96\" r=\"12\" fill=\"none\" stroke=\"#B8862F\" stroke-width=\"1\" opacity=\".35\"/><text x=\"451\" y=\"52\" text-anchor=\"middle\" font-family=\"Newsreader, Georgia, serif\" font-size=\"14\" font-weight=\"600\" fill=\"#12212B\">Semaine 3</text><text x=\"451\" y=\"122\" text-anchor=\"middle\" font-family=\"Karla, system-ui, sans-serif\" font-size=\"12\" fill=\"#43555F\">Automatiser l async function loadProgressFromServer(){
  const { data } = await sb
    .from('lesson_progress')
    .select('lesson_number, completed')
    .eq('user_id', CURRENT_USER.id)
    .eq('formation', FORMATION);
  const p = {};
  if(data){ data.forEach(function(row){ if(row.completed) p[row.lesson_number] = true; }); }
  PROGRESS_CACHE = p;
  return p;
}
function getProgress(){ return PROGRESS_CACHE; }
async function setProgressServer(lessonNumber, value){
  PROGRESS_CACHE[lessonNumber] = value;
  await sb.from('lesson_progress').upsert({
    user_id: CURRENT_USER.id,
    formation: FORMATION,
    lesson_number: lessonNumber,
    completed: value,
    completed_at: value ? new Date().toISOString() : null
  }, { onConflict: 'user_id,formation,lesson_number' });

  await majCarnet(lessonNumber, value);
}

/* Le carnet de route : l'action cochée s'inscrit dans le carnet personnel,
   la décocher l'en retire. Une erreur ici ne doit jamais bloquer la
   progression de la leçon, d'où le try/catch silencieux. */
async function majCarnet(lessonNumber, value){
  try {
    const l = LESSONS[lessonNumber - 1];
    if(!l) return;

    if(!value){
      await sb.from('carnet').delete()
        .eq('user_id', CURRENT_USER.id)
        .eq('formation', FORMATION)
        .eq('lesson_number', lessonNumber);
      return;
    }

    await sb.from('carnet').upsert({
      user_id: CURRENT_USER.id,
      formation: FORMATION,
      lesson_number: lessonNumber,
      titre: l.title || ('Leçon ' + lessonNumber),
      action: l.action || ''
    }, { onConflict: 'user_id,formation,lesson_number', ignoreDuplicates: true });
  } catch(e){
    console.warn('Carnet non mis à jour :', e);
  }
}

let current = parseInt(new URLSearchParams(location.search).get('l')) || 1;
if(current < 1) current = 1;
if(current > LESSONS.length) current = LESSONS.length;

function isUnlocked(n){
  if(n === 1) return true;
  const progress = getProgress();
  return !!progress[n-1];
}

function renderSidebar(){
  const progress = getProgress();
  const doneCount = Object.keys(progress).filter(function(k){ return progress[k]; }).length;
  document.getElementById('navProgress').textContent = doneCount + '/' + LESSONS.length + ' leçons';

  /* Regroupement des lecons par module : c'est le module qui devient
     l'etape de l'itineraire, la lecon n'est qu'un arret. */
  const etapes = [];
  LESSONS.forEach(function(l, i){
    const nom = l.module.split(' — ')[1] || l.module;
    let e = etapes.find(function(x){ return x.nom === nom; });
    if(!e){ e = { nom: nom, lecons: [] }; etapes.push(e); }
    e.lecons.push({ n: i + 1, titre: l.title });
  });

  const etapeCourante = etapes.findIndex(function(e){
    return e.lecons.some(function(a){ return a.n === current; });
  });

  const COCHE = '<svg viewBox="0 0 24 24" fill="none"><path d="M5 12L10 17L19 7" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  let html = '<div class="itin">' +
    '<div class="itin-tete">' +
      '<div class="itin-formation">' + NOM_FORMATION + '</div>' +
      '<div class="itin-compte">Étape ' + (etapeCourante + 1) + ' sur ' + etapes.length + ' · ' + doneCount + '/' + LESSONS.length + ' leçons</div>' +
      '<div class="itin-barre"><span style="width:' + Math.round(doneCount / LESSONS.length * 100) + '%"></span></div>' +
    '</div><div class="route">';

  etapes.forEach(function(e, idx){
    const toutesFaites = e.lecons.every(function(a){ return progress[a.n]; });
    const ici = idx === etapeCourante;
    const premiereAccessible = e.lecons.find(function(a){ return isUnlocked(a.n); });
    const classe = toutesFaites ? 'faite' : (ici ? 'ici' : '');
    const borne = toutesFaites ? COCHE : String(idx + 1);
    const cible = premiereAccessible ? premiereAccessible.n : e.lecons[0].n;

    html += '<div class="etape-i ' + classe + '">' +
      '<span class="borne">' + borne + '</span>' +
      '<button class="etape-titre" onclick="goTo(' + cible + ')">' + e.nom + '</button>' +
      '<div class="etape-meta">' + e.lecons.length + ' leçon' + (e.lecons.length > 1 ? 's' : '') + '</div>';

    /* On ne deroule que l'etape ou l'on se trouve : la carte reste lisible. */
    if(ici){
      html += '<div class="arrets">';
      e.lecons.forEach(function(a){
        const fait = !!progress[a.n];
        const ouvert = isUnlocked(a.n);
        const cl = (a.n === current ? 'ici ' : '') + (fait ? 'faite ' : '') + (ouvert ? '' : 'bloque');
        html += '<div class="arret ' + cl + '" onclick="goTo(' + a.n + ')">' +
          '<span class="puce">' + COCHE + '</span><span>' + a.titre + '</span></div>';
      });
      html += '</div>';
    }
    html += '</div>';
  });

  html += '</div>' + escaleHtml() + '</div>';
  document.getElementById('sidebar').innerHTML = html;
}

/* Changer de formation sans repasser par le menu. */

  { cle:'monnaie',     nom:'Comprendre la monnaie',   page:'lecons-monnaie.html' },
  { cle:'psychologie', nom:"Psychologie de l'argent", page:'lecons-psychologie.html' },

function escaleHtml(){
  let h = '<div class="escale"><div class="escale-titre">Autres formations</div>';
  PARCOURS.forEach(function(p){
    const courante = p.cle === FORMATION;
    h += '<a href="' + p.page + '" class="' + (courante ? 'courante' : 'prete') + '">' +
      '<span class="jeton"></span><span>' + p.nom + '</span></a>';
  });
  h += '</div>';
  return h;
}

function goTo(n){
  if(!isUnlocked(n)){
    alert('Termine la leçon précédente pour débloquer celle-ci.');
    return;
  }
  current = n;
  history.replaceState(null, '', '?l=' + n);
  render();
  window.scrollTo(0,0);
}

let quizState = {};

function allQuizCorrect(l){
  for(let i=0;i<l.quiz.length;i++){ if(!quizState[i]) return false; }
  return true;
}

function render(){
  renderSidebar();
  const l = LESSONS[current-1];
  const progress = getProgress();
  const done = !!progress[current];
  quizState = {};
  if(done){ l.quiz.forEach(function(q,i){ quizState[i] = true; }); }
  const main = document.getElementById('main');
  let quizHtml = '';
  l.quiz.forEach(function(q, qi){
    let optsHtml = '';
    q.opts.forEach(function(opt, oi){
      const preAnswered = done && oi === q.correct;
      optsHtml += '<div class="quiz-opt ' + (preAnswered?'correct disabled':'') + '" id="q' + qi + 'o' + oi + '" onclick="answerQuiz(' + qi + ',' + oi + ',' + q.correct + ')">' +
        '<span class="quiz-letter">' + String.fromCharCode(65+oi) + '</span><span class="quiz-opt-text">' + opt + '</span></div>';
    });
    quizHtml += '<div class="quiz-card"><div class="quiz-q">Question ' + (qi+1) + '. ' + q.q + '</div>' + optsHtml +
      '<div class="quiz-explain ' + (done?'show':'') + '" id="exp' + qi + '"><strong>Explication : </strong>' + q.explain + '</div></div>';
  });

  const quizOk = allQuizCorrect(l);
  const actionCardStyle = (!quizOk && !done) ? 'opacity:.5;pointer-events:none;' : '';

  main.innerHTML =
    (done ? '<div class="completion-badge show">✓ Leçon terminée</div>' : '') +
    '<div class="lesson-eyebrow">' + l.module + '</div>' +
    '<div class="lesson-title">' + (current) + '. ' + l.title + '</div>' +
    '<div class="lesson-meta">' + l.duration + ' de lecture · Leçon ' + current + ' sur ' + LESSONS.length + '</div>' +
    '<div class="section-label"><span class="dot"></span>Comprendre</div>' +
    '<div class="script-text">' + l.script.map(function(p){
      return p.indexOf('<figure') === 0 ? p : '<p>' + p + '</p>';
    }).join('') + '</div>' +
    '<div class="section-label quiz"><span class="dot"></span>Vérifier</div>' +
    quizHtml +
    '<div class="section-label action"><span class="dot"></span>Petite action</div>' +
    (!quizOk && !done ? '<div style="font-size:12.5px;font-weight:600;color:var(--coral);margin-bottom:10px;">Réponds correctement aux ' + l.quiz.length + ' questions pour débloquer cette action.</div>' : '') +
    '<div class="action-card" id="actionCard" style="' + actionCardStyle + '">' +
      '<div class="action-text">' + l.action + '</div>' +
      '<div class="action-check" onclick="toggleAction()"><span class="action-box ' + (done?'checked':'') + '" id="actionBox">' + (done?'✓':'') + '</span><span class="action-label">Marquer cette leçon comme terminée</span></div>' +
    '</div>' +
    '<div class="lesson-nav">' +
      (current > 1 ? '<button class="nav-btn ghost" onclick="goTo(' + (current-1) + ')">← Leçon précédente</button>' : '<span></span>') +
      (current < LESSONS.length ? '<button class="nav-btn" onclick="goTo(' + (current+1) + ')">Leçon suivante →</button>' : '<a href="lecons-budget.html" class="nav-btn">Maîtriser son budget →</a>') +
    '</div>' +

    '<div class="lesson-sortie">' +
      '<a href="index.html#formations">Sommaire des formations</a><span>·</span>' +
      '<a href="carnet.html">Mon carnet</a><span>·</span>' +
      '<a href="index.html">Retour au site</a>' +
    '</div>';
}

function answerQuiz(qi, oi, correct){
  if(quizState[qi]) return; // déjà répondu correctement, verrouillé
  const chosen = document.getElementById('q'+qi+'o'+oi);
  if(chosen.classList.contains('disabled')) return;

  if(oi === correct){
    for(let k=0;k<10;k++){
      const el = document.getElementById('q'+qi+'o'+k);
      if(el){ el.classList.add('disabled'); }
    }
    chosen.classList.add('correct');
    quizState[qi] = true;
    document.getElementById('exp'+qi).classList.add('show');
    const l = LESSONS[current-1];
    const quizOk = allQuizCorrect(l);
    const card = document.getElementById('actionCard');
    if(quizOk && card){
      card.style.opacity = '';
      card.style.pointerEvents = '';
      const lock = card.previousElementSibling;
      if(lock && lock.textContent.indexOf('Réponds correctement') !== -1){ lock.style.display = 'none'; }
    }
  } else {
    chosen.classList.add('wrong');
    document.getElementById('exp'+qi).classList.add('show');
    setTimeout(function(){ chosen.classList.remove('wrong'); }, 900);
  }
}

async function toggleAction(){
  const l = LESSONS[current-1];
  const progress = getProgress();
  const newValue = !progress[current];
  if(newValue && !allQuizCorrect(l)){
    alert('Réponds correctement à toutes les questions du quiz avant de valider cette leçon.');
    return;
  }
  await setProgressServer(current, newValue);
  render();

  /* La formation vient-elle de s'achever ? Si oui, on plante la borne.
     On ne la montre qu'au moment du basculement, jamais en revenant
     sur une leçon déjà validée. */
  if(newValue) verifierFinDeParcours();
}

async function verifierFinDeParcours(){
  const progress = getProgress();
  const faites = Object.keys(progress).filter(function(k){ return progress[k]; }).length;
  if(faites < LESSONS.length) return;

  let prenom = '';
  let semaines = 1;
  try {
    const { data } = await sb.from('profiles').select('prenom').eq('id', CURRENT_USER.id).maybeSingle();
    if(data && data.prenom) prenom = data.prenom;

    const { data: dates } = await sb.from('lesson_progress')
      .select('completed_at').eq('user_id', CURRENT_USER.id).eq('formation', FORMATION)
      .not('completed_at', 'is', null).order('completed_at', { ascending: true }).limit(1);
    if(dates && dates.length){
      const debut = new Date(dates[0].completed_at).getTime();
      semaines = Math.max(1, Math.round((Date.now() - debut) / (7*24*3600*1000)));
    }
  } catch(e){ console.warn('Carte : données partielles', e); }

  ouvrirCarte(FORMATION, LESSONS.length, prenom, semaines);
}

async function boot(){
  document.getElementById('main').innerHTML = '<div style="padding:60px 0;text-align:center;color:var(--ink-faint);font-size:14px;">Chargement de ta progression…</div>';
  const user = await requireAuth();
  if(!user) return;
  const unlocked = await requireUnlock(user.id);
  if(!unlocked) return;
  CURRENT_USER = user;
  await loadProgressFromServer();

  if(!isUnlocked(current)){
    let lastUnlocked = 1;
    for(let i=1;i<=LESSONS.length;i++){ if(isUnlocked(i)) lastUnlocked = i; else break; }
    current = lastUnlocked;
    history.replaceState(null, '', '?l=' + current);
  }
  render();
}
boot();
