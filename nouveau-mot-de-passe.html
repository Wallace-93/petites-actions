<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nouveau mot de passe · NiouDem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --ink:#12212B;--ink-muted:#7A8A93;--ink-faint:#96A3AA;
  --bg:#FCFBF8;--bg-soft:#F5F4EE;--bg-line:#DCDDD3;
  --green:#1E4B3C;--green-pale:#E7EFEA;--green-bord:#BFD6C9;
  --coral:#A24332;
  --sans:'Karla',system-ui,-apple-system,sans-serif;
  --display:'Newsreader',Georgia,serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
body{font-family:var(--sans);background:var(--bg-soft);color:var(--ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;min-height:100vh;display:flex;flex-direction:column;}
a{color:inherit;}
.nav{position:sticky;top:0;z-index:200;background:rgba(255,255,255,.96);backdrop-filter:blur(20px);border-bottom:1px solid var(--bg-line);padding:0 24px;display:flex;align-items:center;height:60px;}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;font-weight:800;font-size:15px;color:var(--ink);}
.nav-mark{width:26px;height:26px;border-radius:8px;background:var(--green);display:flex;align-items:center;justify-content:center;}
.nav-mark svg{width:14px;height:14px;}
.wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px;}
.form-card{background:var(--bg);border:1px solid var(--bg-line);border-radius:20px;padding:36px 32px;width:100%;max-width:400px;}
.form-title{font-size:20px;font-weight:800;color:var(--ink);margin-bottom:6px;letter-spacing:-.02em;}
.form-sub{font-size:13px;font-weight:400;color:var(--ink-muted);margin-bottom:24px;line-height:1.55;}
.field label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:7px;}
.field input{width:100%;background:var(--bg-soft);border:1.5px solid var(--bg-line);border-radius:11px;padding:12px 14px;font-family:var(--sans);font-size:14px;font-weight:500;color:var(--ink);outline:none;margin-bottom:16px;}
.field input:focus{border-color:var(--green);}
.submit-btn{width:100%;background:var(--green);color:#fff;border:none;cursor:pointer;font-family:var(--sans);font-size:15px;font-weight:700;padding:14px;border-radius:12px;transition:background .2s;margin-bottom:10px;}
.submit-btn:hover{background:#149041;}
.submit-btn:disabled{opacity:.6;cursor:not-allowed;}
.form-error{background:#F8EDEA;border:1px solid #FFC4AD;border-radius:10px;padding:11px 14px;font-size:12.5px;color:var(--coral);margin-bottom:16px;display:none;}
.form-error.show{display:block;}
.invalid-link{text-align:center;padding:20px 0;}
.invalid-link p{color:var(--ink-muted);font-size:13.5px;line-height:1.6;margin-bottom:16px;}
.invalid-link a{color:var(--green);font-weight:700;text-decoration:none;}

/* ===== Direction Encre & Laiton — surcouche typographique ===== */
body{font-family:var(--sans);letter-spacing:0;}
h1,h2,h3,h4,.hero-h1,.s-title,.cta-h2,.p-name,.mod-title,.c-title,.hc-title,
.lecon-title,.q-title,.auth-title,.perf-title,.section-title,.edu-title,.tips-title{
  font-family:var(--display);letter-spacing:-.015em;
}
.hero-h1,.s-title,.cta-h2,.auth-title{font-weight:500;letter-spacing:-.018em;line-height:1.16;}
h3,h4,.p-name,.mod-title,.c-title,.hc-title,.lecon-title{font-weight:600;}
.s-tag,.f-copy,.hstat-label,.stat-label,.perf-note,.order-meta,.pos-value,
.price-cell,.asset-label,.badge,.eyebrow,.nav-balance{font-family:var(--mono);}

.nav-name em,.ft-name em{font-style:normal;color:#B8862F;}
</style>
</head>
<body>

<nav class="nav">
  <a href="index.html" class="nav-logo">
    <span class="nav-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12L10 17L19 7" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    NiouDem
  </a>
</nav>

<div class="wrap">
  <div class="form-card" id="formCard">
    <div class="form-title">Choisir un nouveau mot de passe</div>
    <div class="form-sub" id="formSub">Vérification du lien en cours…</div>
    <div class="form-error" id="formError"></div>

    <div id="formFields" style="display:none;">
      <div class="field">
        <label>Nouveau mot de passe</label>
        <input type="password" id="fPass" placeholder="6 caractères minimum" />
      </div>
      <div class="field">
        <label>Confirmer le mot de passe</label>
        <input type="password" id="fPass2" placeholder="Retape ton mot de passe" />
      </div>
      <button class="submit-btn" id="submitBtn" onclick="updatePassword()">Valider le nouveau mot de passe →</button>
    </div>

    <div class="invalid-link" id="invalidLink" style="display:none;">
      <p>Ce lien n'est plus valide ou a expiré. Demande un nouveau lien de réinitialisation.</p>
      <a href="mot-de-passe-oublie.html">Demander un nouveau lien →</a>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://pchkshpbzsybvtwxqvrf.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBjaGtzaHBienN5YnZ0d3hxdnJmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5NDgwMTAsImV4cCI6MjEwMTUyNDAxMH0.3EqyBUDmHHJ79mdDD6dmpVwsuEA0h2hF-75Up9R2Snc';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
/* Exposé pour que le widget de retours réutilise ce client plutôt
   que d'en créer un second sur la même clé de stockage. */
window.sb = sb;

// Quand on arrive depuis le lien email, Supabase déclenche un événement PASSWORD_RECOVERY
let recoveryReady = false;

sb.auth.onAuthStateChange((event, session) => {
  if(event === 'PASSWORD_RECOVERY'){
    recoveryReady = true;
    document.getElementById('formSub').textContent = 'Choisis un mot de passe sécurisé pour ton compte.';
    document.getElementById('formFields').style.display = 'block';
  }
});

// Filet de sécurité : si l'événement n'arrive pas dans les 2.5s, on vérifie la session directement
setTimeout(async function(){
  if(recoveryReady) return;
  const { data: { session } } = await sb.auth.getSession();
  if(session){
    document.getElementById('formSub').textContent = 'Choisis un mot de passe sécurisé pour ton compte.';
    document.getElementById('formFields').style.display = 'block';
  } else {
    document.getElementById('formCard').querySelector('.form-sub').style.display = 'none';
    document.getElementById('invalidLink').style.display = 'block';
  }
}, 2500);

async function updatePassword(){
  const pass = document.getElementById('fPass').value;
  const pass2 = document.getElementById('fPass2').value;
  const errorEl = document.getElementById('formError');
  errorEl.classList.remove('show');

  if(pass.length < 6){
    errorEl.textContent = 'Le mot de passe doit contenir au moins 6 caractères.';
    errorEl.classList.add('show');
    return;
  }
  if(pass !== pass2){
    errorEl.textContent = 'Les deux mots de passe ne correspondent pas.';
    errorEl.classList.add('show');
    return;
  }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Mise à jour…';

  const { error } = await sb.auth.updateUser({ password: pass });

  if(error){
    btn.disabled = false;
    btn.textContent = 'Valider le nouveau mot de passe →';
    errorEl.textContent = "Erreur : " + error.message;
    errorEl.classList.add('show');
    return;
  }

  document.getElementById('formFields').innerHTML = '<p style="color:var(--green);font-weight:700;font-size:14px;text-align:center;">✓ Mot de passe mis à jour !</p>';
  setTimeout(function(){ window.location.href = 'lecons-monnaie.html'; }, 1500);
}
</script>

  <a href="mentions-legales.html" style="color:var(--ink-muted);margin:0 10px;">Mentions légales</a>
  <a href="mentions-legales.html#confidentialite" style="color:var(--ink-muted);margin:0 10px;">Confidentialité</a>
  <a href="mentions-legales.html#cgv" style="color:var(--ink-muted);margin:0 10px;">CGV</a>
</div>

</body>
</html>
