<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Lab — Petites Actions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --ink:#16181D;--ink-soft:#383B42;--ink-muted:#6B6F76;--ink-faint:#9498A0;
  --bg:#FFFFFF;--bg-soft:#F7F8FA;--bg-mid:#EEF0F3;--bg-line:#E3E6EA;
  --green:#16A34A;--green-light:#22C55E;--green-pale:#EDFBF1;--green-bord:#BBF0CC;
  --amber:#F59E0B;--amber-pale:#FFF7E8;
  --violet:#7C5CFC;--violet-pale:#F1EEFE;
  --coral:#FB6B4F;--coral-pale:#FFEEEA;
  --sans:'Inter',system-ui,-apple-system,sans-serif;
}
body{font-family:var(--sans);background:var(--bg-soft);color:var(--ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;}
a{color:inherit;}
.nav{position:sticky;top:0;z-index:200;background:rgba(255,255,255,.96);backdrop-filter:blur(20px);border-bottom:1px solid var(--bg-line);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;font-weight:800;font-size:15px;color:var(--ink);}
.nav-mark{width:26px;height:26px;border-radius:8px;background:var(--violet);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;}
.nav-back{font-size:13px;font-weight:600;color:var(--ink-muted);text-decoration:none;}
.nav-balance{display:flex;align-items:center;gap:8px;background:var(--green-pale);border:1px solid var(--green-bord);border-radius:100px;padding:6px 14px;font-size:13px;font-weight:700;color:var(--green);}

.wrap{max-width:1180px;margin:0 auto;padding:28px 24px 80px;}
.hero-strip{background:var(--ink);border-radius:20px;padding:26px 30px;margin-bottom:28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:20px;}
.hero-left h1{font-size:19px;font-weight:800;color:#fff;letter-spacing:-.02em;margin-bottom:4px;}
.hero-left p{font-size:12.5px;color:rgba(255,255,255,.45);max-width:420px;line-height:1.5;}
.hero-stats{display:flex;gap:28px;}
.hstat{text-align:right;}
.hstat-label{font-size:10.5px;font-weight:600;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px;}
.hstat-value{font-size:22px;font-weight:800;color:#fff;letter-spacing:-.02em;}
.hstat-value.pos{color:var(--green-light);}
.hstat-value.neg{color:var(--coral);}

.layout{display:grid;grid-template-columns:1fr 340px;gap:22px;}
.section-title{font-size:14px;font-weight:800;letter-spacing:-.01em;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.section-title .dot{width:6px;height:6px;border-radius:50%;background:var(--violet);}

.assets-table{background:var(--bg);border:1px solid var(--bg-line);border-radius:16px;overflow:hidden;margin-bottom:26px;}
table{width:100%;border-collapse:collapse;}
th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-faint);padding:12px 16px;background:var(--bg-soft);border-bottom:1px solid var(--bg-line);}
td{padding:13px 16px;font-size:13px;color:var(--ink-soft);border-bottom:1px solid var(--bg-line);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.asset-name{display:flex;align-items:center;gap:10px;}
.asset-icon{width:28px;height:28px;border-radius:50%;background:var(--violet-pale);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--violet);}
.asset-symbol{font-weight:700;color:var(--ink);}
.asset-label{font-size:11.5px;color:var(--ink-faint);}
.price-cell{font-weight:700;color:var(--ink);}
.change-pos{color:var(--green);font-weight:700;}
.change-neg{color:var(--coral);font-weight:700;}
.trade-btn{background:var(--ink);color:#fff;border:none;cursor:pointer;font-family:var(--sans);font-size:12px;font-weight:700;padding:8px 16px;border-radius:9px;transition:background .2s;}
.trade-btn:hover{background:var(--ink-soft);}

.portfolio-card{background:var(--bg);border:1px solid var(--bg-line);border-radius:16px;padding:20px;margin-bottom:16px;}
.pos-item{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--bg-line);}
.pos-item:last-child{border-bottom:none;}
.pos-symbol{font-size:13px;font-weight:700;color:var(--ink);}
.pos-qty{font-size:11px;color:var(--ink-faint);}
.pos-value{font-size:13px;font-weight:700;text-align:right;}
.empty-state{text-align:center;padding:30px 10px;color:var(--ink-faint);font-size:12.5px;}

.orders-card{background:var(--bg);border:1px solid var(--bg-line);border-radius:16px;padding:20px;}
.order-item{padding:9px 0;border-bottom:1px solid var(--bg-line);font-size:12px;}
.order-item:last-child{border-bottom:none;}
.order-side{font-weight:800;font-size:10.5px;padding:2px 7px;border-radius:5px;margin-right:6px;}
.order-side.buy{background:var(--green-pale);color:var(--green);}
.order-side.sell{background:var(--coral-pale);color:var(--coral);}
.order-time{color:var(--ink-faint);font-size:10.5px;}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.show{display:flex;}
.modal{background:var(--bg);border-radius:20px;padding:28px;max-width:380px;width:100%;}
.modal-title{font-size:17px;font-weight:800;margin-bottom:4px;}
.modal-sub{font-size:12.5px;color:var(--ink-muted);margin-bottom:20px;}
.modal-tabs{display:flex;gap:8px;margin-bottom:18px;}
.modal-tab{flex:1;text-align:center;padding:9px;border-radius:9px;font-size:12.5px;font-weight:700;cursor:pointer;background:var(--bg-soft);color:var(--ink-muted);}
.modal-tab.active.buy{background:var(--green);color:#fff;}
.modal-tab.active.sell{background:var(--coral);color:#fff;}
.modal-field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;color:var(--ink-muted);margin-bottom:6px;}
.modal-field input{width:100%;background:var(--bg-soft);border:1.5px solid var(--bg-line);border-radius:10px;padding:11px 13px;font-family:var(--sans);font-size:15px;font-weight:600;color:var(--ink);outline:none;margin-bottom:12px;}
.modal-summary{background:var(--bg-soft);border-radius:10px;padding:12px 14px;font-size:12.5px;color:var(--ink-muted);margin-bottom:16px;line-height:1.7;}
.modal-summary strong{color:var(--ink);}
.modal-submit{width:100%;background:var(--ink);color:#fff;border:none;cursor:pointer;font-family:var(--sans);font-size:14px;font-weight:700;padding:13px;border-radius:11px;margin-bottom:10px;}
.modal-cancel{width:100%;background:transparent;color:var(--ink-faint);border:none;cursor:pointer;font-family:var(--sans);font-size:12.5px;font-weight:600;padding:6px;}
.modal-error{font-size:11.5px;color:var(--coral);margin-bottom:10px;display:none;}
.modal-error.show{display:block;}

.loading{text-align:center;padding:60px;color:var(--ink-faint);font-size:14px;}

@media(max-width:860px){
  .layout{grid-template-columns:1fr;}
  .hero-stats{gap:16px;}
  .assets-table{overflow-x:auto;}
}
</style>
</head>
<body>

<nav class="nav">
  <a href="index.html" class="nav-logo">
    <span class="nav-mark">📈</span>
    Trading Lab
  </a>
  <a href="index.html" class="nav-back">← Retour à Petites Actions</a>
  <span class="nav-balance" id="navBalance">💰 Chargement…</span>
</nav>

<div class="wrap" id="app">
  <div class="loading">Chargement du Trading Lab…</div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-title" id="modalAssetName">Trader BTC</div>
    <div class="modal-sub" id="modalPrice">Prix actuel : —</div>
    <div class="modal-tabs">
      <div class="modal-tab buy active" id="tabBuy" onclick="setSide('buy')">Acheter</div>
      <div class="modal-tab sell" id="tabSell" onclick="setSide('sell')">Vendre</div>
    </div>
    <div class="modal-field">
      <label>Quantité</label>
      <input type="number" id="modalQty" placeholder="0.00" step="any" oninput="updateModalSummary()" />
    </div>
    <div class="modal-summary" id="modalSummary">Entre une quantité pour voir le récapitulatif.</div>
    <div class="modal-error" id="modalError">Fonds insuffisants ou quantité invalide.</div>
    <button class="modal-submit" id="modalSubmit" onclick="submitOrder()">Confirmer l'achat</button>
    <button class="modal-cancel" onclick="closeModal()">Annuler</button>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://pchkshpbzsybvtwxqvrf.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBjaGtzaHBienN5YnZ0d3hxdnJmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5NDgwMTAsImV4cCI6MjEwMTUyNDAxMH0.3EqyBUDmHHJ79mdDD6dmpVwsuEA0h2hF-75Up9R2Snc';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Actifs disponibles au trading (ids CoinGecko)
const ASSETS = [
  {id:'bitcoin', symbol:'BTC', label:'Bitcoin'},
  {id:'ethereum', symbol:'ETH', label:'Ethereum'},
  {id:'solana', symbol:'SOL', label:'Solana'},
  {id:'binancecoin', symbol:'BNB', label:'BNB'},
  {id:'ripple', symbol:'XRP', label:'XRP'},
  {id:'cardano', symbol:'ADA', label:'Cardano'},
  {id:'dogecoin', symbol:'DOGE', label:'Dogecoin'},
  {id:'chainlink', symbol:'LINK', label:'Chainlink'},
];

let CURRENT_USER = null;
let PRICES = {};      // { bitcoin: {price: 65000, change24h: 2.3}, ... }
let PORTFOLIO = null; // { cash_balance }
let POSITIONS = [];
let ORDERS = [];
let modalAsset = null;
let modalSide = 'buy';

async function fetchPrices(){
  const ids = ASSETS.map(a => a.id).join(',');
  const res = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=usd&include_24hr_change=true`);
  const data = await res.json();
  const prices = {};
  ASSETS.forEach(a => {
    if(data[a.id]){
      prices[a.id] = { price: data[a.id].usd, change24h: data[a.id].usd_24h_change || 0 };
    }
  });
  return prices;
}

function fmt(n, decimals){
  decimals = decimals === undefined ? 2 : decimals;
  return Number(n).toLocaleString('fr-FR', {minimumFractionDigits: decimals, maximumFractionDigits: decimals});
}

function portfolioValue(){
  let total = PORTFOLIO ? Number(PORTFOLIO.cash_balance) : 0;
  POSITIONS.forEach(p => {
    const price = PRICES[p.asset_id] ? PRICES[p.asset_id].price : 0;
    total += Number(p.quantity) * price;
  });
  return total;
}

function renderApp(){
  const app = document.getElementById('app');
  const totalValue = portfolioValue();
  const pnl = totalValue - 10000;
  const pnlPct = (pnl / 10000) * 100;

  document.getElementById('navBalance').textContent = '💰 ' + fmt(PORTFOLIO.cash_balance, 0) + ' PA-Coins';

  const assetRows = ASSETS.map(a => {
    const p = PRICES[a.id];
    if(!p) return '';
    const changeClass = p.change24h >= 0 ? 'change-pos' : 'change-neg';
    const changeSign = p.change24h >= 0 ? '+' : '';
    return `<tr>
      <td><div class="asset-name"><div class="asset-icon">${a.symbol.slice(0,2)}</div><div><div class="asset-symbol">${a.symbol}</div><div class="asset-label">${a.label}</div></div></div></td>
      <td class="price-cell">$${fmt(p.price)}</td>
      <td class="${changeClass}">${changeSign}${fmt(p.change24h)}%</td>
      <td><button class="trade-btn" onclick="openModal('${a.id}')">Trader</button></td>
    </tr>`;
  }).join('');

  const posRows = POSITIONS.filter(p => Number(p.quantity) > 0).map(p => {
    const asset = ASSETS.find(a => a.id === p.asset_id);
    const price = PRICES[p.asset_id] ? PRICES[p.asset_id].price : 0;
    const value = Number(p.quantity) * price;
    const costBasis = Number(p.quantity) * Number(p.avg_buy_price);
    const gain = value - costBasis;
    const gainClass = gain >= 0 ? 'change-pos' : 'change-neg';
    return `<div class="pos-item">
      <div><div class="pos-symbol">${asset ? asset.symbol : p.asset_symbol}</div><div class="pos-qty">${fmt(p.quantity, 4)} unités</div></div>
      <div class="pos-value">$${fmt(value)}<div class="${gainClass}" style="font-size:11px;">${gain>=0?'+':''}${fmt(gain)}</div></div>
    </div>`;
  }).join('') || '<div class="empty-state">Aucune position ouverte.<br>Achète ton premier actif !</div>';

  const orderRows = ORDERS.slice(0, 8).map(o => {
    const time = new Date(o.created_at).toLocaleString('fr-FR', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    return `<div class="order-item">
      <span class="order-side ${o.side}">${o.side === 'buy' ? 'ACHAT' : 'VENTE'}</span>
      ${fmt(o.quantity, 4)} ${o.asset_symbol} à $${fmt(o.price)}
      <div class="order-time">${time}</div>
    </div>`;
  }).join('') || '<div class="empty-state">Aucun ordre passé pour le moment.</div>';

  app.innerHTML = `
    <div class="hero-strip">
      <div class="hero-left">
        <h1>Trading Lab</h1>
        <p>Monnaie fictive, prix de marché réels. Apprends à investir sans aucun risque financier.</p>
      </div>
      <div class="hero-stats">
        <div class="hstat"><div class="hstat-label">Valeur totale</div><div class="hstat-value">$${fmt(totalValue)}</div></div>
        <div class="hstat"><div class="hstat-label">Performance</div><div class="hstat-value ${pnl>=0?'pos':'neg'}">${pnl>=0?'+':''}${fmt(pnlPct)}%</div></div>
      </div>
    </div>

    <div class="layout">
      <div>
        <div class="section-title"><span class="dot"></span>Marché crypto en direct</div>
        <div class="assets-table">
          <table>
            <thead><tr><th>Actif</th><th>Prix</th><th>24h</th><th></th></tr></thead>
            <tbody>${assetRows}</tbody>
          </table>
        </div>

        <div class="section-title"><span class="dot"></span>Historique des ordres</div>
        <div class="orders-card">${orderRows}</div>
      </div>

      <div>
        <div class="section-title"><span class="dot"></span>Mon portefeuille</div>
        <div class="portfolio-card">
          <div class="pos-item"><div class="pos-symbol">💵 Liquidités</div><div class="pos-value">$${fmt(PORTFOLIO.cash_balance)}</div></div>
          ${posRows}
        </div>
      </div>
    </div>
  `;
}

function openModal(assetId){
  modalAsset = ASSETS.find(a => a.id === assetId);
  modalSide = 'buy';
  document.getElementById('modalAssetName').textContent = 'Trader ' + modalAsset.symbol;
  const price = PRICES[assetId] ? PRICES[assetId].price : 0;
  document.getElementById('modalPrice').textContent = 'Prix actuel : $' + fmt(price);
  document.getElementById('modalQty').value = '';
  document.getElementById('modalError').classList.remove('show');
  setSide('buy');
  document.getElementById('modalOverlay').classList.add('show');
}
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('show');
}
function setSide(side){
  modalSide = side;
  document.getElementById('tabBuy').classList.toggle('active', side==='buy');
  document.getElementById('tabSell').classList.toggle('active', side==='sell');
  document.getElementById('modalSubmit').textContent = side === 'buy' ? "Confirmer l'achat" : "Confirmer la vente";
  document.getElementById('modalSubmit').style.background = side === 'buy' ? 'var(--ink)' : 'var(--coral)';
  updateModalSummary();
}
function updateModalSummary(){
  const qty = parseFloat(document.getElementById('modalQty').value) || 0;
  const price = PRICES[modalAsset.id] ? PRICES[modalAsset.id].price : 0;
  const total = qty * price;
  const pos = POSITIONS.find(p => p.asset_id === modalAsset.id);
  const owned = pos ? Number(pos.quantity) : 0;

  let summary = `Quantité × Prix = <strong>$${fmt(total)}</strong><br>`;
  if(modalSide === 'buy'){
    summary += `Liquidités disponibles : <strong>$${fmt(PORTFOLIO.cash_balance)}</strong>`;
  } else {
    summary += `Détenu actuellement : <strong>${fmt(owned, 4)} ${modalAsset.symbol}</strong>`;
  }
  document.getElementById('modalSummary').innerHTML = summary;
}

async function submitOrder(){
  const qty = parseFloat(document.getElementById('modalQty').value);
  const errorEl = document.getElementById('modalError');
  errorEl.classList.remove('show');

  if(!qty || qty <= 0){
    errorEl.textContent = 'Entre une quantité valide.';
    errorEl.classList.add('show');
    return;
  }

  const price = PRICES[modalAsset.id].price;
  const total = qty * price;

  if(modalSide === 'buy'){
    if(total > Number(PORTFOLIO.cash_balance)){
      errorEl.textContent = 'Fonds insuffisants pour cet achat.';
      errorEl.classList.add('show');
      return;
    }
    PORTFOLIO.cash_balance = Number(PORTFOLIO.cash_balance) - total;
    let pos = POSITIONS.find(p => p.asset_id === modalAsset.id);
    if(pos){
      const newQty = Number(pos.quantity) + qty;
      const newAvg = ((Number(pos.quantity) * Number(pos.avg_buy_price)) + total) / newQty;
      pos.quantity = newQty;
      pos.avg_buy_price = newAvg;
    } else {
      pos = { user_id: CURRENT_USER.id, asset_id: modalAsset.id, asset_symbol: modalAsset.symbol, quantity: qty, avg_buy_price: price };
      POSITIONS.push(pos);
    }
    await sb.from('trading_positions').upsert(pos, { onConflict: 'user_id,asset_id' });
  } else {
    let pos = POSITIONS.find(p => p.asset_id === modalAsset.id);
    const owned = pos ? Number(pos.quantity) : 0;
    if(qty > owned){
      errorEl.textContent = 'Tu ne possèdes pas cette quantité.';
      errorEl.classList.add('show');
      return;
    }
    PORTFOLIO.cash_balance = Number(PORTFOLIO.cash_balance) + total;
    pos.quantity = owned - qty;
    await sb.from('trading_positions').upsert(pos, { onConflict: 'user_id,asset_id' });
  }

  await sb.from('trading_portfolios').update({ cash_balance: PORTFOLIO.cash_balance }).eq('user_id', CURRENT_USER.id);

  const order = {
    user_id: CURRENT_USER.id,
    asset_id: modalAsset.id,
    asset_symbol: modalAsset.symbol,
    side: modalSide,
    quantity: qty,
    price: price,
    total: total
  };
  await sb.from('trading_orders').insert(order);
  order.created_at = new Date().toISOString();
  ORDERS.unshift(order);

  closeModal();
  renderApp();
}

async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){
    window.location.href = 'connexion.html?redirect=trading-lab.html';
    return;
  }
  CURRENT_USER = session.user;

  const [{ data: portfolio }, { data: positions }, { data: orders }, prices] = await Promise.all([
    sb.from('trading_portfolios').select('*').eq('user_id', CURRENT_USER.id).single(),
    sb.from('trading_positions').select('*').eq('user_id', CURRENT_USER.id),
    sb.from('trading_orders').select('*').eq('user_id', CURRENT_USER.id).order('created_at', {ascending:false}).limit(20),
    fetchPrices()
  ]);

  PORTFOLIO = portfolio || { cash_balance: 10000 };
  POSITIONS = positions || [];
  ORDERS = orders || [];
  PRICES = prices;

  renderApp();

  // Rafraîchit les prix toutes les 30 secondes
  setInterval(async function(){
    PRICES = await fetchPrices();
    renderApp();
  }, 30000);
}

boot();
</script>
</body>
</html>
