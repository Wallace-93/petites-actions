<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

.wrap{max-width:1180px;margin:0 auto;padding:28px 24px 80px;}
.hero-strip{background:var(--ink);border-radius:20px;padding:26px 30px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:20px;}

.hero-stats{display:flex;gap:28px;}
.hstat{text-align:right;}

.hstat-value{font-size:22px;font-weight:800;color:#fff;letter-spacing:-.02em;}
.hstat-value.pos{color:var(--green-light);}

.price-warning{background:#fff8e6;border:1px solid #f0d38a;color:#7a5a00;border-radius:12px;padding:12px 16px;margin-bottom:18px;font-size:13px;line-height:1.55;}
.perf-card{background:var(--bg);border:1px solid var(--bg-line);border-radius:16px;padding:20px 22px;margin-bottom:22px;}
.perf-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.perf-title{font-size:14px;font-weight:800;}
.perf-note{font-size:11px;color:var(--ink-faint);}
.perf-chart-wrap{height:180px;position:relative;}
.perf-empty{text-align:center;padding:40px 10px;color:var(--ink-faint);font-size:12.5px;line-height:1.6;}

.layout{display:grid;grid-template-columns:1fr 340px;gap:22px;}
.section-title{font-size:14px;font-weight:800;letter-spacing:-.01em;margin-bottom:14px;display:flex;align-items:center;gap:8px;}

.chart-range-tab{font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:7px;background:var(--bg-soft);color:var(--ink-muted);cursor:pointer;}

.modal-tab{flex:1;text-align:center;padding:9px;border-radius:9px;font-size:12.5px;font-weight:700;cursor:pointer;background:var(--bg-soft);color:var(--ink-muted);}

.modal-tab.active.sell{background:var(--coral);color:#fff;}
.modal-field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;color:var(--ink-muted);margin-bottom:6px;}
.modal-field input{width:100%;background:var(--bg-soft);border:1.5px solid var(--bg-line);border-radius:10px;padding:11px 13px;font-family:var(--sans);font-size:15px;font-weight:600;color:var(--ink);outline:none;margin-bottom:12px;}
.modal-summary{background:var(--bg-soft);border-radius:10px;padding:12px 14px;font-size:12.5px;color:var(--ink-muted);margin-bottom:16px;line-height:1.7;}

.modal-cancel{width:100%;background:transparent;color:var(--ink-faint);border:none;cursor:pointer;font-family:var(--sans);font-size:12.5px;font-weight:600;padding:6px;}
.modal-error{font-size:11.5px;color:var(--coral);margin-bottom:10px;display:none;}
.modal-error.show{display:block;}

.loading{text-align:center;padding:60px;color:var(--ink-faint);font-size:14px;}

@media(max-width:860px){
  .layout{grid-template-columns:1fr;}
  .hero-stats{gap:16px;}

<script>
const SUPABASE_URL = 'https://pchkshpbzsybvtwxqvrf.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBjaGtzaHBienN5YnZ0d3hxdnJmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5NDgwMTAsImV4cCI6MjEwMTUyNDAxMH0.3EqyBUDmHHJ79mdDD6dmpVwsuEA0h2hF-75Up9R2Snc';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const DEFAULT_CAPITAL = 10000;

const ASSETS = [
  {id:'bitcoin', symbol:'BTC', label:'Bitcoin'},
  {id:'ethereum', symbol:'ETH', label:'Ethereum'},
  {id:'solana', symbol:'SOL', label:'Solana'},
  {id:'binancecoin', symbol:'BNB', label:'BNB'},
  {id:'ripple', symbol:'XRP', label:'XRP'},
  {id:'cardano', symbol:'ADA', label:'Cardano'},
  {id:'dogecoin', symbol:'DOGE', label:'Dogecoin'},
  {id:'chainlink', symbol:'LINK', label:'Chainlink'},
];

let CURRENT_USER = null;
let PRICES = {};
let PORTFOLIO = null;
let POSITIONS = [];
let ORDERS = [];
let SNAPSHOTS = [];
let modalAsset = null;
let modalSide = 'buy';
let perfChartInstance = null;
let PRICES_STALE = false;
let PRICE_ERROR = false;
let assetChartInstance = null;

const PRICE_CACHE_KEY = 'pa_trading_prices_v1';

function readPriceCache(){
  try {
    const raw = localStorage.getItem(PRICE_CACHE_KEY);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(!parsed || !parsed.prices || !parsed.at) return null;
    return parsed;
  } catch(e){ return null; }
}

function writePriceCache(prices){
  try { localStorage.setItem(PRICE_CACHE_KEY, JSON.stringify({ at: Date.now(), prices: prices })); } catch(e){}
}

/* Renvoie toujours un objet de prix exploitable.
   En cas d'echec reseau ou de quota API, on retombe sur le dernier cache connu
   et on marque les prix comme perimes plutot que de laisser des prix a zero
   fausser toute la valorisation. */
async function fetchPrices(){
  const ids = ASSETS.map(a => a.id).join(',');
  const url = `https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=usd&include_24hr_change=true`;

  for(let attempt = 0; attempt < 2; attempt++){
    try {
      const res = await fetch(url);
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const prices = {};
      ASSETS.forEach(a => {
        if(data[a.id] && typeof data[a.id].usd === 'number'){
          prices[a.id] = { price: data[a.id].usd, change24h: data[a.id].usd_24h_change || 0 };
        }
      });
      if(Object.keys(prices).length === 0) throw new Error('reponse vide');
      writePriceCache(prices);
      PRICES_STALE = false;
      return prices;
    } catch(err){
      console.warn('Cours indisponibles (tentative ' + (attempt + 1) + ') :', err.message);
      if(attempt === 0) await new Promise(r => setTimeout(r, 1500));
    }
  }

  const cached = readPriceCache();
  PRICES_STALE = true;
  return cached ? cached.prices : {};
}

async function fetchAssetHistory(assetId, days){
  const res = await fetch(`https://api.coingecko.com/api/v3/coins/${assetId}/market_chart?vs_currency=usd&days=${days}`);
  const data = await res.json();
  return (data.prices || []).map(p => ({ t: p[0], v: p[1] }));
}

function fmt(n, decimals){
  decimals = decimals === undefined ? 2 : decimals;
  return Number(n).toLocaleString('fr-FR', {minimumFractionDigits: decimals, maximumFractionDigits: decimals});
}

function cashBalance(){
  const c = PORTFOLIO ? Number(PORTFOLIO.cash_balance) : NaN;
  return Number.isFinite(c) ? c : 0;
}

/* Capital de depart reel du compte : sert de reference pour la performance.
   On ne code plus 10000 en dur, sinon toute modification du capital initial
   fausse le pourcentage affiche. */
function initialCapital(){
  const c = PORTFOLIO ? Number(PORTFOLIO.initial_capital) : NaN;
  return Number.isFinite(c) && c > 0 ? c : DEFAULT_CAPITAL;
}

/* La valorisation n'a de sens que si TOUTES les positions detenues ont un prix.
   Sans ce garde-fou, un actif sans prix est compte a 0 et la performance
   affiche une perte massive qui n'existe pas. */
function valuationReliable(){
  if(PRICES_STALE) return false;
  return POSITIONS.every(p => Number(p.quantity) <= 0 || (PRICES[p.asset_id] && Number.isFinite(PRICES[p.asset_id].price)));
}

function portfolioValue(){
  let total = cashBalance();
  POSITIONS.forEach(p => {
    const qty = Number(p.quantity);
    if(!Number.isFinite(qty) || qty <= 0) return;
    const entry = PRICES[p.asset_id];
    const price = entry && Number.isFinite(entry.price) ? entry.price : 0;
    total += qty * price;
  });
  return Number.isFinite(total) ? total : cashBalance();
}

/* ============ STATISTIQUES DE TRADING ============ */
function computeStats(){
  const sellOrders = ORDERS.filter(o => o.side === 'sell' && o.realized_pnl !== null && o.realized_pnl !== undefined);
  const wins = sellOrders.filter(o => Number(o.realized_pnl) > 0);
  const losses = sellOrders.filter(o => Number(o.realized_pnl) <= 0);
  const winRate = sellOrders.length > 0 ? Math.round((wins.length / sellOrders.length) * 100) : null;
  const totalRealizedPnl = sellOrders.reduce((sum, o) => sum + Number(o.realized_pnl), 0);
  const avgWin = wins.length > 0 ? wins.reduce((s,o)=>s+Number(o.realized_pnl),0) / wins.length : 0;
  const avgLoss = losses.length > 0 ? losses.reduce((s,o)=>s+Number(o.realized_pnl),0) / losses.length : 0;
  const bestTrade = sellOrders.length > 0 ? Math.max(...sellOrders.map(o=>Number(o.realized_pnl))) : null;
  const worstTrade = sellOrders.length > 0 ? Math.min(...sellOrders.map(o=>Number(o.realized_pnl))) : null;

  const assetCounts = {};
  ORDERS.forEach(o => { assetCounts[o.asset_symbol] = (assetCounts[o.asset_symbol]||0) + 1; });
  let mostTraded = null, maxCount = 0;
  Object.keys(assetCounts).forEach(k => { if(assetCounts[k] > maxCount){ maxCount = assetCounts[k]; mostTraded = k; } });

  const activePositions = POSITIONS.filter(p => Number(p.quantity) > 0);
  const totalVal = portfolioValue();
  let maxConcentration = 0, concentratedAsset = null;
  activePositions.forEach(p => {
    const price = PRICES[p.asset_id] ? PRICES[p.asset_id].price : 0;
    const val = Number(p.quantity) * price;
    const pct = totalVal > 0 ? (val / totalVal) * 100 : 0;
    if(pct > maxConcentration){ maxConcentration = pct; concentratedAsset = p.asset_symbol; }
  });

  return {
    totalTrades: ORDERS.length,
    winRate, totalRealizedPnl, avgWin, avgLoss, bestTrade, worstTrade,
    mostTraded, diversification: activePositions.length,
    maxConcentration, concentratedAsset
  };
}

function generateTips(stats){
  const tips = [];
  if(stats.totalTrades === 0){
    tips.push("Tu n'as pas encore passé d'ordre. Commence petit : observe un actif quelques jours avant ton premier achat.");
  }
  if(stats.totalTrades > 15 && stats.winRate !== null && stats.winRate < 40){
    tips.push("Ton taux de réussite est bas avec beaucoup de trades. Trader souvent n'améliore pas les résultats : la recherche montre l'inverse. Ralentis et prends plus de temps entre chaque décision.");
  }
  if(stats.maxConcentration > 70 && stats.concentratedAsset){
    tips.push(`${Math.round(stats.maxConcentration)}% de ton portefeuille est concentré sur ${stats.concentratedAsset}. Une forte concentration amplifie les gains… et les pertes. Diversifier réduit le risque global.`);
  }
  if(stats.diversification === 0 && stats.totalTrades > 0){
    tips.push("Tu as tout revendu. C'est parfois pertinent, mais vérifie que ce n'est pas une réaction à une baisse temporaire plutôt qu'une vraie décision réfléchie.");
  }
  if(stats.winRate !== null && stats.winRate >= 60){
    tips.push("Bon taux de réussite. Attention cependant : sur un petit nombre de trades, la chance joue un rôle important. Continue à observer tes résultats sur la durée.");
  }
  if(stats.avgLoss !== 0 && stats.avgWin !== 0 && Math.abs(stats.avgLoss) > stats.avgWin){
    tips.push("Tes pertes moyennes sont plus grandes que tes gains moyens. C'est souvent le signe qu'on coupe trop tard ses pertes, ou trop tôt ses gains.");
  }
  if(tips.length === 0){
    tips.push("Continue à trader avec méthode pour débloquer des conseils personnalisés basés sur ton historique.");
  }
  return tips.slice(0, 4);
}

/* ============ RENDU ============ */
function renderApp(){
  const app = document.getElementById('app');
  const totalValue = portfolioValue();
  const baseline = initialCapital();
  const reliable = valuationReliable();
  const pnl = totalValue - baseline;
  const pnlPct = baseline > 0 ? (pnl / baseline) * 100 : 0;
  const stats = computeStats();
  const tips = generateTips(stats);

  document.getElementById('navBalance').textContent = '💰 ' + fmt(cashBalance(), 0) + ' PA-Coins';

  const assetRows = ASSETS.map(a => {
    const p = PRICES[a.id];
    if(!p) return '';
    const changeClass = p.change24h >= 0 ? 'change-pos' : 'change-neg';
    const changeSign = p.change24h >= 0 ? '+' : '';
    return `<tr>
      <td><div class="asset-name" onclick="openModal('${a.id}')"><div class="asset-icon">${a.symbol.slice(0,2)}</div><div><div class="asset-symbol">${a.symbol}</div><div class="asset-label">${a.label}</div></div></div></td>
      <td class="price-cell">$${fmt(p.price)}</td>
      <td class="${changeClass}">${changeSign}${fmt(p.change24h)}%</td>
      <td><button class="trade-btn" onclick="openModal('${a.id}')">Trader</button></td>
    </tr>`;
  }).join('');

  const posRows = POSITIONS.filter(p => Number(p.quantity) > 0).map(p => {
    const asset = ASSETS.find(a => a.id === p.asset_id);
    const price = PRICES[p.asset_id] ? PRICES[p.asset_id].price : 0;
    const value = Number(p.quantity) * price;
    const costBasis = Number(p.quantity) * Number(p.avg_buy_price);
    const gain = value - costBasis;
    const gainClass = gain >= 0 ? 'change-pos' : 'change-neg';
    return `<div class="pos-item">
      <div><div class="pos-symbol">${asset ? asset.symbol : p.asset_symbol}</div><div class="pos-qty">${fmt(p.quantity, 4)} unités</div></div>
      <div class="pos-value">$${fmt(value)}<div class="${gainClass}" style="font-size:11px;">${gain>=0?'+':''}${fmt(gain)}</div></div>
    </div>`;
  }).join('') || '<div class="empty-state">Aucune position ouverte.<br>Achète ton premier actif !</div>';

  const orderRows = ORDERS.slice(0, 8).map(o => {
    const time = new Date(o.created_at).toLocaleString('fr-FR', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    const pnlHtml = (o.side === 'sell' && o.realized_pnl !== null && o.realized_pnl !== undefined)
      ? `<span class="order-pnl ${Number(o.realized_pnl)>=0?'change-pos':'change-neg'}">${Number(o.realized_pnl)>=0?'+':''}$${fmt(o.realized_pnl)}</span>` : '';
    return `<div class="order-item">
      <span class="order-side ${o.side}">${o.side === 'buy' ? 'ACHAT' : 'VENTE'}</span>
      ${fmt(o.quantity, 4)} ${o.asset_symbol} à $${fmt(o.price)} ${pnlHtml}
      <div class="order-time">${time}</div>
    </div>`;
  }).join('') || '<div class="empty-state">Aucun ordre passé pour le moment.</div>';

  const statsHtml = `
    <div class="stat-row"><span class="stat-label">Ordres passés</span><span class="stat-value">${stats.totalTrades}</span></div>
    <div class="stat-row"><span class="stat-label">Taux de réussite</span><span class="stat-value">${stats.winRate === null ? '—' : stats.winRate + '%'}</span></div>
    <div class="stat-row"><span class="stat-label">P&L réalisé</span><span class="stat-value ${stats.totalRealizedPnl>=0?'change-pos':'change-neg'}">${stats.totalRealizedPnl>=0?'+':''}$${fmt(stats.totalRealizedPnl)}</span></div>
    <div class="stat-row"><span class="stat-label">Meilleur trade</span><span class="stat-value">${stats.bestTrade===null?'—':'$'+fmt(stats.bestTrade)}</span></div>
    <div class="stat-row"><span class="stat-label">Pire trade</span><span class="stat-value">${stats.worstTrade===null?'—':'$'+fmt(stats.worstTrade)}</span></div>
    <div class="stat-row"><span class="stat-label">Actif le plus tradé</span><span class="stat-value">${stats.mostTraded || '—'}</span></div>
    <div class="stat-row"><span class="stat-label">Diversification</span><span class="stat-value">${stats.diversification} actif${stats.diversification>1?'s':''}</span></div>
  `;

  const tipsHtml = tips.map(t => `<div class="tip-item">💡 ${t}</div>`).join('');

  const priceBanner = reliable ? '' : `
    <div class="price-warning">
      ⚠️ Les cours du marché sont momentanément indisponibles${PRICES_STALE ? ' (limite de l\'API atteinte)' : ''}.
      Ta valorisation et ta performance sont masquées le temps que les prix reviennent — tes positions et tes liquidités, elles, sont bien enregistrées.
    </div>`;

  app.innerHTML = `
    ${priceBanner}
    <div class="hero-strip">
      <div class="hero-left">
        <h1>Trading Lab</h1>
        <p>Monnaie fictive, prix de marché réels. Apprends à investir sans aucun risque financier.</p>
      </div>
      <div class="hero-stats">
        <div class="hstat"><div class="hstat-label">Valeur totale</div><div class="hstat-value">${reliable ? '$' + fmt(totalValue) : '—'}</div></div>
        <div class="hstat"><div class="hstat-label">Performance</div><div class="hstat-value ${reliable ? (pnl>=0?'pos':'neg') : ''}">${reliable ? (pnl>=0?'+':'') + fmt(pnlPct) + '%' : '—'}</div></div>
      </div>
    </div>

    <div class="perf-card">
      <div class="perf-head">
        <div class="perf-title">📊 Performance de mon portefeuille</div>
        <div class="perf-note">${SNAPSHOTS.length} instantané${SNAPSHOTS.length>1?'s':''} enregistré${SNAPSHOTS.length>1?'s':''}</div>
      </div>
      <div class="perf-chart-wrap">
        ${SNAPSHOTS.length < 2 ? "<div class=\"perf-empty\">Ce graphique se construit à partir de vraies données, pas d'une simulation.<br>Reviens dans quelques jours et après quelques trades pour voir ta courbe se dessiner.</div>" : '<canvas id="perfChart"></canvas>'}
      </div>
    </div>

    <div class="layout">
      <div>
        <div class="section-title"><span class="dot"></span>Marché crypto en direct</div>
        <div class="assets-table">
          <table>
            <thead><tr><th>Actif</th><th>Prix</th><th>24h</th><th></th></tr></thead>
            <tbody>${assetRows}</tbody>
          </table>
        </div>

        <div class="section-title"><span class="dot"></span>Historique des ordres</div>
        <div class="orders-card">${orderRows}</div>

        <div class="edu-card">
          <div class="edu-title">🎓 Trading vs Investissement : quelle différence ?</div>
          <p class="edu-text">Le Trading Lab te fait manipuler des prix qui bougent vite. C'est utile pour comprendre les mécanismes de marché, mais ce n'est pas la stratégie enseignée dans les formations Petites Actions pour construire un vrai patrimoine.</p>
          <div class="edu-grid">
            <div class="edu-col trading">
              <h4>📉 Trading</h4>
              <p>Horizon court (heures à semaines). Cherche à profiter des variations de prix. Demande du temps, des nerfs solides, et statistiquement, la majorité des traders particuliers actifs perdent de l'argent sur le long terme.</p>
            </div>
            <div class="edu-col investing">
              <h4>📈 Investissement</h4>
              <p>Horizon long (années à décennies). Cherche à capter la création de valeur réelle des entreprises ou d'actifs rares. Demande de la régularité, pas d'expertise de marché quotidienne. C'est la base des Formations 3 et 4.</p>
            </div>
          </div>
          <a href="lecons-bourse.html" class="edu-link">Revoir la stratégie DCA en bourse →</a>
        </div>
      </div>

      <div>
        <div class="section-title"><span class="dot"></span>Mon portefeuille</div>
        <div class="portfolio-card">
          <div class="pos-item"><div class="pos-symbol">💵 Liquidités</div><div class="pos-value">$${fmt(cashBalance())}</div></div>
          ${posRows}
        </div>

        <div class="section-title"><span class="dot"></span>Mes statistiques</div>
        <div class="stats-card">${statsHtml}</div>

        <div class="tips-card">
          <div class="tips-title">💡 Conseils pour progresser</div>
          ${tipsHtml}
        </div>
      </div>
    </div>
  `;

  renderPerfChart();
}

function renderPerfChart(){
  if(SNAPSHOTS.length < 2) return;
  const canvas = document.getElementById('perfChart');
  if(!canvas) return;
  if(perfChartInstance) perfChartInstance.destroy();

  const labels = SNAPSHOTS.map(s => new Date(s.created_at).toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit'}));
  const data = SNAPSHOTS.map(s => Number(s.total_value));
  const isPositive = data[data.length-1] >= data[0];

  perfChartInstance = new Chart(canvas, {
    type: 'line',
    data: { labels, datasets: [{
      data,
      borderColor: isPositive ? '#1E4B3C' : '#A24332',
      backgroundColor: isPositive ? 'rgba(22,163,74,0.08)' : 'rgba(251,107,79,0.08)',
      borderWidth: 2, tension: 0.3, fill: true, pointRadius: 0, pointHoverRadius: 4
    }]},
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { display: false }, ticks: { font: { size: 10 }, color: '#96A3AA' } },
        y: { grid: { color: '#EFF0EA' }, ticks: { font: { size: 10 }, color: '#96A3AA', callback: v => '$'+v } }
      }
    }
  });
}

/* ============ MODAL TRADE + GRAPHIQUE ACTIF ============ */
function openModal(assetId){
  modalAsset = ASSETS.find(a => a.id === assetId);
  modalSide = 'buy';
  document.getElementById('modalAssetName').textContent = 'Trader ' + modalAsset.symbol;
  const price = PRICES[assetId] ? PRICES[assetId].price : 0;
  document.getElementById('modalPrice').textContent = 'Prix actuel : $' + fmt(price);
  document.getElementById('modalQty').value = '';
  document.getElementById('modalError').classList.remove('show');
  document.querySelectorAll('.chart-range-tab').forEach(t => t.classList.toggle('active', t.dataset.days === '30'));
  setSide('buy');
  document.getElementById('modalOverlay').classList.add('show');
  loadAssetChart(30);
}
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('show');
}
async function loadAssetChart(days){
  document.querySelectorAll('.chart-range-tab').forEach(t => t.classList.toggle('active', Number(t.dataset.days) === days));
  const canvas = document.getElementById('assetChart');
  if(assetChartInstance) assetChartInstance.destroy();
  try{
    const history = await fetchAssetHistory(modalAsset.id, days);
    const labels = history.map(p => {
      const d = new Date(p.t);
      return days <= 7 ? d.toLocaleDateString('fr-FR',{weekday:'short'}) : d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'});
    });
    const data = history.map(p => p.v);
    const isPositive = data.length > 0 && data[data.length-1] >= data[0];
    assetChartInstance = new Chart(canvas, {
      type: 'line',
      data: { labels, datasets: [{
        data, borderColor: isPositive ? '#1E4B3C' : '#A24332',
        backgroundColor: isPositive ? 'rgba(22,163,74,0.08)' : 'rgba(251,107,79,0.08)',
        borderWidth: 2, tension: 0.3, fill: true, pointRadius: 0
      }]},
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { display: false },
          y: { display: false }
        }
      }
    });
  } catch(e){
    console.error('Erreur chargement historique', e);
  }
}
function setSide(side){
  modalSide = side;
  document.getElementById('tabBuy').classList.toggle('active', side==='buy');
  document.getElementById('tabSell').classList.toggle('active', side==='sell');
  document.getElementById('modalSubmit').textContent = side === 'buy' ? "Confirmer l'achat" : "Confirmer la vente";
  document.getElementById('modalSubmit').style.background = side === 'buy' ? 'var(--ink)' : 'var(--coral)';
  updateModalSummary();
}
function updateModalSummary(){
  const qty = parseFloat(document.getElementById('modalQty').value) || 0;
  const price = PRICES[modalAsset.id] ? PRICES[modalAsset.id].price : 0;
  const total = qty * price;
  const pos = POSITIONS.find(p => p.asset_id === modalAsset.id);
  const owned = pos ? Number(pos.quantity) : 0;

  let summary = `Quantité × Prix = <strong>$${fmt(total)}</strong><br>`;
  if(modalSide === 'buy'){
    summary += `Liquidités disponibles : <strong>$${fmt(cashBalance())}</strong>`;
  } else {
    summary += `Détenu actuellement : <strong>${fmt(owned, 4)} ${modalAsset.symbol}</strong>`;
  }
  document.getElementById('modalSummary').innerHTML = summary;
}

/* ============ INSTANTANÉS DE PERFORMANCE ============ */
async function maybeTakeSnapshot(){
  /* Un instantane pris avec des prix incomplets pollue la courbe de facon
     definitive : on prefere sauter le point plutot que d'enregistrer un faux. */
  if(!valuationReliable()) return;

  const lastSnapshot = SNAPSHOTS[SNAPSHOTS.length - 1];
  const now = Date.now();
  const oneHour = 60 * 60 * 1000;
  if(lastSnapshot && (now - new Date(lastSnapshot.created_at).getTime()) < oneHour) return;

  const snap = { user_id: CURRENT_USER.id, total_value: portfolioValue(), cash_balance: cashBalance() };
  const { data, error } = await sb.from('trading_portfolio_snapshots').insert(snap).select().single();
  if(error){ console.error('Instantane non enregistre :', error.message); return; }
  if(data) SNAPSHOTS.push(data);
}

/* ============ PORTEFEUILLE ============ */
/* Les comptes crees avant l'existence du Trading Lab n'ont pas de ligne dans
   trading_portfolios. Sans cette fonction, .single() echoue silencieusement,
   le solde n'est jamais persiste et la performance repart de zero a chaque
   rechargement : c'est la cause principale du bug de calcul. */
async function ensurePortfolio(){
  const { data: existing, error } = await sb.from('trading_portfolios')
    .select('*').eq('user_id', CURRENT_USER.id).maybeSingle();

  if(error) console.error('Lecture du portefeuille impossible :', error.message);
  if(existing) return existing;

  const { data: created, error: insertError } = await sb.from('trading_portfolios')
    .insert({ user_id: CURRENT_USER.id, cash_balance: DEFAULT_CAPITAL })
    .select().single();

  if(insertError){
    console.error('Creation du portefeuille impossible :', insertError.message);
    return { user_id: CURRENT_USER.id, cash_balance: DEFAULT_CAPITAL };
  }
  return created;
}

/* ============ ORDRES ============ */
async function submitOrder(){
  const qty = parseFloat(document.getElementById('modalQty').value);
  const errorEl = document.getElementById('modalError');
  errorEl.classList.remove('show');

  if(!qty || qty <= 0){
    errorEl.textContent = 'Entre une quantité valide.';
    errorEl.classList.add('show');
    return;
  }

  const priceEntry = PRICES[modalAsset.id];
  if(!priceEntry || !Number.isFinite(priceEntry.price) || PRICES_STALE){
    errorEl.textContent = 'Cours indisponible pour cet actif. Réessaie dans quelques instants.';
    errorEl.classList.add('show');
    return;
  }
  const price = priceEntry.price;
  const total = qty * price;
  let realizedPnl = null;

  if(modalSide === 'buy'){
    if(total > cashBalance() + 1e-9){
      errorEl.textContent = 'Fonds insuffisants pour cet achat.';
      errorEl.classList.add('show');
      return;
    }
    PORTFOLIO.cash_balance = cashBalance() - total;
    let pos = POSITIONS.find(p => p.asset_id === modalAsset.id);
    if(pos){
      const newQty = Number(pos.quantity) + qty;
      const newAvg = ((Number(pos.quantity) * Number(pos.avg_buy_price)) + total) / newQty;
      pos.quantity = newQty;
      pos.avg_buy_price = newAvg;
    } else {
      pos = { user_id: CURRENT_USER.id, asset_id: modalAsset.id, asset_symbol: modalAsset.symbol, quantity: qty, avg_buy_price: price };
      POSITIONS.push(pos);
    }
    await sb.from('trading_positions').upsert(pos, { onConflict: 'user_id,asset_id' });
  } else {
    let pos = POSITIONS.find(p => p.asset_id === modalAsset.id);
    const owned = pos ? Number(pos.quantity) : 0;
    if(qty > owned){
      errorEl.textContent = 'Tu ne possèdes pas cette quantité.';
      errorEl.classList.add('show');
      return;
    }
    const avg = Number(pos.avg_buy_price);
    realizedPnl = Number.isFinite(avg) ? (price - avg) * qty : null;
    PORTFOLIO.cash_balance = cashBalance() + total;
    /* Arrondi defensif : sans cela un residu de type 1e-16 laisse une position
       fantome qui casse les statistiques et la diversification. */
    const remaining = owned - qty;
    pos.quantity = Math.abs(remaining) < 1e-10 ? 0 : remaining;
    await sb.from('trading_positions').upsert(pos, { onConflict: 'user_id,asset_id' });
    if(pos.quantity === 0){
      POSITIONS = POSITIONS.filter(x => x.asset_id !== pos.asset_id);
      await sb.from('trading_positions').delete().eq('user_id', CURRENT_USER.id).eq('asset_id', pos.asset_id);
    }
  }

  const { error: cashError } = await sb.from('trading_portfolios')
    .upsert({ user_id: CURRENT_USER.id, cash_balance: PORTFOLIO.cash_balance }, { onConflict: 'user_id' });
  if(cashError) console.error('Solde non enregistre :', cashError.message);

  const order = {
    user_id: CURRENT_USER.id, asset_id: modalAsset.id, asset_symbol: modalAsset.symbol,
    side: modalSide, quantity: qty, price: price, total: total, realized_pnl: realizedPnl
  };
  const { data: savedOrder } = await sb.from('trading_orders').insert(order).select().single();
  ORDERS.unshift(savedOrder || { ...order, created_at: new Date().toISOString() });

  await maybeTakeSnapshot();

  closeModal();
  renderApp();
}

async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){
    window.location.href = 'connexion.html?redirect=trading-lab.html';
    return;
  }
  CURRENT_USER = session.user;

  PORTFOLIO = await ensurePortfolio();

  const [{ data: positions }, { data: orders }, { data: snapshots }, prices] = await Promise.all([
    sb.from('trading_positions').select('*').eq('user_id', CURRENT_USER.id),
    sb.from('trading_orders').select('*').eq('user_id', CURRENT_USER.id).order('created_at', {ascending:false}).limit(30),
    sb.from('trading_portfolio_snapshots').select('*').eq('user_id', CURRENT_USER.id).order('created_at', {ascending:true}),
    fetchPrices()
  ]);

  POSITIONS = (positions || []).filter(p => Number(p.quantity) > 0);
  ORDERS = orders || [];
  SNAPSHOTS = snapshots || [];
  PRICES = prices;

  await maybeTakeSnapshot();
  renderApp();

  /* 60 s au lieu de 30 s, et pause quand l'onglet est en arriere-plan :
     l'API publique CoinGecko limite le nombre d'appels par minute et par IP,
     c'est la premiere cause de prix manquants. */
  setInterval(async function(){
    if(document.hidden) return;
    PRICES = await fetchPrices();
    renderApp();
  }, 60000);

  document.addEventListener('visibilitychange', async function(){
    if(!document.hidden && PRICES_STALE){
      PRICES = await fetchPrices();
      renderApp();
    }
  });
}

boot();
</script>
